      content: "【作者：BOX_天空战记001】\n『修正：韩天阳』\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n【声明】:\n此文未经本人许可,不得转载于其他论坛,网络媒体和平面杂志中\n\n\n          ★法师和法师技能全面分析★(2003.12.30)\n\n〓第一部分:暗灵巫师(法师)〓\n\n●法师就职条件:\n0转80以上即可\n{推荐}1转80以上（有高宠就容易，否则。。。。）\n\n●法师就职奖励:\n1.法师就职成功后会奖励你一套基本的法师装备,共5件,效果如下:\n\n蟒蛇之冠:防+15 气力+40 毒耐性+60 净化精灵(混乱)Lv2\n青蛇之杖:气力+40 混迷的精灵Lv4\n双头蛇之铠:防+40 回避率+6 气力+40 滋润的精灵Lv4[15]\n灵蛇扣带:会心一击率上升+6 气力+40\n响尾蛇之靴:敏+20 气力+40\n\n2.法师就职成功后会奖励你50MP上限,也就是说法师的MP上限由原本的100升为150!\n\n【法师装备总效果】:\n①防+55 敏+20 气力+200 毒耐性+60 回避率+6 会心一击率上升+6\n②净化精灵(混乱)Lv2(6/9),混迷的精灵Lv4(9/14),滋润的精Lv4(10/15)\n\n3.法师就职成功后会奖励你一点技能点数,你可以在暗灵法师公会(21.26)学技能,强烈建议学\"嗜血成性\"!这样法师会省下非常多的药钱!\n\n4.法师就职成功后会奖励你一次重新调整自己能力的机会!以前分配的点数留下20点在血点上,其余点数还原为未加状态!攻防上限为200点,血敏不限制!建议不加攻,多加敏!\n\n●法师最高有几级?法师如何升级?\n法师目前最高有22级.要让法师升级,就必须练技能!技能熟练度满70%了就会自动升1级,并送你1点技能点数让你学习其他技能!\n\n●技能熟练度没满70%也会升级,这是为什么?\n这是因为只要你学的技能全部熟练度加起来够70%了就会升级!如嗜血成性90%,冰箭术只需要再练到50%就会升级!\n\n\n〓第二部分:法师技能〓\n\n●法师技能有几个?是什么技能?学费多少?\n法师技能目前只开放15个技能,其中1级技能8个,2级技能7个!详细如下:\n\n⑴1级技能\n学习地点:暗灵法师公会(21.26)\n\n火山泉:以火焰喷泉烧伤敌人(1000)\n召雷术:呼唤落雷击向敌方(1000)\n冰箭术:射出冰箭伤害敌人(附加冰冻效果)(1000)\n嗜血成性:以自己的血液换取法力(1000)\n移形换位:利用地形闪躲攻击(1000)\n火附体:召唤火焰附在武器或防具上增强其效能(1000)\n雷附体:召唤雷电附在武器或防具上增强其效能(1000)\n冰附体:召唤冰雾附在武器或防具上增强其效能(1000)\n\n⑵2级技能\n学习地点:无名洞地下2楼(9.32)[地图30304]\n\n火星球:火球击中敌人之后漫延开来造成更大伤害(100000)\n暴风雨:藉由暴风雨的力量伤害敌人(100000)\n冰镜术:冰属性的明镜带来可怕的效果(100000)\n火熟练度:增加火系魔法攻击力(100000)\n冰熟练度:增加冰系魔法攻击力(100000)\n雷熟练度:增加雷系魔法攻击力(100000)\n嗜血蛊:施放蛊虫于敌方身上使其失血(100000)\n\n●法师技能实际效果如何?\n1.法师技能除了冰镜术和冰附体需要视对方的防敏而定外,其余技能只跟法师的熟练度有关!熟练度越高,效果就越强,同时费气也越多!\n2.法师的全部技能跟人物,宠物的属性都无关!也就是说法师打地属性的宠跟水属性的宠扣血一样多!\n3.法师的魔法抗性只有追猎者才能练!法师和白狼都没有抗性!追猎者的团队抗性只有在PK时才会施展给法师或白狼,PK结束,法师和白狼依旧没抗性!\n4.法师的魔法和魔法戒指的魔法是无关的!\n5.法师中沉默后依然可以放魔法!只有中睡眠,石化,冰冻后才不能放魔法!\n6.法师技能分两种\n㈠辅助功能:没有直接杀伤力,其中雷熟练度,冰熟练度,火熟练度会自然提升,无法直接修炼!\n㈡战斗功能:直接攻击的技能,其中雷附体,冰附体,火附体需对人物放才有效果,宠无效!\n\n这是我的20级法师\n\n下面为法师技能的实际效果和费气情况:(1360/1500)\n01.嗜血成性(100%)[辅助]---------------0:依HP而定,比例为10:6,即吸10分的HP补6分的MP!人和骑宠的扣血比例为3:7(MP:0)\n02.嗜血蛊(91%)[战斗功能]--------------9:先扣120血,每回合再扣40血!扣血5回合,因此中一次扣320血(MP:15)\n03.移形换位(91%)[辅助]----------------9:使用后6回合打不中,第7回合出手前还原(MP:50)\n04.冰箭术(99%)[战斗功能]--------------1:敏下降25%,冻住3回合,第4回合解冰,每次损血310左右(MP:20)\n05.冰镜术(92%)[战斗功能]--------------8:依对方的防而定!打1级乌力扣150,打黑暗精灵王扣1192!(MP:40)\n06.冰附体(96%)[战斗功能]--------------4:中了降敏,依对方的敏而定!效果2回合!雷龙降2%,精灵王降98%(MP:50)\n07.冰熟练度(94%)[辅助]----------------6:熟练度无法测试(MP:0)\n08.召雷术(94%)[战斗功能]--------------6:扣血355(MP:30)\n09.暴风雨(88%)[战斗功能]--------------12:攻击全体,扣血230(MP:70)\n10.雷附体(92%)[战斗功能]--------------8:中了麻痹!效果2回合!被打麻痹效果消失!(MP:50)\n11.雷熟练度(74%)[辅助]----------------26:熟练度无法测试(MP:0)\n12.火山泉(96%)[战斗功能]--------------4:扣血230(MP:35)\n13.火星球(92%)[战斗功能]--------------8:攻击一排,扣血400(MP:50)\n14.火附体(96%)[战斗功能]--------------4:中了中毒,效果2回合!第一回合扣100,第二回合扣50,因此中一次附加扣150血(MP:50)\n15.火熟练度(65%)[辅助]----------------35:熟练度无法测试(MP:0)\nPS:㈠移形换位技能效果为直接间接攻击都打不中,但对精灵,合击,魔法均无效!施放的当回合还是会被打中\n㈡熟练度可以影响技能的强度,熟练度越高,效果越强!从技能的费气程度可以看出来!\n㈢冰熟练度,火熟练度,雷熟练度到底加强了多少很难算出来!\n㈣中了嗜血蛊和火附体攻击后,如果没血扣就直接死掉!\n\n●法师要学世界末日需要哪些技能?\n我们分析一下这张法师技能限制图:\n\n学世界末日前提为:火龙枪,冰暴术,电流术和附身术4技(4)\n学火龙枪的前提为:火山泉,火星球和火附体3技(7)\n学冰暴术的前提为:冰箭术,冰镜术和冰附体3技(10)\n学电流术的前提为:召雷术,暴风雨和雷附体3技(13)\n学附身术的前提为:火附体,冰附体,雷附体和移形换位4技(14)\n\n因此学世界末日的前提必须学14个技能!加上世界末日就15个技能,法师一共16个技能,最后一个学嗜血成性!\n\n●法师22级不是有22个技能吗?那不是所有的技能都可以学?\n法师22级是有22个技能点数,但是不是所有的技能都可以学就不清楚了!因为法师的技能并没有全部开放!目前可以学到的只有15个技能!建议全部学!\n\n●为什么我火星球都80%了而火熟练度还是10%?\n要先用火附体练火熟练度!再练其他火系魔法时火熟练度就会自动提升了!\n\n●为什么我学雷系的暴风雨会提升冰熟练度而不是雷熟练度?\n\n这个是事实,但为什么会如此,我也不清楚!\n\n●如何修练法师技能?\n法师的技能除了暴风雨需要2人合作外,其余的技能都可以自己一个人修炼!\n\n现在只介绍最简单最有效的方法:打百人道场\n\n1.不骑宠也不带宠,装备为自动加血装备(或水魔)\n自动加血装备有:海蓝装,洛克亚装,华义装,凯亚装,迪克装没附加效果\nPS:如果没有加血装或水魔,就靠精灵补血\n2.下载有快速战斗的外挂!目前阿贝和万宇都有!\n3.去萨村百人道场或加加百人道场打第一个弟子\n4.人物首次动作和一般动作均设为魔法打自己!\nPS:\n㈠放心,魔法打自己是不会扣血的,但有效!嗜血成性是不会挂掉自己的!因此可以放心挂!1级的百人弟子打自己是不痛也不痒!\n㈡暴风雨需要2个ID快速PK对练!陪练的ID建议血600以上,有没有就职无所谓!\n\n●为什么我放水属性加强再放冰系魔法,对火宠并无加强伤害效果?\n因为属性乐器对技能魔法并无加强作用!技能魔法和装备魔法并无关联!\n\n●为什么对方睡眠了我用魔法打他,他也醒不了?\n呵呵,恭喜你,这就是就职法师的好处啊!PK,做任务非常有用!\n\n●法师技能的学习顺序是什么?\n其实没有什么顺序的,有的只是一般看法!\n嗜血成性--→冰箭术--→冰镜术--→移形换位--→随便\n\n\n"
