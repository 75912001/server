      content: "条件：\n1、76级以上，已完成成人任务。\n2、10万石币。\n\n任务流程：\n1、来加加村长家门前(94、60）和霍奇斯说话，接任务，他会给你一支手电\n筒。\n2、从(99、63）进入水井地下通道，一直往前走，在（27，5）进入水井地下\n洞窟，再往前走，来到（30，49）和庄董说一大段话，交出手电筒，拿到一\n张加加村旅游指南。\n3、拿到加加村旅游指南后，前往加加便利店（107，111），在便利店内会\n遇到女人宠艾蜜，打败艾蜜可得到乌鲁力村旅游指南。\n4、拿到乌鲁力村旅游指南后，前往乌鲁力村（南岛549，746），在乌鲁力\n村来到（48，65）进入肉店，在肉店内会再遇到女人宠艾蜜，打败艾蜜可得\n到柯奥海底隧道通行指南。\n5、拿到柯奥海底隧道通行指南后，前往柯奥村（北岛473，630），在柯奥\n村（437，630）进入柯奥海底隧道，来到柯奥海底隧道地下2楼会再遇到女\n人宠艾蜜，打败艾蜜可得到玛丽娜丝庄园旅游指南。\n6、拿到玛丽娜丝庄园旅游指南后，前往玛丽娜丝村庄园（北岛71，589）\n，在庄园会再遇到女人宠艾蜜，可用猛毒武器把艾蜜毒为1血，然后捉起艾\n密。\n7、捉到艾密后，回加加村，再次进入水井地下洞窑，和庄董说话，交出艾\n蜜，拿到布伊比的牙齿。\n8、前往达那村，来到（343，191）进入五兄弟的山洞，一直往上走到4楼，\n会遇到男人宠雷诛，可用猛毒武器把雷诛毒为1血，然后捉起雷诛。\n9、捉到雷诛后，回加加村，再次进入水井地下洞窑，和庄董说话，交出雷\n诛，拿到一张借据。\n10、前往福村，走到（247，223）,进入石头洞穴，走出石头洞，来到小象\n区，会遇到新的男人宠讦谯龙，打败讦谯龙可得到讦谯龙给庄董的信。\n11、拿到讦谯龙给庄董的信后，回加加村，再次进入水井地下洞窑，和庄\n董说话，庄董会问你拿2万石币，你就可拿到收据。\n12、拿到收据后，再次前往福村，走到（247，223）,进入石头洞穴，走出\n石头洞，来到小象区，会再遇到讦谯龙，可用猛毒武器把雷诛毒为1血，然\n后捉起讦谯龙，并交出收据，再不能捉到讦谯龙了。\n13、捉到讦谯龙后，回加加村，再次进入水井地下洞窑，和庄董说话，交\n出讦谯龙，庄董会随机送你一瓶改点酒。\n\n改点酒分四种，分别有以下功能（注意要修改的点如不够10点千万别用，\n会浪费的）：\n\n白兰地　　腕力10点重新分配\n伏特加　　敏捷力10点重新分配\n威士忌　　体力10点重新分配\n高梁酒　　耐力10点重新分配\n\n\n◇特别感谢作者：微笑赢家对万宇在线大力支持◇"
