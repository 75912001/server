      content: "－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n必须条件：需成人礼\n\n1.先到达那村长家找达那村长说话，并接受精灵仪式\n\n2.到拉多拉洞窟(502，648)，从回廊进去(200，37)\n\n3.上到最上面拿到羽毛，总共有四组坐标\n\n4.拿到羽毛后，就前往深红洞窟，前往深红的步骤如下\n\n5.从福村往往漆黑的洞(247，223)先到北吉鲁\n\n6.然后到到象洞下方(274，149)，进入北吉鲁山领地下信道\n\n7.出来到吉鲁岛(289，175)\n\n8.然后再到巴那姆洞窟入口(295，260)\n\n9.之后走进深红最顶楼与女神说话\n\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n(非必要)\n到巴拿姆洞后，跟\"巴拿姆湖的看守人\"说密语：\n[授与追求火的人从此地涌出的水的润泽]\n拿到巴拿姆壶，再到外面加入\"巴拿姆湖的带路人\"并说\"go\"\n就会带领你到老人那此时也需说一句密语：[很多]\n取得\"装满水的巴拿姆湖 水量7/7\"，然后就往深红出发\n路上会出现\"口渴的多洛加\"(随机出现)此时喂他水(巴拿姆壶 水量剩2/7)\n此时别再喂第二只，切记！！\n并叫你跟旁边的换礼物(有人换到毒雾lv3枪)\n若你西拿姆壶的水都喂光的话，伊拉会说感觉不到你对火的热情，叫你走\n这里听说是最多元的礼物换区，可换到Ｂ２，镜(-5)，光(-15)，等等ㄉ\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－"
