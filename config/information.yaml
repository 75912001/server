      content: "－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n必须条件：需先成人礼，等级65\n\n1.此任务需先解完玄黄洞窟或琉璃洞窟才可接任务\n\n2.先到南岛的奇喀喀村(139，1007)的便利店后面找个女的接任务\n\n3.然后再到碧青洞窟(73，697)顶楼跟女神说话(坐标)\n\n4.然后她叫你去拿深蓝色的石头和群青之水\n\n5.群青之水在奇努伊海底隧道的沙姆往福村这一段\n\n6.中间下面的地方有一个新的洞窟(8，51)\n\n7.进去后找到一个女的(27，32)，就可拿到群青之水\n\n8.深蓝色的石头先到吉鲁洞窟(248，221)的3F\n\n9.在此遇敌就可打到深蓝色的石头了\n\n10.然后在把水跟石头拿回碧青15F后方洞窟(26，13)\n\n11.此为水苍洞窟，然后下到8F找老人说话得到碧青水\n\n12.然后拿回15F女神那，得到水的戒指 (征服水的证据)\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n(非必要)\n13.水苍之贝：在碧清十四Ｆ蓝暴后面以及洞窟入口之间遇敌，运气好者可拿到水苍之贝。\n(据说邦奇在中间带头的比较有可能遇的到)\n\n14.水苍之贝可用来跟水之使者换礼物\n　(听说皆是等级１０的精灵武器喔.@_@)\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
