      content: " ┌───────────────────────────────-┐\n │ 6.0新任务--(蛇之铠)                                           │\n │                                                               │\n │ 任务地点：南岛乌鲁力村（５４９．７４５）                      │\n │                                                               │\n │ 适合等级：50级以上                                            │\n │                                                               │\n │ 一  请前往村内座标(68.56)找\"莫西克\"说话接取任务。             │\n │ 二  他会要玩家帮忙收集蛇身上的鳞片接着会给你一颗\"唤蛇之石\"，  │\n │ 有了唤蛇之石後就继续前往龙之巢穴(433.742)打蛇鳞。             │\n │ 三  玩家拿着唤蛇之石在龙洞内遇敌，打死蛇随机会得到蛇之鳞。    │\n │                                                               │\n │ 一楼会遇到LV50卡恩格登得到地蛇之鳞                            │\n │ 前往二楼(12.4)会遇到LV50卡恩米兹得到水蛇之鳞                  │\n │ 前往叁楼(5.40)会遇到LV50卡恩法尔得到火蛇之鳞                  │\n │ 前往四楼(37.4)会遇到LV50卡恩修比得到风蛇之鳞                  │\n │                                                               │\n │ 四  收集到4种蛇之鳞後回到乌鲁力村连同唤蛇之石交给莫西克，他为 │\n │ 了报答你会将4种鳞片做成蛇之铠送给玩家。                       │\n │                                                               │\n │ 任务奖品：蛇之铠（防＋３７敏－１０滋润３）                    │\n │                                                               │\n └───────────────────────────────-┘"
