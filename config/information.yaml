      content: "◎任务条件：完成思念故乡的贝克任务（当然完成此任务也要完成其他很多的任务了！）\n◎任务奖品：健康手环或智慧手环等……（目前已知的奖品有这些，但是根据官方的说法，任务分支还有很多，这个就需要玩家慢慢研究了。。）\n◎任务流程：\nstep1：首先进入瑞尔亚斯之都的（20，55）进入民房，跟“妮提希斯”接任务并答应她的请求，得知妮提希斯的眼睛被刺伤失明，其母又哑了，希望治疗好母亲。然后跟“年迈的母亲”对话，得知其不是妮提希斯的生母，其生母已在3年前去世，她只是受村里人所拖来照顾她而已，所以不能说话，之后“年迈的母亲”让玩家寻找治疗失明的药物，然后她就会向妮提希斯坦白。\n\nstep2：之后来到50年前的波拉岛找塔利姆。她会在碑前面，共13碑。我们需要找素材弄香火。神木（风庄有卖），硬的皮（萨村有卖），火焰草（未知）。\n附：塔利姆出现的13个坐标：\n（227.294）（230.247）（553.464）（547.565）（547.674）（453.652）（376.633）（321.628）（321.502）（524.616）（79.455）（421.540）（333.363）\nstep3：再去找塔利姆，交出神木，硬的皮，火焰草，拿到慰灵香火。\n\nstep4：来到现代波拉岛（找有着星点绿光的石碑，石碑位置跟塔塔利姆出现的一样），对者石碑说“哈鲁的精灵请赐给我力量”，之后交出慰灵香火，拿到“精灵印”，重复以上步骤，反复拿“精灵印”，不同的是精灵名字的不同。反复拿香，然后再去祈祷，得到13个不同的“精灵印”。\n\n附：13个精灵印的叫法：\n“哈鲁的精灵请赐给我力量”    ——精灵印－精灵哈鲁的守护，治愈的力量\n“美丽尼亚的精灵请赐给我力量”——精灵印－精灵美丽尼亚的守护，镜的力量\n“提欧的精灵请赐给我力量”    ——精灵印－精灵提欧的守护，恩惠的力量\n“西鲁菲雅的精灵请赐给我力量”——精灵印－精灵西鲁菲雅的守护，高等净化的力量\n“芙雷雅的精灵请赐给我力量”  ——精灵印－精灵芙雷雅的守护，滋润的力量\n“美鲁菲的精灵请赐给我力量”  ——精灵印－精灵美鲁菲的守护，净化毒的力量\n“爱鲁菲的精灵请赐给我力量”  ——精灵印－精灵爱鲁菲的守护，净化石化的力量\n“渥鲁菲的精灵请赐给我力量”  ——精灵印－精灵渥鲁菲的守护，净化酒醉的力量\n“所鲁菲的精灵请赐给我力量”  ——精灵印－精灵所鲁菲的守护，净化混乱的力量\n“米鲁菲的精灵请赐给我力量”  ——精灵印－精灵米鲁菲的守护，净化睡的力量\n“柯雅拉的精灵请赐给我力量”  ——精灵印－精灵柯雅拉的守护，复活的力量\n“威鲁的精灵请赐给我力量”    ——精灵印－精灵威鲁的守护，守护的力量\n“阿西美拉的精灵请赐给我力量”——精灵印－精灵阿西美拉的守护，光的力量\n\nstep5：得到13个精灵印后去找“塔利姆”，得知我们要把精灵们的守护带给有需要的人。\n\nstep6:\n分支一：回去瑞尔亚斯之都的（20，55）进入民房，跟“妮提希斯”交任务，得到物品 “健康手环”体力+40，魅力+5\n分支二：回去瑞尔亚斯之都的（20，55）进入民房，跟“年迈的母亲”交任务，得到物品 “智慧手环”气力+40，魅力+5\n（根据GM的回答，这个任务的分支N多，奖品我想应该不止这么少的，期待中……）\n"
