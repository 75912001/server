      content: "一、在火城从（13，71）出火城进入弗烈顿城区，往左下走，从（140，179\n）的走廊走。\n二、经过弯弯曲曲的走廊，来到（10，370）进入伊甸大陆北方。\n三、在伊甸大陆北方，也经过一段弯弯曲曲的路来到（385，154）进入火山\n道场通道。\n四、在火山道场通道，走到（35,54)进入火山道场。\n五、在火山道场，走到（34，76)进入火山道场柜台。\n六、在火山道场柜台，走到（17，9）和辛克莱尔说话，从旁边的洞进入火\n山道场第一层。\n七、打20层，和20队火精灵。建议组队打，火精灵攻太高了，打法自由发挥\n。我感觉用水宠，风宠（反）放镜容易打过。\n八、打过20层后来到21层和国王说话，拿到忠诚之心。\n九、再从后面的门走进到（29，16）和莎拉曼达说话，拿到LV3魔法戒指。\n\n◇特别感谢作者：微笑赢家、雨季◇\n"
