      content: "作者：MX_韩天阳\n－－－－－－－－－－－－－－－－－－－－－－－－－－\n大家不要为了找不到人去打4界和小柯烦恼了，这里教你如何自己单挑4界和小柯！\n前提要求：\n◎4种抗性均80以上\n◎法师技能必须学习\n『移形换位』（最少90％）\n『嗜血成性』（应该99％）\n『火星球』（90％以上）\n『冰镜』（95％以上）\n『冰熟练度』（90％以上）\n『火熟练度』（90％以上）\n◎人物敏越高越好\n◎带宠物\n1.骑宠（首选转红暴）\n2.战宠\n--带一只撕裂2的金暴\n--剩下的带N只120水雷，忠犬\n◎道具：\n1.带少量气\n2.装备回避+10耳环\n3.萨首饰或月光手镯（复活用）\n4.装备一个石化5的武器，带一个毒雾5的武器\n－－－－－－－－－－－－－－－－－－－－－－－－－－\n战斗篇：\n\n来到4界的第一个界----『地之界』，到BOSS面前后开始战斗，放雷，忠犬，人物移形。这样保证了你人物只会被魔法打到或者被合击到！魔法顶多打你50血，雷一直忠犬，注意补充血就可以了！人物使用石化，然后用火星球慢慢KO，注意移形和补血就可以了！\n\n『水之界』\n这个BOSS就是血多，防御和攻击都比地的差多了！魔法才打30多血，按照上面的方法，不用几下就KO了！\n\n『火之界』\n这里就要很注意了，这个BOSS攻击BT死，只要中了就KO，所以首次宠物忠犬，人物移形。然后人物就一直石化。等差不多都中了的时候，慢慢的火星球把，注意移形和补血！还有，如果他们大面积醒来的时候，赶快石化一次，就可挽救！\n\n『风之界』\n这个就是敏高，其他的都好办，石化后基本上100％中，有个快速过法，就是全部石化后，人物先火星球，宠物上去撕裂2，很块的哦！\n\n『暗之界』\n这里没有敌人，只有虚空之界难点。。。。。。\n按照我的方法保证你过去：\n把外挂快速走路关闭\n运行脚本\n这里因为MX的暗之界脚本有个BUG，到某个坐标就不能自动走了，所以需要按照资料手动一下，这个需要耐心，慢慢来！\n\n『最后小岛』\n马上就要打小柯了，心情激动啊！\n首次当然还是移形，不过可以说首次这个雷必死！精灵王一个魔法就打200多血，所以如果移形完毕还有血（因为你带了回避耳饰，应该不太容易中）就石化他们，只要把小柯石化了，危险就驱除一半了，如果再把火守护石化，那就没危险了！然后火星球+撕裂2打火守护，冰镜+撕裂2打小柯！\n其他的按照以前的打法即可！\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－"
