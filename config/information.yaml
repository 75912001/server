      content: "这个里奥真的是粉爱捉迷藏，逢人就会问：你要跟我捉迷藏吗？嘻嘻^^反正闲来无事，就跟他好好的玩一下吧！北岛我这么熟，就不相信我找不到你，注意喔！里奥委会给你一个重要的凭证（对他而言很重要啦），那就是“里奥的愿藏娃娃”，所以千万不要搞丢了。这个愿藏娃娃会记录你找到里奥的次数，总共要找到里奥十次，他就会送给你一些宝物。\n\n这个里奥还真会躲，只要是北岛，就可能会有他的踪迹，里奥他躲藏的地点正确来讲共有15个地点，而且他是照着顺序下去躲藏的，如果照着顺序下去找寻，应该不难找到。\n\n里奥.1【卡坦村外左边的河旁】(起始站)=215,93\n里奥.2【霍特尔村向下的小猪岛=581,333\n里奥.3【萨村内的酒保上方】=126,64\n里奥.4【盗贼洞窟上方】=454,121\n里奥.5【萨村庄园后.1】=656,629\n里奥.6【萨村庄园后.2】=665,602\n里奥.7【霍特尔村.崖壁】=536,119\n里奥.8【渔村公车站】=117,640\n里奥.9【小猪岛入口桥前的树旁】=562,358\n里奥.10【柯尔克村内】=35,62\n里奥.11【玄黄小岛】=348,344\n里奥.12【阿布洞前.1】=154,384\n里奥.13【萨村与渔村的中央通道向右】=416,476\n里奥.14【萨村庄园后右方的岬之家】=651,687\n里奥.15【阿布洞前.2】(终点站.想再次做回卡坦村外河边215,93)=167,399\n\n里奥躲藏的地点还真是千奇百怪，最远的要算是柯尔克村了吧（在洞窟又没办法不遇敌，戴月神吧），他躲藏的地方是按照顺序的，也就是说，要是在卡坦村外遇到他，那下一个地点就是小猪岛入口前，以此类推，到了第15个点后，他又会跑回第1个地点躲藏，如此反复下去。不过，严格算起来，里奥根本就没有躲嘛，他就是呆呆地站在那里，等着大家来跟他捉迷藏，大概是在石器时代里小朋友不多吧，所以他只好每天捉迷藏玩了……。\n\n找到里奥十次之后，开心的他就会送给玩家东西，基本上，他会送一个道具或素材和一只宠物。\n\n任务奖品：\n物品（道具或素材）\n灵木的叶（叶的成份8）\n强的绳（线的成份8）\n魔术笔（油性）\n上等的黏土（黏土的成份8）\n出水草 （回复的成份8） 相当于滋3\n追灯草 （复活的成份6）\n硬的壳 （壳的成分7）\n最坚实的线（线的成份11） 　　宠物（LV1）\n石龟\n卡拉宝斯\n卡克尔\n鲁尼帖斯\n姆伊\n\n基本上奖品的宠物和物品是随机给的，而且机率是一样的，也就是说组合总共有8X5=40种，相信大家发现其中最有价值的东西莫过于出水草、追灯草、最坚实的线了吧，喜欢合成的玩家千万别错过和里奥捉迷藏的机会哦。\n\n小秘诀1：里奥在每一个星球都会出现，出现的地点也就是那15个，所以当你一个地方发现他时，不妨使用原地登出，到每一个星球找他那小小的身影，就能够快速地完成任务啦。\n\n小秘诀2：里奥出现的地方大都在北岛的平原或沙漠中，只要去吉鲁岛的福尔德村买一个太阳神守护，就可以完全不遇敌的在北岛上奔驰，加快捉迷藏的时间。\n"
