      content: "白狼勇士的“二刀流”技能全面分析 作者：BOX_天空战记001\n==================================================================\n●如何学习二刀流？\n要学习二刀流必须先学习“盾击”和“连环攻击”这2个技能且熟练度2个都必须达到70%才能学\n\n●学习二刀流有什么用？\n学习了二刀流就可以拿2把武器，除了不能和弓箭同时装备外，其余都可以装备！如下面的组合都可以\n\n组合1：枪+枪，枪+棒，枪+爪，枪+石头，枪+回旋标\n组合2：爪+爪，爪+枪，爪+石头，爪+回旋标\n组合3：石头+石头，石头+爪，石头+枪，石头+回旋标\n组合4：回旋标+石头，回旋标+枪，回旋标+爪，回旋标+回旋标\n\n●为什么每次登出左手武器都会被卸下来？\n这是事实，为什么会这样，我也不知道\n\n●那拿2把武器在外形上如何显示？\n很可惜，拿2把武器并不能在人物身上显示2把武器，只显示右手拿的武器！\n\n●青蛇之杖，巨熊匕首，双头叉，巨熊石剑算什么武器？\n青蛇之杖和巨熊匕首算棍棒\n双头叉和巨熊石剑算枪\n\n●拿2把武器的攻击力如何计算？\n拿2把武器的攻击力的公式为：\nZ=X+Y*A%\nZ为2把武器的总攻击力\nX为右手的攻击力\nY为左手的攻击力\nA%为二刀流的熟练度\n\n●A%如何得知？\n二刀流熟练度在10%时，A=20\n二刀流熟练度在91%时，A=50\n\n拿2把焰红之斧3的攻击力为\nZ=195+195*50%=293，不是390\n\n●拿2把武器如何攻击？\n攻击方式以右手武器为准！如带了爪和石头，以爪为准，带了石头和爪，以石头为准！\n\n●如何练二刀流熟练度？\n如果想快速的练二刀流熟练度的话，建议右手带“海贼王的左手”左手带“巨熊匕首”或加血装的武器如“海蓝之棒”再戴力击之戒，在小猪岛原地挂小猪。这样就非常快了！\n\n●我练二刀流时，如果拿了枪和棒，是不是会同时提升2种武器熟练度？\n这是不可能的！练二刀流只会提升右手的熟练度！左手熟练度不会提升！\n\n●我左手拿吉岩枪，为什么敏只减2，而且没有精灵？\n因为左手的效果是算全部效果的！\n吉岩枪：攻+44 敏-10实际上在二刀流只有10%熟练度的情况下是攻+9，敏-2，左手的精灵是无效的！这是二刀流的设定"
