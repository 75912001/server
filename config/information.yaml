      content: "作者：微笑赢家、多多\n条件：\n1、已成人\n2、90级以上\n3、完成金飞航空任务\n4、身上带着不可思议的贝\n\n一、前往水城\n\n进入水城方法：\n\n1、从伊甸园（10，120）出伊甸园；\n2、一直走到（34．214），进骨头拱门；\n3、进人祷个西方沙漠洞穴内信道，再走到（0，38）会进入西方沙漠洞\n穴外信道；\n4、在西方沙漠洞穴外信道往前走，走到（0．7）就会出来伊甸大陆西方；\n5、在伊甸大陆西方，一直走到（389．389），进入尼克斯城区；\n6、在尼克斯城区，走到（390．14），会到伊甸大陆南方，\n7、在伊甸大陆南方，走到（9．48），进尼克斯城区；\n8、在尼克斯城区，走到（372．248）过桥，走到（341．74）再过桥，走\n到（264．115）又过桥，走到（219．136）再次过桥，走到（219．200）\n过桥就到达水城。\n\n二、接任务\n\n在水城前往（103．25）和队长邬莉叶说话，接任务。\n\n三、做水城记录\n\n在水城外遇敌，打到莫拉斯的肉，到水城（18，47）旅店，进旅店和（8，\n11）的芙雅说话，记录在水城。\n\n三、打巴克\n\n走回伊甸动物园（30，96），或用毛飞回鱼村，搭飞机前往伊甸动物园（\n30，96），走到(41,5)和巴克说话，进仓库在（7，12）和打巴克说话，和\n巴克开战，打赢巴克之后，有两种可能：\n\n1、巴克在你面前，你跟他说话，他会给你lv1的莫拉斯（小水怪）。\n2、巴克不在你面前，这样是你倒霉，在你之前已有人拿走lv1的莫拉斯（\n小水怪）了。\n打过巴克不见巴克，拿不到lv1的莫拉斯的解决方法：\n\n原地登其它星，再打巴克，打到巴克在你面前为至，如打完全部星都没有，\n那你只能等回档或维护后第一时间打去打巴克，因只有回档或维护后只第\n一个人打巴克才能见到他。\n\n注：无论打巴克是打死或打飞，只要他在你面前就能拿到双头叉的。\n\n四、把莫拉斯交回水怪，拿绿蛙。\n\n在水城，来到（97,25）和NPC说话，会传到地下水道洞穴，请按以下坐标\n走下8楼：\n\n地下1楼　下27，46\n地下2楼　上27，46　下42，03\n地下3楼　上42，03　下42，24\n地下4楼　上42，24　下42，45\n地下5楼　上42，45　下56，46\n地下6楼　上56，46　下56，08\n地下7楼　上56，08　下55，16\n地下8楼　上23，17\n\n走上8楼，和大水怪（18,13)说话，交出lv1莫拉斯，拿到绿蛙。\n\n五，拿双头叉，完成任务\n\n登出，回到水城旅店，前往水城的（103,25)和队长邬莉叶说话，邬莉叶会\n感谢你，送你一只双头叉（滋润5)。\n\n六、新增水怪任务完美路线（小水怪、绿蛙、双头叉全拿路线，本路线已\n经玩家证实）\n\n接第四点，拿绿蛙后，再回伊甸动物打巴克，再拿到小水怪，最后才回去\n找队长邬莉叶说话，拿双头叉，这样小水怪、绿蛙、双头叉就可全拿了。\n\n（全文完）\n\n在此特别感谢:：多多、萱萱、冰天使，阿里巴巴、阿健天使、\n巴巫、皮皮、雪上加霜、￡炫霓￡、爽朗、魔力豆豆、反骨仔-靓、angel、\n铃 铛　、巴丹杏、够绘、大石牌兄弟热心帮助，感谢的金色时代、浪人部\n落、天若有情家族的支持!\n最令我感动的是阿里巴巴和冰天使对我的支持，帮我打猩猩，帮我打花10，\n帮我找里拉拉，帮我找石头，我深深向他俩致谢!\n\n还有多多、萱萱，一起陪伴著我完成全部3.0的任务,谢谢！"
