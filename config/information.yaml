      content: "石器时代7.5-精灵的传说\n\n石器时代历经了「家族开拓史」、「精灵王传说」、「伊甸新大陆」、「宠物进化史」、「石头就业所」后伊甸大陆已开启许久，地水火风城开启已久也拥有各自守护精灵的任务！伊甸大陆的主线内容～魔族！为了延续魔族往后的发展势必将原始世界中的勇者和四大精灵给除掉。自从魔界缺口产生后，许多的魔界生物在伊甸的四周游走，其中一部份的魔界生物，在四大城的周围建立起他们的巢穴，专门培养他们的实力。勇者们即将讨伐艾巴登，然而艾巴登的力量到底多大，仍然是个未知数。玛蕾菲雅全新的宠物力量之谜？勇者转生的最终型态？究极技能？隐藏在追猎者身上的强大力量？魔界的入侵，雷尔的圈套，艾巴登的强大。\n\n都将在石器时代《精灵的召唤》中得到答案。\n\n石器时代《精灵的召唤》中将会有一个全新的游戏方式，使玩家的互动也变成游戏内容中的一环，透过精灵召唤系统，创造「新手带老手」的玩法，解决老手不带新手的问题。玩家在游戏中升级或调整点数时发生精灵使者召唤的条件，精灵将会经由「召唤(Call)」任命你为「精灵使者」并且给予两件道具，分别为「精灵信物」、「勇者信物」，请你找寻勇者并且完成所交付的任务。在装备「精灵信物」后则会变成「精灵使者」，使用「勇者信物」后精灵将会自动将 精灵使者传送到具有勇者资格的玩家身旁。在交付「勇者信物」给具有资格的玩家后，玩家只要使用信物即变成勇者，并且在成为勇者后精灵将会告知勇者所需达成的任务和条件，当达成后精灵使者和勇者皆可换取到价值非凡的宝物。\n\n石器时代《精灵的召唤》除了在玩法外，另外就是针对石器时代以往众多版本间的故事加以串连和交代，并且贯穿整个伊甸大陆，在故事性上以伊甸大陆主线开始到破坏让魔物入侵的魔界之门，整个描绘出原始世界的壮阔和气息，在《精灵的召唤》中原始人们会和众精灵有非常密集的互动，包含宠物2转之谜，以及最终极的人物六转之谜都需要玩家们抽丝剥茧的一一找寻答案。而《精灵的召唤》也把经由宠物2转的机制，让石器时代原始的一代宠物有进化的能力强到足以抗衡二、三代宠。而宠物融合和职业技能，也将决定是否能将来自魔界的魔物击退的要素。\n\n石器时代中「追猎者」这个职业，在之前一直无法重要的地位存在，在技能方面也因为实用性不佳而被玩家给遗忘了，但是在《精灵的召唤》除了各职业间的平衡调整外，另外也针对「追猎者」的存在做了一个大幅度的调整。「追猎者」在《精灵的召唤》中，所扮演的地位将大幅提升！由于新技能「自然威能」、「号召自然」和「属性结界」的开放，在整个战斗中就有如一个超级后援单位。例如「号召自然」技能，可以召号大自然的力量，将大自然的力量转成补ＨＰ的功用，再将所号召自然的力量，平均分配给各个玩 家。就连对魔法的抗性都因为本身的大自然力量而有所差异，加上全体性的「属性结界」更是对抗「白狼勇士」的利器，其地位将成为战斗中不可缺一的角色。另外在职业的四阶技能也将会陆续开放。「闇灵法师」在四阶的「世界末日」相对开放外，也针对目前的法术过强进行调整，超强的法术需要较多回合的聚气时间，且法术也有命中率的调整。\n\n以往石器时代的家族庄园系统，庄园战一直在石器时代中是最具代表性，藉由约战机制，各家族可以进行家族间的攻防战，藉由占领庄园进行家族的税收。庄园功能开设已久，但是家族庄园的功能却无法妥善的运用并且造成许多强势家族有独占的趋势，更由于约战的弊端造成有约定轮替契约的产生。目前庄园的功能，除了特殊技能的开放提供玩家学习之外另外也收受玩家买卖特殊素材，而整个庄园功能上嫌不足，难以使玩家有重视庄园环境以及功能。在《精灵的召唤》中有一个大幅度个更动，家族气势的产生、约战的方式和条件、庄园战斗周期、庄园战后的利益等等都针对上述有所改变。\n\n各位原始人们你是否准备好接受新的挑战了呢？让我们迈步前进伊甸大陆吧。"
