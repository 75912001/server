      content: "●谈属性与级高练功地\n（作者要留名字就联系下我，QQ52337794，验证，天天网游）\n\n  现在主要有几个练功地点，在下面写出来：(按地水火风属性排列)\n\n1.库塔伊洞窟(140雷区)\n\n  怪物属性：嘎吱拉(花色的雷)水5火5(3楼的会火魔法)哥斯哥斯地8风\n\n2.蒙哥拉斯地5风5\n\n  怪物等级：125级左右-140级\n\n  怪物能力：功中防高敏低血高14**-15**\n\n  推荐程度：到以下的属性再说。要根据属性而定\n\n2.英雄岛海边怪物属性：雷龙(布林帖斯)：地3水7和一些鲨鱼、猪头鱼也是\n  地水较多~怪物等级：100级左右-120级(来这里一般都是挂120的水雷吧)\n\n  怪物能力：功低防200左右敏40左右血12**\n\n3.泪之海海底(指打过宫本蚊帐)\n\n  怪物属性：沙瓦*：地水属性特利斯克：水8火2奥特普：地9水1\n\n  怪物等级：120级-135级(还有190等等)\n\n　怪物能力：功高防中敏中血高~\n\n4.帕拉火洞窟\n\n　怪物属性：金暴(斑尼迪克)：火1风9和GP与扑满：风属性为主\n\n　怪物等级：125级左右-140级\n\n　怪物能力：功高防中敏高血中13**左右\n\n5.凯菈村\n\n　怪物属性：玛斯贝卡火5风5、布伊伦斯火3风7、蒙哥拉斯地5风5(陆地)\n  莱姆洛斯地6风4、砂鲨水2火8(水上或水边)\n\n　怪物等级：100级-125级左右\n\n　怪物能力：功中防中敏中血低9**-12**不等\n\n　高等级练功地点就这几个拉吧？有少的帮忙通知我啊~\n==================================================================\n　好，现在开始属性练功：\n\n　地属性人宠：(以下都指主体属性，主体属性指占7属性以上的属性)地克水\n  ，所以地属性的朋友们欢迎到120水雷区与140雷龙区挂机攻击高的可以单\n  挂水雷，但140雷最好组队挂，减少打住自己的几率~推荐地点：\n\n  1.120雷区练级速度：★★★★危险度：★\n\n  2.140雷取练级速度：★★★★★危险度：★★\n\n  3.泪之海海底练级速度：★★★★★危险度：★★(为什么把它排第3呢？\n    因为在水里要呼吸，不呼吸就……而带草要费道具，没道具装气和果就\n    ……所以如果团挂最好有只水魔设置85%加血，这样就可以放心挂机了)\n\n　水属性人宠：\n\n　水克火，可没有火属性练功地点，所以水人比较开放，只要不克你都可以\n  去挂\n\n　最好低级不去挂140的雷，容易被飞掉，练到雷龙打你2**-3**就可以挂了\n  ，但有死的可能\n\n　推荐地点：\n\n　1.金暴洞练级速度：★★★★★危险度：★★★\n\n　2.凯菈村练级速度：★★★★危险度：★★\n\n　3.120雷区练级速度：★★★危险度：★★\n\n　该轮到火了，因为我火10所以深有感触~极力推荐去140金暴洞，骑上狗狗\n  的话~呵呵别让GM说你欺负金暴弟弟~火克风，所以练级地点较多\n\n　推荐地点：\n\n　1.金暴洞练级速度：★★★★★危险度：★★(虽然克人家，可金暴弟弟的\n    威力可是不能小看的，如果10只一起来个超级合计的话，你留下来的几\n    率大概有0。00001%)\n\n　2.凯菈村练级速度：★★★★危险度：★\n\n　3.140雷区练级速度：★★★★★危险度：★★★\n\n　风属性的人真是不太好过，如今带火的宠可以说太多了，所以很难过的安\n  稳，但也不会轻易被飞D~~\n\n　风克地，推荐到地雷区\n\n　推荐地点：\n\n　1.140雷区练级速度：★★★★★危险度：★\n\n　2.金暴洞练级速度：★★★★★危险度：★★★★\n\n　3.泪之海海底练级速度：★★★★★危险度：★★★★★\n\n　好了主属性就到这里，五五开的朋友到哪里都好挂，因为五五开最不被别\n  人克也不克别人，呵呵\n\n　千万别把自己弄成无属性(看请“无”)，根据一些资料，无属性会被所有\n  东西克，所以别图好玩而让自己……呵呵\n\n　就写到这里，这只是个人意见，而且也不是绝对的~比如你是水10有300的\n  防，去挂地雷也无妨~我写这些只是让大家练的更快些，有意见的别扔臭鸡\n  蛋啊~可能有点长，会费眼睛的，我谢谢大家了~"
