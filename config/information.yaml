      content: "『滋润3戒指』和『治愈3戒指或手镯』任务推荐\n作者：BOX_ｙｕｈｕａｓｈｉ\n修正：『韩天阳』\n==================================================================\n滋润3戒指，推荐：玄黄任务分支\n治愈3戒指或手镯，推荐：猜谜3兄弟任务\n\n猜谜3兄弟任务快是快，总是得到一堆8，9级的素材\n深红任务分支慢，不过得到治愈3的机会高些\n\n这里所说的玄黄任务和深红任务，只是为了得奖品的分支任务，只要进得了\n玄黄洞窟，深红洞窟，就可以做滋润3和治愈3得奖品.跟玄黄和深红转生无关\n\n■我所得到过奖品的任务（已验证）\n\n深红任务分支：\n哈鲁LV3的戒指（魅力+3 治愈的精灵LV3） 耗气11/100 耐久力回复320（自己）\n哈鲁LV3的手镯（攻+2 防-1 魅+2 治愈的精灵LV3） 耗气11/100 耐久力回复320（自己）\n迪欧Lv2的戒指（攻＋2，防－2，魅＋3）恩惠的精灵 Lv2\n\n\n不用等待加入『巴拿姆湖的带路人』，道路是可以顺移的\n多洛加出现地点：（2个地点就够了，可原地登出找其他服）\n                另一头的深红的洞窟地下５楼（31,34）\n                深红的洞窟地下８楼（29，69）\n\n\n猜谜3兄弟任务：\n哈鲁LV3的戒指（魅力+3 治愈的精灵LV3） 耗气11/100 耐久力回复320（自己）\n哈鲁LV3的手镯（攻+2 防-1 魅+2 治愈的精灵LV3） 耗气11/100 耐久力回复320（自己）\n\n\n玄黄任务分支：\n芙蕾美雅LV3的戒指（魅力+3 滋润的精灵LV3） 耗气16/100 耐久力回复260（单人）\n\n需要抓布鲁顿，福村外（351，342）一带\n\n\n■我未验证的任务：\n水田迷宫－切绳石\n碧清任务－水苍之贝\n=================================================================="
