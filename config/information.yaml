      content: "→〖脚本高手是这样练出来的〗←\n\n         　　　　　　 ┌────────────────────────────┐\n　　　　　　　　　　　│　　　　　　　　　【MX情报资料】    （版权信息）        │\n                    　├────────────────────────────┤\n　　　　　　　　　　　│◎【原创】：飞天御剑流                  　　　　　　　　│\n　　　　　　　　　　　│　　　　　　　　　　　　　　　　　　　　　　　　　　　　│\n　　　　　　　　　　　│◎【整理】：飞天御剑流         　　 　　　　　　　　　　│\n　　　　　　　　　　　│　　　　　　　　　　　　　　　　　　　　　　　　　　　　│\n　　　　　　　　　　　│◎【修订】：飞天御剑流　　　    　　　　　　　　　　　　│\n　　　　　　　　　　　│　　　　　　　　　　　　　　　　　　　　　　　　　　　　│\n　　　　　　　　　　　└────────────────────────────┘\n我自己开了一个文件夹，里面装满了关于脚本的记录，包括好多东西\n\n现在发一些上来给大家分享一下。\n“购买”指令使以后买东西极为快速稳定，类似封包的功能，实在是脚本使用者和制作者的一大福音。为祝贺“购买”指令的诞生，本人特制作此表，方便大家以后制作料理脚本\n\n有了下面的材料购买资料，大家即使不上石器不上网也能做得出料理脚本的哦，连点数都省回了（你不行？噢，那可是工夫不到家哦）！当然做好之后要上网测试过才行\n把内容复制下来保存在写字版上或者保存该网页，以后做MX料理脚本就可以依靠该表制作了\n\n比外挂资料还齐全还详细，因资料实在太多，如有错误请指出\n\n飞天御剑流整理——〖料理材料购买一览表〗\n〓〓〓〓〓〓〓〓〓〓渔村24〓〓〓〓〓〓〓〓〓〓〓\n从西到东，从上到下，人物方向东即可对话\n\n■■■■■■■■■■■■■■■■■■■■■■■■\n【超商的肉店】  （25 15）\n---------------------------------------\n『P1』\n(购买 1,1)肉1（小的肉）\n(购买 2,1)肉2（干燥肉）\n(购买 3,1)肉3（大的肉）\n(购买 4,1)肉4（高级肉）\n(购买 5,1)蛋1（普通的蛋）\n(购买 6,1)蛋2（大的蛋）\n(购买 7,1)蛋3（刚产的蛋）\n(购买 8,1)蛋4（高级的蛋）\n---------------------------------------\n『P2』\n(购买 9,1)蜥蜴1（晾干的蜥蜴）\n(购买 10,1)蜥蜴2（大的蜥蜴）\n(购买 11,1)蜥蜴3（胖的蜥蜴）\n(购买 12,1)蜥蜴4（梦幻的蜥蜴）\n(购买 13,1)青蛙1（晾干的青蛙）\n(购买 14,1)青蛙2（活跳跳的青蛙）\n(购买 15,1)青蛙3（胖的青蛙）\n(购买 16,1)青蛙4（四六的青蛙）\n---------------------------------------\n\n■■■■■■■■■■■■■■■■■■■■■■■■\n【超商的鱼店】  （25 17）\n---------------------------------------\n『P1』\n(购买 1,1)鱼1（晾干的鱼）\n(购买 2,1)鱼2（新鲜的鱼）\n(购买 3,1)鱼3（深海鱼）\n(购买 4,1)鱼4（高级鱼）\n(购买 5,1)螃蟹1（普通的螃蟹）\n(购买 6,1)螃蟹2（胖的螃蟹）\n(购买 7,1)螃蟹3（长足螃蟹）\n(购买 8,1)螃蟹4（毛蟹）\n---------------------------------------\n『P2』\n(购买 9,1)花枝1（普通的花枝）\n(购买 10,1)花枝2（大的花枝）\n(购买 11,1)花枝3（新鲜的花枝）\n(购买 12,1)花枝4（大王花枝）\n(购买 13,1)章鱼1（普通的章鱼）\n(购买 14,1)章鱼2（大的章鱼）\n(购买 15,1)章鱼3（新鲜章鱼）\n(购买 16,1)章鱼4（活跳跳章鱼）\n---------------------------------------\n『P3』\n(购买 17,1)虾1（普通虾）\n(购买 18,1)虾2（大的虾）\n(购买 19,1)虾3（新鲜的虾）\n(购买 20,1)虾4（高级玛丽娜丝虾）\n(购买 21,1)海星1（干燥的海星）\n(购买 22,1)海星2（有光泽的海星）\n(购买 23,1)海星3（大的海星）\n(购买 24,1)海星4（高级玛丽娜丝海星）