      content: "[7.5任务]雷尔任务\n\n雷尔任务的条件:\n任务条件：四大（深红，琉璃，玄黄，碧青）洞窟任务，转生宠任务，完整精灵王任务（打败柯黑穆德才算），金飞航空任务（PC团），伊甸动物园任务，神秘老人任务，火城中的火神祭任务，火灵勇士任务。水城中的卡罗的回忆（黑虎任务），水城公主任务。地城中的盐矿任务，古瓜任务，寻找战士团团长任务。风城的千里寻猪任务（蓝猪任务），风城王子任务，打林务局局长任务，尼斯大陆的英雄的祝福任务（红暴任务），泪之海的哭泣的石头少女任务，5.0和6.0的海贼王任务，沙姆岛的梦幻洞窟任务。\n重要事项 没有分身的玩家 请先找朋友确定帮你赶老鼠 不然会一直困在地牢 无法注销\n\n任务流程：\n1.去伊甸园雷尔官邸找雷尔接任务.接完任务后就开始找4大精灵拿精灵的力量.\n2.水精灵的力量：去水城，水城城堡旁边水精灵的小屋里和水精灵对话\n风精灵的力量：去伊甸大陆南方的迷雾森林和风精灵对话\n火精灵的力量：去伊甸大陆北方的火山道场和1楼的人对话可以传送到火精灵面前和火精灵对话\n地精灵的力量：首先来地城东北区（12，14）接任务，之后来到塔尔塔的战士团（33，16）对话，如果你带着大象就可以拿到任务石了。之后再去解奇努伊的梦幻洞窟任务（参考外挂资料），和那个老头说话。他会叫你去伊甸大陆南方看石头暗号（也可以不看而直接去找地精灵），之后来到库塔伊洞窟（135雷区），按着1248的顺序点击雕像（说错了或者多说了就把宝珠扔了），拿到宝珠后，来到地精灵洞窟的（21，5）跟机关对话就能看到地精灵的了和地精灵对话\n\n3.再次去伊甸园雷尔官邸，和雷尔对话会被传送到地牢里\n4.进去之后和里面的NPC—亚巴对话，他会给你一个老鼠爱吃的大福。之后就努力的在地牢中等待老鼠的出现（要给耐心，可能拿到后立刻可以看到，也可能等好几天，在里面是不能出来的，除非拿到老鼠的钥匙）要是你有朋友的话就叫他从伊甸园外290.68附近进入地牢（前提不要接雷尔任务），进入后遇敌打吉比，打到老鼠爱吃的大福后再在地牢里找一个站着的吉比，找到后吉比会消失，他就会跑到你所在的地牢里去了，自己打完后去跟那个坐在那里的王子说话，拿到钥匙后再去那个栅栏那里点牢门，就能出来了。\n\n\n5.出来后去找四大精灵，他们都给雷尔控制住了，分别打败四大精灵（地精灵，水精灵，火精灵，风精灵，每次战斗都是10个140的魔界使者，会5段，沉默，虚弱）后可以拿到骨头。有了4个骨头后跟任意精灵说话会得到5级魔法戒指（简称原子弹）\n\n6.打败四大精灵后去伊甸园找雷尔。说话后立刻战斗。之后进入最后的战斗，打败后和雷尔说话就能拿1级的哈利恩斯（圣光龙）。\n\n雷尔打法：一定要5个人去打，法师可以单挑，不过难度比较大。最好先打旁边的小怪。雷尔会变三次身。第一次变身后要立刻杀后面的“魔界之门”，不然后果自负。三次变身后的雷尔高达300级，而且第三次变身后是不中精灵的，所以法师一个人也未必能打倒他。所以要打的还是努力修炼修炼吧。\n\n\nPS：这个任务可能是华义中最值得做的任务吧，在我们测试7.5的时候，不知道有多少人被困牢房，而总的来说一个老鼠就只能救一个人出牢房，我们在牢房里面要排队由外面“赶鼠义工”救出来而离开的，这才是能体验团体精神的一个任务。\n\n\n老鼠出现地\n老鼠会偷东西　尽量别带太贵重的东西哦\n地牢不能用毛和回记录点！！！\n上楼\n一楼：11.8 (33,23)\n二楼：6.17 (09,06)\n三楼：12.15 (31,05)\n四楼：14.7 (15,05)\n五楼：22.25 (33,15)\n六楼：11.8 (25,06)\n七楼：14 .7 (34,30)\n八楼：31,14 最后1楼\n"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.5任务×", "[7.5任务]雷尔任务", "详细任务流程"]
      content: "任务限制：解过盐矿任务、古瓜任务、顽皮的公主、火灵勇士任务、贪婪局长任务(即4属性魔法戒指3-1要全部解完)\n\n首先必须先到伊甸园主人官邸，找雷尔说话接任务，他就会跟你说他需要四大精灵的力量来对抗魔界，要你把四大精灵的力量收集来。\n水精灵的力量，在尼克斯城座标(78.19)的屋子里，跟水精灵说话即可得到水精灵的力量。\n火精灵的力量，前往火山道场通道，位于伊甸大陆的北方(东385.南155)，跟在火灵勇士房间洞窟旁边的NPC说话传送到火精灵的地方，跟火精灵说话即可得到火精灵的力量。\n风精灵的力量，在伊甸大陆南方的迷雾森林(146.146)里，跟风精灵说话即可得到风精灵的力量。\n这三种精灵的力量取得后，到塔耳塔地城东北方找沙尔特的助手说话\n他会要你抓一只82级以上的玛恩摩洛斯给他(银色大象)\n到大象区抓完后，拿给他看他收走后会告诉你一些事情\n前往地城东南区座标(26.27)进入地城战士团找汉斯与他说话他会给你一个启动石，并说这是尼斯老头做的，回到沙姆岛上去梦幻洞穴找仙人\n白天进入走法：下→左→左→上→下→右→下→左→右→左→下\n白天往回走法：右→上→左→右→右\n夜晚进入走法：下→上→右→右→右→右→左→上→右\n夜晚往回走法：右→左→左→右→上→左\n他会告诉你请你去伊甸南方看石头暗号，接下来可以去看暗号或直接去找地精灵，拿着启动石前往地城的雷龙区入口处会看到一个很大的人头石像跟他说话就会被传送进去进去之后会看到9个人头石像从右下至左上算来分别为1.2.4.8跟石像说话说完第8个之后到最左边有个传送点传送过去后直走就可以看到地精灵与地精灵说话顺利取得地精灵的力量。\n接下来回伊甸园的伊甸园主人官邸找雷尔交给雷尔四精灵的力量后他会说你被骗了就把你传到牢房牢房中有个NPC-亚巴他是地城的王子也被雷尔关起来了，他说钥匙在老鼠身上，叫我们找朋友把老鼠赶来并给了我们加料过的大福\n请朋友先到伊甸园区的地牢(290.60)进入地牢，在地牢里打吉比就有机会拿到大福，然后带着大福到每层楼找老鼠(吉比)\n老鼠出现的座标\n一楼:(11.8)\n把老鼠赶到牢房后跟他对话，交出大福取得钥匙出去，回到伊甸园的伊甸园主人官邸会找不到雷尔(这部份可省略)，这时再去找四大精灵，每找一位就要打一场黑暗使者，每场有10只140黑暗使者打完4种附身在精灵身上的黑暗使者后每打一场完就会得到一根骨头，总共会有4根，有4根时在跟任1精灵对话会取得魔法戒指5-毁天灭地之后就可以去打雷尔了，雷尔打倒之后就可获得哈利恩斯黄金飞龙一只。\nP.S在解此任务时一定要先去解不可思议贝壳不管是赶鼠人或是被救者都需要有贝壳喔才能跟老鼠沟通^^Y。\n※ 刚刚去地牢打老鼠\n才知道NPC人很强滴\n打人都很痛.而且老鼠还会常常偷东西\n不管是道具里连钱钱也偷\n身上带了9百多万只剩下3百多万\n哇咧~~等正式版来解那就玩玩了~~@@\n※ 赶鼠土法练钢法\n因华义的设定令粉多玩家解雷尔任务被困牢房\n所以必需召集解雷尔任务与赶鼠勇者...使用欲要人救,必先救人的方法.\n条件:\n1. 如果你要解雷尔任务,请在领到<四大精灵的力量>,切记先别与雷尔说话,否则进了牢房就没法救人了,先到伊甸园区地牢290,60进入地牢赶老鼠(吉比)\n2. 当然更欢迎赶老鼠(吉比)义工.\n方法:\n赶鼠勇士：\n· 每人身上带着不可思议的贝集中一切力量在某伺服器。\n· 请勇士们先到伊甸园区地牢290,60进入地牢，在地牢里打吉比拿到<大福>，守着每层固定的坐标，如该层有守着，请再上一层楼，直到每层楼都有勇士守着为止。\n· 如走到最后层都有勇士守着，请询问赶鼠情况，进行每层接班守着。\n· 各层坐标如下：\n\n 老鼠出现地        洞口坐标\n一楼:(11.08)      →(33,23)\n二楼:(06.17)      →(09,06)\n三楼:(12.15)      →(31,05)\n四楼:(13.23)      →(15,05)\n五楼:(25,22)      →(33,15)\n六楼:(11.08)      →(25,06)\n七楼:(14.07)      →(34,30)\n八楼:(31,14)      →最后1楼\n如有更多坐标，请大家来提供。\n· 因每层都有勇士守着，赶鼠速度是超快的。\n· 赶鼠勇者们可自开聊天频道一起配合。\n在牢房者需知：\n· 请大家拿出合作的精神，都排好队领轮匙。(要存有感激的心唷)\n※赶鼠说明：大福是在地牢里随机遇老鼠打到的(用合的没用)；而我们要赶的大老鼠(吉比)则是会很清楚的出现在地图画面上(不必进入战斗模式.很类似动物园任务找里拉拉一样.不停的找牠喂她直到让牠移动到地牢里为止.推测应该有固定顺序定点.但测试人太多弄不清楚.也有可能是随机出现)\n\n贴心建议 ：\n玩家打吉比小心喔 (吉比什么都偷的 也记得别用魔法打 会打不到大福)\n不被偷重要东西的方法：\n1.不要带太多钱\n2.带多点气瓶，把重要的物品装备起来不要放在道具栏里"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.5任务×", "[7.5任务]人物六转任务"]
      content: "六转条件:\n1.解过寻找战士团长任务\n2.解过雷尔任务\n3.解过2代玛蕾菲雅\n4.解过精灵的召唤\n5.带着2转出生宠 [乌力乌力.威伯.凯比.克克尔随便一只]\n6.15个魔门碎片 [打赢雷尔后跟魔界之门对话可种复拿取]\n7.到漆黑洞20楼找精灵王转生 6转拿到机械人龙\n\n\n解雷尔任务的条件:\n1.需解任务:4大洞->转生宠->小黑->大黑->pc->动物园->再见精灵王\n2.火城:火神祭任务->火灵勇士(火3-1)\n3.水城:卡罗的回忆->水城公主(水3-1)\n4.地城:岩盐任务->古瓜任务(地3-1)->寻找战士团长任务\n5.风城:万里寻猪->风城王子->伊甸园林务局(风3-1)\n6.解过红暴任务->泪之海->海贼王上+下路线->梦幻洞窟 [就是伊甸所有任务]\n７．５新任务－地精灵寻找战士团团长任务\n任务限制：解完古瓜任务、地成盐矿任务、梦幻洞窟（要拿到三样梦想装备）\n一开始前往地城区东北方找沙尔特的助手（１２．１４）说话\n他会要你抓８２级以上的白色大象（玛恩摩洛斯）给他\n抓给他，他会跟你说最近他们的团长消失了（会收走银象）\n再前往塔耳塔战士团找汉斯说话\n他会要你寻找地精灵并给你激活石\n再前往沙姆岛梦幻洞窟找梦见的仙人说话\n他会要你去伊甸大陆南方的一处石头排列处寻找答案（去看提示这段可以不用去）\n然后再到塔耳塔地城练功区的洞口前（千万不可省略去找梦见仙人这个步骤，不然石像不会理你）\n找神秘巨石神像说话就可进去地精灵洞窟\n地精灵洞窟的机关是\n由下而上顺序点选１．２．４．８的石像\n拿着黄色宝珠跟左上方的机关说话\n就可前往地精灵之处\n见到地精灵跟地精灵说话\n他会要你寻找塔耳塔战士团的团长跟威灵石\n前往伊甸园的地下洞窟的贫民窟\n跟席巴恩说话就可到英嘉的房间\n跟英嘉说话他就说要你跟他一起去监狱拯救团长并会要你把一封信交给席格\n到贫民窟旁边的洞窟跟守门员说话可以去找席格\n跟席格说话他会说他也要赶去并把信收走\n前往伊甸园区的新洞窟（１０２．１２７）\n跟站在洞口的汉斯说话\n就可进去监狱\n跟里面的监狱卫士开战\n卫士有５个\n他们虽然蛮嫩的\n但是他们会互相替对方或自己补血\n最多补到２ｘｘｘ\n所以要赶快让他们死\n打完之后\n跟站在牢房里面英嘉说话\n他会跟你说战争已经结束了\n团长已经先回去塔耳塔战士团休息\n并把威灵石交给你\n带着威灵石再度前往地精灵所在处（记得跟汉斯拿激活石）\n把威灵石交给地精灵后\n并给你奖品\n本人是拿到反射之镜（来吉卡的奖品，单人镜之精灵防守３次）\n说不定还有其它奖品\n这个任务还有额外福利\n以后只要带着＂珍珠＂给地精灵\n就可以跟他换硬壳之石（还是来吉卡的奖品，单人守护精灵防守３次）\n完成以上条件进入伊甸园主人官邸与雷尔说话.希望你向四大精灵借助力量对抗魔界\n接着玩家分别去找寻4大精灵:\n\n火精灵:火山道场\n水精灵:水灵神宫\n风精灵:迷雾森林\n地精灵:神秘石像\n\n带齐4种力量去伊甸园主人官邸找雷尔 会被传送到地牢 里有npc亚巴 跟他对话后得知他被雷尔关了 说钥匙在老鼠(吉比)身上 叫我们找朋友把老鼠赶来 会给我们一个加料过的大福 老鼠来到牢房后跟他对话会交出加料过的大福 拿到钥匙 与右边的门对话即可出去\n\n被传到牢房之后.找朋友去伊甸园区地牢(290 60)(赶老鼠人物必需解过pc团) 进入地牢后会遇到吉比 打死他有机会拿到大福 然后带者大福在地牢1-8楼找吉比(一般地图上遇到的吉比非战斗中遇到的那只)找到吉比后点他说话会收走身上的大福然后吉比又会跑掉.再重复找到吉比.将吉比赶到牢房内.直到牢房内的人在点吉比说话就可以拿到钥匙出来了\n\n5.出了地牢后回去找四大精灵.跟精灵对话得知四大精灵都被附身了 每次都要打10只140的古斯特\n每次打完都会拿到骨 当取得4根骨后跟其中1个精灵对话 会拿到5级魔法戒指(扣气100 不能丢在地上或寄放 能镶13个钻石变成钻戒 扣气80 可镶在铜铁（珊瑚）装备上)\n\n6.当然是找雷尔报仇去了 请找好队友再去挑战 ps 有实力的不妨去单挑\n\n7. 打赢后与雷尔的日记说话了解事实真相，跟魔界之门对话会拿到圣光龙-哈利恩斯(风10)，再对话可拿到魔门的碎片(可重复拿)\n\n玛蕾菲雅全新宠物力量之谜\n任务条件:1.解完4大洞\n2.自开一新人物交名后备用(任务流程需要)\n\n1.到没落矿坑(444 494)1楼找到老学者(41 5)\n2.到飞龙洞(从大象区进入.既玛蕾菲雅65级时说话的地方)遇敌打雪蒟花\n3.再回到没落矿坑1楼找老学者.老学者会说明一切!\n4.到达那找胖矿工接任务\n5.(解逃走的呼拔拔任务)拿解除麻痹的药解救胖矿工(会取得地图滚动条).再跟达那长老说话.长老会提示找伊拉大人\n6.前往深红9楼找伊拉大人(深红女神)说话.伊拉会要你拿巴拿姆之壶\n水壶任务:\n从福村往漆黑的洞(247，223)先到北吉鲁.然后到到象洞下方(274，149)，进入北吉鲁山领地下信道\n1F入口(15.04) 2F入口(41.41)\n2F入口(25.34) 上1F(41.16)\n1F入口13.04) 出口(25.39)\n出来到吉鲁岛(289，175)\n然后再到巴那姆洞窟入口(295，260)\n1F(08.48) 下楼(43.21)\n地下1F(08.48) 一样转地下一楼(44.30)\n地下1F(42.33) 下楼(33.27)\n地下2F(12.10) 下楼(34.44)\n地下3F(14.03) 上楼(40.41)7\n地下2F(15.04) 下楼(10.41)\n地下3F(07.32) 上楼(45.17)\n地下2F(59.27) 下楼(96.12)\n地下3F(09.04) 上楼(43.32)\n地下2F(16.03) 深红(44.41)\n从(30.30)进入先不要进深红\n先下楼(30.30)\n1楼入口(32.35) 出口(15.03)\n出吉鲁岛(382.299) ， 再由(388.338)进入，找(10.12)巴那姆湖的看守者说密语\"授与追求火的人从此地涌出的水的润泽 \"取壶\n买到1149石币的壶再出去，在(394.340)处与带路者说话. 等2-3分钟会有位带路人来带，到了只要说\"很多\"(密语)\n他会给你装7/7的水，再进深红找多洛加 ，让水壶的水喝的剩1/7，(结论一定要说两次话才有可能变成1/7.这里的确切方法还不确定.只要第2段对话中说没水的时候立即走开，去找另外一只或者原登找，就可以了)就直接上9楼 ，到9F跟女神再说一次话(取得火的守护并提示有另一火之守护者)\n7.回到深红8楼.再走回进9楼入口附近有像5星符的地方会看到一颗石头与它对话(道具栏只能留下地图与火的守护证据).进入火的隙缝信道\n8.火的隙缝信道通过时间仅有1分钟.进入后往右上移动(记得要先往下再往右上 如果一直往右上是死路)(先沿着路走.走道有分岔就一直往下走 走到底再顺着路走.碰到分岔先走下面的再走上面的分岔)会遇到一颗石头档路(38.38).与石头战斗(石头不会攻击)后进入水晶信道!\n9.进入水晶信道后.找缺口通过.一直走到有水晶通柱的地方与另一火之精灵守护者说话.她会要你前往琉璃拿绿珀石\n***********绿珀石跟琉璃女神说话就可拿取.火的隙缝一分钟内未通过会再传回入口可再重走!(被小火山打死也不会飞.只一个损失:魅力狂掉@@)\n***********火山裂缝坐标-深红的洞窟地下8楼38.38\n水晶洞窟走法\n进入后－＞４５。１１－＞２６。４５－＞４４。１４－＞１８。２４－＞２８。２６－＞结束\n10.拿完绿珀石后再进入水晶信道遇敌打4水晶原石(地.水.火.风).打到4水\n晶石后(不好掉)再前往与火之精灵说话.会交给你玛蕾菲雅\n11.前往渔村与新藏的祖母对话.拿到项链\n12,打灵石恶梦开始\n\n注意通过火山裂缝的时间只有1分钟\n\n请先解龙王的守护 保证你过关\n\n二代女宠观光地点:\nlv10:南岛加加村\nlv15:南岛奇喀喀村\nlv20:北岛柯尔克村\nlv25:现代波拉岛金飞机场\nlv30:南岛卡鲁它那村\nlv35:南岛拉多拉回廊\nlv40:南岛乌鲁力村\nlv45:南岛碧青洞窟 进入后地下1楼\nlv50:南岛森林洞窟\nlv55:沙姆岛奇努伊\nlv60:吉鲁岛采石场\nlv65:吉鲁岛飞龙洞 由花花世界前往之无名洞窟地下1楼\nlv70:吉鲁岛没落的矿坑\nlv75:奇努伊海洞关卡(封印迷宫水池前)\nlv79:漆黑洞20楼精灵王\n\n精灵召唤:\n使者与勇者一起解的任务 当升级加点数时随机发生精灵召唤 当call闪亮时按下精灵的召唤 拿到使者的信物和勇者的信物\n使者带上信物后不会遇怪 双击勇者信物传送至勇者身边 把信物交给勇者 当解完时使者跟勇者都可以跟萨村宠店门口的npc拿礼物\nps一定要当过勇者才算解过精灵的召唤\n\n地龙蜥洞-地城区272,178\n水龙蜥洞-水城区213.26\n火龙蜥洞-伊甸大陆北方305.285\n风龙蜥洞-伊甸大陆南方239.97\n\n勇者的属性会选择你要解的任务:例子 水属性会解水城任务 解完后拿到的是雪泪道具\n\n[古瓜任务]精灵召唤地路线\n首先.你要有勇者信物[不是使者的].跑去战士团找古瓜.他会说:最近的食物都被偷吃了.然后去问战士团右边的那个人.他会说生物在XX地方.在跑去问古瓜.他会叫你帮他合5样料理\n豪华游乐套餐 [伊甸旅馆就有卖]\n大饭团[米2+盐2+水2+海藻2]\n草莓大幅[米2+豆2+堂2+草莓1]\n特制莎拉[芦笋3+包心菜3+盐3+油3+胡椒3] 胡椒3 去火成6-12有卖 避难洞窟有可买\n镜年糕[米4+炭4+橘子4+海藻4]\n拿到这5样给古瓜 就准备要打地龙蜥了\n在去问战士团右边那个 他说请你尽快前往 [[记得要带不可思议的贝壳.勇者信物]]\n地龙蜥洞在地城入口左上方 进去打龙西 有了5颗牙后\n去跟古斯特讲话 可以打头目 打赢之后 得到头目的牙\n去找战士团右边的人 说话后 就可以去领奖品喽\n\n水城邬莉叶路线:\n1. 先去抓3只宠，分别是:姆伊(海洞练功那)、克邦凯斯(英雄岛海滩)、萨美洛斯(英雄岛海滩) p.s带不可思议的贝壳\n2. 然后去水城(103:25)找邬莉叶 她说最近水怪又来倒乱了 叫勇者帮帮她 再问她前面的守门员传送进去(水怪洞)\n3. 走到第8层，见到水怪莫拉斯 他说他们最近被一种可怕的生物 把鱼群吓走了，害他们和他的儿子没东西吃\n4. 他说他的儿子很饿，请勇者帮他找一些食物给他儿子 上面那3只便是了，这时道具要有４空位左右\n5. 把3只宠交给他后，他给你3个氧气草(水中呼吸3小时)\n6. 然后到水城外庄园那向右走就看到水怪(213.26)\n7. 跟它对话进入水龙蜥洞 然后在那打魔兽帖尼贝，打后有机会打到魔兽帖尼贝的牙 打到5颗后，见路就走就可以见到黑暗的使者 他传送你去见魔兽帖尼贝的头目\n打赢后可以得到龙蜥头目的牙\n然后回水城找邬莉叶把牙交给他\n然后回萨村找流浪的旅人拿奖品\n\n风城王子路线\n1. 去风城(86, 35)的守卫队长说话进城找王子接任务\n2. 去伊甸园的林务局(27, 161), 找柯比罗尔说话拿木头\n3. 在风城(97, 47)出城, 到亚伊欧城区(12, 14)进伊甸大陆南方\n4. 去伊甸大陆南方(202, 141)跟伐木工人说话拿火把\n5. 再到伊甸大陆南方到(239, 97)进风龙蜥洞\n6. 打五个风龙蜥的牙 再进去打头目\n7. 打赢后到风城找王子对话把牙给他\n8. 到萨村宠店门口找流浪的旅人换奖品\n\n火城路线:\n1.在火城(70.70)跟赫肯豪国王接任务.\n2.之后去火神祭坛跟拉法特说明,会拿到火灵勇士的证书.\n3.返回火城(70.70)跟赫肯豪国王说话,交出火灵勇士的证书.\n4.再去火龙蜥洞伊甸大陆北方(305.285),进入洞穴遇火蜥.\n5.打到5个火蜥的牙后,跟古斯特说话之后传送上2f.\n6.跟住要打龙蜥头目,打羸了会得到龙蜥头目的牙.\n7.返回火城(70.70)跟赫肯豪国王说话,交出龙蜥头目的牙.\n8.去萨村宠物店门口跟流浪者说话,领奖品."
