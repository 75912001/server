      content: "目前正在整理一些關於魔法的的論點以及如何快速練魔法.魔抗.等整理完全以後\n.再擇日發表出來吧\n附註.目前地火風魔法熟練度都已經達到99級了.火魔抗為96級風魔抗為97級地魔\n抗為99級水魔抗為95級(已經把黑暗精靈王的魔法當搔癢了)\n\n\n基本上.本篇只針對資源不虞匱乏的高手級所寫.萬一裡面的道具獲得率不是個人\n所能負擔的.請勿見怪.\n魔法熟練度等級要提昇的快.當然是以魔法所造成的傷害力累積越高.就能提昇的\n越高.至於如何讓魔法發揮的淋漓盡致.基本的取決在於人物本身的屬性.以及寵\n物的屬性還有放的屬性精靈是否有相互對應而論.\n當一個全地屬人物騎著滑板在地屬精靈加強的狀況下.對一個全水人物放上地魔\n法.這時候魔法的發揮度就是100%的發揮.這時候放魔法的人物熟練度是提昇的最\n快的時刻.而受力的水屬性人物也是魔抗性提昇最快的時候.\n可是這時候會衍生出一種問題(我不是全地屬性的人物怎麼辦).這個時候就可以\n藉著一些道具盡量將本身的屬性調整成全地屬.如屬性兜.凱.武器.b2.魔法戒指\n.再加上彩虹精靈做以搭配.即可產生出四種全屬性出來搭配\n假設\n人物為水5火5.可以搭配魔法戒指將屬性調整成全火加以反轉即為全地\n人物為水1火9.可以搭配魔法戒指.屬性兜.武器將屬性調整成全火加以反轉即為\n全地\n人物屬性為風2地8可以搭配魔法戒指直接將屬性調整成全地\n上述只是單純針對人物屬性做一些說明.\n其實要高度發揮魔法最重要一定要注意本身的騎寵問題.只要非全屬性騎寵(滑\n板.金飛.紅狗)基本上都無法發揮出最高的破壞力.順帶一提.並非火屬性帶的越\n重的騎寵.就越能發揮出越高的火魔法相乘力.舉個例子來說.當我的人物為全火\n屬.騎著火8水2的紅暴放火魔法時.反而不如騎火5風5的機暴放火魔威力來的大\n.是不是因為水2剋制了火魔法發展.個人還沒做出關於這一系列的博士論文.所以\n尚不可考.不過騎上火8風2的紅虎.還是沒有比騎機暴好到哪裡.頂多半斤八兩而\n已.今天問題來了.假如我是水火.火風屬性人物.我應該如何騎寵才能搭配出最佳\n的地魔法破壞度.或是風魔法(不想提水魔法.因為實在是他的利用價值實在太低)\n以我所測試的結果.當人物為水火.火風時.將本身人物調整成全火騎滑板直接使\n用魔法兜.(不使用魔法兜勢必會造成屬性相扣).這時水火.火風屬性人物方能發\n揮出最大的地魔法破壞度.如果人物為地水.地風.職直接將人物調整全全地即可\n.至於其他三種屬性只要利用相同的原理也能做出相同的理論結果.不過如果有人\n硬要問說.那練水魔法要騎什麼寵???.以目前10共通大騎寵(包含機暴).大概就是\n藍暴了(水8火2).事實上我水魔法熟練度99的人物也正是騎藍暴練出來的.\n最後如果問說.那怎麼提昇魔抗比較快啊???很簡單啊.想練哪一種魔抗時.就必須\n先練出相對魔法熟練度為99的人物備用.然後將本身的屬性調整成被該魔法對剋\n的全屬性.然後放屬性精靈加強魔法威力(方式之前已經有提.不再敘述).以我的\n經驗來說.開個雙重互相對練.大約1小時左右就能將本身魔抗提升到95以上了.至\n於如果萬一沒有熟練度99的人物.也可以委託已經練到熟練度99的朋友幫忙施放\n魔法增加魔抗(不過那個朋友要很有耐心)\n其實上述只是一些基本.如果真的要完全發揮.還有一些人物屬性反轉對應.騎寵\n反轉屬性對應要提.不過..........牙齒痛了..想睡覺了..所以..先說到如此吧\n..^0^\n本文章純為個人觀感.如有另外的意見.煩請寄到我的信箱討論即可..\n\n\n--\n做過最誇張的事==漆黑18樓練了20個5轉120同名同種類人物被GM誤判重複登入\n目前最自豪的紀錄==\n單人單挑席格席思一次成功\n不扣氣狀況下.單人幹掉伊甸黑暗精靈王\n單人地城雷區練功.一次幹掉一隻131-135雷\n石器的目標==追求一個永無止境的極致之美\n--"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【更改 宠物栏中－宠物技能文字 的方法】"]
      content: "所需软件：\n1.FPE2001（推荐）  或  金山游侠V  或  GM8.0\n2.编码查寻器2.1\n\n\n1.登陆石器任意人物ID\n2.启动FPE2001，FPE操作：分析－目标游戏，选择[xxxxxxxx]StongAge[xx]－xxxxx LV：XXX,MP：xxx/xxx,HP：xxx,EpN：0\n3.打开石器宠物栏，任意高宠，我的是水魔（推荐Lv130以上），查看宠物经验值未多少？\n4.FPE操作：分析－分析目标，写上宠物的经验数值，然后，按 开始 按钮\n5.在FPE底部窗口会显示一串数值\n例如我的数值如下（依自己的情况而定）：0337FA70（h：34A489E4 d：883198436）\n6.左键点击选择这串数值，在右键点击这串数值，选择Edit\n7.会转换到另一窗口，在这里就可以更改宠物，名字，属性，血攻防敏……等等\n8.在这个窗口，下拉最右边的 下拉状态条.我的下拉了9次，会看到技能－水灵滋润，这一步FPE不要动\n9.石器操作，查看宠物的技能\n10.现在需要用到编码查寻器2.1了，如你要输入“复”这个字，启动编码查寻器2.1，在 汉字查寻 输入“复”，然后按 回车，在软件最底部，会显示：内码为B8B4\n11.回到刚才看到技能－水灵滋润 那里，用编码查寻器2.1查“水”字是CBAE，在FPE中看到了GBAE，替换成B8B4，在宠物技能栏里能看到什么？接着后边改，“灵”改“活”BBEE，“滋”改“术”CAF5，“润”要改没它，在FPE里写0000，4个零就行了\n完"
