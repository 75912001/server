      content: "★金属装备全攻略★\n想要金属装备，就必须要有金属素材。目前的金属素材有2种，铜和铁。\n而金属素材需要去打魔族怪物，等级为130-140级。魔族怪物是抓不来\n的！也没有1级的！打死得到经验值为1。\n┌───────────────────────────────┐\n│ 素材│ 素材名称 │ 掉落地点     │ 素材宠物                  │\n├───────────────────────────────┤\n│ 铜  │ 铜矿     │ 骨架信道外围 │史凯勒顿(地8风2)           │\n├───────────────────────────────┤\n│ 铁  │ 铁矿     │ 骨架信道里面 │ 古斯特(地2风8             │\n└───────────────────────────────┘\n●要怎幺样才可以打到铜矿和铁矿？\n只要上得了伊甸大陆，到指定地点打指定怪物就有机会得到，但要有耐心\n，不要打不到就说不打了！原则上1小时1块金属矿就算快了！\n●哪里打比较容易出呢？\n打铜矿，就在伊甸大陆东方(23.209)这个地点附近比较容易出！\n打铁矿，目前还比较不出哪个地点容易出！\n●打到铜矿、铁矿之后要怎幺做呢？\n打到铜矿、铁矿之后就去火城的(109.22)找金属提炼师，他会帮你提炼成\n金属，要收费的！2块铜矿才可以提炼成1块铜条，2块铁矿才可以提炼成\n1块铁条。\n●铜矿，铁矿，铜条，铁条可以交易寄存吗？\n可以！可以仍出来，可以交易，可以寄存在道具店里！\n●有了铜条，铁条之后要怎幺做呢？\n就要去打旧的素材了！具体为：骨11,皮11,木11,石11,线11！\n\n\n●金属和旧素材都有了之后，要怎幺做呢？\n1.如果你想做铜兜或者铜铠，就去地城东北区(23.08)找金属防具精工师\n，他会帮你做铜兜或者铜铠，要收费的！具体要怎幺做请看下表！(铜是\n指铜条，不是铜矿)\n┌──────────────────────────────┐\n│ 铜铠1＝3块铜＋最好的皮                 │ 防+20 敏-5 伤-20 │\n├──────────────────────────────┤\n│ 铜铠2＝7块铜＋铜铠1                    │ 防+40 敏-10 伤-40│\n├──────────────────────────────┤\n│ 铜铠3＝13块铜＋铜铠2                   │ 防+80 敏-20 伤-80│\n├──────────────────────────────┤\n│ 铜兜1＝3块铜＋稀少的龙骨               │ 防+10 敏-2 伤-10 │\n├──────────────────────────────┤\n│ 铜兜2＝7块铜＋铜兜1                    │ 防+20 敏-4 伤-20 │\n├──────────────────────────────┤\n│ 铜兜3＝13块铜＋铜兜2                   │ 防+40 敏-8 伤-40 │\n└──────────────────────────────┘\n2.如果你想做铁斧，铁枪，铁棍的话就去风城(73.117)找金属武器精工师\n，他会帮你做的！也要收费！具体看下表！(铁是指铁条，不是铁矿)\n┌──────────────────────────────┐\n│ 铁斧1＝1块铁＋木11＋线11 │ 攻+30 敏-10 伤+30              │\n├──────────────────────────────┤\n│ 铁斧2＝5块铁＋铁斧1      │ 攻+60 敏-20 伤+60              │\n├──────────────────────────────┤\n│ 铁棍1＝1块铁＋石11＋线11 │ 攻+20 伤+20                    │\n├──────────────────────────────┤\n│ 铁棍2＝5块铁＋铁棍1      │ 攻+40 伤+40                    │\n├──────────────────────────────┤\n│ 铁枪1＝1块铁＋皮11＋线11 │ 攻+25 魅+5 伤+25               │\n├──────────────────────────────┤\n│ 铁枪2＝5块铁＋铁枪1      │ 攻+50 魅+10 伤+50              │\n└──────────────────────────────┘\n3.如果想做3级铁器的话，就去火城(126.41)找金属武器精工师，同样要\n收费！看下表！\n┌──────────────────────────────┐\n│ 铁斧3＝13块铁＋铁斧2 │ 攻+120 敏-40 伤+120                │\n├──────────────────────────────┤\n│ 铁棍3＝13块铁＋铁棍2 │ 攻+80 伤+80                        │\n├──────────────────────────────┤\n│ 铁枪3＝13块铁＋铁枪2 │ 攻+100 魅+15 伤+100                │\n└──────────────────────────────┘\n\n\n--------------------------------------------------------------------------------\n ●那镶宝石是怎幺回事？\n镶宝石是指把宝石镶在铜器或者铁器上！使得铜器铁器更加强大！\n●怎幺镶宝石呢？有什幺用？\n你得有一只克克尔系的宠物，等级不限制。到风城宠物店[亚伊欧风城(8\n6.94)]学镶宝石技能。目前 可以镶宝石的宠物有：\n克克尔：加加村出生的宠物\n克雷尔：卡鲁它那村外\n里斯基：卡鲁它那村外\n克洛尔：加加村下方\n拉斯基：弗烈顿城区\n●镶宝石成功率多少？\n镶宝石是100%成功的！但是一件金属装备最多只可以镶3颗宝石！\n●宝石怎幺来的？有什幺用？\n1.宝石需要去打指定宠物才有机会掉落下来的！具体请看下表(素材前有\n◆的代表确实有,没◆的则代 表转载台湾石器的！)\n┌───────────────────────────────┐\n│ 素材│ 素材名称 │ 掉落地点 │ 素材宠物                      │\n├───────────────────────────────┤\n◆黄石 │ 黄宝石矿 │ 风城凯村 │    菊虎                       │\n├───────────────────────────────┤\n◆红石 │ 红宝石矿 │ 弗烈顿城区 │      黑暴                   │\n├───────────────────────────────┤\n◆绿石 │ 绿宝石矿 │伊甸大陆西方(181.175)│ 芭拉芭，梅尔顿     │\n├───────────────────────────────┤\n│蓝石 │ 蓝宝石矿 │ 伊甸大陆南方 │ 水人龙，迪布恩            │\n└───────────────────────────────┘\n2.把宝石镶在金属装备上可以提高金属装备的能力，具体如下\n┌──────────────────┐\n│宝石   │ 提高金属装备的能力        │\n├──────────────────┤\n│黄宝石 │ 提高10点敏捷力            │\n├──────────────────┤\n│红宝石 │ 提高10点攻击力            │\n├──────────────────┤\n│绿宝石 │ 提高10点防御力            │\n├──────────────────┤\n│蓝宝石 │ 提高30点生命力            │\n└──────────────────┘\n●宝石或者宝石矿可以交易吗？\n可以！可以仍出来，可以交易，可以寄存在道具店里！\n●打宝石要什幺条件吗？\n只要上得了伊甸大陆，到指定地点打指定怪物就有机会得到，但要有耐心\n，不要打不到就说不打了！原则上1小时1块宝石矿就算快了！打黄宝石矿\n需要100级才能进得去风城凯村！其它不要！\n●打到之后要怎幺做呢？\n打到了之后就去地城西南区(20.16)找宝石提炼师，他会帮你提炼出宝石的\n！要收费！不过要3颗同样 的宝石矿才能提炼出一颗宝石哦！比如需要3颗\n绿宝石矿才能提炼出1颗绿宝石！\n●有了宝石之后要怎幺办呢？\n有了宝石之后就用克克尔系宠物把宝石镶在铜器或者铁器上就可以了！\n●那珍珠呢？又是怎幺回事？\n珍珠的作用跟宝石一样，都要用克克尔系宠物把珍珠镶在铜器或者铁器上！\n珍珠作用是加气上限的， 一颗+20的气。\n●珍珠在哪打呢？要找提炼师提炼吗？\n珍珠在福村进海底信道的洞口旁打鲨鱼群就有机会得到了！珍珠不需要提\n炼！可以直接镶上去的！\n●有珍珠2吗？\n目前没有珍珠2！台湾华义说在漆黑打100级的机暴群可以得到珍珠2，但经\n过大量事实证明，大陆并 没有开放珍珠2，台湾好象也没有！\n●珍珠可以镶几颗呢？\n珍珠最多可以镶3颗，但如果跟宝石一起镶的话，那就珍珠宝石一起算！也\n就是1颗珍珠2颗宝石或 者2颗珍珠1颗宝石！\n●镶了宝石或者珍珠后再去升级铜器铁器，原来的效果还在吗？\n不在了！所以建议到3级之后再去镶!\n■金属装备坏了怎幺办？■\n金属装备已经证实过确实会坏，但要用什幺修复呢？因为目前没有人修复过\n，所以也只是猜测！根据修复的定义来说，只要用该装备的1种1级的素材就\n可以修复！\n所以可以这样修：加1级旧素材！加金属太浪费了！\n铜兜：骨1\n铜铠；皮1\n铁斧：线1\n铁枪：线1\n铁棍：线1\n希望有修复过金属装备的朋友可以来证实一下！"
