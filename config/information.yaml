      content: "弓1-10木加线　　精灵弓6-8骨加线　　1-5,9-10木加线\n\n弓11-14，（12-14级的空弓现在可在风城直接购买）=木+线，由于弓棒成\n份相同，所以可以合棒的过程中烧出！可引用棒类合成法。（修复的话用\n木1或线1）\n\n给弓棒上精的盗贼洞合成法（限毒精）：十级以上的弓棒都可以去做玄黄\n任务的盗贼洞里买精棒8来上精，方法是弓棒+精棒8X4。但实在烧钱，一\n般去用精草合成法就可以上精或是起到催化的作用。"
