      content: "必须条件：成人仪式\n1.去奇村东边出口旁找老人，拿到先见之光\n2.然后去梦幻洞窟\n\n3.白天去(87，101)\n进:下(8,14)，下(56,29)，下(56,44)，上(61,55)，上(45,55)，上(56,55)，右(13,59)，右(24,55)，右(8,29)\n出：出口(36,44)，同(13,25)，同(8,40)，右(29,59)，右(61.29)，\n\n4.晚上去(97， 120)\n进：下、上、右、右、右、右、左、左、左\n出：出口，同，下，下，下，下，下，下，出口\n5.进去后打过看门的2个飞天毒蛙，然后跟老人(34，34)说话\n\n6.对换奖品\n  可得到一些素材、料理以及各式各样等级5左右的精灵LV3武器\n?素材：毒草7、叶7、石4\n?料理：三明治便当\n?武器：回旋标5混乱3、弓5睡眠3\n\n目前已知可以拿到的道具装备包括：\n空想的竖琴（攻+2 敏+1 魅力+5 睡眠LV1）\n空想的帽子（防+4 敏+2 滋润LV2）\n空想的衣服（攻-2 防+12 敏+7 治愈LV2）\n特洛西投掷斧\n特洛西弓\n不可思议的叶\n新鲜的蛋等"
