      content: "【作者：yuhuashi】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n◆回旋攻击\n沙己夫换气道\n呼萨瑞和多格斯可打到蓝珊瑚碎片2、宠技罐头-回旋攻击\n可学习宠物：海星2只，穿山甲系全部，羊系全部\n\n宠技罐头\n可习得宠技-回旋攻击的罐头  有特定宠物限定\n\n说明：攻击里下降50% 可攻击敌方一排\n\n技能可遗传\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n◆针刺外皮\n史东尔换气道\n艾柏瑞和卡特可打到红珊瑚碎片2、宠技罐头-针刺外皮\n可学习宠物：海参2只，螃蟹2只，龟系全部\n\n宠技罐头\n可习得宠技-针刺外皮的罐头 有特定宠物限定\n\n说明：可令攻击者受到1/2得伤害\n\n技能可遗传\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n此洞窟【未开放】，所以MP2也未开放\n\n◆MP2\n凯拉村附近的斯克洛洞窟（86，29）5楼（29，31）打黑鸟\n\n宠技罐头\n可习得宠技-MP攻击2的罐头 凯恩限定\n\n说明：MP攻击2-攻击力下降50% 并损害对方75%的MP\n\n技能可遗传\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
