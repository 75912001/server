      content: " ┌───────────────────────────────-┐\n │ 6.0新任务--泪之石任务                                         │\n │ 任务地点：南岛奇喀喀村（１３９．１００７）附近                │\n │ 条件：身上需有不可思议的贝壳                                  │\n │                                                               │\n │ 任务内容：                                                    │\n │                                                               │\n │ 一、在晚上，来到奇喀喀村下方的沙滩上(106.1011)和石头美少女夕  │\n │ 姬说话，得到白星.女戒。                                       │\n │                                                               │\n │ 二、由(102.1021)进入泪之海(146.49)→(144.25)→(143.34)→(146. │\n │ 44)→(145.52)→(149.63)→(148.70)→(255.74)→(262.72)→(264.4 │\n │ 2)→(272.40)→(365.128)→(358.132)→(376.204)→(369.207)到(24 │\n │ 5.260)会遇到怪鱼宫本蚊帐，打败它，继续前进。                  │\n │                                                               │\n │ 三、从(189.513)进入海底洞窟(10.7)找洛林拿到克斯林首饰，飞回奇 │\n │ 喀喀村。                                                      │\n │ 四、在晚上，再来到奇喀喀村下方的沙滩上(106.1011)和石头美少女  │\n │ 夕姬说话，得到洛林的信。                                      │\n │                                                               │\n │ 五、再由(102.1021)进入泪之海(146.49)→(144.25)→(143.34)→(14 │\n │ 6.44)→(145.52)→(149.63)→(148.70)→(255.74)→(262.72)→(264 │\n │ .42)→(272.40)→(365.128)→(358.132)→(376.204)→(369.207)到( │\n │ 245.260)会遇到怪鱼宫本蚊帐，打败它，继续前进。                │\n │                                                               │\n │ 六、从(189.513)进入海底洞窟(10.7)找洛林说话，传到别一空间，和 │\n │ 杰夫说话，开打（用镜吧），打完後，传回海底洞窟，和烂帽子说话  │\n │ ，拿到白星.男戒，再飞回奇喀喀村。                             │\n │                                                               │\n │ 七、在晚上，再来到奇喀喀村下方的沙滩上(106.1011)和石头美少女  │\n │ 夕姬说话，得到5个泪之石（可提升5点基本能力）。                │\n │                                                               │\n │ 完成任务                                                      │\n │ 重要提示：四转人可留着这5个泪之石，和五勾玉的五点祝福留在5转  │\n │ 用。                                                          │\n │                                                               │\n └───────────────────────────────-┘\n\n 【注意】：做此任务身上一定要有不可思议的贝壳，否则无法和杰夫打，就无法解任务拉！"
