      content: "\n==================================================================\n【玛斯贝卡-橘虎】火5风5  6技能\nLV1出没座标：伊甸大陆凯菈村（20，118）\n备注：4支同种时出现的话95%会有LV1\n\n【威比-金色威威】火3风7  6技能\nLV1出没座标：伊甸南方（45，100）\n备注：5支一起出现大部分都有LV1两支出现LV1也有可能\n\n【塔斯夫-橘鸟】火5风5  6技能 T技：落马术\nLV1出没座标：伊甸园区（130，70）\n备注：混在同类中\n\n【杨格斯-黑人龙】火2风8  5技能\nLV1出没座标：火山道场火山洞窟第4层（29，14）\n备注：混在同类中\n\n【砂鲨-红鲨鱼】水2火8  5技能\nLV1出没座标：蒙达山的海底通道（70，15）附\n备注：会与其他种宠出现\n\n【贝洛金-金色大舌头】火4风6  5技能\nLV1出没座标：蒙达村地下通道（7，18）\n备注：混在高等中出现￣也会跟不是同类的宠出现\n\n【雷德力克斯-水龙】地5水5  5技能\nLV1出没座标：蒙达山外（85，14）\n备注：混在同类中\n\n【龟之钢-钢龟】火4风6  5技能\nLV1出没座标：蒙达村地下通道（49，22）（7，18）\n\n【史凯鲁-蓝色蕃茄头】 地5水5  5技能\nLV1出没座标：伊甸大陆西方（295，195）\n备注：混在高等同类中\n\n【梅尔顿-黑猩猩】地7水3  4技能\nLV1出没座标：伊甸大陆西方在经过（268，353）的位置向南方走时,有个隐形\n通道可以去另一边的小岛,小岛（12，24）可遇LV1的梅尔顿\n备注：4.0和5.0进入过小岛，6.0好像进不去了，有待验证\n\n【迪加-黑鲨鱼】\nLV1出没座标：水城地下水路4楼靠近5楼出口\n备注：目前尚无详细座标(已有人抓到)\n\n【芭拉芭-绿番茄(类似巴克.头上有电风扇)】\nLV1出没座标：伊甸大陆西方（295，195）\n备注：混在高等同类中\n\n【呼鲁鲁-橘色狗】火3风7  5技能\nLV1出没座标：伊甸园区（80，214）\n\n【裘里蛙】地5水5  4个技能格\nLV1出没座标：伊甸大陆西方（185，139）\n\n【艾尔蛙】地2风8  4个技能格\nLV1出没座标：伊甸大陆西方（185，139）\n\n【尼加斯-咖啡色全头系】\nLV1出没座标：伊甸大陆西方（93，19）\n\n【蒙哥拉斯】地5风5  4技能\nLV1出没座标：凯菈村（78，15）\n\n【乌宝依】火2风8  6技能\nLV1出没座标：伊甸大陆北方（340，132）\n\n【波波顿-绿鲨鱼】\nLV1出没座标：动物园任务带著\"肉食性饲料2\"到水池旁边御敌(肉店前面)\n备注：解完动物园後就不能抓了\n\n【乌力莱德-蓝猪】\nLV1出没座标：风城的\"千里寻猪\"任务\n备注：每转生只能解一次\n\n【布依胖-庞克头猪】\nLV1出没座标：动物园任务全解完所得的奖品\n备注：之前解的雷尔胖不是原名￣三围也不好\n\n【莫拉斯-海主人系】\nLV1出没座标：伊甸水城任务中所得宠，打巴克後会给\n备注：水怪任务，接任务——打巴克——拿莫拉斯——找大水怪——交莫拉\n斯、拿绿蛙——打巴克——拿莫拉斯——找队长——拿双头叉\n\n【尤里蛙-绿色青蛙】\nLV1出没座标：伊甸水城任务奖品\n备注：把莫拉斯交给水怪所给你的奖品\n\n【拉斯基-红色兔子】\nLV1出没座标：动物园任务中所要的三宠之一，打败席格可取得\n备注：这宠　要用来解下动物园的奖品\n\n【萨格鲁-黑虎】\nLV1出没座标：解卡罗任务取得\n备注：咒文超级难打\n\n【嘎吱拉】地5水5\nLV1出没座标：库塔伊洞窟四楼（21，43）[需带封印的地魔法介3-1]\n\n【斑尼迪克】火1风9\nLV1出没座标：帕拉火洞窟火之眼（42，49）（42，54）（46，18）\n             （42，53）（48，16）[需带封印的火魔法介3-1]"
