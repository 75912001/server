      content: "『7.0版』美容第一手价格清单[5转140美容费用] 作者：BOX_天空战记001\n==================================================================\n00-05魅力的美容费用:8400\n05-10魅力的美容费用:8400\n10-15魅力的美容费用:25200\n15-20魅力的美容费用:42000\n20-25魅力的美容费用:50400\n25-30魅力的美容费用:67200\n30-35魅力的美容费用:84000\n35-40魅力的美容费用:92400\n40-45魅力的美容费用:109200\n45-50魅力的美容费用:126000\n50-55魅力的美容费用:134400\n55-60魅力的美容费用:151200\n60-65魅力的美容费用:168000\n65-70魅力的美容费用:176400\n70-75魅力的美容费用:193200\n75-80魅力的美容费用:210000\n80-85魅力的美容费用:218400\n85-90魅力的美容费用:235200\n90-95魅力的美容费用:252000\n95-100魅力的美容费用:260400\n\n总共从0魅力加到100魅力需要261.24万石币\n所以7.0版没钱不要去美容!丫的太贵了!"
