      content: " ┌───────────────────────────────-┐\n │ 富商的货物                                                    │\n │                                                               │\n │ 任务条件：成人礼，建议等级40以上．可重复解                    │\n │                                                               │\n │ 任务攻略：到沙姆岛奇努伊村找盖落比（54。76），他会跟你说因为  │\n │ 需要带的货物量增加，而他们的人也经负荷不了，他听说吉鲁岛有一  │\n │ 种大象可以帮忙运送货物，希望你去帮他抓回来，而给你富商的货物  │\n │ ，到了吉鲁岛的小象区遇敌，会遇到LV60的巨大玛恩摩注意要把它抓  │\n │ 起来，抓到后富商的货物会不见，在回去交给盖洛比，他为了感谢你  │\n │ 而给你宠物忠诚肉片（宠物忠诚度＋10）                          │\n │                                                               │\n └───────────────────────────────-┘"
