      content: "作者：BOX_天空战记001\n==================================================================\n无限转宠的过程：\n1.A人物为新人，练到30级，去做成人，目的是拿MM和项链！\n2.B人物为主号，帮A人物打黑蛙王，而后A人物去渔村拿MM和项链！\n3.C人物为打灵石号，A人物把MM交易给C人物！A人物删掉！\n4.C人物打满灵石后把MM交易给B人物，B人物把MM练到79级\n5.B人物带着需要转生的宠物和79级的MM去漆黑找精灵王转宠！\n6.B人物丢了项链没关系，B人物做完整个精灵王传说也没关系！"
