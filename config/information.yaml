      content: "合成产物         成分           成功率％\n合成斧           骨＋石         ６０－８０％\n                 骨＋石＋木     ２０－４０％\n\n合成枪           骨＋木         ２０－３０％\n                 牙＋木         ３０－５０％\n                 石＋木         ４０－６０％\n合成棍棒         骨＋木＋丝     ５０－８０％\n合成爪           皮＋黏土＋牙   １０－３０％\n                 爪＋皮         ４０－８０％\n                 鳞＋皮         ２０－５０％\n合成投掷斧       木＋石         ３０－６０％\n                 木＋石＋丝     ２０－８０％\n合成弓           木＋丝         ４０－８０％\n                 木＋？＋丝     ２０－６０％\n\n合成衣服         皮＋丝         ３０－６０％\n                 皮＋皮＋丝     ５０－９０％\n合成铠甲         石＋皮         ２０－５０％\n                 石＋皮＋丝     ３０－６０％\n                 石＋皮＋鳞＋丝 １０－？？％\n                 这只成功过一次　不建议使用\n合成耳饰         骨＋石＋丝     ３０－７０％\n═══════════════════════════════\n[基楚合成表]\n\n合成斧 石 + 骨\n\n合成枪 石 + 木 、 石 + 木 + 线 、 牙 + 木\n\n合成棒 木 + 线 、 木 + 线 + 骨\n\n合成爪 牙 + 皮\n\n合成投掷斧 石 + 线 、 石 + 木 + 线 + 黏土\n\n合成弓 木 + 线 、 木 + 线 + 黏土\n\n合成铠 石 + 皮\n\n合成服 线 + 皮\n\n合成兜 线 + 皮 + 叶子\n\n合成耳饰 骨 + 石 + 线\n\n合成饰物 斧 + 丝 + 黏土\n\n合成首饰 木 + 丝 + 土\n\n合成耳饰(回避率) 贝瞉 + 黏土 + 线"
