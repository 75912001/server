      content: "一、在火城，来（59,111）民房，到（20，10）找德夫说话，接任务。\n二、在火城从（13，71）出火城，进入弗烈顿城区，往左下走，来\n（140，179）的走廊继续走。\n三、经过弯弯曲曲的走廊，来到（10，370）进入伊甸大陆北方。\n四、在伊甸大陆北方，再经过一段弯弯曲曲的路来到（385，154）进\n入火山道场通道。\n五、在火山道场通道，走到（35,54)进入火山道场.\n六、在火山火山道场通道，走到（47,120)进入火山祭坛。\n七、在火山祭坛，走到（21,21)和拉法特说话， 他会叫你打四种肉来\n祭祀，并给你一个火把，建议拿了火把后原地登出一下，这样火把就\n不会熄灭了。\n八、登进后，走到（34，18）进入火山洞窑第一层。\n九、打四个肉，这里打肉极麻烦，请大家尽理用水宠打。\n1、在火山洞窑第一层打火山拉斯基，有机会得到火山拉斯基的肉，\n直到打到火山拉斯基的肉，就向火山洞窑第二层进发。\n2、在火山洞窑第二层打火山瑞德宝，有机会得到火山瑞德宝的肉，\n直到打到火山瑞德宝的肉，就向火山洞窑第三层进发。\n3、在火山洞窑第三层打火山耶普鲁，有机会得到火山耶普鲁的肉，\n直到打到火山耶普鲁的肉，就向火山洞窑第四层进发。\n4、在火山洞窑第四层打火山贝洛波波，有机会得到火山贝洛波波\n的肉，直到打到火山贝洛波波的肉为止。\n十、打完四种肉后，走回一楼再走回火山祭坛，走到（21,21)和拉\n法特并跟他说话，交出火把。\n十一、如记录在水、火、地、风城的就登出，再通过传送点回火城，\n如记录点在其他村，那你就走回火城吧。\n十三、德夫还告诉你，你还可去做火灵勇士任务（后续）。\n\n总结：\n      1、第一层的火山拉斯基攻极强，注意别飞了，但肉易打。\n      2、第二层的火山瑞德宝不难打。\n      3、第三层的火山耶普鲁极易逃，肉也难打，最好第一回合\n杀了它，否则它就跑了就惨，如不行，就用石化吧，还有感觉组队\n打，它没那么易逃。\n      4、第四层的火山贝洛波波极易逃，肉也难打，最好第一回\n合杀了它，否则它就跑了就惨，如不行，就用石化吧，还有感觉组\n队打，它没那么易逃。\n      5、如果火把就再走回祭坛问拉法特重拿火把。\n◇特别感谢作者：微笑赢家、雨季◇\n\n7.0补充：7.0服务器无论登出与否，火把都会熄灭，请在1个小时内打完所有肉！"
