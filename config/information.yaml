      content: " ┌───────────────────────────────-┐\n │ 小泽爱情故事                                                  │\n │                                                               │\n │ 任务条件：解过成人礼，建议等级30以上                          │\n │                                                               │\n │ 任务攻略：在塔姆塔姆村找小泽（61。45）接下任务，他会跟你说他  │\n │ 有一个很喜欢的女孩，爱吃频果，并请你带一颗白雪频果（频果1＋蜥 │\n │ 蜴1）给他，将白雪频果拿给南岛（488。524）爱吃频果的女孩，女孩 │\n │ 她会很感谢你，收下白雪频果而给你一个香甜的频果回报你，拿到之  │\n │ 后就回去找小泽，小泽又会告诉你，那个女孩生病了，在去（488。52 │\n │ 4）找小女孩，他会告诉你因为他吃了你给它的白雪频果而中毒，并且 │\n │ 将咬过的白雪频果还给你，还说不要再来找他了，回去找小泽，跟他  │\n │ 说完后，他会麻烦你做一个烤焦的兽肉串烧（串1＋炭1＋肉1＋盐1）  │\n │ ，给小女孩，再带着烤焦的兽肉串烧去跟小女孩说话，他说他明白事  │\n │ 情的经过，他将咬过的白雪频果收下当成纪念，并给你一封信要交给  │\n │ 小泽，再将信拿给小泽，他为了谢谢你帮她解毒也帮小泽解释清楚事  │\n │ 情来龙去脉，而给你一顶他自己做的帽子--灵气帽(防+7全异常状态防 │\n │ 止+10)                                                        │\n │                                                               │\n └───────────────────────────────-┘"
