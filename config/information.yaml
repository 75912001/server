      content: "【作者：BOX_天空战记001】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n【声明】:\n此文未经本人许可,不得转载于其他论坛,网络媒体和平面杂志中\n\n\n          ★白狼和白狼技能全面分析★(2004.01.17)\n\n                 〓第一部分:白狼勇士(白狼)〓\n\n●白狼就职条件:\n0转80以上即可\n{推荐}1转100以上（有高宠就容易，否则。。。。）\n\n●白狼就职奖励:\n1.白狼就职成功后会奖励你一套基本的白狼装备,共6件,效果如下:\n\n【巨熊匕首】:攻+40 反击率+5\n【巨熊皮带】:回避率上升+10 体力+30\n【巨熊石剑】:攻+85 敏-20 反击率+5 猛毒的精灵Lv4 体力+30\n【巨熊头盔】:防+32 敏-7 体力+30 净化精灵(石化)Lv2\n【巨熊之铠】:防+64 敏-16 体力+30 滋润的精灵Lv4\n【巨熊之靴】:敏+10 防+15 体力+30\n\n【白狼装备总效果】:\n①攻+125 防+111 敏-33 体力+150 反击率+10 回避率上升+10\n②净化精灵(石化)Lv2,猛毒的精灵Lv4,滋润的精灵Lv4\n\n注意点:巨熊匕首和巨熊石剑在刚就职的时候只能装备一样!必须学了\"二刀流\"技能后才能同时装备!\n\n2.白狼就职成功后会奖励你一点技能点数,你可以在白狼勇士公会(25.20)学技能,强烈建议学\"回避\"!这样可以填补白狼敏的不足!\n\n3.白狼就职成功后会奖励你一次重新调整自己能力的机会!以前分配的点数留下20点在血点上,其余点数还原为未加状态!敏上限为200,攻防血不限制!建议200敏全加!\n\n【好消息】:三种职业就职成功后,系统都会在还原点数的时候自动多加1点!\n\n●白狼最高有几级?白狼如何升级?\n白狼目前最高有22级,要让白狼升级,就必须练技能!技能熟练度满70%了就会自动升1级,并送你1点技能点数让你学习其他技能!\n\n●技能熟练度没满70%也会升级,这是为什么?\n这是因为只要你学的技能全部熟练度加起来够70%了就会升级!如回避90%,盾击只需要再练到50%就会升级!\n\n\n                   〓第二部分:白狼技能〓\n\n●白狼技能有几个?是什么技能?学费多少?\n\n白狼技能目前只开放15个技能,其中1级技能7个,2级技能8个!详细如下:\n\n⑴1级技能\n学习地点:白狼勇士公会(25.20)\n\n【暴击】:攻击力提升攻击(1000)\n【连环攻击】:一定机率发动攻击二次(1000)\n【回避】:增加人物物理攻击回避率(1000)\n【能量聚集】:集中身上的能量以提升防御力(1000)\n【专注战斗】:集中精神于战斗中,强化自身命中率(1000)\n【盾击】:利用盾牌敲击对手(需装备盾)(1000)\n\n【舍己为友】:帮我方宠物或人物抵挡物理攻击(1000)\n[学习地点:吉鲁岛(474.176)]\n\n⑵2级技能\n学习地点:吉鲁岛(474.176)[达那村下方]\n\n【双重攻击】:使用虚招后第二次攻击加强(100000)\n【二刀流】:可双手均装备武器提升攻击力,但左手武器之精灵将失效(100000)\n【激化攻击】:瞬间提升攻击力并下降些许防御力(100000)\n【濒死攻击】:以身上的伤口痛楚逼迫自己专注以提升命中率(100000)\n【枪熟练度】:增加使用枪类武器的伤害力(1000)\n【斧熟练度】:增加使用斧类武器的伤害力(1000)\n【棍熟练度】:增加使用棍棒类武器的伤害力(1000)\n【状态回复】:人物处于非正常情况下待机(昏睡,石化等)自动回复体力(100000)\n\n●白狼技能实际效果如何?\n1.舍己为友技能为1级技能,并非2级技能!但学习地点跟2级技能同地方!\n2.2级技能\"格挡\"并没开放!\n3.白狼技能的费气程度不随熟练度而增加!\n4.白狼的技能分三种\n⑴自然提升技能:回避,二刀流,枪熟练度,斧熟练度,棍熟练度,状态回复(6技)\n⑵辅助效果技能:专注战斗,舍己为友,能量聚集,激化攻击(4技)\n⑶战斗效果技能:连环攻击,盾击,暴击,双重攻击,濒死攻击(5技)\n\n这是我的15级白狼勇士\n\n\n下面为白狼技能的实际效果和费气情况\n\n01.回避[辅助]-------------相当于多戴了个合成耳饰(MP:0)\n02.盾击[战斗功能]---------有机率打晕对方,昏迷2回合,效果以攻击力为主,忽略盾的防御力(MP:5)\n03.暴击[战斗功能]---------提升攻击力的技能(MP:7)\n04.二刀流[辅助]-----------左手武器的综合效果百分比以熟练度为准,10%熟练度为20%,48熟练度为30%(MP:0)\n05.专注战斗[辅助]---------相当于多戴了个合成戒指(MP:9)\n06.舍己为友[辅助]---------83%熟练度,减14%防来保护己方的人或宠(MP:5)\n07.能量聚集[辅助]---------72%熟练度,减24%敏加34%防(MP:10)\n08.激化攻击[辅助]---------51%熟练度,减20%防加攻(MP:20)\n09.枪熟练度[辅助]---------增加枪类武器攻击力,枪本身攻击越高,熟练度越高,附加的攻击越多(MP:0)\n10.斧熟练度[辅助]---------增加斧类武器攻击力,斧本身攻击越高,熟练度越高,附加的攻击越多(MP:0)\n11.棍熟练度[辅助]---------增加棍类武器攻击力,棍本身攻击越高,熟练度越高,附加的攻击越多(MP:0)\n12.状态回复[辅助]---------被昏睡,昏迷,石化,冰冻后自动给自己补血,70%熟练度每回合补血78!(MP:0)\n13.连环攻击[战斗功能]-----有机率不减攻击力打两下,拿弓也可以冲上去打两下(MP:7)\n14.双重攻击[战斗功能]-----提升攻击力的技能(MP:13)\n15.濒死攻击[战斗功能]-----扣自己血换命中,使用后也不能100%打中!10%熟练度扣自己96%血,76%熟练度扣自己76%血,血过低不能使用此技能(MP:17)\n\n【说明】:\n01.盾击以右手的攻击力和总攻击力为准!只装备盾的盾击威力很小!\n02.二刀流的武器攻击力为:右手攻击力+左手攻击力*熟练度的百分比!左手的一切效果均按熟练度的百分比换算!包括(攻防敏血气伤吸魅)\n03.三种武器熟练度增加的攻击力必须打完一场才会显示,刚装备上去不显示!\n04.状态回复熟练度越高,加的血越多,建议学满!\n\n●白狼勇士要学贯穿攻击需要哪些技能?\n我们分析一下这张白狼技能限制图:\n\n\n学贯穿攻击前提为:双重攻击,激化攻击,濒死攻击(3技)\n学双重攻击的前提为:连环攻击(4技)\n学激化攻击的前提为:暴击(5技)\n学濒死攻击的前提为:专注战斗(6技)\n\n因此学贯穿攻击的前提必须学6个技能!加上贯穿攻击就7个技能!\n\n●白狼22级不是有22个技能吗?那不是所有的技能都可以学?\n白狼22级是有22个技能点数,但是不是所有的技能都可以学就不清楚了!因为白狼的三级技能并没有开放!目前白狼可以学到的只有15个技能!建议全部学!\n\n●为什么我拿了2把双尖枪用连环攻击打不是打8次呢?\n因为连环攻击的说明就是打1-2次的!无论你拿什么武器都是打1-2次攻击的!拿双尖枪就别使用任何战斗技能!\n\n●为什么我拿弓箭等间接武器时使用连环攻击,暴击,双重攻击和濒死攻击的时候是冲上去打的?\n呵呵,恭喜你,这就是就职白狼的好处啊!他不加镜你冲上去打,他加镜你射死他!\n\n●白狼如何修炼技能?\n1.回避:戴个合成耳饰 10,萨姆吉尔首饰和巨熊腰带去小猪岛挂1个小时就能达到70%了!\n2.专注战斗,舍己为友,能量聚集,激化攻击,连环攻击,盾击,暴击,双重攻击,濒死攻击 这9个技能都可以在阿布洞找阿布三兄弟练,魔法设置打自己就可以!\n3.二刀流,枪熟练度,斧熟练度,棍熟练度 这4个技能在组队练级的时候就会自动提升了!拿2把武器攻击,二刀流就会提升,其他三种熟练度必须打出星星来才会提升!要想快速提升就单人去小猪岛原地挂!练这4个技能的时候最好带力击之戒,爆星率比较高!\n4.状态回复必须2个ID快速PK才可以!\n㈠一个带石化或睡眠的9级武器!每回合都给白狼放!敏比白狼高越多越好!\n㈡白狼带毒和混乱抗性的B3首饰(B4首饰最好)!敏越低越好!\n\n●白狼的学习顺序是什么?\n这只是建议,不一定要按照这个来学习!不过第一个白狼技能学回避绝对没错!\n\n回避-→专注战斗-→盾击-→连环攻击-→二刀流-→能量聚集-→舍己为友-→暴击-→双重攻击-→濒死攻击-→激化攻击-→枪熟练度-→状态回复-→棍熟练度-→斧熟练度\n"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 7.0完美解析】", "【7.0职业技能相关】", "【职业技能】『追猎者』", "★猎人和猎人技能全面分析★(简体中文版)"]
      content: "【作者：BOX-天空战记001】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n【声明】:\n●此文未经本人许可,不得转载于其他论坛,网络媒体和平面杂志中\n●此文还有一些细节需要补充!请等待!\n\n\n                     ★猎人和猎人技能全面分析★(2004.01.20)\n\n      〓第一部分:追猎者(猎人)〓\n\n●猎人就职条件:\n0转80以上即可\n{推荐}1转80以上（有高宠就容易，否则。。。。）\n\n●猎人就职奖励:\n1.猎人就职成功后会奖励你一套基本的猎人装备,共5件,效果如下:\n\n【森林炼甲】:防+53 体力+20 恩惠的精灵Lv4[17]\n【森林木弓】:攻+28(4-6) 体力+20 昏睡的精灵Lv4[14]\n【森林皮带】:回避率上升+15 体力+20\n【森林头盔】:防+26 体力+20 净化精灵(昏睡)Lv2[9]\n【森林之靴】:敏+15 防+5 体力+20 闪避+5\n\n【猎人装备总效果】:\n①攻+28 防+84 敏+15 体力+100 回避率上升+15 闪避+5\n②净化精灵(昏睡)Lv2,昏睡的精灵Lv4,恩惠的精灵Lv4\n\n2.猎人就职成功后会奖励你一点技能点数,你可以在追猎者公会(13.19)学技能,强烈建议学\"追寻敌踪\"!这样带队练级速度就比较快!\n\n3.猎人就职成功后会奖励你一次重新调整自己能力的机会!以前分配的点数留下20点在血点上,其余点数还原为未加状态!攻防上限为200,敏上限为400,血不限制!建议200攻全加!\n\n【好消息】:三种职业就职成功后,系统都会在还原点数的时候自动多加1点\n\n疑问解答:\n●猎人最高有几级?猎人如何升级?\n猎人目前最高有22级,要让猎人升级,就必须练技能!技能熟练度满70%了就会自动升1级,并送你1点技能点数让你学习其他技能!\n\n●技能熟练度没满70%也会升级,这是为什么?\n这是因为只要你学的技能全部熟练度加起来够70%了就会升级!如追寻敌踪90%,回避战斗只需要再练到50%就会升级!\n\n\n      〓第二部分:猎人技能〓\n\n●猎人技能目前只开放15个技能,其中1级技能7个,2级技能8个!详细如下:\n\n⑴1级技能\n学习地点:追猎者公会(13.19)\n\n【追寻敌踪】:提升遇敌机率(1000)\n【驯服宠物】:提升捕获率,提升到一定等级可抓特殊宠(1000)\n【陷阱】:以陷阱反伤害物理攻击(1000)\n【弓熟练度】:增加装备弓的伤害力(1000)\n【精通回力镖】:增加装备回旋标的伤害力(1000)\n【精通投掷石】:增加装备投掷石的伤害力(1000)\n【精通投掷斧】:增加装备投掷斧的伤害力(1000)\n\n⑵2级技能\n学习地点:加鲁卡(439.903)\n\n【回避战斗】:减低遇敌率(100000)\n【挑拨】:使对方宠物不听使唤(100000)\n【弱点攻击】:针对宠物弱点加以攻击,加强伤害力(100000)\n【树根缠绕】:降低敌敏捷(100000)\n【火抗性】:提升火焰抗性(200000)\n【雷抗性】:提升电雷抗性(200000)\n【冰抗性】:提升冰冻抗性(200000)\n【毒素武器】:让武器附上毒素使被击中之敌人中毒(100000)\n\n●猎人技能实际效果如何?\n1.\"尸体掠夺\"技能并没开放!\n2.\"驯服宠物\"可以抓到的特殊宠并没开放!\n3.猎人技能的费气程度不随熟练度而增加!\n4.猎人的技能分四种\n⑴追猎效果技能:追寻敌踪,回避战斗,驯服宠物\n⑵自然提升技能:弓熟练度,精通回力镖,精通投掷石,精通投掷斧\n⑶辅助效果技能:陷阱,挑拨,树根缠绕,火抗性,雷抗性,冰抗性\n⑷战斗效果技能:弱点攻击,毒素武器\n\n这是我的12级追猎者\n\n\n下面为猎人技能的实际效果和费气情况\n\n\n01.追寻敌踪[辅助]-----------遇敌速度加快(MP:13)\n02.回避战斗[辅助]-----------降低遇敌机率(MP:13)\n03.驯服宠物[辅助]-----------相当于抓宠时吃了水果蛋糕(MP:10)\n04.弓熟练度[辅助]-----------增加弓类武器攻击力,弓箭本身攻击越高,熟练度越高,附加的攻击越多(MP:0)\n05.精通回力镖[辅助]---------增加标类武器攻击力,回旋标本身攻击越高,熟练度越高,附加的攻击越多(MP:0)\n06.精通投掷石[辅助]---------增加石头类武器攻击力,石头本身攻击越高,熟练度越高,附加的攻击越多(MP:0)\n07.精通投掷斧[辅助]---------增加投掷斧头类武器攻击力,投掷斧本身攻击越高,熟练度越高,附加的攻击越多(MP:0)\n08.陷阱[辅助]---------------反弹400血(MP:11)\n09.挑拨[辅助]---------------30%熟练度,减12%攻12%防12%敏,混乱效果(MP:17)\n10.树根缠绕[辅助]-----------14%熟练度,减34%敏(MP:13)\n11.冰抗性[辅助]-------------需发动才有效果,88%熟练度损血减半(MP:14)\n12.雷抗性[辅助]-------------需发动才有效果(MP:14)\n13.火抗性[辅助]-------------需发动才有效果(MP:14)\n14.弱点攻击[战斗功能]-------60%熟练度,减15%敏(MP:9)\n15.毒素武器[战斗功能]-------有机率让对方中毒,中毒5回合(MP:5)\n\n\n【说明】\n01.四种间接武器熟练度增加的攻击力必须打完一场才会显示,刚装备上去不显示!\n02.陷阱的损血一律为400,不管对方多少攻!效果2回合,2回合没打中,陷阱效果消失!\n03.冰雷火抗性只有发动才有抗性,跟魔法戒指抗性不一样!另外还有回合限制!\n04.拿间接武器使用毒素武器时只有一个目标中毒,不会全部中毒!\n05.挑拨和弱点攻击对人无效!\n\n疑难解答:\n\n●猎人要学激怒宠物需要哪些技能?\n我们分析一下这张猎人技能限制图:\n\n学激怒宠物前提为:遗忘,弱点攻击(2技)\n学遗忘的前提为:回避战斗,挑拨(4技)\n学回避战斗的前提为:追寻敌踪(5技)\n学挑拨和弱点攻击的前提为:驯服宠物(6技)\n\n因此学激怒宠物的前提必须学6个技能!加上激怒宠物就7个技能!\n\n●猎人22级不是有22个技能吗?那不是所有的技能都可以学?\n猎人22级是有22个技能点数,但是不是所有的技能都可以学就不清楚了!因为猎人的三,四级技能并没有开放!目前猎人可以学到的只有15个技能!建议全部学!\n\n●为什么有时候我用追寻敌踪技能打灵石,很久才显示\"技能效果结束\"?\n这是因为你用快速战斗,系统无法算出你战斗的时间,所以会很久才显示,如果你进入战斗画面打,一会儿就会显示!\n\n●为什么冰雷火三种抗性不会像抗魔值一样显示抗性提升为XX呢?\n这是因为这三种抗性不是被动的,加上人物状态明细里面并没有这三种抗性的显示,所以不会显示抗性提升!\n\n●为什么我拿石头,投掷斧用毒素武器攻击的时候可以仍全体?\n呵呵,恭喜你,这就是就职猎人的好处啊!比乱射弓效果强!还能多拿个盾牌!不过,很容易卡机,慎用!\n\n●猎人如何修炼技能?\n1.追寻敌踪,回避战斗技能在竞技场护士旁一直点就可以了!\n2.驯服宠物,陷阱,挑拨,树根缠绕,火抗性,雷抗性,冰抗性,弱点攻击,毒素武器这9个技能都可以在阿布洞找阿布三兄弟练,魔法设置打自己就可以!\n3.弓熟练度,精通回力镖,精通投掷石,精通投掷斧这四种熟练度必须打出星星来才会提升!建议单人去小猪岛原地挂!练这4个技能的时候最好带力击之戒,爆星率比较高!\n\n●猎人的学习顺序是什么?\n这只是建议,不一定要按照这个来学习!不过第一个猎人技能学追寻敌踪绝对没错!\n\n追寻敌踪-→回避战斗-→驯服宠物-→陷阱-→挑拨-→精通投石-→冰抗性→毒素武器-→-弱点攻击-→树根缠绕-→精通投斧-→火抗性-→精通弓箭-→电抗性-→ 精通标类\n"
