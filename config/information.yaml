      content: "滋润3戒指或手镯，推荐：玄黄任务分支\n治愈3戒指或手镯，推荐：猜谜3兄弟任务\n\n这里所说的玄黄任务和深红任务，只是为了得奖品的分支任务，只要进得了玄黄洞窟，深红洞窟，就可以做滋润3和治愈3得奖品.跟玄黄和深红转生无关\n\n■我所得到过奖品的任务（已验证）\n\n猜谜3兄弟任务：\n哈鲁Lv3的戒指（魅力+3 治愈的精灵Lv3） 耗气11/100 耐久力回复320（自己）\n哈鲁Lv3的手镯（攻+2 防-1 魅+2 治愈的精灵Lv3） 耗气11/100 耐久力回复320（自己）\n\n深红任务分支：\n哈鲁Lv3的戒指（魅力+3 治愈的精灵Lv3） 耗气11/100 耐久力回复320（自己）\n哈鲁Lv3的手镯（攻+2 防-1 魅+2 治愈的精灵Lv3） 耗气11/100 耐久力回复320（自己）\n\n不用等待加入『巴拿姆湖的带路人』，道路是可以顺移的\n多洛加出现地点：需找多洛加2次，可原地登出找其他服\n1.另一头的深红的洞窟地下５楼（31,34）\n2.深红的洞窟地下８楼（29，69）\n3.自己找吧…………\n\n玄黄任务分支：\n芙蕾美雅Lv3的戒指（魅力+3 滋润的精灵Lv3） 耗气16/100 耐久力回复260（单人）\n芙蕾美雅Lv3的手镯（攻击-1 防御+1 魅力+1 滋润的精灵Lv3） 耗气16/100 耐久力回复260（单人）\n需要抓布鲁顿，福村外（351，342）一带\n\n\n■我未验证的任务：\n水田迷宫－切绳石 芙蕾美雅Lv3的手镯（攻击-1 防御+1 魅力+1 滋润的精灵Lv3） 耗气16/100 耐久力回复260（单人）\n碧清任务－水苍之贝\n深红分支－“迪欧Lv2的戒指”攻＋2，防－2，魅＋3，恩惠的精灵 Lv2\n\n\n\n猜谜3兄弟任务脚本『水天飞翔』帖子里有呀！http://bbs.boxbbs.com/1684/1683400.html\n深红脚本，我的帖子里http://bbs.boxbbs.com/1683/1682928.html\n猜谜3兄弟任务脚本去XP脚本区下载改良版本吧！http://bbs.sachxp.com/NowTopic.aspx?forum=4&forumpage=1&topic=68551\n\n\n玄黄14楼－6楼的脚本（XP脚本，很简陋，先用着了）\n地图 11215\n坐标 8,11\n坐标 9,13\n坐标 9,16\n延时 300\n坐标 9,17\n\n;玄黄的洞窟地下１４楼\n地图 11214\n坐标 38,41\n坐标 34,42\n坐标 31,44\n坐标 28,45\n坐标 25,45\n坐标 19,45\n坐标 16,45\n坐标 13,45\n坐标 10,43\n坐标 10,39\n坐标 11,35\n坐标 11,31\n坐标 11,27\n坐标 11,23\n坐标 11,19\n坐标 14,17\n坐标 18,17\n坐标 22,17\n坐标 26,17\n坐标 30,17\n坐标 34,17\n坐标 38,17\n坐标 42,17\n坐标 44,17\n延时 300\n坐标 45,17\n\n;玄黄的洞窟地下１３楼\n地图 11213\n坐标 45,26\n坐标 45,26\n坐标 44,29\n坐标 43,32\n坐标 43,34\n坐标 43,38\n坐标 42,44\n坐标 39,45\n坐标 36,45\n坐标 33,44\n坐标 29,44\n坐标 25,43\n坐标 22,42\n坐标 21,39\n坐标 20,36\n坐标 19,36\n坐标 17,34\n延时 300\n坐标 17,33\n\n\n;玄黄的洞窟地下１２楼\n地图 11212\n坐标 25,34\n坐标 23,32\n坐标 22,28\n坐标 19,28\n坐标 16,29\n坐标 15,29\n坐标 10,32\n坐标 7,33\n坐标 5,36\n坐标 5,40\n坐标 8,43\n坐标 12,45\n坐标 17,45\n坐标 22,44\n坐标 23,44\n坐标 33,44\n坐标 38,43\n坐标 40,41\n坐标 43,37\n坐标 43,33\n坐标 43,29\n坐标 43,28\n坐标 39,27\n坐标 35,26\n坐标 33,26\n坐标 32,23\n坐标 31,21\n坐标 30,18\n坐标 30,17\n坐标 29,12\n坐标 28,9\n坐标 25,7\n坐标 23,5\n坐标 21,5\n坐标 18,5\n坐标 15,6\n坐标 14,6\n延时 300\n坐标 14,5\n\n;玄黄的洞窟地下１１楼\n地图 11211\n坐标 5,10\n坐标 8,7\n坐标