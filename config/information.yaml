      content: "原创：海锋天使\n\n\n　本人不才，我是在石器3.0的时候就开始玩的，但到现在才做我自己的第一件灵力凯。\n\n　　首先，先讲讲我做之前的准备，昏睡爪(福村有得卖)，双头叉(平时补血用)，心环，单转(就是彩虹的精灵，福村也有得卖)，灵力凯(朋友借的)，苍兜(105防，+20气)，我用的宠物是128级5.7左右的NONO机，还有就是121级6.6加古特，做之前最好先用一个帐号料理几个+5忠的罐头，我自己在做的时候就用了6个。\n\n　　我就是用这些东西就去做的了，打原石是地水火风都是遇到3个或者以下的75级精灵就打，多于3个我逃，先放NONO机出来打，人就是用昏睡，NONO机死了就放加古特，只要NONO机的忠诚在20以上是不用帮他加忠的，一低于20就要+忠的了，要不是逃了我不负责的哦。打火的时候就要用单转转没有睡的那个精灵。这样每种属性的精灵大4至6次就有原石的了，担保不用半小时就打够，之后就是打宝石，打宝石时，地水风遇到3个或者以下的85级精灵都可以打，而火的就要遇到1或2个才能打，要不是你的人飞了我也帮不了你的哦，打火的时候还是单转没有睡的那个，这样很快你就会打够宝石的哦。按我这方法你肯定在90分钟内完成灵力凯。\n"
