      content: "【作者：yuhuashi】\n转载于BOX权威论坛yuhuashi帖\n==========================================================================================================\n【三大职业技能限制说明】\n\n1． 每一职业拥有三至四级的技能，越高级的技能限制越多。\n2． 一级技能限制职业等级1以上的人物才可学习，二级技能限制职业等级2以上的人物才可学习，依此类推。人物就职后会有一点的技能点数，职业等级每升一级，就会获得一点的技能点数。一点的技能点数可学一项技能。\n3．一个人物最多可拥有16点的技能点数。\n4．学习技能之后无法取消重新选择，请小心选择学习。\n5．白狼勇士的技能：枪熟练度、斧熟练度、棍熟练度，必须打到对方冒星星才会增加；闇灵法师的技能：火焰熟练度、冰气熟练度、雷电熟练度，只要使用就会增加；追猎者的技能：精通投斧、精通投石、精通镖类、精通弓箭，必须打到对方冒星星才会增加。\n==========================================================================================================\n【暗灵法师】技能限制表\n\n使用范例：\n　1． 假设玩家想要学二级的技能“冰气熟练度”，则必须事先学会一级既能“冰附体”，其熟练度需达70以上。\n2． 假设玩家想要学三级的技能“一针见血”，则一开始时就必须学会一级技能“移形换位”与“嗜血成性”，且熟练度达70以上，接着学会二级的技能“嗜血蛊”，当熟练度达70以上时，就可以学“一针见血”。\n3． 假设玩家想要学习三级的技能“冰暴术”，则一开始就必须先学会一级技能“冰箭”且熟练度达70以上，接着学会二级的技能“冰镜术”再加上一级的“冰附体”，两者熟练度达70以上时，就可以学“冰暴术”。\n4． 假设玩家想要学三级的技能“附身术”，则必须学会四项一级的技能“火附体”、“雷附体”、“冰附体”、“移形换位”，且四项技能熟练度需达70以上。\n\n各种职业共通技能表\n自我强化 负重增加 气力充沛\n\n暗灵法师职业技能\n火山泉 冰附体 附身术 嗜血成性 火魔法熟练度\n火星球 暴风雨 冰爆术 移形换位 雷魔法熟练度\n嗜血蛊 雷附体 召雷术 针针相对 冰魔法熟练度\n火龙鍶 冰箭术 火附体 冰镜术 世界末日\n电流术 冰镜术\n\n==========================================================================================================\n【追猎者】技能限制表\n\n使用范例：\n1． 假设玩家想要学二级的技能“毒素武器”，只要学会“精通投斧”、“精通投石”、“精通镖类”三项一级技能其中一个，且其技能熟练度达70以上，就可以喽。\n2． 假设玩家想要学三级的技能“遗忘”，则必须学会一级的技能“追寻敌踪”与“驯服宠物”，当二者熟练度达70以上时，就可以接着学习二级技能“回避战斗”与“挑拨”，其技能熟练度达70以上时，就可以学“遗忘”。\n3． 要学“尸体掠夺”则需要职业等级5级以上才可学习。\n\n各种职业共通技能表\n自我强化 负重增加 气力充沛\n\n追猎者职业技能技能\n追寻敌踪 回避战斗 回旋标熟练度 火焰抗性提升\n驯伏宠物 弱点攻击 电雷抗性提升 投掷斧熟练度\n弓熟练度 毒素武器 冰冻抗性提升 投掷石熟练度\n天罗地网 尸体掠夺 陷阱 遗忘\n树根缠绕 激怒宠物 挑拨\n\n==========================================================================================================\n【白狼勇士】技能限制表\n\n使用范例：\n1． 假设玩家想要学二级的技能“二刀流”，则事先就必须已经学会“连环攻击”与“盾击”，且这两项一级的技能熟练度需达70以上。\n2． 假设玩家想要学三级的技能“座骑攻击”，只要学会“枪熟练度”、“斧熟练度”、“棍熟练度”三项二级技能其中一个，且其技能熟练度达70以上，就可以喽。\n\n各种职业共通技能表\n自我强化 负重增加 气力充沛\n\n白狼勇士职业技能技能\n连环攻击  能量聚集  回避   专注战斗\n暴击  格挡  双重攻击  贯穿攻击\n舍已为友  回旋攻击  激化攻击  混乱攻击\n状态回复  斧熟练度  二刀流  濒死攻击\n枪熟练度  棍熟练度  盾击  座骑攻击\n\n=========================================================================================================="
