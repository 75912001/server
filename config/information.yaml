      content: "一、一个人物，无论转生多少次，只能转生一只宠。\n\n二、在没有转生宠前，玛蕾菲雅喜欢的项链掉了可重拿，只要在鱼村村长\n家旁和婆婆说话就行了。\n\n（已完成转生宠不能重拿项链）\n三、转生宠的成长问题：\n\n　　1、玛蕾菲雅各种能力达到最高，是转生宠成长最好的最重要条件。\n\n　　根据一：按华义工程师说：“精灵少女的最后的成长率将会直接影响\n到宠物转生后的成长率，所以在养育的过程中，要格外地小心喔，万万一\n不小心挂了，记得多补点灵石。”\n　　根据二：按华义工程师说：“宠物转生的设计与二代宠的强弱设定有\n直接的关系。从以前就有许多人问酷哥，二代宠是否会比一代宠要强？从\n设计新任务的角度来说，答案当然是肯定的。 一代宠不是注定要成为垃\n吗？为了给一代宠一个机会能成为与二代宠相匹敌的强宠，所以才会设计\n一个宠物转生的过场任务。”\n　　以上是华义工程师所说，绝非凭空乱说。\n\n    如果玩家不让玛蕾菲雅各种能力达到最高就转生宠物，也只能是二代宠\n的垃圾、一代宠的极品。\n　　2、要转生的宠的级数越高，转后成长越高，建议用１２１以上的全属\n性宠转，以上结论已得网上大部分玩家证实）。\n　　3、转生宠的成长与运气密切相关，请大家算好命再转生宠物。\n\n　　4、在做转生宠任务时，请按中篇攻略顺序完成（请大家尽量避免非法\n进入漆黑、封印迷宫、英雄岛，以上因素会令玛蕾菲雅的能力出现意想不到\n的变化，我有好朋友没转生宠就非法进封印迷宫，在玛蕾菲雅所有能力达\n到最高，而到最后转去一个成长4.2的黄虎令我太难受了，一周打灵石的时\n间白费了）\n。\n四、玛蕾菲雅掉了不能重拿。\n\n五、玛蕾菲雅千万不要交给其它人练，否则她会不认你。\n\n六、玛蕾菲雅未上７９级可以进行人物转生，也可以完成整个转生宠物和\n黑暗精灵王任务（转生后成人掉了项链可按第二点方法重拿）。\n七、玛蕾菲雅未７９级成功转生宠后，可以进行人物转生，也可以完成整\n个转生宠物和黑暗精灵王任务。\n八、玛蕾菲雅无论练到多少级都可打灵石做项链提高玛蕾菲雅的各种能力。\n\n九、玛蕾菲雅请勿在战斗中死亡，玛蕾菲雅在战斗中死亡会影响她本人和\n转生宠的成长。\n\n十、带玛蕾菲雅恢复记忆的重要坐标补充\n\n10级带去北岛萨村看萨姆吉尔神像（北岛 637,493）\n\n15级带去北岛卡坦村 （出发点：萨村-->259,172）\n20级带去北岛柯尔克村（出发点：萨村-->柯尔克通路318,428-->3楼-->4\n3,48 进村）\n25级带去现代波拉岛爱丽儿基地（出发点：鱼村-->奇努伊村--> 米兰达\n224 430）\n30级带去南岛卡鲁它那村(出发点：加加村-->30,600)\n35级带去南岛拉多拉回廊（出发点：加加村-->501,647)\n40级带去南岛乌鲁力村(出发点：加加村-->517,776)\n45级带去南岛碧青洞窟1楼(出发点：加加村-->73,697）\n50级带去南岛森林洞窟顶楼（出发点：加加村-->452,162 ）\n55级带去沙姆岛（出发点：鱼村-->奇努伊村加美航空附近）\n60级带去小象洞（出发点：福村-->石头洞穴 247,223-->吉鲁采石场 239\n.98）\n65级带去飞龙洞 (出发点：福村-->石头洞穴 247,223-->门的洞窑 121 1\n70-->最后一层 (出口是花的世界,在这里玛蕾菲雅送的三朵花可掉，如果你要接着做２转ＭＭ任务，可以尽量不要把３朵花仍掉，仍掉只能去飞龙洞２Ｆ从新打了)\n70级带去没落矿坑（出发点：福村-->没落矿坑 443,495）\n75级带去北岛通往吉鲁和南岛的水池 （出发点：鱼村-->奇努伊村进入海\n底的水池）\n79级带去漆黑20楼精灵王那里（出发点：福村-->石头洞穴 247,223-->门\n的洞窑 121 170-->漆黑108 266-->20楼）\n十一、总结：最好的转生宠条件\n\n1、玛蕾菲雅各种能力达到最高；\n\n2、玛蕾菲雅在战斗中从没死亡过；\n3、要转生宠的级数成长越高越好,建议121以上（年兽除外）；\n4、做任务时候没非法进入漆黑、封印迷宫、英雄岛；\n5、小吉以上，带运+5或萨尔吉姆首饰去转生宠。\n自从我完成精灵王传说--精灵少女篇图文攻略（中篇），在网上争议纷纷\n，但通过我多位朋友和网上玩家的转生宠经验，我始终坚持我的以上看法\n，转生宠的任务存在着多种因素的影响，再次提醒玩家：请大家尽量避免\n非法进入漆黑、封印迷宫、英雄岛，以上因素会令玛蕾菲雅的能力出现意\n想不到的变化，而直接影响转生宠的成长。"
