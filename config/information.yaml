      content: "添加修改：BOX_ｙｕｈｕｓｈｉ\n==================================================================\n石器装备道具修复总汇\n作者：BOX_GOSOKO\n\n修复技能使用方法：\n1右键点选道具栏中所需修复的装备或道具，出现“修复”字样\n2继续右键点选道具栏中相对应的修复素材，出现“修复”字样，宠栏自动弹出\n3点选有修复技能的宠物，选择宠物技能栏，点选修复\n4等待修复完成\n\n注：修复技能成功率为100%\n    任何宠物可学习修复技能\n    修复技能学习地点为：伊甸园宠店；风城宠店；地城宠店；火城宠店；水城宠店\n    如遇到物品不出现修复字样,可以尝试用1.82水果合成法的形式修复\n==================================================================\n表一  修复技能适用范围\n┌───────────┬───────┬───────┬─────────┐\n│无法使用修复技能修复类│受损（装备名）│毁坏（装备名）│不堪使用（装备名）│\n├───────────┼───────┼───────┼─────────┤\n│       补救方法       │阿布水合成修理│阿布水合成修理│  阿布水合成修理  │\n└───────────┴───────┴───────┴─────────┘\n┌───────────┬───────┬───────┬─────────┐\n│可以使用修复技能修复类│装备名（受损）│装备名（毁坏）│装备名（不堪使用）│\n├───────────┼───────┼───────┼─────────┤\n│       修补方法       │相对应素材修复│相对应素材修复│  相对应素材修复  │\n└───────────┴───────┴───────┴─────────┘\n3.0之前坏过的黄字装备不能修,只会出现[合成]2字,不会出现[修复]2字\n\n3.0之前坏过的黄字装备到4.0再坏多一次的装备,修复好之后依然是毁坏\n,只不过没了后面括号里那个（受损）（毁坏）,其装备起的能力也是毁\n坏时状态,建议毁坏(XX)的装备不要拿去修复了\n4.0之后坏过的装备全部都是在 装备名+( 文字 )\n\n黄字受损 不能用修复技能修复\n黄字毁坏 不能用修复技能修复\n受损(受损) 可以用修复技能修复\n毁坏(受损) 可以用修复技能修复\n受损(毁坏) 可以用修复技能修复\n毁坏(毁坏) 可以用修复技能修复\n\n注：阿布水合成修理具一定风险\n    各类装备道具修复相对应素材详见表2\n    3.0损坏毁坏的合成装备无法修复，需使用阿布水合成修理\n    6.0前因转生产生不堪使用的装备及道具无须且无法修复\n==================================================================\n表二 修复素材总汇\n\n武器\n┌────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┐\n│损坏物品│   枪类   │  斧头类  │  投石类  │  投斧类  │  弓箭类  │  棍棒类  │   爪类   │ 回旋标类 │\n├────┼─────┼─────┼─────┼─────┼─────┼─────┼─────┼─────┤\n│修补素材│   木牙   │   木石   │   石皮   │   木石   │   木线   │   木线   │   皮牙   │  石骨皮  │\n└────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┘\n\n防具\n┌────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┐\n│损坏物品│   兜类   │  防具类  │   铠类   │   服类   │  戒指类  │  手环类  │  项链类  │  耳饰类  │\n├────┼─────┼─────┼─────┼─────┼─────┼─────┼─────┼─────┤\n│修补素材│  石皮骨  │   皮线   │   皮石   │    皮    │线贝牙鳞土│  皮牙土  │   骨线   │  线贝土  │\n└────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┘\n\n首饰\n┌────┬─────┬─────┬─────┬─────┬─────┬─────┐\n│损坏物品│    光    │    镜    │   守护   │ 属性乐器 │ 净化精灵 │ Ｂ类首饰 │\n├────┼─────┼─────┼─────┼─────┼─────┼─────┤\n│修补素材│  贝线石  │  壳线石  │   骨线   │  骨线叶  │   牙线   │ 牙线骨石 │\n└────┴─────┴─────┴─────┴─────┴─────┴─────┘\n\n铜铁装备\n┌────┬─────┬─────┬─────┬─────┬─────┐\n│损坏物品│   铁枪   │   铁斧   │   铁棒   │   铜兜   │   铜凯   │\n├────┼─────┼─────┼─────┼─────┼─────┤\n│修补素材│   皮线   │   木线   │   石线   │    骨    │    皮    │\n└────┴─────┴─────┴─────┴─────┴─────┘\n\n\n海底精工装备\n\n焰红之斧 线      苍绿之斧 线木   湛蓝之斧 线木   岚黄之斧 木\n焰红之枪 线皮    苍绿之枪        湛蓝之枪 皮     岚黄之枪 线\n焰红之棍 线石    苍绿之棍 石     湛蓝之棍 石     岚黄之棍 线石\n焰红之兜 皮      苍绿之兜 皮     湛蓝之兜 皮     岚黄之兜 皮\n焰红之铠 皮      苍绿之铠 皮     湛蓝之铠        岚黄之铠 骨\n\n海蓝套装\n┌────┬─────┬─────┬─────┐\n│损坏物品│ 海蓝之兜 │ 海蓝之凯 │ 海蓝之棒 │\n├────┼─────┼─────┼─────┤\n│修补素材│    皮    │    皮    │   木线   │\n└────┴─────┴─────┴─────┘\n\n特殊装备\n┌────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┐\n│损坏物品│ 魔法钻戒 │   镜弓   │  灵气帽  │心环  力环│ 海贼左手 │  熔岩斧  │  灵力铠  │\n├────┼─────┼─────┼─────┼─────┼─────┼─────┼─────┤\n│修补素材│ 成品钻石 │   木线   │   皮骨   │  石皮土  │   皮牙   │ 萨村换取 │ 萨村换取 │\n└────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┘\n┌────┬─────┬─────┐\n│损坏物品│   光枪   │  双头叉  │\n├────┼─────┼─────┤\n│修补素材│   木牙   │ 萨村换取 │\n└────┴─────┴─────┘\n\n无法修复类\n┌────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┬─────┐\n│损坏物品│  萨首饰  │   勾玉   │ 太阳首饰 │ 里啦啦铠 │  抗魔铠  │ 真灵力铠 │  仪之兜  │   花圈   │\n├────┼─────┼─────┼─────┼─────┼─────┼─────┼─────┼─────┤\n│修补素材│ 无法修复 │ 无法修复 │ 无法修复 │ 无法修复 │ 无法修复 │ 无法修复 │ 无法修复 │ 无法修复 │\n└────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┴─────┘\n\n【蛇之套装】     【森林套装】       【巨熊套装】\n 蟒蛇之冠    骨    森林头盔           巨熊头盔  皮\n 双头蛇之铠  皮    森林炼甲           巨熊之铠\n 灵蛇扣带          森林皮带           巨熊皮带  土\n 响尾蛇之靴        森林之靴           巨熊之靴\n 青蛇之杖    木    森林木弓           巨熊石剑  木牙\n                                      巨熊匕首  牙\n==================================================================\n【精灵武器最终修复秘籍】 作者：BOX_河童X\n\n任何精灵武器都有对应的物品可以修复他。没带精灵的武器只能用1级的素材\n去修复！\n\n武器精灵 - 对应修复物品\n猛毒/毒雾-解毒的热带性植物\n睡眠/昏睡-解除睡眠的海边植物\n石化/硬化-解除石化的潮湿地带植物\n混乱/混迷-解除混乱的平原植物\n酒醉/酩酊-解除酒醉的干燥地带植物\n\n以上材料在各大陆的各村庄的医院有售.\n此修复方法只是为了方便练级的人能及时的修理武器装备,不需大老远跑到萨\n村去.但同时,有空到萨村去的人也能在萨村修理.\nPS:凯\\服带滋润.恩惠.治愈精灵的用气瓶修.\n\n萨姆吉尔首饰暂时没有修复办法,损坏了的玩家只能重新做任务或者去市场换\n回来\n=================================================================="
