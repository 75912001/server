      content: "◎任务条件：完成思念故乡的贝克任务（当然完成此任务也要完成其他很多的任务了！）\n◎任务奖品：宠物学习书（强化技能）和红色飞龙赫古德（可选）\n◎任务流程：\nstep1：前往瑞尔亚斯之都的（32，44）进入瑞而亚斯的研究院，跟研究者梅屋·塔夫接任务，得知要寻找另外2片文章，得知被2位盗墓者所盗，而其中一位已死，之后来到瑞尔亚斯之都的（46，50），跟祭司爱津对话，拿到结界绳，进入黄泉之境（晚上才能进入的，注意，原登会回到瑞而亚斯之都）\n\nstep2：从黄泉之境的（23.69）进入“鬼王”的所在地，挑战它，可以得到研究书第五章（此处可省略，只不过会拿不到1级红色飞龙赫古德而已）\n\nstep3：在黄泉之境（12.10）（35.12）（82.11）（68.10）找黄泉大头鬼（打黄泉小鬼，会掉落钥匙，之后才能与其对话，然后与其战斗）\n\nstep4：来到贼窝亚曼塔（4个房间只有1间是正确的，拿过之后会换房间），拿到“家书”，接着来到瑞尔亚斯之都的（39，86）进入民房找可娜丝，拿到研究书第五章，交出“家书”、“结界绳”（若之前打鬼王拿到研究书第五章的话，就可以在这拿到1级红色飞龙赫古德）\n\nstep5：来到瑞尔亚斯之都的（32，44）进入瑞尔亚斯的研究院，跟研究者梅屋·塔夫对话，拿到宠物学习书（强化技能）\n\nstep6：任务完成（强化技能的用途，可以看上面，有详细的解释哦！）"
