      content: "也是石器时代8。0所新增的一个新游戏，规矩其实不用我多说，就是和大家平时玩的宾果差不多嘛，只不过是在石器里玩而已，下面就让我们来了解一下怎么玩的吧（附送给平时不怎么赌博的石器玩家，呵呵）\n\n◎游戏的玩法：首先挑选自己喜欢的动物，将彩卷丢在宠物周围的格子里，管理员会广播游戏开始与结束，是不是很简单呢？\n◎胜负的判定：如果转出的宠物与你所押的相同，我们就会发送给你积分，反过来说，如果全部都没押中，也会依照所压数量来扣除你的积分！\n◎若是我押中一只宠物：如果只出现一只宠物与所押相同，则会给予彩卷X1的赔率，（例如:在黑乌力押三张彩卷，转出(吉比)(黑乌力)(里拉拉)，就只会得到三点积分）如果所压的宠物都没有出现，我们就会扣除所压数量X1的积分（例如:在吉比押两张彩卷，转出(乌力王)(里拉拉)(黑乌力)，就会扣掉两点积分）\n◎若是我押中两只宠物：这样的状况下，会先进入幸运转转轮，庄家会使其中一只宠物再次变化，变化结束后才依照结果给予积分。若押的宠物出现两只，则给彩卷X2的积分。\n◎若是我押中三只宠物：这样将会赔给您对应比率的积分（黑乌力 1：3/卡拉龟 1：5/吉比 1：8/里拉拉 1：12/贝沃特 1：15/布拉奇多斯 1：20/乌力王 1：25/雷恩巴肯 1：30）\n◎若是我转出三颗宠物蛋：若连线出现了三颗宠物蛋，则三只宠物会重新转动，转动的结果一定会继续三连线，这样的状况可说是最幸福的时光呀！\n◎若是我押彩票后反悔：若押错位置,或是想改押别只宠物，只要游戏尚未开始，都可以自由的拾回彩卷了。\n◎若是我押彩票后擅自离场：押彩票后若不等游戏结束就擅自离场，我们将会是同您作弊，将直接扣除您所压票数X1的积分，请多加留意！"
