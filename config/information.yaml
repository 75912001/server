      content: "条件:\n●一男一女!\n●等级为40级以上!(30级神秘人会说你太小了，很多秘密不\n能告诉你）\n●带4个气和一个萨姆吉尔首饰!空10个位!首饰装备太阳神的首饰!\n\n先走到萨村外的(566.478)会看到一个\"神秘人\",跟他说话进入\"缘分占卜师的房间\"来到(18.14)找\"缘分的占卜师\"测试!\n\n2人先进行占卜测试,测试完会得到一样信物,有ABCD四种!得到相同的信物后,再进行配对!第一个人先去配对,会新增加配对名单,另外一个人也去配对,会向第一个人发出请求!第一个人点\"OK\"的话,两人就组队进入\"药师群岛\"\n\n到药师群岛的(72.40)找比达比达,跟他说话他会给你一根\"燃烧的线香\"叫你送去给他弟弟!\n\n通过一条水路迷宫来到(136.65)给比达可比,他会叫你去药草农场打\"药草\"!需要1级药草2棵,2级药草3棵,3级药草3棵共8棵!\n\n这里的怪物为50级的飞机头(鲍,卡克尔,卡拉卡利,巴克)打50级的药草才会掉解毒药草!\n\n在这里不能补血补气!\n药草如下:抗毒的药草1，抗毒的药草2，抗毒的药草3，\n\n拿到药草后就从(47.140)进入水路!会遇敌,敌人为38,39,40级的姆依和海主人!\n\n来到(82.160)跟达可特的大弟子(解毒圣手)说话,他帮你解毒!并把你传送到四师弟那里\n\n来到(89.129)找达可特的四弟子说话,会得到15个药罐!他叫你把药罐给他二师兄!途中会有50级的小偷来偷药罐!只要送13个就行了!没了可以回去再拿!\n\n通道一条水路来到花园迷宫,按照黄色花的摆色走就行了!走到(126.142) 达可特的二弟子说话,他会传送你去见他师傅!\n\n来到(128.166)跟达可特说话进入花园的药罐拿聪明的豆子4或者聪明的豆子5![我两次都拿到豆子4,郁闷]\n\n之后跟旁边的三弟子说话就回到缘分占卜师的房间了! 任务结束!!!!\n\nPS：此任务可无限解!"
