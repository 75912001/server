      content: "任务限制：解完古瓜任务、地成盐矿任务、梦幻洞窟（需拿到三样梦想装备）\n\n一开始前往地城区东北方找沙尔特的助手（１２．１４）说话 他会要你抓８２级以上的白色大象（玛恩摩洛斯）给他\n抓给他，他会跟你说最近他们的团长消失了（会收走白象）再前往塔耳塔战士团找汉斯说话\n他会要你寻找地精灵并给你激活石\n\n再前往沙姆岛梦幻洞窟找梦见的仙人说话\n他会要你去伊甸大陆南方的一处石头排列处寻找答案（去看提示这段可以不用去）\n然后再到塔耳塔地城练功区的洞口前（千万不可省略去找梦见仙人这个步骤，不然石像不会理你）\n找神秘巨石神像说话就可进去地精灵洞窟 地精灵洞窟的机关是 由下而上顺序点选１．２．４．８个石像\n\n\n拿着黄色宝珠跟左上方的机关说话 就可前往地精灵之处 见到地精灵跟地精灵说话\n他会要你寻找塔耳塔战士团的团长跟威灵石 前往伊甸园的地下洞窟的贫民窟\n跟席巴恩说话就可到英嘉的房间 跟英嘉说话他就说要你跟他一起去监狱拯救团长并会要你把一封信交给席格\n到贫民窟旁边的洞窟跟守门员说话可以去找席格 跟席格说话他会说他也要赶去并把信收走\n前往伊甸园区的新洞窟（１０２．１２７） 跟站在洞口的汉斯说话 就可进去监狱\n跟里面的监狱卫士开战 卫士有５个 他们虽然蛮嫩的 但是他们会互相替对方或自己补血 最多补到２ｘｘｘ\n所以要赶快让他们死 打完之后 跟站在牢房里面英嘉说话 他会跟你说战争已经结束了\n团长已经先回去塔耳塔战士团休息 并把威灵石交给你 带着威灵石再度前往地精灵所在处（记得跟汉斯拿激活石）\n把威灵石交给地精灵后 并给你奖品 本人是拿到反射之镜（单人镜之精灵防守３次）\n说不定还有其它奖品 这个任务还有额外福利 以后只要带着＂珍珠＂给地精灵\n就可以跟他换硬壳之石（单人守护精灵防守３次）"
