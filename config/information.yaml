      content: "3.0盐矿任务\n\n┌───────────────────────────────-┐\n│ 盐矿任务                                                      │\n│                                                               │\n│ 条件:完成金飞任务即可.                                        │\n│ 在伊甸园(61.60)进民房里找(8.9)盐商比兹接任务.在地城西北区(13. │\n│ 12)跟沙尔特说话.他会说他有心脏病.你就帮忙他到森林洞窟顶楼找哈 │\n│ 罗山医生取药.                                                 │\n│ 注意:要取药时记得先去塔姆塔姆村接任务.可按此参考.             │\n│ 药拿到哈罗的香草再去找沙尔特.他为了感谢你的辛劳而送你采盐证.  │\n│ 再至沙尔特後方(24.5)与守卫杭得说话.进入盐矿区能遇上Lv80以上的 │\n│ 岩盐.取到盐岩後再回伊甸园(61.60)进民房里找(8.9)盐商比兹.他会  │\n│ 跟你要采盐证.收走采盐证.却没给你任何东西.而身上的岩盐再到旁边 │\n│ (11.5)找伙计换钱.                                             │\n│                                                               │\n│ 岩盐又分好坏.                                                 │\n│ 岩盐(低级):200S                                               │\n│ 岩盐(中级):400S                                               │\n│ 岩盐(高级):800S                                               │\n│                                                               │\n│ PS.需要再解的话再拿哈罗的香草再跟沙尔特换采盐证吧!            │\n└───────────────────────────────-┘"
