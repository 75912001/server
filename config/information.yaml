      content: "积分       礼物       用途\n10-----烟火礼盒(男生)===================男生烟火\n10-----烟火礼盒(女生)===================女生烟火\n20-----烟火礼盒(宠物)===================宠物烟火\n30-----变身镜LV2===================变身成自己的宠物两分钟\n50-----雪球===================使用后会下雪人\n80-----爱的罐头===================增加宠物忠诚度 约20上下\n120-----金飞航空机票(单)===================单人飞行至伊甸机场\n160-----金飞航空机票(全)===================全体飞行至伊甸机场\n180-----分手花束===================装备后减少１５魅力\n200-----情人花束===================装备后增加２０魅力\n220-----魔法勾玉(扣气)===================扣敌方全体的气力\n240-----魔法勾玉(加气)===================加我方全体的气力\n250-----恶魔宝石LV1===================原地遇敌3次\n480-----宠技罐头(粟子连激改)===================随机数连续投掷栗子六至八颗 波比方可学习\n580-----宠技罐头(调和)===================全体回复成无属性 玛那斯、西考方可学习\n750-----宝石礼物盒===================打开后随机得到一粒宝石\n880-----宠技罐头(配药)===================随机医治我方全体异常状态 西柏克、特利斯克方可学习\n950-----毕特腰带===================防+10体力+50运+1\n1000-----海贼王宝箱===================能换海贼王宝物的箱子\n1100-----咆孝之笛===================可使用奔雷阵 扣60气\n1150-----毕特之盾===================防+12闪避+5格挡+5%运+1\n1200-----毕特防具===================防+28 运+1 高等净化Lv1(单体)\n1350-----毕特之靴===================防+10闪避+8运+1\n1450-----毕特服===================防+36 运+1 滋润的精灵Lv5  扣24气\n1520-----宠技罐头(偷天换日)===================利用攻击空隙卸除敌方手套  贝沃特、贝恩斯方可学习\n1580-----毕特令牌===================攻+32 气+50 运+1 全体虚弱术\n1650-----宠技罐头(元气)===================回复我方全体体力 多芬、温多芬方可学习\n1800-----毕特项链===================石混睡耐性+20运+2\n2600-----雷诺夫领养书===================合资格领养雷诺夫的证明书\n3000-----小海豚领养书===================合资格领养小海豚的证明书\n\n◎毕特套装功效：装备三件(必须为毕特防具,毕特服,毕特令牌)每回合+5气\n                装备七件每回合+10气+10血"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]伊甸游乐场", "⑤伊甸新剧院"]
      content: "在3.0里面一直不开放的剧院，在8.0终于要开张了，本次伊甸新剧院开放了4个我们所熟悉的童话剧本，让玩家亲自担任角色哦。到底开放了什么？留意下表：\n白雪公主——需要组队人数：5，表演时长：150分钟\n桃太郎——需要组队人数：4，表演时长：150分钟\n三只小猪——需要组队人数：3，表演时长：110分钟\n小红帽——需要组队人数：2，表演时长：80分钟\n\n至于到底怎么玩的呢？还有新的数值——艺术值到底怎样才能获得呢？继续往下看：\n◎表演完成所的评分最高为一百分。\n◎表演前表演者有120秒的准备时间。\n◎表演者轻易系统知识进行相关的表演。\n◎表演者表演途中遇到以下情形不计分：台词讲错/动作做错及表情符号用错时/台词、动作及表情符号未在规定时间内表演出来者。\n◎台词时间60秒内、动作及表情符号时间10秒内。\n◎表演者表演途中系统位置时而自行表演者将扣分。\n◎表演时间到后系统将自动将表演者传送到准备区，战斗中的表演者，系统将不会进行传送，且失去表演资格。\n◎表演者于表演开始前或是表演途中因不明原因登出，将会失去表演资格，表演完后总分会进行扣分，一人扣20分 。\n◎入场表演者每人将收一万石币作保证金，剧院将于表演完毕后酌收二成场地费后归还，若于表演前或途中登出则保证金将不会归还。\n◎演员及观众皆依该剧演出所得评分不同，换得艺术值高低也不相同12若该剧演出得分低于60分，演员及观众艺术之将相对扣分。\n◎艺术值将可兑换伊甸剧院特制奖品。\n◎观众在观看表演时不能使用一般频道说话，请保持良好的礼貌。\n\n以上很多都是由伊甸剧院门口的那个大叔拿到的资料，我想大家都大概明白怎样玩这个新剧院的了吧，由于版位有限，某些部分我就不写太详细啦，就让大家慢慢去研究挖掘咯！"
