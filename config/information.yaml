      content: "任务条件：LV80以上，需要做完成人礼（注意成人很重要，否则你很惨）\n\n一、进入英雄岛\n\n1、到萨村村口找日美子(56.124).说话她会要你送花到鱼村给弥生（这一\n步在加加和鱼村出生不用）；\n2、前往鱼村找弥生(55.93)把花拿给他，他会送你不可思议的贝；\n3、再到萨村，前往村内(70.40)找黑乌力说话，然后可以进入拨拉岛-英\n雄岛。\n\n二、接任务，买料理品\n\n1、进入波拉岛之后，由(306.351)过桥前往(355.341)避难山洞找老爷爷(\n11.18)说话接任务；\n2、再在洞里可怜的特产商人(35,8)对她说：我非常需要胡椒，买二个胡椒\n3、一个胡椒2；\n3、再回到黑猪那里，找英雄萨母吉尔说话--灰色人物拿斧子，他会告诉你\n去水坝。\n\n三、为拿勾玉做准备：\n\n1、回鱼村，抓只乌力，学料理（如果已有就不用了）；\n2、去鱼窗鱼利店，料理，料理以下物品：\n烤猪排：大的肉+油3+胡椒3\n味道爽口的肉汤：大的肉+水3+香草3+胡椒3\n威力上升的蘑菇：香菇2+胡椒2\n有了胡椒，以上料理品都可在鱼窗鱼利店买到的；\n3、到医院买一个补血罐200，买满加气60的气瓶；\n4、一切完毕就可开始勾玉，红暴和龙王守护了。\n【建议带1个加气60的气瓶和带满+100的气瓶，这样不会被收走！】\n\n四、去水坝\n\n1、再到萨村，前往村内(70.40)找黑乌力说话，然后可以进入波拉岛-英雄\n岛；\n2、然后前进到(259.381)过桥，前往水坝洞窟(599.461) 。\n\n五、找萨姆吉尔，拿5个勾玉。（建议去人少的服务器）\n\n进入水坝，就按以下坐标顺序找萨姆吉尔：\n水坝南方洞窟(43,5)→水坝南方地下一楼(10,7)→\n水坝南方地下二楼(18,13)→水坝南方地下二楼（48,77)→\n水坝北方地下二楼(16,27)→水坝北方地下二楼（46,73)→\n水坝北方地下一楼(54,5）→水坝北方地下一楼（7,38)→\n波拉山谷(89,12)→波拉山谷（49,25）→\n波拉山顶信道(29,5)。\n\n注意（萨姆吉尔出现在按以上坐标顺序出现的，只要你跟他说话，他就会\n跑去下一个坐标，所以一般找到一个萨姆，你就成功一半了，再原地 注\n销去别的星找，如果不够，那他已在下一个坐标等你，赶快去下一坐标找\n，再原地注销去别的星找，如果服务器人不多，一般15分钟就可以找到5\n个萨姆吉尔）\n\n第一次：他会跟你要补耐久力200的药，他送你回避率上升+5的勾玉\n第二次：他会跟你要气力药60，他送你运+5勾玉\n第三次：他会跟你要烤猪排，他送你魅+5的勾玉\n第四次：他会跟你要非常爽口的肉汤，他送你复活精灵Lv1的勾玉\n第五次：他会跟你要威力上升的蘑菇，他送你光的精灵的勾玉\n\n\n 六、继续前进，打龙王，拿\n红暴和龙王守护\n\n其实在你找萨姆吉尔时，你已不知不觉上了几层楼了,这里附：水坝各层\n坐标:\n\n南方水坝洞窟出口(01.56) 下水坝1楼(55.5)\n南方水坝洞窟1楼(29.53) 下2楼入口(53.42)\n南方水坝洞窟2楼(15.84) 下水坝洞窟底层(26.15)\n水坝洞窟底层(13.191) 进北方水坝洞窟2楼(11.7)\n北方水坝洞窟2楼(44.90) 上1楼(15.19)\n北方水坝洞窟1楼(13.55) 上波拉山谷(6.5)\n波拉山谷(18.61) 进波拉山顶通路(17.10)\n波拉山顶通路(51.53) 上波拉山顶(54.5)\n波拉山顶(22.40)与黑乌力说话(36.35)进龙王洞\n龙王洞(16.49) 打龙王守护(红暴120级)(52.17)\n\n建议组队打。\n打过之后，你会看见一大排宠物迎接你的到来\n把运+5勾玉加上身，向龙王说话，拿到LV1红暴。\n再去跟他说话！他会送你龙王守护。\n\n七、拿萨姆吉尔首饰\n\n1、回萨村，和乌猪旁的爷爷(72，48)说话。\n2、再到孙女小屋(75，112)和他孙女说话，就会得到萨姆吉尔首饰（不够5\n个勾玉拿不到），还会得到英雄的祝福，可使基本点数加5，太好了。\n\n八，附注：\n\n因5勾玉一换萨姆吉尔首饰就没有了,但每转一次都可重拿，所以我个人建\n议第一次拿了勾玉留着运+5勾玉，不去换萨姆吉尔首饰，转了以后第 二\n次才换萨姆吉尔首饰，主要考虑让第一次是为了拿运+5勾玉，第二次换了\n萨姆吉尔首饰可加5使基本点数，\n\n附：\n\n萨姆吉尔首饰功能：\n\n100%逃跑\n减少不被偷袭机会\n增加出奇不意攻击的机率\n魅+5\n复活光精灵\n\n运+5勾玉功能：\n\n运气+5\n逃跑 100%\n减少不被偷袭机会\n增加出奇不意攻击的机率。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×2.0&2.5任务×", "『2.0任务』英雄岛任务-后传(详解)"]
      content: "A、预解篇：\n\n一、完成伐术任务，拿杉之手环：\n\n　　先到南岛乌鲁力村(517，766)找樵夫说话，他会要你帮他向斧职人哈恩\n拿斧头，拿着制作斧头的证书往阿鲁姆山的洞窟(396，823)前进，往下走七\n层，见到守水人，再往上面的信道（不要见人就回头走啊，是再往上面的信\n道啊,我试过看人就回头走，结果找不到哈恩），往上爬七层，终于见到哈恩\n了，哈恩虽然答应帮你制作斧头，但是却因为缺水所以得先帮他拿水，所以\n要再往回走到地下七楼装水，装完水后再回去找哈恩，他就会给你哈恩的斧\n头了，拿着斧头回去乌鲁力村找樵夫，樵夫为了感谢你会给你一张打工介绍\n书和断斧，拿着介绍书到加加村和长毛象\n\n\n快递旁的老者说话，他就会给你伐木许可证了。\n\n　　拿着许可证在加加村前右下方的红土地走，就有机会遇到叫木的敌人，\n但不会攻击你，打死他就可以得到一块「良质的木」。\n\n　　在伐木之前最好先把道具栏清空，或东西先交给朋友的，只留下一张伐\n木许可证，这样就有14个空位可以放伐到的木，再回去找塞尚谈话\n\n，他会付钱买你的木并且收回你的伐木许可证，给你一个杉之手环。\n\n二、再做伐术任务，拿伐木许可证：\n\n　　先到南岛乌鲁力村(517，766)找八封的青年（不是小人，很大个的，容\n易找）说话（这是技巧，不找他说话,樵夫不给任务你做），再找樵夫说话，\n他会要你帮他向斧职人哈恩拿斧头，拿着制作斧头的证书往阿鲁姆山的洞窟\n(396，823)前进，往下走七层，见到守水人，再往上面的信道，往上爬七层\n，终于见到哈恩了，哈恩虽然答应帮你制作斧头，但是却因为缺水所以得先\n帮他拿水，所以要再往回走到地下七楼装水，装完水后再回去找哈恩，他就\n会给你哈恩的斧头了，拿着斧头回去乌鲁力村找樵夫，樵夫为了感谢你会给\n你一张打工介绍书和断斧，拿着介绍书到\n\n\n加加村和长毛象快递旁的老者说话，他就会给你伐木许可证了。\n\n\n三、为仙人钓竿做准备，拿超级海主人\n\n再到北岛奇努伊海底隧道，打\"海主人\"或\"姆伊\"这样可以拿到\"超级海主人\n\"或\"超级姆伊\"，建议道具栏空格多一点。否则老给肉占了位置，\"超级海主\n人\"或\"超级姆伊\"反而拿不到。\n\n四、为仙人钓竿做准备，拿\"曼模竿\"\n\n　　拿着杉的手环，到南岛加加(403,253)小女孩面前，来回遇敌，可以遇到\n很多树宠，打它时会有很多不同的竿拿，直至打到一根\"曼模竿\"为完成。\n\n五、完成仙人钓竿任务\n\n到渔村或卡鲁那它找\"钓竿专家\"，他就会帮你作成仙人钓竿了。 [钓竿专家\n位置：渔村(77,109)、卡鲁那它(77,93) ]\n\n\n六、完成打矿任务，拿超特级采矿书：\n\n　　至东柯尔克的坑道[位于北岛愿藏西方(411,339)]，向门口旁的人买超\n特级采矿权利书(1000石币)后往三楼前进，在(44,23)有一个受困的矿工，\n和他说话可拿到一颗超特级矿石，之后在个受困的矿工面前原地遇敌会遇\n到超特级矿石，收集满五颗后，到五楼的办事处找老人说话就可以换超特\n级采矿鉴定书了。\n\n\n以上任务可以在2.0或1.0完成，因为1.0可以不遇敌，请各位玩家在石器2.\n0推出还有几天立刻完成以上任务。\n\n建议各位玩家按上面的步骤完成以上任务，因彬之手环任务需要１５个空格\n完成，如果你不想按以上步骤完成，那试一下，保你后悔。\n\n相信各位朋友1.0的玩家做完以上任务，已是2.0开放的日子，2.0的玩家我\n不用说了。\n\nB、正式解任务篇\n\n那我们正式进入金虎和绿暴任务，英雄岛之旅。\n\n第一步，拿炎之圣石\n\n请已做了红暴任务,最少拿了一颗龙王守护的才能做以下任务,如果龙王守护掉\n了，可再打一次龙王，再拿龙王守护。\n\n１、一开始得先到50年前的波拉岛海边，你会看到有两篇淡色的海水带，找\n很长的淡色海水带(211 340)才能进海底（别在海岸乱狂了，这样是不能找到\n（147．304）的），在淡水海水带总会不停跳转，建议走淡色海水带的边，\n这样就可以不用跳来跳去，来到（147．304）往前走，就可进入海底洞窟，\n往上走，你会发现玛丽娜丝，和她说话就可接任务。\n\n２、再到(435,407)找泰坦队队员说\n话，他会要你帮他找公文，萨姆吉尔会说一起到波拉河下游找吧。\n\n３、然后就沿着波拉河找公文，可以在(228,294)、(155,374)、(183,373)、\n(183,394)、(306,317)、(162,372)等地点找到萨姆吉尔，我建议各位玩家，\n找到以上一个坐标就够了，用原地注销的方法可在不同星座都能遇到萨姆吉\n尔，找到萨姆吉尔，和他说话他就给你公文一个，再原地注销到别的星座再\n找萨姆吉尔一次，拿够两个公文就ＯＫ。如果在一个坐标不能两次遇到萨姆\n吉尔，那你只能到下一个坐标用以上方法找找吧。 ４、再回到(435,407)的\n地方，泰坦队队员就会给你泰坦部队的通行证。\n\n５、之后带着通行证到(450,391)的地方，泰坦对守门员就会让你通过了，\n再到(30,14)、(28,9)找泰坦队队长和小队长说话，他就会给你人型宠-鲁\n乌了。\n\n６、就去泰坦洞南方正在埋宝物的队员说话，他会帮你把龙王的首护埋在\n地下再给你一把钥匙，OK.\n\n７、在渔村或卡鲁那它搭乘加美航空到奇努村，再转机至米兰达即可到达现\n在的波拉岛。拿着钥匙到现在的波拉岛泰坦洞(450,391)，和洞里北方的老者\n说话就会给你炎之圣石(一颗就够）了。\n\n第二步，拿岳之圣石和米兰达、爱丽儿队的通行证\n\n１、培育将人型宠-鲁乌到30级。\n　　方法：毒60-70乌龟极速培育人宠法。（单人版，如果是无敏攻人就最\n好了，可与人宠合击，更快!）\n　　①身上要带道具：\n　 贝洛萨Lv3斧头 攻+35 防-12 敏-12 毒雾的精灵 14650 达娜村有卖或贝\n洛萨Lv3枪 攻+28 敏-6 魅+3 毒雾的精灵 13800 乌尔力村有卖\n威金娜斯Lv4斧头 攻+47 防-15 敏-15 石化的精灵 32000 达娜村有卖\n复活精灵或守护精灵（我建议用复活）\n　　采集证（加加便利店有卖，是采贝的）\n宠物60-80左右学猛毒攻击（猛毒攻击 攻击力减50%五回合前后让敌人中毒\n 4799 达那村宠特店有学）　　②去阿布，从一楼上六楼的途中通过毒雾毒\n20-30龟5-10只，再石化它。用人宠再打，一两回合过后应有１２级以上了。\n　　③上到阿布六楼，走到７楼进口旁，来回走可遇60-70绿龟。先用人或宠\n（宠用猛毒攻击打）打龟200-300血，然后放毒雾，毒龟血为0,再放石化，放\n人宠出来。两下子，人宠就狂升级了。总用时在1.5到3小时之内就可升到30级\n，主要看你熟不熟练。　　④为何要在７楼进口旁，因为７楼有阿布水卖，\n以不断补气，买水时要说“给我力量吧神圣之水啊发出耀眼的光芒吧”啊，\n不过买阿布水能进不能出，如果你懂石器２瞬移，１０秒钟，就可走回６楼\n，不懂的话，只能再从一楼走回六楼重打60-70绿龟了。\n\n\n２、鲁乌到30级，再到英雄岛的泰坦洞(450,391)和泰坦队队长说话，他会回\n收鲁乌和前面做到的超特级采矿鉴定书，再交给你米兰达、爱丽儿队的通行\n证和岳之圣石。\n\n第三步：拿涛之圣石\n\n\n１、往米兰达的部队驻扎处(410,622)前进，米兰达队队长同样会要求你帮\n他训练迪欧(人型宠)到30级，同时因为他们需要伐木造船，所以还得帮她\n伐木许可证。\n\n２、将迪欧练到30级方法如上\n\n３、迪欧到30级，去见米兰达队队长，米兰达队队长会收你迪欧和伐木许\n可证，就会给你涛之圣石。\n\n第四步：拿绿雷龙斯天多斯和岚之圣石\n\n１、带着爱丽儿队的通行证到50年前的波拉岛(255,429)爱丽儿队驻扎处，\n爱丽儿队队长会要帮她找仙人钓竿和训练爱丽儿加美（不是普通加美啊，\n要去培育员里拿的）到33级。\n\n\n２、培育加美到33级。\n加美敏高，方法我不用详细说，我的路线是1-22在阿布打30－70龟，23-3\n3级，敏大于35，去柯奥山小洞打80-90龟.\n\n３、加美养33级，连同仙人钓竿交给爱丽儿队队长，她就会给你斯天多斯、\n岚之圣石.\n\n到现在四圣石任务大功告成，这是你练级的最好机会。\n\n能在50年前的波拉岛上遇到120级绿暴、加美、蓝雷，建议大家练级在海\n边打蓝暴。 加美、绿暴敏高难打。\n\n你可以在50年前的波拉岛练到１２０级才拿金虎也不迟。\n\n不过不要把四块圣石其中之一不见了，否则不能拿。\n\n第五步，拿极品金虎。\n\n做任务做得这幺辛苦，如果拿了只垃圾金虎，就惨了。\n\n所以我这里要说明是拿极品金虎。\n\n条件：\n\n一、运气＋５的勾玉在手。\n\n建议大家在做红暴任务时不要偷懒。\n\n在水帘洞里一定要见到萨姆吉尔拿了运气＋５的勾玉，才完成红暴任务，\n好象做守了红暴任务就拿不到勾玉了。\n\n因为这运气＋５的勾玉的好外极多。\n\n第一，有它在手，你不愁拿不到极品红暴。 第二，有它在手你可在以后\n拿金虎、蓝暴时极品机会大增。\n\n第三，有运气＋５的勾玉可为你捉一级宠时遇见率大增，极品一级宠机会\n也大增。\n\n二、去算命再去拿金虎。\n\n算命有小吉以上才去拿，凶别去，拿了垃圾别怪我(因我试过在凶时拿了\n只41 9 7 6的垃圾金虎)。时间有得是，大家慢慢来啊。\n\n三、到50年前的波拉岛很长的淡色海水带(211 340)到（147．304）去海\n底洞窟，和萨姆吉尔说话，他会回收四颗圣石，然后给你金虎。\n\n到现在全部任务完成，你的声望也增加20－35了，声望值也会跟运气的，\n倒。\n因有朋友可在拿杉之手环拿到13点声望，我没这幺好运只拿了2点，采石\n任务有1点，仙人钓竿有4点，拿金虎有18点.\n\n附注：\n以上任务解法是预解法，因为如果拿着米兰达、爱丽儿队、泰坦部队的通\n行证好象不能解伐木任务拿杉之手环，不够１５个空格，而且道具栏太多\n道具，给纪人宠极为麻烦，我曾试过只有两格放气，练人宠，惨死了，请\n大家注意。\n\n炎之圣石：使用后有寸步遇敌的功用,可以一直埋龙王的守护重复拿取.\n泰坦队的通行证如遗失可一直向遗失公文的泰坦队队员重复拿取。\n米兰达、爱丽儿队的通行证如遗失可向泰坦队队长重复拿取。"
