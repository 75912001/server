      content: "上次发了篇用机暴对付现在几种常见宠的战术，今天手痒又想胡诌一番，这些东西比较BT，都是心理战，一般PK玩玩的没必要研究的，只是不吐不快，不喜欢看的就当没看见吧。\n\n兵法分为形与神：固定的战术和计策为形；而分析，猜测对方心理的方法则为神。形神具备才能真正将战术发挥的淋漓尽致。\n\n首先要将对手按照其才智分类，PK时及早分析出对方是属于哪种类型才能做到知己知彼，百战百胜是不敢谈，但是不至于被对方牵制倒还是可以做到的。\n————————————————————————————————\n木头型：\n这种人是初出茅庐，不知世间险诈，毫无防人之心。你给他下一个陷阱，他要掉进去N次才会学乖；等他学乖了你再下第2个陷阱给他，他还是照样掉进去N次才看出来这也是一个陷阱。\n\n对策：\n对付这种人不用谈什么对策，因为等他明白了你每一个行动都是陷阱时自己早死了七八百次了，这辈子是不用花心思在他身上了。\n——————————————————————————————\n孺子可教型：\n这种人比较聪颖，学习能力较强，只是经验稍微不足。第1个陷阱他掉进去5次左右就学会绕道走了；第2个陷阱他掉进去3次也学会了；等你下第3个陷阱给他时，他会有所预感，但是还不能确定，所以还是会照样掉下去；第4个陷阱他就已经知道步步为营了，小心绕开走,等他知道自己判断是正确的时候就会信心大增；等到你下第5个陷阱时。。。嘿嘿，这时候他就已经学会利用这个陷阱来害你了，小心作茧自缚啊。\n\n对策：\n对付这种人也不难，前3个陷阱多下些分量，要他不能翻身就可以了，这样就没有第4次和第5次了。但是如果他的才智在你意料之上，前3个陷阱没能要了他的命，那么这个时候就要把他扼死在萌芽状态，也就是说在他开始试图预测你下一个陷阱时就不要故计重施了，这样做有2个目的：\n一是可以打击他刚刚开始发芽的自信心，令他再次回到被你玩弄与掌间的状态\n二是可以为你下一个陷阱做更好的伪装\n如果这样都没能搞定他，说明他是一个小天才，这时就要收起轻敌之心了，因为这个时候的他已经跟你相差不远了。这时就要利用他经验不足的弱点，以自己长期积累的丰富经验来把他耍的晕头转向。\n总结一下就是：\n1。要速战速决，防止他适应你的战术\n2。打击他自信心，令他无法预测你的行动\n3。多下迷魂药来搞的他眼花缭乱\n——————————————————————————————\n老妖怪型：\n这种人已经在PK场上打滚多年，各种各样的战术都见过，你下的陷阱还没做成他就看出来了，没准你陷阱没做完就先掉他的陷阱里了，真是很棘手的对手。\n\n对策：\n这种人，他知道你的你都知道，你知道的他也差不多都知道，用对付前2种人的小花招就没用了，就要靠自己的实力来跟他打。虽然说是要硬拼，不过也不是卤莽的上去你一刀我一刀地对砍，而是应该避其锋芒而攻其不备。自己出手时要保证情况对己方有利，而当情况对对方有利时则应该保存实力，这样谁控制优势控制的好胜利就会偏向于谁。\n\nps：我所说的小花招指的是不花力气就想大占便宜的招数，例如自己该补血时不补血，反而用镜想来让对方吃一大亏，这种花招对付前2种人还可以，但是对付这种老妖怪就没什么用处了，他必然有所准备，还是老老实实地加血吧。等他看你几次都老老实实地加血，你再突然一个镜的话说不定还有点收获。这个就要根据对方的小心程度来决定什么时候加镜了。\n\n——————————————————————————————\nBT非人型：\n这种人不多见，是极度聪明狡诈的一类人,拥有魔鬼一般的智慧。他能够十分准确地猜测到你的心理活动，不但你的圈套害不到他，他设的圈套你却想也想不到，这种人最善于利用别人的计策来将计就计，而自己又极度小心，先立于不败之地再去对付别人。这样一来你不断被他牵制，很容易丧失自信心而被他玩弄于掌间，对他来说你就变成了第2种人。\n\n对策：\n对付这种人无论是战术还是头脑你都赢不了他，因为他经验远比你丰富，智商也远高于你，你的行动几乎都在他掌握之中。那么就应该化繁为简，不要跟他比智力也不要跟他比战术，而是跟他赌运气，只有运气是对人人平等的。你可不要不服气，因为你越是不服气，越是不信自己没他聪明，你就越容易被他掌握到你的心理，遇到这种BT级的人物就只有以最简单破解最繁复，令他对你的“傻”感到意外，这样你才有胜利的机会。\n——————————————————————————————\n\n以上说了这么多，大家一定会问到底怎么才能知道对方是属于哪种人啊。这个我也很难回答，一般我是靠感觉和一些平时的微小动作来判断对方是哪种人的，这个过程是逐渐的，战斗越久他属于哪种类型就越是明显。看你的观察力了，你发现的越早那么就越容易战胜他。"
