      content: "在伊甸园的枢纽人员告知玩家，此任务与南北两岛的任务一样，此为伊甸大陆的环岛任务，共分E、F两条路线，以祭品任务做为区分，未解过祭品任务者解E路线，解过祭品任务者解F路线，每条路线共12个点、12个问题，解完以后可随机获得道具及宠物。\n\n任务流程一开始根伊甸园枢纽人员对话，分成E（往西）F（往东）路线。\n\nE伊甸园（E1）→西方沙漠内通道（E2）→伊甸大陆西方（E3）→塔耳塔地城东北区（E4）→伊甸大陆北方（E5）→弗列顿火城（E6）→火山道场（E7）→蒙达村（E8）→蒙达村地下通道（E9）→亚伊欧风城（E10）→伊甸大陆东方（E11）→克斯城区（E12）→尼克斯水城（检查员E，收回第12站检查石，给予随机道具及宠物）。\n\nF伊甸园区（F1）→东方沙漠洞穴外通道（F2）→亚伊欧庄园（F3）→亚伊欧城区（F4）→蒙达山（F5）→弗列顿庄园（F6）→弗列顿城区（F7）→火山洞窟第二层（F8）→塔耳塔庄园（F9）→贫民窟（F10）→伊甸大陆西方（F11）→尼克斯庄园（F12）→尼克斯水城（检查员F，收回第12站的检查石，给予随机道具及宠物）。\n\n问题内容\n\nQ1：金飞任务中的金飞全名为？\nA： 朵拉比斯\n\nQ2：塔耳塔战士团长的女儿的名字为？\nA： 英嘉\n\nQ3：里拉拉喜欢的食物为？\nA： 上等的白萝卜\n\nQ4：尼克斯城近卫队长的姓名？\nA： 邬莉叶\n\nQ5：伊甸游乐园可换的最差的奖品为？\nA： 玛莉那斯的羽毛\n\nQ6：伊甸游乐园里跑轮盘的宠物为？\nA：扑满乌力\n\nQ7：从亚伊欧风城传送到塔耳塔地城需要多少石币？\nA：2800\n\nQ8：蒙达山上咬伤人的萨格鲁的名字为？\nA：查拉\n\nQ9：熔岩斧附加的精灵为？\nA：恩惠的精灵Lv5\n\nQ10：讦谯龙任务中可获得耐力10点重新分配的酒石？\nA：高粱酒\n\nQ11：火山洞穴出现的黑色人龙杨格斯属性为？\nA：火8风2\n\nQ12：亚伊欧风城可以买到增加经验值的道具为？\nA：智慧之实2\n\nQ13：伊甸园主最喜欢的宠物为？\nA：雷而胖\n\nQ14：要抓波波顿要用哪种饲料？\nA：肉食性饲料2\n\nQ15：最高级的岩盐一个可以卖多少石币？\nA：800\n\nQ16：火城守护精灵的姓名为？\nA：沙拉曼达\n\nQ17：乌力莱德眼睛的颜色是？\nA：红色\n\nQ18：占领伊甸庄园后可学到的骑乘宠物为？\nA：拉奇鲁哥\n\nQ19：圣火火把的有效时间\nA：一小时\n\nQ20：可在伊甸园区抓到会落马术的生物为？\nA：塔斯夫\n\nQ21：要在尼克斯水城记录需要哪一种肉？\nA：莫拉司的肉\n\nQ22：被怪物占据的村庄是？\nA：凯拉村\n\nQ23：全身都是红色的布克类宠物叫？\nA：瑞德宝\n\nQ24：占领后可习的骑乘朵拉比斯的庄园为哪一个？\nA：亚伊欧庄园"
