      content: "原创：『韩天阳』\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n方位之祀在东232、南271。首先在第1层得到提示：守护火者喜欢争斗，守护水者感慨争斗，守护风者带来喜乐，守护地者坐着感受自然。\n\n接下来在第2层有块告示牌写着：配合东西南北的话，和地水火风的石头以及中央沉睡的石像说话，这样路就会为你开启。\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n地的勾玉---绿色---北方\n水的勾玉---青色---西方\n火的勾玉---红色---东方\n风的勾玉---黄色---南方\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n接下来按照东西南北的顺序分别打倒4只LV62的守护兽，分别是：\n\n地的守护者（石龟）\n\n水的守护者（萨美洛斯）\n\n火的守护者（奇宝）\n\n风的守护者（贝鲁伊卡）\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n获胜后便可进入与守护兽说话，他会说：请照我的想法和感觉的来行动。此时你必须依照先前的提示，站在他面前对着他作出正确的动作：\n\n火：攻击动作\n\n水：悲伤动作\n\n风：高兴动作\n\n地：坐下动作\n\n他们便会说出秘语：\n\n·火---东方出现曙光\n·水---向西方献上祈祷\n·风---南方吹来的风\n·地---使北方将感受到幸福\n\n把这句话完整对着石像说出即可完成任务！\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－"
