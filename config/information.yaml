      content: "条件：\n1、解完金飞任务\n2、解完黑虎任务\n3、身上要带著不可思议的贝壳\n4、变幻的衣服(变幻镜用镜好像有点浪费了) Lv1\n5. 抓个60多的野的乌力莱德（出风城 伊甸南方有的）\n一、接任务\n在风城来到（36，129）进入民房，来到（18，12）和欧弟说话，\n接完任务，也是在风城来到（69，69）再说凯乌说话。\n二、去小猪森林\n通过天才传送师传到风城，进入伊甸大陆南方。\n三、变身为小猪\n来到小猪森林入口（72，189）装备变幻的衣服 Lv1变身成乌力莱德和小猪卡肯说话(身上要带著不可思议的贝壳)，进入到小猪森林 卸下变幻的衣服 Lv1（不卸也行）\n四、拿小猪莱比\n来到（30，47）跟两只小猪说话拿到50级的莱比。\n五、练莱比上60级，交任务\n1、到英雄岛打水雷，或去去南岛奇喀喀村附近的泪之海海底或去五兄弟(五兄弟比教快)练很快就60级了。\n2、再回风城，来到（36，129）进入民房，来到（18，12）和欧弟说\n话，拿到小猪--乌力莱德一只。"
