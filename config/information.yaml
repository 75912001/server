      content: "新手骑宠跳级任务\n\n任务条件：30级以下新人\n1.到萨村的长毛象货运跟长毛象货运的店员说话，他会叫你送一颗红宝石给鱼村长毛象货运的老板\n2.紧接着来到鱼村的长毛象货运（可用羽毛飞去），跟鱼村长毛象货运的老板说话他就会提升你的经验值（升到10级）\n3.再直接跟鱼村的长毛象货运接下任务，跟长毛象的店员说话，他会告诉你萨村老板想吃樱桃酱汁牛排（肉3+樱桃3+炭3）\n4.动身去鱼村24小时商店料理一个樱桃酱汁牛排给萨村长毛象货运老板\n5.回到萨村长毛象货运，把料理给老板之后他就会帮你提升经验值（升到20级）\n6.紧接下来再跟萨村的长毛象货运店员接下任务，店员会告诉你他的老板最近在养宠物，叫你去霍特尔村附近抓一级布依\n7.动身去抓一级布依，回来给老板看看之后就会帮你提升经验值（升到31级）（布依不会收走）\n8.再来就是去解成人仪式\n9.解完以后去各大庄园跟虎的训练师领虎，在领到的宠物虎的名字前面会加“新手的”三个字，如是骑红虎就叫“新手的格鲁西斯”\n10.这个任务只适合30级以下的新手，而且骑宠只能领一次，能力值约是野生的一半"
