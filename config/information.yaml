      content: "一个老游戏了，说好听点就是宠物赛跑吧，规矩也很简单，自石器3.0开放伊甸以来都已经有了，不过还是循例介绍一下吧：\n◎竞速场规则：参加竞速的宠物一共有三只，你可以依照宠物的状况或个人喜好下注，请将换得的彩卷防止于欲下注的号码前方，当竞速结束时，主持人讲会自动帮你计算积分。\n◎注意：当你离开此房间或者登出时，下注的彩卷及积分将无法取回！"
