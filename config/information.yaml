      content: "＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n必须条件：等级80并解完四大洞\n【注意】：如果没到80级或者没解完4大洞用不限等进入漆黑，可是解不到任务的哦！\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n1.首先你要带着四大证明，然后走到漆黑洞窟(101，232)\n\n2.进去后分别要在2F 6F 9F 14F拿到四个宝珠(其实可以不用拿喔)\n\n3.然后再到6F捉转生用宠物\n\n4.一转捉大地守护兽\n\n5.二转捉水的守护兽\n\n6.三转捉火的守护兽\n\n7.四转捉风的守护兽\n\n8.五转四种都要捉喔\n\n9.然后上到15F可以拿到精灵王之弓(四大证据要在身上)\n建议拿，因为可以加声望\n\n10.再上到20F跟精灵王说话，就可转生了，得到转生宠如下\n\n11.萨姆吉尔村出生的为乌力斯坦=>洛卡伦恩=>(无资料)\n\n12.玛丽娜斯村出生的为洛卡伦恩=>乌力斯坦=>奇娜=>多鲁宝\n\n13.加加村出生的为多鲁宝=>(无资料)\n\n14.卡鲁他那村出生的为奇娜=>(无资料)\n\n15.五转为帖拉所伊朵(机械暴龙)\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－"
