      content: "7.0新装备合成方法:\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n若丝盾牌   防+5 格挡率+1%        皮6+线6+骨6\n若丝腰带   防+3 负重+1           牙6+皮6+线6\n若丝鞋     敏+5 增加攻击顺序3%   石6+皮6+线6\n白石盾牌      防+8 格挡率+2%     皮7+ 石7 + 水晶7\n白石腰带      防+6 负重+1        皮7+线7+爪7（火城24）\n白石鞋     敏+8 增加顺序攻击5%   皮7+骨7+牙7\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n【新装备手套(皮带左方)】\n\n首先至北岛卡坦村附近的【386.196】英雄竞技场，只要在英雄战斗场里,打\n嬴20-100族长即可得到\n载自鹰之一族\n\n英雄战场道具.目前知道5样..地点：北岛卡坦村附近的(386.196)英雄竞技场\n第20层：指环皮革手套(防+10敏+8)...\n第40层：单指护甲手套(防+17敏+7)...\n第60层：五指皮甲手套(防+24敏+12)...\n第80层：五指硬皮手套(攻+10防+23敏+5)...\n第100层：五指硬石手套(攻+24防+30敏-2)..\n\n附: 道具名称      怪物等级名称   出现地\n\n    扬奇洛斯的手爪4X  扬奇洛斯       达那村外\n    邦奇诺的脚爪4X    邦奇诺         达那村外\n    格鲁西斯的皮毛4X  格鲁西斯       福尔德村外\n    贝鲁卡的皮毛1X    贝鲁卡         琉璃洞外\n    布鲁顿的手爪4X    布鲁顿         男人村去女人村的路左右\n\n----------------------------------------------------------------------------------------\n\n感谢会员『列封』提供错误！"
