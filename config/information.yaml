      content: "XP_炒饭小坤\n==================================================================\n 7.0没转过的人正常来说只能叠加3个\n[穿加负重的道具以后最大也不过5]\n不过有BUG可以让没转1级的人背叠加10-12个\n\n条件：\n\n1：在此帐号旁边有一个5转人物\n2：用5转人物叠加好物品以后存入仓库[注意：是仓库]\n3：换登此帐号内没转过的另外一个ID。去仓库里面把你5转人叠加好的物品取出来就OK\n↑此BUG适用于长时间挂机练新人者使用。例如拿老号叠加15堆10个智慧果\n\n那么你的新人就一次性背150个指挥果出去挂机"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【石器时代经验与技巧】", "个人经验之：独自练MM"]
      content: "作者：MX_无聊的闲人\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n大家是否因为练MM而郁闷过呢~？\n  MM级别到40~50级的时候，是个坎，打135雷？防不够；打别的？又不知道去打什么。现在我就来说说练MM的经验~\n1~10级：在龟洞啦，没别的地方可去了呢，但是也可以一直练到15级，时间稍微长点，没什么的\n15~20级：在阿布啦~很快就可以去看风景了~~\n20~40级：这段时间呢，大家就别苦恼了，在海底慢慢和海主人饮茶吧~~\n40~55级：去打5兄弟那里的猪猪，一会就可以班师回朝咯~\n55~65级：去水城门口，打8X的水怪，这里可以绝对放心，不会被打死的，哪个东西攻低的可以~~只是爱防御，慢慢来就是了\n65~79级：去地城门口打，等级同样是8X，但是数量N多~~~\n\n\n大家都知道，MM如果不满血升级的话，血成长是很惨的，所以我给大家推荐下经验\n\n水城，打一仗经验最多为9XXX，所以设置10000经验就加血\n地城最高是14XXX，一般情况不会高于15000，所以设置15000就好了（要是担心的话可以设置为15500）\n\n\n  这就是俺一个人练MM的经验，可以不组别人，不挂高级怪而自己搞定~~\n  MM呢，保证不会死~~hoho~这样是不是会解决你练MM而组不到队的苦恼呢~~\n\n\n                                                                   ------『万宇』无聊の闲人"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【石器时代经验与技巧】", "纯新人自强之路:教新人变强"]
      content: "作者：MX_haozi666\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n先声明，这个贴是给新人看的，说的好就帮顶下，说的不好请各位老鸟也不要扔鸡蛋，谢谢！！\n这是我个人原创，中间也可能会有和别人经验相同的地方，毕竟石器经验也就那么多，希望大家支持原创哦：）\n本人BOX论坛ID：￥小耗子￥  武汉2大号：￥小耗子￥\n1出生：选用 凯比 的人（以后做不可思议贝在鱼村说句话就能拿，不用来回跑）\n       10敏 10体 强烈建议火属性超过8（为以后单挂金暴打基础）\n2准备①：先去人最多的服务器，和人要些钱，一般要个几W应该不难。\n         求够几个果2，用外挂吃（不会的跟贴问，我教你）\n         申请个免费号和你换片，自动邮气，只要不下线，服务器不会自动踢\n3练功①：1-8鱼村外，8-20小龟，20-40阿布（这里买气便宜还方便），\n         40-50海底，50-70在5兄弟（打到的线9拿去萨村卖掉）\n         70-80去80甲洞，最好能找人组队\n         80-110在英雄岛（到此练级暂停）\n         人111级分配：150速度 150防 50体力\n4准备②：去抓个金猩猩，海底的新宠物也不错，白星就最好，把它们养到110以上\n         挂机抓宠卖钱3-5小时应该小富，买个红暴证，做完红暴，强烈建议红暴练到100以上\n         找人一起做金飞航空，上伊甸后记录在地城。\n5练功②：骑红暴，带猩猩去135挂机，人121的时候暂停挂机，此时白星120以上\n         金星也差不多110\n6准备③：去打5级血药，要40个(因为是新人，打攻药不现实，个人认为还是血药好打些，而\n         且任务宠，对血要求高些，其他少些不要紧)，然后用白星主体+金星+野黑暴融合，\n         这是你的第1只能过的去的宠物，不用要求太高，估计成长过6.3没问题，运气好能\n         出6.6以上。做个心环，存起来。\n7练功③：再去地城135把你的融合练到120以上，人也就差不多131了。\n         人131级分配：200速度  210防  50体力\n         此时人带心环，萨首饰，骑红暴，去单挂金猪应该没问题了\n   注意：68%战斗补血，平时80%补血，锁定猪和GP，锁定骑宠，落马逃跑，\n         除前3格外，非阿布水自动丢弃\n         到此，挂到140也就2、3天，然后转生，一直练到3转131左右，中间红暴和泪石任务\n         必做，最好把5.0和6.0海盗王任务也做了，其他任务看个人水平和能力，量力而为\n成功之路：3转131的时候加200速度，300左右防，其他加血，骑红暴，去打灵石喂MM吧\n          单打火的不会挂（用海盗王爪，不放宠物），打4、5只MM，留个最好的给自己用\n          其他的都去换宠物，按自己喜好和需要换，都弄好后，以后你在石器里虽然不是\n          最强，但绝对不弱了\n          如果你是7.0服务器，建议多参加下华义的活动，尤其是501活动，各服务器活动\n          时间请自己去华义查询，多建几个小号，拿1级3围是5 10 1的石龟去换恶魔2,运\n          气好还能拿到松鼠，然后园地后去单挂铜，因为7.0有了叠加，打素材方便了很多\n          你是法师还不用邮气，全天挂，运气好单挂1天应该能出2个铜兜3，和成苍绿换东\n          西很容易，还不用自己看着，设置好就OK了，68%补血，气低于68用嗜血\n另外：7.0的话，强烈建议就职法师，学嗜血，省气省钱，爽\n      5转法师，不建议加太多防，速度一定要上300，血900以上\n追加：当你5转140以后（不是新人也可以用）是不是宠物高级的感觉不多呢？告诉你个方法前\n      提是你的战宠已经转生（防上250，血过1450，72%给宠物补血，人敏没有金暴高的时候\n      千万不要锁定战宠，我挂青龙号的时候就跑了个火牛和135转火年，人敏低加不上血，\n      登出读秒还没完，不到20秒宠就跑了，5555），要不跑了不要来找我。火属性的去单挂\n      金猪，人防御，宠打转机用T一击毙杀；如果是地水属性宠物，就去海底挂。升级超快。\n\n有不足之处，还望各位帮忙补充,\n刚更新了7.0挂铜，刚想起来的。追加人满级后养宠建议"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【石器时代经验与技巧】", "【4属性戒指魔法抗性练法】"]
      content: "作者：『韩天阳』\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n\n◎地魔法抗性\n\n1.英雄道场\n\n2.封印精灵王or天空地精灵\n\n3.伊甸精灵王\n\n－－－－－－－－－－－－－－\n◎水魔法抗性\n\n1.英雄道场\n\n2.封印精灵王or天空水精灵\n\n3.伊甸精灵王\n\n4.海贼王秘宝任务BOSS（贝克）\n\n5.法师就职任务的BOSS水蛇（水端午）\n\n－－－－－－－－－－－－－－\n◎火魔法抗性\n\n1.英雄道场\n\n2.封印精灵王or天空火精灵\n\n3.伊甸精灵王\n\n4.森林洞窟顶楼（光之石）\n\n－－－－－－－－－－－－－－\n◎风魔法抗性\n\n1.英雄道场\n\n2.封印精灵王or天空风精灵\n\n3.伊甸精灵王\n\n－－－－－－－－－－－－－－\n还有动物园任务的著名BT的BOSS----席格\n也可以提供大家练魔法抗性！\n具体方法以后补充！"
