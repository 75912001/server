      content: "作者：『韩天阳』\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n前提条件：\n1）等级建议120以上\n2）防御要有300点以上\n3）身上装备海蓝装备组（确认不要使用快报废的，否则死了不负责！）\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n身上道具：\n1）装备海蓝装备组\n2）带上4瓶回复100的气（虽说是不费气，万一………………）\n3）带上足够的果2（那里可打不出来豆子3的哦）（玩笑）\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n功略：\n\n1）在海底使用“【练功】海底换气道口140”脚本，运行中途暂停的都点继续，直到脚本结束！\n\n2）到了之后，外挂设置丢弃“草|纯净”（因为有海蓝拉！）\n\n3）为什么不设置全部丢弃的原因是：“等智慧之果用完后，就会有火山岩3和红珊瑚3出来的哦！”\n4）【最重要的一点】：“不要带战宠，人就骑骑宠”（建议转宠，转机肯定不费气的拉！）\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n本资料由First Message独家享有，如需要转载，请联系邮箱【htyhurry@sina.com】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
