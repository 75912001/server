      content: "                                    【First  Message  说 明 】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n程序：Stone-Walker   【石器行者情报】                              制作：『悟空』\n\n制作者：『韩天阳』\n资料更新≌修改:Tc-Jsw\n\n说明：石器行者情报  又名《STW情报》，是由韩天阳新整理的最新石器时代情报，辅助工具STW共享\n\nTc-Jsw:本次更新为最终版，以后将不再更新！\n\n中心地址:\n\n·http://bbs.tt2xz.com/\n\n\n※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※※\n\n                                            【 石 器 术 语 】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n更新编辑：Tc-Jsw                                                  原版本：V1.0         自定版本:0.0.0.1\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n常见地名 鱼村 玛丽娜丝村\n　　　　 萨村 萨母吉尔村\n　　　　 ++ 加加村\n　　　　 卡村 卡鲁它那村（注意不是卡坦村），以上村庄统称4村\n　　　　 福村 福尔德村\n　　　　 奇村 奇喀喀村，南岛最南面的村庄\n　　　　 英雄岛 波拉岛海边，80级以上玩家集中打120水雷的地方\n　　　　 海主 2X~~3X级人物打海主人练级的区域\n         海底 奇努伊海底通路\n\n常用词汇 +++++++++++ 加入团队\n　　　　 == 等一等\n　　　　 下 请你离开团队\n　　　　 换片 交换名片\n　　　　 ST 石器货币，也称为\"石头\"\n　　　　 W ST的常用计算单位，表示\"万\n　　　　 4围 宠物血攻防敏的数据\n　　　　 3围 宠物攻防敏的数据\n　　　　 成长/长 宠物成长率，也是玩家养宠最看重的一个方面\n\n常用PK术语\n　　　　 PK 决斗，其他玩家要求和你PK，一般会对你喊PK、开或者点\n　　　　 开 左上方MENU中的决斗设定为ON\n　　　　 点 点击右上方的\"与玩家决斗\"\n　　　　 团P 组队决斗，最多可加到5人一队\n　　　　 合 合击，常用于对方剩下最后一名队员的时候\n　　　　 C 宠,，来源于发音chong的首字母，尤指战宠。\n　　　　 R 人，来源于发音ren的首字母，团P中指挥由上往下常用1R，4R、3C等表明我方队友应该一起攻击哪个对象\n　　　　 转 用转属性道具改变战斗中的属性，可以转对方，也能转自己\n　　　　 镜 使用镜的精灵，可以把被攻击的伤害全部反弹回去\n　　　　 放精 使用带精的武器，向对手放石化、昏睡、混乱等\n　　　　 风、水、火、地 放属性精灵，使宠物相应的能力在数回合内得到极大的加强\n         T  踢人、踢馆等专用词汇\n\n部分任务代名词 （具体任务见《任务功略》）\n　　　　 龙王 英雄岛 寻找丢失的小女孩任务\n　　　　 PC团 米兰达村外50年后的波拉岛 金飞航空任务\n　　　　 4洞 转生任务中的碧青、玄黄、深红、漆黑4大洞窟\n　　　　 打石头、转宠 黑暗精灵王任务前传\n　　　　 4界 黑暗精灵王任务后篇，上天空之界打地、水、风、火四界，最后打BOSS柯黑穆肯加声望的任务\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
