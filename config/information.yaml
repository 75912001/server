      content: "新增加的一个游戏，和我们小时候所玩的纸牌游戏差不多（还是觉得有点抄袭动漫《游戏王》的，汗……）这个是笔者最喜欢的游戏哦。规矩如下：\n一：本游戏为玩家1-6人来挑战庄家魔王（就是雷尔大人了）。\n二：登记参赛入场时间为20秒。\n三：每场间隔3-4分钟不等。\n四：宠牌25张，魔法牌5张，所以每人均有30种牌可以抽中。\n五：宠牌分为强攻，强守（各3张），12张中等牌，7张普通牌，所以一共25张\n六：而魔法牌的5张分别为：\n      a幻镜术——对方攻击时会反攻回去\n      b幻影术——使自己对对方任何攻击都不受伤害\n      c封印术——封印成功的话，对方暂停行动一回合\n      d召灵术——为自己补25血\n      e召雷术——随机攻击队友或庄家单体，伤害为20血。\n七：每人一开始分发5张牌，每回合必须出一张牌，第二回合补回一张，一共玩10回合。\n八：参赛者每人初始50血，而魔王就有参赛人数X50的血量。\n九：游戏开始以后，每人各有20秒时间选择出牌，若选择出宠牌时，则需要决定攻击或者防御。\n十：游戏进行10回合，依照出牌种类判断胜负，增减玩家或魔王的血量。\n十一：第10回合时比赛结束，计算玩家剩余血量。挑战获胜，依玩家剩余血量计算应得的积分点数。挑战失败，玩家每人分别扣6分。\n十二：游戏中血量归0则挑战失败并退出比赛场地和扣掉6分。\n十三：玩家每场参赛费为5000石币。\n十四：参赛资格与规定：1.基本积分6点以上者才能参加。2.无6点积分者，需要交纳10000石币保证金。3.入场时先扣掉抵押积分6分或10000石币保证金，赢了归还，输了即扣除。4.比赛完毕，积分发送完成后，传送至比赛场地外。5.游戏积分可以向游乐场银行换取奖品。"
