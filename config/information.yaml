      content: "〓合成环9-10以及环9-10综合分析〓  小黑版~~~~\n\n1.环9随机问题，\n环9为单加60另外2个减15的，每项上下随机15，也就是说最极品的攻环（敏防也一样）\n加攻75另外2个减0\n最垃圾的加攻45另外2个减30，所以极品的和垃圾的想去甚远！\n\n下面是合环9的图！\n本图之所以是全部敏防环7是因为以前留着合环8的，但是环10的消息一出什么环8啊，就拿来合了\n\n\n环9属于15级道具，成分为土皮石\n用原始的思想分析，土在石器里石粘合作用，皮是包裹用的，土是坚硬的东西，所以手环本身是要用来抗击外来的动物方便适用武器的，跟中国的顶针作用差不多，打人不伤自己！所以需要一层皮来保护自己，用土黏结一起，这个设想就是最初设计的想法！另外就是拿牙代替石头，再者就是骨代替了，对5级以下环的分析不多，但是想应该有3种环5的类型就是这3种了！\n\n但是后来开放的环7以上就严重偷懒了，只有1种样子了，环7+30的是13级装备，用极品环7+6-8个风城环3，就是用风环里的石的成分刺激环7的石的成分才生跳级，从而跳出环9，所以几率比一般的2个爪14对合爪15要低一些，虽然成分都是一样的的，但是级别有差别，需要跳升！\n\n至于别的合法只要素材对路都没什么问题，但是土的成分很难找了，所以一般来说只有极品环7做主来合了。加3-4个垃圾环7有机会出的，但是由于垃圾环7也需要合以及目前脚本问题多数人经常合的人都选择了第一种方法！\n\n至于环7的合法，一般用3-4个风环3对合，出垃圾环7的几率还可以但是由于皮石成分的东西有高级铠服，投石，回旋标，挺多的，所以副产品比较多！\n用投石12+4个风环3也可以出极品环7，属性环9就是X火庄的投石12的属性加上去的！\n出了垃圾环7一般再加4个风环3，有比较大的机会转极品环7，只是比较大，自己的经验极品环7还是直接合出来的多！\n\n一般来说合首饰类，凯比系不错，当然修宝系是比较全面的，一般推荐凯比特，修宝，蓝宝，凯比！另外强力推荐猪系，卡不一和不一不一（名字这个感觉好听错字就错吧）后面的应该是环岛得到，后来好象有1级抓了，不清楚坐标！卡不一为垃圾卡产品，还有蓝宝1级的也是垃圾卡的！\n\n大致6000-8000w出1个环9，守护兽合成宠练的好一些的运气好点的，可能在4000-6000w，我说的是合30个以上的平均数，只合一个不要说多少就出，很多时候我去合都是刚到就出了，然后几千w甚至上e都烧了！\n\n家族声望5w绝对够了，35000都可以拼，环9是15级道具，综合1.8w应该没问题了，个人1500以上吧，再低比较困难！\n\n问合成宠要不要守护兽的就算了，谁能不用守护兽合到11级以上的东西呢？\n\n\n2.环10问题：\n环10合法目前开放的是环9+爪16（1-2个）\n比较推荐1个的，几率大概1/10\n运气成分比较重要！\n要求声望个人估计为\n个人（不很重要，2000吧）\n家族综合30000应该可以了，\n总声望6w有一拼！\n\n不要说我说的少了，只是保守的说了！\n\n另外可以一试的合法为\n环8+4个环7\n必须知道是环10成分和环8一样，为皮土牙\n而环9是土石皮！\n明白这个可以试方法了！\n\n\n3.环10属于16级道具，也就是合到过16级道具的人就可以一拼，我是在合到第一个带精灵16级武器之后信心十足，当时家族78884个人6214综合42011\n运气算可以吧，第7个环9出了，自己能力有限没有太多石头和精力尝试各种方法了，只能抛砖引玉了！\n\n希望下面等看的不要急，打字总需要时间吧！\n\n这个是我合到的环10，实际效果为加70敏的！\n\n环10随机就是加单项没有减的，最低加60，最高加90！\n\n"
