      content: " ┌───────────────────────────────-┐\n │ 6.0新任务--海贼王遗迹。宝藏任务                               │\n │                                                               │\n │ 任务地点：南岛泪之海（１０２．１０２１）                      │\n │                                                               │\n │ 适合等级：120级以上                                           │\n │                                                               │\n │ 限制条件：需解完5.0海贼王的秘宝、等级LV100、身上需有不可思议  │\n │ 的贝壳                                                        │\n │                                                               │\n │ 一  由(102.102)来到泪之海(146.49)→(144.25)→(143.34)→(146.4 │\n │ 4)→(45.52)→(149.63)→(148.70)→(255.74)→(262.72)→(264.42) │\n │ →(272.40)→(365.128)→(358.132)→(376.204)→(369.207)到(245. │\n │ 260) 之後会遇到怪鱼，打败怪鱼宫本蚊帐之後立即前往(182.322)    │\n │                                                               │\n │ 二  会有一只130级的沙瓦克挡在前面，打败它就能进入到海贼船里面 │\n │ 去二楼见一个叫贝克的人，与他说话接下任务，他会要求你去找位於  │\n │ 奇喀喀村东44南56的杰克森做钥匙并告诉你他发现了追寻已久的海贼  │\n │ 王宝藏，一共两个，但是没有钥匙可以开，怕离开後被人拿走宝藏箱  │\n │ ，所以要你去拿钥匙。                                          │\n │                                                               │\n │ 三  接着在前往奇喀喀村找杰克森(44.56)说话,在去抓80级以下3属性 │\n │ 的人龙给他(红.蓝.绿各1只)。                                   │\n │                                                               │\n │ 四  此时就前往达那村外抓蓝人龙以及红人龙，到福村一侧的无名洞  │\n │ 窟3楼抓绿人龙(琉璃洞窟也有绿人龙)，等级不限，抓齐３只後再回去 │\n │ 奇喀喀村找杰克森，交出3只人龙後，杰克森会再要求你给他30万或1  │\n │ 瓶伏特加他才肯帮你做钥匙，东西交出之後会拿到钥匙两把。        │\n │                                                               │\n │ 注意：                                                        │\n │                                                               │\n │ 1.无名的洞地下3楼附近抓到的绿人龙(83~85级)和红人龙(83~85级)及 │\n │ 漆黑1楼附近抓到的蓝人龙(85~87级)都不能解海底遗迹，请玩家至其  │\n │ 他地点抓人龙。                                                │\n │                                                               │\n │ 2.杰克森会挑走你身上最好的叁只人龙走，所以本身身上有放非野生  │\n │ 人龙的请不要摆在一起，不然他会收走，留下烂的给你。            │\n │                                                               │\n │ 五  再前往泪之海那边的海贼王沉船处(182.322)，忽然间发现贝克档 │\n │ 在门口，要你交出钥匙，不然他就要抢你的了，开始战斗後你会发现  │\n │ 钥匙被贝克夺走，所以一定要打败他，不然输了就要重解一次，打败  │\n │ 之後就可以,拿回钥匙罗，然後贝克会跟你说海贼王的船就是他放火弄 │\n │ 沉的，为的就是海贼王那份宝藏，之後他就让你去开那两个宝箱罗，  │\n │ 可分别获得海贼王之兜是随机的唷。                              │\n │                                                               │\n │ 任务奖品如下：                                                │\n │                                                               │\n │ 1  兜１６,防+30,敏-8,净化精灵(毒，石，混，睡随机一种)Lv2。    │\n │                                                               │\n │ 2  宠物技能罐头(可以让任何一只宠物学习到狂乱暴走) = 单回合普  │\n │ 通攻击连续叁次，目标叁次随机。                                │\n │                                                               │\n │ 3  宠物技能罐头(可让任何一只宠物学习旅程夥伴2) = 忠诚60以下10 │\n │ 0%带走。                                                      │\n └───────────────────────────────-┘"
