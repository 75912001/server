      content: "【5.0任务】『拯救布洛多多任务』\n\n条件:90级以上.\n解过金飞任务.\n需带着不可思议的贝壳.\n\n前往塔耳塔城区（130，138）找到帕加接任务，\n第1次对话帕加说他要库沙达的签名。\n第2次对话他提示阿谷拨有库沙达的签名。\n\n再前往塔耳塔城区（71，51）进入库沙达洞窟第一层，和中间的金暴布洛乌乌对话得知他们不小心把阿谷拔的金飞蛋打破了，而阿谷拔把土暴布洛多多枪走了，想你把布洛多多救回来\n\n登出回地城，来到地城东北区（11，17）和老人说话，知道阿谷拔在伊甸东方的山洞里！\n\n通过传送师传到火城，走出火城，依照195,151----199,220----255,349----260,389进入伊甸大陆东方。 （如果有人物在火城庄园，建议用族长召唤术去^^）\n在伊甸大陆东方来到（95，12），即EOT第11站附近。\n\n进入萨伊洛山洞1F（0，28）进入2F，在第2F来到（10，12）进入3F，在3F从（73，57）和飞龙守护兽对话进入第4F，\n在4F来到（51，49）和阿谷拔说话，他会给你暴龙基地的key和库沙达的签名板。要你将飞龙蛋带回来才交还布洛多多\n\n再次找到帕加， 交出签名板拿到帕加的巧克力\n\n再次去塔耳塔城区（71，51），进入库沙达洞窟第一层，并按以下路线走\n\n注意：如果不怕眼累，请用我特意写出来的方位来走！\n\n第一层（69，60）上-----第一层（69，48）中\n第二层（69，37）上-----第二层（69，24）中\n第一层（59，24）左-----第一层（44，24）中\n第二层（34，24）左-----第二层（19，24）中\n第一层（19，34）下-----第一层（19，58）下\n第一层（32，72）右-----第一层（44，72）中\n第二层（57，72）右-----第二层（69，72）中\n第三层（59，72）左-----第三层（34，72）左\n第三层（19，72）中-----第二层（19，60）上\n第二层（19，48）中-----第三层（18，37）上\n第三层（32，24）右-----第三层（57，24）右\n第三层（69，35）下-----第三层（59，48）左\n第三层（44，47）中-----第二层（44，47）原地这格！\n传送到1F水蓝暴布洛沙达前。\n\n与布洛沙达(水蓝暴龙)说话.交出巧克力传送你到第四层(40.47)到第四层的(40.41)终于见到库沙达.与他说话.他看到你身上的龙骨.便很生气的将你传送到第五层。\n\n此处有四暴龙GP团.都是120级的暴龙.在(14.37)有黑暴龙.在(27.37)有金暴龙在(40.37)有水蓝暴龙 在(53.37)有灰暴龙此处需连打6场才会过关.打输会退一层.\n\n打完会再传送回去库沙达旁边。再与库沙达说话.他会跟你道歉。因为他以为刚刚的骨头是布洛多多的.所以要龙群追打你.\n\n他将骨头KEY收走.而同意让你带走恐龙蛋.再去找阿谷拔，阿谷拔要求你找到他的真正的他，然后传你到萨伊洛山洞第五层。5F是单程路，边传送边走吧。\n\n会来到（79，60）看见8组守护兽布兰恩，点击开战（5只120级的飞龙），打赢它就能上到萨伊洛山顶。\n\n你会看见一个谷拔，和他说话，看是不是谷拔的真身，如不是就回头找另一个布兰恩开战，再上山顶找到阿谷拔的真身为止，找到阿谷拔的真身后，他会给你一只20级的布洛多多，叫你养肥他才交回暴龙队长库沙达。\n\nPS：小弟忘了用原地注销测试@@，因为我做这个任务时运气UP到极点，第一组就成功了。可能可以用原地登出找谷拔，是可能哦。\n\n将布洛多多练到50级，交还布洛多多给库沙达，得到库沙达号角（魅＋５　可使用召唤术奔龙阵）-----[召唤巴朵兰恩攻击敌方单体--气扣20]\n\nPS：在暴龙团那里用羽毛或者被打飞到其它地方，任务就失败.在120飞龙区用羽毛或者注销到其它地方，任务也会失败！以上都可以原登，只是不可以离开~~~要是真的飞了\n就重新向阿谷拨拿基地的锁匙和库沙达的签名板。（要将基地的KEY丢掉才能在拿！）"
