      content: "                                    【First  Message  说 明 】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n程序：Stone-Walker                                 制作：『悟空』\n\n制作者：『韩天阳』\n\n说明：Stone－Walker－First－Message  又名《STW情报》，是由韩天阳新整理的最新石器时代情报，辅助工具STW共享\n\n中心地址：\n\n·http://bbs.tt2xz.com/\n\n行者论坛\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×3.0任务×", "『3.0任务』金飞龙航空任务【修正版】"]
      content: "作者：微笑赢家\n修改：韩天阳\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n一、条件：\n　1、80级以上(不包含80级)\n　2、完成成人仪式\n  3、捕捉飞龙名字为“帖拉格恩”“洛卡伦恩”“加宝格恩”“朵拉比斯”任意一个\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n二、准备工作：\n    【抓一只飞龙】\n    抓飞龙路线：福村-->石头洞穴 247,223-->门的洞窑 121 170 进洞抓\n飞龙一只（具体要求请看【任务条件】中的要求）\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n三、接任务：\n\n　1、带着飞龙，从鱼村搭飞机去米兰达机场，和打工名人克拉克（37，30）\n讲话，拿到打工证。\n\n　2、离开米兰达机场进入现代的波拉岛，来到（500,647)和霍特雷敦的助\n手说话，进入训练师的住所。\n\n  3、和霍特雷敦说话，接任务，再说话，他会拿走你的飞龙，并说少了祷\n只飞龙，叫你去打盗贼PC团拿002飞龙。\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n三、打盗贼PC团，拿悔过书\n\n如你有高宠在身，你可直接去（599,469)，进水坝遗迹上去打PC团了，没\n有的话就准备好，再回米兰达向（599,469)进发，进水坝遗迹，走法象英\n雄岛的水坝走法一样。\n\n进入水坝遗迹，\n水坝遗迹南方洞窟(43,5)→水坝遗迹南方地下一楼(10,7)→\n水坝遗迹南方地下二楼(18,13)→水坝遗迹南方地下二楼（48,77)→\n水坝遗迹北方地下二楼(16,27)→水坝遗迹北方地下二楼（46,73)→\n水坝遗迹北方地下一楼(54,5）→水坝遗迹北方地下一楼（7,38)→\n波拉山谷(89,12)→ 波拉山谷(24,90)打金刚阵\n\n打盗贼PC团金刚阵共三层，每次打了他都会跳转到别盗贼的前，继续点他打\n，一直到你过了这三层金刚阵为止。\n\n\n再到波拉山谷(58，20)打盗贼PC团队长，\n这里打的盗贼PC只会打血少的人或宠。\n打完再和队长说话，拿悔过书。\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n四、拿报告书\n飞回鱼村，坐飞机到米兰达，再到训练师的住所和霍特雷敦说话，拿到报告\n书。\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n五、进伊尼机场\n再走上一点和霍特雷敦的助手说话，就可进伊尼机场了，你就可以搭飞龙飞\n去伊甸了。\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n六、交报告书\n到了盗甸大陆之后，再去伊甸训练所(112，63)找飞龙总教练布鲁斯(13，4）\n，把报告书交给他，会得到20W石币。\n\n（全文完）\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n附：\n石器3.0重来首创2，但已变为电信2了，聚义的兄弟大多数都不玩了，有点伤\n感。加了金色时代，族长☆多多☆\n\n在此特别感谢:多多、萱萱、冰天使，阿里巴巴、阿健天使、巴巫、皮皮、雪\n上加霜、￡炫霓￡的热心帮助!！"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×3.0任务×", "『3.0任务』动物园任务详细介绍"]
      content: "作者：微笑赢家、爽朗、多多\n修改：韩天阳\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n条件：\n1、已成人\n2、80级以上\n3、解完天空之岛并且领取过黑羊\n\n建议：\n1、120级以上\n2、拥有强力装备\n\n暗灵法师最佳，完全可以单挑\n\n一、接任务\n进入动物园（30，96），来到（18，13）和青年说话，发现动物园的三只宠\n物不见了，再来到（30，10）和馆长接任务，任务要求是要拿三只宠回来，\n三只宠分别是，一级的雷尔胖、波波顿、拉斯基。\n\n二、抓一级的雷尔胖、波波顿\n1、抓雷尔胖\na、进动物园，来到（19,47）向布伊太郎说话拿到“雷尔胖专用饲料”\nb、在伊甸园，身上带著“雷尔胖专用饲料”来到（80,180）,你就可以抓到\n一级的的雷尔胖了。\n\n2、抓波波顿\na、进动物园，来到（19,47）点饲料桶“肉食性饲料2号”\nb、在伊甸园，身上带著“肉食性饲料2号”来到（173，172）,你就可以抓到\n一级的的波波顿了。\n\n3、交任务\n把抓回来的布伊胖，波波顿拿去和（20.47)的布伊太郎和（35，18）的鲛岛\n次郎说话，在去找园长说话，开始解第三次宠红色兔子拉斯基\n任务。（此时你必须带着刚抓来的宠物或者寄放到宠物店去，等3只都到手后才可交任务）\n\n\n三，拿红色兔子拉斯基（最难的任务）：\n\n1、准备工作：\n\n身上有不可思义的贝壳\n\n2、找园丁拿铲子\n\n首先找白色兔子里拉拉说话，以下是里拉拉会出现的坐标：\n\n01．伊甸园（171，102）\n02．剧院下面的水池附近（179，119）\n03．民房（169，132）内（013，002）\n04．宠物店（169，162）前面\n05．医院与肉商店之间（146，140）\n06．肉店（140，142）内\n07．雷尔家旁（132，96）\n08．格斗场门口（121，137）\n09．金飞旁的训练所（112，163）内（008，011─015，002）\n10．神秘老人旁（107，097）\n11．南城门口附近（102，180）\n12．宠物竞技场门口（058，139）\n13．林务局旁的员工宿舍（048，165）内（007，004）\n14．旅馆门口（038，116）\n15．伊甸园（021，115）\n16．动物园门口（35，98）\n17．动物园後面的民房（036，074）里面（002，002）\n18．动物园後面的民房附近（044，061）\n19．金飞飞龙航空下边的一个石头座椅的前面 （103,61）\n20．金色飞龙航空（内部）的一个坐著的小女孩（小吉利）的一带（111,5\n1）\n\n　再找园丁，以下是园丁出没的坐标\n\n　　（1）134，90\n　　（2）184，107\n　　（3）146，140\n　　（4）186，57\n\n　找到园丁以后，说铲子”，这样园丁会给铲子你，\n\n3、挖萝卜\n\n拿了园丁给的铲子，来到田园（177，74）点白色萝卜，就可挖到白色萝卜，\n一次只能挖一个，不能多挖。\n挖到以后立刻拿去找园丁鉴定再找园丁，以下是园丁出没的坐标\n\n　　（1）134，90\n　　（2）184，107\n　　（3）146，140\n　　（4）186，57\n\n直到他说这个萝卜还不差”就可以留在身上。\n\n4、拿红萝卜4，换上等白萝卜\n\n然后去鱼村，找特产商人买红萝卜4，有条件的话，可叫朋友邮件过来。\n\n有了“还不差的白萝卜与萝卜4”，与园丁说啦啦”（别乱说啊，拿不了\n别怪我），换了上等白萝，然后扔掉铲子。\n\n5、找白色兔子里拉拉7次，目的是让它提示“不是树的树的地方”\n\n以下是其中的一些它会出现的坐标：\n\n01．伊甸园（171，102）\n02．剧院下面的水池附近（179，119）\n03．民房（169，132）内（013，002）\n04．宠物店（169，162）前面\n05．医院与肉商店之间（146，140）\n06．肉店（140，142）内\n07．雷尔家旁（132，96）\n08．格斗场门口（121，137）\n09．金飞旁的训练所（112，163）内（008，011─015，002）\n10．神秘老人旁（107，097）\n11．南城门口附近（102，180）\n12．宠物竞技场门口（058，139）\n13．林务局旁的员工宿舍（048，165）内（007，004）\n14．旅馆门口（038，116）\n15．伊甸园（021，115）\n16．动物园门口（35，98）\n17．动物园後面的民房（036，074）里面（002，002）\n18．动物园後面的民房附近（044，061）\n19．金飞飞龙航空下边的一个石头座椅的前面 （103,61）\n20．金色飞龙航空（内部）的一个坐著的小女孩（小吉利）的一带 （111,\n51）\n\n找到兔子以后，只能与它说啦啦”，千万别说其它话，如说了，就取消，\n一定要记著和里拉拉说话只能说啦啦”两字。\n\n找里拉拉，和他说啦啦”，萝卜就会给它咬一口。\n\n到最后里拉拉告诉你“叫你去帮他拿格尔希洛的宠圈，他会给你拿项圈位置\n的提示，提示是“不是树的树的地方”，意思就是指林务处。\n\n6、打凶恶的格尔希洛，拿格尔希洛的宠圈\n\n接著，前往林务处，在那（19，162）走动遇敌（这里极易遇敌），遇到敌\n人是凶恶的格尔希洛。\n\n打凶恶的格尔希洛一点方法：最好两个人打，发现两人打容易出，宠物最好\n是120的NONO水雷，并带毒爪和镜子，不怕宠物掉忠的，可用自已宾宠物，不\n过我就惨打项圈打所有宠都变为NONO宠了。打到格尔希洛的宠圈是看运气，\n我运气不好，打了两天，有朋友打一次就有了，好运。\n\n打完凶恶的格尔希洛有机会得到格尔希洛的宠圈，得到项圈后，再去找2次\n里拉拉说啦啦”，在第2次，他提示你去帮他把黑色衣服带回来给他。\n\n7、打不良少年，拿黑色的服\n\n接著来到（113,146)雕像附近，走动遇敌，会遇到不良少年，不良少年攻击\n力普通，但懂摩法，不过很容易打，打赢有机会获得“黑色的服”，打完黑\n色的服，再找一次给里拉拉，和他说啦啦”，他就开始说他的朋友拉拉，被\n困在伊甸园地下洞窟里面被抓走了，希望你能去救他出来他才肯回动物园。\n\n7、打不良少年，拿黑色的旗子\n\n从（21，63）进伊甸地下洞窟，进洞后和（20，10）的少年说话进洞，直上\n四楼，走动遇敌，如遇到银猩猩--　尔希洛就立刻逃，遇到不良少年才打，\n感觉不良少年越多就越容易打出黑色的旗子，如是一队的人，只　一个人\n有黑色的旗子才可以不打了。因只要带队的有黑色的旗子，就能挑战席格。\n\n8、打席格，拿红色兔子拉斯基\n\n在伊甸地下洞窟，走上5楼，会看到一个蓝发少年叫“席格”向他说话，就\n开战，打赢后每人都可拿到“动物园养的拉斯基”打法提示：第一回合，忠\n犬，人加镜，以后不停加镜，人和宠，弹死席格后就随便打吧。\n\n四、完任任务，拿加敏恩铠的里拉拉的铠\n\n打完席格，拿到拉斯基，再找里拉拉说啦啦”，它会叫你把拉斯基还给动\n物园。进入动物园（30，96），再来到（30，10）和馆长说话交出三支宠物\n，园长就会送一只布伊胖送给你，拿布伊胖之后再去找里拉拉说啦啦”，\n他会收走咬过的白罗，并且会给你一个“里拉拉的铠”，是防＋40敏＋10\n的恩惠4铠。本人感觉，动物园任务到此完毕。下面将是拿两个不同属性LV\n2摩法的神秘老人任务。\n\n全文完\n\n在此特别感谢:：多多、萱萱、冰天使，阿里巴巴、阿健天使、巴巫、皮皮、\n雪上加霜、￡炫霓￡、爽朗、魔力豆豆、反骨仔-靓、angel、　铃 铛　、\n巴丹杏热心帮助，感谢\n的金色时代、浪人部落、天若有情家族的支持!"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×3.0任务×", "『3.0任务』神秘老人任务详细介绍"]
      content: "作者：微笑赢家\n\n1、已成人\n2、80级以上\n3、解了精灵王任务，拿了黑羊\n4、已完成动物园任务\n\n一、接任务\n\n前往伊甸园找神秘老人（107,97）接任务，神秘老人说：黑暗精灵王是他\n的主子要我们去找他，可能是没法力可以回去了吧！\n\n二、找“找宠物的小妹妹”\n\n　　以下是“找宠物的小妹妹”会出现的坐标：（114．157），（102．70\n），（159．112），（22，96），（43，117）\n\n　　找到“找宠物的小妹妹”，她会说：我把我哥哥的塔斯夫弄不见了，你\n要帮我寻找？\n\n　　然后去城门外抓橙鸡塔斯夫，等级不限，把塔斯夫抓到。\n\n　　再回去找“找宠物的小妹妹”，以下是“找宠物的小妹妹”会出现的坐\n标：（114．157），（102．70），（159．112），（22，96），（43，117\n）。\n\n　　把塔斯夫交给“找宠物的小妹妹”之后，她会把她爸爸常进入的迷宫通\n行证给你！\n\n三、找奇特的石头\n\n　　在伊甸园，前往（181，53），进入幻影之界，直上三楼，找奇特的石\n头。\n\n    注意：幻影之界分三楼，一楼可进四个不同的二楼，二楼可进四个不同\n的三楼（意味着有16个不同三楼）。建议用石头记着位置，用原地注销方法\n在三楼找奇特的石头，奇特的石头被拿到之后就会跳到另一个三楼，找奇特\n的石头是极烦的事情，大家慢慢找。\n    提示：如找不到，可回二楼进另一个三楼找，如再找不到就回一楼，进\n入另一个二楼，再进四个不同的三楼找。\n\n　　1楼敌人：扬奇洛斯、邦奇诺\n　　2楼敌人：风属性骑宠物的敌人\n　　3楼敌人：火属性骑宠物的敌人\n\n四、打黑暗精灵王，拿LV2魔法戒指\n\n   拿到奇特的石头，走回一楼，在（8，5）向石柱说法，它会传送你进入到\n幻影之界的5楼，再走上5楼，挑战黑暗精灵王。\n\n   黑暗精灵王并不强，一般三人人祷定可以打过了，打法是不停恩，不停毒\n，最后的精灵王用合击K死。\n\n　打赢黑暗精灵魔王之后，和他说话，会获得一个火或风LV2魔法戒指（只能\n得其中之一），如你不喜欢那个，就掉了它，直到拿到你喜欢火或风LV2魔法\n戒指为止。\n四、完成任务，再LV2魔法戒指\n\n   再去找（107,97）神秘老人说话，他会感谢你并且再送获得一个地或水LV\n2魔法戒指（只能得其中之一），如你不喜欢那个，就掉了它，直到拿到你喜\n欢地或水LV2魔法戒指为止。\n全文完\n\n在此特别感谢:：多多、萱萱、冰天使，阿里巴巴、阿健天使、巴巫、皮皮、\n雪上加霜、￡炫霓￡、爽朗、魔力豆豆、反骨仔-靓、angel、　铃 铛　、\n巴丹杏热心帮助，感谢的金色时代、浪人部落、天若有情家族的支持!"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×3.0任务×", "『3.0任务』心环任务详细介绍"]
      content: "作者：微笑赢家 多多\n修改：韩天阳\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n条件：\n1、已成人\n2、80级以上\n3、完成金飞航空任务\n\n一、准备工作：\n\n带上以下材料：\n\n1．圣兽之麟（麟11）               --池封印迷宫2楼（水精灵）＆没落的矿坑4楼(4x奇拉顿)。\n2．柔软的黏土（黏土4）            --萨村或卡鲁它那24店\n3．草的蔓（线2）                  --萨村或卡鲁它那24店\n4．千年花（花10）                 --吉鲁岛花花世界（8X级大象）＆５０年前英雄岛水坝南方洞穴（100~105级敌人）＆封印洞窟４楼(风精灵)\n\n二、前往水城\n\n进入水城方法：\n\n1、从伊甸园（10，120）出伊甸园；\n2、一直走到（34．214），进骨头拱门；\n3、进人祷个西方沙漠洞穴内信道，再走到（0，38）会进入西方沙漠洞穴外\n信道；4、在西方沙漠洞穴外信道往前走，走到（0．7）就会出来伊甸大陆西\n方；\n5、在伊甸大陆西方，一直走到（389．389），进入尼克斯城区；\n6、在尼克斯城区，走到（390．14），会到伊甸大陆南方，\n7、在伊甸大陆南方，走到（9．48），进尼克斯城区；\n8、在尼克斯城区，走到（372．248）过桥，走到（341．74）再过桥，走到（\n264．115）又过桥，走到（219．136）再次过桥，走到（219．200）过桥就到\n达水城。\n\n三、解任务\n\n1、在水城、到（55．51）找喀尔斯说话，接任务。\n\n2、到水城（83．32）找莉娜，并且跟他说喀尔斯”，她会给你一个花环。\n\n3、到水城（55．51）找喀尔斯，和喀尔斯说莉娜”，他会收下花环，并且\n会告诉你，想请你去找卡蜜儿。\n\n4、到水城（60．85）麦特家，找到麦特，和他说卡蜜儿”， 他没告诉你卡\n蜜儿的下落，叫你去找莉娜。\n\n5、到水城（83．32）找莉娜，并且跟她说卡蜜儿”，她会说想请你帮她\n做花环所要的各种材料，并且会给你一张制作花环的的原料表，所　原料\n如下：\n\n1．圣兽之麟（麟11）\n2．柔软的黏土（黏土4）\n3．草的蔓（线2）\n4．千年花（花10）\n\n6、因我们在准备工作时，身上已带有上述原料，所以再和莉娜说话，她会把\n这些原料都做成一个花贝项炼，\n\n7、到水城（60．85）麦特家，发现麦特不见了，但在地上看到一封信，和信\n说话，拿到一封信，发现卡蜜儿的踪迹。\n\n8、到水城（16．104）西南的空屋找卡蜜儿，把莉娜做好的那个花贝项炼交给\n卡蜜儿，她拿到花贝项炼后会给一封信你，要求你拿这封信交给喀尔斯，\n\n9、到水城（55．51）找喀尔斯，把卡蜜儿的信交给喀尔斯，喀尔斯看完信之\n后，会给一封信你，并请求你帮他在送一封信给莉娜。\n\n10、到水城（83．32）找莉娜，把喀尔斯信交给莉娜，莉娜看完信之后，请你\n帮忙在送一封信给喀尔斯。\n\n11、到水城（55．51）找喀尔斯，把莉娜的信交给喀尔斯，喀尔斯接下这封回\n信之后，会说感谢你的帮忙，并送你一个心之手环（攻-37 防+37 敏+37 魅+\n8）\n\n（全文完）\n\n在此特别感谢:：多多、萱萱、冰天使，阿里巴巴、阿健天使、巴巫、皮皮、\n雪上加霜、￡炫霓￡、爽朗、魔力豆豆、反骨仔-靓、angel、　铃 铛　、巴\n丹杏、够绘、大石牌兄弟热心帮助，感谢的金色时代、浪人部落、天若有情\n家族的支持!\n\n最令我感动的是阿里巴巴和冰天使对我的支持，帮我打猩猩，帮我打花10，\n帮我找里拉拉，帮我找石头，我深深向他俩致谢!\n\n还有多多、萱萱，一起陪伴着我完成全部3.0的任务,谢谢！"
