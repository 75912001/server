      content: "萨伊那斯岛(北岛)--萨姆吉尔村（东638,南493）（东708,南487）\n\n【村庄简介】\n萨姆吉尔村是尼斯大陆的四大村落之一，距离海底隧道、科奥山小洞窟，阿布洞很近，同时又通往波拉岛，可说是前往几大练功胜地最方便的一个村，因此聚集了许多人潮，现在已经发展成为人口最多的村庄。大量的人潮带动萨村的经济繁荣，仅仅一天的庄园税收动辄上千万，使萨村庄园成为各大家族最觊觎的一块肥肉，玩家间的买卖交易都是萨村神像与记录点之间进行，通常到各星系的第一颗或最后一颗服务器就可以见到热闹的交易市集。\n\n1.记录点的存点肉：凯比特肉（可在萨姆吉尔村村口打到）\n\n2.建筑物：\n■萨姆吉尔村长老家：可以在此与家族服务员对话加入家族，还有家族留言版、家族银行、占卜师等服务。\n■聊天室：购买门票就可以进入聊天室内聊天，还有表演舞台！\n■长毛象快递：可接受委托送货任务赚钱的好地方。\n■竞技场：玩家可在此购买门票进入竞技场PK。竞技场内贩卖的物品请参阅竞技场商店街。\n■宠物店：四大村的宠物店除了可以买卖宠物、让宠物学习技能外，也可以将宠物寄放在宠物店，可以寄放的只数跟您转生的次数有关，转的越多，放的越多，未转生可以寄放五只。\n\n技能\t功能\t价钱\n待机\t什么也不做\t500S\n攻击\t通常攻击\t1000S\n防御\t通常防御\t1000S\n破除防御\t对采取防敌人攻击可能\t1500S\n连续攻击\t两次连续攻击\t2000S\n背水之战其之1\t防御力变成-30%攻击力变成+30%\t2000S\n泥醉攻击\t攻击力-30%三回合前后让敌人酒醉\t2000S\n加工\t合成素材制作道具\t1500S\n料理\t使用素材制作料理\t1000S\n\n■道具店：买卖首饰、耳环等等装饰品。\n\n贩卖物\t功能\t价钱\n青色双重耳环\t攻+1 防+1 敏-1魅+1\t1000S\n阿萨LV1贝铃\t魅+1大地的精灵LV1\t300S\n阿萨LV2木笛\t魅+2大地的精灵LV2\t700S\n阿萨LV3鸣子\t魅+3大地的精灵LV3\t1200S\n木的戒指\t魅+1会心一击率上升+2\t1600S\n黑色小首饰\t魅+1毒耐性+10\t3400S\n红色小首饰\t魅+1石化耐性+10\t3000S\n小骨小首饰\t魅+1睡眠耐性+10\t2600S\n绿色小首饰\t魅+1混乱耐性+10\t4000S\n青色小首饰\t魅+1酒醉耐性+10\t2000S\n红色小耳环\t魅+3回避率上升+1\t500S\n\n■武器店：买卖武器和防具。\n\n贩卖物\t功能\t价钱\n小斧头\t攻+9 防-3 敏-3\t65S\n莱伊卡LV1斧头\t攻+7 防-2 敏-2酒的精灵LV3\t105S\n普通普通的斧头\t攻+14 防-5 敏-5\t260S\n轻的斧头\t攻+19 防-7 敏-6\t1040S\n大的斧头\t攻+32 防-11 敏-11\t6500S\n小棍棒\t攻+4\t50S\n普通普通的棍棒\t攻+8\t200S\n重的棍棒\t攻+17 敏-1\t2300S\n小的枪\t攻+5 敏-1 魅+1\t60S\n普通普通的枪\t攻+10 敏-2 魅+1\t240S\n大的枪\t攻+25 敏-5 魅+3\t6000S\n小的爪\t攻+3 (×2)\t55S\n普通普通的爪\t攻+6 (×2)\t220S\n重的爪\t攻+13 敏-1 (×3)\t2530S\n小的投掷斧头\t攻+4\t50S\n轻的投掷斧头\t攻+11 敏+1\t800S\n粗杂的兜\t防+3\t50S\n普通普通的兜\t防+4\t200S\n轻的兜\t防+5\t800S\n美鲁菲LV1兜5\t防+8 敏-3 净化精灵(毒)LV1\t5750S\n破烂的帽子\t防+1\t40S\n爱鲁菲LV2帽子2\t防+1净化精灵(石化)LV2\t280S\n普通普通的帽子\t防+3\t640S\n粗杂的铠\t防+4 敏-1\t75S\n哈鲁LV1铠2\t防+6 敏-2治愈的精灵LV1\t400S\n轻的铠\t防+11 敏-2\t1200S\n破烂的服\t防+2\t60S\n提欧LV1服2\t防+3恩惠的精灵LV1\t528S\n普通普通的服\t防+7\t960S\n\n■医院：这里不但可以买到补体力和气力的药，也可以花钱回复体力和气力，价钱因等级差异、受伤程度有别，宠物则可以免费医治。医院中还有一个美容师可以帮您提升魅力，当然，这也是要钱的，价钱会因魅力的多寡、等级的高低而有不同。玩家要注意的是，同样的药在不同的村庄价钱不一定相同！\n\n贩卖物\t功能\t价钱\n耐久力回复药\t耐久力100前后恢复\t25S\n耐久力回复药\t耐久力200