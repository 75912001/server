      content: " ┌───────────────────────────────-┐\n │ 6.0新任务--沙漠之鹰盗贼                                       │\n │                                                               │\n │ 任务地点：北岛卡坦村（２５９．１７１）                        │\n │                                                               │\n │ 适合等级：60级以上                                            │\n │                                                               │\n │ 任务内容：                                                    │\n │                                                               │\n │ 一  前往村内座标(98.103)找\"塔可登\"说话接取任务                │\n │ 二  请拿着\"假的货物\"引盗贼出现..然後帮他将盗贼一网打尽        │\n │ 三  此时就前往村外遇敌..会遇到LV5X级的加斯.加比奥与LV60 的\"沙 │\n │ 漠之鹰盗贼\",玩家的目标就是盗贼..打败沙漠之鹰盗贼会得到\"盗贼的 │\n │ 悔过书\"                                                       │\n │ 四  接着将\"盗贼的悔过书\"与\"假的货物\"拿去给塔可登              │\n │ 五  解完之後就会送你一个道具\"卡坦的旋风\"                      │\n │                                                               │\n │ 任务到此结束...                                               │\n │                                                               │\n │ 任务奖品：卡坦的旋风（回旋标攻＋２４魅＋３毒雾ＬＶ５）        │\n │                                                               │\n └───────────────────────────────-┘"
