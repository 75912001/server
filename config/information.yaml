      content: "条件：\n1.一共需要76级以上，已完成成人任务的2个人物，\n2、每做一次要花2万石币。\nA人物加加出发\nB人物原登在石头洞穴的出口处 吉鲁岛（178.159）一带\n\n人物A开始按功略说的做任务\n\n-------------------------------------------------------------\n以下由微笑赢家提供\n\n任务流程：\n1、来加加村长家门前(94、60）和霍奇斯说话，接任务，他会给你一支手\n电筒。\n2、从(99、63）进入水井地下通道，一直往前走，在（27，5）进入水井地\n下洞窟，再往前走，来到（30，49）和庄董说一大段话，交出手电筒，拿\n到一张加加村旅游指南。\n3、拿到加加村旅游指南后，前往加加便利店（107，111），在便利店内会\n遇到女人宠艾蜜，打败艾蜜可得到乌鲁力村旅游指南。\n4、拿到乌鲁力村旅游指南后，前往乌鲁力村（南岛549，746），在乌鲁力\n村来到（48，65）进入肉店，在肉店内会再遇到女人宠艾蜜，打败艾蜜可得\n到柯奥海底隧道通行指南。\n5、拿到柯奥海底隧道通行指南后，前往柯奥村（北岛473，630），在柯奥村\n（437，630）进入柯奥海底隧道，来到柯奥海底隧道地下2楼会再遇到女人\n宠艾蜜，打败艾蜜可得到玛丽娜丝庄园旅游指南。\n6、拿到玛丽娜丝庄园旅游指南后，前往玛丽娜丝村庄园（北岛71，589），\n在庄园会再遇到女人宠艾蜜，可用猛毒武器把艾蜜毒为1血，然后捉起艾密。\n7、捉到艾密后，回加加村，再次进入水井地下洞窑，和庄董说话，交出艾\n蜜，拿到布伊比的牙齿。\n8、前往达那村，来到（343，191）进入五兄弟的山洞，一直往上走到4楼，\n会遇到男人宠雷诛，可用猛毒武器把雷诛毒为1血，然后捉起雷诛。\n9、捉到雷诛后，回加加村，再次进入水井地下洞窑，和庄董说话，交出雷\n诛，拿到一张借据。\n\n\n（大概需要不到1小时可做完）\n--------------------------------------------------------------\n\n注意：\n10、A人物前往福村，走到（247，223）,进入石头洞穴，走出石头洞，来到\n小象区，会遇到新的男人宠讦谯龙，遇到后点HELP，B人物打死讦谯龙得到\n讦谯龙给庄董的信，A人物千万不要打，打了就不能快速做了。\n\n11. B人物拿到讦谯龙给庄董的信后回水井地下洞窟和庄董说话，交出讦谯\n龙给庄董的信和2万石币拿到收据.\n\n12. 拿到收据后，B人物再次前往福村，走到（247，223）,进入石头洞穴，\n走出石头洞，来到小象区，会再遇到Lv79讦谯龙，可用猛毒武器把雷诛毒\n到血100以下，然后捉起讦谯龙，并交出收据，没收据再不能捉到讦谯龙了\n。然后A人遇敌，遇到讦谯龙点HELP，B人物打死讦谯龙得到讦谯龙给庄董\n的信，（给的几率差不多100%）A人物还是不要打。B人物带者讦谯龙给庄\n董的信和Lv79级讦谯龙回加加.\n\n13.B人物去水井地下洞窟和庄董说话交出讦谯龙给庄董的信和2万石币拿\n到收据.在重复10-13环节每拿一次10分钟.很快吧！大家可以试试。\n\n改点酒分四种，分别有以下功能（注意要修改的点如不够10点千万别用，\n会浪费的）：\n\n白兰地　　腕力10点重新分配\n伏特加　　敏捷力10点重新分配\n威士忌　　体力10点重新分配\n高梁酒　　耐力10点重新分配\n\n在任务中所拿的正.收据等原登都还会有请大家放心！\n\n以上由F7→王笑南← 提供\n在此我们感谢他"
