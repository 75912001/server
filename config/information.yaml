      content: "BOX_飞鸟∠\n\n声明一下,这些数据是根据3.0到5.0阶段来判定的,石器更新换代巨快,内定属性参数也在不断变化,如果这个规律已经被修改,那么7.0和7.5的玩家很可能会觉得我提供的资料有很大误差.\n不知道2.0,2.5服务器有没有改,没改的话,祝贺你!看了本帖一定对你的PK技术提升产生巨大影响^^\n\n大家都知道,在职业技能,变态宠技没有出现之前,影响PK,尤其是团P实力的主要就是属性的调控和状态精灵的压制以及防守精灵的使用.\n强化和放手精灵镜光守的使用是普遍被了解的规律,但是状态精灵的压制可能就不是人人都知道如何掌握了.\n是的,大家都知道状态精灵的成功几率和当天人物运气和系统随机判断概率以及敌人佩带抗精灵首饰有关,但有一个最主要的决定因素是人物的属性!\n以下的探讨就围绕人物属性展开,状态防止首饰判定为不佩带.\n石器时代的基础属性是地,水,火,风~纯10属性的作用已经在4.0,5.0魔法戒指流行的时代被验证,但是,它们与一个合格的优秀精灵手无缘,如果你想做一个施放精灵的高手,拥有非比寻常的高精灵命中几率,就必须舍弃纯10属性,1.82开始流行了水10有高精灵抗性的说法,是的,它比其他3个纯属性有教高的抗性,但是和标准精灵手来说差距何止几个层次?\n\n标准的精灵手属性是这样的:\n首先判定认为:地对应石化,水对应睡眠,火对应混乱,风对应猛毒\n\nNO.1石化手(飞鸟在中网3一直是石化手)\n\n*标准的石化手的属性是地3水7到地5水5,随着水属性数值的增加,你释放石化的成功几率增加,随着地属性数值的增加,你抵抗石化效果的能力就增加~\n*因为地火属性不相互克制,该属性的精灵手抵抗混乱效果的实力也很强\n*但是,因为和水,风属性有克制关系,你中睡眠和毒的几率非常大!并且中睡眠的几率大于中毒的几率,我个人以为,这是JSS在设计石器时代之初就考虑到的一个参数,平衡属性间的实力,你克制的属性擅长的状态精灵反而克制你的抵抗力,也就是这里的石化精灵擅长的人怕睡眠精灵!这个设计堪称石器时代中微妙细节平衡的典范!\n*不幸的是,在7.5中已经被破坏,7.0未知,7.5我实验过是因为参加了当时的体验服务器\n*PK中选择了这一系列属性的你,精灵武器选择石化精灵,B3B4首饰选择抗睡抗毒,不要怀疑,你中睡眠的几率相当高!不佩带抗睡被敌人放睡90%中\n*地5水5属性90%以上几率不会中石化,80%以上几率不中混乱.但是释放石化成功的几率要比地3水7者低,后者的抵抗力比你低!\n*PK中如果发现你的敌人连续不中石化,不要怀疑,换上一把睡眠武器,让他沉睡去吧!\n\nNO.2睡眠手\n\n*这个精灵手的属性我一直没有摸索出来,真的非常抱歉,私以为水10可能比较有优势\n*同理,睡眠手抗睡眠和毒的能力很强,不过石化和混乱你可要小心咯,戴上扛它们的B4吧!\n\nNO.3混乱手\n\n*属性推荐水2火8,水3火7\n*你释放混乱精灵成功的几率很高!\n*毒和睡眠是你要小心的精灵\n*石化一般无法难倒你,但也要注意~\n\nNO.4施毒手\n\n这个有没有无所谓的说~一般没人用毒吧\n*推荐属性:火风搭配,火的属性值应该比风属性值要高\n*自己容易防止的属性和容易被命中的属性根据前面介绍的方法类推~\n\n好了,就这么多了,最后总结:\n*这些东西和你平时打怪练级包括做任务打NPC打BOSS无关,只在PK当中体现效果\n*即使你不是精灵手,也可以根据这个法则来推理自己B4首饰的搭配,解人,医生尤其要重视!\n*这些规律是我自己PK总结和建立新号实验的结果\n*适用范围3.0到5.0,因为我玩的就这段时间~前面说了,版本时常更新,恐怕有变~\n不过2.0,2.5服应该变化不大吧~希望对各位游战在石器中的PK狂热者们一点点微不足道的帮助^^\n\nPS:关于现在石器7.0,7.5的玩法我可是一窍不通啊,我想练个白狼或者暗灵,潜能该怎么加?属性该怎么搭配啊?希望各位大虾可以开帖跟我这样的\"老牌\"菜鸟讲座讲座~哈!\n"
