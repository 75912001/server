      content: "BOX_威尼斯の泪\n\n『推测』⒎5战队/战宠搭配『介绍』\n\n⒎5即将来临..\n大家都很关注战队问题.\n那么.\n我就根据我仅有的.局限的经验来针对此问题发表下:\n战队配合通常有几种:\n⒈\n5法师队:\n⒎5法师的闪避没⒎0的强了.然后.法师的暴风雨导电之后用电流术的伤害也是蛮大的.而且.Lv5魔法的杀伤力也蛮大.杀有抗性的人200多.(宠和人分别承担50%-也就是100多点).没抗性人杀到直接就OVER.魔法杀C的话.损血量也不克低估.假若4个人一起放LV魔法.你的宠也差不多Over了.\n法师从抗打击能力来说的话..比任何⒈个职业的抗打击都强.因为他不用一味的追求攻.\n攻击指数:☆☆★★★\n抗打击指数:☆☆★★★\n⒉\n2法2白1追:\n2法师的主要任务是属性和加血.不过这个搭配只适合有净化C的队.\n2白狼的任务是把整队的攻击力度提高.(⒎5白狼的混乱攻击是很BT的.还有贯穿攻击..总而言之..攻击力强.)\n⒈追的目的是弥补⒎5法师的冰箭不能冰住人的缺点.同时可以当当属性手或者是护士/精灵手...\n攻击指数:☆★★★★\n抗打击指数:☆☆☆★★\n⒊\n1法4追:\n1法师的主要任务是加血.净化.4追列负责属性/精灵/(外加-天罗地网-此技能相当于冰箭.蛮实用的).这个配合主要的打法是以精灵为主.宠物攻击为辅.---精灵战..比较稳的打法.\n攻击指数:☆☆☆★★\n抗打击指数:☆★★★★\n⒋\n1法4白:\n1法师的主要任务是加血.净化.\n在此.4个白狼的情况下.1个敏稍微高点的白狼牺牲一回合放属性.其他3白狼混乱攻击(在需要的情况下贯穿攻击)..其余回合4狼攻击+宠物攻击.\n攻击指数:★★★★★\n抗打击指数:☆☆☆☆★\n---------------------------------------\n以上4支队伍的点数分配完全看自己需要了..\n---------------------------------------\n再来谈谈宠的配合和准备:\n以下宠只是推荐⒎5的团P宠.\n⒈机龙\n机龙不凡的成长配合BT的T技.是一种恐怖的宠.不NONO的情况下飞人也不是难事.⒉转之后实力相当强悍..\n⒉狂暴牛\n⒉转后的狂暴牛比融合宠成长高.但因为我本人没2转过牛.不知道2转牛的攻是多少.按1转牛的420左右算.2转最高可以达到460~470吧.不输其他融合.而且总成长可以到8.0up.蛮不错的.\n⒊水魔\n2转后的水魔防可以达到380.血可以达到2200up.配合白狼队蛮不错的.\n⒋克雷多\n2转克雷多可以达到500up攻.防敏都不错.虽然总成长没培罗多高.不过攻比后者高得多.实用价值当然就比后者高.完全可以代替转火双.转朱雀(2转朱雀就比不过啦..-.-)\n目前我只觉得这几种C在⒎5比较有前途.\n⒌三技\n这个就不用多说了...每个队都是必要有一只的..\n而朱雀不是大众C.就另当其谈..\n===============================================\n看了其他石器论坛，都有些7。5的资料\n但是我门BOX论坛就没几个\n汗\n\n发上来个7。5PK职业经验给大家看看\n虽然是转帖\n但是有这样的帖子也不容易啊"
    - path: ["『BOX资料库－－搜集整理库』（V2.0）", "『石器8.0』石器时代8。0部份资料boxbbs抢先曝光"]
      content: "BOX_卡卡西沉默\n\n虽然大陆玩家仍然还没有全部都玩过石器时代7。5，但是这并不影响石器时代8.0的制作进度。\n本次，boxbbs就为您揭开部分石器时代8。0的资料。\n本文特别感谢华义软件公司的设计人员的资料提供。\n一． 宠物装备系统\n最近，应该一些喜欢观看台湾石器的朋友，一定看到了“冰云”的工头日记，在当中，一个8.0的新系统就在当中透露了，那就是宠物装备系统。\n这一设计，符合了之前台湾石器设计师“酷哥”所说的“人物已经太强了，需要把宠物方面加强.”\n而这一设定，将为不同的宠物得到不同的属于自己的装备。（目前资料看来，应该是每种宠物有属于自己的装备，而不是相同的.）\n而这些装备，就是为了加强宠物的能力，根据资料看，可能也和宠物二转有些相同，并不是所有宠物都有，而是一些特定宠物。\n而宠物装备系统，也将带来合成的再次振兴。因为根据资料，宠物装备的获取方式将为：合成+任务。\n二． 融合宠物继续增加\n从5。0开始，就开放的融合宠，8。0将会继续设计20只左右的新融合宠。\n而因为现在宠物的能力，能否融合宠超强战宠呢？\n二转宠物能否参加融合呢？暂时没有资料。\n\n其他资料，比如8。0即将开放的新宠物、人物的新骑宠、7。5就应该开放的人龙的获得方式等资料，就请继续支持我们的boxbbs.com和e-stone电子杂志。\n我们将在今后的网站和杂志中继续为您带来石器时代的最新资讯。\n打造中国第一石器资讯。\n\n转载请注明作者和网站。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 7.5经验大全】", "《石器终级研究之石器装备论》(适用任何版本)"]
      content: "《石器终级研究之石器装备论》(适用任何版本)\n\nAOIO_辉_扳指玉\n\n★第一部分：5格旧装备★\n\n5格是指头盔，衣服，右手，左饰和右饰\n\n【头盔】\n\n头盔可以分为2种：无精灵和有精灵\n\n●无精灵\n\n因为头盔属于加防的装备，所以头盔在无精灵的状态下防就必须充分发挥优势！现在最好的无精灵头盔为“苍绿之兜3”(防+115)。\n\n●有精灵\n\n头盔可以加的精灵最有用的是净化精灵，所以头盔精灵最好的是“高等净化精灵Lv2”。带有这种精灵的头盔价值非常高，所以千万不要轻易出手！\n\n【衣服】\n\n衣服最好的可以分为3种：无精灵，恩惠精灵和滋润精灵\n\n●无精灵\n\n因为衣服属于加防的装备，所以衣服在无精灵的状态下防就必须充分发挥优势！现在最好的无精灵衣服为“苍绿之铠3”(防+155)\n\n●恩惠精灵\n\n现在最好的恩惠精灵衣服为灵力铠(5级恩惠，费气20)，这种衣服属于平民级，几乎人手一件！6级恩惠在7.5版本有出！但根据费气情况估计最少要剩70的MP才能施放6级恩惠，再加上得到6级恩惠难度非常高，属于帝王级的！所以即使有也是鸡肋！\n\n●滋润精灵\n\n4级滋润衣服也属于平民级！5级滋润在7.5版之后也化为平民级，因为5级滋润衣服属于2级职业装，所以不难得到！6级滋润是最好的滋润衣服，但跟6级恩惠一样，属于帝王级的！所以如果有幸做任务得到，千万保管好！\n\n-----------------------------------------------------------------------------------------------------\n\n【右手】\n\n右手武器可以分为3种：无精灵，辅助攻击精灵和滋润精灵\n\n●无精灵\n\n因为右手武器属于加攻的装备，所以在无精灵的状态下攻就必须充分发挥优势！现在最好的无精灵武器为“焰红之斧3”(攻+195)。双尖枪是2次攻击，所以没有焰红之斧3拿这把。\n\n●辅助攻击精灵\n\n辅助攻击精灵指的是睡，石，醉，毒，混5种精灵！常用的是5级，最高在7.5版时有6级！之前最常用的是精灵爪，但现在只要带了5级精灵，什么武器都可以！6级虽然好，但跟5级差别不大加上难得到，所以有跟没有都不会太在意！5级的精灵武器不需合，买或要都不难！\n\n●滋润精灵\n\n其实说的就是双头叉，这把武器练级PK做任务都很实用，带5级滋润。由于相对难得到！所以有算你幸运，没有也就算了！\n\n【左饰和右饰】\n\n可以分为2种：有精灵和无精灵\n\n●有精灵\n\n是指乐器和护身符\n\n乐器大概就属性乐器4种和极光乐器1种共5种\n\n乐器是PK和做任务的必需品了！可见其重要性！\n\n护身符主要是指萨姆吉尔首饰，镜，守护和高等净化2这4种，PK必用品！\n\n争议最大的是镜的存在和使用！其实破解镜的方法很简单：\n\n（上策）在镜的作用发挥之前制敌\n\n（中策）直接破镜\n\n（下策）套守护盖住镜的效果\n\n-----------------------------------------------------------------------------------------------------\n\n●无精灵\n\n指的是耳饰，戒指，手环和首饰AB\n\n耳饰和戒指属于对立的，具体数值的差别看不出什么效果！练级才有用！\n\n手环：最好的是手环10，单项+75！做任务和练级用的！PK用的话效果不是很明显！\n\n首饰：PK专用品！最好的是B4和A6，但不一定！有时候B2更有用！要多次使用才能感觉出来！\n\n【综合】\n\n无精灵的武器和防具可以用魔法戒指来镶嵌进去！7.5版出了5级魔法是最高级的魔法！以后要是出了新装备的话，大家可以对照上面的分析看这些新装备到底值不值得买！\n\n如：带净化沉默的兜就不必刻意追求了！\n\n费气比灵力铠多很多的恩惠衣服，即使加敏也不用去买\n\n★第二部分：4格新装备★\n\n4格新装备是指左手，腰带，鞋子和手套\n\n特点是这些新装备都没有带精灵！或者说有带精灵也施放不出来！\n\n【左手】\n\n左手可以分为3种：纯防，不纯防和空手\n\n●纯防的话指的就是盾牌了，因为加了新参数：格挡率\n\n格挡率：应该是指有一定的机率损1点血！不管对方攻击多强！\n\n●不纯防指的是加了其他参数或只加五围的武器如\n\n加反击率加攻加敏加血加MP之类的\n\n到底选择哪种左手就看个人喜好了！\n\n●空手的话指的就是右手拿弓箭，左手当然就不能再拿了\n\n弓箭以乱射弓威力最强(全体攻击)\n\n【鞋子和腰带】\n\n这2格实际上是弥补首饰栏2格的不足，说得比较清楚一点就是弥补敏的效果\n\n敏的效果：\n\n1.攻击效果：先出手率，物理命中率，精灵命中率，反击率和合击率\n\n2.防御效果：物理回避率，精灵回避率\n\n3.其他效果：负重\n\n这2格加的攻防敏都可以忽略不计，攻甚至1点都没加！\n\n题外话：闪避率可能就是物理回避率和精灵回避率其中之一\n\n详细解释下首饰的效果\n\n戒指：敏的命中率\n\n耳饰：敏的回避率\n\n首饰AB：敏的回避率\n\n手环：增强武器(攻)和防具(防)的数值\n\n护身符：增强防御效果\n\n乐器：增强攻击效果\n\n【手套】\n\n手套的出现实际上是弥补转生的不足意思就是：\n\n1.每次都80转的跟每次都140转的差别就在于一个手套的数值\n\n2.7个手套的差别就是0，1，2，3，4，5，6转的差别！当然不是很准确，但就是按这个意思设计出手套的！(不相信的话可以用高数的线性回归分析)\n\n★第三部分：未来的石器装备★\n\n【未来的职业装备】\n\n法师：法师攻击以魔法为主，所以未来装备也应以加MP和魔法攻击力为主\n\n白狼：白狼攻击以攻击力恐怖著称，所以未来装备也应以加攻击力和命中为主\n\n猎人：猎人攻击以人宠配合为主，所以未来装备也应以加平衡各项能力为主\n\n【未来的共用装备】\n\n肯定会一套一套的出！但只要分析新装备的特点就可以决定他出现的价值值不值得我们再去花RMB买！\n\n主要按以下方法来分析：\n\n1.将来贬值的幅度有多大。一泻千里就不必买了！如迪克装\n\n2.整体实用价值高不高！因为新装备追求的就是单一价值！很单一就不要买了！如华义的半套职业装\n\n3.新装备对旧装备的影响大不大！不大就不必买了！如海蓝装\n\n\n\n〖预告〗《石器终级研究之宠物取舍定律》(适用任何版本)\n\n石器的宠物已近400只，天上飞的，地上爬的，海里游的，自己生的(融合)，华义养的(RMB)\n\n这么多我该要哪只呢？宠物贬值后我该怎么办？新宠我要不要买？猴子要不要出手，机暴会不会淘汰？\n\n《宠物取舍定律》告诉你！尽请关注！"
