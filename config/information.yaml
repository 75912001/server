      content: "3.0的古瓜任务                                                『修改：韩天阳』\n\n条件:◎完成金飞任务\n     ◎神秘老人任务.\n\n于塔耳塔地城东南区(25.26)进塔耳塔战士团里.\n在里面的(33.28)下楼梯到塔耳塔战士团餐厅.\n在餐厅里当场找(13.13)古瓜接任务.\n听了古瓜说了一堆话.当了他的帮手.\n要你找香味浓厚的香草.新米.毛蟹.深海鱼.新鲜的贝等材料.\n二话不说当然冲去渔村24小时买齐这些材料了.\n注意:此材料也可以用寄的过来\n拿回来给古瓜後再上楼找(33.16)的汉斯说话.\n他会同意你而让你带古瓜出去.\n注意:带着古瓜一样可以放出来跟他说话.\n带着古瓜走着走着.走到伊甸医院旁(154.147)与伊吉欧说话.\n古瓜跟伊吉欧比试后.目前当然输了.\n接着带着古瓜.带他去加加百人道场.\n到加加村里(111.80)进去挑战百人\n过了后在(24.14)跟欧司马说话他会将古瓜带走.\n要你再至卡鲁它那道场去接古瓜.\n到卡鲁它那里面(81.107)进到场.\n注意:此处上楼法可参考猜谜三兄弟.\n终于到了12楼.再到(23.15)与姆罗伊说话.\n他会将练到100级的古瓜交给你.\n再到玛丽娜斯村24小时店里(17.45)找雅修说话.\n他会要你买10万的尼斯特产.因而给他10万拿到尼斯特产.\n注意:尼斯特产拿到後不能登出会不见.\n拿了特产的古瓜当然要再找伊吉欧比划比划.\n带去伊甸医院旁跟伊吉欧比划后.古瓜当然赢了.\n他会告诉团长的女人英嘉在贫民窟里.\n动身前往贫民窟.在伊甸(20.64)进伊甸地下通道第一层.\n走到(6.4)进去就是贫民窟了.\n进入后到(33.6)与席巴恩说话.\n注意刚开始直接说话没作用.但古瓜变战斗时就能进了)\n进贫民洞窟地下通道(9.6)与席思说话即进入战斗.\n战斗完会传送到英嘉的房间.\n到(12.12)与英嘉说话.\n她会送你千年枪铠(塔耳塔战士团的精神象徵)\n再回到地城战士团与汉斯说话.\n他会收回古瓜与千年枪铠.\n下楼找古瓜.他会收回尼斯特产.\n而做五道菜送你.拿完菜再去找英嘉报消息吧.\n英嘉会答谢你而送你地魔法戒指Lv3\n注意:此任务不像前面任务.戒指丢了再拿还是地魔法戒指Lv3.\n再回去找汉斯会得到战士铠(塔耳塔战士团的代表防具防+52敏-13).\n找卡夫尔会得到战士枪(塔耳塔战士团的代表武器攻+64敏-13魅+7).\n注意:两样只能选一样.而且考虑好再拿.无法丢了再拿取.\n\nPS：7.0道场必须靠手动答题，具体题目请见北岛金猪任务（7.0华义封了穿墙）"
