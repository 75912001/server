      content: "作者：MX_飞天御剑流\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n【极品类存放重要物品类仓库】：\n条件：\n1，首要条件是高转，只有五转才能拿最多的石币，寄放最多的宠物和道具。\n2，其次，就是仓库足够敏逃跑到任何地方拿物品（人敏500+，戴萨首饰，应该走遍天下都没问题了吧！），因为高敏的关系，所以也不必要专门的骑宠了，有扔之可惜用之垃圾的鸡肋宠给这个ID在挑NPC的时候用就可以了。\n3，人在伊甸记录并能使用传送师，下去尼斯用毛，去漆黑也不会很远，总比动不动就坐两次飞机好吧。虽然说一般都用宠物邮件，但是有条件自己走来走去，总比没条件的好吧。\n4，身上尽可能多空位和C位，准备随时接手东西（当然仓库本来就是用来放东西的，又要求空位多是相矛盾，但最好也尽量能空出多些位置来吧）\n5，7.0的玩家还要尽量有增加负重的道具装备着（如最简单的白石腰带，以后这类增加叠加数目的道具会再推出的）\n6，有自己所有重要ID的名片（超过40个的话，自己想办法吧），最好还要有空余的名片位置，免得动不动就来个“名片匣已满”又要烦恼删什么人的名片了。那些不认识的人的名片就删了吧，留着没意思，反而有时候用外挂邮寄东西，错寄了给那些人就哭也来不及了。\n7，银行可以用做存放石币之用，身上带上50W以上的石币，以免有时候需要买装备给其他挂机ID穿（如去地庄买铠）。\n8，垃圾野生土羊（凯村有得捉，敏最好上170）一只，长期放于身上用作邮寄之用。\n\n\n【普通类存放重要物品类仓库】\n条件：\n1，5转1级就可以了，长驻萨村或渔村。\n2，身上尽量多道具空位和宠物栏位置。\n3，有自己重要ID的名片（陌生人名片删删删）。\n4，7.0的玩家应让仓库装备白石腰带。当然不要也可以，只差一个叠加数目。\n5，身上带有10W石币，用作寄放道具或宠物，银行可作存放石币之用\n6，垃圾野生土羊（凯村有得捉，敏最好上170）一只，长期放于身上用作邮寄之用。\n\n\n其他：\n【修理工】：\n常常有人单挂金暴或者什么的，要是自己跑回来修东西实在是太浪费时间了，特别是7.0走路卡人简直让人无法忍受\n所以修理东西最有效率的，还是找专门的修理工，这类人当然可以用上述两种人物来当\n条件：\n转数随便，级数随便，身上有足够空位，石币100W或以上，带个修复技能的C就可以了，长驻萨村，有自己重要ID的名片。\n效率较高的方法是把修复素材寄给正在挂机的ID让他们自己修（条件是挂机ID身上必须有宠会修复技能），这样就省了一次邮寄宠物邮件的时间了\n补充：修理工最好身上带有双头叉，当挂机ID的叉子损坏了的时候，修理工可马上把自己的新叉子寄给挂机ID，挂机ID马上装备上新叉子并把旧叉子寄回给修理工，修理工接收到叉子后慢慢的换都可以了。此办法可让挂机ID不必专门停下来不遇敌等叉子寄回，提高挂机效率。\n\n\n【精工or加工人】：\n推荐使用上面所说的极品类仓库，炼铜条铁条要去火城，做宝石和铜装备又要去地城，所以最起码要在伊甸四城其中之一记录并能使用传送师，身上尽可能多空位。有齐自己素材号的名片。石币100W以上少不了。最好有只镶宝石技能的兔子随身带着。\n\n\n最低层：\n【免费5小时类仓库】：\n很简单，开头创建人物时系统自动帮你交换的名片全部删了，身上带上10000石币，就行了，此类ID用来寄放如豆子、5级药等“消耗品”。\n每次登陆这类ID最好不要超过一分钟，自己看登陆次数，左右人物一共200次以上的话要小心了，此ID随时没点下次可能会登不上，要准备好物品转移。\n附：免费五小时号=可以支持5小时=可支持300分钟=可支持300次的每次不超过一分钟的登陆。保守计算200次左右就要准备抛弃此账号了\n\n\n〖7.0仓库叠加技巧〗（可能已经有人发过）：\n就是找个尽量可以叠加多东西的人物，把素材叠加好，然后用宠物邮件寄给低转的ID。如：5转的人物装备白石腰带，可放11个道具，叠加好11个道具之后再邮寄给低转的ID，就可以实现低转ID享用高转叠加数了，叠加好的11个道具可以寄放可以拿出，但扔出后再捡回是不能再叠加上去了，这点要注意。另外用交易方法想实现低转拿多叠加数是不可以的，一定要邮寄，邮寄完后可以删除名片以免浪费高转人的名片位置。\n\n若嫌麻烦，大可以按照你们自己平时的方法去设置仓库，小弟只是把自己的经验给大家分享，如觉得没用觉得“早知道”的各位高手让其他未曾知道的玩家了解一下总不是坏事吧\n\n小弟第一次来这里发自己的长帖子，希望斑竹们能推荐一下！谢谢了\n如果有问题请跟帖，我会及时更改。"
