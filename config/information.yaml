      content: "必须条件：等级30\n1.先到吉鲁(343，191)的洞窟\n2.进去后与1F的红人龙说话接任务\n3.清出道具栏五格 ，因为要放答案纸，以下答案\n4.1F \"青的\"\n5.2F \"424KG\"\n6.3F \"火风\"(注意!不是风火)\n7.4F \"地\"\n8.5F \"火\"\n9.拿到五张答案纸后跟5F蓝人龙说话得\n　到\"智能水晶\"(注销会不见)  需在说话\n　一次，他会说要你找后面的黄人龙。\n10.往里面走跟一只黄人龙说话.会传送你到另一个地方\n11.然后请打败LV67的黄人龙(可顺移)，就可进去选东西了\n12.红色\"光的腕轮\"(奇诺的手环防-3魅+4)和红人龙LV1一只\n13.黄色\"守护精灵\"(布鲁顿的竖琴)和黄人龙LV1一只\n14.蓝色\"镜之精灵\"(奇诺斯的戒指)和蓝人龙LV1一只\n15.灰色\"复活精灵\"和灰人龙LV1一只\n16.绿色\"滋润精灵\"和绿人龙LV1一只"
