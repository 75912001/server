      content: "作者：『韩天阳』\n经过自己的练习所总结出来的！\n\n因为现在法师的高级技能都没有开放，所以我再次倡议大家全部技能都学习！\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－\n流程方法：\n\n◎第一步◎学习【嗜血成性】\n作用：如果你想更快的练技能和少花钱\n效果：按照血分配比例和熟练度决定\n注明：此技能只需练到70，剩下的慢慢自己加吧！\n\n◎第二步◎学习【移行换位】\n作用：这个不管是PK还是打英雄道场都是很有用的\n效果：回合数根据熟练度和所耗气决定\n注明：强烈建议此技能熟练练到90％以上\n\n◎第三步◎学习【冰箭术】\n作用：冰冻敌人且减少敏捷\n效果：依照熟练度决定成功率\n注明：此技能先暂时学习到70％，以后会有用处\n\n◎第四步◎学习【冰附体】\n作用：附体与自己可以使攻击加强，附加减敏效果\n效果：依照熟练度决定强度\n注明：学习到70％\n\n◎第五步◎学习【冰熟练度】\n作用：加强冰系魔法威力\n效果：熟练度越高，攻击力越大\n注明：请先用【冰附体】把熟练度练到12％后在使用冰系其他魔法练习，正好，可以将【冰箭术】【冰镜术】练到99％\n\n◎第六步◎学习【火山泉】、【火附体】\n备注：因为前面都练满了，所以富裕出1个技能点数，一共为2个，可以学习2个技能！\n作用：火系魔法和火系附体术\n注明：都练到70％\n\n◎第七步◎学习【火星球】\n作用：一排攻击约400血\n效果：依照熟练度和【火熟练度】决定强度\n注明：练到70％\n\n◎第八步◎学习【火熟练度】\n作用：增强火系魔法攻击力\n注明：此技能配合【火山泉】、【火附体】、【火星球】一起练，把3个技能都升级到99％这个熟练度就能到99％了！\n\n◎第九步◎学习【召雷术】【雷附体】【嗜血蛊】\n备注：前面3个技能满99％加上火熟练度99％，完全可以一下学习3个技能\n注明：这三个技能都练到70％\n\n◎第十步◎学习【暴风雨】【雷熟练度】\n备注：前面3个技能都上70％后你就有3点技能\n注明：因为雷暴术需要PK才能练，所以开2个ID，自己放自己的暴风雨，并且练满前几个技能，这时候你的等级一般就能达到20以上了！\n\n\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－\n建议版主置顶，方便大家！\n\n\n\n补充：用我的方法一星期绝对可以练完了！为什么我不说要练到100％呢？我觉得不太实际，因为1％-99％的时间等于99％-100％的时间的几倍，也就是说要想练到100％就还需要1％-99％那么长的时间的几倍，如果每个技能都练到100％，那么需要N月了（夸张），所以本人认为天空战记在这方面考虑不周到！\n还有就是建议大家使用SACH-MX7.03版本，因为这个版本支持平时魔法和间隔功能，而且支持打全体敌人，这样对于练技能是很方便的！\n等到都到了99％的时候，你都不用管他，不知不觉就能到100％了，但是要特意去挂，恐怕需要很长的时间！\n\n\n\n补充（2）：你还可以设置一边打铜一边挂技能！\n比如：设置首次【火附体】\n          一般【火星球】\n（注：现在SACH-MX7.03的火星球可以打一排了）\n这样挂一晚上，起来2个技能满了，一车矿石！赚啊～"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "合成经验『全新』", "合成滋润4/5的方法"]
      content: "方法：第一步。。。去地庄园买铠14。\n          第二步。。。去水城铠14+出水草*6=凯14治育5/服14治育5/铠15治育5/服15治育5\n一般说来这些东西有上300W就能合出4~~~6件\n          补充：如果想省事的话就去打花11→也就是凯14治育5/服14治育5/铠15治育5/服15治育5+花11*4=滋润5拉~不过费事~~\n          第三步。。。买卡坦石头+出水草*4+花8=铠10/9/11滋润4（运气好直接滋润5）\n          补充这一步用300W左右就能出4~~~~6件~我出了5件~\n          然后用铠14治育5+铠10/11/9滋润4*2=凯16滋润5~！\n          最后一步我试了3次2次成功~。。一共花了800W左右~\n\n1.凯11以上+4件精灵凯8+花11/10\n2.纯凯11以上+精灵凯或服9/+花11/10这种方法相对第一种来说比较难些。\n3.纯凯11以上+精灵凯11以上+花11/10好了，这就是是大家来处理苹果凯的方法\n  1.声望要400以上\n\n  2.运气要小吉以上\n  这是大家总结过的,我发表一下我的合成方法\n  1.拿上一只好的合成宠,我用的是卡布伊,很久以前抽来吉卡的那种,用修宝也可以\n  2.最好开一个人在百人寄铠,一个在卡坦合\n\n  好了,言归正传,合成方法是:铠8滋3+3个花8+卡坦石=铠9/铠10滋3/4或治愈3/4\n  合到滋4再好不过了,要是治愈的话就这样办:铠9/10治愈3/4+3个花8+卡坦石\n  这种方法差不多100W就出一件滋4\n\n现在滋润5可以花钱买，但是比较贵，滋润4在练级和新人中还是用的比较多的，也有人需要，现在将自己的一点和滋润4的看法写上，希望合成的朋友可以试一试。\n\n滋润4铠 10 = 花8 + 治愈铠9\n滋润4铠 10 = 花8 + 石 + 皮8 + 滋润 LV3 铠 8\n滋润4铠 10 = 花8 + 加加的兜 + 滋润 LV3 铠 8\n\n成功率15％\n\n4.0合滋润的方法:\n4.0水城有卖回复成分8的草，前几天看BOX里已经有高手比我早一步去试过了，现在我只是给出一个我合滋润5的一点经验\n1.首先买风城的石头10（因为记录在风城，其它地方的也一样啦）,为什么不买石11呢，因为我在合的时候发现10级的石头上精几率比11的要高，上了精也是9-11级的，够用了，而且便宜啊！\n2.传到水城买回复成分8的草，然后石10+草*6，顺利上精后一般出的都是带治愈的，9-11级的都有可能，运气好100W大概能出4-5个精凯，成功率还不错。\n3.回风城买石11+治愈凯9/10/11+花11=凯/服11滋润5，花11还是比较好出的。\n最后，祝大家合成成功！\n\n我和了7件用了350W（滋4）个人声望：4781"
