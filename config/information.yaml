      content: "◎任务条件：解完五兄弟任务，人物要1转110以上，一人一次哦~\n◎任务奖品：五色新人龙随机一头\n◎任务流程：\nstep1：寻找宣传文件（可以在加加村百人道场(13.14)，卡鲁他那村百人道场(13.14)，奇努伊村进入天空那水池附近(15.13)，南岛的海底隧道(10.26)，福村的海底隧道(28.12)，福村的道具店(20.20)，卖羽毛那间柯尔克通道3楼(32.33)，再找不到就换星系找！）\n\nstep2:前往柯尔克村(91.67)的地方进入柯尔克的便利商店，找研究员(28.35)对话。注：是从柯尔克的便利商店的后面进入哦！之后到柯尔克的便利商店坐标(21.19)的地方找塔鲁巴鲁对话，接着到柯尔克的便利商店坐标(24.21)的地方找浿莉丝对话，她会给你一份醒龙奥义的翻译。\n\nstep3:去沙姆岛打魔兽（小心哦，魔兽会自己补血，建议用灰人龙打无魔，绿人龙打地魔，蓝人龙打水魔，红人龙打火魔，黄人龙打风魔，这样会有事半功倍的效果，最好放个属性打了，还可以用火5级魔法打，因为你用除了以上这些打外，其他都是打1血的（包括撕2等技能和人物的职业技能）……而片段有息灾，增益，调伏，敬爱，钩召五种），打5张醒龙奥义片段就可以走了，回去柯尔克的便利商店后面，对话。\n\nstep4:之后带着5色人龙，去小象区的(115.136)，就可以选择你要的新人龙了（新人龙的缺点：无法转生，无法融合）。技能愤怒：将防御力转为攻击敏捷力，若将对手打飞则造成敌方全体伤害（攻击无敌了，若是能NONO更无敌了）\n\nstep5:任务完成\n\nPS：也许很多人会问……我的新人龙这么垃圾，只有5.5的成长，看人家的那个，有7.0成长呢。这里我就给你一个解答的方法了\n◎做到step4的时候，是带着五个人龙去拿新人龙的时候，这里你的五个人龙所放在宠物栏的位置就和你拿的新人龙很大的关系了，如下\n我们这里将宠物栏1叫钩召，2叫敬爱，3叫调伏，4叫息灾，5叫增益\n\n宠物第1栏 钩召  外貌 -决定外型和属性及影响技能的多寡，如果有一转就有七技，没有就四技。\n\n宠物第2栏 敬爱  水 -掌管血量值  放此栏的宠物取血量成长率，最好放血多的人龙。\n\n宠物第3栏 调伏  火 -掌管功击力  放此栏的宠物取攻击力成长率，最好放攻最高的人龙。\n\n宠物第4栏 息灾  地 -掌管防御力  放此栏的宠物取防御力成长率，最好放防高的人龙。\n\n宠物第5栏 增益  风 -掌管敏捷力   放此栏的宠物取敏捷力成长率，最好放敏高的人龙。\n\n也就是说，是依照宠物栏的位置来放各种不同能力的人龙，看你个人怎放，然后可以放一只二转人龙，我是觉得千万不要把二转人龙放在，第一栏，因为大家用的结果，跟平常一转的数值根本差不多，很浪费，所以最好是拉其它能力，放哪都好，最好别放第一栏。若是你想培养一个攻高敏少的新人龙，那么人的第二宠物栏放2转红人龙，第五宠物栏放无转其他的人龙，敏少就可以了，这样可能会影响到成长，但是也没办法了，呵呵。"
