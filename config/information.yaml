      content: "◎任务条件：完成思念故乡的贝克任务（当然完成此任务也要完成其他很多的任务了！）\n◎任务奖品：5幅自画像（高手指点说没用，那就是没用了，扔吧）\n◎任务流程：\nstep1：瑞尔亚斯之都的（67，75）进入民房，跟“纱美加”接任务。得知其缺颜料，接着来到瑞而亚斯之都的（59，17）进入瑞而亚斯的便利店，与里面（26.47）的迪伊恩对话。\n\nstep2：得知他需要1级的贝洛宝利，北岛的迷幻洞窟全区域（只要是里面就可以了，排除最底层！）有抓，抓到后再回去跟迪伊恩对话，交出贝洛宝利，得到红色颜料。\n\nstep3：得知他需要1级的加比奥，南岛拉多拉洞窟３Ｆ（42，55）（50，90）有抓，抓到后再回去跟迪伊恩对话，交出加比奥，得到黄色颜料。\n\nstep4：得知他需要1级的朵洛将恩，吉鲁岛漆黑洞窟５Ｆ（37，35）有抓，抓到后再回去跟迪伊恩对话，交出朵洛将恩，得到黑色颜料。\n\nstep5：得知他需要1级的格尔希洛，吉鲁岛没落的矿坑三楼（4，34）（9，43）有抓，抓到后再回去跟迪伊恩对话，交出格尔希洛，得到白色颜料。\n\nstep5：得知他需要1级的布林帖斯，吉鲁岛漆黑洞窟１８Ｆ（全区域）有抓，抓到后再回去跟迪伊恩对话，交出布林帖斯，得到蓝色颜料。\n\nstep6：拿到5种颜色瑞而亚斯之都的（67，75）进入民房，跟“纱美加”对话，“纱美加”会给你画画（这时不能骑宠），之后就可以得到5幅自画像。\n\nstep7：任务完成（看到这里，大家都知道这个任务有什么捷径的了吧，我唯一发现的就是在抓朵洛将恩的时候，可以顺道去抓布林帖斯，省点工夫嘛，PS代理感谢石器的天空Tony_Yu1协助哦）\n\n\n\n无法逃离的审判\n◎任务条件：完成思念故乡的贝克任务，黄泉之路任务。\n◎任务额外条件：需要暗灵法师，白狼勇士，追猎者三种不同职业的人物共同完成（还真BT，我汗……）\n◎任务奖品：宠物学习书（凿孔技能）\n◎任务流程：\nstep1：进入瑞尔亚斯的会议厅，来到（38.28）与“守卫队队长  涅齐”接任务，得知我们要前往沉睡洞穴去追捕窃贼，取得最后的研究资料，之后可以拿到“搜捕令”\n\nstep2：来到无息之境的（123.57）进入沉睡洞窟－东（所有沉睡洞窟都能辅助软件穿墙，大家记得利用这点），看见洞窟门口的看板，得到提示：“夜晚”过后“白日”降临，“自然”定律周而复始。地克水，水克火，火克风，风克地，逆转则生。\n\nstep3：在沉睡洞窟-东，这时由暗灵法师带队，踏上“风”图案的机关（94.48），来到沉睡洞窟-北。\n\nstep4：在沉睡洞窟-北，这时由白狼勇士带队，踏上“地”图案的机关（52.10），来到沉睡洞窟-南。\n\nstep5：在沉睡洞窟-南，这时由追猎者带队，踏上“水”图案的机关（5.79），来到沉睡洞窟-西\n\nstep6：在沉睡洞窟-西，来到48.35看到窃贼贝特汉，跟他说话拿到“窃贼的足迹”，接着在沉睡洞穴-中或者其他地图，找窃贼贝特汉3次，拿到3个部分的研究书\n\nstep7：回到瑞而尔斯之都的（17，69）进入瑞尔亚斯的会议厅来到（38.28）与“守卫队队长  涅齐”说话，交出“搜捕令”和“窃贼的足迹”\n\nstep8：再去到瑞尔亚斯之都（32，44）的瑞尔亚斯研究院跟研究者梅屋·塔夫对话，拿到宠物学习书（凿孔技能），宠物学习书（精炼技能）和鉴定学习书（牙），并且将鉴定牙的熟练度升级到60以上，他又会给你另外一本鉴定书（重复下去？全部拿完为止？那么大家要努力练熟练度了，应该要不断用牙来合成东西才能增加吧！这是我的猜想。）\n\nstep9：任务完成"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]精炼、强化、合成、凿孔"]
      content: "石器时代8.0开放了更高级的素材，就代表各位合成狂人有机会合成更高级的装备了，而强化，精炼，合成（应该是新合成）就是为这些更高级的新装备而服务的新技能，效果怎么样呢？请继续往下看咯！"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]精炼、强化、合成、凿孔", "精炼"]
      content: "◎关于如何精炼：非常简单！让宠物学习了精炼技能之后，利用刺激能将两个以上相同成分精炼即可。随着精炼的过程，你可以逐渐积累对于该材料的鉴定能力哦。\n◎关于精炼的好处：精炼的好处可多了，除了可以透过对于材料鉴定的熟练度提升合成过程中的成功率，也可以让你搭配声望值与高等材料制作出更高级的装备。当然！也可以生产出高等级的材料去赚取外快哦。\n◎总体上说，精炼就是利用高级素材，合成更高级的素材（例如利用高级的木素材，多个精炼后，有机会诞生出12级以上的木素材哦），目前已知的素材最高级别是15级，各位注意了！"
