      content: "作者：BOX_MANJUNLIN\n==================================================================\n合法：\n1.水城，买B3(睡,混)*4对合，出睡混B4\n2.风城买N把弓14\n3.弓14＋睡混B4对和，出精弓15后留着，以备后用\n4.回风城，买N把弓14，4把对合，出N把弓15/16\n5.用弓15*4对合，出弓17`\n  用弓16*3对合，也出弓17\n6.小弟可能是运气好`\n  弓15*2+弓16，出了弓17\n7.空弓17+精弓15对合，出精棒17了\n\nPS:用B4给弓14/15加精，我发现好简单的说，真的\n   另外发现用睡混B3*1+石混B3*4出来的精棒9\n   精棒9*1+石14+睡混B4,也很容易出精石15\n==================================================================\n"
