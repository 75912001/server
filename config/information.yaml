      content: "原创：BOX\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n爪12精灵全攻略！\n现在玩石器的，很少有人合成了，我曾听一人说：“找个合成大全看看不就会了！合成最简单了”过了会，这厮问我：“爪12加精灵时候出爪13怎么处理啊？”“石头升级到11怎么处理啊？”“掉级了！”\n……………………言归正传，上课上课\n\n在讲今天的主题之前，给大家讲一讲素材成分学，最基本的有：石，皮，牙，骨，线，木，叶，黏土，贝壳，壳，水晶，花，还有4种属性（这个比较特殊，先放一边）\n如果要合成，就先要弄懂这些东西，举例说明：\n   牙11加皮11=爪11\n有人肯定会问：“不是出爪12吗？”闭嘴……听着\n   牙11+皮11=爪11（正常情况）\n   牙11+皮11=爪12（超长发挥）\n   牙11+皮11=牙11ro皮11（失败）\n两种同等级的素材，互合，必定生出同等级的装备，按以前的经验来说，出爪11的几率应该是50%左右，出爪12的几率应该是30%，失败应该在20%左右，当然不排除运气的成分。别小看这些数据，这都是有科学根据的。但是现在听说WAEI改合成的几率的，现在的情况不太清楚了，再说也可以直接买到爪12了。\n说到买来的那种8万块的爪12嘛……\n举个例子：火城爪12+精石9=爪12精灵\n          这里理论上的公式\n     大家都知道的结果吧？\n但是现在大多的情况是：\n    爪12+精灵石头9=爪12ro精灵石头9\n  为什么呢？因为爪12是白字的，白字的和黄字的互合，失败的几率会增加，我知道说到这时候，稍微懂点合成的一定会说：谬论！\nNO，NO，现实情况的确是这样的\n在合精灵石头9的过程中，这种情况就非常明显\n举例说明：\n         风城投石1+精灵草8=精灵石头9\n    这是理论上的公式，因为风城投石=合成石9\n  但是实际操作中呢？直接出精灵石头9的几率不是很大的。一般情况下，是用草8做了一次催化剂，把投石1转成合成石头9然后再：\n          合成石9+精灵草8=精灵石头9\n这样的几率就很大了，但如果问我到底为什么的话，小的不才，还没研究出来，但是我最近一直在攻克这个问题，有机会再来给大家讲\n\n下面进入正题，爪12精灵的合成\n先给大家看公式\n方法一：   1.  风城投石1+精灵草8=精灵石头9\n           2.  火庄爪12+精灵石头9=精灵爪12\n\n方法二：  火城爪12+精灵草*4=精灵爪12\n\n我个人不推荐使用方法二，成功率底，太花钱。所以详细说明一下方法一，\n看过上面内容的人，应该知道，风城投石1的成分和合成石9是相同的，所以直接拿来用就可以了\n在加精灵的过程中，因为精灵草只有8级的，所以会降低一些几率。合成中，投石会在精灵草的催化中变来变去，但都是皮石系的产品，所以一直加精灵草就可以了，每次加一个\n，如果出现“合成石10+草8=铠11ro服11ro合成石11”这样的情况，就按方法二那种，直接加上4个草，这种方法的理论是用精灵草的数量来不足精灵草的等级。一般出11级以上的皮石系的精灵装备\n然后带着精灵石9去火庄\n爪12+精灵石头9=爪12精灵\n运气再差的人，10次也能出一把爪12精灵的\n如果出现爪11，就带回去加4个精灵草\n爪13的话，也加精灵石头11，出爪13带精灵，这东西可以给高等级爪加精灵\n花些时间，总会有回报的。\n\n最后再说明一个问题\n为什么精灵石头9能给爪12上精灵？\n\n爪12的成分是皮和牙\n精灵石头的成分是皮和石\n两种物品的成分都有皮，这可以说有50的成分相同，上精灵就是可以的\n也可以用精灵枪9\n因为成分是木和牙\n大家明白了吧？\n今天的课就上到这里吧。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "合成经验『全新』", "铠10滋润4合成『最新』"]
      content: "原创：BOX\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n滋润4铠10合成攻略！\n我看到有人求救……\n我不喜欢只说个方法，要解决，就要解决彻底了\n第二弹始动！！！\n首先还是基础知识……\n铠10是什么构成的呢？\n成分为皮和石\n同成分的东西有很多\n投石：5到10级\n兜10\n铠6，铠9，铠10 （7级和8级，如果我没记错的话，里面有壳的成分）\n\n首先合一个铠9or10 或 投石9ro10\n\n在萨村买石8和皮8\n对合，出的东西加气，一直到出上面那4种东西为止！\n或是到风城，买投石1\n风城投石1的成分就是合成投石9\n然后到水城，加一个出水草\n一般情况下就出带治愈精灵的铠了\n说到这里，再讲一下基础知识：\n治愈    滋润    恩惠\n\n这是3种不同等级的精灵\n也就是说：治愈  <  滋润   < 恩惠\n\n回到正题\n用投石9加出水草=治愈精灵的铠9\n因为出水草的成分是治愈的成分8（如果我没记错的话）\n一般很容易出治愈铠\n先别管治愈的等级，\n然后到卡坦村\n如果要转滋润的话，加花8\n如果要转恩惠的话，加水晶8\n不要问为什么，这是祖上传下来的规矩\n\n如果运气不错的话，一般很少的钱就能出滋润4的铠9的\n如果精灵等级不够，就继续加花"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "合成经验『全新』", "精灵属性爪8合成『最新』"]
      content: "原创：BOX\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n精灵属性爪8合成全攻略！\n今天有位同志说爪8怎么合也出不来……\n我啥都不说了……上课上课\n先给大伙讲下基础知识\n10级以下的爪（包括10级）\n分两种成分\n6级以下是皮和牙\n7级到10级是壳和牙（注意，不是贝壳）\n因为武器等级如果是单数的话，精灵就是单体的，反之成立\n其实用爪10精灵属性也不是不可以\n因为精灵属性爪9升级到10级比较困难，运气的成分比较大\n所以爪8精灵属性成为了经济实惠的PK首选\n正题正题……\n到萨村，\n买一个牙8，买一个壳8\n因公式：牙8（A）+壳8（B）=爪8（C）\n所以A+B=C\n然后用C加属性8（D）\n出属性爪8\n然后去买精灵草\n常用的精灵有：\n霍特尔村：石化草，毒草\n柯奥村：睡眠草，酒醉草\n卡坦村：混乱草\n然后用属性精灵爪8+精灵草8\n有很大的几率出属性精灵爪8\n失败的话，会吃精灵或属性\n如果出爪9了，加个毒草，毒宠用的，好方便的"
