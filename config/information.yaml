      content: "\n★追猎者-就职任务\n【资料来自巴哈的ZBLIZZARD(谜样～北斗巴联加油@@)由阿东重新整理修饰 】\n ｙｕｈｕａｓｈｉ 做修改整理\n 小狐狸   制作表格\n\n 任务概述：\n2003.11.19 11/18日更新事项\n1、[调整]就职等级设定改为0转80级。\n2、[调整]就职装备等级设定改为80级。\n3、[调整]0转可学职业技能LV1。\n4、[调整]1转以上可学职业技能LV2。\n┌─────────────────────────-─────┐\n│ 任务地点：卡鲁他那村附近，追猎者公会坐标(284.575)           │\n│ 限制条件：需1转以后解完成人任务                             │\n│ 适合等级：100级以上                                         │\n│                                                             │\n│  1.走到卡鲁他那村附近,追猎者公会坐标(284.575)               │\n│    进去后找NPC奈尔秋(17.15)说话，确定要当猎人后进入试练洞窟 │\n│                                                             │\n│  2.第一层试练者(107.93)会要你帮他找弓                       │\n│    打乌力就会掉出【特级之弓 攻+20,防-19(4-5)】              │\n│    得到弓后拿给他,得到【猎人信物一】                        │\n│    由(107.93)进入第二层。                                   │\n│                                                             │\n│  3.第二层试练者会要你抓只一级乌力给他                       │\n│    抓到【森林小猪】后拿给他,得到【猎人信物二】              │\n│    进入到第3层.                                             │\n│                                                             │\n│  4.第三层试练者(64.5)会要你打                               │\n│    羊齿草、羊的肉、鸟尾草、鸟的肉、猴头草、猴的肉           │\n│    打到后拿给他,得到【猎人信物二】                          │\n│    之后会被传送出去                                         │\n│                                                             │\n│  5.把信物交给NPC奈尔秋(17.15)交出3样信物                    │\n│    跟一旁的可叶(20.18)说话就职                              │\n│    得到5样道具,还原点数                                     │\n│    任务完成                                                 │\n│    任务完成后所得道具,见下表                                │\n│                                                             │\n└──────────-──────────-─────────-┘\n 注意事项：\n┌─────────────────────────-─────┐\n│ 不要让外挂把肉吃掉                                          │\n│ 羊齿草、羊的肉、鸟尾草、鸟的肉、猴头草、猴的肉,不能交易     │\n└──────────-──────────-─────────-┘\n┌───────────────────────────-───┐\n│                          追猎者                             │\n├──────┬────────────────────-───┤\n│            │    原始人的生活是于大自然息息相关的,因此...   │\n│            │    许多人对于长久居住在同一处所不感兴趣,      │\n│            │    喜爱四处为家而过着流浪的生活.              │\n│  角色简介: │    也因此没有人比这些人更能了解大自然         │\n│            │    他们对于动物们非常有一套.                  │\n│            │    不管是凶恶的暴龙或是温顺的克克尔.          │\n│            │    遇到他们一样乖乖的听话.也只有他们知道一些  │\n│            │    不为人知的生物习性或是出没之地点.          │\n├──────┼──────────────-─────────┤\n│            │    设计各式各样的陷阱更是他们特殊的专长之一.  │\n│  特殊能力: │    能力为平均型.可穿戴部分装备武器.           │\n│            │    捉宠优势及收集材料优势                     │\n│            │                                               │\n├──────┼───-┬────┬───-┬─-───┬───--┤\n│            │ 体力  │  腕力  │ 耐力  │  速度   │  气力  │\n│  能力上限: ├───-┼────┼───-┼─-───┼───--┤\n│            │  无   │  200   │ 200   │  400    │  100   │\n├──────┼──-─┴────┴───-┴───-─┴────┤\n│            │                                               │\n│            │     森林头盔 防+26 净化精灵(昏睡)LV2          │\n│            │                                               │\n│            │     森林炼甲 防+53 恩惠4(扣气20)              │\n│ 职业装备   │                                               │\n│            │     森林皮带 回避率上升+15%                   │\n│            │                                               │\n│            │     森林之靴 敏+15 防+5 闪避率+5              │\n│            │                                               │\n│            │     森林木弓 攻+28 (4-6) 昏睡精灵LV4          │\n├ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ┤\n│       整套装备在人物身上, HP额外增加100,敏+15               │\n│                                                             │\n└──────────-──────────-─────────-┘\n=================================================================="
