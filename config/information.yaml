      content: "                       合成戒指\n\n 　名称    │               材料\n ─────┼─────────────────────\n 合成戒指１│1.线1+贝1+鳞1+黏土1\n ─────┼─────────────────────\n 合成戒指２│1.线3+贝3+鳞3+黏土3\n ─────┼─────────────────────\n 合成戒指３│1.线4+贝4+鳞4+黏土4\n ─────┼─────────────────────\n 合成戒指４│1.线5+贝5+鳞5+黏土5\n ─────┼─────────────────────\n 合成戒指５│1.线7+贝7+鳞7+黏土7\n ─────┴─────────────────────\n[合成戒子]\n\n合成戒指 1=线1 + 贝1 + 鳞1 + 黏土1\n\n合成戒指 2=线3 + 贝3 + 鳞3 + 黏土3\n\n合成戒指 3=线4 + 贝4 + 鳞4 + 黏土4\n\n合成戒指 4=线5 + 贝5 + 鳞5 + 黏土5\n\n合成戒指 5=线7 + 贝7 + 鳞7 + 黏土7\n\n合成戒指 6=线8 + 贝8 + 鳞8 + 黏土8\n\n合成戒指 7=线9 + 贝9 + 鳞9 + 黏土9\n\n一击必杀=黄玉戒指 + 小的爪\n\n属性戒指 5=花8 + 戒指5 + 属性5\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n水果+牙7+木7+土7=环3\n\n水果+2-4个环3=环5 （一般用3个，成功率不错，而且实惠，我用4个成功\n率很高但浪费钱）\n\n属性环5=水果+一个属性环3+三个环3=属性环5（属性取决与属性环3的属\n性）\n\n转换：假如你要敏环它出了防环或攻环就用水果+环5+属性草（我喜欢转\n为敏环的时候用水属性8）"
