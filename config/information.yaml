      content: "大家好~~~小D我很菜，介绍点大家都知道的技巧吧~~还要求助高手帮我解决点问题~~~嘿嘿\n\n　　废话少说，进入正题—>\n\n　　最近最令人关注的是英雄战场了，当然大家不是为了一个手套而奋斗的，因为过了英雄战场，就有英雄称号，而且全世界都知道你是英雄啦~用句俗话吧：那多有面子啊~~哈哈！可惜我……哎~~盼望成为英雄的一天。高手们都应该知道在英雄战场练魔抗性吧？我就多罗嗦罗嗦告诉那些不知道的人。\n\n　　首先要有能力过前60楼，因为80楼的那人很厉害，我没过(别骂我垃圾啊~~我知道自己很差……)快速过到70多楼时候，放一只自己心爱的主战宠，要经常用的，外挂设置人和宠全防御，补血自己灵活掌握。先到第71个人那，快速战斗，人一直是防的，所以不会攻击对方(废话…)这时候不管了，看看你的屏幕上有没有显示XXXX的魔法抗性提升了。如果有，就不管了，这样让人挂着吧~~如果没有就点外挂逃跑，然后进入战斗把这个人解决了，去下一个人试试，我是在最后4个人那把魔抗性都练到95以上的，有两个到100了，很快。也有些敌人总不用魔法，建议在75人到79人那反复试，因为每次战斗，那些人用的攻击方式都不同，这次他是用斧头砍你，下次可能就是魔法了。。说不准，反正在这练魔抗性很快~~\n\n　　再一个就是最近闲着无聊，用级低的号去闯了次精灵王，感觉太爽了！原来大家打都是放NONO蓝雷，现在嘛~~~可能都带的是高攻宠了吧？我介绍一种自己的打法，我觉得实用，高手别骂我废话啊~~就当我教新人啦~~~~~~~~~~\n\n　　首先用前面的方法把魔抗性都练到95以上，这样精灵王就对你没脾气了。再就是要敏高点，穿苍绿套带心环，建议带耳环9(好象是戒指9)我也忘了，反正是回避+9的那种，骑红暴比较好，防敏都还行，个人觉得不要骑金飞，那些火精灵有时候发狂很BT的。。小心回记录点擦图腾柱去~~~~人就这样了，宠，狂暴水熊和白熊是最佳的选择，等级在130以上最好，140更好。当然要在打之前按照前面讲的方法练魔抗，听人说宠也要练魔抗，我就去试了，人的魔抗到95以上后，战宠的魔抗也高，练时候必须放熊，当然是随着人升高的，本身看不见。熊最好是除了狂暴外学一个不防守，再就是都学一击必杀[改](开玩笑~~没有改~~哈哈~有就BT了……)这3个技能只有两个有用，狂暴，不防守，但是为什么要这样学呢？因为这毕竟是宠，再厉害也还是有死的时候的，等到它死的忠只有28时候，那你再用狂暴打试试吧……NONO了~~~还有要带只满魔抗的水宠或者地宠，以防万一。\n\n　　(下面说的主攻人，不是攻人啊~~~是主要打精灵王的人，其他人是帮着补血加气什么的)自己要是主攻，就把法师的冰技能和火技能全练到95以上，冰火附体练到80以上就行了。就这样可以了。\n\n　　打的时候4个人就行，其他人如果都象我刚才说的那样准备，感觉3个人就绰绰有余……下面介绍4个人打法，主攻人石化，宠不防守，一个高敏的恩，一个低敏的恩，另外一个人也石化。石化住了宠就狂暴上吧。。两只极品狂暴熊就能干掉1个半人(按照攻击威力说的)先打火的。恩要不停，主攻人开始用冰箭打没被石化的，另外一个人用火星球干前面骑暴的，这样很快就结束战斗了。一直没提精灵王，是因为魔抗达到95以上，可以无视他的存在，他只不过是个血高的吓人的血牛而已(PS：精灵王升级肯定加的敏和血~~~)等把旁边的小东西虐待完了之后，开始玩精灵王了，一个恩就够了，但是不能停。其他人随便搞吧。也可以捕捉他来消遣。因为冰镜一下就打他1000多血，自己想怎么玩比较HI~\n\n　　后面的4界都是上面讲的方法过，最后的小黑大致相同，但是一定不能先打小黑，他血牛，打半天才死`~划不来。\n\n　　我把精灵王过了之后觉得有成就感，就把其他的任务都过了。哈哈~~\n\n　　下面零零散散的说几句再切入正题吧~~~~~\n\n　　打银猩猩不要放宠，人敏上300，防过200就OK，冰箭射就行了。快速吧~~不用怕打的慢，打1排的猩猩基本1次战斗就出宠圈了，我打了一次得了两个~~~要宠圈的++++++只换朱雀~~~(PS：开玩笑了~~嘿嘿)打黑衣服和黑旗子一样，因为冰箭很好用，练高了打的血也多而且费气少，才20~~还能冻别人。我都是快速过的，1次战斗就得到任务道具了。再就是打那个BT儿席格了，这是最令人头疼的，敏无论多高也赶不上他。。他攻又是……去试试就知道了。我是两个人过的，过了N次。。。后来才发现窍门。两个人打法，主要靠命中和运气，尽量把自己回避加最高，敏也适当高点，建议穿湛蓝装备，血多点也好，不会一下就飞。。2下才飞哦~~~~~(哈哈！)两个人都带睡精灵，第一回合，看你回避，敏，运气了，先给自己用法师的技能闪避(忘了名字了，反正是从猴子那学的技能……汗~~~)宠用不防守，如果一切正常，就好办了，两个人拼命放精灵，目的是要席兄中，宠就用狂暴或者一击毙杀打旁边中了精灵的小兵，只要席兄中了就好办了，这时候要注意宠千万千万别把他打醒了，人不管宠死活了，拼命用冰镜打席兄，搞死之后就随便玩剩下的了。最后伊甸园那个精灵王就不说了，还放红人龙呢。。。真是被打的没脾气了干脆怀旧一下让玩家可怜可怜他，打轻点吧。。大家不要手软啊~~~飞他~~~~~~~~~~~~~~~~`(嘿嘿，够坏吧~)\n\n　　以上就是我的一点点经验，高手看了觉得我无聊，哎~那就给新人当休闲文字“败读”喽~~~\n\n　　前些天才第一次用法师技能PK，(很土吧……)觉得还行，冰箭不错。可是有一个实在实在实在实在令我不解的问题，法师的技能的命中率到底很什么有关系呢？还有，抵挡法师的技能又和什么有关系，我尝试把敏弄高，可是还是中冰箭，我尝试把回避加高，还是中。。。会不会是人的命不好啊？在这里就请教各位高手教教我了，不管成熟不成熟的意见和建议，我都听取~~~可以发文章，也可以加我QQ172393542，记住注明来历哦~~希望结识真心朋友和高手，我是中国网通12的小菜，无敌刺猬。最近要会考了，不上石器了……暑假再奋斗咯！(啪，又一个蚊子，一种发自肺腑的成就感由然而升……:\"）"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【石器时代经验与技巧】", "商人谈经验（穷人也能富）"]
      content: "作者：绝对达达\n\n大家好！我现在在挂级和抓金暴无聊中写了这篇稿！写的不好大家不要扔鸡蛋哦！废话说完了进入正题！我从2。5的时候进入了杭一石器！那是让人向往的时候虽然那时我很垃圾。但是朋友多家族也团结，过了一段好时光。我在2。5的时候身上就只有只4。9成长122级的蓝人龙呵呵！有一天来到了加加看人在换宠，我也学人一样去作买卖了！呵呵第一次生意作的不错换了只9级没转垃圾风年！之后就迷上了作生意了！整天不挂机天天跑去加加喊阿喊阿！从一个风年就换阿换阿换到4。0全身上下有了4色转年6个转机器还有10没转机器！大家都知道那时候的机器贵哦！作生意的秘诀是要知道行情！要懂货！要有运气！最主要的是要有备货阿！象大GP就是个例子！所以大家要记得备货！低买高卖！我从来没买过华裔的一个宠但是却拥有了好多宠！大家记住石器未必是有钱人才能玩的！穷人也一样能搞得好搞得高阿！但是要因人而为了！呵呵！物虽有价但是人情是无价的！大家要记得一点多交朋友你的生意才能作的广。老实说吧我被人黑了3次号丢了一大堆宠物！但是我不气馁！坚持就是胜利！友情就是万岁！这10字大家要记住是我的珍言！在这里我要感谢杭1南斗姐徒弟小虎他们帮了我好多谢谢他们对我的支持与鼓励！我爱石器！写的不好大家不要怪我！我是第一次投稿的！再见了！"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【石器时代经验与技巧】", "打铁矿的一个好方法"]
      content: "作者：无敌刺猬\n\n看过很多高手写的怎么样打矿石才快~我试了，很多效果都不是很明显。\n\n　　宝石，钻石，铜都可以用宠防，把人的功调高点，骑转宠，这样打感觉好点吧……\n\n　　铁矿石嘛~~~~\n\n　　要带一只防差不多的，功，300多就够了。敏捷最好和人的差不多，能合就行。人当然要攻击调高些，自己找装备穿吧。\n\n　　走到打铁的洞里面，用MX外挂自己走，是走到第2个打铁的洞了，在那个洞里面，下方有个大石头，下面有个过道，在那遇敌打感觉出铁快些。还有就是要在人少的服务器。\n\n　　现在开始设置外挂了，补血的就不说了，人，每次都是攻击攻击。宠，5只以上防御，首次和一般都一样。\n\n　　为什么这样呢？因为打铁的时候，那个主要的怪物最多时候，也就是后面1排5只，前面5只垃圾宠，这样快速开打时候，人先上去把主要的宠打死，这时候存活下来的宠就只有5只垃圾了，你的战宠会自动开始攻击，很快一场战斗就解决了。\n\n　　我就是一直样打的，很快。大家可以试试……\n\n　　第一次发文章，写的不好，要是看不懂的人可以加我QQ172393542，一定要注明来历哦~~~我是中国网通12的无敌刺猬希望交真心朋友！"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【石器时代经验与技巧】", "证明：练好宠方法"]
      content: "作者：刀星风\n\n    方案1：满血升级，不跳升，打同级左右怪物，带加运装备兼占卜。这方法比较累人，经本人发现，这样出好宠机率较低，不实际。\n\n　　方案2：带毒和昏睡或石化到英雄岛毒105级鱼，即跳升，当然，还是等你小吉以上去好点，经本人证实，跳升根本不影响宠物成长，且练出好宠机率大，一下就看出你的宠物有无再练下去的价值，本人极力推荐，省时省力，一目了然。(不需带加运装备)\n\n　　例：我用方法1练1级蓝暴55/10/8/6，成长4。6，晕~~~~\n\n　　练1级特雷沙67/15/10/9(极品4围来的啊)，成长\n\n　　5。65，倒~~~\n\n　　我用方法2练1级蓝暴54/10/8/6，成长4。88，爽\n\n　　练1级特雷沙66/14/10/10，成长5。77，还可以\n\n　　再证方法2练宠，本人捉了5只红飞鱼和3只红黄海星，用方法2练到7级后到啊布洞练至30\n\n　　红黄海星(外挂4围63/14/14/7)成长如下：\n\n　　61/14/14/6——5。78，血10。71\n\n　　60/15/13/7——5。78，血10。39\n\n　　65/14/14/6——6。08。血10。93\n\n　　红飞鱼(外挂4围58/12/8/14)\n\n　　50/12/7/13——5。7\n\n　　51/13/6/14——5。93\n\n　　53/12/8/13——6。06-6。1，血9。4\n\n　　52/12/7/13——5。8\n\n　　56/13/7/13——6。05，血10\n\n　　结论：1级宠物血越高成长90%高，不论其他2围数值怎样差，血基本就是标准。但亦有例外\n\n　　1级蓝龙，60/14/7/5，跳升4。6，无瘾~~~~，当时占卜为大凶\n\n　　步步升和跳升究竟有什么秘密呢？下回分解！！！"
