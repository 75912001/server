      content: "                        合成枪\n\n合成枪1 木1+牙1/木1+石头1\n合成枪2 木2+牙2/木2+石头2\n合成枪3 木3+牙3/木3+石头3\n合成枪4 木4+牙4/木4+石头4\n合成枪5 木5+牙5/木5+石头5\n合成枪6 木6+牙6/木6+石头6\n合成枪7 木7+牙7\n合成枪8 牙8+木8\n合成枪9 牙9+木9\n合成枪9 花8+枪8\n合成枪10 花8+枪9\n合成枪10 牙10+木10\n合成枪12 牙11+木11\n合成枪12 石11+木11\n精灵枪9 枪8+草8\n精灵枪9 厉害的枪+草8\n精灵枪10 花8+精灵枪9\n精灵枪10 草8+精灵枪9\n精灵枪12 合成枪10+精灵枪10+水晶11\n精灵枪12 合成枪11+精灵枪10+水晶11\n精灵枪12 合成枪12+精灵枪10+水晶11\n\n[枪]\n\n合成枪1 = 石 + 木 + 丝 或是 石 + 木\n合成枪2 = 木1 + 牙1\n合成枪4 = 斧4 + 土4 + 丝4\n合成枪5 = 威金尼尔LV3投掷斧头6 + 阿鲁帖斯鸣子 (攻+25、敏-5、魅+3)\n合成枪5 = 斧5 + 叶5 (攻+25、敏-5、魅+3)\n合成枪5 = 亚姆亚姆的斧头 + 补充耐力100的药 X 2\n合成枪6 = 枪5 + 牙5 (攻+30、敏-6、魅+3)\n合成枪6 = 良质的木 + 断斧\n合成枪6 = 木6 + 牙6\n合成枪6 = 比罗沙的投掷斧 + 仙的腕轮 (攻+36、敏-7、魅+2)\n合成枪6 = 断斧 + 回覆耐力的药200\n合成枪6 = 轻的枪 + 断斧\n合成枪6 = 哈恩的斧头 + 轻的枪\n合成枪7 = 合成枪6 + 牙6 (攻+35、敏-7、魅+4)\n合成枪7 = 合成枪6 + 火2+水2\n合成枪7 = 合成斧 6 + 补血(+100)药\n合成枪8 = 合成斧8 + 火8\n合成枪8 = 古代木 + 龙之牙\n合成枪8 = 木8+牙8\n合成枪8 = 合成枪8 + 火8 (有火属性)\n合成枪8 = 昏睡4投斧 + 补气药60 (或是复活药) (有昏睡4精灵)\n合成枪9 = 花8 + 枪8 / 木9 + 牙9 / 枪8+火焰草8\n合成枪9 = 合成枪8 + 火8 + 200补血药\n合成枪9 = 合成枪8+古代木+龙之牙\n合成枪9 = 合成枪8(火) + 石8\n合成枪9 = 枪9 + 厉害的枪\n合成枪9 = 枪9 + 气药60\n合成枪9 = 合成枪8 + 合成枪8\n合成枪9 = 枪8 + 特级矿石(达那)\n合成枪9 = 厉害的枪 + 厉害的枪\n合成枪10 = 合成枪9 + 合成枪9\n合成枪10 = 厉害的枪 + 厉害的枪\n合成枪10 = 枪9 + 厉害的枪\n合成枪10 = 枪9 + 气药60\n昏睡枪10 = 合成枪9 + 牙8 + 木8 + 昏睡草8 (有昏睡LV5)\n合成枪10 = 木10 + 牙10 / 枪9+火焰草8 / 枪9 X 2 / 花8 + 枪9\n合成枪11 = 木10 + 牙10 / 枪10 X 2 / 牙11 + 木11\n合成枪12 = 牙11 + 木11 / 石11 + 木11 / 枪10+枪11 / 枪11 X 2\n合成枪13 = 枪11 X 2 / 枪12 X 2 / 枪11+枪12\n精灵枪9 = 枪8 + 草8\n精灵枪9 = 厉害的枪 + 草8\n精灵枪10 = 花8 + 精灵枪9\n精灵枪10 = 草8 + 精灵枪9\n精灵枪12 = 合成枪 10 + 精灵枪 10 + 水晶11\n精灵枪12 = 合成枪 11 + 精灵枪 10 + 水晶11\n精灵枪12 = 合成枪 12 + 精灵枪 10 + 水晶11\n大地枪10 = 精灵枪9 + 地成分8\n水神枪10 = 精灵枪9 + 水成分8\n火炎枪10 = 精灵枪9 + 火成分8\n疾风枪10 = 精灵枪9 + 风成分8"
