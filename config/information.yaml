      content: "石1--10石加皮。 精灵石1--10石头加皮\n\n投石11-16=石+皮，（现在空石或属性石12-14可在火城庄园直接购买）\n,石头一般可以用精草合成法来上精但高级的石一般最好用低一两级的\n精石来上精,石11-14可以用精石9来上精,但由于等级的差别,高级的精石\n成功率会比较低.现在要合的话去火庄买空石14用精草合成法来上精,一\n般就可以出13-15级左右的精石.（修复的话用石1或皮1）"
