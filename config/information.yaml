      content: "法师：\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n火山泉 冰附体 附身术 嗜血成性 火魔法熟练度\n火星球 暴风雨 冰爆术 移形换位 雷魔法熟练度\n嗜血蛊 雷附体 召雷术 针针相对 冰魔法熟练度\n火龙鎗 冰箭术 火附体 冰镜术 世界末日\n电流术  冰镜术\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n白狼勇士：\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n连环攻击 能量聚集 回避  专注战斗\n暴击 格挡 双重攻击 贯穿攻击\n舍已为友 回旋攻击 激化攻击 混乱攻击\n状态回复 斧熟练度 二刀流 濒死攻击\n枪熟练度 棍熟练度 盾击 座骑攻击\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n追猎者：\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n追寻敌踪 回避战斗 回旋标熟练度 火焰抗性提升\n驯伏宠物 弱点攻击 电雷抗性提升 投掷斧熟练度\n弓熟练度 毒素武器 冰冻抗性提升 投掷石熟练度\n天罗地网 尸体掠夺 陷阱 遗忘\n树根缠绕 激怒宠物 挑拨\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n三大职业技能限制说明\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n1． 每一职业拥有三至四级的技能，越高级的技能限制越多。\n2． 一级技能限制职业等级1以上的人物才可学习，二级技能限制职业等级2以上的人物才可学习，依此类推。人物就职后会有一点的技能点数，职业等级每升一级，就会获得一点的技能点数。一点的技能点数可学一项技能。\n3．学习技能之后无法取消重新选择，请小心选择学习。\n4．白狼勇士的技能：枪熟练度、斧熟练度、棍熟练度，必须打到对方冒星星才会增加；闇灵法师的技能：火焰熟练度、冰气熟练度、雷电熟练度，只要使用就会增加；追猎者的技能：精通投斧、精通投石、精通镖类、精通弓箭，必须打到对方冒星星才会增加。\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 7.5完美解析】", "『7.5庄园改进』", "7.5庄园_改进一览"]
      content: "从2.0版的家族功能开放以来，庄园的约战成了石器中的家族大事。三年下来，以声望值为挑战权的规则，让九大庄园成了少数家族的家族事业。而庄园的所属村庄热门程度的不同，也让部份的庄园家族毫无收入，变得极为冷清。\n\n在7.5版的庄园约战部份，规划出了一套新的规则，目的有两个：一个是活络家族间互动功能，另个是扩增庄园财源，让庄园无论冷门或是热门，都能有一份代表庄园价值的收入......\n\n\n庄园战规则\n一、气势计算：\n1、个人加入家族始得计算：\n◎增加声望同时增加与声望值相同的气势值。\n◎加入/退出家族个人气势归零。\n◎系统确定玩家家族为挑战方则该家族成员不得退出家族。（系统于挑战期当日19:00确定挑战家族之后。）\n◎个人未加入家族时，无气势累加，直到加入家族才开始执行气势计算。\n2、家族气势：\n◎（(家族人数平方／10+1)+ 成员完成各活动后增加的气势加总）。\n\n二、持有庄园条件：\n1、击败守护家族。\n2、守护家族守护战获胜。\n\n三、庄园战斗周期：\n准备期：休战期隔日0:00起算过二日。\n挑战期：准备期隔日0:00起算至当日19:00。\n休战期：挑战期当日21:00起算过一日止。\n实战期：挑战期当日20:00起算至当日21:00\n\n四、约战时间与条件：\n时间：休战期过四天后，挑战期当天0:00开始一直到20:00决定参加挑战的流浪家族。\n新增：挑战期间前气势前十大家族看板以利玩家判断。\n条件：挑战期间，提出约战的流浪家族中为所有流浪家族中气势最高者获得挑战资格。\n\n五、庄战后即得利益：\n1、取得庄园者：\n◎家族气势值X 10000－(家族成员个人气势 X 5000)=家族所获得石币，纳入家族银行（家族银行溢满系统回收），守庄成功的家族才会以家族气势折算石币，同时攻/守方气势归０\n◎个人气势 X 5000=个人所获得石币，纳入个人银行(个人银行与身上无法置放则回归家族银行)。个人奖金则是需要守庄成功时，人物登入在对战伺服器中才会计算，以个人气势折算石币，但不论人物在线与否个人气势一定会归０\n◎取得庄园内各商店经营权幷取得商店各税收。\n◎个人以及家族总气势归零。\n◎挑战期如无人宣战，视同守庄成功。挑战期过仍会以气势折算石币，同时气势归０\n2、本周参战战败者：\n◎个人以及家族总气势归零。"
