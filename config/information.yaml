      content: "============================================================================\n三大职业技能说明  ｙｕｈｕａｓｈｉ 整理\n============================================================================\n■暗灵法师技能表■\n============================================================================\n暗灵法师一阶职业技能\n学习地点：暗灵法师公会（沙姆岛 110，43）NPC技能导师卡拉特（21，26）\n============================================================================\n技能名称        石币  技能说明及技能解释\n──────────────────────────────────────\n1. 火山泉       1000  以火焰喷泉烧伤敌人；\n                      火魔法,攻击单体1回合\n\n2. 召雷术       1000  呼唤落雷击向敌方；\n                      雷魔法,攻击单体\n\n3. 冰箭术       1000  射出冰箭伤害敌人（附加冰冻效果）；\n                      冰魔法攻击,对方中法后将会减敏\n\n4. 嗜血成性     1000  以自己的血液换取法力；\n                      吸自己的HP提升自己的MP\n\n5. 移形换位     1000  利用地形闪躲攻击；\n                      闪避率增加\n\n6. 火附体       1000  召唤火焰附在武器或防具身上增强其效能；\n                      火附身在武器或防具身上\n\n7. 雷附体       1000  召唤雷电附在武器或防具身上增强其效能；\n                      雷附身在武器或防具身上\n\n8. 冰附体       1000  召唤冰雾附在武器或防具身上增强其效能；\n                      冰附身在武器或防具身上\n============================================================================\n暗灵法师二阶职业技能\n学习地点：吉鲁岛无名洞窟2楼（第4层）NPC暗灵使者（9，32）\n============================================================================\n9. 火星球        10W  火球击中敌人之后漫延开来造成更大伤害；\n                      火魔法,攻击全体一排1回合\n\n10.冰镜术        10W  冰属性的明镜带来可怕的效果；\n                      冰魔法,单体攻击,对方防愈高,攻击力愈强\n\n11.暴风雨        10W  籍又暴风雨的力量伤害敌；\n                      雨魔法,攻击全体最多10人\n\n12.火魔法熟练度  10W  增加火系魔法攻击力；\n                      增加火魔法攻击力\n\n13.冰魔法熟练度  10W  增加冰系魔法攻击力；\n                      增加冰魔法攻击力\n\n14.雷魔法熟练度  10W  增加雷系魔法攻击力；\n                      增加雷魔法攻击力\n\n15.嗜血蛊        10W  施放蛊虫于敌方身上使其失血；\n                      攻击敌方再吸取敌方HP\n============================================================================\n暗灵法师三阶职业技能\n学习地点：\n============================================================================\n16.火龙枪             操控火龙成枪形射向敌人；\n                      火魔法，攻击最多全体\n\n17.冰爆术             爆裂的碎冰造成强大的伤害；\n                      冰魔法，全体攻击\n\n18.电流术             将落雷的力量分成数股电流射出；\n                      电魔法，攻击最多7人\n\n19.附身术             召唤顽皮精灵附于对方身上迷惑其心智；\n                      混乱加攻击\n\n20.一针见血           将敌方之血量及法力转为己用；\n                      攻击敌方并且可吸取HP和MP\n============================================================================\n暗灵法师四阶职业技能\n学习地点：\n============================================================================\n21.世界末日           禁忌的咒术，具有大自然所有力量结合而成的破坏力；\n                      雷火冰3合一全体攻击\n===========================================================================\n\n\n\n\n■追猎者技能表\n============================================================================\n追猎者一阶职业技能\n学习地点：追猎者公会（加鲁卡 283，575）NPC技能导师贝吉（13，19）\n============================================================================\n技能名称        石币  技能说明及技能解释\n──────────────────────────────────────\n1. 追寻敌踪     1000  提升遇敌机率\n\n2. 驯伏宠物     1000  提升捕获率,提升到一定等级可抓特殊宠\n\n3. 陷阱         1000  以陷阱反伤害物理攻击\n\n4. 弓熟练度     1000  增加装备弓的伤害力\n\n5 .精通回力镖   1000  增加装备回旋标的伤害力\n\n6. 精通投掷石   1000  增加装备投掷石的伤害力\n\n7. 精通投掷斧   1000  增加装备投掷斧的伤害力\n============================================================================\n追猎者二阶职业技能\n学习地点：南岛加鲁卡（乌鲁力村外）NPC野外狩猎（ 439，903）\n============================================================================\n8. 回避战斗      10W  减低遇敌率\n\n9. 挑拨          10W  使对方宠物不听使唤\n\n10.弱点攻击      10W  针对宠物弱点加以攻击，加强伤害力\n\n11.树根缠绕      10W  降低敌敏捷\n\n12.火焰抗性提升  20W  提升火焰抗性\n\n13.电雷抗性提升  20W  提升电雷抗性\n\n14.冰冻抗性提升  20W  提升冰冻抗性\n\n15.毒素武器      10W  让武器附上毒素使被击中之敌人中毒\n============================================================================\n追猎者三阶职业技能\n学习地点：\n============================================================================\n16.遗忘               使宠物暂时忘却所学习的技能\n\n17.天罗地网           限制敌人行动\n\n18.团队抗火           提升团队火焰抗性\n\n19.团队抗电           提升团队电雷抗性\n\n20.团队抗冰           提升团队冰冻抗性\n============================================================================\n追猎者四阶职业技能\n学习地点：\n============================================================================\n21.激怒宠物           提升宠物能力一回合\n\n22.毒素之网\n============================================================================\n追猎者职业等级5级以上可学\n============================================================================\n23.尸体掠夺           可对尸体做挖取动作得到物品\n============================================================================\n\n\n\n\n■白狼勇士技能表\n============================================================================\n白狼勇士一阶职业技能\n学习地点：白狼勇士公会（萨伊那斯 653，608）NPC技能导师肯尔特（25，20）\n============================================================================\n技能名称        石币  技能说明及技能解释\n──────────────────────────────────────\n1. 暴击         1000  攻击力提升攻击；\n\n2. 连环攻击     1000  一定机率发动攻击二次；\n\n3. 回避         1000  增加人物物理攻击回避率；\n\n4. 能量聚集     1000  集中身上的能量以提升防御力；\n\n5. 专注战斗     1000  集中精神于战斗中，强化自身命中率；\n\n6. 盾击         1000  利用盾牌敲击对手（需装备盾）；\n============================================================================\n白狼勇士二阶职业技能\n学习地点：吉鲁岛达那村（39.52）外，NPC流浪勇士（475，177）\n============================================================================\n7. 双重攻击      10W  使用虚招后第二次攻击加强；\n\n8. 二刀流        10W  可双手均装备武器提升攻击力，但左手武器之精灵将失效；\n\n9. 激化攻击      10W  瞬间提升攻击力并下降些许防御力；\n\n10.濒死攻击           以身上的伤口痛楚逼迫自己专注以提升命中率；\n\n11.枪熟练度     1000  增加使用枪类武器的伤害力；\n\n12.斧熟练度     1000  增加使用斧类武器的伤害力；\n\n13.棍熟练度     1000  增加使用棍类武器的伤害力；\n\n14.状态回复      10W  人物处于非正常状态下待机（昏睡，石化等）自动回复体力；\n\n15.舍己为友           帮我方宠物或人物抵挡物理攻击；\n============================================================================\n白狼勇士三阶职业技能\n学习地点：\n============================================================================\n16.格挡               加闪躲率.最后加反击率；\n\n17.混乱攻击           以发狂的怒气攻击敌方复数；\n                      乱数攻击敌复数\n\n18.贯穿攻击           同时伤害前后排之人和宠物；\n\n19.回旋攻击           以回旋的力量攻击敌方一整排敌人；\n                      攻击一横排敌人\n\n20.座骑攻击           将攻击大部分集中在骑乘宠物身上；\n                      攻击座骑\n\n21.破釜沉舟\n============================================================================"
