      content: "上次写了点心理战术，有朋友说要写点实在的才好，把陷阱单独拿出来写写，其实我所说的陷阱是指代计策的。我一直头痛的问题就是我所说的陷阱就是平时单P时钻对方心理上的空子，这些所谓的陷阱都是平时自然运用在战斗之中，而且相互之间缠夹不清，本人没那个才智将所有陷阱条理分明地罗列出来，只好照搬古人的著作了，借36计来谈谈计策在石器PK中的运用了，其实原意都是一样的，古人真是伟大啊~~~~感慨ing：\n_____________________________________________________\n第一计：瞒天过海\n原意指的是利用常见的事物来伪装自己的某个秘密目的。\n\n实例1：人宠合击的威力并不比一击和背3差很多，有的时候经常可以打的对方手忙脚乱，当对方看到你是用合击的时候就可能会打消加镜的念头了，然后时不时地将一击和背3混于合击当中，就达到了瞒天过海的目的。\n\n实例2：现在单P中的精灵战十分普遍，虽然一般的人都带了B3，但是C中精灵的机会还是比较大。如果自己的机暴中了精灵，那么一般人都不会用净化来医，多半是收起来再放出来以达到解掉精灵的目的。如果在对方预料你会换C出来的时候，你却换一只NONO出来，这样也就是一个绝妙的瞒天过海之计。可以大大减低对方对于NONO的警惕性，很有可能他急于扩大战果，就不会用镜子来对付你的NONO了。如果你是有心人的话可以把NONO和乖暴暴的名字改的十分相近，给敌人一种是同一只C的错觉，即使突然换只满血出来的C会不符合逻辑，但是一般人很少会想到是NONO的。\n______________________________________________________\n\n第二计:围魏救赵\n原意指的是攻敌之必救，引敌撤退然后再前后夹击慌忙撤退的敌人以战胜敌人。\n\n实例1：如果对方的人中了石化，这个时候比起杀宠，更好的方法就是以背3杀敌人。如果杀宠的话对方完全有可能靠不防守或者防御来撑过4到5个回合直到石化解除，但是如果用背3杀人的话（前提是对方人防不是很高），敌人为求自保，C自然会用忠犬来救，中了精灵的的人是不会躲闪的，所以他的C也就成了乖乖挨打的活靶子了，这个时候如果换上了NONO效果更佳，即使杀不了他人也可以飞了他的C(除非你运气超烂，NONO每次都打C，而且他的C都躲过去了）。如果配合上相应属性的魔法的话杀掉他的机会就更大了。\n\nps.这个时候要小心敌人和C身上的镜，如果对方的C带着镜用了忠犬。。。。倒霉的可是你。还有一点要小心就是有些人会孤注一掷，用C先来咬死你的C来解围，这个时候一个镜就会让对方乖乖蹲着不动。\n______________________________________________________\n\n第三计:借刀杀人\n\n敌已定，友未明；则应引友之力以杀敌，一石二鸟也。\nPk是双方面的，这招不适用。\n———————————————————————————\n\n第四计：以逸待劳\n困敌之战，不以战，损钢益柔。\n意思是说当困敌之势已经形成，敌人就会有持续性的耗损，自己不需要耗费力气，可以养精蓄锐，只要等敌人慢慢衰竭后再去拣现成的便宜就行了。\n\n实例1：我在机暴破水怪的战术中就是用的这个策略，只需要每回合人去打水怪机暴不防守，就可以以逸待劳，慢慢耗损敌人的气，而且可以使得对方心浮气燥而做出错误的判断。\n\nps.困势不一定是己方掌握进攻的主动权，而是指己方有能力维持这种对方消耗大于自己的情况。\n———————————————————————————\n\n第五计：趁火打劫\n敌之大害，就势取利。\n趁敌人内部发生祸事的时候趁机打劫来获取利益，火不一定是天灾，自然也可以人为喽，HOHO 不要太死脑筋。放火之术嘛，怎么放都行，反正是给对方添了乱子就算是成功了。\n\n实例1：放石睡混，趁对方无法行动是杀人杀宠\n实例2：放毒，趁对方忙着加血时人和C一起上来加重他负担\n实例3：对方乱敏撞镜时趁胜追击，杀掉他C\n实例4：趁对方倒霉被NONO咬到时补上一个魔法或者人和C一起上来至他于死地\n\n———————————————————————————\n\n第六计：声东击西\n这个计策大家都已经耳熟目染了，具体应用有好多，简单的，复杂的，主要是靠伪装。伪装的越好就越容易成功，我只举1个比较有用的例子，还有很多例子就不说了，大家一定都知道的。\n\n实例1：如果敌人防比较低的话，在敌人刚刚复活了自己C的时候可以不杀C而杀人，因为这个时候对方多半会以为你要趁他没加血的时候就杀掉他的C，所以一般不会防卫到自己的人，这个时候就不要怕撞镜，大胆地去杀。下个回合如果有一定的把握杀掉他人的话就可以继续杀人，如果他防比较高，没有多少把握杀人的话还可以调过头来杀他的C（有光的话就用人去破掉）这样就达到了声东击西的目的，打他个出其不意。\n———————————————————————————\n第七计：无中生有\n诓也，非诓也，实其所诓也。\n意思是说，先用谎言骗敌人，虚张声势来吓唬敌人，然后再由虚转实，在敌人发现你是虚张声势的时候再弄假成真打他个出其不意。有了外挂之后PK也已经变的十分透明，所以仅仅是虚张声势也没有什么用处，石器的规则也限制了我们从无变为有，所以这个计策自然也受很大限制，只有在某些特殊场合才用的到。\n\n实例1：现在已经很少人在单P中玩属性了，不过我还是牵强附会一下吧。假如说对方带了B3，那么你先转了对方的C，然后你换风出来，对方看你转了他，心想你对半是换要放风。他也应该会偷偷的用转来换掉B3，这个时候你就偏偏机暴不防守然后人放精灵，一般带了铜兜的人不带B3很容易中精灵，等他换了B3回来之后你再放风，这样由无变成有就可以牵制敌人，站住优势。如果对方是先转了你或者他自己的C再换B3回来的话他中精灵的机会就更大，还是你占便宜。\n\nps.现在PK时通过对话来骗对方实在是没意思，例如你跟对方说我带了B3了，你随便精灵吧。虽然也有一定的迷惑对方的作用，但是对方相信了是信任你的人，对方不信则是他疑神疑鬼，对方如果干脆当没听到则是自己自讨没趣。所以还是通过小动作来向对方放出假情报才是真功夫，别人只会佩服而不会说你胜之不武。\n———————————————————————————\n第八计：暗渡陈仓\n示之以动，利其静而有主。\n意思是说，以表面上的行动来使敌人警觉，当敌人全力休整军队，摆好阵势的时候自己则避开敌人的锋芒，绕道敌人后方去攻击他们脆弱的地方。这招跟声东击西大同小异，就不多说了。\n———————————————————————————\n第九计：隔岸观火\n原意指当对方有内患的时候，自己不直接介入，但是暗中来煽风点火，加快对方内患的发展速度，令对方更快灭亡。跟趁火打劫也差不多，什么好说的。\n———————————————————————————\n第十计：笑里藏刀\n信而安之，阴以图之；备而后动，勿使有变。\n这个也不用多说了，以表面上平和的气象来掩盖自己的蠢蠢欲动。在PK中的应用也很受限制，你对对方笑笑他也不见得会理你，一般Pk中都是双方不说话的。牵强附会的用的话只能说是在对方暂时感觉不到压力的时候发动突然而猛烈的进攻。\n\n实例1：在双方用5段，不防守和镜子来互相试探时你就在对方开始正式攻击前提前一步来先发制人。反正你人可以破镜，也不必担心镜子，先下手为强。\n———————————————————————————\n\n第十一计:李代桃僵\n势必有损，损阴以益阳。\n如果一定要有损伤的话，牺牲局部来拯救全体。\n\n实例1：有的时候人危机的时候就用宠的忠犬来救，这就是为什么我推荐机暴的技能除了必要的攻击，防御，4个T技能外还要学一个忠犬。忠犬不仅仅是用来救急的被动方法，如果跟镜子配合起来伤敌就更是令对方防不胜防。比如说我在机暴战法里说的那个用来对付高敏宠使用地球一周的方法就是一个很好的例子。\n———————————————————————————\n第十二计：顺手牵羊\n微隙在所必乘，微利在所必得。\n意思是说敌人微小的疏漏我们也要利用来攻击他，敌人不要的微小利益我们也要得到并化为自己的利益。\n\n实例1：这个主要就体现于PK中的用气了，我PK时总是很注意自己的用气量。平时力求用最少的气获得最大的利益，所以我一般是不放精灵的，自己也带着B3用来耗费敌人的气。平时尽量避免撞镜，而让敌人多撞镜，每一个回合每一个行动我都尽量使自己的用气量少于对方。当然精灵也是有用处的，但是我如果不能确定对方是不是带了B3时是不用的，试探性的精灵我也只有在自己气远远多于对方的时候才会放。\n——————————————————————————\n第十三计：打草惊蛇\n这个计策的意思是带着怀疑的态度去探察敌情，并不一定非要去打草，只是说要随时密切地探测敌人的动向。\n\n实例1：在PK中没有什么具体的例子可以表现这个计策，只要平时多注意敌人的行动，在没有猜测出对方行动的意图之前不要贸然行动。\n_____________________________________________________\n第十四计：借尸还魂\n指的是借用他人名义来发动进攻，一是为了出师有名，二则是为了鼓舞士气，这条计策在石器中没有什么实用价值。\n\n———————————————————————————\n第十五计：调虎离山\n兵法中此计指的是当敌人占据了有利的地形时则应该引诱敌人来到对己方有利的地形加以歼灭。\n\n一般PK时分为精灵战，属性战，攻防心理战和耗气战。\n实例1：如果自己带有B3的话就应该引对方跟你打精灵战来耗费他的气，至于如何引就没有什么确实有效的方法了，他不想放的话你也没办法，只有在他放精灵时不要给他压力，不然他忙着做别的就会放弃打精灵战了。\n实例2：属性战，一般带有白虎等宠物的人都会带水，有些是带水和转，有些是带水和风。一般单P时打属性战都是为了借着优势速战速决，僵持不下托久了一定是他吃亏，因为他要不断的维持属性对自己有利是很费气的。所以这个时候就应该将对方由速战引诱到对自己有利的持久战中，给对方制造一个假象是他一直占着属性看似在占便宜，但是他的气却在不知不觉中不断减少。跟白虎打持久战不错的方法就是人镜自己C然后C不防守，因为白虎的敏高于骑暴的，跟骑虎的人又容易乱敏，所以白虎用背2十分容易撞镜，对方多半会用3段来打。白虎3段打不防守的机暴命中大概是1/3左右，借着水一下可以打机暴200血，镜子可以镜掉白虎200血，所以这样就扯平了，但是加上机暴偶尔一下的反击咬掉的血，白虎就比较吃亏。一直放镜也是很耗气的，所以也可以人上去打，然后C不防守，偶尔1个镜子或者1击会让对方不敢用背2，这样对方一直要控制属性，还要给虎加血，同时还要提防你用一击，这样打持久战下去你就大占便宜了。\n_____________________________________________________\n第十六计：欲擒故纵\n逼则反兵，走则减势，紧随勿迫。累其力气，消其斗志，散而后擒，兵不血刃。\n逼迫敌人会引得敌人全力反攻，远离敌人则会消减进攻的势头，要紧随敌人而不逼迫敌人。消耗敌人的力气，磨灭敌人的斗志，当敌人涣散时再擒住敌人，不需要流血而战胜敌人。\n\n实例1：如果对方是一个新手的话，你完全有把握预测他的行动，就不需要冒险使用一击或者背3来逼迫他（这样他就不会镜你）。平时机暴不防守人去打，人宠合击，或者人打宠5段，只要你能够预测到他进攻的时机的话一个镜子就可以打散他进攻的势头，继续把他控制住。当他复活了C之后也不需要急于用一击来杀掉它，给他加血的机会然后再继续慢慢地杀，这样一般的新手都会自己跑掉的。\n_____________________________________________________\n第十七计：抛砖引玉\n指的是以小利诱惑敌人贸然行动，然后再趁其不备攻克敌人\n\n实例1：一般PK时都有一条警戒线，当HP低于这个警戒线时一般人都会马上补血，而一般人都是以对方一回合所能造成的最大伤害为警戒线。前几次当C的HP低于这条警戒线时就开始补血，这样敌人就会趁你加血时来进攻，因为他知道你加血的时候不会用镜子，而在他满以为预测到了你的行动时你不加血反而及格镜子给C，让它一头撞上。当然这招敌人吃过亏下次就会小心了，所以一定要伪装的好才可以不引起敌人的注意。一般短时间内最好不要故计重施。这就是一条以小利诱敌上当的计策。\n实例2：当自己C死掉而且对方血也掉了很多的时候，对方一般会人加血然后C来杀你，他料定你会换复活上来然后忙于复活加血，这个时候一个镜子就可以给他当头一棒。有些人比较谨慎，会先用5段试探，对付这种人下诱饵时就要多点伪装：先换复活上来，这样他看你没有镜他自然也会放松警惕。他想你既然换了复活上来当然就要马上复活了，这个时候就很容易镜到他了。当然要注意的是如果对方人和C血都满了的话，反正也没事做，多半会人上来破镜，这个时候就不要镜了，以免下次引起他的戒备。\n——————————————————————————\n第十八计：擒贼擒王\n这条计策的意思大家也一定都知道的很清楚，无论是团P还是单P都十分适用，所要讨论的就是应该在什么时候用。一般敌人最重要的首领当然会设下重重保护，要杀首领是很不容易的，所以要趁敌人忙于应付别的事情时来迅速杀掉首领。\n\n实例1：当敌人忙于给C复活加血时就是杀首领的最好时机，这个时候对方一般是不设防的。即使对方的C复活了也可以继续杀他的人，只不过要小心点他用C来杀你，不要以为只有100血的机暴就不会咬人。\n\nps。第十八和第十七计是相克的，其实很多其他的计策也是互相克制的，计策并不是在任何情况都可以使用的，只有在适当的时机对适当的人使用适当的计策才称的上是好计。\n———————————————————————————\n第十九计：釜底抽薪\n不敌其力，而消其势。\n遇到强敌则不应该正面战斗，而应该想办法消减敌人的气势。\n\n实例1：PK时如果遇到强敌就应该先不要硬拼，用人打宠不防守或者其他的方法（例如镜子，毒等等）来削弱他的气势，当他缩起来的时候自己则可以大胆的进攻，然后借助势头来杀掉他的C。\n——————————————————————————\n第二十计：浑水摸鱼\n指的是趁别人混乱没有主见的时候令他归顺自己。因为这个计策只对中立方有效，所以PK中没有用处。\n——————————————————————————\n第二十一计：金蝉脱壳\n表面上保持不动，而借此迷惑敌人来暗中转移主力。\n这招跟瞒天过海基本一样，所以也不多说了。\n——————————————————————————\n第二十二计：关门捉贼\n小敌困之。剥，不利有攸往。\n对待弱小的敌人应该困住他打包围战。如果让他逃脱而自己又紧追不舍是很不利的。这条计策在单P和团P中都很适用。\n\n实例1：当对方没有多少血的时候就应该集中力量解决他，不让他有喘气的机会。尤其是团P中杀被NONO咬到的人时就更是应该行动迅速，所以一般团P中敏最高的人有应该带着魔法戒指。如果1，2个回合内没能杀掉他，而他的血已经补的差不多了就不应该继续追击了，否则只会让对方的C趁虚而入，这个时候就要重整旗鼓再跟对方交锋。\n———————————————————————————\n第二十三计：远交近攻\n指的是在局势混乱不定的时候应该应该跟相隔较远的一方结为盟友，这样才可以豪无后顾之忧地近攻相临的一方。这是外交计策，PK中没有用处。\n———————————————————————————\n第二十四计：假道伐鹱（最后一字我也不认识，又不会五笔，打不出来， -_-o）\n指以实际行动来从强大国家之间解救弱小国家来获得支持，外交政策，不多说了。\n———————————————————————————\n第二十五计：偷梁换柱\n指设法频繁地改变敌人的阵势来引开敌军主力，再吞并掉弱小的部队，自己顶替这个位置之后再回头对付敌人主力。\n\nPK中无实用价值\n______________________________________________________\n第二十六计：指桑骂槐\n兵法中指对付弱小的势力有时候使用强硬的手段威吓以达到引导的效果。\n\nPK无实用价值\n——————————————————————————\n第二十七计：假痴不癜\n指宁可假装痴傻也不要自作聪明而轻举妄动。\n\nPK时应当掩藏锋芒，表面上看起来是软弱无力，丝毫没有伤敌的能力，但是暗中却着手准备，一旦时机成熟则以迅雷不及掩耳之势全力进攻。\n\n实例：主要就体现于机暴一击和背3的运用，平时要频繁地使用，应当收敛锋芒，在适当的时机使用才可以起到出其不意的效果。而且频繁地使用会使得对方有所防备，不利于己方发动突然袭击。\n_____________________________________________________\n第二十八计：上屋抽梯\n以小的利益来诱惑敌人走上绝地，然后断其前应后援，再加以歼灭。\n\n实战1：假如对方的C还有800，而自己的C刚刚复活，只有100血的时候，对方一般会急于解决你，而人打C5段来杀你的C，这个时候自己给C补血来绝他的前路，然后C一击去杀对方的C来断他的后援，这就是一招上屋抽梯的计策。\n———————————————————————————\n第二十九计：树上开花\n指借助友军的力量则可以以很小的兵力制造很大的气势。\n\n实战：防低的NONO和一些比较弱的机暴平时虽然很不堪一击，但是在团P中搀夹在其他的C里则可以造成很大的声势。一般的C吃2次机暴一击就没命了，所以无所谓是极品攻还是垃圾攻，差别并不大。如果怕对方咬到自己或者自己的C而飞掉，加一个镜子就可以了，大可以放手去借助这种气势杀敌。\n——————————————————————————\n第三十计：反客为主\n乘隙插足，扼其主机，渐之进也。\n趁着微小的空隙插足进去，控制住对方的主要机构，但是要小心地循序渐进，不可操之过急。\n\nPK无实用价值\n———————————————————————————\n第三十一计：美人计\n兵强者，攻其将；将智者，伐其情。将弱兵颓，其势自萎。利用御寇，顺相保也。\n\n计表面上是说以美色来瓦解敌人将领再达到破敌的目的。计策是死的，但是把计策引申开来说就是再强大的敌人都有弱点，对付表面上强大的敌人要从其他的侧面来寻找敌人的弱点并且从这些弱点下手来瓦解敌人。\n\n实例：PK中主要表现在分析对方的弱点\n-如果对方人不耐打就应该找机会攻击他的人\n-如果是C比较弱则应该杀光他的C\n-如果他用气比较费就应该暗中耗费他的气\n-如果他怕精灵则应该用精灵配合NONO来打\n-如果对方是纯属性人（骑纯属性宠）则应该在他加血不及的时候杀人\n-如果对方是防人则可以借助毒和魔法来杀，或者先暗中多耗费他的气以防到后来对方跟你耗血\n——————————————————————————\n第三十二计：空城计\n虚者虚之，疑中生疑；刚柔之际，奇而复奇。\n意思是说如果本来空虚则就干脆毫不掩饰，反而更加暴露这种空虚，使本来就多疑的敌人更加怀疑，不敢贸然行动，以达到拖延时间等待后援的目的。如果空虚的时候还要用粗劣的方法掩饰则更会引来敌人进攻。\n\nPK中的应用机会不多，这种计策只能短暂地迷惑敌人，所以只有在别无选择时才使用。\n———————————————————————————\n第三十三计：反间计\n指的是反过来利用地方安插在己方的间谍来给对方提供假情报，当敌人按照假情报来采取行动时自己则趁机加以打击。\n\n这条计策在PK中也没有什么具体的用法，只是计策中所含的意图却可以应用在很多地方。当对方做出试探性的动作时往往意味着他将要采取实际行动，这个时候则应当迎合对方的意图假装不设防，而暗中准备，在敌人进攻时给予当头痛击。\n\n实例：当对方试探性地用5段来破镜时则意味着他将要采取行动，这个时候就假装没看到，然后突然一个镜子就可以让敌人掉入陷阱。至于什么时候加镜则要根据对方的谨慎程度来判断了，直觉+经验+运气\n——————————————————————————\n第三十四计：苦肉计\n人不自害，受害必真；真真假假，间以得行。\n此计利用的是人们心中“人不自害”的普遍想法来施行的。本来是指以伤害自身的方法来取得敌人的信任，然后间谍则可以顺利的潜入地方。周瑜痛扁黄盖之后就成功地令黄盖混入曹操军队。但是引申一下原意则可以理解为：一般人不会作出对自己有伤害的行动，所以自然就不会对这些行动有所提防。\n\n有位朋友提出过一种战术，开始觉得跟苦肉计有些出入，所以打算加到第37计“死地求生”中，不过后来仔细想想计策不必拘泥于形式，本意都是利用了“人不自害”的心理。有时候只用其意而不露其形才会使计策变得更加神不知鬼不觉。\n\n实例1：\n感谢“阿猫阿狗”提供的战术,以下为引用：\nPK的时候，自己的宠血剩很少，对方的人宠都有镜，而且对放的人肯定比他的宠要慢，我的宠敏比他的宠又要快点，如果我加血，他那他打我的C去的血也不少，如果不加，我的C肯定死。我选择了自己的C用B2打我，（我敏300几，很难中，就算中了也不会打超过300血），自己帮C加镜，结果是自己没事，对方一定是全力打我的C，结果他的C撞镜飞了，我扭转了整个局势\n\n虽然战术比较冒险而且有局限性，但是某些场合确实有一定的实用价值，至之死地而后生。\n——————————————————————————\n第三十五计：连环计\n连环计指的是一次使用2个或更多的计策，并且环环相扣，在敌人刚刚发现中计时又掉进了第2个陷阱中，他的行动都被你所掌握，一是可以打击他的自信，二是可以令敌人深陷其中不能自拔。连环计的妙处就是通常前计的计尾又是后计的铺垫，当敌人自以为明白前计的意图时就会忽视前计中某些环节中所隐藏的伏笔，令他更容易掉进下一个陷阱中。\n\n实例1：我在《机暴战法》中解释过的对付NONO的方法就是一个连环计，第1回合人镜自己然后C防御，表面看来仅仅是一个自保的普通行动，但是我的真正目的是为了保证每回合结束时人和C身上至少有一个镜子，这样就可以在下回合给没镜子的补上镜子。每回合对方有2个镜子要破，而他只能破掉一个，这就令他每回合都不得不破镜，而又永远破不完镜。这就是一招简单的连环计。\n\n实例2：在敌人不注意的时候加一个镜子给自己，表面看起来只是简单的一个自保动作，但是如果带的是高敏宠的话这个时候使用地球一击则会令对方本来要攻击你C的宠撞到你的镜子上，这也是一个最简单的连环计。\n\n实例3：平时加个镜子给C，然后某些时候C使用忠犬令来攻击你人的C撞镜也是一条连环计。\n———————————————————————————\n第三十六计：走为上计\n全师避敌，左次无咎，未失常也。\n全军撤退来避开强敌，这种退却是无罪的，完全是一种军事决策。撤退是为了寻找更好的时机来作战，以退为进。\n\n实例：PK中逃跑就等于是输掉了，所以这个计策当然不能用来逃跑。而是指当自己的C被对方追着打，难以扳回形势的时候可以收起来，换别的C出来重新来控制战势，当对方忙于做别的事情的时候也可以再换出来补血。\n______________________________________________________\n\n各种实战中的战术有待大家一起来补充，我会在每条战术中加上作者的名字，希望大家一起努力来补完这些计策。 ^o^"
