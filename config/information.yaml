      content: "1.首要条件必须完成伐木任务\n2.并获得杉之手环(伐木14根交给木材商即可获得)\n3.然后去海底信道打海主人、姆伊、加克拉或加格\n4.就有机会拿到超级xxx(xxx表示以上其中之一种)\n5.竿的部份，先至jotb第二站(403，253)附近的森林中\n6.遇敌即有机会遇见LV1的杰洛磨树，并打倒之\n7.打完后就有机会获得竿(有三种，特沙金竿、卡库尔竿、曼模竿)\n8.将线与竿交给玛丽娜斯村的制竿专家，他就会帮你制作钓竿\n9.最好的是仙人之竿，其次是工匠之竿，再其次为名人之竿\n10.仙人之竿可换到贝4、壳5跟可加忠诚10的鱼\n11.工匠之竿可换到贝4、壳4跟可加忠诚5的鱼\n12.名人之竿可换得贝4、壳3跟可加忠诚1的鱼"
