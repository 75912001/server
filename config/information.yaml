      content: "ｙｕｈｕａｓｈｉ搜集整理\n韩天阳 修改\n==================================================================\n●铜铁装备精工事项\n镶了宝石和魔法的兜或铠升级后宝石和魔法都会掉.\n换珊瑚或时要留有空格,建议留2格.\n海底装备LV3可以镶封印戒指\n铜铁装备已经镶上的宝石或魔法钻戒将要重新再镶.已经镶失误的可以获得\n一次重镶嵌的机会(黄字武器也可以顺利转白)\n\n『注意』：精工的任务需要完成成人仪式 才可精工\n==================================================================\n●精工必需品：\n\n★加血素材:提炼为蓝珊瑚\n蓝珊瑚碎片1 泪之海(198,97)(196,91) 40-50级 史比特\n蓝珊瑚碎片2 泪之海(326,81)(330,79)附近 60-70级 卡特\n蓝珊瑚碎片3 泪之海泪之海(215,263)打过宫本后 12X级 艾斯坦\n\n★加攻素材:提炼为红珊瑚\n红珊瑚碎片1 泪之海(279,110)(279,108)附近 5X级 奧特普\n红珊瑚碎片2 泪之海(377,196)(381,196)附近 6X级 特利斯克\n红珊瑚碎片3 泪之海(159,436)(163,433)附近 13X级 奇格拉\n\n★加防素材:提炼为绿珊瑚\n绿珊瑚碎片1 泪之海(198,97)(196,94)附近 40-50级 洛斯克\n绿珊瑚碎片2 泪之海(326,81)(323,85)附近 60-70级 史卡鲁\n绿珊瑚碎片3 泪之海(215,263)打过宫本后 13X级 特雷吉洛\n\n★加敏素材:提炼为火山岩\n火山岩碎片1 泪之海(279,110)(283,107)附近 5X级 沙列克\n火山岩碎片2 泪之海(377,196)(375,200)附近 6X级 特雷沙\n火山岩碎片3 泪之海(159,436)(161,435)附近 13X级 柏洛德\n\n石器7.0打奇肯沃(Lv130-Lv140)，奇肯克奈(Lv130-Lv140)会得到各种\n珊瑚碎片1.2.3 跟火山岩碎片3\n\n★纯净的海水 泪之海全区域   全海域敌人\n\n★牙10 太阳之牙   深红洞窟地下8楼   57-65格鲁西斯（做焰红装备）\n★石10 发红光的石 碧清洞窟14楼蓝暴前  55-65史多拉奇顿\n                  水苍洞窟  55-65史多拉奇顿（做苍绿装备）\n★骨10 龙骨的化石 无名洞窟地下3楼 81-90邦奇诺（做湛蓝装备）\n★木10 神木       琉璃9楼(39,40)(4,44)  53-66贝洛洛克（做岚黄装备）\n==================================================================\n●精工详细地点\n\n精工装备   精工地点                                 工本费\n\n焰红装备1:多多村（54，46）                          1000 石币\n焰红装备2:阿斯玛鲁矿山1楼（38，8）                  1500 石币\n焰红装备3:深红的洞窟地下3楼（24，24）               2000 石币\n\n苍绿装备1:无名洞穴地下1楼（40，32）                 1000 石币\n苍绿装备2:拉多拉的大洞窟1楼（南岛JBA1楼）（46，20） 1500 石币\n苍绿装备3:琉璃的洞窟5楼（19，37）                   2000 石币\n\n湛蓝装备1:巴那姆的洞窟地下2楼（46，34）             1000 石币\n湛蓝装备2:碧青的洞窟地下5楼（29，05）               1500 石币\n湛蓝装备3:水苍的洞穴地下3楼（17，4）                2000 石币\n\n岚黄装备1:吉鲁采石场1楼（17，9）                    1000 石币\n岚黄装备2:吉鲁岛沒落的矿坑2楼（25，54）             1500 石币\n岚黄装备3:玄黃的洞窟地下4楼（33，13）               2000 石币\n==================================================================\n●精工及贩卖的地点\n泪之海--沙己夫洞窟(21,117)洞窟地下2楼(34,18)\n沙己夫洞窟地下2楼NPC(