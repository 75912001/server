      content: "作者：BOX_天空战记001\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n●法师\n\n①【冰熟练度】:\n先学技能:【冰附体】\n修炼方法:【冰附体】点自己,【冰箭术】攻击敌人,【冰镜术】攻击敌人时都会提升【冰熟练度】\n\n②【火熟练度】:\n先学技能:【火附体】\n修炼方法:【火附体】点自己,【火山泉】攻击敌人,【火星球】攻击敌人时都会提升【火熟练度】\n\n③【雷熟练度】:\n先学技能:【雷附体】\n修炼方法:【雷附体】点自己,【召雷术】攻击敌人时都会提升【雷熟练度】\n\n注意:【暴风雨】攻击敌人提升的是【冰熟练度】\n\n\n●白狼\n\n①【回避】\n先学技能:无\n修炼方法:去灰人龙后面挂猪\n\n备注:如果你不会练【回避】,可以先学【盾击】再学【回避】再练【盾击】就可以提升【回避】了\n\n②【二刀流】\n先学技能:【盾击】【连环攻击】\n修炼方法:拿两把武器去打怪\n\n③【状态回复】\n先学技能:【能量聚集】【舍己为友】\n修炼方法:\n两个ID快速PK\n白狼号尽量减敏,不戴加石化(昏睡)的首饰\n另一号带5级单体石化(昏睡)精灵,宠物学石化攻击\n\n④【枪熟练度】\n先学技能:【专注战斗】\n修炼方法:右手拿枪去打怪,\"战士枪\"无效\n\n⑤【斧熟练度】\n先学技能:【专注战斗】\n修炼方法:右手拿斧去打怪\n\n⑥【棍熟练度】\n先学技能:【专注战斗】\n修炼方法:右手拿棍去打怪,\"巨熊匕首\"算棍\n\n●猎人\n\n①【追寻敌踪】\n先学技能:无\n修炼方法:竞技场护士前点技能即可\n\n②【回避战斗】\n先学技能:【追寻敌踪】\n修炼方法:竞技场护士前点技能即可\n\n③【精通回力镖】\n先学技能:无\n修炼方法:拿回旋标去打怪\n\n④【精通投掷石】\n先学技能:无\n修炼方法:拿石头去打怪\n\n⑤【精通投掷斧】\n先学技能:无\n修炼方法:拿投掷斧去打怪\n\n⑥【弓熟练度】\n先学技能:无\n修炼方法:拿弓箭去打怪\n"
