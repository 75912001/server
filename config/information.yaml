      content: "三年前的石器时代是怎样的呢？在你心中那曾经是最纯朴的年代即将在石器博物馆重现，繁华的年代人声鼎沸多少前尘往事一一浮现，在石器内第一次认识远方的朋友，那从未谋面却又如此熟悉的感觉。彼此互相帮忙，一起努力抓那可爱又笨笨的宠物，捕获的一瞬间那种兴奋是无法用言语来形容的。\n\n有太多的回忆只有让我们穿越时空回到达那时代，回到没有家族、没有骑宠的年代，和好友再一起去寻找那令人喜爱的宠物，再度与宠物们并肩作战，感受挑战百人道场的艰辛，最后挑战成功获得无上荣耀的那种感觉。\n\n因此，我们开立了‘石器博物馆’，在博物馆内特地设置1级宠物的动物园让玩家们可以一起再去捕捉达那时代的珍贵宠物与超强宠物，另外设置一个超级新手训练员【迪克牧】，让玩家可以迅速的提升自己与宠物的能力来遨游整个石器的达那时代。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【完整解析石器家族系统】", "第一部分:家族常识"]
      content: "【写这篇的目的】\n让大家重新对石器的家族系统有个完整的认识!充分利用家族功能!\n家族系统是个大系统，包括声望系统，族战系统，骑宠系统，成员权限系统这些小系统！\n\n整篇分四部分:家族常识,家族管理,家族庄园,家族活动\n\n【声明】：未经本人同意，不得转载，抄袭\n\n          第一部分  家族常识\n一：为什么要建家族\n     建家族可以把多余的石币存进银行，施放某些精灵比较优惠，这是家族的两个最基本的功能（对所有族员开放）。自己建家族还可以合成高级装备，做出美味大餐，有实力的家族甚至还可以抢占庄园，成为呲咤风云的庄园家族\n\n二：如何建家族\n1.建家族有以下几个条件，缺一不可：\n⑴人物等级30以上，完成成人仪式\n⑵石币10000\n⑶把身上的一只宠作为守护兽\n⑷家族数未满1000个\n\n2.建家族的步骤：\n⑴去四大村村长家或伊甸大陆五大庄园找“家族管理员”申请，点选“申请成立新的家族”（尼斯大陆各村村长家均有）\n⑵家族名：取一个比较特殊的家族名，有助于提高家族的知名度。还有，家族名不能重名。\n⑶家族守护精灵：有光明精灵和黑暗精灵两种\n\n①光明精灵\n高等净化精灵：\nLv 1：------------10-------------\nLv 2：------------21-------------14\n复活精灵：\nLv 1：------------20-------------13\nLv 2：------------35-------------\nLv 3：------------50-------------34\n净化精灵：\nLv 1：------------03-------------\nLv 2：------------09-------------06\n治愈的精灵：\nLv 1：------------05-------------\nLv 2：------------08-------------\nLv 3：------------11-------------\nLv 4：------------14-------------\nLv 5：------------17-------------\n滋润的精灵：\nLv 1：------------08-------------05\nLv 2：------------12-------------08\nLv 3：------------16-------------11\nLv 4：------------20-------------13\nLv 5：------------24-------------16\n恩惠的精灵：\nLv 1：------------20-------------13\nLv 2：------------30-------------20\nLv 3：------------40-------------27\nLv 4：------------50-------------34\nLv 5：------------60-------------41\n\n②黑暗精灵：1,3,5,7,9级精灵不费气\n㈠猛毒的精灵:\n11 级:-------------02--------------\n13 级:-------------04--------------\n15 级:-------------06--------------\n17 级:-------------08--------------\n毒雾的精灵:\nLv 1：-------------06-------------\nLv 2：-------------08-------------\nLv 3：-------------10-------------\nLv 4：-------------12-------------\n毒雾的精灵Lv 5\n10 级:-------------14--------------\n12 级:-------------16--------------\n14 级:-------------18--------------\n16 级:-------------20--------------\n18 级:-------------22--------------\n\n㈡硬化的精灵:\n11 级:-------------02--------------\n13 级:-------------04--------------\n15 级:-------------06--------------\n17 级:-------------08--------------\n石化的精灵:\nLv 1：-------------05-------------\nLv 2：-------------07-------------\nLv 3：-------------09-------------\nLv 4：-------------11-------------\n石化的精灵Lv 5\n10 级:-------------13--------------\n12 级:-------------15--------------\n14 级:-------------17--------------\n16 级:-------------19--------------\n18 级:-------------21--------------\n\n㈢睡眠的精灵:\n11 级:-------------02--------------\n13 级:-------------04--------------\n15 级:-------------06--------------\n17 级:-------------08--------------\n昏睡的精灵:\nLv 1：-------------06-------------\nLv 2：-------------08-------------\nLv 3：-------------10-------------\nLv 4：-------------12-------------\n昏睡的精灵Lv 5\n10 级:-------------14--------------\n12 级:-------------16--------------\n14 级:-------------18--------------\n16 级:-------------20--------------\n18 级:-------------22--------------\n\n㈣混乱的精灵:\n11 级:-------------02--------------\n13 级:-------------04--------------\n15 级:-------------06--------------\n17 级:-------------08--------------\n混迷的精灵:\nLv 1：-------------04-------------\nLv 2：-------------06-------------\nLv 3：-------------08-------------\nLv 4：-------------10-------------\n混迷的精灵Lv 5\n10 级:-------------12--------------\n12 级:-------------14--------------\n14 级:-------------16--------------\n16 级:-------------18--------------\n18 级:-------------20--------------\n\n㈤酒醉的精灵:\n11 级:-------------02--------------\n13 级:-------------04--------------\n15 级:-------------06--------------\n17 级:-------------08--------------\n酩酊的精灵:\nLv 1：-------------04-------------\nLv 2：-------------06-------------\nLv 3：-------------08-------------\nLv 4：-------------10-------------\n酩酊的精灵Lv 5\n10 级:-------------12--------------\n12 级:-------------14--------------\n14 级:-------------16--------------\n16 级:-------------18--------------\n18 级:-------------20--------------\n\n⑷家族守护兽:家族守护兽只有族长才有,长老和一般族员都没有.家族守护兽不能更改,不能丢弃,不能交易,不能改名,不能邮寄.\n家族守护兽两种功能:\n\n㈠家族加工:只有用家族守护兽才能合成出10级以上的装备和给10级以上装备加精灵,家族综合声望越高,合成的装备等级越高.目前最高为18 级.\n\n●什么是10级以上装备?有那些?\n10级以上装备是指用10级以上的素材合成的装备,主要是以下这些:\na.11-20 级的武器,铠,服,兜,防具(11 级不带精的兜和防具均为10级成分)\nb.合成手环 6-10   合成戒指 8-10\n\nPS:像合成首饰 B4,合成耳饰 10这些10级以下的装备,所有人均可合出来,且不论声望高低.\n\n㈡家族料理:用家族守护兽料理出来的食品,因为有妈MD味道,所以有两种效果:\na.正效果:即效果加倍.如豪华船生鱼片,平常为全体加500的HP,用家族料理能全体加1000的HP(补血补气料理一般效果加倍)\nb.反效果:即食品失效.如干青鱼子,家族料理出来就不能食用了.(加宠物忠诚,加宠物捕获率,净化异常,施放异常的均为失效食品)\n\n家族料理不论声望高低均可料理出来\n\n选家族守护兽原则上无限制,一般选擅长合成或料理的宠物.如凯比系,乌力系,这样才能发挥它作为家族守护兽的作用\n\n⑸家族主旨:这是给你所建的家族作一个简单的介绍,好让别人了解你的家族.主旨可更改\n\n这样,一个家族就成立了.此时,系统会把你刚建的这个家族随机放在家族列表中(家族名以绿色字显示),你得重新点选\"申请加入现有家族\"找出你刚建的家族所在的位置,牢记起来,这样别人加入你家族才找得到.家族七天之内集齐10个人到你家族,则这家族才算正式成立(家族名以白色字显示).如果不能集齐10人,则家族将被系统解散.成为正式家族后,有人离开家族,则必须在三天之内再集齐10人,不然还会被解散.一个家族最多100人.\n\nPS:华义是这么设定的,可实际上有的家族只有一个人,过了N个月了还没被解散,不知何故\n\n●建家族技巧●\n1.家族改名(马上解散马上建立)\n2.抢注家族(先随便建个家族,将来再通过族长让位,家族改名来修改)\n\n\n三:如何加入现有家族\n1.加入家族的条件:\n⑴未加入任何家族(人物名字前无家族标记)\n⑵与要加入家族的任一成员均不能重名\n\n2.加入家族的步骤\n家族列表中有三种颜色字的家族\n\n白字家族:正式家族,可申请加入\n蓝字家族:正式家族,不可申请加入\n绿字家族:非正式家族,可申请加入\n\n点\"加入\"后,系统会向在线族长发一条审核信息,内容包括你的等级和现家族总人数.如果族长通过或拒绝你,系统会再向你发一条信息显示族长处理结果.如果族长不在线,则必须以后自己去家族留言板或点\"家族键\"查看\n\n\n四:如何退出家族\n     很简单,直接点\"确定\"就离开家族了,离开家族之前贡献给家族的声望就被留下,个人声望可以带走,个人银行也可以带走.\n\n五:如何解散家族\n     必须由族长来解散或被系统解散,解散之后,家族的共同银行,庄园,留言板,家族声望全部消失,守护兽不再有家族加工,家族料理的功能,恢复自由.\n   【小插曲】如果骑着庄园骑宠去退出家族或解散家族,成功后,系统会让你落马,不必惊慌,再骑上就行了!\n\n六:家族银行如何管理\n家族银行分为家族共同银行和家族个人银行.\n\n1.家族共同银行:可存放高达一亿的石币,每个家族成员都可往家族共同银行存钱.但只有族长和长老才能从家族共同银行中取出钱来,9大家族的收入也是直接算进家族共同银行的!\n\n●9大家族的收入来源●\n只要有人在9大家族所管的村及庄园地理范围内买东西,9大家族都有收入!具体算法,不清楚\n\n2.家族个人银行:这是属于个人的小金库,最大存款为1000万石币,别人看不到也拿不着的,只有加入家族才有家族个人银行.加入家族后,往个人银行存钱.之后退出家族,个人银行还可以自由存取"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【完整解析石器家族系统】", "第二部分:家族管理"]
      content: "【声明】：未经本人同意，不得转载，抄袭\n\n\n           第二部分:家族管理\n\n要管理好一个家族，就必须要有对这家族的管理权才能实现. 2.0版本之前的家族,族长没实权,很难管理,基本靠族员自觉. 2.0版本开始,设立了\"家族键\",家族管理布入正轨\n\n一:家族键在哪?\n\n在石器窗口左上方往右数第五个按钮,非战斗状态下按次按钮才有反应.\n\n二:家族键如何实现家族管理\n1.没有家族的人按此按钮只显示个人声望,并请你去加家族\n2.有家族的人按此按钮会有以下功能:\n⑴家族名:显示你所在的家族名称\n⑵家族资料:显示家族名,族长名,人数,家族声望排名,家族综合声望,家族个人声望,个人家族地位,族战表,家族精灵等9项家族基本资料\n⑶家族频道:家族频道可以让你在游戏里直接跟族员聊天而不必聚一起\n\n加入聊天:在同一个小服务器的同一频道里才能实现此功能.最多支持10人同时聊天.想和更多的族员聊天,则必须加入家族全频道,按 Ctrl+C 组合键进入,此频道支持50人同时聊天.聊天内容只有本族成员才看得到.如果想让同屏幕的人也看得到,则必须先打上\":\",再打出对话内容.\n\n查看族员:随便点选一个家族频道可以察看有几个族员在本服务器里\n\n⑷离开频道:离开频道后,族员的聊天内容你就看不到了.族长取消族长广播也是按此键或 Ctrl+C 组合键实现的!\n\n⑸族长功能:族长或长老专用功能\n㈠族长广播:族长可通过广播来告诉族员一些信息,如族战,练功之类.只要族员在线,不管在哪,均可看到族长广播的内容(待审核族员看不到)\n\n㈡家族成员管理:族长和长老均可使用此功能,此功能为家族管理的重点,此功能显示家族成员的名字,等级,个人声望,地位,在线状态.\n族员在家族中的地位分为四级,权限如下\n\n族长:家族中权利最大,有以下特殊权利\n1.更改家族主旨\n2.家族合成\n3.家族料理\n4.开放,关闭,解散家族\n5.取家族共同银行存款\n6.族长广播\n7.任免长老,通过或拒绝族员\n8.召唤家族成员\n9.下战书,约战\n10.族长让位\n11.家族留言\n12.申请庄园\n13.制作学习同意书,邀请函\n\n\n长老:家族中除族长之外的管理人员,家族权利较少.长老最多可以有四位\n1.开放,关闭家族\n2.取家族银行存款\n3.通过或拒绝族员\n4.制作同意书,邀请函\n\n\n一般族员:享有家族的一些普通功能,具体如下:\n1.把钱存入家族共同银行\n2.听族长广播\n3.让族长召唤\n4.参加族战,庄园战\n5.接受长老职位\n6.接受或拒绝族长位\n7.家族成员留言\n8.加入家族频道聊天\n9.退出家族\n10.家族守护精灵优惠\n11.拥有个人小金库\n12.进家族庄园聊天室\n\n待审核族员:家族中的非正式族员,享有的家族功能非常少.\n1.把钱存进家族银行\n2.家族守护精灵优惠\n3.家族成员留言\n4.加入家族频道聊天\n5.退出家族\n6.拥有个人小金库\n\n㈢制作学习同意书:庄园家族的族长和长老有权制作,数量无限,地点不限,时间从占庄园的那一刻起至庄园战败的最后一刻\n\n●同一张学习同意书不论哪个庄园家族所发,其效果均一样\n\n㈣制作家族邀请函:跟制作学习同意书一样\n\n㈤族长让位:族长让位必须新旧族长在同一服务器,新族长如不接受族长位则让位失败.新族长如接受族长位,则让为成功.此时,家族守护兽随即消失,新族长则必须在三天之内重新选定守护兽,方算让位结束,否则家族将被解散.\n\n●新族长条件:等级30,完成成人仪式\n\n〖家族让位小问题〗:\n问题:族长已经让位了,守护兽也消失了,新族长要确定新守护兽时,系统说原来的守护兽还在,怎么办?\n\n答案:新族长再让位就行了!\n\n\n三:家族留言板的作用\n\n作用:辅助家族管理\n\n1.家族留言板在哪?\n在各村村长家及伊甸大陆五大庄园\n\n2.家族留言板功能\n㈠家族成员管理:跟前面介绍的一样,不同的是:家族中的一般族员和待审核族员可以通过此板了解本家族其他族员的名字,等级,个人声望,职位,和在线状态等情况\n\n㈡家族留言\n此板只供族长留言,非族长只能看,此板供族长为家族打广告之用,显示留言时间(不知道现在几点的可以去留言查看)\n\n㈢家族成员留言\n此板供族员留言,本族族员都能看到,同样显示留言时间(不知道现在几点的可以去留言查看)\n\n㈣申请家族据点\n此板显示庄园所在坐标，拥有家族.如无人拥有,而自己所在的家族人数过30人,家族综合声望达1000,即可由族长申请家族入住.\n这是开新服时,家族抢庄园的方式\n\n㈤查看家族声望表:\n此板可查看家族总声望在前30名的家族,各项声望在前10名的家族及自己的家族排名细表.在这里还可以看到家族声望.\n\n\n四:声望系统\n1.声望起源:\n2.0版本才开始有\"声望\"这个参数\n\n2.声望的作用:\n⑴提高家族守护兽的合成能力\n⑵家族综合声望达1000,才有资格入住无人占领的庄园\n⑶家族综合声望排名在前20,才有资格下战书挑战庄园家族\n\n3.声望分类\n⑴按取得方式\n饲育声望:练宠得来的,等级越高越多.如今得声望的主要方式\n\n冒险声望:做任务,依任务大小定声望:完成某一任务得到的声望不变\n\n合成声望:合出的装备等级越高越多\n\n料理声望:料理豪华生鱼片.以前挂声望的主要方式\n\n战斗声望:通过家族战所得.胜利的家族得败的家族中家族声望的10%\n\nPS:可查看\"任务声望表\"及\"练宠声望表\"中的具体数据(X挂上有)\n\n⑵按用途分\n个人声望:随身带着,不会减少\n家族声望:为家族贡献的声望\n家族综合声望:个人声望和加家族声望\n\n\n4.家族声望贡献方法:\n设个人所得声望为a,则a包含两部分,平均分成两半\n\n一半给自己,即个人声望\n一半给家族,机家族声望\n\n●如果没有加家族,则分给家族的一半声望将被系统收回,再去加家族被收回的一半声望也要不回来\n\n●如果有家族,则家族声望多一半,这部分就是为家族作的贡献.之后再换家族,之前贡献的一半家族声望也转移不过来.只有个人声望可以转移!\n\n这也就是带人做任务的最直接动机\n\n5.家族的兴衰\n如何看呢?这个很难说,不定因素很多,我只说说我个人的粗浅看法:在家族总声望和人数比相差不大的情况下\n\n个人声望占的比重过大,则家族刚刚起步,势不可档\n家族声望占的比重过大,则家族曾经风光一时,如今家族败落\n家族声望和个人声望占的比重差不多,则家族正在兴盛中"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【完整解析石器家族系统】", "第三部分:家族庄园"]
      content: "     第三部分：家族庄园\n\n一：什么是家族庄园\n        家族庄园也叫庄园,石器中有9个,由9个实力雄厚的大家族分别拥有!地点位于四大村及伊甸大陆五大城附近.是家族身份和地位的象征！\n\n二：家族庄园设施\n\n1.设施：\n⑴骑乘训练师：\n骑乘训练师可以让你骑上指定的宠物，具体如下：\n\n①一般骑宠：这类骑宠只要去学习就能骑到，一个人物只能骑一只指定的老虎或雷龙,至于哪只,可以向骑乘训练师查询.可以骑乘的老虎和雷龙如下:\n\n●老虎类：格鲁西斯(红虎)，贝鲁伊卡(黄虎)，贝鲁卡(绿虎)，金格萨贝鲁(金虎).\n●雷龙类：布洛多斯(咖啡雷),布林帖斯(蓝雷)，布拉奇多斯(红雷)，斯天多斯(绿雷),邦恩多斯(金雷).\n\n②庄园骑宠: 这类骑宠还必须吃掉由庄园族长或长老制作的\"骑乘学习同意书\"才能骑!一张\"骑乘学习同意书\"只能骑一种骑宠!同种同意书吃一张就行了,多吃无益!吃掉同意书将永远可以骑乘该庄园骑宠!具体如下:\n\n●尼斯大陆:\n加加村的庄园:格尔格(红猩猩)\n卡鲁它那庄园:玛恩摩洛斯(白象)\n玛丽娜斯庄园:左迪洛斯(蓝暴)\n萨姆吉尔庄园:巴朵兰恩(红暴)\n\n●伊甸大陆\n塔耳塔庄园:卡达鲁卡斯(绿穿山甲)\n尼克斯庄园:扬奇洛斯(蓝人龙)\n弗烈顿庄园:卡卡金宝(红蛙)\n亚伊欧庄园:朵拉比斯(金飞)\n伊甸庄园:拉奇鲁哥(红狗)\n\n③限制骑宠:就是骑帖拉所伊朵(机暴).\n\n限制条件:人物必须5转,必须吃掉\"机暴学习同意书\"\n\n●如何拿到机暴学习同意书?\n要拿到\"机暴学习同意书\"必须找到一只名叫\"驯兽机暴\"的机暴拿,吃掉同意书后才能骑乘,驯兽机暴有18个出现坐标,具体如下:\n\n加加村的庄园\n卡鲁它那庄园\n玛丽娜斯庄园\n萨姆吉尔庄园\n塔耳塔庄园\n尼克斯庄园\n弗烈顿庄园\n亚伊欧庄园\n伊甸庄园\n\n加鲁卡\n多多村\n萨伊那斯(这坐标经常出现)\n卡坦村\n沙姆岛\n吉鲁岛\n亚伊欧风城\n塔耳塔城区\n伊甸大陆南方\n\n●机暴学习同意书的特点?\n1.不能交易,不能丢弃,但可以邮寄.\n2.登出后随即消失\n3.非5转人得到邮寄过来的同意书吃不掉\n4.非5转人跟驯兽机暴是拿不到同意书的\n\n\n④骑乘等级\n\n学习骑乘技能分为4级\n\n初级:学习40级以下宠物的骑乘技术 学费5000\n中级:学习80级以下宠物的骑乘技术 学费10000\n高级:学习120级以下宠物的骑乘技术 学费15000\n特级:学习所有等级宠物的骑乘技术 学费20000\n\n注意点:\n1.人可以骑比自己的等级高的骑宠,但只能高4级,高4级以上就不能骑乘了!\n如:人100级,最多可以骑乘104级的骑宠!104级以上就不能骑乘了!\n\n2.人物有没有转生,骑宠有没有转生跟骑乘等级无关!\n如:0转120级也可以骑124级的转虎\n\n3.骑宠的忠诚度没有100也不能骑乘！\n\n\n⑵庄园族长家:\n要进庄园族长家必须有家族邀请函才能进去!华义设定不管是不是该庄园家族成员均需要家族邀请函.\n里面有三个NPC:秘书,家族医生,银行\n\n秘书:秘书可以帮你制作家族邀请函或骑乘学习同意书,当然只有庄园族长或长老去问话,秘书才会帮你做.(家族邀请函和骑乘学习同意书均为一次性的用品)\n\n家族医生:可以免费帮你补血\n\n银行:可以用来给族员集体发工资\n\n⑶家族商店\n要进家族商店必须有家族邀请函才能进去!华义设定不管是不是该庄园家族成员均需要家族邀请函(为了防止家族邀请函无限使用)\n里面有一个NPC,他会跟你换东西,或者让你的宠物学特殊技能,具体如下:\n\n加加村的庄园:学习\"落马术\"技能,限鸟类和吉比\n卡鲁它那庄园:1.学习\"T技能\",限机暴   2.学习\"捐献\"技能,限扑满乌力\n玛丽娜斯庄园:无\n萨姆吉尔庄园:无\n\n塔耳塔庄园:\"萨顿秘药+30000石币\"换\"替身娃娃Lv 1\"(我戴了它去打黑蛙王还是被飞)\n尼克斯庄园:\"有气势的鱼+40000石币\"换\"宠物项圈Lv 1\"\n弗烈顿庄园:\"炎之圣石+100000石币\"换\"恶魔宝石Lv 1\"\n亚伊欧庄园:\"太阳神的首饰Lv 1+50000石币\"换\"月神首饰Lv 1\"\n伊甸庄园:\"牙10+线10+150000石币\"换\"驯兽戒指\"\n\n●换东西的条件:必须做完金飞航空任务\n●交换的物品多带也会被一次性全部收走\n\n⑷开放商店:\n没有限制条件,主要是收购素材和买一些东西!不用再像家族商店那样以物换物!\n收购的素材如下:\n\n玛丽娜斯庄园:壳\n卡鲁它那庄园:线\n萨姆吉尔庄园:买智慧之果1\n加加村的庄园\n塔耳塔庄园:\n尼克斯庄园:\n弗烈顿庄园:\n亚伊欧庄园:\n伊甸庄园:骨\n\n\n⑸家族对战场\n这地方是用来进行争夺庄园的地方!只有家族综合声望排名在前20的家族才有资格去抢庄园\n(具体过程请参考第四部分:家族活动)\n\n这里有一个功能：返回记录点\n这样想返回记录点就不用登出浪费点了！\n\n⑹庄园聊天室\n此聊天室可做为家族开会的理想场所!非本族正式成员是进不来的!(防止外人混入家族偷听机密)\n\n\n三:家族庄园功能\n庄园所具有的功能虽然简单,但重要.有以下功能:\n\n1.制作家族邀请函和骑乘学习同意书\n这是有庄园的家族的特权.试想,能制作函和证书的最多只有9*5=45人,而一个服务器(非小服务器)的人有成千上万个.\n\n⑴.一个人总共需要9张证书,可见证书的需求量是如何的庞大!拥有一个庄园就等于控制了本服务器该庄园骑宠的所有权和使用量!!虽然一种证书一个人只需要一张,但还是供不应求.证书以萨村证,渔村证,水城证,风城证,地城证这五种价值较高!\n\n⑵.家族邀请函可以去家族商店交易物品,而且一张只能使用一次.本庄园家族成员进本家族商店也需要邀请函,这就使得家族邀请函的需求量也是很大的!拥有一个庄园就等于控制了本服务器该庄园家族邀请函的所有权和使用量!!函以加加函,卡村函,伊甸函,火城函这四种价值较高!\n\n可见,证书价值高,函价值就不高.证书价值不高,函价值就高!所以抢哪个庄园,权利都不相上下!\n\n\n2.庄园经济收入\n拥有该庄园就可以有收入!收入的来源有:(以渔村外例)\n\n⑴在渔村及其庄园内,只要付钱给NPC,家族就有收入!\n⑵家族共同银行的存款不会因为个人向渔村及其庄园内的NPC要钱而减少\n\n家族的庄园经济收入有个比例!!至于多少,很难计算!大约是1/3!\n即:付钱给NPC 300石币,家族共同银行就有100石币的收入!!\n\n●这样的收入是个什么概念呢？\n举个例子：\n㈠3.0版本，中国网通7，加加庄园\n根据曾经当过加加庄园的几任族长说，占领加加庄园每天平均有2000万的收入！因为中国网通7的玩家PK，挂料理，交易都集中在加加村，人流非常大！所以可以尽情的烧！有的加加庄园长老别称干脆叫“钱怎么烧不完”，“没事烧钱玩”.\n\n㈡4.0版本，中国网通9，地城庄园\n那时刚开不到1个月，我们抢了地城，我当族长3天，我们总共从家族银行中取出超过500万的存款！因为去地城买东西的人少得可怜啊！再加上能上伊甸大陆的玩家并不多！\n\n\n3.家族开会\n这是给家族开会提供一个非常安静的场所,非本族正式成员都不能进去!!而且离四大村五大城又很近,开会不用怕有人偷听或骚扰!!普通家族要找个这样的地方还真麻烦!"
