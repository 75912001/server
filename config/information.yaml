      content: "\n【城市简介】\n座落于一座高台上的风城，长年刮大风使的当地缺乏生气，到处是干枯的草原和枯木。人民就居住在一栋一栋较大的树木内部，借着树木厚实的内壁抵挡狂风。风精灵崇尚自然，她的能力也对大自然有滋润作用。渐渐的风城周遭草木旺盛起来，风城的人民以吃果实为主，穿著以兽皮或树皮连帽披风为主，爱流浪的本性使他们发明了草鞋，变成唯一穿鞋的族群，风城的歌唱表演艺术盛行，这也是他们流浪在外赖以求生的技能。\n存点肉：立度鲁斯（可在亚依欧城区打到）\n\n2.建筑物\n■亚依欧风城王宫：巨大神木建造的风城皇宫内可以富丽堂皇的喔！\n■亚依欧风城宠物店：\n\n 可习得的技能\t功能\t价钱\n待机\t什么也不做\t599S\n攻击\t通常攻击\t1199S\n防御\t通常防御\t1199S\n双重突击 两回合储存力量，下次攻击时，就会有两倍以上的攻击力 9599S\n一击必杀\t给予两倍的攻击伤害，但是命中率会下降\t2999S\n背水之战其之2\t防御利减50﹪攻击力加50﹪\t2999S\n不防守战法\t自己不进行攻击，反击跟回避率就会变得非常高 3599S\n\n■亚依欧风城医院：可以买到各种医疗品，还有美容师可以增加魅力\n\n亚依欧药剂师1\n贩卖物\t功能\t价钱\n耐久力回复药\t耐久力100前后回复\t25S\n耐久力回复药\t耐久力200前后回复\t50S\n耐久力回复药\t耐久力300前后回复\t75S\n耐久力回复药\t耐久力400前后回复\t100S\n耐久力回复药\t耐久力500前后回复\t125S\n耐久力回复药\t耐久力600前后回复\t150S\n耐久力回复药\t耐久力700前后回复\t175S\n耐久力回复药\t耐久力800前后回复\t200S\n气力回复药\t气力20前后回复\t80S\n气力回复药\t气力40前后回复\t160S\n气力回复药\t气力60前后回复\t240S\n气力回复药\t气力80前后回复\t320S\n气力回复药\t气力100前后回复\t400S\n复活药(100)\t气绝回复成耐力100\t100S\n复活药(300)\t气绝回复成耐力300\t300S\n乌西摩尼叶\t解毒的热带性植物\t30S\n伊西娃丽索叶\t解除石化的潮湿地带植物\t25S\n\n亚依欧药剂师2\n贩卖物\t功能\t价钱\n摩浦叶\t解除混乱的平原植物\t20S\n西伦恩根\t解除酒醉的干燥地带植物\t20S\n菲恩叶\t解除睡眠的海边植物\t30S\n\n■亚依欧风城武器店：\n贩卖物\t功能\t价钱\n亚依欧的弓箭1\t攻+18 防-17（3-5）\t41600S\n亚依欧的弓箭2\t攻+20 防-19（4-5）\t65000S\n亚依欧的弓箭3\t攻+22 防-21（1-6）\t84500S\n亚依欧的弓箭4\t攻+23 防-22（2-6）\t104000S\n亚依欧的弓箭5\t攻+26 防-25（3-6）\t123500S\n亚依欧的弓箭6\t攻+28 防-27（4-6）\t143000S\n亚依欧的投掷斧1\t攻+36\t32000S\n亚依欧的投掷斧2\t攻+40\t50000S\n亚依欧的投掷斧3\t攻+44\t65000S\n亚依欧的投掷石1\t攻+27 防-5\t35200S\n亚依欧的投掷石2\t攻+30 防-5\t55000S\n亚依欧的投掷石3\t攻+33 防-6\t71500S\n亚依欧的回旋标1\t攻+23 魅+5\t38400S\n亚依欧的回旋标2\t攻+25 魅+5\t60000S\n亚依欧的回旋标3\t攻+28 魅+6\t78000S\n亚依欧的A2首饰1\t魅+5 毒性+30\t6800S\n亚依欧的A2首饰2\t魅+5 石化耐性+30\t6000S\n亚依欧的A2首饰3\t魅+5 睡眠耐性+30\t5200S\n亚依欧的A2首饰4\t魅5+混乱耐性+30\t8000S\n亚依欧的A2首饰5\t魅5+酒醉耐性+30\t4000S\n亚依欧的A3首饰1\t魅2+毒耐性+60\t11900S\n亚依欧的A3首饰2\t魅2+石化耐性+60\t10500S\n亚依欧的A3首饰3\t魅2+睡眠耐性+60\t9100S\n亚依欧的A3首饰4\t魅2+混乱耐性+60\t14000S\n亚依欧的A3首饰5\t魅2+酒醉耐性+60\t7000S\n亚依欧的A4首饰1\t魅5+毒耐性+75\t19040S\n亚依欧的A4首饰2\t魅5+石化耐性+75\t16800S\n亚依欧的A4首饰3\t魅5+睡眠耐性+75\t145600S\n亚依欧的A4首饰4\t魅5+混乱耐性+75\t22400S\n亚依欧的A4首饰5\t魅5+酒醉耐性+75\t11200S\n亚依欧