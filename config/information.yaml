      content: "1,人物角色仓库栏位互通使用.人物角色的仓库栏位开通后,左右两边的人物,共可相通用道具栏位喔!!\n好处 1,不必再忍受因为仓库栏位的限制!\n　 2,不用再丢弃掉心爱的道具了!!\n　 3,不必在当阔少爷,到处送礼了!!\n　 4,不必再提心吊胆冒着被偷走的危险了!!(将道具丢在地上后,再赶紧开另一个人物上来捡时通常道具也不见了!!)\n使用方法  只要将物品存放进去,就可以让另外一个角色直接拿取只要在仓库NPC那里选择新增加的存取指令就可以把东西放在二个角色都可以使用的仓库空间里\n\n　2,聊天室及密语功能说明\n华义新功能 左上角\"开启频道\"可建立聊天室属于自己专有的频道建立聊天室费用200石币,可使用Tab 键切换频道模式,一般模式,密语模式\n\n频道模式 : 加入聊天室后可以直接说话给里面的人听,聊天室外面的人并不会听到\n一般模式 : 即是我们平时说话的模式\n密语模式 : 只要点选聊天室里面的对象使名字变成黄色就可以说悄悄话,跟我们平时使用的密语是一样的\n频道删除 : 关闭结束此频道\n踢除队员 : 队长可以踢除不想要加入的队员\n队长更换 : 点选想要换的人然后按此键更换队长\n视窗关闭 : 此动作并不会脱离频道,只是方便你进行游戏,只要你用Tab键切换成频道模式一样可以参与讨论\n脱离频道 : 离开此聊天室\n\n原始人不必打开邮件功能就能说悄悄话唷，怎么说呢？赶快一起来试试看最新的密语功能！\n\n◆ 使用格式\n/tell + （对象）+ （要说的话）\n\n\n\n◆ 注意事项\n1. 原始人可以跟在线上的朋友说悄悄话，只要在同星系里的同一颗伺服器内就可以了唷！\n2. 密语字数限制同一般说话长度。\n3. 如在说悄悄话的时候，发现密语的对象在同一颗伺服器内有两个以上相同的昵称，这时候游戏画面会出现判别视窗，显示等级、转生、昵称给使用的人判断是要送给谁，这样就不会送错人啰！\n"
