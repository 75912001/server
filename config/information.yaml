      content: "【推荐挂机装备与地点】（6.0版）\n作者：『韩天阳』\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n1.地城135雷龙洞窟\n建议装备：\n头部：岚黄之兜3（满石）\n身体：岚黄之凯3（满石）\n手部：双头叉or焰红武器3（满石）\n左饰：滋润LV.3手环（玄黄分支任务拿）\n右饰：萨姆吉尔的首饰（红暴任务拿）\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n2.海底140练级区\n建议装备：\n头部：苍绿之兜3（满石）\n身体：苍绿之凯3（满石）\n手部：双头叉or焰红武器3（满石）\n左饰：合成手环9or心环or力环\n右饰：萨姆吉尔的首饰（红暴任务拿）\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n3.火城140GP、扑满\n建议装备：\n头部：焰红之兜3（满石）\n身体：焰红之凯3（满石）\n手部：熔岩斧or双头叉or焰红武器3（满石）\n左饰：滋润LV.3戒指\n右饰：萨姆吉尔的首饰（红暴任务拿）\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n4.拨拉岛120雷\n头部：随意即可\n身体：随意即可\n手部：随意即可\n左饰：随意即可\n右饰：萨姆吉尔的首饰（红暴任务拿）\n物品：涛之圣石、恶魔宝石、炎之圣石\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n5.打铜、铁\n头部：苍绿之兜3（满石）\n身体：岚黄之凯3（满石）\n手部：双头叉\n左饰：敏环9or攻环9\n右饰：萨姆吉尔的首饰（红暴任务拿）\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n6.打钻石\n头部：海贼王兜\n身体：战士凯（地城）\n手部：双头叉\n左饰：幸福的花圈\n右饰：运气+5的勾玉（红暴任务拿）\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n以上只是建议的装备，如果你有，戴着可以少费气或者不费气！不过还是取决于人物的状态和属性"
