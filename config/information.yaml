      content: "作者：『韩天阳』\n部分转载BOX_天空战记001\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n大家都知道7.0法师的“嗜血成性”吧，用血加气，但是这点还不能够奠定法师最适合矿工的说法，因为白狼对敌人一下一个，但是我不推荐白狼是为什么呢？因为速度问题，如果一下出来10个敌人，白狼才一下一个，那么大家计算一下时间是？？？？\n法师则不同，看看我以下分析：\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n暗灵法师：\n\n一般装备：\n双头叉（补血快，跟的上）\n双头蛇之铠（因为+回避）\n迪克腰带（因为增加负重2，可以多打2个矿石和素材）\n响尾蛇之靴（加敏还加气）\n\n推荐装备：\n全套岚黄装备（都镶上珍珠，因为气力需要跟上！用岚黄装备因为敏高费气量少，速度也就快）\n环9--敏环（敏高点，才不至于每回合都嗜血，加快速度！）\n\n详细方法：\n法师学会一种熟练度和任意一个该属性打全体（或者一排）的技能！\n去打，设置好嗜血后每回合都用全体（一排）的技能，你不用带气，因为你有嗜血帮助，不需要气了，一般血不会突然很少的，因为你敏高，打不到你的！但是你却可以用2-3回合解决全体敌人，是不是很爽呢？\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n附上“天空战记001”的技能表提供大家选择技能\n\n01.嗜血成性(100%)[辅助]---------------0:依HP而定,比例为10:6,即吸10分的HP补6分的MP!人和骑宠的扣血比例为3:7(MP:0)\n02.嗜血蛊(91%)[战斗功能]--------------9:先扣120血,每回合再扣40血!扣血5回合,因此中一次扣320血(MP:15)\n03.移形换位(91%)[辅助]----------------9:使用后6回合打不中,第7回合出手前还原(MP:50)\n04.冰箭术(99%)[战斗功能]--------------1:敏下降25%,冻住3回合,第4回合解冰,每次损血310左右(MP:20)\n05.冰镜术(92%)[战斗功能]--------------8:依对方的防而定!打1级乌力扣150,打黑暗精灵王扣1192!(MP:40)\n06.冰附体(96%)[战斗功能]--------------4:中了降敏,依对方的敏而定!效果2回合!雷龙降2%,精灵王降98%(MP:50)\n07.冰熟练度(94%)[辅助]----------------6:熟练度无法测试(MP:0)\n08.召雷术(94%)[战斗功能]--------------6:扣血355(MP:30)\n09.暴风雨(88%)[战斗功能]--------------12:攻击全体,扣血230(MP:70)\n10.雷附体(92%)[战斗功能]--------------8:中了麻痹!效果2回合!被打麻痹效果消失!(MP:50)\n11.雷熟练度(74%)[辅助]----------------26:熟练度无法测试(MP:0)\n12.火山泉(96%)[战斗功能]--------------4:扣血230(MP:35)\n13.火星球(92%)[战斗功能]--------------8:攻击一排,扣血400(MP:50)\n14.火附体(96%)[战斗功能]--------------4:中了中毒,效果2回合!第一回合扣100,第二回合扣50,因此中一次附加扣150血(MP:50)\n15.火熟练度(65%)[辅助]----------------35:熟练度无法测试(MP:0)\n\n\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n本文版权全权由韩天阳所有，请转载保留版权！\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n本资料由SACHMX独家享有，如需要转载，请联系【bbs.92wy.com】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【石器时代经验与技巧】", "【挂机常用装备详细分析】"]
      content: "作者：『韩天阳』\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n双头叉：主要用途就是滋润的精灵LV.5，且可以变换属性（水+8）打火灵勇士推荐！现在由于铜铁装备和珊瑚装备不能加精灵，所以武器精灵尤其重要，叉子就是武器中加血最实用的一个！\n\n熔岩斧：恩惠费气NNNNN多，7.0也不会减低费气量，但是由于同样可以变换属性（火+8），所以挂GP极为有用！而且7.0法师可以用嗜血成性，配合熔岩斧的恩惠5是个不错的选择！\n\n海蓝装备：这个装备看着效果不错，但是实际则不然，虽然每回合+30血，挂机、挂素材不错，但是耐久度过低，几天后就1小时修复1次，越来越容易坏。。。。。。（不推荐购买）\n\n华裔装备、凯亚装备：耐久度有了一定提升，尤其凯亚，提升很多，且每回合+血60，不过还是很容易坏。。。。。。由于是青龙活动送的，所以推荐人手一份（那是不可能的。。）\n\n吉岩枪：做这个任务十分简单，道具却是十分实用，因为有昏睡的精灵LV.5，所以打任务NPC和PK价值较大，但是挂机不推荐！（耐久度中等）\n\n精灵王弓：这个攻人用的上，用了这个简直秒杀，而且有滋润的精灵LV.3（忘记是3还是2了）\n适合打灵石，人物穿珊瑚装备带弓去！\n\n海贼王兜：人们谣传他不会坏，但是实际上会坏的，附带解除异常的精灵！\n（耐久度 高 ）推荐挂机使用！\n\n心环、力环：这个环都是任务得到的，不过需要花上2个小时打鳞11和花10，也算珍贵物品！\n推荐挂机使用（依照自己实际情况）\n\n萨姆吉尔首饰：这个传说加运气，但是BOX已经证实，这个首饰不会增加运气，但是却是挂机不可多得的饰品，因为他可以100％逃跑（挂金暴洞时候有用），复活光精灵是PK常用精灵！\n\n灵力凯：这个建议挂机不要用【真·灵力凯】，去萨村NPC处领取个以前的灵力凯即可！\n附带恩惠5精灵，挂机常用！配合7.0法师更佳！\n\n卡坦的旋风：回旋标，可能大家不是很了解，是做任务得到的，附带精灵（毒雾的精灵5）\n适合打一些精灵王、做灵力凯等NPC和任务使用！\n\n合成手环9：这个可是挂机绝对不可多得的好道具，增加很多参数，让你挂机不发愁，但是由于很难合成出来，费钱很多，所以不够普及！\n\n珊瑚装备：加防很多，且有强制的-伤，而且还有4种，可以增加不同参数！可以镶嵌宝石！\n（缺点：不能上精灵）\n\n暂时就这么多…………………………\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n本资料由SACHMX独家享有，如需要转载，请联系【bbs.92wy.com】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【石器时代经验与技巧】", "【石器时代名词释意】"]
      content: "本篇文章版权由“韩天阳”所有，转载请保留版权！\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n不用多说，看下去：\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n基本数值：\n\n攻---攻击力（打敌人的伤害程度）\n\n防---防御力（受到攻击的抵抗程度）\n\n敏---敏捷度（闪躲攻击的评估标准）\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n装备数值：\n\n血---耐久力（增加自己血量，相当于RP游戏的HP）\n\n气---气力  （施展精灵、魔法必耗数值，相当于RPG游戏的MP）\n\n伤---杀伤力（对敌人来说就是减少杀伤力，对自己来说就是增加杀伤力，本数值是硬性的，即使你只能打某敌人1血，他还是会强行减少杀伤的数值）\n\n吸---吸附力（对敌人说就是增加吸附力，对自己来说就是减少吸附力，本数值也是硬性的，即使敌人能打你1000血，还是会强行吸走吸附力的数值伤害）\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n特殊数值：\n\n会心一击率---（非常特别的数值，不能检测出来，可以增加爆击几率！）\n\n回避率---（非常特别的数值，不能检测出来，可以增加回避几率）\n【注意】：回避率并非是敏捷力，本质上区别就是敏高的人先出手，回避高而敏低的人不能先出手！\n\n闪避率---（7.0职业装备上的新数值，其作用和回避率差不多，本质区别就是可以增加回避率同时增加反击率）\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n正在更新更多数值解释………………\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n本资料由SACHMX独家享有，如需要转载，请联系【bbs.92wy.com】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
