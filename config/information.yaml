      content: "作者：LITTLE STAR（HTTP://WWW.BOXBBS.COM/131/130892.SHTML）\n终级医生探谜，星星吐血之作，超强推荐(再添加《地与火的区别，选择你的最佳防守属性》一文），望家族战队成员观看及探讨\n\n在写这篇帖子之前，我已经写了《打造你的PK强队，星星版》，由于发帖时碰巧机器死机，而我又未及时保存，当场气得吐血，现重写一遍那文中最精华的部分奉献给大家。\n\n随着1。82时期的人龙合击战术淡出大家的视野。对于医生的理解却仍然未有大的突破，在我参加的几次族战中，经常见到的是一个1500以上血的医生被我方转白虎挂风后直接咬飞（全火不加防大血敏），从而导致接下来的我方几轮精灵攻击促使对方彻底崩溃。 医生对于一支队伍的重要性不言而喻。尤其是现在非医生角色大多不佩带B2的局面。\n一个好医生，必须具备以下四点：\n一。防高血多。\n二。不中精灵\n三。在最恰当的情况下放下净化\n四。原始属性好\n\n现在我来讲下最重要的第一点\n我想大家首先必须明白这两件事：\n1。放精是人8宠2\n2。总防为人防加宠防\n3。骑宠回避为人的回避\n\n人龙老虎合击战术由于骑宠后乱敏加剧，致使几宠合击成为理论上的可能。所以，医生的敏究竟值不值得那么高？先医和后医又有什么区别？ 在普遍使用B2B3攻击的情况下，如果中了睡石而医生后解，宠便无法行动，所以从这个意义上来说，先后出手医治毫无区别。 但用混乱后医生在宠行动之前打针，宠便可自由行动，基于200敏的医生的存在，使得混乱精灵几乎无任何作用，故而现有95%的队伍都不用混乱。 所以从这个意义出发。医生的紧箍咒：敏捷问题终于可以得到彻底释放。 随之而来一个重要问题，医生骑宠问题。 我想是时候，让大家考虑一下骑转雷的真正意义了。大家可能马上会想到防高血多的绿雷与蓝雷。 相比其它雷，这两种雷的一级宝宝一个路远一个做任务。我们很自然地想到捕捉野生雷。 我在BBC上发表的《经验谈极品红暴与绿雷的获得》一文中已经详细地说过如何高效率地捕捉极品野生宠，这里不再累述 ，\n不过继续补充两点： 1。给大家极品野生120蓝雷三围的参考数据：防220以上，血1300以上，敏55以上（攻不做要求） 2。如果为了练得更快，可以去水坝洞捕捉10X的野绿雷。\n\n我敢很肯定地说：野生宠的三围搭配比例根本就是纯随机的，所以如果你今天运气很好，那就象我一样几分钟就抓到只1305血120级的水雷，欢欢喜喜拿去转生。如果运气不好可能几天都碰不上。那只好抓一级的来练，怎么个练法？ 有两种：把敏加到300以上（攻击宠8人2）骑着练，据我观察，65敏合英雄岛的水雷已经有不小经验。 还有就是低敏合击红狗和120加美，按个人喜好。 300以上敏可以用其它ID带，也可以用本ID在5转前加高敏带出来，视个人条件而定。 OK。如果你没花什么力气就获得只极品雷龙，恭喜你，你离一个超强医生已经不远了。\n\n现在来谈谈点数分配。\n按照奈落5转140有570点来算（平均125转生）\n我提出如下方案：\n160敏150防260血\n\n我们来算下这个点数组成的人裸体三围数值\n体力：1350\n攻击=0+160/20+150/10+260/10=49\n防御=150+160/20+260/10=184\n速度=160\n\n医生标准装备：\n手部：超特级柯尔克石（攻加33，防御减2）\n身体：里拉拉的铠（防御+40，敏捷加10）\n头部：兜10以上（防御设为加25，敏捷设为减7）\n左饰：萨首饰\n右饰：高等净化精灵\n（注意，用外挂换装备只能换左饰）\n\n加上装备后的数值，请看→\n体力：1350\n攻击：49+33=82\n防御：184+40+25-2=247\n速度：160+10-5-7=158\n\n按转雷转后防2。4，血14，敏0。9来计算\n当人到140时，转雷为137\n此时，血1850，防御330，敏捷130左右\n人骑后\n总防=247+330=577\n敏捷=158*0。8+130*0。2=153\n由于人防御比雷低，所以人去血较之于雷而来得多，而补血通常都是人补的多，故而此方案可保证去血加血人宠分配均衡。\n\n奈落前面说了，伤害是原始伤害乘以属性加强系数。所以如果原始伤害非常小，那属性强化可以说几乎起不了任何作用。\n假设转红龙140攻396 396*1。45=575\n\n总防值竟然和如此高的攻值接近到几乎相等！我们可以预见这个医生的抗打能力。只要属性不是大水大风。\n\n属性双转的秘密最终被揭示，预示着有意识的强队会向地水宠方向发展 所以我推荐地7水3或者地8水2的属性。道理大家都应该很明白。\n\n最后解释一下：153敏是为什么？\n因为按照非合击打法，医生的敏高点低点是无所谓的，而太低会全无回避，骑宠易死。\n\n153敏可以保证有一定的回避能力，莫忘记萨首饰的作用，而这个153敏又隐含着对另一种非主流但颇具潜力打法的适应性：即转黑蛙转水怪合击队。 大家可以算算，转水怪转黑蛙1左右的敏到140时的值 这样的低敏医生的作用，又相当于1。82时期医生快过人龙的作用了。\n\n补遗：当写了这篇帖子后，我在思考医生的抗打能力还能不能进一步上升。自然而然想到无敏防血，因为防血人通常防御高于骑宠，所以决定防血人必然是大防小血，否则会造成骑宠加不上血的现象。根据队长的损血公式的前半部分：攻击*2-防御*1。5…………和极品火宠攻击在400左右，推算人宠总防为800左右，可是奈落后来用不骑宠防御570的全防做了实验，证明无敏防血极容易被打出星星，甚至很容易被高敏人骑虎连击而死，所以医生一定要加敏，加敏的意义在于减小出星星的概率和增加回避。而加100以下的敏效果并不显着，推荐底线不能低于150。\n\n======================\n           地与火的区别，选择你的最佳防守属性\n\n一般火宠斗属性的拉锯战中。\n为了支开对方火宠队的属性，有两种办法。\n即本方火不变，把对方转为地，或者本方变地，对方为火。\n对应起来就是\n1。转对方放火。\n2。转自己放地。\n\n通常在遭遇战中，普通的队伍都有第一回合就转对方的习惯，由于没有标记转两次属性不变，所以双方队伍的属性在大部分时间里保持一致。  这样导致什么后果？\n就是飞宠杀宠较之于水宠队来得困难，而更多的时间是僵持，等待机会杀人。这也就是火宠队之间互相胜负的偶然性很大的缘故，而且在这种情境下，水人风人极易是人龙下手的目标。\n\n明白双转原理的队伍，都是第一回合转自己放地，然后直接杀宠，这样宠虽然可杀，却很难飞掉。\n\n由于使用火宠队的队伍极多，各个队的战术也不用，所以我也不再多讲。我只是谈下人的属性--选择全火和全地有什么不同？\n\n回到第一种情况，假设最不利的局面：我方被转，对方放火，如果我是个地人，那么转后变火，与火宠平起平坐，火宠占不了便宜。\n\n第二种情况，假设最不利的局面：对方转自己放地成功，那因为我是地人，受益于地属性强化，所以对方又讨不了便宜。\n\n由此总结下来：地人的优势是在于在最不利的情况获得最有利的情况。\n\n如果我是全火：\n那显然是在最不利的情况下占据不利的局面。\n但全火有什么优势？\n比方我是全火，我只有在本方属性控制成功的前提下，即在有利的局面下获得更有利的局面。\n\n由于骑宠后血敏的生存能力进一步增强，1000多血地火属性的高段血敏和防血敏在没有属性加强的情况下，不论是绿龙还是红龙都不太好杀。\n\n进而得出这样的结论：\n地属性是放弃了优势时的更大优势，而采用劣势时的优势\n火属性是放弃了劣势时的优势，而采用优势时的更大优势\n\n我想看完本帖后，大家心里都应该有数了。本人水平不高，错误之处，\n多谢指点。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 决斗详尽资料】", "PK战队"]
      content: "作者：奈落（HTTP://WWW.BOXBBS.COM/131/130776.SHTML）\n打造你的极品PK强队，奈落吐血之作，经验毫无保留倾囊相授！请家族所有战队成员以及喜欢PK的人士一看！\n\n1.关于医生。\n我相信直到现在还有很多人保持着“医生的敏捷应该控制在比宠物略高的程度”这样的观点。我先不说这个观点是对是错。我们来从医生这个职业的性质来分析。\n\n“医生的敏捷应该控制在比宠物略高的程度”→医生比宠物先行动，在宠物行动之前解除宠物的异常状态。这是目的，对吧。 但是，解除了，又怎么样呢？我可以很肯定的告诉大家，在常用的3种精灵（混乱、睡眠、石化）中，除了中混乱在该回合宠物行动之前解除异常状态之后可以正常行动之外，中睡眠、石化之后即使当回合宠物行动之前解除了，宠物依然是不会行动的！（如果不相信的可以自己去做实验）\n\n那么在宠行动之前解除又有何意义呢？医生早早净化之后对面的精灵手才放精灵结果导致下回合许多人/宠无法下指令，结果十分被动的情况相信不少人都遇到过。\n因此，医生的敏捷，理论上越低越好，医生越晚出手越好。 因此现在明白这个道理的队伍已经出现了不少0敏血防医生，甚至全防医生。 可以肯定的一点是，0敏血防医生耐打是绝对耐打的，但是，回避率极低、宠损血比人快、补血比人慢等特点，暴露了这种0敏人的弱点-----------只要盯着他打，2、3回合之内就能把他打下宠！除非他们每回合两个人以上恩惠！\n\n因此，我不推荐0敏人做医生，在我看来，医生还是得加一定程度的敏，这里完全是为了提高回避、让人宠损血/补血分配更合理。但是医生的敏不能太高，控制在稍微比转龙低一点的程度上比较好。我个人认为加装备后敏170-180是比较理想的。然后加100-200防，把总血量控制在1200左右。\n\n那么为什么大家会有“医生的敏捷应该控制在比宠物略高的程度”这种进入误区的想法呢？这里就要提到合击了---------中睡眠、石化之后解除了宠依然可以行动的情况，有且仅有一种例外：就是合击的产生！只要在宠行动前解除异常状态、并且合击的判定产生，那么宠就会象疯了一样在医生净化之后一涌而上大合击！因为医生的敏应该比宠略高的情况，在合击队是适用的！例如现在的水怪队、黑蛙队！当年的人龙合击队！一路过来的老玩家都知道当年合击打法的流行！也是因此“医生的敏捷应该控制在比宠物略高的程度”这种想法才会深入人心。但是现在人龙队都已经不再用合击了（因为骑宠之后总防的提高使得普通攻击对对方造成的伤害大大减少，而且敏的夹杂不齐使得合击的难度提高），所以以前的观念该改变了。\n\n顺便说一下装备的问题，现在灵力凯已经成为大家的标准装备了，这里最大的原因就是它只扣30气的恩惠5。但是医生是基本用不着恩惠的，因此3.0出现的新道具---里拉拉的凯成了医生的另一种装备选择。 为什么呢？我们来看里拉拉凯（+40防+10敏）和灵力凯（+48防-12敏）的数值区别。里拉拉凯总共是+50点，灵力凯是+36点，明显是里拉拉凯合算。打个比方，我要求穿装备之后敏捷170，那么穿里拉拉凯的话，我只要加160敏就够了，而穿灵力凯我必须加182敏，于是穿里拉拉凯的人就可以把这少加的22点敏加到防上，这样在抵消了比灵力凯低的8点防之后还高出14点防。\n另一个就是医生戴不戴B3（或B2、B4之类同类物品，以下省略）的问题了。我和我朋友队长是比较喜欢以萨首饰（就是那个复活光）来代替B3给医生戴的。我先给大家分析一下萨首饰的作用吧（已经知道的可以跳过不看）。记得网站上曾把萨首饰除了复活光之外的作用归纳为----不被偷袭、100%逃跑等。事实上这里其实就是“运+5”在起作用。大家来回顾一下拿到萨首饰的过程吧：先找5次萨姆吉尔拿5个勾玉，再去找小女孩换成首饰，对吧。大家还记得那5个勾玉分别有什么作用吗？回避+5、运气+5、魅力+5、复活精灵、光的精灵......看出来了吗？其实萨首饰就是5个勾玉的功能的结合。因此萨首饰的真正作用是：复活光、回避+5、运气+5、魅力+5。\n我们把它配给医生，一是运气+5可以大大减低中精灵的概率（由于拿着+20防石化的石头，基本不会中石化，而偶然中了睡眠可以打醒、偶然中了混乱可以队友用净化兜解），几乎可以和B3的作用相等了（我队伍的医生在戴萨首饰之后仅仅极其偶然的吃过几次精灵）。而他的+5回避对面对敏过200的转龙回避并不高的医生来说简直是救命稻草。 最后还是再说一下，医生戴萨首饰不戴B3完全是我和朋友的个人经验，这里只是说出来给大家参考，大家完全可以按照自己的想法和习惯去做，不一定要迷信我的理论。永远记住一点：自己实践的结果才是最值得自己相信的。\n\n2.关于“反转的秘密”\n本来这是只有极少数人知道的、也是ME的压轴戏，不过在经验区的一个关于这个风波事件中，小捣蛋已经亲自去做了实验并且公布了~\n大家可以去经验区看小捣蛋的帖子，那里说的很明白、很详细了。我在这里再说一下吧。\n\n石器原本在设定的时候，应该是想表达出“一回合只能被反转一次”这种效果，但是因为程序算法上的BUG，导致了现在这种完全不同的效果。\n\n借用小捣蛋的例子来说明，一只红人龙（原始属性火10）\n正常回合：\n头上没反转标记→第一次反转→头上有反转标记→属性地10（正常）\n头上有反转标记→第二次反转→头上没反转标记→属性仍然为地10（就是说这次反转没有生效，属性没有改变，原因就是被反转前头上有标记，系统据此判定你这个回合已经被反转过了，所以反转不生效）\n头上没反转标记→第三次反转→头上有反转标记→属性为火10（注意，正好和表面看上去的想反，因为这次反转前头上没有\n反转标记，系统认为你又可以被转了，于是这次反转生效，从系统记录的地10变为火10）\n头上有反转标记→第四次反转→头上没反转标记→属性为火10（又再因为头上有反转标记而反转失败，属性没有改变）\n......\n\n大家仔细看，应该都能明白的。下面再说回合开始时头上有反转标记的情况。\n头上有反转标记→第一次反转→头上没反转标记→属性仍然为地10（反转失败）\n头上没反转标记→第二次反转→头上有反转标记→属性火10（成功把属性转回来）\n头上有反转标记→第三次反转→头上没反转标记→属性火10（反转失败）\n头上没反转标记→第四次反转→头上有反转标记→属性地10（反转成功）\n......\n\n\n还不明白的朋友请仔细体会，应该是可以看明白的。\n\nOK，下面来讲应用。\n\n大家应该都感觉到白虎队打红龙队时候的强大吧，白虎队一般双转放风，而不是放水，为什么呢？明白了上面的道理就应该知道了。正常回合，转1、2次大家都是被反转的属性；被反转回合，只转一次也还是被转过的属性。也就是说大家都锁定在被反转的属性上，白虎天生的属性优势，使得白虎吃到风马上飞掉红龙，而红龙吃到地最多只能抵消属性的劣势和白虎打成平手而已。因此白虎队打火宠队飞宠怎一个爽字了得...\n\n但是在明白了上面的道理之后，大家应该就能明白转机的所在-----就是在一回合之内连转两次。\n\n比方说红龙队打白虎队，在多数的回合宠防御，然后在某个对方头上有反转标记的回合连转对方两次（选择对方头上有标记的回合反扑是因为这种情况下转对方两次、对方要再转自己两次才能把属性转回来，就是一个回合要转4次，这种情况实在是很小的），宠全力反扑，运气好一下子就飞掉对方数只白虎...\n\n但是是不是这样就说明红龙队就不再为天生的属性劣势所困扰，可以和白虎队平起平坐了呢？回答是否定的。白虎队依然占有一定的优势。 因为白虎队只要在双方其中一方没被转的回合补一个转，就能压制住属性，但是红龙队必须在同一回合之内连转对方两次，这样这个回合的属性是压制住了，但是在下回合开始，对方依然是头上有反转标记的状态，也就是说下回合你如果想继续进攻的话还得连转对方两次！大家知道极光的耗气并不少，买的极光要-30，就是合成的也要-20，这样的耗气量是无法维持一直双反转的（一旦哪个回合其中一人不够气了反转失败又贸然进攻的话，就满盘皆输）。\n\n另外，大家应该明白，就是在头上有反转标记的回合，只转一次是转不回属性的，不如不转，放精灵或者干其它事情，别浪费行动力。等待机会双转反攻。\n\n而且，由于这个BUG的存在，使得双方在大多数的回合都是被转过的状态，因此大家放属性的时候应该把目标集中在自己被转过的状态，比如白虎队就是转自己风、红龙队就是转自己地，机暴就是转自己地或者水...等等\n\n3.关于队伍成员配置。\n大家认真看了上面的两点之后，应该对队伍成员的配置都会有一点新的认识。 首先，双反转是一定要的！而且因为其重要性，放反转的队员敏最好能比较高！因为如果被对方比自己敏高的人一个精灵砸下来，中了之后不能正常行动的话，结果相信我就不用多说了。 但是敏捷不能也没有必要太高，道理很简单，容易死。300-350差不多了（加装备后） 有条件的队伍可以让敏捷最高的人带个魔法、专门在对方有人只剩100左右血的时候抓住时机杀人，或者在己方有人/宠危险的时候即使高敏恩惠。 另一个敏比较高的则高敏复活，在同一个回合里让低敏的人恩惠。 顺便提一下，反转和属性加强是不能同时装备的。 两个反转、一个医生，一个属性手，都是必不可少的，还有一个位置,这个就要看各人的习惯和爱好了。我喜欢给自己的队伍配两个属性手，一个250敏放快风，一个220敏放慢风，增加抢到属性的几率。两个属性手敏捷一般一个比最快的宠稍快点，一个和转人龙的平均敏捷水平接近是比较理想的。但是即使两个属性手的敏捷层次不是那么严明，甚至敏捷完全一样，也无所谓的。因为大家都知道敏捷存在乱数，只要是多一个人放属性，就多一份抢属性的机会。值得一提的是，不论你的队伍是什么队伍，配一个敏和转龙敏捷接近的属性手都是有必要的。 打个比方，水怪合击队。水怪的敏比较低，因此主属性手的敏应该是比较低的，比如160敏，这样在属性加强之后不是有针对性的队伍是不会有能把你的属性覆盖的属性手的。但是210-220敏的属性手依然是必备的，因为对于大多数的队伍（人龙、机暴、年兽），属性手的敏捷都是这个水平，大家抢的是不同的属性的话对方必然会在这个敏捷放属性，如果我方在这里插一个属性打乱一下、覆盖一下，那在这段对方进攻时期的此消彼长的攻防可是很有用的。 语言可能组织得不是很好，希望大家能看明白。\n\n除了反转、医生、属性手之外，其它的人种都属于比较偏门的了（加镜子、守护、放精灵这些都是前面几种人可以兼职担当的）。低敏精灵手----效果是明显的，但是缺点和低敏医生是一样的。攻人------攻人基本是属于比较赌博的角色，因为实在是比较脆弱（忠犬不是万能的，你宠中了精灵你就知道了）。其它更偏门的就不说了。\n\n再提一点，就是可以让队伍出医生之外的其它人装备净化帽子（防具/兜），3种异常精灵各一个，再叫一个人在道具栏带净化做后备医生，这样即使医生有什么万一，队伍依然可以正常运作。\n\n另外，大家可以在道具栏带上一些后备装备、以应付瞬息万变的战况。比如说有时候某队员的宠被打死了，然后在复活前自己被转了属性，那么这条宠复活出来就和大家其它的宠属性不一致了，加不上属性的宠，既打不动人，又脆弱，完全发挥不了作用。如果在道具栏有单转，那什么都解决了，否则想要调整属性到统一的话，就只能找机会把宠换一次了，多被动！ 常见的带在道具栏的各种装备一般有：复活光、4属性、单转、净化....等\n\n4.点数的分配\n还是老话，点数分配是要看队伍用什么宠，打什么战术而定的。因此我一再强调大家尽早组好队伍再有的放矢的练人、练宠。大家千万不要当耳旁风，听过就算。\n我相信大家在认真看完我上面的内容之后，对什么队伍哪个职业的人点数应该怎么分配都已经有自己的见解了，我在这里就不罗嗦了。 不过我要提醒大家一点，就是-----------一定要加防！ 一个200敏100防200体力的人绝对比一个200敏300体力的人要耐打的多！因为属性加强之后的伤害是乘在伤害上的（具体公式我和队长最近一直在做实验，整理数据、研究，相信很快就会出来）！ 不信大家去观察一下属性全克的宠在加强了属性攻击对方的时候的伤害，全部都是偶数！所以加防、骑转虎对被加属的宠打中自己时的抗打能力可是有质的加强\n的！\n一般来说，属性手加80-120防，高敏加20-50防（别小看这几十点防，可能就决定了你是正好能抗两下不死还是两下正好死），低敏加100-200防，具体大家看情况而定，总之是先定敏捷，再定总血量，然后计算出大致能加多少防。\n\n说了那么多，感谢大家都坚持看完。\n这是我的经验、加上朋友的建议、一起实验的结论而总结归纳出来的。\n我是诚心希望对大家打造自己的极品PK强队有所帮助，而不是炫耀自己\n的经验或者是知识什么的，希望大家明白。\n希望对大家有所帮助。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 决斗详尽资料】", "PK猴子讲座"]
      content: "作者:BOX_【萧逸の颳】\n\nNO1。。\n\n从今天开始，为了练打字，我将开始发表我PK看法系列，供大家学习，探讨和研究！嘿嘿。。。\n\n今天我们先来说说现在的流行宠，精灵和魔法！\n主战宠物现在来看排在第一位的无可质疑的是机暴！然后是纯属性4围好的，特别是攻好的宠~主要有：青龙 白虎 融合的水加和风龙等等~而属性少差点的成长好的如金暴，狼等也是上选！\n\n技能宠暂时排在第一位的应该是3技能的融合宠了~带沉默闪避和落马，在过段时间带却战的融合宠，可能会根据PK的使用效果，而超过3技能的宠！因为技能宠是每个PK队必不可少的~所以应该是必用宠！其技能首推沉默。\n\n精灵现在已经是一个PK队在PK时控制场上局面的一个主要手段了！由于沉默技能的出现，属性已经被大家慢慢的放弃了~这也是为什么白虎青龙没落的体现！\n现在，由于绝大部分队伍用的都是NONO机暴，所以以睡眠和石化精灵用的最多，一来可以控制宠~让其不能进攻~2来还能控制人~\n\n特别是睡眠精灵！人中了后，既没有躲避又不能防御！但是，大家都是聪明人，所以很快就出现了带B2的现象，因为现在的属性用处不大了~反转和属性在一个队来说一样带一个已经足够了！\n\n因此现在出现了~混乱控制人~石化和睡眠则主要是控制宠！在后面的讲解中，我们将谈到敏和精灵！\n\n最后一个我们要说的是魔法，现在大家最喜欢的可能是风魔法了~然后是地的~火的很少人用，而水的已经消失了！其原因主要是风和地的打一排~而火和水的打的少~另一个原因就是因为人的属性和骑宠的属性的原因，现在骑宠4围综合来看最好的应该是金飞和红暴了~但是金飞的属性好~风10 ！风人和水人（反转后）骑金飞用魔法的效果最好！而地10属性的骑宠可能只有穿山甲了！防很好，但是敏却极差~不管什么人骑都很容易被落马，火的有红狗，但是转过来后成长和转穿山甲很象！没转的时候很好，转了却很差！极品狗极少，在加上火魔法只能打3个！水的就不说了~\n\n综合来看：风魔法应该最好用然后是地的~火和水的可以不考虑！  因为魔法也将使大家手里的珍惜宠物（白虎青龙）得到升值，魔法将使纯属性宠再次成为宠儿！由于NONO机暴不能很好的控制，所以再以后的T技能+精灵+魔法的战法上，机暴可能会退居到配角的角色上来！  （待续。。。）\n==================================================================\n\nNO2。。\n\n猴子PK讲座系列---NO2\n\n今天我们来说说人~~说起来人，是很麻烦的~游戏中一样~现实生活中也是一样！所以我们将分开讲~今天先来说说老人（已经140 的）和新人。。（练级中的）\n\n对于人的属性来说，我历来认为属性没有好坏，主要是看在某一个时间段流行战宠的属性和现在5.0的魔法下的属性配合！因为所有属性都是相生相克的，而没有那一种属性或者说55 开的属性就是最好！\n\n先来说说现在的新人，由于5.0一排全体魔法的出现，使纯属性的人再一次被大家所认可和重视~！由于现在人们常用的魔法是地和风魔法，而流行的战宠又是以机暴为主的火风属性宠，所以建议练风10火10 人物最好，地水属性的稍微差点~为什么，我在这里先简单的说说！具体的后面将会谈到！一个极品的PK队首先应该作到的是人宠属性的统一包括骑宠和魔法的统一，特别是现在5.0的石器，这将大大的提高人手的利用率和属性魔法的优势！对于未来一段时间即将流行战宠的分析我认为也是以火风的为主导地位，如青龙 金暴 风火狼 都是攻敏好的战宠，融合出来的攻敏好特别是带T技能的宠也以火属性的具多~骑宠现在最理想的末过于金飞和红暴了，属性好成长也不错，特别是金飞。水系列的宠物也是上佳的战宠，但是由于魔法和骑宠没有什么比较好的选择，所以比前面的2种属性的宠要差一点！但是水人骑金飞带水宠利用反转来配合魔法，也是上上之选，他的优势是现在的地属性类战宠还不成气候！而火宠居多，在少一次反转的情况下可以在精灵压制，来水杀！\n\n因此建议，现在练人最好的选择是火和风人，其次是地和水人！\n\n现在的老人，基本上都是开140 以后练的人，其属性一般以地水属性居多~在往后一点的是火风或者水火人居多！前者应该是白虎后遗症造成的，而后者则应该是NONO机暴造成的！根据现在的流行趋势，和自己的属性及点数，根据我自己的经验，建议水火人和风火人做高敏，而地水人则做医生或者低敏比较好！如果喜欢用魔法的朋友则可以通过属性道具来修改，但是一定要达到10，而骑宠也最好和魔法的属性一样，这样可以加强属性后魔法的威力！\n后面我们将谈到人的属性和精灵的关系，今天就先说到这里。。谢谢大家！  待续。。。。。\n\n===================================================================\nNO3。。。\n\n\n今天我们来谈谈在客观的条件下练就一个相对极品的人。\n\n人的属性在前面已经说了，主要是根据个人喜好和站队的需求。而点数对于一个石器发烧友来说低了585点可能连自己都看不过去，所以我们就按585点来分配，谈一谈怎么练一个相对极品的人。\n\n根据我的经验所有职业的人都必须经历以下这4种历练：\n1  回避，主要是通过PK练习踢馆来达到目的。\n2  精灵灵敏度，除了在PK中增强外，可以在单挂140的GP和猪来达到目的。既可以练习精灵又可以练宠，一举两得，特别是睡眠和石化精灵。如何设置，我想大家都知道，这里我就不多说了。给大家个建议，PK中用的精灵爪不要经常换来换去的，在选中一种精灵后就不要换了。\n3  魔法熟练度和抗性，怎么练我想大家也都知道，我也不多说了。\n4  精灵抗性，具我2年多来的PK经验来看，一个人吃精灵的多少除了和华裔设定的运气值外，人的属性也有很大的原因。比如，火属性人容易吃混乱，水人容易吃石化等。但是，也可以通过和练魔法抗性一样的手段来增加自己的精灵抗性。方法是：自己或者和朋友用PK的方式快速战斗互相放精灵。 总的来说除了平时的练习以外，建议大家多拿出时间来去PK和参加族战，不光能锻炼自己的ID，还能真正体验到石器的乐趣。 我认为现在石器几种职业ID点数的分配有以下几种方案：\n\n高敏有两种，1是加35点血，其他全敏。2是35点血，30到40点防，其他全敏。在未来融合宠，青龙，人狼，金暴等高攻敏的宠物横行年代，建议选择第2种分配方案。\n\n医生，建议不要用0敏，我认为40到60敏，血过1000，其他防比较好，加敏后可以提高回避率和被落马的几率。\n\n中敏，敏在260到280之间，50的血，其他的全防，即可以做属性手有可以做解沉默的护士。\n\n   好了，今天就说到这里。  待续......\n\n==================================================================\nNO4。。。\n\n今天我们来讲讲几种人在队伍里面的作用：\n1：医生，不用多说，大家也知道是干什么的，由于沉默的出现，精灵加强和防石化的石头以及B2 3等不能完全起到作用，所以现在的医生基本上有2 种选择，一是3防的~但是中石化的概率比较高，一是带石化睡眠的B2，带爪子~，容易中混乱。根据我的PK经验，发现一般做医生还是要3防的最好~因为在大多数回合里面，中精灵的次数要不3防的医生中的少！但是如何祢补中石化呢~一是自己人本身，在属性方面最好是火人~或者水火人！2 是由队伍中的护士来解！一会我们会谈到的！\n2：高敏，由于现在流行一种高敏精灵压制+沉默或者双沉默+NONO的战术，所以人们一直在想尽办法的去加高敏~有的甚至一点防都不加~，在这里我想说说怎么做一个高敏精灵手~首先要看属性~要是各5的属性，在加属性爪和属性B2后仍然不能是纯属性的~建议就放弃魔砝兜~直接带加敏的铜兜，如果你是全队的最高敏~可以在穿上加敏的铜凯，在带上心环。这样应该敏够高了~。在B2方面也要看属性~或者说你最喜欢中什么精灵，就带什么B2~但是一定要防睡眠！比如火人~最好带睡眠混乱的B2~水人最好带睡眠石化的~等等~在基本点上~个人认为~就是穿铜凯也要适当的加点防~因为现在的宠，已经不是单一的NONO~未来的主战宠的攻都不会很低的~！如果是纯属性的人~那么可以带上加敏的魔法兜！在关键的时候可以秒杀人或者宠！当然最好是能配合属性宠和属性！那样就更过瘾。。。。\n3：中敏，由于猴子的出现~沉默技能使每个队都要有一个敏比医生高而比对方沉默宠低的一个队员~我有的时候也喜欢叫他做护士，现在猴子用的少了~一般用的都是融合带沉默的~我见过敏最好的沉默宠到140敏可以到380（新浪2的）左右，敏最低的，在200 以下，所以中敏人应该在NONO2次不飞的基础上，根据实际情况和个人喜好来加敏~！同样，每个队的中敏人，也是很重要的~最好也带上B2~他不光是做属性手~还要做好解沉默和解医生的责任！\n4：负敏，在现今沉默的年代，我是不喜欢，虽然他可以做半个职业医生，我们先来说说他的好处！1：抗打，不容易死，2：敏低，别人都动完了~在精灵~特别是有的人的精灵爪好用！一中好几个！即使在中精灵后，医生医完了后仍然可以放精灵！3：兼职医生~可以和主医生带不一样的B2，在医生中精灵后，来解精灵！而他的坏处在于1：容易被落马 。2：没有回避。3由于现在沉默宠比较普遍，特别是喜欢带双沉默的队~低敏人就很难发挥起长处！\n总的来说，一个好队，首先是看配合和默契程度！在就是指挥能力的高低，当然还有运气！呵呵。。\n今天就先说到这里。。。待续。。。\n==================================================================\n\n猴子PK---NO5\n\n今天睡不着觉，继续我们的话题。。。\n\n我们今天来说说当今最流行的队伍之一，高敏精灵魔法队！\n\n由于现今的5转140 的人，在580点以上的，基本上都是在2.5到3.0开始练的，由于当时不知道5.0的全体魔法，在加上当时白虎队比较流行，所以一般都是选用水人，地水人或者地风人，而火人 风人和地人比较少，在加上当时的战宠比较单一，只有机暴和白虎。所以在选择人物的属性上，就没有5.0那么多。开5.0后由于华裔大量的出售其自己生产的宠物，在加上融合宠的出现和魔法的流行，在组建一个极品战队上就对人的属性要求的比较多，以后我们会慢慢讲到各种战队和属性，精灵，魔法以及战宠的配合的！\n\n今天我们先说说比较大众话的带NONO和沉默融合宠的战队：\n1：人员属性要求，至少有一名风10（骑金飞），或者火10（穿山甲）带风魔法兜或者地魔法兜！\n2：人员安排，第一高敏，由魔法手担任，点数安排，和我前面说的一样，35点血20-30 的防，其他敏，（个人认为加点防还是比较好的，不喜欢的，或者追求高敏极限的也可以来个全敏）装备为加敏魔法兜，心环，萨首饰或者B\n2（不建议带B3或者B4），加敏铜凯，精灵爪（由于现在大家都喜欢带B2，特别是高敏人，所以在自己认为自己没有最好用的精灵爪外，最好是用混乱或者石化）\n\n第2 3敏人，可以参考上面的点数分配，装备安排是铜兜或者魔法兜，一个带转B2，一个带镜B2，伶俐凯，爪子和上面一样，首选自己最好用的精灵！如果没有，建议一个带混睡一个石化。\n\n中敏人（属性最好是火或者火风人），250--280敏，250左右的防，其他的血。装备为：铜兜或者净化兜（根据队伍需要）带睡眠混乱B2，风或者地属性加强，伶俐凯，镜弓。\n\n医生：如果感觉自己吃混乱少，可以让中敏带净化混乱兜，而自己带防石化的B2和爪子，如果吃的多，那还是3 防的好！不过我认为医生还是3防的好！3防后毕竟中的概率要低不少！垃圾医生除外！\n\n后备：医生要是3防的，可以后备爪子和伶俐凯，其他的后备镜和复活，其中要多后备个转！以防万一！\n\n身上所带物品：现在华裔没有封不费气，所以3个高敏带4到5个复活，4到5个鱼片，2个青鱼子。中敏的带10个火锅1到2个鱼片，其他的青鱼子，医生全部带火锅！\n\n宠物安排：可以1沉默4NONO，也可以2沉默3NONO\n\n人物作用：最高敏：主要是精灵压制，在属性优势和对方宠血少或者刚刚复活的时候，用魔法杀宠，现在的人80%都练过魔法抗性，所以一般不提倡用魔法去杀人，只有在对方人物损血很多，只剩下极少血的时候，在用魔法杀！2  3高敏也是主要以精灵为主，带B2镜的，在对方中精灵和沉默多的时候注意保护人和宠！反转则是看机会，中敏的任务比较重，主要是镜和解沉默。\n战术思想：第一回合，中敏保护最高敏的，其他精灵压制，沉默，杀对方技能宠。（一般在第一回合，带闪避的沉默宠都不会去闪避，相对好杀！）其结果有2种，一是，对方敏相对没有我方高，相对吃精灵，第2回合可以根据实际情况，继续精灵压制，和保护人！然后在一个合适的机会来转对方，放属性！另外一种可能，对方敏比我方高，我方中精灵多~这个时候不要乱，首先中敏配合医生一起解沉默或者精灵，而带镜的高敏则开始保护。其他2个高敏，要一直精灵压制，给自己创造一个还手的机会！\n\n在往后说就要看战场的实际状况了，自己占了上风，就可以在多镜多保护的情况下，反转，属性加强，魔法杀宠！要是自己处在下风，也不用慌，多镜多保护人，有人在就好办！\n\n战场上的状况瞬息万变，一个好的队伍，不光要有一个好指挥，还要有好队员，指挥好，还要能配合好，有默契，才是一个真正的强队！今天说的这种队伍，是现在比较流行，也比较好组织的一种队伍，他其中占有40%运气成分在里面！也是现在比较实用的一种队伍！好了，今天就说到这里吧。。。\n待续。。。"
