      content: "原创：中国网通8→无名小卒\n\n刚刚看到一个人说他用水魔带4个属性道具20分钟就打全了8个石头，所以发个简单点的打凯方法，我126级敏244的人，带上一个风戒指魔法练到80%以上，我的战C是转水怪，虽然血多，但是也1400血左右的C也应该抗的住，1个号不停的发100气，开上快速战斗，首次调的高点，C防御我挑到了2.0秒，不是75级或85级的怪物，我就用魔法打，地精灵5个全打、水的精灵血多不好打、打2-3个安全点吧！火精灵打2个的吧，功太高打过5个的4回合把我水怪飞了，风的我用水怪攻击、人也上，22分钟出来的，我SB把凯送人了，后来转了以后，我就又打了1次，17分钟就打完了，并是是所有人的运气都是那么好的，就算你打的慢也是正常的，不能说90分钟就慢的，我朋友打了40分钟地石头才打出来，还是次次快速打的。所以只要运气好，说不定10分钟也能打出来吧。"
