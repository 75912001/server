      content: "必须条件：需先成人仪式，等级未知\n1.先到矿山(383 432)位于达那村右边\n2.然后到5F找帖尼姆(靠左)讲话\"答应他出赛\"\n3.再去找巴巴洛(靠右)讲话得到一张\"巴巴洛的采石证\"\n4.然后到3F跟4F之间打石头，得到原石\n5.挖到矿后到5F找巴巴洛，得到一张\"参赛证\"\n6.接着拿着参赛证跟5F中间的矿工比赛，得到\"采石权利书\"\n  [如果不是自己或宠物打死的将拿不到](如敌人自己撞死..^^)\n7.然后拿去给帖尼姆，他会给你一张上6F的入场卷\n8.然后跟守门人说话上到6F，下一次要上去需付一千元\n9.可捉到一级奥卡洛斯(36，36)跟一级奇卡宝斯(6，6)"
