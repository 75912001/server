      content: "【转自SK163】\n==================================================================\n★5.0家族召唤(非九大家族也可以召唤上伊甸大陆)Й\n1.必须拥有2个家族.\n2.2个家族族长到竞技场,一个下战书,一个接受挑战,即下战书成功.\n3.此时,任意方族长就可使用各大庄园里的家族召唤员,召唤本家族成员.\n\n召唤时间限制为:下战书成功以后钱前1小时以内,超过时间请重复2,3步骤.\n如:下战书成功时间为10:00,可召唤时间为9:00--10:00以内.\n==================================================================\n★PK不输DP方法\n说明：我碰到N回了，把方法说出来，只是让大家别像我一样生一肚子气。\n情况：和对方PK进行了N回合，快把对方打败，赢取对方的DP，对方跑了，而\n      你的DP显示 +0？\n具体方法：\n1.确定要原登，就在本回合做出动作(本回合人不能死，人防御，宠忠犬)\n2.此时会演放这回合动作，在演放这回合动作的时候，马上原登\n==================================================================\n★MX宠物1.6倍经验【MX6.00FREEB1上通过】\n以下要练1.6倍经验的宠物为机暴.\n1.【宠物栏】设置机暴为等待，MX外挂上勾选【锁定战宠】为机暴\n2.野外遇敌，在战斗中用【换骑宠】骑上机暴，然后逃跑\n3.结束战斗后【锁定骑宠】为机暴\n野外遇敌，不用快速，战斗看看机暴是不是又骑又练\n完成\n==================================================================\n★快速解改点酒任务\n  人物A和B,需LV 81以上,解完成人任务.\n1.人物A接讦谯龙任务,将任务完成至小象区打讦谯龙这步后,原登在小象区.\n2.人物B不用接任务,直接到达小象区后,人物A走动遇敌(讦谯龙)时按HELP,人\n  物B加入战斗并让人物B打死讦谯龙,得到(讦谯龙写的信).\n3.人物B回加加水井地下洞窑,和董庄对话,交出(讦谯龙写的信),拿到收据.\n4.人物B返回小象区自己走动遇敌,抓讦谯龙.\n5.人物A走动遇敌(讦谯龙)后按HELP,人物B加入战斗并打死讦谯龙,得到(讦谯\n  龙写的信)\n6.人物B返回加加水井地下洞窑,和董庄对话拿酒(会交出身上的讦谯龙)\n7.人物B再次和董庄对话，交出2W石币换到收据(身上因为有讦谯龙写的信).\n8.人物B重复4,5,6,7,即可跑小象区1次就能快速得到改点酒.\n==================================================================\n★讦谯龙任务速解（如NPC庄董左上方31.43有NPC酒仙，此方法就不成立）\n（已封）\n一.寄宠物邮件方法(适合MX XP)\n1.任务做到拿到人宠【讦谯龙】\n2.到加加NPC霍奇斯（94 61）说话拿【手电筒】\n3.从水井（99 62）进入水井地下通道\n4.到NPC庄董（30 49）前,先用外挂中的【宠物邮件】把【讦谯龙】寄出\n5.寄出后和庄董说话,按8次【下一页】，到选择【确定】【取消】时停住\n6.当屏幕显示【拾回邮件宠物 讦谯龙】时,按下确定，拿到改点酒.\n7.重复4－6步骤.\n\n二.用项链或宠圈方法(适合MX)\n1.任务做到拿到人宠【讦谯龙】\n2.到加加NPC霍奇斯（94 61）说话拿【手电筒】\n3.从水井（99 62）进入水井地下通道\n4.到NPC庄董（30 49）前,用项链或宠圈把【讦谯龙】带出来\n5.和庄董说话,按8次【下一页】，到选择【确定】【取消】时停住\n6.用MX的【快速拣身边的宠物和物品】功能，拣起【讦谯龙】,按下确定，拿\n  到改点酒\n7.重复4－6步骤\n==================================================================\n★MX会员版“不限等”能进入的地方（2003/5/15）\n1.PK道场4大村\n2.猜迷3兄弟的家12楼的小孩\n3.萨村的黑乌力\n4.聊天室/长毛象客厅/带路人阿满\n5.伊甸园的地下通道/不良少年\n6.卡坛梦特洞的守门人\n7.拯救布洛多多的水蓝暴\n8.5兄弟的黄人龙\n9.流璃洞守门人\n10.玄黄洞的守门人\n11.深红洞的守门人\n12.碧清洞的守门人\n13.SBC/3楼的带路人\n14.JBA/3楼带路人\n15.水苍守门人\n16.漆黑守门人\n17.太坦部队守门人\n18.米兰达部队守门人\n19.爱丽尔部队守门人\n\n\n==================================================================\n★没做4大过漆黑14楼守门人:\n（没做4大任务是不能转生的，此方法只是适合去打钻石）\n在(31 42)用2步瞬移到(29 42)-(29 35)-(30 35)\n==================================================================\n★解决人物卡在石器上的方法\n（有时登陆石器，登不上去，并且总是显示：线路繁忙中，请稍后再试.\n  此时确信人物卡在石器上了）\n（一）方法：去华义论坛客服服务部写上：服务器，帐号（不写密码）\n（二）方法：重复登陆被卡帐号所在的服务器N次\n（三）方法：\n1.A人物卡在石器上\n2.B人物有A人物的名片\n3.登陆A人物卡的服务器，对A人物发送宠物邮件\nOK，A人物自动T下\n==================================================================\n★原地转生\n做完4大洞窟，打完机暴，和精灵王说话到最后的【OK】别按，直接走开\n==================================================================\n★6.0交易BUG\n条件:A人物和B人物双方道具栏为满\n交易时：A人物放上石币和道具【换】B人物的宠物和气瓶\n        （加气瓶是为了接受A人物的道具）\n交易结束：A人物石币和道具还在，A人物多了B人物的宠物.\n          B人物宠物没有了，转移到了A人物身上.\n==================================================================\n★6.0洗声望BUG\nA.B族长到竞技场,A族长下战书,B族长接受挑战,下战书成功后.B族长让位.\nA族增加声望B族没有减\n双方族长洗声望，在洗的过程中换族长\n\n洗声望的BUG， 必须是族长才行.\n1.身上带着守护兽.\n2.去自己的庄园.\n3.找另一个族长向你下挑战书.\n4.然后在战斗的时候，你不要去.\n5.家族总声望就下降了.\n6.在另一个族长离开的同时你进去，你的声望就回来了.\n7.然后再大那个族长一顿.你的声望就多了.\n==================================================================\n★偷点BUG（未验证）\n大家都知道，当你开着你的ID在游戏的时候，你再开一个外挂，用同一个石\n器帐号登入游戏，则你原先那个窗口会说“因帐号重复登入而中断”。大家\n是否又试过，即使用了同一个帐号，只要在2个不同的网通，是可以同时在线\n的，而且此时该帐号的点数并不会双倍扣除当你想挂机的那个号快没点的时\n候，先登出你所在的网通，去别的网通建一个新人，建完新人别登出（该帐\n号以每小时6点的速度在耗点），再重新打开一个外挂，仍然用你这个帐号登\n入你玩的那个网通，此时你已经是同一个帐号双开了。\n但华裔扣点仍然是1小时6点，并没有双倍扣，亦是说此时你在玩的这个网通\n已经在偷点了，好，等你点数扣到0的时候，你先前在新网通开的新人会掉线\n，而在老网通的你仍在挂机不会掉，你就安心挂到维护吧。\n==================================================================\n■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■\n■■■■中间的内容载自鹤龄论坛HTTP://WWW.OK163.COM/ ■■■■■■■\n■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■\n\n==================================================================\n练魔法与魔法抗性 制作者：QOOFK\n\n以前大家都是在阿布打NPC练，因为那里买气便宜又方便，现在呢？还是在那\n里，不过不是打NPC，是打自己哦！\n步骤：1、买满阿布水\n      2、在外挂战斗设置中一般动作设置魔法，补血30%，血多的15%就可以\n         了。对象选自己！\n      3、打开快速战斗，开打！\nPS：这种方法即可以练魔法抗性又可以练魔法熟练度，虽然教费气可是也差\n不了多少。也不用N次的点NPC开打。注意：在没气的时候点自动逃跑哦！\n==================================================================\n战斗中更改聊天方式 制作者：QOOFK\n\n有些人PK时遇到对方卡人要打个“快”给对方，因为之前设置了队聊而无法\n催促他们。大家可别忘记了快捷键哦！在战斗中按CTRL+P OR Q（晕！一时忘\n了是P还是Q了，试过的人发短信给我说是P还是Q）就会跳出选择的菜单哦，\n再改一下就好了。如果要改回去重复这个步骤就行。\n==================================================================\n单P很BT的单人NPC方法 制作者：EDISON67890\n\n现在大家都在做宠物罐头的任务吧！可是有些人说很难过。但是并非如此。\n以下是我的方法。（适用与不会N段的NPC）\n准备：灵力凯这里和有4个鱼村外的小猪猪（最可爱的奶猪呵呵这种猪有忠犬\n）一个镜（说到这里大家都明白了吧)\n注意：自己不要骑，因为使自己防低敏高点，只带灵力凯或-防的装备或+敏\n的。\n以贝克为例实战：给猪加镜然后猪忠犬，如果你敏不够BK（贝克）敏高他会\nK飞你的猪。然后镜子就会+到你身上，然后下回合放猪。再回到1的步骤。（\n听说BK有N段，可是我没见过，我只拿过2次，有1个狂暴不错了！~呵呵呵！\n）\n==================================================================\n如何提高怯战成功机会 制作者：EDISON67890\n\n大家都经常用镜子，会不会忘记了光呢？已经懂了吗？帮敌人加光，虽然帮\n他加血，但是一定打中而且有很大可能走。原理和你给自己加镜子，别人宠\n物用石化攻击有时反而自己中了石化的一样。关于这点我QOOFK做个补充，用\n光还不如用守护，还可以有2次机会，又不会帮别人补血。第一次没逃第二次\n还有机会，光的话第一次没逃又要加一次。\n==================================================================\n关于机暴证 制作者：QOOFK\n\n大家都知道5转的人可以骑机，找机暴是必不可少的，况且又难找。告诉大家\n水庄和多多村比较多哦！还有就是拿到的机暴证是不可以交易和丢在地上的\n哦！还有就是登出也会没掉哦！我试过的。所以不必去找证来卖了，是白费\n功夫……\n==================================================================\n原地转生的方法 制作者：火柴天堂\n\n此方法用于急于速转拿机暴的玩家，打过机暴后，先和精灵王说话，会出现\n对话框，第一个是问你是否开始转生仪式。然后打开外挂的“人宠档案”，\n仔细看着人物的等级和升级点数。点石器里那个对话框的OK，之后又出现一\n个对话框，只有“下一页”的选项，先看你人物等级变成1极没有，红利点有\n没有，以及看石器里面的“交出XX守护兽，拿到XXXX”出现没有，没有就点\n下一页。直到等级，红利，转生宠物都到手后，点到石器窗口（建议用鼠标\n右键点），点键盘上的ESC键，取消窗口，就原地转生了。再走会14楼记录点\n记录。原地转生有红利，但得到声望会减半\n==================================================================\n无须通行证进入英雄岛部队 制作者：QOOFK\n\n以前如果要进米兰达和爱丽儿队做任务都要去泰坦那里拿通行证，不仅麻烦\n而且费点。现在只要点击外挂上『穿墙行走』再从围栏穿过，就会传送到部\n队那块地图的边缘，再从围栏穿过去，就进入部队了。 目前只知道米兰达和\n爱丽儿队可以这样进入，其他的大家可以试试。有MX会员外挂的直接不限等\n与守门人对话就行\nPS：但是不可以为了省麻烦不做岳石而直接做涛石哦~没做岳石的与队长说话\n是不可以接任务的！\n==================================================================\n黑虎任务黑白天无限制 制作者：QOOFK\n\n任务限制是要 晚上才可以进去跟女孩说话，现在有一个BUG哦！白天进去时\n，发现黑虎在那里，但是人物是可以与黑虎重叠的哦，也就是说要进入与人\n形的女孩说话，要走到黑虎所在的坐标才能传送。现在可以与黑虎重叠，这\n样就不必等到晚上黑虎消失才可以走到那个坐标了。那白天就直接与黑虎对\n话，进入与粉人龙说话！\n==================================================================\n用鼠标与NPC买卖 制作者：火柴天堂\n\n在3.0以后与NPC说话不在需要用键盘，用鼠标左键点NPC就会自动说HI，方便\n是方便，但日复一日也会厌倦（天啊，3.0到6.0 啊）。修改也非常方便，先\n进入石器，点“系统”→“聊天设定”→“记录文字”，里面有从F1到F8的\n选项，在F8，就是最下面那个输入买，或者BUY与再点买卖的NPC就可以直接\n出现买东西的窗口，非常方便，同理输入卖,或者SELL，就可以一键卖出。\n==================================================================\nLV1吃高级加经验道具的方法 制作者：『韩天阳』\n\n【MX外挂版】\n·直接点击MX外挂战斗设置里面的自动吃果子。豆子即可！方便快捷！\n\n==================================================================\n签出被卡人物方法 制作者：QOOFK\n\n在炻器中经常遇到人物被卡的现象，遇到这种情况大家通常会找GM帮忙，而\n得到的答复都是要等维护才可以掉下来。这样既费时又费点。以下教大家一\n个方法，这样不必一直问。\n首先要有一个帐号上的人物与被卡人物换过名片\n1、B人物登入被卡A人物的服务器\n2、检查A人物是否还在线。\n   注意有以下这种情况：在石器程序中，A人物状态显示OFFLINE，而外挂上\n   显示在线。这就要以外挂为准，确认A人物在线\n3、用B人物发宠物邮件给A人物，等到宠物回来说“无法发送邮件”这样A人\n   物就被T下来了\n4、检查外挂上A人物是否还在线，这种方法一般会成功\n\n==================================================================\n★买胡椒2和胡椒3的三种地方 作者：BOX_天空战记001\n1.英雄岛-避难洞窟\n2.米兰达-爱丽儿基地\n3.火城的24小时店\n==================================================================\n★千里寻猪任务BUG\n可以使用[变身服或变身镜]变身后，混入小猪森林.\n==================================================================\n★\n1.伊甸园动物园，选择除了长毛象之外的任何动物栏，二步顺移进去.\n2.在任何一个动物的身后，等它停下在它后面加入团队，此时你就会变身成\n  那只动物的模样，并缴纳10W石币，带着你咋围栏种绕一不圈，最后会解散\n  团队\n==================================================================\n★快速喂蛋是华义的BUG:\n原理:利用服务器时间差.\n如有月球,地球两个星系.\n我们先在记录点记录一下,看一下服务器开机的时间.\n如\n月球已开机2天2小时50分\n地球已开机4天8小时12分\n那在月球拿蛋从宠店拿出来后,登出,再登入地球就可立即喂蛋.\n如些循环,喂40次左右.就可破蛋...\n\n总之快速喂蛋无论时间差多小时,都会降低融合宠的能力..\n【万宇贴心提示】：部分服务器已经封了！\n==================================================================\n★英雄岛米兰达部队BUG\n1、在进入部队后的狭小的通道，靠上边的武器走，走到（31，16），会直接\n   把你传送到队长房间\n2、而小队长房间（拿迪欧的房间）（4，13），有两个出口，从原来的坐标\n   可以进去，不过出来之后就不要进去的那里了，左边出来是（9，19）右\n   边出来是（14，19）\n==================================================================\n★无限拿金飞（具体请参照北岛 卡坦的愿望 任务）\n1.北岛找卡坦接任务，卡坦会要你去捉4只25级的鱼\n2.捉来后回去和卡坦说话，她会给你修宝.此时，不要再跟卡坦说话\n3.去捉4只25级的鸡，捉来后回去和卡坦说话，可拿到金飞\n4.重复第3步就可无限拿金飞\n==================================================================\n★洗DP的好方法(5倍)\n[原创]洗DP的好方法(5倍)...不知道有没有人想到呢?不要扔东西哦~!\nA.开5个1级人,组队(用快速战斗)\nB.再开一个有100W DP的高级人(不开快速)\n然后AB对打``B防御一回合之后,逃跑``\n这样A中每一个人都会得到B的DP的1/20\n如此重复````B的DP 快给拿光的时候````\nA中每一个人已经有100W DP啦~\n就这样啦~~!```最后把A中每个人的DP传给B就OK```这样有有500W啦~~\n谢谢指教```如果这个方法本来就有``````就当我孤陋寡闻吧...\n不过千万不要把鸡蛋吖`什么的来扔我吖~!\n=================================================================="
