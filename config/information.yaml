    - path: ["『Stone Walker 使用教程』", "功能展示"]
      content: "经过服务器认证后，就会进入Stone Walker的主界面。\n\n在系统默认的情况下，Stone Walker会显示在地图方式，加速10，取消偷袭的。\n现在，你要点击激活石器来启动石器时代。在石器界面输入石器本身的账\n号密码略过不谈。\n\n现在外挂上一共8个资料功能框。点击出现对应功能。我详细讲解一下！\n8个功能框分别是：\n地图坐标：\n地图>>点击后显示各村口.商店.洞口坐标。下面的那个框里都是地图坐标，东 南 分别代表坐标值参数。删除和\n新增是用来添加和删除坐标的。\n说话>>可以直接点击下面框内的文字，会直接出现在游戏窗口内其中下方又\n可以输入文字，\n更改文字颜色的窗口，也可以直接输入石头数目点击放置石头，把钱丢出\n来。\n脚本>>可以直接点击运行下面的脚本运行，里面有很多的内容，详细的请大家自己看吧。\n  运行>>开始运行脚本。\n  暂停>>暂停脚本，还可以继续开始。\n  停止>>停止脚本，不可园地继续。\n  延迟>>用来调节脚本和封包的发送速度。\n  自动料理>>自动料理生鱼片。\n----------------------------------------------------------------------\n自动登陆：\n激活石器>>点此启动石器时代。\n自动登陆>>自动登陆到你选择好的服务器内。\n缩短等待>>缩短登陆等待时间。\n掉线重登>>设置好要登陆的“主机”“服务器”“人物”后石器掉线自动登陆。\n屏蔽声音>>你可以在启动石器时代时选择是否关闭石器音乐。\n-------------------------------------------------------------------------\n人宠资料：\n直接显示人物，战宠以及骑宠的详细资料，一目了然。\n-----------------------------------------------------------------------\n道具显示：\n显示身上的装备以及道具栏里的道具。\n---------------------------------------------------------------------\n一般设定：\n加速>>选择一个适当的速度进行游戏。\n锁时间>>锁定在石器里的时间，对某些特别任务有效。\n随机遇敌>>石器本身默认的遇敌方式，不在固定地点出现敌人\n快速遇敌>>在极短的时间内遭遇敌人。\n自走遇敌>>自动在前后2格的距离内来回走动遇敌。\n自动回信>>在好友给您发邮件的时候，根据事先设置好的回信。\n来信显示>>将好友给你的邮件的内容直接在游戏画面上显示。\n穿墙走路>>穿过面前的墙壁，古人称之为“穿墙术”。呵呵\n--------------------------------------------------------------------\n战斗设定：\n自动战斗>>使用外挂自动战斗，不再需要你自己点击。\n取消偷袭>>取消战斗时被敌偷袭，不让敌先出手的情况发生。\n快速战斗>>利用封包快速战斗，不会出现战斗画面。超快。\n详细资料>>在游戏画面里直接显示敌人的等级.血量等资料。\n自动抓宠>>自动捕捉宠物，需要事先设定好。\n偷袭防御>>被敌人偷袭时自动使用防御技能。\n自动逃跑>>选择后遇到敌人自动逃跑。\n锁定宠物>>锁定要攻击的宠物。\n指定攻击>>指定优先攻击的敌人。\n指定逃跑>>遇不到指定的敌人自动逃跑。\n换站宠>>战斗中换出另外的战宠。\n换骑宠>>更新另外的骑宠(战斗中被下马技能打中可以在骑上哦)。\n原地锁定>>锁定原地，点击石器画面不能走动。\n显示经验>>显示战斗胜利所得经验。\n不限等>>不限等级进出一些需要满足条件才能进入的地方。\n锁战宠>>锁定战斗宠。\n锁骑宠>>锁定骑乘的宠物。\n------------------------------------------------------------------\n游戏状态：\n组队>>外挂控制是否组队。\n决斗>>外挂控制是否决斗。\n交易>>外挂控制是否交易。\n名片>>外挂控制是否交换名片。\n存>>外挂设置存档。\n声>>点击后在石器画面上显示自己的声望点数。\n资料显示>>点击会跳出资料显示分栏目。\n战斗设置>>点击会跳出战斗设置分栏目。\n情报显示>>点击会跳出情报显示分栏目。\n脚本制作>>点击会跳出脚本制作分栏目。\n----------------------------------------------------------------------\n合成设定：\n用外挂进行合成物品。"
    - path: ["『Stone Walker 使用教程』", "资料显示"]
      content: "人宠资料>>显示人物和宠物的各项资料，宠物的位置从左到右对应宠物栏1-5\n的位置。\n\n道具显示>>显示身上装备的道具和在道具栏里的道具。\n\n战斗队伍>>显示在战斗状态下，双方的队伍情况。\n\n组队队员>>显示组队队员的资料，以及宠物的3围计算，保存，还有右方的二\n步瞬移的按钮。\n\n聊天专页>>自动刷屏功能，屏蔽自己以外说话（不显示自己以外说话）屏蔽\n本队外说话（不显示本队以外人员说话）七彩说话以及清除屏幕文字。\n\n邮件显示>>显示名片上的在线人员名单，和发送过来的邮件，以及回复或发\n送邮件。\n\n寄气专页>>封包送水送气以及智慧果，自动购买智慧果以及阿布水并且还可\n以自动拿起身边的道具以及宠物。\n\n说明>>STW的部分指令说明和软件声明"
    - path: ["『Stone Walker 使用教程』", "战斗设置"]
      content: "人物设置>>人物首次动作和一般动作[可以选择攻击 防御 施放精灵和魔法精\n灵，选择对象也可以详细设定，包括对敌数量，等级。\n贫血设定>>在战斗的时候选择身上装备的贫血精灵补血，选择对象包括队友\n和敌人，可设定血量剩余的\n百分比来确定及时补血。其中还包括了用物品补血和对骑宠和战宠的满血升\n级的独立设置。\n自动复活设定>>在战斗时，设定好的对象如果死了，外挂就会自动给你用设\n定好的复活精灵或物品复活。\n其它设定>>自动补气，可以设定在你的气剩余到达设定好的百分比的时候，\n自动补气。\n延迟攻击，选择在快速战斗的时候使用多少时间延迟，一般配合最少时间使\n用。\n在一般情况下使用快速战斗的延迟配置是 加速 10，延迟 0，最少时间 12，\n但是由于个人网络环境不同，可能需要自己略微调试。\n\n宠物设置>>宠物动作设定，决定你在自动战斗的时候，你的宠物使用的技能。\n合成设定>>设定有合成技能的宠物，合成技能所在位置，最后输入合成位置\n[合成位置对应的使用方法是，道具栏从左向右1-15，对应的数字是5-19，中\n间用 \"|\"隔开。最后在主界面点那个合,就合成好了\n\n个界面左边的是捕捉宠物的相关设置，包括等级，名字，1级时的血，\n还有就是自动捕捉的时候人物和宠物的动作。最下方的是可以使用精灵来毒\n宠物，一般对等级低的玩家比较有效，那样把宠物的血毒到相应的程度，便\n于捕捉。\n右边的是关于捕捉到你认为不满意的，可以设定好3围，会自动丢弃。\n下面的那个大框就是丢弃宠物的历史纪录。[注意]这里有点要注意，可能您\n身上有其他一级宠物，\n但是3围要求不同，容易被丢弃，请事先存在宠物店或者直接改宠物的名字，\n就不会发生那样的情况了。\n\n自动登出设置>>勾选上面的内容，设定达到条件后断开网络或者自动关机。\n自动停止战斗>>勾选上面的内容，设定达到条件后自动停止战斗。\n其它>>这里主要设置在平时的补血，以及一些其它的指令，丢弃或者吃掉一些\n道具。\n\n话说设定>>左边的jota1之类的就是简称，用于在游戏里直接输入这几个字就\n能调出后面对应的语句，\n如：输入 jota1 就会在游戏里出现 加美 两个字，其他的类推。底下还有可\n以玩家自己输入来添加，\n修改或者删除便捷语句的窗口和按钮。\n自动回信设定>>对应主界面上的自动回信使用，这里主要是设定。可以添加，\n修改。\n删除事先确定的自动回信的内容，最后点选内容，点设为默认。"
