      content: "[7.5任务]宠物二转\n\n接任务条件（完成天空岛任务）\n\n1、 到没落洞窟中可以遇见考古学者(41，6)，这时候身上必须带着玛蕾菲雅喜欢的花 或者雪蒟花（这花可以至飞龙洞二楼取得）。\n\n2、到达那村找沃夫伊（25，31），他会要求给你带回来解除麻痹的药，此药需要到乌鲁力村的医院接受任务后才可以获得。\n\n获得方式如下：\n　　在乌鲁力村的医院，有一个小孩被麻痹蜘蛛咬伤，小孩的父亲会请你拿解药，再到多多村找捉逃走呼拔拔的名人，他会问你多多村最有价值的东西是什么?，回答他\"果实鸡尾酒\"，他会给你一个琴，装备琴到坐标(666,650)之后在岸边绕，会碰到逃走的呼拔拔打败后可得到逃走呼拔拔的骨头，收集十个回到乌鲁力村的医院请药剂师做成解药。\n\n3、带回来之后沃夫伊会给你一张他画的地图，有了这张之后就可以找到水晶洞窟入口，但是还必须先去深红找女神伊拉得到火的守护,才有办法进入严酷的火山裂缝（深红洞窟8层坐标38，38）。\n\n获得方式如下：\n　　至巴那姆洞窟(388，338)找\"巴拿姆湖的看守人\"取壶说密语：授与追求火的人从此地涌出的水的润泽，取得水壶，再至（394，340）加入\"巴拿姆湖的带路人\"并说\"go\"，就会带领你到老人，那此时也需说一句密语\"很多\"，如此就可以取得7/7水壶，然后就往深红出发路上会出现\"口渴的多洛加\"此时须与之对话，每讲一次就会减少1/7水量，要对话到水量变成1/7就可以去找伊拉完成任务。\n\n附送1-79级玛蕾菲雅看风景的新地点：\nLV10：南岛加加村\nLV15：南岛奇喀喀村\nLV20：北岛柯尔克村\nLV25：现代波拉岛金飞机场（要到金飞机场內）\nLV30：南岛卡鲁它那村\nLV35：南岛拉多拉回廊\nLV40：南岛乌鲁力村\nLV45：南岛碧青洞窟（进入后地下1楼即可）\nLV50：南岛森林洞窟顶楼\nLV55：沙姆岛奇努伊村\nLV60：吉鲁岛采石场\nLV65：吉鲁岛飞龙洞（由花花世界前往之无名洞窟地下1楼）\nLV70：吉鲁岛沒落的矿坑\nLV75：奇努伊海洞关卡（封印迷宫水池前）"
