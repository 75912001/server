      content: "猜测1：转自己，转对面，很传统的打法，2个属性手压风，建议白虎拍骑雷或穿山甲前的机暴，属性手很重要，第一个要在白虎动前风来，第2个要等对面地或火后压风，如果能把对面医生的机暴拍飞的话，下个回合用精灵牵制好打多了，2个转手的任务就是要把对面机暴属性压制为地，自己为风\n失败点：对面给机暴加镜子，造成第2回合开始时白虎残缺情况，或者就是机暴队转我方2次，最后的风又被地所覆盖，造成虎破人飞的情况\n猜测2：就转自己放风，预测到对面会转自己压地，关键还是看第2个风有没有压住地，压住的话还是杀医生的机暴，第2回合时参照猜测1\n失败点：对面不转自己，就放火，相信很多白虎队都比较头疼这点，自己放风和对面放火都加强机暴\n猜测3：傻瓜做法，除了医生，都镜子自己，白虎防，让他们全控制属性，有点赌的味道，运气好时第2回合对面机暴起码飞2只，然后第2回合在开始进攻\n失败点：怕被对面精灵，一旦被弄睡了就惨了，没来得及加镜子就被机暴。。。。。\n以上只是我总结的3点战术而已，时间太晚，刚才又带MM 4开原始人PK，所以思路可能有些乱，能看懂就好，呵呵~~ 下次继续写：白虎队VS机豹队，水怪队和红鸡队"
