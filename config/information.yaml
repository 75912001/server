      content: "【5.0任务】『海贼王的秘宝任务』\n\n条件：\n★做完飞龙航空任务\n准备道具：\n●不可思议的贝壳\n●合成防具8(皮7,线7)\n●合成爪8(牙8,壳8)\n●合成服8(皮8,线8)\n●100级的砂鲨(风城凯村海滩有得抓)\n\n去水城的民房(46.100)里找一位叫\"特雷金\"的老人(7.4)接任务,他会告诉你他们的船长文狄的事!叫你去水龙洞窟看看!\n\n接着出水城,来到水城区的(354.110)进入水龙洞窟!\n\n走到(9.104)跟骷髅龙说话交出那三样道具得到\"调和的勾玉\"\n\n然后走到(11.4)进入水龙洞窟之一,来到(35.33)会看到一个海贼王!\n\n跟他战斗!他会补血,MP攻击,放一种\"滴汗\"的精灵及十段攻击!但只有一个人!很容易就能打得过!\n\n打完后跟他说话他会给你个力量的勾玉,然后回到水龙洞窟,走到(21.3)进入水龙洞窟之二!\n\n来到(25.34)跟幽灵使者说话交出砂鲨拿到自然的勾玉!\n\n再出来回到水龙洞窟来到(28.28)再跟幽灵使者对话,他收走你三块勾玉后让你进水龙洞窟之三!\n\n来到(22.82)这里有三个骷髅宝箱选一个打!(我选中间那箱)海贼王120级,手下100级!2个骷髅2个幽灵\n\n打赢跟海贼王对话得到：\n海贼王的左手:攻+41 (X5) 治愈的精灵lv5!不过可惜费气30\n蓝宝石1颗\n石币20W!\nPS：这个地方遇到的宠物只有三种:贝洛格,比比加和蓝龟!\n\n注意：华义这里有个BUG，在打海贼王的时候很容易卡死，导致不能正常战斗"
