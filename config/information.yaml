      content: "★闭关修炼三大职业技能★(大陆版)作者：BOX_天空战记001\n==================================================================\n【法师技能】\n\n说明:法师需要练满的技能只有:\n\n嗜血成性,移形换位,嗜血蛊(抓宠用),冰箭术,冰镜术,火星球和雷附体(雷附体不练也可以,但必须学)\n\n下面是最佳的练技路线!\n\n1.先练辅助技能\n\n学嗜血成性(10%)----→练嗜血成性(70%)----→学移形换位(10%)----→练移形换位(91%)----→学嗜血蛊(10%)----→练嗜血蛊(91%)[加起来够270%就可以了]\n\n原理:这样三种熟练度加起来有270%的话,再学1种技能后就可以马上再学另外1种!所以可以马上学2种技能!用处下面将会说明.\n\n2.再练冰系魔法\n\n学冰附体(10%)----→学冰箭术(10%)----→练冰附体(70%)----→学冰熟练度(10%)----→练冰箭术(70%)----→学冰镜术(10%)----→练冰镜术(70%)----→继续练冰箭术(100%)----→继续练冰镜术(100%)\n\n原理:这样冰箭术,冰镜术和冰熟练度都能同步提高!冰附体练到70%就可以,不常用!\n\n3.再练火系魔法\n\n学火附体(10%)----→学火山泉(10%)----→练火附体(70%)----→学火熟练度(10%)----→练火山泉(70%)----→学火星球(10%)----→练火星球(100%)\n\n原理:这样火星球就能发挥最大威力!火山泉和火附体练到70%就可以了!反正也不用!\n\n4.再练雷附体.召雷术和暴风雨留着最后练,不练也可以!\n\n原理:雷附体有用!召雷术和暴风雨都没什么用\n\n\n\n【白狼技能】\n\n说明:白狼的技能最好全练满!要想全练满,必须全学满!\n\n下面是最佳的练技路线\n\n1.第一阶段:\n\n学回避(10%)----→练回避(70%)----→学盾击(10%)----→练盾击(80%)----→学连环攻击(10%)----→练连环攻击(80%)----→学专注战斗(10%)----→练专注战斗(80%)----→学斧(枪)熟练度(10%)----→学二刀流(10%)\n\n原理:这样白狼终于学到具有象征意义的二刀流了!可以拿2把武器了!\n\n2.第二阶段:\n\n练斧(枪)熟练度(职业升级)----→学舍己为友(10%)----→练舍己为友(70%)----→学暴击(10%)----→练暴击(70%)----→学能量聚集(10%)----→练能量聚集(70%)----→学双重攻击(10%)----→练双重攻击(70%)----→学濒死攻击(10%)----→练濒死攻击(70%)----→学激化攻击(10%)----→练激化攻击(70%)----→学状态回复(10%)\n\n原理:这样白狼就除了另外2种武器熟练度之外全学到了!顺序是按技能的费气从少到多学的!费气最多的技能是激化攻击(20),超难练!\n\n3.第三阶段:\n\n到了第三阶段就可以分2步走了:\n\n第一步:修炼费气的技能,把费气的技能都练到95%以上!顺便学最后的2种武器熟练度.\n第二步:挂斧(枪)熟练度,发挥白狼的最大攻击力!顺便学最后的2种武器熟练度.\n\n4.第四阶段:\n\n开双号挂状态回复技能!\n练满最后的2种武器熟练度\n\n原理:即使这样,最快没有3个星期你也挂不满哦!"
