      content: "※  融  合  蛋  与  喂  养  蛋  ※\n\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n融合蛋：\n\n融合蛋——决定宠物蛋的属性、外型、技能、基本能力值\n融合地点\n卡鲁它那村 (66.74)\n玛丽娜斯渔村 (84.87)\n伊甸园 (79.120)\n融合蛋的技能决定着成品宠的技能。\n参与融合宠的宠最多三只，最少两只。\n一般来说主体是决定属性，客体1遗传，客体2修正成长。\n不原名的宠融合后的宠可原名。\n当融合成为蛋时是只有两技的，你需要注销后再登入才出现其它的技能。\n\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n喂养蛋：\n\n喂宠物蛋\n融合为蛋时，如你没药喂蛋，需要立刻放在宠店，有药喂蛋时才放在身上\n喂蛋的时间是以在身上来算的，只要放在身上，无论是否在线都算时间，\n如你想省点卡的话，请在每次喂蛋后注销，等快到一小时才登入再喂，不\n想喂蛋时一定要放在宠店，否则超时不喂会变坏。 超时不喂时间是累计的\n，大家要注意。\n融合后产生一宠物蛋，需喂养营养剂才能使其孵化，蛋的喂养有时间限制\n，不到一小时无法喂食。\n每一小时可喂养一次，喂养四十次左右后蛋会孵化。\n蛋的饲养，有设定孵化时间，（例如40小时为限，以宠物蛋在玩家身上时\n间计算），在孵化期间，玩家可用药剂喂养，有次数限制，例如最多40次\n为限。\n每两小时未喂养（除非寄放在宠物店不算时间，否则只要宠物蛋在身上，\n不论有无下线，都有计算时间喔），则扣掉之前所喂养之营养剂一颗，并\n随机扣五种等级营养剂所增加的成长率，且每次均扣四种属性。\n蛋喂养的等级跟其本身等级无关，且蛋战斗所提升的等级对成长率没有加\n成的功用，蛋只可练至六十级 注意定时喂蛋，因我也试过维修没及时喂\n蛋，融合出的宠粉差了。 因一次喂一个蛋和喂五个蛋费的时间是一样的，\n所以建议一次喂5个蛋。"
