      content: "注1:此任务原为双头狼任务,既完成任务后得到双头狼,但是由于华裔提早把双头狼搬上了商业化的舞台,所以导致整个任务变更,今年的中秋节大家一定要抓紧时间做,所以再没开任务之间大家要跟我做此任务提前预备\n注2:由于华裔只是删除和隐藏了部分交换物品的NPC,导致任务无法进行,但是没有完全禁止此任务,下面我就为大家将一下吧!\n注3:打出的材料不能交易、不能叠加、掉地消失、不能邮件\n\n1,去梦幻洞窟,到达红和黄蛙那里(44 44附近),往上面走便来到这里,遇敌打\"卡比特\",有机会掉落\"苦涩的调味粉\"\n\n2.然后下楼,走到在28 61,打\"特洛昆\"有机会得到\"辛辣的大蒜\"靠墙打最多\n\n3.去鱼村24店买材料料理:米2、豆子2、 砂糖,有机会合出\"大福\"\n\n任务现在的NPC还没有开（开放时间请继续往下看）\n我先把详细功略说一下\n1.把上面的材料交给奇努伊肉店的\"圆煮\"(此NPC尚未开放,随每个服务器下周维护陆续开放)\n然后会叫出20000S(石币),得到2种月饼,第一种为:超级甜的月饼(全体体力回复1000)\n第二种为:神奇的月饼(使用后传送至幻境之月),此为真正的月饼,不能交易、掉地消失、邮件\n双击神奇的月饼,会来到华裔最美丽的月球,还可以看到我们现在的地球哦!\n\n2.过桥去37 46进入洞穴\n在洞穴1楼打克克尔\"掉黝黑的石头\"(lv90 血1150以上 每次出现会1-5只)\n\n在洞穴1楼打魔兽掉\"柔韧的绳子\"(lv90 血900-950以上 每次出现会1-5只)\n\n在洞穴2楼打火狼,打\"七逃狼\"掉\"中秋宠的骨\"头(lv90 血1150以上 每次出现会1-5只)\n\n打齐了三种物品出洞去28 25,与嫦娥的好朋友说话得到斧,所有物品原登也不会消失\n再去跟无干 10 22(原藏人物)说话取到破掉的碗\n拿到破掉的碗之后去29 52和玉兔同类说话,取得完整的水碗,去32 38桥头那 处有一个水缸\n跟缸说话拿到装满的水\n\n注:原版任务到这里再去跟无干对话会得到\"很钝的斧+9x攻.lv5睡精(带着这个斧头去梦幻洞窟就可以去抓双头狼,2种颜色都可以抓)\"但是大陆华裔更改任务,直接去(10 ,22)说话便可随机拿到以下的5种今年的中秋节宠物,具体得到详细情况请查看\"http://www.wayi.com.cn/act/zq/index.asp\"\n\n大家看懂了吗?今年的中秋节好丰盛吧?哇哈哈,抓紧时间完成吧!\n\n\n图文版功略请到“http://tcjsw2005.qq.topzj.com/”查看\n\n任务完全开放时间与结束时间:\n2005年9月12曰维护后 至 2005年9月26曰维护\n中国网通1 中国网通2 中国网通3 中国网通4\n中国网通5 中国网通6 中国网通7 中国网通8\n中国网通9 中国网通10\n\n2005年9月13曰维护后 至 2005年9月27曰维护\n上海网通1 上海网通2 上海网通3 上海网通4\n上海网通5 上海网通6 上海网通7 上海网通8\n上海热线1 上海热线2\n2005年9月14曰维护后 至 2005年9月28曰维护\n广州网通1 广州网通2 广州网通3 广州网通4\n广州网通5 广州网通6 中国网通11 中国网通12\n中华网\n\n2005年9月15曰维护后 至 2005年9月29曰维护\n武汉网通1 武汉网通2 杭州网通1 杭州网通2\n\n2005年9月16曰维护后 至 2005年9月30曰维护\n重庆热线1 重庆热线2 精灵召唤1 精灵召唤2\n首都在线1 首都在线2 北方网通1\n"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "合成经验『全新』", "合成投掷斧18级精灵的合成方法"]
      content: "〓合成投掷斧18级精灵的合成方法〓 小黑版呦~~~~\n\n\n〓最低声望要求〓\n个人声望：6000以上，家族综合声望：25W以上\n\n〓本人声望与家族声望〓\n个人声望：2W以上，家族综合声望：110多W以上\n\n〓家族守护兽〓----转凯比\n转与不转都没什么关系，我感觉转凯比 比较好用！不怎么烧钱！！\n\n〓投掷斧18级〓--合成方法\n\n〓第一步〓\n\n去火庄园买N个投掷斧14，然后准备合成工作！\n\n合成方法：4个投掷斧14合有机会出枪16与斧16\n\n\n〓第二步〓\n\n根据这个合成方法：4个投掷斧14合有机会出枪16与斧16，合出若干个枪16与斧16备用！大量需要的！！\n\n\n〓第三步〓\n\n合成方法：枪16/斧16+6个投掷斧14合出投掷斧18级\n\n\n〓第四步〓\n\n需要大量的投掷斧18级，合多点备用！！\n\n空的投掷斧18级最高有89攻的！！\n\n\n〓石16精灵的合成方法〓（属于上精灵部分了）\n\n我个人认为使投掷斧18级带上精灵用石16精灵是最好不过了！不容易吃掉投掷斧18级！这个方法比较安全！！具体做法如下：\n\n首先，去火庄园买石14，然后2个石14对合，有机会出石15与石16，如果出的是石15的话，石15+石14就有机会出石16了！！\n\n\n〓空的石16〓\n\n根据上面的方法：合大量的石16备用！这个步骤不可缺少！！\n\n\n〓空的石16上精灵部分〓\n\n具体方法：空的石16+4个B3（我一般喜欢用睡，石B3的）\n\n\n〓石16精灵〓\n\n用B3上精灵比较方便点！但是也比较费钱点！大家要有心理准备！\n合大量的石16精灵准备备用！上精灵用的！！！\n\n\n〓投掷斧18级〓--合成方法\n\n具体方法：石16+投掷斧18级出投掷斧18级精灵\n\n\n\n〓副产品的处理〓\n\n刚刚合石16的过程会产生大量的凯14/15/16等等装备！\n\n凯14/15/16+8个出水草出凯14/15/16的智愈精灵凯！\n\n出了智愈精灵凯的话就加3个花11转滋！如果要转恩惠就加3个水晶11（这个太难了）\n\n这个就是处理副产品的方法了！！"
