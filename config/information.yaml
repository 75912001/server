      content: " ┌───────────────────────────────-┐\n │ 6.0新任务--偷吃粮食的老鼠                                     │\n │ 任务地点：南岛加加村（５７０．３７７）                        │\n │ 适合等级：50级以上                                            │\n │ 限制条件：身上需有不可思议的贝壳                              │\n │                                                               │\n │ 一  请先在加加村内到座标(63.102)找\"帕尔多\"接取任务。          │\n │                                                               │\n │ 二  他会告诉玩家村内最近出现一只大老鼠把粮食都吃光了，但是他  │\n │ 又很怕老鼠，所以要玩家帮他抓鼠，玩家答应後他会给你\"大福\"(老鼠 │\n │ 爱吃的大福) 。                                                │\n │ 三  接着在村内找寻\"偷吃的老鼠\"(吉比)座标(118,92),(88,77),     │\n │ (78,120) ，跟吉比说话後会交出\"老鼠爱吃的大福\" ，换拿到\"老鼠爱 │\n │ 吃的大福\"(已经被咬一半的大福) 。                              │\n │ 四  再一次交出\"大福\"然後会拿到\"老鼠的牙\" ，然後前往村长家遇敌 │\n │ 会看到LV50的吉比。                                            │\n │ 五  打死吉比拿到\"老鼠的骨\"接着回去找\"帕尔多\" ，将\"老鼠的骨\"及 │\n │ \"老鼠的牙\"交给他 ，村民为了表答谢意..会送你珍珠手环 。        │\n │                                                               │\n │ 任务奖品：                                                    │\n │                                                               │\n │ 珍珠手环[红]（攻＋１５防＋１５敏－１５魅＋６）                │\n │ 珍珠手环[绿]（攻＋１５防－１５敏＋１５魅＋６）                │\n │ 珍珠手环[蓝]（攻－１５防＋１５敏＋１５魅＋６）                │\n │                                                               │\n └───────────────────────────────-┘"
