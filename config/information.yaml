      content: "\n\n【城市简介】\n弗烈顿火城建筑于一座火山附近，是跟精灵关系最密切的一族。人民相信火精灵具有强大的威力，为他在火山上设立了祭坛，还为火精灵设立了永不熄灭的圣火。火城人民崇尚力量的风潮，使火城的武器业特别发达，建筑物多以壮观、大、坚固为特色。皮肤偏红，善于捕猎，穿著猎物的兽皮，也会把猎物的爪子拿来做装饰，穿在身上。\n\n存点肉：瑞德宝（可在弗烈顿城区打到）\n\n2.建筑物\n■弗烈顿城城主家：弗烈顿城主赫肯豪的住处。\n■弗烈顿火城肉店：这里只能卖肉。\n■弗烈顿火城宠物店：\n\n贩卖物\t功能\t价钱\n连续攻击\t两次连续攻击\t2399S\n三段攻击\t3回合连续攻击\t5999S\n忠犬\t保护主人不受到敌人的直接攻击\t2999S\n地球一周\t一回合从敌人背后以两倍攻击力攻击\t2399S\n加工\t合成素材制作道具\t1799S\n料理\t使用素材制作料理\t1199S\n\n■弗烈顿火城旅馆：旅馆贩卖很多特殊的食品，还有记录员。\n\n贩卖物\t功能\t价钱\n炖蔬菜高汤\t气70回复（1体）\t110S\n超级辣的炖肉跟蔬菜\t耐390回复（1体）\t300S\n煮了很久的蔬菜\t气20耐久力185回复（1人）\t230S\n盐味兽肉串烧\t酒醉状态回复\t80S\n热腾腾的饭团\t耐久力180回复（1体）\t140S\n特制5倍厚肉片\t耐240回复（全体）\t240S\n三色串\t催眠三回合前后\t100S\n特选纳豆\t耐325回复（1体）\t195S\n\n■弗烈顿火城医院：可以买到各种医疗品，还有美容师可以增加魅力\n\n贩卖物\t功能\t价钱\n耐久力回复药\t耐久力100前后回复\t25S\n耐久力回复药\t耐久力200前后回复\t50S\n耐久力回复药\t耐久力300前后回复\t75S\n耐久力回复药\t耐久力400前后回复\t100S\n耐久力回复药\t耐久力500前后回复\t125S\n耐久力回复药\t耐久力600前后回复\t150S\n气力回复药\t气力20前后回复\t80S\n气力回复药\t气力40前后回复\t160S\n气力回复药\t气力60前后回复\t240S\n气力回复药\t气力80前后回复\t320S\n复活药(100)\t气绝回复成耐力100\t100S\n复活药(300)\t气绝回复成耐力300\t300S\n乌西摩尼叶\t解毒的热带性植物\t30S\n伊西娃丽索叶\t解除石化的潮湿地带植物\t25S\n摩浦叶\t解除混乱的平原植物\t20S\n西伦恩根\t解除酒醉的干燥地带植物\t20S\n韭恩叶\t解除睡眠的海边植物\t30S\n\n■弗烈顿火城武器店：\n\n武器店：\n贩卖物\t功能\t价钱\n弗烈顿的枪1\t攻+45 防-9 魅+5\t38400S\n弗烈顿的枪2\t攻+50 防-10 魅+5\t60000S\n弗烈顿的枪3\t攻+55 防-11 魅+6\t78000S\n弗烈顿的爪1\t攻+27（×3）\t35200S\n弗烈顿的爪2\t攻+30（×3）\t55000S\n弗烈顿的爪3\t攻+33（×4）\t71500S\n弗烈顿的投掷石1\t攻+27 防-5\t35200S\n弗烈顿的投掷石2\t攻+30 防-5\t55000S\n弗烈顿的投掷石3\t攻+33 防-6\t71500S\n\n防具店：\n贩卖物\t功能\t价钱\n弗烈顿的兜1\t防+18 敏-4\t32000S\n弗烈顿的兜2\t防+20 敏-4\t50000S\n弗烈顿的兜3\t防+22 敏-5\t65000S\n弗烈顿的兜4\t防+24 敏-5\t80000S\n弗烈顿的兜5\t防+26 敏-6\t95000S\n弗烈顿的兜6\t防+28 敏-6\t110000S\n弗烈顿的手环1\t攻+8 防-2 敏-2 魅+4\t41000S\n弗烈顿的手环2\t攻+10 敏+5\t51000S\n弗烈顿的手环3\t攻+12 防+12 敏-12 魅+6\t61000S\n\n■弗烈顿火城便利店：\n\n弗烈顿火城合成店1：\n贩卖物\t功能\t价钱\n火药草\t火的成分1\t1S\n火之粉草\t火的成分2\t7S\n火花草\t火的成分3\t28S\n灯火草\t火的成分4\t81S\n火炎草\t火的成分5\t175S\n燃火草\t火的成分6\t258S\n红莲草\t火的成分7\t455S\n烈火草\t火的成分8\t700S\n双子草\t混乱的成分1\t26S\n忘记草\t混乱的成分2\t105S\n迷惑草\t混乱的成分3\t236S\n回神草\t混乱的成分4\t420S\n吹雾草\t混乱的成分5\t788S\n不知草\t混乱的成分6\t1260S\n不归草\t混乱