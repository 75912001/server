      content: "＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n必须条件：需成人礼\n\n1.首先到东方的小屋(226，989)和拉鲁说话，拿到(拉鲁的项链)\n\n2.再到奇喀喀村外找到伊布，得到(鸦哈弩的日记)\n\n3.伊布出现地点不一定，都在村子周围跟白色屋子附近\n\n4.中间经过九楼以及十四楼ㄉ大地手护兽(皆可顺移)\n\n5.上到琉璃顶楼找女神说话\n\n6.得到(大地的羁绊 攻-4 防+5 魅+3 [地] 为征服大地的证明)\n----------------------------------------------------------"
