      content: "－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n必须条件：解过成人礼\n\n(前半段身上不可有黄人龙会无法接任务)\n1.走到玄黄洞窟内上到顶楼跟守护者说话叫你拿风的竖琴\n2.然后走到玄黄洞窟外(342,355)打败盗贼与老人说话\n3.去梦德洞窟(440,127)到最下层打败守护者与长老说话\n4.跟梦德长老讲话拿到风的竖琴\n5.回到玄黄洞窟内交回给守护者得到风的锁[风]，得到风的证明\n\n－＝－＝－＝－＝－＝－＝－＝－＝－＝－＝－＝－＝－＝－＝－＝\n(非必要)\n6.拿宝物部份，再跟他说一次话叫你拿布鲁顿跟风的手环交回\n7.可得到宝物，(布鲁顿可在吉鲁岛捉到风的手环在玄黄6F可拿到)\n※－※－※－※－※－※－※－※－※－※－※－※－※－※－※－"
