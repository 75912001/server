      content: "条件：\n1、解完金飞任务\n2、解完黑虎任务\n3、解完不可思议的贝\n4、解完小猪任务\n\n一、在风城来到（86，137）和守卫说话，进入亚欧伊王宫，来到（26，10）\n和布得耳斯说话，拿到找王子的委托书。\n二、通过天才传送师传到水城，来到（76，29）和布列克说话拿到一封信。\n三、再通过天才传送师传到地城，来到地城西南区（28，12）进入地城旅馆，\n来到（23，14）和比吉斯说话，交出信，再拿到一封信\n三、再通过天才传送师传到火城，来到武器店，进入和裘恩斯（16，15）说\n话，交出信，再拿到一封信。\n四、选择走回伊甸或飞回伊甸，到了伊甸，来到（122，136）进入伊甸道场，\n来到（7，3）和福列克斯讲话（原来他就是王子），说完开战，建议镜死王\n子，打赢王子后会自动传到风城王宫，再和王子福列克斯说话，拿到亚伊欧\n之凯（增加魔法抗性的凯甲 防+54 敏-18 恩惠精灵lv3 气扣30）\n\n◇特别感谢作者：微笑赢家◇"
