      content: "\n··········黑虎任务--需LV 101，完成金飞任务\n\n\n1，在火城从（13，71）出火城进入弗烈顿城区。沿著右面墙，往东南方走\n，经过弯弯曲曲的走廊，来到（260，389）进入伊甸大陆东方。\n沿著河边，一直走到（280，338）进入蒙达村。在蒙达村，走到（53，44）\n进入村长家，来到（16，13）和伯恩说话接任务。\n2，离开蒙达村，进入伊甸大陆东方，来到（83，365）进入蒙达村地下通道\n。在蒙达村地下通道来到（55,14)进入蒙达村海底通道。\n在蒙达山，来到（37，74）进入蒙达山山洞通道。在石器白天时进蒙达山山\n洞通道，没黑虎挡路，进入蒙达山洞窑，来到（16，15）和葳娜（没变身是\n小女孩）说话，拿到葳娜的缎带，葳娜请你晚上再来一次.在石器晚上进蒙\n达山山洞通道，有黑虎挡路和它说话，进入蒙达山洞窑，来到（16，15）和\n葳娜（变身为粉红人龙）说话，交出葳娜的缎带，然后走回头。\n3，在蒙达山，来到（85，37）进入伊塔工作室。在伊塔工作室，来到（22，\n2）和萨登说话，确定后开战，强烈建议玩家第一回合人防\n宠防，萨登太强了，第二回合萨登会把玩家传到卡罗的精神结界。\n4，在卡罗的精神结界，来到（15，17）和卡罗说话，拿到精神结晶，然后走\n过卡罗身边的红门，进入十二年前的蒙达村。在十二年前的蒙达村，来到（3\n9，47）和葳娜说话，传到试炼洞窑第一层。在试炼洞窑第一层（39，44）再\n和葳娜说话，她要求你找收集四段咒语片段。双击精神结晶，回到蒙达山（8\n5，37），再进入伊塔工作室。5，在伊塔工作室，来到（22，2）和萨登说话\n，确定后开战，向萨登使用象石头的神圣驱魔咒语，传到一房间，赶快和卡罗\n说话，拿到lv1黑虎萨格鲁一只，任务完成。\n\n注意事项：\n\n   1、拿到精神结晶后，绝对不能登出石器，一旦登出，精神结晶就会消失。\n   2、拿到神圣驱魔咒语，绝对不能登出石器，一旦登出，神圣驱魔咒语就会\n消失，一切都要重做。\n◇特别感谢作者：微笑赢家、雨季◇"
