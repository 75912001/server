      content: "作者：BOX_GOSOKO\n==================================================================\n合成手环9分为3种：\n绿色，防环；攻-15？防+60？敏-15？魅+9？\n红色，攻环；攻+60？防-15？敏-15？魅+9？\n蓝色，敏环；攻-15？防-15？敏+60？魅+9？\n以上为基本数值，具体佩带效果视个体质量±\n\n声望要求合成ID必须为族长ID\n基本；家族总声望35000，个人声望3000\n推荐：家族总声望50000↑个人声望5000↑\n合成手环9属于14-15级道具，声望要求并不太高\n\n合成宠物无特定\n推荐：凯比系,布克布克系。排名不分先后\n\n石币要求合成手环9，石器最烧钱的合成物品\n最低要求：5000000S\n推荐配置：无上限\n\n合成过程\n1。亚伊欧风城的武器店（14/16）处购买亚伊欧的手环3（59000S）N件\n2。伊欧的手环3×4（3）叠加（3个OR4个叠加，丰俭由人，影响成功率），合出+30合成手环7备用（外观上分别为苹果绿，金黄，漆黑）\n3。+30合成手环7×伊欧的手环3×8对合，有一定几率跳级出合成手环9，种类随机（目前没有资料证明+30合成手环7对合成手环9属性的影响）\n\n副产品的处理合成手环9过程中会产生大量的凯服11-14 ；石11-14；回旋标11-14；+22合成手环7\n一般处理方法：继续叠加若干伊欧的手环3，有一定几率合出+22合成手环7\n+22合成手环7×伊欧的手环3×4（3）叠加，有较大几率合出+30合成手环7\n特殊处理方法；凯/石/标加B3×4水城道具店有售.....极大几率出12-14级精灵武器，为高级爪类合成打基础（题外话）"
