      content: "                        合成斧头\n\n 　  名称    │               材料\n ──────┼───────────────────────\n 合成斧头１  │1.木1+石头1\n ──────┼───────────────────────\n 合成斧头２　│1.木2+石头2\n ──────┼───────────────────────\n 合成斧头３　│1.木3+石头3\n ──────┼───────────────────────\n 合成斧头４　│1.木4+石头4\n ──────┼───────────────────────\n 合成斧头５　│1.木5+石头5\n ──────┼───────────────────────\n 合成斧头６　│1.木6+石头6\n ──────┼───────────────────────\n 合成斧头７　│1.木7+石头7\n ──────┼───────────────────────\n 合成斧头８　│1.水果+合成斧头7\n ──────┼───────────────────────\n 合成斧头９  │1.水果+合成斧头8\n ──────┼───────────────────────\n 合成斧头１０│1.水果+合成斧头9\n ──────┴───────────────────────\n[斧头]\n\n合成斧1 = 石 1+ 骨 1\n合成斧4 = 红玉手环 + 木3 (攻+26、防-9、敏-9)\n合成斧4~5 = 矿石 + 良质的木\n合成斧5 = 枪4 + 贝4 (攻+32、防-11、敏-11)\n合成斧6 = 斧5 + 牙5 (攻+37 敏-12、敏-12)\n合成斧6 = 合成棍7 + 特洛金LV3斧头 (攻+35、敏-12、敏-12、昏睡精灵LV3)\n合成斧6 = 合成弓1 + 折断的斧\n合成斧6 = 哈恩的斧头 + 皮的戒指\n合成斧6 = 哈恩的斧头 + 木 3\n合成斧7 = 断斧 + 轻的枪\n合成斧7 = 哈恩的斧头 + 补气力的药(+20)\n合成斧8 = 强的枪 + 风(3)\n合成斧8 = 亚姆亚姆的斧头 + 强的枪\n合成斧8 = 木8 + 石8\n合成斧9 = 骨8 + 石8 / 花8 + 加加的斧 / 花8 + 斧8 / 石9 + 木9\n合成斧10 = 石10 + 木10 / 花8 + 合成斧9 / 加加的斧 + 加加的斧\n合成斧11 = 花8 + 斧10 / 骨11 + 石11/ 斧10 X 2\n合成斧12 = 石11 + 木11 / 石11 + 骨11 / 斧11 X 2\n贝壳斧8 = 贝8 + 木8\n贝壳斧9 = 贝9 + 木9\n贝壳斧9 = 花8 + 贝壳斧8\n贝壳斧10 = 花8 + 贝壳斧9\n贝壳斧10 = 贝10 + 木10\n贝壳斧12 = 贝11 + 木11\n贝壳斧12 = 贝11 + 骨11\n精灵斧9 = 花8 + 贝壳斧8 + 草8\n精灵斧10 = 花8 + 精灵斧9\n精灵斧10 = 草8 + 精灵斧9\n大地斧10 = 合成斧10 + 地成分8\n水神斧10 = 合成斧10 + 水成分8\n火炎斧10 = 合成斧10 + 火成分8\n疾风斧10 = 合成斧10 + 风成分8\n[投掷斧]\n\n合成投掷斧1 = 石+丝、木+石\n合成投掷斧2 = 比罗沙弓 + 普通普通的斧\n合成投掷斧8 = 木8 + 石8\n合成投掷斧9 = 木9 + 石9 / 花8 + 投掷斧8\n合成投掷斧9 = 合成投掷斧8 + 丝8\n合成投掷斧9 = 马祖的斧+亚姆亚姆的斧\n合成投掷斧10 = 特洛金LV4投掷斧头 + 合成枪7 (有单体睡眠5回合)\n合成投掷斧10 = 合成投掷斧10 + 补血药200 (有全体睡眠5回合)\n合成投掷斧10 = 木10 + 石10 / 花8 + 投掷斧9\n合成投掷斧11 = 木10 + 石10 / 木11 + 石11 / 投斧10 X 2\n合成投掷斧12 = 斧12 + 棒12 / 木11 + 石11 / 投斧11 X 2 / 投斧10+投斧11\n精灵投掷斧9 = 花8 + 投掷斧8 + 草8\n精灵投掷斧10 = 花8 + 精灵投掷斧9\n精灵投掷斧10 = 精灵投掷斧9 + 草8\n精灵头掷斧12 = 斧13 + 精灵斧10\n大地投掷斧10 = 精灵投掷斧9 + 地成分8\n水神投掷斧10 = 精灵投掷斧9 + 水成分8\n火炎投掷斧10 = 精灵投掷斧9 + 火成分8\n疾风投掷斧10 = 精灵投掷斧9 + 风成分8"
