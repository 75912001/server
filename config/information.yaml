      content: "◎关于如何强化：利用蒙那工具包再配合强化技能就有机会将金属装备（也就是珊瑚装备）升级，如果失败了会损耗耐久度，只要在耐久度恢复到100%就可以再强化。\n◎关于精炼的好处：当然不用多说，用途如其名，就是对金属装备更加强化，笔者我正在收集资料，一系列装备强化后的数值马上就要出来咯！\n◎蒙娜工具包合成方法：骨8以上+木8以上+石8以上+皮8以上+恒冰结晶（可在沉睡洞窟、流冰回廊、无息之境打出来）\n◎PS：强化后的金属装备所增加数值（感谢IBOX论坛yuhuashi提供）\n\n褐那之斧1 攻+120 防+45 伤+150 敏-40\n褐那之枪1 攻+100 防+45 伤+130 敏-20   魅+30\n褐那之棍1 攻+80 防+45 伤+110\n褐那之兜1 防+85 敏-8 伤-70\n褐那之铠1 防+125 敏-20 伤-110\n褐那之斧2 攻+120 防+45 伤+150 敏-40\n褐那之枪2 攻+100 防+45 伤+130 敏-20   魅+30\n褐那之棍2 攻+80 防+45 伤+110\n褐那之兜2 防+85 敏-8 伤-70\n褐那之铠2 防+125 敏-20 伤-110\n褐那之斧3 攻+120 防+45 伤+150 敏-40\n褐那之枪3 攻+100 防+45 伤+130 敏-20   魅+30\n褐那之棍3 攻+80 防+45 伤+110\n褐那之兜3 防+85 敏-8 伤-70\n褐那之铠3 防+125 敏-20 伤-110\n\n碧华之斧1 攻+120 伤+150 敏-40 HP+135\n碧华之枪1 攻+100 伤+130 敏-20 魅+30   HP+135\n碧华之棍1 攻+80 伤+110 HP+135\n碧华之兜1 防+40 敏-8 伤-70 HP+135\n碧华之铠1 防+80 敏-20 伤-110 HP+135\n碧华之斧2 攻+120 伤+150 敏-40 HP+135\n碧华之枪2 攻+100 伤+130 敏-20 魅+30   HP+135\n碧华之棍2 攻+80 伤+110 HP+135\n碧华之兜2 防+40 敏-8 伤-70 HP+135\n碧华之铠2 防+80 敏-20 伤-110 HP+135\n碧华之斧3 攻+120 伤+150 敏-40 HP+135\n碧华之枪3 攻+100 伤+130 敏-20 魅+30   HP+135\n碧华之棍3 攻+80 伤+110 HP+135\n碧华之兜3 防+40 敏-8 伤-70 HP+135\n碧华之铠3 防+80 敏-20 伤-110 HP+135\n\n洛炎之斧1 攻+165 伤+150 敏-40\n洛炎之枪1 攻+145 伤+130 敏-20 魅+30\n洛炎之棍1 攻+125 伤+110\n洛炎之兜1 攻+45 防+40 敏-8 伤-70\n洛炎之铠1 攻+45 防+80 敏-20 伤-110\n洛炎之斧2 攻+165 伤+150 敏-40\n洛炎之枪2 攻+145 伤+130 敏-20 魅+30\n洛炎之棍2 攻+125 伤+110\n洛炎之兜2 攻+45 防+40 敏-8 伤-70\n洛炎之铠2 攻+45 防+80 敏-20 伤-110\n洛炎之斧3 攻+165 伤+150 敏-40\n洛炎之枪3 攻+145 伤+130 敏-20 魅+30\n洛炎之棍3 攻+125 伤+110\n洛炎之兜3 攻+45 防+40 敏-8 伤-70\n洛炎之铠3洛 攻+45 防+80 敏-20 伤-110\n\n温特之斧1 攻+120 伤+150 敏+5\n温特之枪1 攻+100 伤+130 敏+25 魅+30\n温特之棍1 攻+80 伤+110 敏+45\n温特之兜1 防+40 敏+37 伤-70\n温特之铠1 防+80 敏+25 伤-110\n温特之斧2 攻+120 伤+150 敏+5\n温特之枪2 攻+100 伤+130 敏+25 魅+30\n温特之棍2 攻+80 伤+110 敏+45\n温特之兜2 防+40 敏+37 伤-70\n温特之铠2 防+80 敏+25 伤-110\n温特之斧3 攻+120 伤+150 敏+5\n温特之枪3 攻+100 伤+130 敏+25 魅+30\n温特之棍3 攻+80 伤+110 敏+45\n温特之兜3 防+40 敏+37 伤-70\n温特之铠3 防+80 敏+25 伤-110"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]精炼、强化、合成、凿孔", "合成"]
      content: "由最老的石器发展到现在的老技能项目，循例还是解释一下：\n◎关于合成需要注意的项目：合成要注意的是符合材料与等级、宠物对于材料的专长，如果要制作等级11以上的道具，就必须配合你本身的鉴定能力来提高合成成功率，另外偷偷告诉你,只要使用等级14以上的冰晶石制作合成装备，能力可比拟我们全新研制的金属套装哦！\n◎关于怎样合成：对于合成，你的概念不会一直停留在只要拿一堆东西再用合成技能就能合出道具把？！其实合成有个诀窍，就是要那堆的材料跟对的宠物，不然你只是在浪费你的钱而已。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]精炼、强化、合成、凿孔", "凿孔"]
      content: "◎关于什么是凿孔：凿孔就是增加宝石可以镶嵌的数量，但这技术只能运用在全新的金属装备，之前的珊瑚金属套状可无法凿孔的，因为没有那承受力，只要使用就会粉碎。另外，每一种新的金属装备只能在原有的三孔上再加上两个孔而已。\n◎关于怎样凿孔：要利用凿孔技能配合道具宝石夹就能有几率的将金属装备额外增加宝石孔，当凿孔失败后就会降低耐久度，但只要将耐久度回复到100%就可以继续进行，宝石夹可以利用等级11以上的恒冰结晶与木、骨、石、皮、线合成出来。\n\n注释：以上所说到的全新金属装备应该是强化技能后得出的装备！"
