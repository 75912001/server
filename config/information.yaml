      content: "首先\n牙11 & 皮11 是必备的 打多一点起来存着吧\n再来\n\n大家都知道要加精要加爪10精吧\n其实不用\n爪9精也可以\n接下来有两种选择\n\n一种看你是要花大钱去合爪9精还是自己打素材合\n花钱的方法是\n到24H 买牙8+壳8来合 合到爪7~爪9\n若不是爪9 就一直用属性草或是气瓶升级\n等升级到爪9 再加精灵草8\n就有机会变成爪9精了\n至于省钱的方法\n\n就是自己去打牙10 & 壳10\n都打完了之后\n\n回来先打牙10+壳10 会变成爪8~爪10\n爪9以上的话再加精灵草8就行了\n然后爪9精就多合一些存着\n\n接下来开始合爪12\n牙11+皮11 几乎都是变成爪11 变成爪12的机率较低\n把合到的爪11看要加气瓶升级到爪12\n还是把两个爪11互合@@反正先到爪12就对了\n等到爪12跟爪9精都齐全之后\n就可以开始合咯^^\n爪12+爪9精 ==========> 爪12精^O^ (成功率约30%吧)\n以上合成时建议算命中吉以上,用族长守护兽合\n\n还有家族声望高一点比较好吧@@"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "合成经验『全新』", "铠12治愈5"]
      content: "最近看了很多报道,说治愈5凯12的好处.云云.我也心生向往,装上家族的\n100W和10件凯10滋润.急匆匆的赶到了柯而克村.\n大家知道的,和凯12必须要凯11来升级,而和凯11又分两种方法(最常用).\n一种是皮11+石11.一种是柯而克石头+气.我懒得去打石头啦,主要是太少\n打出来.就选择了后一种方法.\n我家族声望17000,个人声望1800,应该够了吧.前后买了10个矿石,再加气\n瓶,和出了6个凯11.在和凯11的过程中间,发现矿石加气瓶会和出合成石头\n10,淡蓝色的那种.再用合成石头10加气瓶95%会出凯11或者服11.\n凯11或者服11和出来了,就该往里加精灵了,这是最恐怖的一步了.眼睁睁的\n看着你的凯310被吃吧,呵呵,不要心疼啊.有报道说在和凯加精灵的时候花\n和水晶是不可少的.我就没用,直接凯11加精灵凯10.哈哈,10件滋润凯出了\n2件治愈5的凯12.我想也算不错的成绩了吧.到我走的时候身上也只剩下30\n来万了。比较起来也是很划算的.拿出去卖的话两件凯12也该卖个七.八白\n万,算是赚了，呵呵"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "合成经验『全新』", "12以上装备总结"]
      content: "武器:\n    一.枪11=木11+石11,木10+石10,还有就是材料中含有石10与木10\n成分的都可以拿来加一起合出枪11,举例子枪10(有木10)+合成石10(有\n石10).当然,直接打素材合成的成功率要高的多.加精灵推荐用投掷斧9\n/10带精,精枪9/10带精.\n      枪12=木11+牙11.加精用精枪9/10+枪12.\n    二.斧子11=骨11+石11.与斧子10成分一样,可以直接用斧子10+气\n升到斧子11.或者2个含有骨10与石10的道具.比如:凯10(有石10)+斧子\n10(有骨10)就会出.加精灵用精斧子9/10..\n       斧子12=木11+石11.与枪11成分一样的,用素材合的时候不是\n出枪11就是斧子12.用精投掷斧10加精灵.\n    三.棒子11=木11+线11.用弓10+气很好合.或者弓10+弓10.因为石\n器在2.5还没有线11能打,所以只有用10级的升上去了.加精灵用精棒9/\n10或者精弓9/10.\n       棒子12=木11+线11.没别的办法,只能用棒子11+气升,不过推\n荐用精棒9/10\n升棒子11,因为不但容易成功还有可能合出带精灵的棒子12.加精灵也\n是用精棒9/10与精弓9/10.\n    四:弓11/弓12=木11+线11,与棒子是共通的.合棒子与弓的时候不\n一定出什幺.可以用气相互转化.加精灵的方法与棒子11/12的方法一样.\n    五:投掷斧子11=线11+石11.用凯11(石11)+服10(线10)就会出.算\n是合精凯/服11的一种副产品.加气升一下就是投掷斧子12了.加精灵用\n投掷斧子9/10.\n    六:爪11=皮11+牙11.有的时候用牙10+皮10也可以出.用含有这2个\n素材的10级道具也能出.不过还是推荐大家去打素材合它.爪12是爪11升\n级就可以.加精灵的方法是爪11/12+精爪9/10.爪11/12+精枪9/10.\n        爪13=爪12+精爪11,目前好象也只知道这种方法.怎幺加精灵\n还不清楚.\n        爪14=爪13+精爪11.爪13/14成分已经改变了,估计是牙+石.具\n体怎幺加精还在研究中.\n    七:回旋标11/12=骨11+皮11,是合兜的副产品.因为没太大实用价值\n也没试过加精灵.不过根据成分用精回旋标9/10加应该可以.\n      回旋标13是合凯13时候的副产品,成分石皮.怎幺加精也没试过.\n    八:石11-13.石11+皮11,合凯11的副产品.能用精石9/10加精灵.\n  防具;\n    一.兜(合成防具)11-15.皮11+骨11.声望高能一直加气升到兜15.推\n荐用骨11升级,比较好升级,并且骨11好打.\n       至于带净化的兜11,我们实验了很久,发现用兜11+净化兜10或者\n防具11+净化防具10都很难出,现在比教好的合成方法就是净化兜10+骨10\n/11.有些人已经合出来了,还在继续摸索更好的方法中,\n    二.凯/服11-15.皮11+石11一直加气就能升到凯15.\n推荐使用柯而特的石头(5.5W一个,成分就是合成石10)\n加气就能直接到凯11/服11/石11.也可以用加加兜/卡坦石+气来合.不过由\n于加加兜与卡坦石的成分都是9级的,没有直接用柯石合的方便.在合凯/服\n的时候会出石,没关系,加气转一下就可以了.\n       精灵5级的凯服11.指治愈5,滋润5,恩惠5.方法是用凯/服/石11/\n12+精凯/精凯9/10,精凯/精服9/10带几级(2-4)精灵,哪种精灵(治愈,滋润\n,恩惠)都可以.这样一般成功的话都是治愈5级的,要是想要滋润5,可以在\n后面加上花10/11,想要恩惠5,可以在后面加上水晶10/11.这里在给出大家\n精凯9的合法,卡坦石+100人买的精凯8.而且大家一但合出凯/服13以上,加\n精灵就得用精凯/服11.14,15的就最少用精凯12,13来加精灵了.所以大家\n合出所谓的鸡肋装备的时候(凯11治愈3,服12滋润4等等),不要急着转精灵\n或者将精灵升级,可以留着做合更高级凯的原料,如果很想要5级的话,也可\n以在那些鸡肋装备上加气,花10/11或者水晶10/11,这样便有一定机会将上\n面的3,4级精灵转化为5级的,要是幸运的话还能把治愈变成滋润,呵呵,不过\n希望不大.\n   道具:\n     一.环6.皮11+石11+土11.推荐族长用凯11+土11,因为凯11很好合(柯\n石合法),自己只要打个土11就可以了,当然凯11+土10有时也出,看你自己愿\n意不愿意费钱了.\n        环7.皮12+牙12+土12.这2个都是打不到的东西.但是皮12石12可以\n用凯12来代替.土就只有用土11了.环7有时在合环6的时候也会出,算是惊喜\n品,不算太好合.\n     二.B3,B4,只给大家最常见的4钟B3合法.\n石化、混乱B3(B4)=石8+线8+石草8+混草8\n睡眠、石化B3(B4)=牙8+线8+睡草8+石草8\n睡眠、混乱B3(B4)=骨8+线8+睡草8+混草8\n毒，石B3（4）=石8+线8+毒草8+石草8。（网上告诉的方法是用骨8，但经过\n实验应该是石8才对）\n     三。一击必杀戒指6。1。82与2。0戒指只开到了5级，2。5开到6级了\n。有人说只能用10级的素材才能合，实际上8级的素材已经足够合了。线8+\n贝8+鳞8+黏土8。有的时候也出5，加气升一下吧，反正材料不贵。\n     四。回避耳环6，7，8，9，10。有10了当然10以下的就不介绍了，耳\n饰10的合法是石+线+土 魅+7 耳饰10。回避+10？"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "合成经验『全新』", "精灵抓16"]
      content: "第一 . 首先去火庄园买14级的石 约是12W的那种\n\n      然后加上精灵草8*8\n\n      然后有2种情况：\n\n      1） . 石带精了  一般会是精石/精标 12~15级\n            只要带精了  就可以留着做爪16的素材\n\n      2） . 没有带精  那大家就继续加 草8*8 继续合\n\n\n第二 . 到火庄园买14级的爪  约12W的那种\n\n      在这里我不建议大家 爪14*2 这样合空爪15\n\n      因为很费钱  而已成功率不见得高很多\n\n      推荐大家去买100的气直接和爪14一起合\n\n      这个步骤是很吃钱的...大家要有心理准备\n\n\n第三 . 最后一步...... 爪15+精石/精标 12~15级=爪16精\n\n      此步骤有很多副产品的\n\n      例如：精爪15 ，空爪16 ，精石16 ，纯凯/服15 等等\n\n      这里有几种处理办法：\n\n      空爪15+精爪15=爪16精\n\n      空爪16+精石/精标12~15级=爪16精\n\n      空爪16+精爪15=爪16精\n\n      纯服/铠/石/标 + 草8*8=精石/标12~16\n\n\nP.S   此方法约为500W出一把爪16精  看运气 偏差为±200W\n\n      16级装备对家族总声望的要求为5W以上\n\n      建议大家7W以上才去合\n\n      个人感觉合成最好在服务器人少的时候合"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "合成经验『全新』", "滋润5铠"]
      content: "条件：\n\n1、声望越高越好，最少要300吧。\n2、运气要大吉！\n3、有一只合成宠。（废话）\n4、银行有要有足够的石头，应该1000W是可以出到你想象中的啦。\n有以上条件后，你可以去尝试合出一件滋润5铠12极品货啦。\n\n第一、你现在去的地方是柯尔克村，除非你有的是时间，去打素材，不然\n准备用身上那100W买10块柯尔克石。\n第二、开始可以在村庄医院里买气药，用“柯尔克石+气瓶”的方法去合，\n合出一堆“铠11”（不要告诉我你合出了铠13，我会妒忌而揍你一顿）\n根据我朋友的烧钱经验，100W里可以出到2~3件的“凯11”，重复这个步骤\n合出9件以上“铠11”吧。准确来说可能就这样没了300W的啦。\n第三、去那个加加百人道场里买N件“滋润铠8”。\n\n第四、用那些“铠11+滋润8”合啊~好运是可以合出“铠12滋润5的啦”，不\n过合不出率我也敢说是95的。\n关于第4的步骤，其实是为了合出“铠11滋润3以上”，9件应该可以出2~3件。\n\n第五、重复以上步骤，等出到有9件“铠11滋润3以上”。\n\n第六、再用“2”这个步骤去合9件的铠11出来。\n\nAT LAST：“铠11+铠11滋润3以上”的配方去合吧，记得合前给观音什幺的\n插上香保佑你出来一件铠12滋润5的啦。\n如果你害怕的话，最后将“铠11+铠11滋润3以上”的铠11转变为铠12（13）\n来合。\n说完，准确来说有钱就是万能，上面的试验用了差不多1000W，合不合看你\n自己。\n最后有句话，我最近烧了所有的MONEY~2000W，所有复制出来的钱都没啦：\n~（\n\n我现在挂机料理不是为声望，为的是石头。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "BOX合成宝典", "爪类合成"]
      content: "精灵爪1-2，5-6皮加牙\n　　爪1-6皮加牙　　精灵爪3-4石加牙\n　　爪7-10壳加牙　　精灵爪7-10壳加牙\n　　爪11 =皮+牙.（现在可在火城直接购买）用含有这2个素材的10级道具也\n能合出.四点零的素材比较难打。不推荐打素材合。（上精的话可以在火城直\n接购买后用精草上精法。精草X4就可以直接给精爪11上精）（修复的话用皮1\n或牙1）\n\n　　爪12 =皮+牙，（现在可在火城庄园直接购买）可给爪11升级及上精的时\n候获得。（上精的话可以用精草上精法。精草X4就可以直接给精爪12上精，\n如果想提高上精效果可以用精枪9/10，精爪9/10或是精石9/10））（修复的\n话用皮1或牙1）\n\n　　爪13=皮+牙，（爪12+精爪11），（现在可在火城庄园直接购买）或者爪\n12+皮11/牙11.其实就是爪12+催化剂=爪13。 （精爪13的成份因为是和空爪13\n不同，所以不能用精草X4来加精。建议用10级以上的精石上精或是精枪11/精标\n13等含有石成份的道具）（修复的话用皮1或牙1，带精爪13修复的话用石1或\n牙1）\n\n　　爪14=皮+牙，（爪13+精爪11），（现在可在火城庄园直接购买）也就是爪\n13+催化剂.空爪13/14成分没有改变了,还是皮牙（因为成份关系，上精的话也\n是不能用精草上精法给14级精爪上精，暂时估计的精爪十四的成份是牙石推荐\n用13级或以上精石/精标上精。由于推断含有石成份，我想拿精枪13等含有石成\n份等道具上精也是可行的。奇怪的有一点就是精爪12可以给爪14上精，而从成\n分学来说是不可以的，但是确实这么能合出来。但成功率很低，不推荐）（修\n复的话用皮1或牙1，带精爪14修复的话用石1或牙1）\n\n\n　　爪15=爪14+催化剂。这里说的催化剂最好就是用带精投石，回旋标13或是\n精爪13以上的了！现在可利用火城的空爪14对合或是加气合，这样可以出空爪\n15 但成本会比较高，声望高的朋友建议以属性石12来升级。如果升出来有可能\n出属性爪15，这样上精就又可能冲出属性精爪15或属性精爪十六（上精推荐用13\n级或以上的精石精标或是精爪13，在给空爪14上精的时候有可能直接催化出精\n爪15，但如果对自己的声望有自信的话也可以用精石11/12来给爪上精，这样会\n量节约成本，但前提是声望还是比较高的好）（修复的话用皮1或牙1）\n\n\n　　爪16=皮+牙，（空爪15+催化剂（石/标/爪13以上）（升级推荐用精石/标/\n爪15级左右的来催化，比较容易在升级的时候加上精灵直接变精爪16，在出了精\n爪15如果觉得没什么用就用来给空爪16上精，这会比较好上精）（修复的话用皮\n1或牙1）\n\n\n注：用于低级爪上精道具的合成法\n\n可以用卡坦石+精草8=精石9/10\n\n\n3.对自己的声望有绝对自信的朋友可以直接用精石9给高级上精，这样可以减低\n很多成本，但成功率绝对是没拿高级武器加精那么高的。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "BOX合成宝典", "枪类合成"]
      content: "枪1,3-6木加石　　精灵枪1,3-4,7-8木加石\n枪2,7-10木加牙　　精灵枪2,5-6,9-10木加牙\n\n\n枪11=木+石，（现在可在火城庄园直接购买）或是木10+石10,还有就是材\n料中含有石10与木10成分的都可以拿来加一起合出枪11,举例子枪10(有木\n10)+合成石10/投斧10(有石10).当然,直接打素材合成的成功率要高的多但\n现在素材难打.不推荐！（加精灵推荐用精投斧9/10,精枪9/10.精石9/10。\n如果有钱的话，推荐去达那武器店合成，用达那武器店卖的投掷斧子（威\n金娜斯投斧）8X4=投掷斧子9，投掷斧子9+投掷斧子8*4=投掷斧子10，投\n掷斧子10+催化剂=枪11。有可能在催化的同时上精，现在火庄开放高级枪。\n可去直接购买后去买精草8X4上精。利用精草上精法上精可以作催化。在升\n级到枪13的同时有可能上精）（修复的话用木1或石1）\n\n\n枪12=木+牙，（现在可在火城庄园直接购买）可在火庄直接购买空枪12或\n属性枪12后用精枪9/10或精爪9/10上精。亦可利用精草合成法的原理上精\n。但不可能催化升级。只能上精。）（修复的话用木1或牙1）\n\n\n枪13=木+石，（现在可在火城庄园直接购买）可用精枪11催化上来,（上精\n用精枪十一或是斧12，同样亦可利用精草合成法的原理上精。可在上精的时\n候催化上去。但催化上去时上精的机会比较低，可一直催化到枪十五左右）\n。（修复的话用木1或石1）\n\n枪14=木+石，（现在可在火城庄园直接购买）可在催化枪13时升级上来。\n（上精用精枪11/13或精斧12以上加精，但我觉得用精草X4的精草合成法\n就可以了，可在上精的同时起催化作用）。（修复的话用木1或石1）\n\n枪15=木+石，基本上不可能在给枪14催化上精的时候直接合出精枪15。（\n精枪15的成份应该是木+牙，上精的话应该是空枪15+高等级带牙成份的带\n精道具，例如高级精爪）。（修复的话用木1或石1带精话的用木1或牙1修）"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "BOX合成宝典", "斧类合成"]
      content: "斧类合成\n斧2-8木加石　　精灵斧2,7-8木加石　　1,3-6骨加石　　斧1,9-10石头\n加骨\n精灵斧9-10木加贝　　精斧13-16骨加石头\n\n\n斧11=骨+石，（现在可在火城直接购买）成份和斧九斧十相同。加精可用\n精斧9/10上精，或是用达那武器店的投斧八X4来上精。（可引用精草合\n成法）。（修复的话用骨1或石1）\n\n斧12=木+石，（现在可在火城庄园直接购买）可在达那烧钱合成法的过程\n烧出来，上精可用精投斧10来加。（可引用精草合成法）。（修复的话用\n木1或石1）\n\n斧13=木+石，（现在可在火城庄园直接购买）加精最好用11级的精枪或是\n精斧11，精草上精法应该不适用与给十三级以上的斧上精，我试过连续合\n了三千多万都合不出，应该是可以确定的了，上精应该要用11级以上的精\n斧或精枪以及精石来上精。（修复的话用木1或石1）\n\n斧14=木+石，（现在可在火城庄园直接购买）上精要用11级以上的精斧或\n精枪以及精石来上精。（修复的话用木1或石1）\n\n斧15=木+石，斧13-15都可以在合精枪十四的时候“变”出来，上精应该是\n用同等级的精枪或低一等级的精斧以及精石来上精。（修复的话用木1或\n石1）\n\n　　达那合成法：用达那的投斧8X2-4把对合（威金娜斯斧）出了9级的武\n器后就加3-4个投掷斧头8。出了10级武器后就加4个投斧8。出了12级武器\n后就加5-6个投斧8。要合石化枪的话用石化斧头+石化投掷斧头，要合睡眠\n枪用石化斧头（其实随便什么精灵都行。不用这个直接用睡眠投掷斧头也\n一样）+睡眠投掷斧头合出无精武器后就一直加睡眠投掷斧头 不过这么合成\n难出14级的，最好是用13级无精+12级带精武器合。\n\n达那高级斧合法：\n达那的投斧8X4=投斧9，然后+2-3个达那的投斧对合一直升级到11级，12级\n以上的就+4个达那的投斧，15级的时候就+5个达那的投斧，就这样和出来\n的斧头16但机会会相对比较低。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 物品合成修复】", "BOX合成宝典", "投掷斧类合成"]
      content: "棒1-2，3-9木加线　　精灵棒1-2,4,7木加线\n\n棒4，7-8石加线　　精灵棒5-6壳加线\n\n棒5-6壳加线　　精灵棒3,8-10石加线　　棒10骨加线\n\n棒11=木+线，（现在可在火城直接购买）可在火城购买后直接去买精草X4\n来上精，（由于棒与弓的成份是相同的，所以上精的时候有可能会出精弓\n11或是以上下等级的弓棒，13级的精棒除外）。（修复的话用木1或线1）\n\n棒12=木+线，（现在可在火城庄园直接购买）和棒11一样，在火庄购买后\n可以直接用精草上精法来加精，（由于棒与弓的成份是相同的，所以上精\n的时候有可能会出精弓12或是以上下等级的弓棒，13级的精棒除外）。\n（修复的话用木1或线1）\n\n棒13=木+线，（现在可在火城庄园直接购买）由于空棒13和精棒13的成份\n不相同，所以是不可以用精草上精法来给空棒13上精的！如过用精草上精\n法的话最多只会出“蝴碟弓”（精弓13）精棒13的上精方法是用精石11-1\n3来上精，精棒13的成份是石+线。（修复的话用木1或线1，精棒13用石1或\n线1修）\n\n棒14=木+线，（现在可在火城庄园直接购买）可在火庄购买后直接用精草上\n精法来给棒十四上精，（由于棒与弓的成份是相同的，所以上精的时候有\n可能会出精弓12或是以上下等级的弓棒，13级的精棒除外）。\n（修复的话用木1或线1）"
