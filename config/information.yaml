      content: " ┌───────────────────────────────-┐\n │ 6.0新任务--伊芙丽与多吉尔的爱情故事                           │\n │ 任务地点：北岛柯奥村（４７１．６３０）卡坦村（２６０．１７２）│\n │ 适合等级：20级以上                                            │\n │                                                               │\n │ 限制条件：此任务可重覆解                                      │\n │                                                               │\n │ 一  在北岛柯奥村内(78.55)有一个叫做\"伊芙丽\"的女生接任务。     │\n │ 二  她希望你把信交给多吉尔，并做一个爱情御饭团送给多吉尔，到  │\n │ 了卡坦村找到多吉尔(95.81),并把信和爱情御饭团交给他。          │\n │ 三  他也会要求你把他的信拿给伊芙丽，并做一个合成戒指(任何级别 │\n │ 都可)给伊芙丽做好戒指连同信一起拿回到柯奥村找伊芙丽，她为了报 │\n │ 答你，就给你                                                  │\n │ 一个\"结婚蛋糕\"(耐力600回覆-全体)。                            │\n │                                                               │\n │ ~任务结束~                                                    │\n │                                                               │\n │ 合成方法：                                                    │\n │ 爱情御饭团:海藻2+水2+米2                                      │\n │ 合成戒指1:线1+贝1+鳞1+黏土1                                   │\n │                                                               │\n │ 礼物：                                                        │\n │                                                               │\n │ 结婚蛋糕:耐600回复(我方全体) 结婚典礼上的大蛋糕               │\n │ 备注：从\"多吉尔\"开始解也可以，只要转换解任务的顺序便可        │\n │                                                               │\n └───────────────────────────────-┘"
