      content: "玩家可以对宠物及道具进行拍卖，价格自由设定，广告说明自由设定。使用此功能后，您的宠物或道具一定可以吸引更多的买家，卖个好价钱哟~\n\n使用注意：\n\n·可以自由设定广告\n\n·可以自由设定价格"
