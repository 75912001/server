      content: "属性：地8风2\n捕抓地点：泪之海（324，28）\n特殊技能：无\n骑宠证来源：完成塔蜜提雅之迷任务即可（后面有详细功略）\n1级平均四围：58/12/11/5\n成长率范围：5.7-6.3"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]新融合"]
      content: "在石器时代8.0中，终于要推出新的融合宠了，不过这些新融合的融合方法和5.0推出的融合宠方法不太一样哦，可以说是比以前更难的融合出来了，最基本的融合后出的宠物蛋也和以前的也不一样哦：\n\n◎融合方法：必须能前往瑞尔亚斯大陆，到达其宠物训练所找专人才能帮你把宠融合成蛋。\n◎融合注意：海底宠物蛋所需要的药和陆地宠物蛋不相同的，随便喂食的话会导致宠物蛋失去生命力量。所以请不要用老的融合药来喂养海宠蛋！\n◎融合药材：要顺利喂养海宠蛋的药剂，必须要三种不同成分的素材进行调和，依照性质的不同可以分成主成分，副成分和媒介三种：\n主成分：多数使用泪之海中的生物，如水草，小虾，鱼苗，水母等，这些都是鱼类生物的主食，很适合拿来作为配药的主材料。\n副成分：而副成分则是使用能够提升营养价值的成分为主。像是矽藻土所粹取出的维生素可以增强宠物的耐性，鱼骨粹取出的成分则对宠物的敏锐力有很大的帮助，其他像是蚯蚓，海蟑螂等，也都含有相当高的营养价值哦。\n媒介：有了前两种素材后,最重要的就是媒介了,经过宠物临床研究后发现,只有透过人鱼的眼泪进行调和,才能够将药剂的营养成分浓缩到极限,浓缩后的药剂除了营养满点外,也可以加快宠物孵化的时间,平均换算海底生物的成长时间约为陆地生物的一半（也就是海宠蛋只需要20小时就能出生了）。\n◎融合药材的合成：通过宠物使用料理技能即可。\n◎融合素材的获得：\n    蚯蚓，鱼骨，海蟑螂，矽藻土可以在瑞尔亚斯之都的便利商店买到哦\n    营养的水母，营养的小虾，营养的鱼苗，营养的水母在瑞尔亚斯庄园可以买到\n    人鱼的眼泪要用料理去恐吓人鱼取得（你哭吧，不哭我就把你这条人鱼拿去做生鱼片！哈哈哈哈~），或者到风城民房（128，128），与NPC米丽纹说话，1颗珍珠的成份1可换成3颗人鱼的眼泪。\n        人鱼所需要的料理之料理方法：危险的生鱼片 青蛙1+蜥蜴1+贝1\n                                    两栖类生鱼片 蜥蜴2+青蛙2\n                                    冷冻的生鱼片 章鱼2+花枝2+贝2\n                                    高级生鱼片 鱼3+花枝3+虾子3+螃蟹3+章鱼3\n        目前已知人鱼坐标：泪之海的(173,81)(196,106) (329,25) (321,132) (323,43) (99,87)。\n◎融合药材配方：\n蚯蚓+水草+眼泪＝滋长的蓝药露\n鱼骨+水母+眼泪＝敏锐的黃药露\n海蟑螂+小虾+眼泪＝强壮的红药露\n矽藻土+鱼苗+眼泪＝能量的绿药露\n\n◎喂蛋地点的问题：喂蛋也有不同的地方，不像以前的蛋什么地方都能喂了，这个要注意哦：这次的海宠蛋的前2个药可以任意地点喂，然后就是需要换地方喂蛋了，具体如下：喂完前2次后去沙已夫换气道喂蛋3次，然后去史东尔换气道喂3次，接着琉璃洞窟15楼、碧清洞窟15楼、深红洞窟9楼、玄黄洞窟15楼各喂3次，然后就孵化了（喂药的间隔同样是1小时，这里有个小BUG，不知道算不算，其实海底融合不一定要在同一地点喂3次，只是第一次在那里喂就可以下来了，然后再相隔2次再去下一个地方喂就可以了）。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]宠物装备"]
      content: "在石器时代8.0中会开放宠物装备系统，当然，宠物装备和人物装备是不能共用的，这个就有点遗憾了。目前开放的宠物装备。一般加的某数值都不会上20。所以对于宠物装备的用途没想象中的强（以前不是谣言宠物可以穿珊瑚装备等金属装备的吗？要是这样，那就真的很BT了），好，话不多说，究竟宠物装备怎么来的呢，让我们继续往下看咯（又是这句了，汗……）\n◎宠物装备的类型：宠物装备一共分成8大类型，就是头套，牙套，爪套，胸甲，背甲，脚防具，鳍护套，翅膀防具。\n◎宠物装备的获得：利用宠物的合成技能对各种类的素材进行合成，就有机会合成出宠物装备的了，目前笔者手上没有足够的资料来说明合成配方，要是我拿到的话，会第一时间发布的。另外还可以在做任务拿到或者去瑞尔亚斯武器店买到宠物装备。\n◎宠物装备注意事项：骑乘宠物不能装备宠物装备，忠诚度不足100的也不能装备宠物装备，宠物拥有耐久度，和人物装备一样。宠物装备会依照宠物的特性来装备，例如某些宠有某些部位是不能装备的（例如乌力的话，他没有翅膀，怎么能装备翅膀防具呢？）至于具体的宠物有那些部位可以装备的呢？就让各位玩家自己去研究了，因为版位有限，这里就不把石器差不多500只宠物拿来说了。\n◎宠物装备最高等级：（完全为本人猜想，并不代表官方立场）根据本人的猜想，我认为宠物装备的等级最高为20级，也就是和人物所合成的装备的等级相一致，每个宠物装备只要是合成的名字都是叫合成XXXY（X为部位，Y为级别）的，任务的除外（当然，目前石器8.0所有的任务笔者都没发现有拿宠物装备的），所以，宠物装备某一部分的最多就是增加宠物某些数值的 20? 而已。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]导师、任务、名片、鉴定系统", "①导师系统"]
      content: "这个是石器8.0新开的系统，是方便老玩家带新玩家好好畅游石器时代的一个新系统，到底要怎么用呢，我们继续就看看咯：\n◎怎样才能成为导师：当你面对其他玩家时，按下屏幕上面的“导师系统”按钮，对方将会确认是否认定对方为你的导师。\n◎导师的用途：当对方成为你的导师以后，当你获得声望的时候，你的导师将会得到你所获得的声望的5%，但你的声望并不会因此而减少。\n◎获得声望的条件：必须在学生取得声望的同时与学生在同一星球上即可。若导师不在线或学生已经取得声望后才上线，则导师不会增加声望。\n◎怎样取消导师资格：当拥有导师后，按屏幕上面的“导师系统”则会出现导师状态，并且可以取消对方的导师资格。取消对方的导师资格时，同时也会减少自己的魅力值哦，大家注意了！"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]导师、任务、名片、鉴定系统", "②任务系统"]
      content: "很方便大家的一个新系统，若是大家在日后忘记了自己的人物曾经做过什么任务，则可以点屏幕右上方的问号按钮，再点菜单中的“任务日志”，则会看到自己的人物所做过的任务以及未完成的任务了，是不是十分方便呢？"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]导师、任务、名片、鉴定系统", "③名片系统"]
      content: "在石器时代8.0中，个人名片的空间将会由原来的10页增加到20页，而且第20页的最后一个名片空格是精灵召唤专用的哦，每当你的号被召唤或者你召唤到了别人，系统将会自动将使者和勇者换名片，并会出现名片在最后一个名片空格了，这样联系的时候就方便多咯！"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×8.0任务×", "[8.0任务]导师、任务、名片、鉴定系统", "④鉴定系统"]
      content: "石器时代8.0新开的一个系统，由于内测时间短的关系，笔者我暂时不太了解这个系统的用途，根据华义官方的解释，这个是提高合成的几率的系统，笔者猜想应该是合成的熟练度吧，当某一素材的合成熟练度高了，合成的成功机会也会增加，可能大概是这样吧，这里我将会更努力的搜集资料的，做到把第一消息发上来！\n◎怎么获得鉴定某种素材的权利呢：一定要拥有该鉴定素材的鉴定书，就好象吃骑乘证一样，使用了就永久有效，至于素材证怎么来，目前还没资料，搜集中。"
