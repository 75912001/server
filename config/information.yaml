      content: "必须条件：\n1.等级三十以上\n2.须先成人礼才能解.\n\n\n\n\n1.先到象洞(238，98)，与管理员拿钥匙\n\n2.上到8F找精灵(10，10)说话(坐标)，再到(266.294)拿心性之镜\n\n3.再找象洞管理员说话(不说拿不到羊服)\n\n4.6F打精灵使者(最好打两个真实之眼)\n\n5.上到8F找精灵说话(8，10)\n\n6.得到守护精灵扬恩米都之服(防+13敏+3魅+3恩惠精灵LV3)\n\n7.然后去解五兄弟，回库伊爷家，得到摩娜西普LV1一只"
