      content: "作者：BOX_天空战记001\n==================================================================\n▲〖加加村〗\n进入坐标：南岛(496,353)\n骑宠：格尔格（红猩猩）\n记录肉：乌宝宝的肉\n开放商店：\n封闭商店：落马术（限鸡类可学，塔斯夫天生有落马术）\n收购素材：无\n\n▲〖卡鲁它那村〗\n进入坐标：南岛(275,533)\n骑宠：玛恩摩洛斯（白象）\n记录肉：克邦凯斯的肉\n开放商店：无\n封闭商店：T技能（限机暴可学），捐献（限扑满猪可学）\n收购素材：无\n\n▲〖玛丽娜丝村〗\n进入坐标：北岛(72,588)\n骑宠：左迪洛斯（蓝暴）\n记录肉：乌力斯坦的肉\n开放商店：无\n封闭商店：无\n收购素材：壳\n\n▲〖萨姆吉尔村〗\n进入坐标：北岛(606,561)\n骑宠：巴朵兰恩（红暴）\n记录肉：凯比特\n开放商店：智慧之果1\n封闭商店：无\n收购素材：无\n\n▲〖伊甸园〗\n进入坐标：伊甸园区(345,130)\n骑宠：拉奇鲁哥（红狗）\n记录肉：塔斯夫的肉\n开放商店：线9，线10\n封闭商店：牙10+线10+150000石币换驯兽戒指\n收购素材：骨\n\n▲〖塔耳塔地城〗\n进入坐标：地城城区(183,137)\n骑宠：卡达鲁卡斯（绿穿山甲）\n记录肉：玻洛布斯的肉\n开放商店：14级的铠，14级的服\n封闭商店：萨顿家的秘药+30000石币换替身娃娃 LV1\n收购素材：黏土，水晶\n\n▲〖尼克斯水城〗\n进入坐标：水城城区(129,53)\n骑宠：扬奇洛斯（蓝人龙）\n记录肉：莫拉司的肉\n开放商店：首饰B3\n封闭商店：有气势的鱼+40000石币换宠物项圈 LV1\n收购素材：贝壳，鳞\n\n▲〖弗烈顿火城〗\n进入坐标：火城城区(175,280)\n骑宠：卡卡金宝（红蛙）\n记录肉：瑞德宝的肉\n开放商店：14级的武器（除了弓箭），14级的兜，气瓶80\n封闭商店：炎之圣石+100000石币换恶魔宝石（原地三次）\n收购素材：石，牙\n\n▲〖亚伊欧风城〗\n进入坐标：风城城区(308,274)\n骑宠：多拉比斯（金飞）\n记录肉：立杜鲁斯的肉\n开放商店：14级的弓箭，手环6，智慧之果2\n封闭商店：太阳神的首饰 LV1+50000石币换月神首饰 LV1\n收购素材：皮，木"
