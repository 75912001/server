      content: "作者：BOX_天空战记001\n==================================================================\n●什么是石器中的素材？\n石器中的素材是指可以通过某种方式处理成新物品的某一种元素的材料。\n如枪8是由木8和牙8通过宠物加工合成而得的！木和牙就是素材，8是素材的\n等级.\n\n●素材分为几种呢？\n素材分为2种：\n1.装备素材\n装备素材又分为普通装备素材，金属装备素材2种\n①普通装备素材有（14种）\n牙，皮，木，线，骨，鳞，叶，土，贝壳，壳，爪，水晶，花，石\n②金属装备素材有（8种）\n铜，铁，珍珠，钻石，蓝宝石，红宝石，绿宝石，黄宝石\n2.宠物素材\n宠物素材又分为转宠素材和融宠素材2种\n①转宠素材有（4种）\n地灵石，水灵石，火灵石，风灵石\n②融宠素材有（4钟）\n加攻素材，加防素材，加敏素材，加血素材\n\n●这些素材是什么时候有的，有什么用呢？\n◆在2.0版本之前\n在2.0版本之前只有普通素材。普通素材最高级为9级，（1-8）级素材只有在石器的萨姆吉尔村，卡鲁它那村和卡坦村买，也没有什么宠物会掉素材的！9级为在每次系统维护后，去北岛中央通道旁的一棵树下找“宝箱”拿.（南岛为拉多拉大洞窟，但似乎未出现过）“爪”素材只有去梦幻洞窟解任务随机得到，只有一种，爪4（钩的爪），目前还不知道爪素材有什么用！\n\n【普通素材作用】：普通素材的作用就是合普通装备，普通装备就是没加金属素材而合成的装备！由于2.0版本之前有水果合成法（装备合成过程中素材不会被合没掉及用水果可直接升级）的好处，所以合成比较简单，成功率高，因此那时候的10级精灵装备很多！\n\n◆2.0版本\n2.0版本有了打工证，在萨村和加加村的24店都卖（打工证不能交易，寄存，丢和邮寄），打工证可以去打素材来卖或者合成，当然也可以用来打高级怪物升级。打工证可以打出（6-11）级的素材，规律是（60-70）级出6，7级素材；（80-90）级出8，9级素材；（100-110）级出10，11级素材！素材的掉落率很高，因此可以通过打素材来赚钱，这也是2.0时期的主要赚钱方式\n【打素材作用】：可以打出（9-11）级素材，因为2.0时期，装备等级已经提高上限了，所以需要去打高级素材来合高级装备！但又因为只有族长才能合，所以高级装备数量并不多\n\n◆2.5版本\n2.5版本有了转宠这一系统，也就出现了“灵石”这一新素材！ 灵石分为4类5级20种，灵石在四大属性洞窟的一楼随机遇敌“灵兽”打出的！灵石掉落的几率也很高，只是当时的灵兽非常难打，所以2.5版本时期的转宠不多，但成长都是非常高的！现在灵兽变好打了，所以成长也就烂了！\n【灵石用处】：灵石不能交易，是唯一一种不能交易的素材。灵石是通过玛蕾菲雅这个MM人宠来体现的，而MM人宠又关系到转宠的好坏，而灵石在打到的时候是看不出好坏的！要通过鉴定后才知道！\n\n◆3.0版本\n3.0版本，素材开始用来作为解任务用，如水城爱情故事任务就需要去打鳞11和花10才能完成，这时期并没有新素材，素材也没有什么变化！\n\n◆4.0版本\n或者3.0的素材没变化是为了4.0的素材翻天覆地的变化而准备吧，4.0版本的素材主要有以下几点变化：\n1.取消打工证，使得那些高级宠物不再出现\n2.大大降低素材的掉落几率，使得素材大量减少\n3.缩短素材掉落等级，由（6-11）改为（9-11）\n4.部分11级素材可卖给庄园的商店！（1-10）素材可卖给萨村，卡村和卡坦村的素材商人\n5.新增金属素材\n6.提高素材利用率，使素材有效的控制起来，不再大量浪费在合成装备上\n【这里要说明的有2点】\n①骨11\n骨11在4.0版本前期是没开放的，骨11都是在3.0的时候留下来的，骨11又是做铜兜这种热门金属装备不可缺少的东西，因此骨11价格很高，可以换到1块或2块成品金属，后来由于开放了骨11，使得骨11变得非常便宜，供过于求，最后剩的只得卖给伊甸庄园的商店！因为骨11是挂机的副产品\n②金属素材\n金属素材都非常难掉，有的更是难打加难掉，如铁矿.正因为如此，金属素材只开放了1级而已。因为金属装备比普通装备能力强，但没精灵，所以华义为了不使金属装备成为鸡肋，又不破坏普通合成装备的平衡性，让金属装备可以带魔法，使之与普通装备各有用处\n\n◆5.0版本\n到了5.0版本，又出现了新素材--药材 药材分为4类5级20种，跟灵石不一样的是，药材是知道等级才去打的！灵石是去打后才知道等级的，这也是转宠和融宠的本质区别，所以要融合宠物最好都去打5级药材，药材有数量限制，而灵石并没数量限制。\n【药材作用】：药材是通过宠物蛋来体现的，而宠物蛋破蛋后的成长是由融合前宠物的成长率加药材的喂养情况而定的\n\n●素材要去哪里打呢？我们需要什么素材呢？\n素材的掉落地点很广泛，遍布石器各个角落，有南岛，北岛，吉鲁岛，英雄岛，伊甸大陆以及洞窟，迷宫等等！而我们需要的素材只有以下几种\n【普通素材】：\n1.牙10-------------深红洞窟8楼----------格鲁西斯\n2.线10-------------伊甸园旅馆买[还可以去漆黑洞窟打\"扬奇洛斯\"得到] （做“驯兽戒指”需要的素材）\n3.花10-------------漆黑洞窟前-----------恩摩摩\n4.鳞11-------------没落的矿坑4楼--------奇拉顿\n      -------------封印迷宫2楼----------水精灵 （做“心之手环”或“力之手环”需要的素材）\n5.骨11-------------库塔伊洞窟2楼--------哥斯哥斯\n6.线11-------------火山洞窟4楼----------杨格斯\n7.皮11-------------漆黑洞窟7楼----------布鲁顿\n8.石11-------------碧青洞窟14楼---------加格\n9.木11-------------琉璃洞窟13楼---------利则诺顿\n（做金属装备需要的素材）\n\n【金属素材】：\n1.珍珠-------------吉鲁海底通道---------加克拉\n2.钻石矿-----------漆黑洞窟20楼---------帖拉所伊朵\n3.蓝宝石矿---------伊甸大陆南方---------迪基格斯\n4.红宝石矿---------弗烈顿城区-----------朵巴奈特\n5.黄宝石矿---------凯菈村---------------玛斯贝卡\n6.绿宝石矿---------伊甸大陆西方---------梅尔顿\n7.铜矿-------------伊甸大陆骨架外围-----史凯勒顿\n8.铁矿-------------伊甸大陆骨架通道-----古斯特\n\n【药材】：\n1.双星芽-----------帕拉火洞窟-----------扑满乌力\n2.双星厥-----------凯菈村---------------布依伦斯\n3.双星藻-----------库塔伊洞窟1楼--------嘎吱拉\n4.双星果-----------凯菈村---------------莱姆洛斯\n\n●还有什么别的素材或掉落物品吗？\n■素材■\n①精灵素材（1-8）级\n1.武器精灵素材；有石化，混乱，睡眠，酒醉，毒5种 （高级的武器精灵素材只有名字，没有取得方式）\n强力的乌衣草[毒10]\n石化草[石化10]\n忘尤草[混乱10]\n酒仙草[酒醉10]\n幸福草[睡眠10]\n2.其他精灵素材：有复活草，回复草2种\n②属性素材（1-8）级\n地砂，水滴，火草，风毛4种\n（高级的属性素材只有名字，没有取得方式）\n月之砂[地9]，星之砂[地10]\n灵水的水滴[水9]，奇迹之水的水滴[水10]\n火焰草[火10]\n朵拉比斯的羽毛[风10]\n〖精灵素材及属性素材在2.5版本的说明上为在天空之岛打100级精灵可得〗\n③加鲁娜素材\n加鲁娜素材是一系列特别的素材，在一开始的时候就已经有了！在没有金属装备前，还是有人喜欢用加鲁娜石的兜这种装备的！加鲁娜装备共有10种，8种武器，2种防具，特性为减敏的改为不减敏，不减敏的改为加敏！防具都加回避\n取得方式：要做完吉鲁岛的小猪爱情故事任务，拿到黑矿和白矿，再去没落的矿坑5楼找小猪合成灰矿！再用灰矿加普通素材合成而得\n\n■物品■\n一级矿石，特级矿石，超特级矿石，良质的木材，卡库尔竿，特沙金竿，曼摩竿，超级加克拉，超级姆依，超级海主人，超级加格，聪明的豆子3，木材，岩盐"
