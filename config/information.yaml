      content: "1、前往鱼村，来到村长家旁（49，48），找愿藏的祖父母说话，他们说新藏\n喜欢冒险，但这次冒险很久都没回来，希望你找找新藏。\n二、找新藏\n\n1、先到福村。\n\n2、从福村去吉鲁岛库伊老爷爷的家（266，294）\n\n3、到了库伊老爷爷的家，和库伊老爷爷（15，10）说话，库伊老爷爷说：新\n藏到了后面的洞，并说有一只喜欢亮亮东西卡卡金宝守着洞口，便他会闪亮\n护身符你，说完后拿到库伊的闪亮护身符。\n\n4、拿到库伊的闪亮护身符后你要往库伊老爷爷后走进洞。\n\n5、和看门红蛙说话给他项链，就可以进入蛙洞\n\n6、1楼 到 2楼 （11，58），两楼有一级卡卡金宝捉。\n\n7、在两楼到（46，23）和新藏和他说话，可拿到黑蛙王的金珠。\n\n8、2楼到3楼（46，60） 3楼到4楼（48，56） 4楼到5楼（20，54）。\n\n9、来到黑蛙王前，和它说话，就开始战斗，已解过任务的人说话不会战斗。\n\n10、黑蛙王是90级，其它50级，90级的会地球一周攻击，攻击和敏捷极高，\n118级的人一击都会飞\n\n回老家。\n注意：90级黑蛙王，会专打当前血最低的人，其它蛙会打当前血最低的宠。\n\n过关方法：专向当前血最低的人和宠加镜，有条件的话可向蛙群放个混乱，\n让他们自相残杀。\n\n11、打完黑蛙王，再它说话，交出黑蛙王的金珠，拿到黑玉。\n\n12、拿黑玉回2楼（46，23）给新藏。\n\n13、要跟新藏说2次话，他说黑玉好象值不少钱，但他告诉你回祖父母处接玛\n蕾菲雅。\n\n14、回鱼村，来到村长家旁（49，48），找愿藏的祖母说话，祖母说:谢谢你\n救了新藏，他已经回来和我们说过你会回来接走玛蕾菲雅了。她以前的记忆\n都没有了，只记得自己叫玛蕾菲雅，好可怜喔。你要好好照顾玛蕾菲雅喔？\n说实在的，我们老夫妇根本不知道要怎幺照顾精灵耶。能把玛蕾菲雅托付给\n像你这样的好心人照顾，我们也放心多了，这样你可拿到LV1人宠玛蕾菲雅和\n项链。再说话，祖母说:玛蕾菲雅不知为何特别喜欢项链，并说你可拿漂亮的\n石头给她镶在项链里，给玛蕾菲雅。"
