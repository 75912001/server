      content: "源自石器的天空\n==================================================================\n各村庄代号：\n奇＝奇喀喀村  柯尔克村＝柯尔克\n\n福＝福尔德村 卡= 卡鲁它那\n风＝风城亚依欧 霍＝霍特尔村\n火＝火城弗烈顿 塔＝塔姆塔姆村\n水＝水城尼克斯 达＝达那村\n地＝地城塔尔塔 卡坦＝卡坦村\nSBC＝SBC总部 多＝多多村\nJBA＝JBA总部 乌＝乌鲁力村\n伊＝伊甸园 四大村＝萨姆吉尔村，玛丽娜斯渔村，加加村，卡鲁它那村\n==================================================================\n\n■一般技能:\n技能名称 技能解说 能学此技能之宠物 学习技能地点 可否遗传\n\n\n待机 不做动作 所有宠物 四大村,霍,达,卡,柯,塔,多,乌,奇,柯,克,SBC,JBA,风   O\n\n攻击 通常的攻击  所有宠物 四大村,霍,卡.柯,塔,多,乌,奇,柯,SBC,JBA,风   O\n\n防御 通常的防御  所有宠物 四大村,霍,卡,柯,塔,多,乌,奇,柯,福,SBC,JBA,伊,风   O\n\n破除防御 解除敌方的防御  所有宠物 四大村,霍,卡坦村,柯,塔,多,乌,奇,柯,SBC,JBA,地,水  O\n\n连续攻击 两次攻击  所有宠物 四大村,卡坦,多,柯,SBC,JBA,伊,火  O\n\n背水之战 1 防御-30%／攻击+30%  所有宠物 萨,加,卡,霍,乌,奇,柯,福,SBC,JBA,伊  O\n\n背水之战 2 防御-50%／攻击+50%  所有宠物 玛,卡,多多,福,SBC,JBA,伊,风,地  O\n\n料理 使用素材,制作料理  所有宠物 四大村, 火, 水, SBC,JBA  O\n\n加工 合成素材,制作道具  所有宠物 四大村,火,水,SBC,JBA  O\n\n泥醉攻击 攻击力-30%,敌单体三回合酒醉  所有宠物 萨, 卡, 乌, SBC, JBA, 地  O\n\n毒攻击 攻击力-30%,三回合前后让敌人中毒损血  所有宠物 达那, SBC, JBA  O\n\n猛毒攻击 攻击力-50%,敌人五回合中毒损血  所有宠物 霍, 奇, 柯, 达, SBC, JBA  O\n\n石化攻击 攻击力-30%,敌三回合石化  所有宠物 柯, 塔, 乌, SBC, JBA, 地  O\n\n催眠攻击 攻击力-30%,敌三回合睡眠  所有宠物 SBC, JBA  O\n\n忠犬 减低一半以上攻击力,会替主人抵挡攻击  所有宠物 四大村,霍,达,卡,柯,塔,多,乌,奇,柯,克,SBC,JBA,风  O\n\n一击必杀 攻击力增加倍, 命中率下降  所有宠物 柯, 塔, 达, 风  O\n\n地球一周 一回合离开, 然后从敌人背后以两倍攻击力攻击  所有宠物 卡, 柯, 达, SBC, JBA, 火, 地  O\n\n旅途伙伴 将敌人其中一人,带离现场（忠诚３０以下成功率达１００％）  所有宠物 霍, 柯, 塔, 多, 奇, 达, 柯, 福, SBC, JBA, 伊, 水  O\n\n三段攻击 连续攻击三次 所有宠物 北岛百人道场,火城  O\n\n突击 1回合不动, 第2回合以1倍攻击力攻击敌人  所有宠物 SBC, JBA, 地城  O\n\n双重突击 2回合不动, 第3回合以2倍攻击力攻击敌人  所有宠物 南岛百人道场, 风城  O\n\n混乱攻击 攻击力-30%,三回合前后让敌人混乱  所有宠物 SBC, JBA, 迷幻洞窟  O\n\n不防守战法 自己不进行攻击反击跟回避率就会变的非常高  所有宠物 SBC, JBA, 风  O\n\n修复 修复损坏的道具装备  所有宠物 火, 风, 地, 水  O\n==================================================================\n■罐头宠物技能:\n技能名称 技能解说 能学此技能之宠物 学习技能地点 可否遗传\n\n旅途伙伴2 将敌人其中一人,带离现场（忠诚６０以下成功率达１００％）  所有宠物 海底的真象任务有机会得到的奖品   O\n\n狂乱暴走 单回合普通攻击连续三次，目标三次随机 攻-20% 防-30%  所有宠物 海底的真象任务有机会得到的奖品   O\n\nMP２攻击 攻-50%， 令对手气-75%  凯恩(青龙) 斯洛克洞窟5楼打黑鸡   O\n\n回旋攻击 攻击下降50%可攻击敌人一排  2种海星、穿山甲系、羚羊系 在沙己夫换气道打宠技罐头   O\n\n针刺外皮 可令攻击者受到1/2的伤害  2种海参、2种螃蟹、乌龟系 在史东尔换气道打宠技罐头   O\n\n救援 牺牲自己50%HP.补至他人身上  所有宠物 解恶霸任务取得   O\n\n手下留情 用宠物打要抓的宠 可以把宠打到剩1滴血^__^ 抓宠来说很方便喔!  所有宠物 魔王竞技包礼品   O\n\n==================================================================\n■可学习之特殊技能:\n技能名称 技能解说 能学此技能之宠物  学习技能地点 可否遗传\n\nT一击必杀改 给予三倍的攻击伤害但是命中率下降  帖拉所伊朵(机暴) 限持有卡鲁它那庄园邀请函才能进入学习  X\n\nT不防守战法2 自己不进行攻击 反击跟回避率就会变的非常高  帖拉所伊朵(机暴) 限持有卡鲁它那庄园邀请函才能进入学习 X\n\nT不防守战法3 自己不进行攻击 反击跟回避率就会变的非常高  帖拉所伊朵(机暴) 限持有卡鲁它那庄园邀请函才能进入学习 O\n\nT四段攻击 四回连续攻击  帖拉所伊朵(机暴) 限持有卡鲁它那庄园邀请函才能进入学习  X\n\nT五段攻击 五回连续攻击  帖拉所伊朵(机暴) 限持有卡鲁它那庄园邀请函才能进入学习   O\n\nT背水之战其之三 防御力-50% 攻击力+80%  帖拉所伊朵(机暴) 限持有卡鲁它那庄园邀请函才能进入学习  X\n\n落马术 把敌方的座骑退出战斗  吉比(GP宠)、鸡系 限持有加加庄园邀请函才能进入学习   O\n\n虚弱术 被攻击者三回合内攻.防.敏下降20%  卡恩XX(1代蛇) 萨姆吉尔村宠物店   O\n\n嗜血术 攻击力下降30% 并将伤害值50%化为己有  卡恩XX(1代蛇) 萨姆吉尔村宠物店  O\n\n毒煞蔓延 让对手中毒 且有机会传染给周围的人  巴罗X(2代蛇) 达那-暴龙驯兽师  X\n\n沉默 敌全体无法使用咒术三回合(蒙奇基本技能)  蒙奇(猴子) 渔村(71.38)-特别技能训练师   O\n\n闪避术 三回合内闪避率上升60.有效时间三回合  蒙奇(猴子) 渔村(71.38)-特别技能训练师   O\n\n捐献 要求对方捐献石币  扑满乌力(金猪) 渔村(71.38)-特别技能训练师   O\n\n疾速攻击 敏+30% 防-30% 敌单体  艾迪希洛(机豹) 渔村(71.38)-特别技能训练师   O\n\n怯战 攻击力30%下降 防御力减50%下降 命中之敌会逃跑  帖尼X(龙蜥) 渔村(71.38)-特别技能训练师   O\n\nMP攻击 攻击力会稍微降低, 攻击敌单体同时损对方50%左右的气  凯恩(青龙) 渔村(71.38)-特别技能训练师   O\n\n暗夜变身 变身后增加30%的攻击力跟敏捷, 魔法防御值减半 有效时间五回合  XX巴肯(狼人) 渔村(71.38)-特别技能训练师X\n\n栗子连激 乱数连续投掷栗子3~5颗  波比(GP宠) 渔村(71.38)-特别技能训练师  X\n\n镶宝石 将提炼出的宝石镶在精工装备上  克克尔系 风城, 火城, 地城, 水城   O\n\n大地铠甲 我方全体防御力三回合内提升15%  赫拉克勒斯(地魔) 渔村(71.38)-特别技能训练师  X\n\n水灵滋润 我方全体体力300回复  洛奇斯德(水魔) 渔村(71.38)-特别技能训练师  X\n\n火焰威能 我方全体攻击力三回合内提升10%  翟贝里恩(火魔) 渔村(71.38)-特别技能训练师  X\n\n风之吹息 我方全体敏捷力三回合内提升15%  缪那(风魔) 渔村(71.38)-特别技能训练师  X\n\n魔之诅咒 把自己变成克对方的属性  雷帝斯洛(无魔) 渔村(71.38)-特别技能训练师  X\n\n音波冲击 攻击宠物时 可贯穿伤害至人物身上 伤害值为1/2  毕X斯(大嘴鸟) 达那-暴龙驯兽师   O\n\n撕裂伤口1 撕裂旧伤口 增加20％伤害  暴龙系(机暴除外） 达那-暴龙驯兽师   O\n\n撕裂伤口2 撕裂旧伤口 增加50％伤害  斑尼迪克(金暴) 达那-暴龙驯兽师   O\n\n火线猎杀 敌一排火焰攻击  菲奇亚(朱雀) 朱雀/玄武技能石任务   O\n\n铁壁 我防全体防御力+30%  美拉(玄武)、乌龟系 朱雀/玄武技能石任务   O\n==================================================================\n■先天特殊技能:\n技能名称 技能解说 能学此技能之宠物 学习技能地点 可否遗传\n\n狂暴攻击 攻+100% 防-30% 命中-30% 攻击3~10次 敌单体  朵巴奈特(黑暴)、鲁比(GP宠)  -  O\n\n破除防御2 敌防御时攻+30%.非敌防时防扣30% 戈登尔顿(金猩猩)  -  O\n\n媚惑术 可将敌方的【宠物】变成小狐狸；变成小狐狸的宠物只能使用一般的攻击、防御技能，其他的技能都会变成无法使用！  弗丽X(狐狸女)  -  O\n\n破除沈默 解除沈默状态  奇朋XX(猴年兽)  -  O\n\n难得糊涂 随机让对方产生异常状态（全体）或回覆（全体） 伦迪（麋鹿）  -  O"
