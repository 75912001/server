      content: "                                            ★魔法钻戒★\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n●什么是魔法钻戒？\n   魔法钻戒就是加了钻石的魔法戒指！\n●为什么要有魔法钻戒？\n   魔法钻戒可以交易，可以寄存，可以仍！而魔法戒指不能交易，仍和\n寄存！虽然魔法戒指仍了可以再拿，但毕竟很麻烦！魔法钻戒有以下几个\n用途：\n1.可以当成结婚戒指！求婚好用！\n2.拥有火魔法戒指3可以抓金暴(斑尼迪克)哦！【已经开放捕捉】\n3.可以给没有魔法戒指的人用！或者给自己的全攻号打灵石用！(想想就\n觉得可怕)，自己再去拿个普通的  魔法戒指就行了！\n●用钻戒放魔法有比用魔法戒指放魔法强吗？\n   没有！强度看有戒指的人的魔法熟练度而定！\n●如何拥有魔法钻戒呢？\n   想要有魔法钻戒，首先你得有魔法戒指！【表上有注明◎开放◎或者◎尚未开放◎】\n  ┌───────────────────────────────┐\n  │魔法戒指      │向谁拿                 │条件                 │\n　├───────────────────────────────┤\n  │地魔法戒指    │天空之岛的地守护雅尔丝 │打败地守护           │\n　├───────────────────────────────┤\n  │水魔法戒指    │天空之岛的水守护瓦琦儿 │打败水守护           │\n　├───────────────────────────────┤\n  │火魔法戒指    │天空之岛的火守护费尔叶 │打败火守护           │\n　├───────────────────────────────┤\n  │风魔法戒指    │天空之岛的风守护威恩德 │打败风守护           │\n　├───────────────────────────────┤\n  │地魔法戒指2   │伊甸园里的神秘老人     │做完神秘老人任务     │\n　├───────────────────────────────┤\n  │水魔法戒指2   │伊甸园里的神秘老人     │做完神秘老人任务     │\n　├───────────────────────────────┤\n  │火魔法戒指2   │幻影之界的黑暗精灵王   │打败幻影之界的精灵王 │\n　├───────────────────────────────┤\n  │风魔法戒指2   │幻影之界的黑暗精灵王   │打败幻影之界的精灵王 │\n　├───────────────────────────────┤\n  │地魔法戒指3   │贫民窟里的英嘉         │做完古瓜任务         │\n　├───────────────────────────────┤\n  │火魔法戒指3   │火精灵洞窟的沙拉曼达   │做完火灵勇士任务     │\n  └───────────────────────────────┘\n●这10种戒指有什么不一样呢？\n   请看下表\n  ┌───────────────────────────────┐\n  │魔法戒指      │魔法         │耗气    │效果                 │\n　├───────────────────────────────┤\n  │地魔法戒指    │岩石撞击     │10      │单体           [地]+3│\n　├───────────────────────────────┤\n  │水魔法戒指    │水柱         │10      │单体           [水]+3│\n　├───────────────────────────────┤\n  │火魔法戒指    │火球         │10      │单体           [火]+3│\n　├───────────────────────────────┤\n  │风魔法戒指    │风刃         │10      │单体           [风]+3│\n　├───────────────────────────────┤\n  │地魔法戒指2   │落石撞击     │20      │单体           [地]+4│\n　├───────────────────────────────┤\n  │水魔法戒指2   │水刃         │20      │单体           [水]+4│\n　├───────────────────────────────┤\n  │火魔法戒指2   │火焰连弹     │20      │单体           [火]+4│\n　├───────────────────────────────┤\n  │风魔法戒指2   │真空刃       │20      │单体           [风]+4│\n　├───────────────────────────────┤\n  │地魔法戒指3   │土石流       │20      │一排           [地]+4│\n　├───────────────────────────────┤\n  │火魔法戒指3   │蒸汽喷射     │20      │目标及左右     [火]+4│\n　└───────────────────────────────┘\n●魔法戒指或者钻石戒指可以升级吗？\n   不能！只能增加魔法熟练度！最高的魔法熟练度为99！\n●如何练魔法熟练度呢？\n   去阿布洞窟7楼用魔法戒指打阿布三兄弟练熟练度！\n●需要练多久才能到99熟练度呢？\n   用3级魔法戒指练的话很快，用脚本挂熟练度，差不多2个小时就有95\n   的熟练度了！\n   用1级魔法戒指练熟练度很慢！不建议用1级，2级的戒指练熟练度！\n●转生后或者把戒指仍掉后，熟练度会有变化吗？\n   不会！！因为熟练度练多少就是多少！\n●魔法熟练度会降吗？\n   会的！如果你先练水魔法！再练地魔法！水魔法熟练度就会下降！先\n   练地魔法，再练水魔法\n   地魔法熟练度就不会下降！规律就是！地升水降，水升火降，火升风\n   降，风升地降！\n●钻石要到哪里去打？\n  ┌───────────────────────────────┐\n  │ 素材│ 素材名称     │ 掉落地点           │ 素材宠物        │\n  ├───────────────────────────────┤\n  │钻石 │ 钻  石矿     │ 漆黑洞窟19或者20   │100级的帖拉所伊朵│\n  └───────────────────────────────┘\n要有耐心，不要打不到就说不打了！原则上打1000只机暴出1块钻石矿就\n算快了！\n●打钻石矿需要什么条件吗？\n   只要你走得到漆黑19或者20楼就会遇到机暴群。打死机暴群就有机会\n   得到钻石矿！\n●打到了钻石矿之后要怎么办呢？\n   打到了之后就去地城西南区(20.16)找宝石提炼师，他会帮你提炼出\n   钻石的！要收费！不过要3颗钻石矿才能提炼出一颗钻石哦！\n●有了钻石和魔法戒指之后要怎么做呢？\n   看要做什么属性的钻戒就去找什么魔法钻戒精工师吧！具体如下\n  ┌───────────────────────────────┐\n  │精工师            │地点                │精工物品            │\n　├───────────────────────────────┤\n  │                  │                    │1个钻石＋地魔法戒指 │\n  │地魔法钻戒精工师  │地城西南区(20.16)   │4个钻石＋地魔法戒指2│\n  │                  │                    │6个钻石＋地魔法戒指3│\n　├───────────────────────────────┤\n  │水魔法钻戒精工师  │水城旅馆(29.27)     │1个钻石＋水魔法戒指 │\n  │                  │                    │4个钻石＋水魔法戒指2│\n　├───────────────────────────────┤\n  │                  │                    │1个钻石＋火魔法戒指 │\n  │火魔法钻戒精工师  │火城(101.106)       │4个钻石＋火魔法戒指2│\n  │                  │                    │6个钻石＋火魔法戒指3│\n　├───────────────────────────────┤\n  │风魔法钻戒精工师  │风城(44.101)        │1个钻石＋风魔法戒指 │\n  │                  │                    │4个钻石＋风魔法戒指2│\n　└───────────────────────────────┘\n●魔法最高是几级？\n  魔法的最高等级为lv5！叫“毁天灭地”，在伊甸园（49.130）的钻戒\n  精工师可以帮你封印\n需要13个钻石+魔法戒指5！"
