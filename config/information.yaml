      content: "作者：WY_流浪稻草人\n\n经过５．０到７．０这段时间～我喜欢融合热爱融合～也对融合有很大的兴趣～这段时间来我觉得有必要把自己所想的说出来～希望高手不要丢圣兽～\n\n\n　　本人觉得融合Ｃ的最重要的是转Ｃ，前几天看了一位社区长老的精华，我也深有感触，边将自己的１２６的甲和５．５的１２９快升１３０的机猫拿去转～猫用８．５的ＭＭ甲用８．７５的ＭＭ结果转出来这只猫的长却到了６．３我的８．７的ＭＭ转的一只５．７的猫也才６．２５\n～拿了些Ｃ做了实验觉得魅力运气都重要～走前先算好运气～相信带个月神跑上去很快吧！应该不会转运转的太快～～\n\n　　等有了自己准备的主体转了最好练到１２５以上～只是建议～我人为Ｃ的等级高融合不好～\n等级低也不好～我合Ｃ普遍是在１２５到１３０左右～这样的话不低不高～　　客１很多人说等级无关跟我的试验～客１能影响０．０９到０．１的的成长率～我的每一个准备的Ｃ都是在１２１级左右！不信克以去试试～\n\n　　关于客２是最头疼的～因为跟主体跟客１有关～主体跟客１的４Ｖ哪个低～和客１的哪个低练上几只Ｃ看看哪个最能补缺～这样就能充分发挥优势和作用～关于我的融合经验像合加雷飞马～的敏Ｃ的话最好是用敏鱼拉～攻Ｃ的话最好用金猩猩！防Ｃ最好是用火的大头龙～攻敏型的最好是用地大头龙～因为地的是攻敏型的能修改成长！～　如果是用长低的融合的话成长才是最重要！长越高参加融合最好～但也应该遵守用敏鱼还是大头龙还是什么的！\n\n　　　还有喂出的蛋跟Ｃ的成长有关～因为你的蛋好你的Ｃ成长就好～但你的蛋差决不可能喂出很好很好的Ｃ没个蛋的４Ｖ都跟合蛋前的Ｃ和暴蛋了的Ｃ有关～蛋好的长一般最差不低与６．６\n蛋一般的在６．４～６．８左右～但差的就不用说了～～总之一句话你的Ｃ好合的蛋就好等级高成长高～就好～但是你想单独突出一方面如全攻全防全敏的话长一般是不会超过６．８＼９左右的！因为我喂的最好的一个蛋机猫青龙合的全敏Ｃ敏还不错就是长才６．４～稍后把图奉上～但是一般的蛋也能喂出极品来～那就没有突出的了～因为这样均衡才能长高！你就得针对各自合前的Ｃ的４Ｖ和蛋的４Ｖ来增补了！你Ｃ的４Ｖ都是冬高敏高血低防地的话～血５敏１０Ｇ２０Ｆ５能修正～这样能上６．５～如果不够的话只能放弃攻了但这样练来就没用了！长高当装饰吗？个人不建议这样！喂蛋除了喂全敏全防的话不建议！就算喂全血都不行血喂１５就很多了因为不可能你用全不血高的Ｃ合喂全血药血不可能超过２５００吧！被淘汰的机暴ＮＯ一下照飞合来也没什么用吧！所以得针对蛋的４Ｖ喂！哪个低得喂哪个血低喂５个血防低喂５个防！敏怎么都不能低与１０除非你喂全攻全防！除非你喂低敏沉默！攻最好不要少于１５个但是得针对你蛋的４Ｖ！蛋的４Ｖ好也有时喂不出长好的Ｃ但决对有一个突出～要注意的：：：因为你的敏高喂全攻的话～攻不会太高敏也不会太突出～我就在近期又作出了实验证明：用敏机猫（敏算高的了)＋敏型ＧＰ（这是我小ＧＰ中敏最高的)＋金猩猩敏还行!想放弃敏的还是喂了7个敏喂了33个攻结果出来的肥龙却是攻不高敏不高的C长本来6.9被我一练减到6.79了!稍后付图!\n下面是从其他的网上摘抄我认同的观点~也有自己的补充和修改~\n\n前题条件：融出一只很不错的宠有2个必要条件。\n\n1：参于融合主体与客体2的选择。\n\n2：喂药剂：因7.0与之前其他版本，在喂药剂上对融合宠的影响不一样，所以对部分融合宠，不建议喂40颗同种药剂。\n\n现PK场上的主角：熊类 球类 海龙类 肥龙类 飞马类 简单把它们归纳为五大类\n\n以狂暴融合为主题开始。\n狂暴熊类：无论主体或客体都用无转宠.\n\n风熊\n\n主体：培罗多  客体1：鲁比/火牛 客体2：克雷多\n\n因为培罗多成长很强劲，一般情况下融出的风熊，很轻松就能过7点。\n\n水熊（狂暴）\n\n主体：克雷多 客体1：鲁比/火牛 客体2：克雷多\n\n大致上与融合风熊相同，喂30攻，10敏应该是比较不错的选择。\n\n\n白熊（狂暴）\n\n主体：金猩猩  客1：鲁比/火牛 客2：野黑龙\n\n破蛋后：白熊攻上460是较容易的。\n\n关键是敏捷：选金猩猩与黑人龙时，特别注意攻敏。\n\n海龙类：\n\n水海龙：\n\n主体：牛（必转） 客体1：蓝人龙 出来D水海龙，攻击可达到480攻击上限。\n\n客体2采用：克雷多，金猩猩，黑人龙。\n\n在无牛D情况下：\n\n主体：红暴（必转）客体1：鲁比 客体2：黑龙/转机豹。\n\n这样合也粉有可能过7点成长，攻击上面也不会太次，完全可达450↑。\n\n喂药：40攻\n\n红海龙（狂暴/撕列2）：\n\n主体：金暴 客体1：鲁比/火牛  客体2：转机猫，培罗多。\n\n机猫与培罗多本身敏具佳，那么可以完全喂40功药剂。\n\n如求攻敏型红海龙。\n\n0k 偶来讲讲，前提条件：转金暴（注：攻敏具佳） 客体2：转机猫（攻敏具佳）\n\n喂药：30攻 10敏\n\n当然主体也可以采用无转金暴，不过个人觉得敏很难接近280。\n\n肥龙类：\n\n水肥龙（怯战/狂暴）\n\n因为7.0史卡鲁不能参于融合，这一项可以去掉。\n\n主体：转火蜥  客体1：大GP  客体2：克雷多\n\n喂药：40攻\n稻草人;我人为现在却战还有用不同意却战垃圾的想法可能是个人喜爱不同吧!\n\n红肥龙（狂暴/落马）\n\n主体：牛（必转） 客体1：吉比\n\n6.0的时候大家都在客体2上放黑龙或金猩猩。\n\n现在7.0了，偶建议客体2放克雷多，总体上强过金猩猩，攻击上也不会比黑龙逊色多少。\n\n地肥龙（狂暴）\n\n主体：机豹（必转） 客体1：鲁比或牛\n\n主体采用地水蜥蜴也可以，但蜥蜴敏捷远不及机豹那么有优势了（不过多了1个无用的怯战技）\n\n建议客体2：除了克雷多外，采用培罗多也是很不错的，总体成长很强，但攻击效果就没有\n克雷多来得明显，不建议客体2放黑人龙。\n\n喂药：不建单喂40攻，喂35--37攻足够了，剩下喂几个敏药剂。\n\n\n吉比+鲁比（落马/狂暴）\n\n主体：吉比（必转）\n\n因为主体吉比攻击上天生欠缺，建议客体2采用，金猩猩与黑人龙。\n\n球类\n\n风球,火球（狂暴/落马）\n\n主体：火牛（必转） 客体1：黄鸡 客体2：7.0敏鱼/黑人龙\n\n合出来1般情况下上7基本上是90%，当然主体转火牛，成长要好点最底也要6.7X。\n\n喂药：如果用野黑龙40攻药剂，用敏鱼20攻/20敏。\n\n（偶比较喜欢用牛+黄鸡+黑龙融出的风球）\n\n火球（落马/撕裂2） 除了客体1 放其他色鸡外，其于如同融合风球一样。\n\n普通战宠：\n\n落马/撕列2类\n\n风球.火球：\n\n主体用不转的金暴合出效果更好，不足就是血相对次了。\n\n主体：金暴（无转5.9↑） 客体1：黄鸡  客体2：培罗多/敏鱼\n\n用敏鱼作客体2自然而然，喂20攻/20敏。\n\n火球（落马/撕裂2） 除了客体1放其他色鸡外，其于如同融合风球一样。\n\n如以后开了MP2攻击，大家可以援用这套风球融合法，把客体1换成青龙就好了。\n稻草人:本人觉的BOX上面这位说的~我不是很赞同~用MP2的话不是很好因为青龙是纪念的!圣兽容合了就废了~我的MP绿肥都废了~不直钱~\n\n加雷（重点说下）\n\n在无火蜥的情况下：强烈建议采用转红暴作主体。\n\n客体2：现已经7.0了，所以客体2建议用飞鱼。（不建议采用恐龙类）\n\n转红暴（成长越佳越好）+黄鸡+无转飞鱼\n\n喂药：有2种方法\n\n1：40敏 全力拉敏 把敏提到极限（完全可以达到360敏）\n\n1：20攻 10防 10敏（个人猜想即便喂10敏，破蛋后的加雷也应在300敏之上）\n\n这样平均喂药破蛋后加雷完全可达到极限成长7.0↑\n\n飞马类\n\n水飞马（落马）\n\n主体：克雷多 客体1：任意鸡类 客体2：7.0飞鱼或培罗多\n\n这种融法已经无争议了，这样融出的飞马成长7.0↑很轻松。\n\n喂药：随个人对敏需要一般20攻 20敏\n\n建议客体2：敏鱼与培罗多随自己需要选择。\n\n稻草人:这是我人为最好的贫民C了~合法简单实用性强~\n\n沉默类\n\n高敏3技：\n\n主体：转GP/转鸡/转青龙   客体2：风月兔/飞鱼！\n\n6.0的时候，就可以融出400敏↑3技了，当然是指MP攻击的。\n\n落马技，能不能融出400敏↑三技，未知数，不过主体用转鸡，380↑还是比较容易的。\n\n如客体2换作：7.0敏鱼，那么完全可以过390敏。\n\n如以后开了MP2攻击，可以用转青龙作主体，敏鱼作客体2。\n\n上400敏也是很简单的一件事。\n\n底敏类沉默：\n\n随着华裔推出“净化罐头”。 净化罐头=净化精灵2\n\n7.0很好用的沉默宠当属“底敏”类沉默（风熊，地肥，水海马，地海马，）\n\n风熊：穿山甲+猴子+？\n\n水海马：野蓝龟+猴子+？\n\n地肥：野蓝雷+猴子+？ （血多看着舒坦）\n\n地海马：石龟+猴子+？\n\n水熊：水怪+猴子？\n\n不论系主体 客1 2 都8要用转宠融合。\n\n客体2：石龟 蓝雷 穿山甲 灰雷龙。\n\n这类底敏融合成长很垃圾，总体很难过6点。\n\n成长不要看得太重，主要是长防上去了。\n\n底敏沉默吃了净化罐头，大家可以想想是什么效果。\n稻草人:其实长不要看得那么重要~重要是有一项可观的,但你没什么好的地方的话就废了~低敏净化比较好~代替了E生了!\n\n内定成长粉高D宠：\n\n转红暴  野黑龙 金暴 金猩猩 恐龙系 敏鱼系\n\n（除红暴需转外 其他几类宠参于融合8建议去转）\n\n为什么要把转红暴归于内定成长高的宠：\n解答：因为转红暴参于融合，拉总成长很高，这类例子很多。\n\n接下来偶们来比较1下客体2的选择：\n\n机豹/金猩猩/野黑龙/金暴/敏鱼/克雷多/培罗多（飞鱼成长高且敏突出，如不刻意求敏，还是用培罗多较好。）\n\n7.0 基本上金猩猩，可以被淘汰了。\n\n强攻型融合宠：客体2，金暴太奢侈，且效果不如克雷多或野黑龙来得好。\n\n攻敏型融合宠：培罗多，机猫，敏鱼。\n\n抓野生宠参于融合：\n\n首先我说下自己对客体1参于融合的宠看法。\n\n其实等段 成长 都无所谓。\n\n我就不明白为什么很多玩家，都要去练到80段↑才融合，我一直都很随意。\n\n黄鸡：我都是自接去玄黄洞抓的野黄鸡 等段就5X--6X。\n\n象大GP 拿出来是多少段就多少段合啦，觉得无所谓，1级还不是一样合出\n\n很多过7点的狂暴宠。\n\n主体和客体2，过100段就可以融合了。\n\n抓野黑龙：抓9X段 1段4围请用 0 0 0 0 计算。3围成长4.95↑ 攻击2.5↑ （切记切记）\n\n抓野黄鸡：因为黄鸡或其他鸡类，都是用来作客体1，抓5X--6X黄鸡就可以了，其他随意。\n\n——————————————————————————————————————\n\n总结：\n\n蛋的4围绝对不代表破蛋后宠的成长。\n相对来讲用转宠融合的蛋，4围都要比无转宠融出的蛋4围高2--4个点数。\n转与无转宠参于融合，破蛋以后唯一差距就是血。\n单求融合宠一项上成长高 喂40颗同种药剂，当然7.0与6.0在喂药方面有一定的区别，不是每个融合蛋都可以喂40颗同种药剂。\n求总体成长高，请您参照参于融合的主体宠分配去喂药。\n\n\n下面是低敏沉默的,个人认为在战队不够分配E生分不过来的话~用不错就顺便提一下!\n\n地海马：转石龟+猴+转石龟   成长11。5   5。01\n1级59 12 14 2。预测140 1658 263 394 65\n\n\n火海马：转龟之钢+猴+转龟之钢  成长12。05  5。57\n1级63 12 16 4（蛋的血最差但出C的血最好）预测140 1738 326 370 106  唯一用的2代C\n\n风熊：转绿穿+猴+转绿穿   成长11。24   5。8\n1级61 11 16 3  预测140 1624 316 431 89\n\n水海马：转蓝龟+猴+转蓝龟   成长10。52  4。32（超时3小时，而且比其它蛋早产4小时）\n1级57 9 11 1（蛋57 9 11 2）预测140 1520 262 323 35\n\n合成素材是：石龟*2   蓝龟*2   绿穿*2  龟之钢*2\n无敏MM8只：基本4围均在1195  197 198 14左右\n转出的C除了蓝龟血防变化比较大外，其它基本都是加了少许血，降了少许敏。对于防是石龟降防多，穿基本没变，龟之钢基本没变。\n总成长也基本都在5左右，血在10左右。敏都控制在了0。5以下。蓝龟是最好的，血11。5，长5。2多。\n这次实验可以讲失败，地海马没出沉默。水海马超时早产。\n从配方和无敏MM转C看出，要想绝对低敏就没有高成长。反之亦然。\n并发现7。0融合C的敏比相同配方的5。0的融合C敏和防的成长有很大的区别。5。0合的转绿穿*3防是486敏是126，7。0相同配方出的飞机头却是防434敏173\n希望大家能把用低敏没转C合的低敏沉默发来做比较。或用正常MM或无敏MM转的1代雷和转的2代雷做主体和的低敏沉默C来做比较。\n让大家能知道那种方法最好。\n\n提醒大家,不要追求无敏MM,练着看MM的成长和转了C后的成长\n\n\n求攻击变态性的：没转的金暴（5.85）+大GP/牛+金星\n     （5.95）=火海马 全喂40功药\n\n      求攻敏型的：  转金暴（6.75）+大GP/牛+大头绿龙\n     （6.15）=火海马 喂20/20攻敏\n\n      转金暴（6.75）+大GP+7.0敏鱼（6.1）=火海马喂\n      30/10攻敏\n\n      转牛+蓝人龙+克雷多/野黑龙/金星=水海马 全喂40攻\n      击\n\n      克雷多+大GP/牛+克雷多=水熊 喂35攻/5敏\n\n      大头绿龙+大GP/牛+大头绿龙/克雷多=风熊\n      喂35攻/5敏\n\n      金星+大GP/牛+克雷多/大头绿龙/金暴=白熊\n      喂35攻/5敏或40攻\n\n      转火牛+里拉拉+黑龙=弗利修水4火6 （飞机头）\n      喂40攻\n\n高敏罗马技能：\n\n      求全敏型的：转齐宝+猴子+7.0敏鱼=火海马\n      喂：30敏/10攻\n\n      求攻敏型的：转小GP+猴子+大头龙（绿）=地\n      肥龙 喂：30敏/10攻\n\n      求攻敏型的：转猴子（最好5.9以上）+齐宝+\n      大头绿龙=火球 喂20攻/20敏\n\n      金暴+小GP+7.0敏鱼=5地/5水海龙 喂20G/20M\n\n      转摩里+猴子+7.0敏鱼=地海马 喂30M 10攻\n\n低敏沉没2技能：\n\n      野生蓝雷（只选择防御/血高的就行/其他越低越好）+\n      猴子+野生大象（血防高就好）=地肥\n      喂25防 15血\n      朋友曾经以此配方融合出敏LV140在62！\n\n撕2罗马2技能：\n      金暴+鸡+克雷多/大头绿龙/7.0敏鱼=球类\n      求攻高的：金暴+鸡+克雷多  30攻/10敏\n      求攻敏的：金暴+鸡+大头绿  20攻/10敏\n      求攻敏的：转金暴+鸡+7.0敏鱼 30攻/10敏\n\n加雷（穷人版）：\n      转红暴+克克鸡+7.0敏鱼/大头绿龙=加雷\n      喂30G/10M\n      转野红暴+克克鸡+大头绿龙（最好的选择）\n      难度教大！按蛋3围喂药\n     （富人版）：\n      转水年+克克鸡+克雷多 喂：25敏 15攻\n      转欧西摩米（人鱼）+克克鸡+7.0敏鱼 喂30攻 10敏\n      转火蜥+克克鸡+克雷多 喂：20攻/20敏\n      转卡恩米兹（端牛）+克克鸡+大头绿龙 喂20攻 20敏\n撕1落马2技能（穷人版）：\n      推介：野黑暴（5.1以上）+野鸡+野黑暴\n      =球类 平均喂药/10/10/10/10\n飞马类（穷人终极选择）\n      克雷多+野鸡+克雷多/大头绿龙\n      金星星+野鸡+克雷多/大头绿龙/金星/\n      转白星星+野鸡+黑暴/克雷多\n飞机头（白狼专用）\n      斑尼迪克+多瑞里+黑人龙/金星6.0以上=水4\n      火6飞机头\n      斑尼迪克+加比奥+黑人龙/金星6.0以上=火4\n      风6飞机头\n      转火牛+里拉拉（来吉卡）+金星星=水4火6飞\n      机头\n纯野生融合C：\n      野黑暴+野黑暴+野黑暴=火肥龙\n      野黑暴+玄黄野鸡60X+野黑暴=风球\n      野黑暴+齐宝+野黑暴=火球\n      野黑暴+野黑人龙+黑人龙=白熊\n      野黑人龙+黑暴+野黑人龙=白熊\n      野黑人龙+野蓝人龙+野黑人龙=水海马\n      野黑人龙+野黑人龙+野黑人龙=火海马\n      野黑人龙+地人龙+野黑人龙=地海马\n      野黑人龙+金飞+野黑人龙=火飞马\n      野黑人龙+踏斯夫（伊园外有）+野生羊\n      野黑暴+卡卡青蛙+野黑龙\n      以上均为全野！只是提供参考！\n客2推介选择：\n      攻击型：黑人龙/金星星/金暴/克雷多\n      攻敏型：克雷多/机豹（必转）/\n      全敏型：7.0敏鱼\n      防御型：甲类/龟类 级别建议：\n      一般LV90以上，最好LV100以上！还有就是建议主体与客2的级别相差别太大，最好是同一等级，例如主-LV97，客2-LV90以上。另外在选客2的时候可以用喂药来达到一定的控制！例如！要求功敏的型的融合C，只要主体攻击不错，那么客2选用7.0敏鱼，喂30G/10M，那结果还令人满意D（随个人所好）\n最后总结：\n        7.0客2在修正这方面的作用可以说是很重要的，所以不要以为无所谓哦！！呵呵~还有就是要求单方面极限（例如攻击/敏）！那么在一定程度上会降低一定的成长！按蛋3围喂药是提高成长的重要因数！但也并非是全部！主体的作用不用我说了吧~呵呵！但有点我要强调的是！在主体较差的情况下~可以用成长教好的C做客2来修正！效果很明显的！至于客1，我想没什么所谓吧~有时间练到LV70以上，没时间就野生的吧！再来就是融合技能遗传问题啦！！首先我是说给非高手的人听哦！高手别笑话！我有一个ID是专门融合C的，至于极不极品我是不敢说咯！但技能的我还很少失手的！目前为止我融合有30只C左右吧（不算多），失败损失有一只牛/一只猴子（6.0的时候没沉没），7只狂暴顺利成功！也许这是运气问题！但方法还是能给大家说说~有不同意见的别看\n，小弟在此谢过！\n一、创建新人物 豆丁（骑绿虎那个） 魅力80左右 属性5火5\n    水。这是我自己用来融合的人~呵呵~别笑话！方法如\n    下：\n        1、中吉运气！不推介大吉！（在中吉的运气，技能\n        我不敢说100/100但出来的蛋不会太差。技能遗传比\n        较稳定，有些人可能有疑问，所以随个人所好，但\n        我个人还是觉得尤其必要的）。\n        2、多做实验！拿撕2狂暴为例子！鱼村抓猪，主体\n        三格学料理，客1三格学破除防御，然后开始做实验\n        ，用一小本记录融合的遗传的登记！慢慢的掌握其\n        融合遗传的规律！10次内最好不要融合，别太急！\n        因为规律还不稳定！循环做！一直到15次以上！本\n        人成功的遗传次数最都多的是在31次/17次，看你个\n        人啦~有何疑问，信得过我的话，在融合做实验的时\n        候把融合登记的信息传给我，我会努力帮你D！\n        3、最后融合成功后！请登出在重进！别急着练！这\n        样我个人感觉会比较好！因为我有两次没登出！两\n        只的成长不是那么理想！（随个人所好！） 二、至于3技沉落闪，实验次数可以相对减少，具体有2种方法：\n        第1种：主体全学罗马，客1学满沉默闪避，然后进\n        行融合。成功率还算不错。\n        第2种：交叉融合遗传，主体246格学罗马，1357学\n        沉默闪避。\n\n上面局部是摘抄于BOX上的~只是不是觉的比较好就拿来用了~也不用一下看那么多我觉得都比叫有用!\n\n\n本文作者总结:这是文章曾在中网10先试发一次,后来还行就转到主题来了~希望不要建议~我对融合有着极大的兴趣也希望能帮到人~初次写希望能不要开骂~谢谢~\n其实我一直在努力想分高了为爱融合的人开一个融合专区,但分不够,希望那一天,喜欢融合的哈人为写的看得过去的人支持一下!谢谢~稻草人在这先谢谢了!\n\n本人为网10元老但号被删6个被盗一个忘记一个!现在又在拼博中把前2日刚刚孵化的2只C发来一下是垃圾J只是刚刚回来~C都不太好我会继续努力希望能帮到爱融合的人~希望能跟小黑一样随叫随到!谢谢~QQ:172949219\n"
