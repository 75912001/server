    - path: ["『Stone Walker 功能说明』"]
      content: "                                    【First  Message  说 明 】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n程序：Stone-Walker                                 制作：『悟空』\n\n制作者：『韩天阳』\n\n说明：Stone－Walker－First－Message  又名《STW情报》，是由韩天阳新整理的最新石器时代情报，辅助工具STW共享\n∮木♂乃♀伊∮:借助韩天阳的情报,本人自行增加几项任务\n\n中心地址：\n\n·http://bbs.tt2xz.com/\n\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
    - path: ["『Stone Walker 功能说明』", "【智能脚本----新型脚本格式诞生】"]
      content: "【智能脚本----新型脚本格式诞生】\n\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n对话 对话内容 颜色\n信息 信息内容(弹出对话框提示)\n清屏\n\n鼠移 X Y\n左按 X Y\n双击 X Y\n鼠标 X Y\n右按 X Y\n\n二步 X Y\n坐标 X Y\n切换地图 X Y\n地图 地图号\n人物方向 {东|南|西|北|东南|西北|西南|东北}\n\n料理 宠物位置(1-5) 宠物技能(1-7) 道具位置(1-15)[例:料理 1 2 5|6|7]\n合成 宠物位置(1-5) 宠物技能(1-7) 道具位置(1-15)[例:合成 1 2 5|6|7]\n设定等待 {地图,180000|对话框,180000|战斗,180000|听见,180000}\n设定 {快速遇敌|快速走路|自动逃跑|自动捕宠|快速战斗|原地锁定|显示经验}\n取消 {快速遇敌|快速走路|自动逃跑|自动捕宠|快速战斗|原地锁定|显示经验}\n银行 {个人|家族},数目(负数为取钱)\n战宠 宠物索引(1-5)|收回(0)\n锁定 {宠名|宠名}(无宠名为取消锁定)\n移动道具 1-15,1-15\n丢弃道具 1|1-15|名字|说明,个数\n使用道具 {位置(1-15)|名称|说明}[,对象=0[,最多使用个数=1]]\n\n(以下指令设置正确错误标记,可以用\"错误 跳转\"\"正确 跳转\"控制脚本流程)\n道具数 {名称|说明|*}(1-15),{==|!=|>|>=|<|<=},数量\n道具有 101-105|1-15|?|*,{名称|说明}\n道具空 101-105|1-15|?|*\n队员数 {==|!=|>|>=|<|<=},数量\n宠物有 宠物位置(1-5),{名称|昵称}\n宠物数 {昵称|名称|*},{==|!=|>|>=|<|<=},数量\n人物状态 {LV|HP|MP|石币|攻击|防御|敏捷|魅力|转生},{==|!=|>|>=|<|<=},数值\n宠物状态 宠物位置(1-5),{LV|HP|攻击|防御|敏捷|忠诚},{==|!=|>|>=|<|<=},数值\n对话框 对话框内容(出来对话框,没有指定内容,就设置错误标记后返回)\n\n\n(以下指令控制脚本的流程)\n标记 标记名称\n跳转 标记名称\n错误跳转 标记名称(跟在执行设置正确错误标记的指令后，控制脚本流程转向)\n正确跳转 标记名称(跟在执行设置正确错误标记的指令后，控制脚本流程转向)\n结束\n暂停\n听见 内容(等带系统出现指定内容的话才返回)\n延迟 延迟时间(毫秒)\n战斗 {开始|结束}(一直等到战斗开始或战斗结束才返回)\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
    - path: ["『Stone Walker 功能说明』", "【地图显示功能】"]
      content: "【地图显示功能】\n\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n所谓的地图显示，就是为了玩家以后制作脚本或者迷路的时候起到向导的作用！\n\n在外挂主控界面的最左下方的按钮！只要按1下即可！\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n6.09版新增加 “地图显示点击走动” 功能\n\n只需要在地图显示中，用鼠标在你想去的地方点下右键就OK！\n\n可以更加快捷的在大范围内快速走动！\n\n（注意事项：使用本功能最好把整个地图方法，按焦点后再用鼠标走动）\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n⑴座标:当你选择了这个选项时,在地图显示的窗口里将会出现与当前地图相关连的地点的座标.\n⑵焦点:当你选择了这个选项时,在地图显示的窗口里的地图将会把你所在的位置 放在窗口中央.\n\n【编辑：韩天阳】"
    - path: ["『Stone Walker 功能说明』", "【不耗CPU多开挂机经验】"]
      content: "【不耗CPU多开挂机经验】\n\n怎么样可以多开挂机？？多开挂机并且占CPU少呢？？\n\n1.打开外挂，登陆石器后，你设置好外挂无须在石器主界面活动\n\n2.按隐藏石器，并且把外挂锁屏，这样耗资源仅10%左右\n\n-------------------------------------------------------------------\n\n\n测试数据：\n\n测试平台\n\nPIII\n256M内存/普通显卡/ADSL 10M\n\n测试外挂\n\n10开和杀毒软件在后台运作，不开任何QQ和其他软件情况下\n\n测试效果\n\n资源损耗仅30%"
    - path: ["『Stone Walker 功能说明』", "【自动送气资料】"]
      content: "【自动送气资料】\n\n自动送气地点资料：\n\n1.在阿布洞7楼卖水人前\n2.在加加医院（坐标16.20）\n3.萨村医院（坐标14.15）\n4.风城医院（坐标24.15）\n5.竞技场（坐标28.5）\n\n自动送气增加辅助功能介绍\n\n\n在你选择好对象后，可以进行对方邮件查询功能，可以查询对方道具拦空位的多少，然后再作出送气。\n\n（送气注意事项：为了防止网络掉线等原因，请务必去抓野生宠作为邮寄宠物）"
    - path: ["『Stone Walker 功能说明』", "【黑名单功能】"]
      content: "【黑名单功能】\n\n\n为了各位带挂的队长们的方便，STW特别推出【黑名单功能】\n\n在这里可以设置那些人可以加入队伍，那些人如果加入直接T出队伍！\n\n只要在队员那里选上，然后点击【添加】即可！～"
    - path: ["『Stone Walker 功能说明』", "【封包脚本---料理声望】"]
      content: "【封包脚本---料理声望】\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n                【  1.82、2.0  服 务 器 】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n1.按照外挂提示准备好料理宠物（放在适当位置，这里不详细说明了！）\n\n2.空出10格（最好全部清除）\n\n3.运行脚本即可挂\n【1.82和2.0服务器分为赚钱料理和声望料理，依照自己想要什么来决定料理什么】\n\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n                【  6.0  服  务  器  】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n1.按照外挂提示准备好料理宠物（放在适当位置，这里不详细说明了！）\n\n2.空出10格（最好全部清除）\n\n3.运行脚本即可挂\n\n【推荐：用上原地锁定，增加稳定率！】\n\n\n\n【编辑：韩天阳】\n\n『石器时代7.5声望有时间限制，已经被封！』"
