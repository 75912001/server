      content: "『7.5任务』渔村矿石任务\n作者：韩天阳\n\n任务条件：解完成人仪式（可重复解）\n建议等级：80级以上\n任务流程：\n\n先到鱼村（87.95）和矿石研究生接任务，接完他会任务他会给你一张“指引地图”。\n再去龟洞4楼（2.0打石龟的地方）打60—70级的石龟，打完后有机会得到“奇怪的矿石”。再回鱼村和矿石研究生说话，会得到奖品。\n\n战利品：一粒奇怪的石头可换取1000S石币，不可叠加"
