      content: " ┌───────────────────────────────-┐\n │ 莫非的枪                                                      │\n │                                                               │\n │ 任务条件：解过成人礼，建议等级50级以上                        │\n │                                                               │\n │ 任务攻略：  在南岛的多多村找莫非（45。44）接下任务，他会告诉  │\n │ 你在阿斯玛鲁矿山的某一楼层有吉岩矿的矿石可以采，想请你帮他去  │\n │ 打吉岩矿的矿石，它会给你一把开采用的小斧头，拿到之后就出发前  │\n │ 往阿斯玛鲁矿山，这边已经遇过每个楼层，只有4楼会遇到LV55的吉岩 │\n │ 矿石，打完会得吉岩矿（记得要打2个矿石回去唷）拿回去给莫非，他 │\n │ 会把你打给他的矿石做成吉岩枪送给你，之后他又会对你说可以封印  │\n │ 精灵（就是可以加上精灵唷），但是精灵草被小毛贼偷走了，希望你  │\n │ 帮他拿回来以便封印吉岩枪，他会提示你小毛贼会在强恩洞窟2楼或3  │\n │ 楼出现，即刻前往强恩洞窟，在2楼或是3楼遇到LV40的小毛贼（不用  │\n │ 怕，他很嫩的），打完之后可得精灵草，再拿回去给莫非，便帮你将  │\n │ 吉岩枪封印精灵                                                │\n │                                                               │\n │                                                               │\n │ 奖品--吉岩枪(攻+44敏-10魅+5昏睡5全体)                         │\n │                                                               │\n │                                                               │\n └───────────────────────────────-┘"
