      content: "作者：WY_qyba\n\n首先人物方面最少需要的属性\nHP:1000 MP:290 攻 敏 防 随意\n\n魔法基本需要 嗜血90% 换影80%↑[90%↓的每五回合使用 90%↑的每六回合使用]\n             火球星80%↑ 冰箭80↑ 冰镜80%↑\n\n装备方面基本需要 回避10 [兜、铠、腰带、鞋]加起来有MP:290就可以了其他随意 不带复活\n                 左手 叉\n\n宠物方面:顶飞C一只.建议90野灰雷 (100忠) 家族料理猪 骑C一只(除小甲外都可以)\n\n         像我一样有条件可以带只不差的140转机暴(会忠)\n\n物品方面:建议带:[花枝4 螃蟹4 胡椒4 水4 (各4个)]+100气的 +50忠一个\n\n打法:1~95 除小王外全部火球星搞定 小王带忠犬C出来顶.不加血 其他不带\n     90~132 全部放冰镜 每次都放忠犬C 100楼上了 C死不减忠\n     120&132 BOSS 顶死C一定要满血放出.\n\n先注明一下.这里是使用小明外挂快速闯关的方法,当然.人手也可以.\n\n这里说一说详细过程\n\n1~40楼的小兵我是用暴暴的T背3+火球星过.所以特别快.一般5个回合就过了..\n\n40~100楼的小兵我都不放宠.到了90楼开始.火球星变成了禁忌的魔法.你一放你就死得特快\n\n其实也不是不可以放.只是你遇到汗滴宠的机会比较高.我血有了1100时.到130也在放火球星.\n\n并没有飞.但是遇到很多只汗滴.怕怕.几次差点死.\n\n所以90~100改用冰镜了.慢是慢了点.但是没有办法.\n\n到了101~131这些小兵.我都建议放1血忠C.死了别补血.不减忠的.打法跟90~100一样.全部放冰镜就OK了.\n\n另外就是20\\40\\60\\80\\100\\120\\132的BOSS打法了.\n\n20楼的BOSS可以不用放C.直接冰镜换影就可以K死了.(但小心MP攻击)\n\n  全部用冰镜 人死了以后 冰箭冻C 放宠撕或 一直放冰箭杀\n\n40楼建议放只忠犬C.每回合忠.过了第一回合你的装备就安全了.注意移行\n\n  全部用冰镜 人死了以后 冰箭冻C 放宠撕或 一直放冰箭杀\n\n\n\n\n60楼的BOSS第一回合放只忠C 第一回加了移行 如果C没有死 可以收回 免减忠了.注意移行\n\n  全部用冰镜 人死了以后 冰箭冻C 放宠撕或 一直放冰箭杀\n\n\n\n\n80楼的BOSS第一回合飞的机会是20% 无论你有没有宠 安全起见 第一回合宠犬+移行 注意移行\n\n  全部用冰镜 人死了以后 冰箭冻C 放宠撕或 一直放冰箭杀\n\n\n\n\n\n100楼的BOSS比较特别.第一回合通常为5连飞斧 宠犬主要是为了防御 敌宠\n\n   过了第一回合基本安全了 注意移行 (这里要先杀C 要不会卡住)\n\n\n\n\n120楼的BOSS 一般你的宠犬C第一会合都会飞掉.不怕 人没死就没事. 注意移行\n\n   全部用冰镜 人死了以后 冰箭冻C 放宠撕或 一直放冰箭杀\n\n\n\n\n132楼的BOSS大家认为最牛的BOSS.我建议装备一定要有左手.补血多.叉只能补250左右.\n\n   他一个魔法就跟你消耗了.开战的时候记得.人物满MP.忠犬C满血.\n\n   C飞了死了不复活不加血.注意移行\n\n\n\n\n影打打打打打影 (移行熟练度92%以上)这是打法  影打打打打影 (移行熟练度90%以下)这是打法\n\n\n\n我也解说一下装备方面的要求:\n\nMP:290 这个需要是非常危险的.最好多一点 一个92%熟练度以上的移行使用一次是用50MP\n\n而90%熟练度以上火球星也需要50MP一次 冰镜则需要40MP一次\n\n那么如果是290MP 你只能放5次火球星 每次中才打2200多血.加上你又要加血 又要移行呢\n\n所以290MP已经是最低要求了\n\n当然上面所说的雷龙.我也试过用.也是可以过的.\n\n主要是人物而已.宠只是保护你第一回合使用换影 所以死了没关系.\n\n这张图是 我常用的机暴.被折磨剩85忠了\n\n\n\n另外一只海马 撕2 落马\n\n"
