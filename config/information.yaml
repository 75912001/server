      content: "石器时代OnLine《精灵的召唤》\n\nFirst Message强档推出\n－－－－－－－－－－－－－－－－－－－－－－－\n\n精灵的召唤　新装备\n\n\n柳牙系列:\n柳牙之兜：防＋４２　敏－４　电抗性精灵１\n柳牙之服：防＋５１　体力＋３０　电抗性＋１０　治愈的精灵６\n柳牙之枪：攻＋８５　敏－１８　毒雾的精灵６\n柳牙弓箭：攻＋３８（６～８）　防－１０　毒雾的精灵６\n柳牙棍棒：攻＋７４？　毒雾的精灵６\n\n雪泪系列:\n雪泪之兜：防＋３７　敏－４　冰抗性精灵１\n雪泪之服：防＋４６　体力＋５０　冰抗性＋１０　恩惠的精灵６\n雪泪之枪：攻＋８５　敏－１６　石化的精灵６\n雪泪弓箭：攻＋３８（６～８）　防－２０　石化的精灵６\n雪泪棍棒：攻＋７１？　石化的精灵６\n\n阳炽系列:\n阳炽之兜：防＋３２　敏－４　火抗性精灵１\n阳炽之服：防＋４１　体力＋２５　火抗性＋１０　治愈的精灵６\n阳炽之枪：攻＋８８　敏－１８　混迷的精灵６\n阳炽弓箭：攻＋４３（６～８）　防－２５　混迷的精灵６\n阳炽棍棒：攻＋７７？　混迷的精灵６\n\n疾翎系列:\n疾翎之兜：防＋３７　敏－４　电抗性精灵１\n疾翎之服：防＋４６　体力＋３０　电抗性＋１０　滋润的精灵６\n疾翎之枪：攻＋８２　敏－８　昏睡的精灵６\n疾翎弓箭：攻＋３８（６～８）　防－１５　昏睡的精灵６\n疾翎棍棒：攻＋７２？　昏睡的精灵６\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n三级职业装备制作：\n\n职业装备的制作\n\n法师工会 [23 17]\n月神之帽 1线10+2骨10          防+19 气力+45 净化精灵2（混乱）\n月神之服 2线10+2骨10+1皮10    防+48 气力+45 滋润精灵5\n月神腰带 1线10+1骨10          防+6 负重+2 气力+45\n月神之靴 1线10+1骨10          敏捷+25 气力+45 增加攻击顺序5%\n月神之仗 2线10+2骨10          功+45 气力+45 混乱的精灵5\n----------------------------------\n白狼工会[18 11]\n阳焰头盔 2石10+1线10                防+45 敏-10 体力+35 净化精灵2（睡眠）\n阳焰之铠 2石10+2线10+1贝10          防+75 敏-20 体力+35 滋润精灵5\n阳焰之斧 2石10+2线10                攻+96 敏-25 体力+30 毒雾精灵5\n阳焰腰带 1石10+1线10                防+10 负重+2 体力+35\n阳焰之鞋 1石10+1线10                敏+15 体力+45\n阳焰石盾 2石10+1线10+1壳10          防+15 格档率+10％\n---------------------------------\n猎人工会[24 16]\n星河头盔  2木10+线10           防+33 体力+25 净化精灵2（沉默）\n星河炼甲  2木10+2线10+1牙10    防+63 体力+25 恩惠精灵5\n星河战弓  2木10+2线10          防+33（6-8）体力+35 硬化精灵5\n星河腰带  1木10+1线10          防+8 负重+3 体力+25\n星河之靴  1木10+1线10          敏+22 体力+35 增加攻击顺序10％"
