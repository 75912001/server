      content: "必须条件：未知(最等级高一点，敌人等级90)\n1.首先到沙姆岛的奇努伊村找学者接任务得到\"结晶石\"\n2.带着石头然后在以下的地方走，就会遇到LV90的敌人了\n3.火之宝玉守护兽恩摩摩，出现于象洞外\n4.风之宝玉守护兽火鸡，出现于奇努伊村外\n5.水之宝玉守护兽加格，出现于卡鲁他那的海滩\n6.地之宝玉守护兽乌力斯坦，出现于乌力岛\n7.打到四只并都拿到宝玉后，回到奇努伊村拿给学者\n8.得到月光的手环 攻+3 防+3 敏-3 魅+1 复活守护精 lv.1\n9.此任务目前已开放月光手环的使用，可在复\n   活后加上两次吸收的手护精\n10.学者出现地点除沙姆外还有卡鲁他那村(听说学者不\n   一定会出现在哪ㄍ村落，要找她要靠运气，最好碰\n   到就先接任务)"
