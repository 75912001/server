      content: "\n★白狼勇士就职任务\n【资料来自阿东游戏论坛的YOUHAVEME和111133提供^由阿东重新整理修饰】\n ｙｕｈｕａｓｈｉ 做修改整理\n 小狐狸   制作表格\n\n 任务概述：\n2003.11.19 11/18日更新事项\n1、[调整]就职等级设定改为0转80级。\n2、[调整]就职装备等级设定改为80级。\n3、[调整]0转可学职业技能LV1。\n4、[调整]1转以上可学职业技能LV2。\n┌─────────────────────────-─────┐\n│ 任务地点：萨村庄园外附近,白狼勇士公会坐标(652.609)          │\n│ 限制条件：需1转以后解完成人任务                             │\n│ 适合等级：110级以上                                         │\n│                                                             │\n│  1.到萨村庄园外附近的白狼勇士公会坐标(652.609)白狼公会      │\n│                                                             │\n│  2.跟白狼公会里的NPC拉斐尔(27.23)讲话他会给你一只拉奇鲁哥LV1│\n│                                                             │\n│  3.拿到宠物会被传送到白狼勇士试练区,                        │\n│    进去地下一楼的守护者会要求我们交出三块人龙的肉,          │\n│    而后给我们【白狼信物1】并传送我们至地下二楼.             │\n│                                                             │\n│  4.地下二楼的守护者会要求我们进行精神的试炼,                │\n│    成功打倒会昏睡、石化攻击的暴龙,                          │\n│    同时缴回所得到的暴龙的牙齿三颗做为证明,                  │\n│    此处可得到【白狼信物2】拿到之后会传送到地下三楼。        │\n│                                                             │\n│  5.地下三层的守护者会考验我们的智慧,在拿第3个信件的时候~,   │\n│    那楼是寻找人~必须找到他!!! 他的位子会改变~但不是每一次~  │\n│    也有可能不改变他会不断更换他的所在地,                    │\n│    每找到他一次他会给我们一个信物,                          │\n│    连续找到他五次之后他会给我们【白狼信物3】                │\n│    并传送我们到地下4楼去.                                   │\n│                                                             │\n│  6.地下四层的守护者会要求我们练习打造武器,                  │\n│    从他的口中得知材料是熊皮、熊骨、以及钢铁,                │\n│    收集完材料后到他身边的镕炉就可以打造了,                  │\n│    成功打造出【白狼信物4】之后他会传送我们到最后一层.       │\n│                                                             │\n│  7.地下五层则是战斗力的试炼,                                │\n│    直接打败守护者就可以获得【白狼信物5】,并                 │\n│    被传送到公会导师前,交回拉齐鲁哥(二十级),                 │\n│    在跟就职导师吉可因说话可以成功就职为勇士,                │\n│    并得到一点技能点数及[巨熊石剑]一把.                      │\n│    任务完成后所得道具,见下表                                │\n│  8.之后把拉齐鲁哥练到20级交回给拉斐尔之后在跟就职导师吉可因 │\n│    说话可以成功就职为勇士，并得到一点技能点数及白狼全套装备 │\n│                                                             │\n│注1：如果想放弃这个职业就重新回白狼公会跟拉斐尔讲话环给他宠物│\n│     后再跟旁边的马尔(24.30)讲话即可                         │\n│                                                             │\n│注2：只要有\"匕首\"在就不能原登如果原登匕首就会消失就须要从打  │\n│     (跟拉斐尔说话时如果没有匕首他就当你来退职)              │\n│                                                             │\n│注3：再准备拿第4个信件的时候..所要收集的3个素材\"熊股\"熊皮\"   │\n│     \"钢铁\"这3个东西..搜集好..去进行打造时...是不一定会成功的│\n│     所以当你失败必须要重新打素材的!!!                       │\n│                                                             │\n│注4：白狼勇士职业技能学系地点：白狼勇士公会                  │\n└──────────-──────────-─────────-┘\n1.全程须一气喝成 , 不能登出 , 登出后将从试炼一重新开始 , 目前的情\n  况(2003/07/18)是拥有证明一在登出后,可直接讲话到达第二层,但拥有证\n  明二却无法直接讲话到第三层,暴龙牙须重打,才能到第3层......\n2.第四试炼,打熊皮,熊骨,钢铁,会有合成失败的机率,合成失败后留下的钢铁\n\n  不建议再使用,最好是丢掉,重打钢铁,打到的难度分别是熊骨>熊皮>钢铁,\n  物件都是一次一个出现,不会3件东西同时出现,若大家嫌麻烦,可以直接原\n  遇在炉子前面,打齐3件直接融合,不过炉子前面不好打到东西就是了\n3.第五试炼,打熊,熊很嫩,不用担心,尽情开扁\n\n4.回到公会前 , 证明都不要丢掉 , 先回英雄把骑着红狗练到20后,直接说话\n\n  就可就职\n┌───────────────────────────-───┐\n\n│                         白狼勇士                            │\n├──────┬────────────────────-───┤\n│            │ 各村落及各族的原始人里被训练或是自己想追求    │\n│            │ 更完美体能的人.                               │\n│            │ 通常职责是保护村落的安全抵抗外敌              │\n│  角色简介: │ 或是阻挡因猎食而误闯村庄的个各类危险的大型恐龙│\n│            │ 他们熟悉各种战斗技巧,也得担任村内哨兵的工作   │\n│            │ 当一名称职的白狼勇士除了战斗能力外            │\n│            │ 毫不畏怯的胆识和慷慨赴义的决心才是关键!!      │\n│            │                                               │\n├──────┼──────────────-─────────┤\n│            │                                               │\n│  特殊能力: │    能力值重体,功,防,                          │\n│            │    可穿戴大部分防高及功高的装备               │\n│            │                                               │\n├──────┼───-┬────┬───-┬─-───┬───--┤\n│            │ 体力  │  腕力  │ 耐力  │  速度   │  气力  │\n│  能力上限: ├───-┼────┼───-┼─-───┼───--┤\n│            │  无   │   无   │  无   │  200    │  100   │\n├──────┼──-─┴────┴───-┴───-─┴────┤\n│            │    巨熊头盔 防+32 敏-7  净化精灵(石化)LV2     │\n│            │    巨熊之凯 防+64 敏-16 滋润精灵LV4           │\n│  职业装备  │    巨熊石剑 功+85 敏-20 反击率+5 猛毒精灵LV4  │\n│            │    巨熊匕首 功+40 反击率+5 只能配置右手       │\n│            │    巨熊皮带 回避率上升+10                     │\n│            │    巨熊之靴 敏+10 防+15                       │\n├ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ┤\n│         整套装备在人物身上，HP额外增加150，防增加20         │\n│                                                             │\n└──────────-──────────-─────────-┘\n=================================================================="
