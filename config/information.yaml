      content: "条件：\n1、解完金飞任务\n2、解完黑虎任务\n3、解完不可思议的贝\n4、身上要带著不可思议的贝\n\n一、接任务\n\n在风城来到（36，129）进入民房，来到（18，12）和欧弟说话，\n接完任务，也是在风城来到（69，69）再说凯乌说话。\n\n二、变身为小猪\n\n1、在风城通过天才传送师传到火城。\n2、在火城从（13，71）出火城进入弗烈顿城区。\n3、沿著右面墙，往东南方走，经过弯弯曲曲的走廊，来到（260，\n389）进入伊甸大陆东方。\n4、沿著河边，一直走到（280，338）是蒙达村，不进村。\n5、往左下走，来到（83，365）进入蒙达村地下通道。\n6、在蒙达村地下通道来到（55,14)进入蒙达村海底通道。\n7、在蒙达村海底通道来到（88，19）进入蒙达山。\n8、在蒙达山，来到（85，37）进入伊塔工作室。\n9、在伊塔工作室，来到（22，2）和伊塔说话，他会帮你变为小猪\n（注意，在未拿到小猪莱比前绝不能登出或用羽毛）\n\n三、拿小猪莱比\n\n1、按原路走回火城，然后通过天才传送师传到水城，出水城，（219\n．200）过桥，走到（219．136）再次过桥，走到（264．115）又过\n桥，走到（341．74）再过桥，走到（372．248）过桥，走到（287，\n51）进入伊甸大陆南方。\n2、来到小猪森林入口（72，189）和小猪卡肯说话，进入到小猪森林，\n来到（30，47）跟两只小猪说话拿到50级的莱比。\n\n四，练莱比上60级，交任务\n\n1、去风城武器店买两个智慧之果2，到英雄岛，用智慧之果2打水雷，\n很快就60级了。\n2、再回风城，来到（36，129）进入民房，来到（18，12）和欧弟说\n话，拿到小猪--乌力莱德一只。\n\n\n\n◇特别感谢作者：微笑赢家对万宇在线大力支持◇"
