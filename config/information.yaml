      content: "吉鲁岛--达那村（东499,南167）（东510,南152）\n\n【村庄简介】\n达那村是位在世界最北端的一个村庄，由岩石组成的吉鲁岛上花草不生，达那村的紧靠着山壁，所有商店与居民都居住在都在洞穴中，由于吉鲁岛上的怪物等级都很高且攻击力强，所以来这里的人并不多，因达那村四周可抓到一级的蓝人龙与红人龙，人龙又是在石器中很受欢迎的强宠，有些原始人还是会冒险前来这里抓宠。\n\n1.记录点的存点肉：扬奇洛斯的肉（可在达那村四周打到）\n2.建筑物：\n■长老房间：存点和巫女在长老房间内。\n\n贩卖物\t功能\t价钱\n精灵的羽毛\t单人瞬间飞行至达那村\t2000S\n\n■大厅：大厅分为东、西两部分，两边大厅可互通。东边大厅为宠物店；西边则为道具店、武器店、防具店和肉店。\n\n宠物店\n可习得的技能\t功能\t价钱\n忠犬\t保护主人不受直接攻击并攻击敌人\t2999S\n一击必杀\t变得较容易闪避，就能够给予两倍伤害\t2999S\n毒攻击\t攻击力减30%三回合前后让敌人中毒\t2999S\n猛毒攻击\t攻击力减50%五回合前后让敌人中毒\t4799S\n地球一周\t一回合从敌人背后以两倍攻击力攻击\t2399S\n旅程伙伴\t把一只恐龙当作是伙伴当场带走\t3599S\n待机\t什么也不做\t599S\n\n道具店\n贩卖物\t功能\t价钱\n石细工首饰\t魅+5毒、催眠耐性+15\t6000S\n石十字首饰\t魅+5毒、石化耐性+15\t6400S\n青石首饰\t魅+5毒、酒醉耐性+15\t5400S\n白贝首饰\t魅+5毒、混乱耐性+15\t7400S\n大牙首饰\t魅+5催眠、石化耐性+15\t5600S\n小牙首饰\t魅+5睡眠、酒醉耐性+15\t4600S\n石首饰\t魅+5催眠、混乱耐性+15\t6600S\n黑玉首饰\t魅+5石化、酒醉耐性+15\t5000S\n黑骨首饰\t魅+5石化、混乱耐性+15\t7000S\n绿骨首饰\t魅+5酒醉、混乱耐性+15\t6000S\n\n武器屋\n贩卖物\t功能\t价钱\n贝洛萨LV3斧头\t攻+35 防-12 敏-12毒雾的精灵LV3\t14650S\n莱伊萨LV3斧头\t攻+35 防-12 敏-12酩酊的精灵LV3\t13450S\n特洛金LV3斧头\t攻+35 防-12 敏-12昏睡的精灵LV3\t14650S\n贝诺美斯LV4斧头\t攻+41 防-13 敏-13猛毒的精灵LV4\t19420S\n威金尼尔LV4斧头\t攻+41 防-13 敏-13硬化的精灵LV4\t19000S\n特洛西LV4斧头\t攻+41 防-13 敏-13睡眠的精灵LV4\t19420S\n威金娜斯LV4斧头\t攻+47 防-15 敏-15石化的精灵LV4\t32000S\n莱伊萨LV4斧头\t攻+47 防-15 敏-15酩酊的精灵LV4\t30800S\n特洛金LV4斧头\t攻+47 防-15 敏-15昏睡的精灵LV4\t33200S\n威金尼尔LV4投掷斧头\t攻+27硬化的精灵LV4\t15100S\n莱伊卡LV4投掷斧头\t攻+27酒的精灵LV4\t14680S\n特洛西LV4投掷斧头\t攻+27睡眠的精灵LV4\t15520S\n贝洛萨LV4投掷斧头\t攻+31毒雾的精灵LV4\t27200S\n威金娜斯LV4投掷斧头\t攻+31石化的精灵LV4\t26000S\n特洛金LV4投掷斧头\t攻+31昏睡的精灵LV4\t27200S\n\n防具店\n贩卖物\t功能\t价钱\n哈鲁LV2铠6\t防+22 敏-6治愈的精灵LV2\t13350S\n芙雷雅LV2铠6\t防+21 敏-6滋润的精灵LV2\t15345S\n提欧LV2铠6\t防+21 敏-6恩惠的精灵LV2\t15609S\n哈鲁LV2铠7\t防+26 敏-7治愈的精灵LV2\t20200S\n芙雷雅LV2铠7\t防+25 敏-7滋润的精灵LV2\t22990S\n提欧LV2铠7\t防+25 敏-7恩惠的精灵LV2\t23298S\n哈鲁LV3铠6\t防+23 敏-6治愈的精灵LV3\t13950S\n芙雷雅LV3铠6\t防+22 敏-6滋润的精灵LV3\t16665S\n提欧LV3铠6\t防+22 敏-6恩惠的精灵LV3\t17193S\n哈鲁LV3铠7\t防+27 敏-7治愈的精灵LV3\t20900S\n芙雷雅LV3铠7\t防+26 敏-7滋润的精灵LV3\t24530S\n提欧LV3铠7\t防+26 敏-7恩惠的精灵LV3\t25146S\n\n■医院：回复体力和气力的好去处，可买药。\n\n贩卖物\t功能\t价钱\n耐久力回复药\t耐久力100前后恢复\t40S\n耐久力回复药\t