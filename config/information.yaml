      content: "【转自BOX论坛】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n理论基础点：　　指转生后华义按公式计算应该给予你的点数\n实际基础点：　　指转生后你人物的体、腕、耐、速相加。\n净级别：　　　　转生的级别减去80得到的值\n转生最高净级别：在前面几次转生中，级别最高的一次减掉80\n净级别累加：　　所有次转生的净级别加起来的和\n\n转生公式如下（不算红利）：\n　　　理论基础点 = 20 + 转生最高净级别 / X + 净级别累加 / Y\n\n　　　实际基础点是理论基础点按转生前的体、腕、耐、速比例分配\n经我计算 X = 5　　Y = 10 / 3　　20是因为0转人的基础是20点\n\n举个例子，比如5转级别按90 100 110 120 130转生\n\n一转基础：20 + (90-80)/5 + [(90-80)]/(10/3) = 25\n          加10点红利，5个祝福，共40点\n二转基础：20 + (100-80)/5 + [(90-80)+(100-80)]/(10/3) = 33\n          加20点红利，5个祝福，共58点\n三转基础：20 + (110-80)/5 + [(90-80)+(100-80)+(110-80)]/(10/3) =44\n          加30点红利，5个祝福，共79点\n四转基础：20 + (120-80)/5 + [(90-80)+(100-80)+(110-80)+(120-80)]/(10/3) = 58\n          加40点红利，5个祝福，共103点\n五转基础：20 + (130-80)/5 + [(90-80)+(100-80)+(110-80)+(120-80)+(130-80)]/(10/3) = 75\n          加50点红利，5个祝福，共130点\n\n\n1. 转生后理论基础点只与前几转的级别有关，与其它因素都无关\n2. 从一转到五转，每一转的对5转后基础点的影响都是相同的\n3. 转生后的基础点与运气无关，但拿的转生宠的好坏与运气有关\n4. 转生前点力分配的不同，会造成实际基础点比理论基础点高或低，范围在-1到+2点以内\n5. 由转生前点力分配造成的影响不会积累到下一转\n6. 人物按 80 80 80 80 120 和 120 80 80 80 80转生，到5转的理论基础点是完全相同的\n\n1. 最高效费比的转生方法是每一转的级别都相同\n　║举例：\n　║第一种转生方法，人按 84 95 110 121 126转生\n\n　║一转 84 送2点 练级时间约6小时　　　　二转 95 送7点 练级时间约\n\n8小时\n　║三转 110 送12点 练级时间约12小时　　 四转 121 送14点 练级时间\n约26个小时\n　║五转 126 送17点 练级时间约一周\n　║最后，转生结果是：\n　║一转，20+2 = 22 基础，10点红利　　　 二转，22+7 = 29 基础，2\n\n0点红利\n　║三转，29+12 = 41 基础，30点红利　　　四转，41+14 = 55 基础，\n40点红利\n　║五转，55+17 = 72 基础，50点红利， 练级时间约9天\n　║第二种转生方法 人5转都是120\n\n　║一转 41基础，10点红利，以后每转加12点\n　║二转 53基础，20点红利，\n　║三转 65基础，30点红利，\n　║四转 77基础，40点红利，\n　║五转 89基础，50点红利，每个120约26个小时，总共约5。5天\n　║两种结果比较，一目了然\n\n　║第2种比第1种要多17点基础，而练级时间大概要短一半，\n　║这就是我建议大家每转都一样的原因\n2. 不必每一转把祝福到下一转吃，只要5转前，也就是4转后，把祝福留下来，5转后吃是有意义的，0转，1转，2转，3转时的祝福都可以当时吃掉。\n\n　║把祝福留着非常麻烦，必须先成人后再做红暴任务，然后一直留着勾玉，\n　║这样PK时会吃很多亏，因为放不了太多的气和其它的东西，所以1，2，3转都可以直接吃掉祝福 3. 没条件的就 5转都121，还可以的就127，有时间的就130或133，狂人就136， 变态加疯子请140，这样最划算。。\n\n　║提供部分参考数据：（不算做任务的时间）\n\n　║5转都121： 5转1级　89点基础50红利5祝福　140级再加5祝福417升级点共566点\n　║ 0转 → 5转1级 所需练级时间6天\n　║5转都127： 5转1级 100点基础50红利5祝福　140级再加5祝福417升级点共577点\n\n　║ 0转 → 5转1级 所需练级时间35天\n　║5转都130： 5转1级 105点基础50红利5祝福　140级再加5祝福417升级点共582点\n\n　║ 0转 → 5转1级 所需练级时间50天\n　║5转都133： 5转1级 110点基础50红利5祝福　140级再加5祝福417升级点共587点\n\n　║ 0转 → 5转1级 所需练级时间70天\n　║5转都136： 5转1级 115点基础50红利5祝福　140级再加5祝福417升级点共592点\n\n　║ 0转 → 5转1级 所需练级时间100天\n　║5转都140： 5转1级 123点基础50红利5祝福　140级再加5祝福417升级点共600点\n\n　║ 0转 → 5转1级 所需练级时间5个月连续挂机不断，实际时间，可能石器结束了吧\n\n\n在此之前，比较流行的理论就是除数原则，就是根据净级别累加，得到一个除数，然后转前的点力除去这个数就是转生后点力 这个理论有一个明显的漏洞，就是转生后的基础点有可能会减少，比上一转还少，比如按一转120两转80转生，一转120大家都知道40到42点，因此算出除数应该在9左右，而一转80级时的总点数将比0转120少很多，至少少90点左右，而除数没变，所以2转基础点也应该比1转的基础点少9点以上。\n\n事实证明并非如此，基础点从来不会减少，只是增加的或多或少，80转就不增加而已。\n\n转生后，华义计算你的理论基础点，并按转生前的比例分配到体、腕、耐、速上，然后4舍5入，得到你的实际基础点。由于你转前点力分配的不同，就有可能造成实际基础点比理论基础点多或者少的现象发生。 比如，理论基础点为50.2，而你转前体、耐、速都相等，那么你转后的体、耐、速就都是16.73，4舍5入都是17，实际基础点就是51，比理论基础点高1点，这是说明你转前的点力分配好，如果分配的更好就有可能比理论基础点高2点，如果不好就可能低1点，所以造成2到3点的差异，这与运气是完全无关的，只不过是你转生前点力分配不一样造成的。\n\n不过这个影响不会积累到下一转，下一转时，你的理论基础点仍然是按上一转的理论基础点计算，并按体、腕、耐、速的比例分配。所以大家也不必对点力的分配那么小心翼翼"
