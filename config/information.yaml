      content: "必须条件：需先有无限制进去\n1.此任务需先解完玄黄洞窟或琉璃洞窟才可接任务\n2.先到南岛的奇喀喀村(139，1007)的便利店后面找个女的接任务\n3.之后走到南岛第一座桥(212，871)\n4.之后再往上走，走到第二座桥(233，805)\n5.过了这后请到水苍的洞(316，713)，此时要用不限等进入\n6.然后上到8F跟老人说话就可得到碧青水晶（注意：要使用不限等和守卫说话，进入即可）\n7.再回15F跟女神说话，得到水的戒指 (征服水的证据)"
