    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 五一特别栏目】", "五一任务全攻略"]
      content: "BOX_滅風-靛靛\n\n\n★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★\n\n〖前提篇〗：\n\n由于开放五一任务到今天，一直都在忙任务，所以基本没什么时间上来iBOX，今天心情不错，也有点时间~所以就来发表一下自己的五一任务经验了，之前我也有发过，不过蛮乱的，所以现在重发~\n\n1：但愿还不算太晚~~\n\n2：希望对各位做五一任务的朋友有所帮助~~\n\n3：提前向各位石器玩家说声：“劳动节快乐~~！”\n\n★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★\n\n〖合成篇〗：\n\n任务所需要的铠9滋润4，其实并不难合，也不怎么烧钱，就是耗时间，因为不能快速合成，很烦，所以大家一定要有耐心~~不过根据各位BOXER的合成经验和自己的实践，总结如下：\n\n两个ID，最好都是五转或者六转[能拿多点石币]~一个声望稍高点合成[7000up吧]，一个邮寄素材；\n\n石币足够多；合成C感觉石龟、布克系、布伊系、凯比系的不错，建议用它们吧[不用设置成家族守护兽]；\n\n合成铠9滋润4=加加兜+百人铠8滋润3*3\n\n如果出治愈的话留着加花8(卡坦村卖)能转成滋润 建议花8+治愈+滋3凯8合!\n如果出石10 就用石10+2个滋润3凯8合\n如果出凯10 就用凯10+2个滋润3凯8+花8合\n\n基本就是500W左右一件吧~不过建议出治愈的就可以扔了，转精率几乎为零[估计是本人问题？]\n\n\n\n\n以下为卖百人铠8滋润3的地方，从加加道场进去打过100个弟子就可以到达卖铠的地方了~\n\n\n\n加加兜在竞技场里有卖~[顺便问个迷惘的问题：竞技场买东西，钱归哪庄园所有？]\n\n\n\n★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★\n\n〖练宠篇〗：\n\n任务所需要的宠有两种：史克杰[地敏鱼]和蓝龟，需要练到80级，而且敏也有限制[地敏鱼200+，蓝龟54+]。地敏鱼比较好达到要求，而乌龟相对就困难一点了~下面就说一下抓宠和练宠的方法吧：\n\n①抓宠：\n\n【蓝龟】水10\nLV1出现坐标:水龙洞（33，39）\n\n在水城天才传送师运行图中脚本，设置捕捉低于2敏的扔掉吧~\n\n\n\n【史克杰-绿飞鱼】地8水2\n\nLV1出现坐标:泪之海沙己夫洞前（55.161）（54，161）\n\n进入泪之海开始运行图中脚本[记得多问老头拿点草]，设置捕捉低于13敏的扔掉~\n\n\n\n②看宠：\n\n所谓看宠，就是先把它们练到30级左右。预计一下80级达到条件没有，没达到的自然就扔了，达到的就留下来继续练~~\n\n先准备好5只1级的蓝龟/地敏鱼，然后由法师[带守护，最好有兽环]，上金暴洞次次守护，蓝龟/地敏鱼低敏合击金暴，马上就3X级了~就可以看出那些该留，那些该扔了~~~\n\n\n\n\n\n合击金暴、GP、扑满，不一下就30多级了~\n\n建议敏鱼在201敏以下的都扔了，蓝龟54.xx敏的话还有得翻身，低于54就扔了吧。\n\n\n\n\n\n③练宠：\n\n选好达到要求的宠，就可以开始练了，蓝龟可以直接在金暴洞挂到80级，而地敏鱼，先在金暴洞挂到140左右的敏，然后再上雷洞挂，也很快就80级的啦~\n\n\n\n\n\n\n\n★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★\n\n〖战斗篇〗：\n\n没开五一任务之前，我自己已经试验过一个人单挑伊甸的雷尔[是雷尔一个人，不包括魔门那些]，用的是法师，辛苦了一天终于打过了，这也为五一任务开放拿到全服第一只蚂蚁做了良好的准备~可惜的是，刚开任务的那天，就有bug组队打雷尔了，这些方法就根本没用上场，第2天华义把bug给封了，大家又为打雷尔而烦恼了，其实雷尔也并不怎么厉害，主要就是能耗，如果你耐心强点，比他能耗，那胜利就属于你的了~\n\n废话少说。。。先说说三种职业如何单挑雷尔及其喽罗蛙王和龙王[我原来低估了蛙王的能力，不过没被飞……谁让它阻碍我拿MM的时候总被我虐。。。]\n\n①共通：\n\n宠物：闪避，撕2，剧毒；或者二转140的金暴学剧毒；忠犬最好也学一下。\n\n\n\n道具：毒蛇的肉，毒雷尔一次1500+血，10个回合前后，而且命中率相当高，强烈推荐！\n\n6.0任务的百年海主人任务，只需要在萨村运行脚本，半个小时就能满了。来得容易，而且很实用~\n\n\n\n②猎人：\n\n猎人应该是三种职业中最好单挑雷尔的了~当然前提要学会天罗地网，并且熟练度90%以上[挂一个晚上就有了]\n\n猎人去挑雷尔基本没什么悬念的，除非你运气特别差~不然总是赢的。\n\n建议穿森林之靴和森林腰带，还有带萨首饰、回避耳环[+10？]，这样回避N高，基本不会担心被打中，滋润或者恩惠感觉带不带无所谓，猎人有号召大自然呢，恩惠8来到的，据说~不过耗气量大，50，所以还是带滋润[恩惠]铠吧，当然最好就是有滋润[恩惠]6了~\n\n至于道具，建议都带100气吧，雷尔第2次变身很能吸气！\n\n\n\n\n\n③白狼：\n\n技能：盾击；这个是一定要学的，因为打雷尔就要靠它。回避；没这个吃不消哦~\n\n分配：把敏加到上限200，尽量多加点血，要不被飞得可怜，攻有没有都无所谓的。\n\n装备：建议都带加敏装备，感觉盾击命中和敏有关系，回避也和敏有关系[废话，当然还有出手速度]，还有就是萨首饰了[加回避、运气、复活？]\n\n道具：雷尔最终型吸气太多了，所以得多带点100气，还有就是毒肉了。\n\n打法：人盾击雷尔，宠剧毒蛙王和龙王，就是先把蛙王和龙王先放倒，它们太碍事了[ps：运气好的话，蛙王在中剧毒第5回合的时候使用地球一周，那么它估计脱离地球引力飞到太空去了，再也回不来了]\n\n把蛙王和龙王放倒之后，人就盾击雷尔，宠撕2，就这么一直打，感觉前两种形态的雷尔比较容易解决，就是盾击+撕2，等他变成最终形态的时候就牛了，会复活蛙王和龙王，还会大招吸气，还有滋润X，对于白狼来说，MP就是支柱，没了MP估计也挨不就几个回合了。。所以注意盾击配合补气补血才是胜利的关键。\n\n个人感觉白狼是三种职业中最难单挑雷尔的了，主要是盾击打不中，要不就是气力不够，所以大家在打的时候尽量节约用气……坚持就是胜利！\n\n\n\n\n\n\n\n\n\n\n\n④法师：\n\n技能：嗜血，冰镜，移行[感觉移行没什么用]\n\n点数：血敏法师，怎么分配无所谓，加装备上去能有600敏左右就可以了[敏比雷尔高]\n\n装备：铠恩惠5/6，萨首饰，守护[为什么不用镜子？那3只东西谁不会五段？而且他们攻击力也不是很高]\n\n道具：毒肉*N，鱼片这些随意。\n\n打法：也就是靠毒肉喂雷尔，同理，先守护人或者宠，宠就用剧毒放倒龙王和蛙王，然后就喂雷尔吃毒肉，中毒之后就守护，冰镜，补血补气，宠撕2这么打，因为雷尔会滋润X，所以用法师打必须要有耐心，还是那句话。。坚持就是胜利……唉，目前还没发现什么好点的方法，就只能这么耗到赢为止。。。sorry。。。\n\n\n\n\n\n\n\n\n\n\n\n★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★\n\n〖奖品篇〗：\n\n奖品一共有两大类：蚂蚁和猴年~\n\n①蚂蚁：\n\n分为地蚂蚁[布林特]和火蚂蚁[菲尔特]两种，无技能，四围不是一般的垃圾。。。拿到的时候有种上当的感觉。。\n\n\n\n\n\n②猴年\n\n分为地猴年[奇朋菲德]、水猴年[奇朋亚斯]、火猴年[奇朋德美]、风猴年[奇朋洛依]四种，四围不错，有个破除沉默技能，样子也对得起观众，收藏不错~\n\n\n\n\n\n\n\n\n\n★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★\n\n〖总结篇〗：\n\n这次五一任务，怎么说呢，反正有组队bug那会，就是刷着一样的。和去年一样，直接导致某样宠物泛滥，而且和去年一样，华义仍然找骂[可怜....]，劳动最光荣，华义的初衷是好的，可是就是任务有点........当然是相对于新手而言了，对于老玩家，就是搞点困难让老玩家少拿点，但是华义怎敌得过广大聪明的玩家，该练的练了，该合的合了，该飞的也飞了。。最后就是讨论谁刷了最多谁飞得雷尔爽了。。。\n\n最后再祝大家飞雷尔飞得爽~拿到多多的蚂蚁和猴年~~\n\n\n\n 全文完......\n\n"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 五一特别栏目】", "7.5三大职业实战技能属性及运用详细解析"]
      content: "BOX_直来直往\"\"\"\n\n\n7.5三大职业实战技能属性及运用详细解析(全图+解说)\n\n\n文章前,先讲一下写这文章的初衷.因为7.5的到1来,各大职业又出现了不少新的职业技能,很多人至今对属性和技能,或是技能的运用了解的不是很透彻.\n以下是本人近日来通过做实验和观察推理出来的一些结论,只针对一些实战技能,不敢说100%都是正确的,但是保证100%都是经过亲自实验而得出的.\n也许很多老鸟都已经知道其中的一些原理了,但是照顾新手或是一些还不知道的人,就再详细解说一遍吧…大多数实验带图.\n好了,废话不多说,进入正题...帖子可能有点长,希望大家耐心的看一看.\n\n\n\n『猎人篇』\n\n7.5猎人可谓是彻底改革,从一个主攻手的角色转变成一个辅助好手加单P好手,这当然也得利于新技能的出现.\n\n\n\n1.毒素攻击(射箭)\n这个7.0风靡全球的技能,7.5已走向堕落,虽然还是有许多猎人抄起了他们的乱射弓,但是威力和往日的“投斧满天飞”已不可相提并论.\n说到毒素的属性问题?想必大多数7.0用惯猎人的将军都知道:\n假设己方猎人被转,射出去的第一箭是被转后的属性,其余的9箭都是原属性(转前属性)..而射完箭之后的猎人,也变回原属性\n\n(也就是说不管风猎是否被反转,他射完箭之后,被朱雀拍拍,就飞了)\n这就是为什么以前的猎队一个属性走到底的原因了.\n\n\n2.号召自然\n7.5初期,这个技能曾被称为猎人的补血法宝,据说能补5000的血,但是实战表明,效果并不是那么理想,\n因为5000的补血是平均分配的,也就是说,场上人越多,那被分配的到的补血就越少,\n一般单P,效果是最明显了,单体可补1000以上,但是极度废气,团P的话,10人都在场,效果甚至不如一件灵力凯.\n并且,用此技能会减敏,具体数值不清楚,但是减的不少,450敏的猎甚至不及300敏的海马快.\n\n\n\n3.自然威能\n真正了解这个技能的并不多,但是却是个十分有用的技能,特别是现在电流暴风横行的世界,人们都知道它减魔法伤害,但是具体怎么减,却不是很了解,\n\n本人做了以下的实验.2人2宠,不放自然威能,第一回合后,2个人中暴风雨滴汗,宠不中.第二回合法师放电,1R去血1100,2宠分别去血2200.\n\n\n\n\n还是2人2宠,放自然威能,第一回合后,2个人中暴风雨滴汗(和第一次一样),宠不中,第二回合法师放电,R去血370(是1100的1/3),宠去血700多(是2200的1/3)\n\n\n\n\n\n为什么要选择2个人滴汗的情况下分别实验呢? 因为我想做到实验\"尽量\"公平(要是人和宠各中一个暴风雨,或是只有一个人中暴风雨,可能这个实验就有一定的误差了.)\n由此可见,自然威能是提高全体抗性的技能,熟练92%时,效果是4回合.\n用来抵抗法师的电流效果一般(为什么说一般呢?因为猎人始终没有法师快,而且这个技能不是消除伤害,而且减少伤害,所以还是有可能被电死的),\n用来抵抗火星球,效果不是很大,用之前,伤害人215骑宠215(总430)用之后,伤害人175骑宠175(只减了50左右)\n\n\n\n\n4.遗忘,挑拨,与天罗地网\n为什么把这3个放一起呢,因为它们都有着共同点,就是产生异常状态.\n\n挑拨:使宠物产生混乱效果,并且有60-70%的机率会用背2扫主人(汗,比较恐怖,不过确实是这样).\n做2个实验,放5次遗忘,对一只红海马,不闪,5次中了4次\n再一次,对同一只红海马,闪避后,5次一次都没中.\n由此可见,挑拨的成功率和宠物的闪避率是联系在一起的.\n\n遗忘:命中极高,中招后有0--5个技能不能使用(看运气,第一次实验时候运气实在强,所有技能都能用),回合数也和运气有关,做了几次实验,第一次4回合,第二次2回合,后面2次都是3回合..所以效果应该是2--4回合不等吧.\n命中和闪避无关,闪了照样中(虽然无用还是讲讲吧)\n\n\n\n\n天罗地网:超强技能,网住不能动\n命中和闪避无关,闪了照样被网住,熟练越高命中越高,所以猎人们还是不要偷懒,多练一会,\n本人曾试过用10%的网去网村外1级的小动物..3次均失败.(可以证明一切了吧)\n有个很大的缺点就是..用时候减敏,450敏猎,用天网经常不及320敏的朱雀快,\n大概比260敏的白狼快一些吧.减20%--30%敏左右(与法师用火星减敏同理)\n\n\n\n5.地,水,火,风属性结界\n属性结界实是猎人极之有用的一项技能,不过会用的人却在少数.\n按照惯例,还是2个实验,熟练90%废气15\n实验1:140朱雀,打转过的白虎,放火,不放火结界.去血3790.\n                      打转过的白虎,放火,放火结界,去血1900(原来的?)\n\n\n\n\n\n\n实验2:140朱雀,打转过的白虎,不放火,不放火结界.去血1900\n                        打转过的白虎,不放火,放火结界.去血950多\n\n\n\n\n实验表明,不管是否有属性加强,只要是关于火属性的宠或人,结界都会带来减伤效果,90%的熟练减伤效果是50%,就是一半(巨大了,比铁壁还NB得多)\n所以善用结界来对付单一属性的队是非常有效的.\n结界施放成功率和熟练有关吧.但是有个缺点,和天网一样,施放时会减一些敏的.\n\n\n\n\n\n\n『法师篇』\n\n法师在7.5依然有他不可替代的地位,虽然冰箭只减防不定身,但是有了新的组合暴风+电流,以及全体火星.\n\n\n\n1.火星球\n火星球在满熟练时,炸东西的效果,总伤害为450左右,打在人身上的话就是225骑宠225,7.5的火星球不同于7.0的火星球..\n7.0的人被火星球打中,人伤害约150,骑宠约300,所以一般人不死,容易下马,而7.5则是平均分配,人和骑宠各半.\n火星球在7.5不象电流术,不会MISS,伤害值比较固定,所以现在法师队经常用它来做为杀低血人的手段(3个法师就660了)\n有的时候满抗火星在打低血人的时候会出现减伤的现象,只打70--160,具体什么原因尚未得知.有兴趣的可以研究研究哦.\n另外,还是提一提大家都知道的..用火星是减敏的,减20%左右吧.同一敏的法师,放冰箭会比放火星快上许多,而用精灵又比放冰箭快上许多.\n\n\n\n\n\n\n2.暴风雨+电流术\n\n目前法师队的主要战术,相信具体怎么运用大家都很了解了..\n看过天空在4月初写到的伤害计算公式,自己也稍微实验了一下,\n发现公式还是挺准确的.就是:\n\n最大伤害=普通电流伤害(假设为300)*3的N次方(N为中雨滴,并且被电流术击中的数字)\n也就是说,中的雨滴越多,而电流术打中雨滴的单位的MISS的数目越少,\n最大伤害就最高,并不是所有的单位被击中都会造成最大伤害.伤害的数值是不同的,半随机吧…\n假设有3人中雨滴,而那3人又同时被电流击中,那么最大伤害就是\n300*3*3*3=大约8100\n下图为地城外的实验,由于本人电流术熟练不是很高,所以单体只能打\n255左右的血,图中有4个小动物中了电流术,按照公式算,叠加起来也只有6600\n至于法师单P,本人觉的还是用召雷术比较好,一来是省气,只废30气,二来是伤害固定人500多骑宠1000左右,\n不象电流要靠运气.\n\n\n\n\n\n3.火龙枪\n\n火龙枪的缺点显而易见,就是待机一回合,熟练90多的时候总伤害是970多,打人的时候一般是人400宠500多这样…\n命中还不错,但是减敏效果很厉害.总的来说用处不是很大,在以少打多准备全力一博的情况下可以适当用用.\n\n\n4.附身术\n\n单P不错,等于一个高命中的混乱+伤害.对人和宠都有效,\n缺点就是废气.\n附身术中混乱精灵的命中和人的闪避和宠的闪避有关.\n本人用附身术,打用不防守3的140机龙,5次,造成伤害,但是机龙没有混乱,机龙用背3,一击改,立即中混乱.\n用法师的闪避同理.\n\n\n5.世界末日\n\n虽说是法师最高级的技能,但是用处可以说是小之又小.\n当熟练91%时有附加的-攻-防-敏的效果,缺点不说也知道..浪费3回合,不如干点别的.基本是个摆设.\n\n\n\n\n\n『白狼篇』\n\n随着7.5的到来,越来越多人重新选择了白狼,在医院里也时常看见他们的身影.\n\n\n1.盾击\n\n带盾白狼在单P中威力着实不小,高敏白狼带着盾效果尤其明显,\n因为盾击的命中率和击中目标的命中率有关.低敏白狼带盾效果不大..\n在没净化的情况下,被白狼盾中基本上是死路一条.\n\n\n\n2.连环攻击 &具体的属性效果\n\n连环攻击可以说是白狼从7.0一直沿用至今的主要攻击手段,有很大的机率出手2次\n很多战队也因此发展出双狼,三狼,套镜狼队.但是对于连环攻击的属性效果概念却是模糊不清,经常在群里听到说:呀,你地人被我转了,怎么连环把我水人飞了??\n\n下面就来揭开这个谜吧.\n\n假设你的白狼不被转,那么出手的第一,第二次,都是你ID本身的属性\n\n假设你的白狼被转了.出手的第一次,是白狼被反转以后的属性,第二次,则是原属性.\n\n后来,在研究过程中,又发现,原来白狼的连环攻击不但改变本身属性,也和被击打的属性有着密切的联系\n\n假设白狼打法师,白狼和法师都被反转了属性,那么白狼连环攻击的第一次,是你ID被反转以后的属性,VS法师被反转以后的属性\n\n而出手的第二次,则是白狼的原属性VS法师的原属性\n\n综上所述,可以总结出,\n\n白狼的连环攻击,第一下的属性状况是,转后属性VS转后属性.(属性状况和头上的反转标记相同).第二下是原属性SV原属性(不管双方有没有被转)\n\n现在我用一个简单的实验来说明一下,\n\n火白狼杀水法师,有几种情况:\n\n1)2个都不转,打2次,每下去血300左右(火VS水)\n\n2)反转白狼,打2次.第1次800(地VS水),第2次300(火VS水)\n\n\n\n\n\n3)反转白狼,反转法师,第一次300(地VS风),第二次300(火VS水)\n\n\n\n\n\n4)反转白狼,反转法师,放火加强,第一次300(地VS风),第二次600(火VS水){{由于火加强,伤害不同于情况3,证明了第二次的属性是火而非地,而法师虽然被转,但是第二次,被白狼攻击时的属性是水而非风,是风的话伤害应为1500,直接飞,此点在情况5会得到证实)\n\n\n\n\n\n5)反转法师,放火加强,第一次,1500(火VS风),由于加强直接飞了.\n\n\n\n\n和毒素攻击同理,白狼在用完连环攻击后,自身属性恢复到转前状态\n(也就是说被反转的火白狼用完连环攻击后,被白虎拍拍有可能飞) PS:只在下回合前有效.\n\n\n\n\n3.贯穿攻击 &  回旋攻击 &暴击 &双重攻击\n\n\n贯穿攻击:7.5白狼单P杀人杀宠的主流,属性变化随着头上的标记转变.命中率和人的命中有关,\n个人感觉低敏狼用这技能命中比较低.不怕光,不怕镜,更不怕闪避.是个很实用的技能.\n回旋攻击:打一排,但是命中实在是不理想,一般5个能中3个已是万幸.\n\n暴击:虽然说明是加强攻击力,但是实际上一点也没加,该打多少还是多少,从7.0的BUG一直延续到现在,比较遗憾.\n\n双重攻击:7.0的双重是不怕镜的,第一下破镜,第二下杀人,攻击力增强1.5倍.\n\n7.5稍有调整,第一下只是做个样子,第二下撞镜(比较惨烈),属性变化随着头上的标记转变.\n\n\n\n4.混乱攻击\n\n减攻30%\n\n和连环攻击类似,\n\n攻击4-5下(依熟练度而定),被反转以后,第一下是反转后的属性,后3下是原属性\n\n用完技能后恢复本身属性(下回合前有效)\n\n\n\n5.能量聚集 & 激化攻击\n\n为什么把这2个辅助技能摆在一起呢?\n\n原因只有3个字:BUG..\n\n实验结果表明,能量聚集并非效果上写的+防38%,-敏28%,而是+防38并且+敏28%,不减任何东西,加防加敏.\n\n而激化攻击也并非外表上写的,+攻30%,而是+攻10%,-防30%,所以是个垃圾技能\n\n用能量聚集前后的2张图:\n\n\n\n\n结尾:\n\n好不容易抽出3天把东西都实验了一遍并且整理了一下,要是强银们有什么意见或是疑问尽量发表出来.\n\n还有很多不是很实用的技能没什么时间实验,不过无关紧要了.希望所讲到的东西对大家PK有帮助.\n\n有交流才有进步嘛,哪里写错了记得跟帖说一声,要是对我的实验结果有怀疑的欢迎去尝试,人多力量大."
