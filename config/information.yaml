      content: "萨伊那斯岛(北岛)--玛丽娜丝渔村（东113,南661）（东78, 南615）\n【村庄简介】\n\n位于海边的玛丽娜丝渔村是尼斯大陆的四大村之一，各式贝类、壳类的建筑带来海洋清新的风貌，沙滩上布满了小贝壳跟海星，渔村的出生宠凯比是玩家们爱用的合成宠，特产的不可思议贝壳也是开启一个庞大任务的关键，渔村看似民风纯朴，仿佛一个度假胜地，其实这里蕴藏了许多重要任务的关键喔。\n1.记录点的存点肉：乌力斯坦肉（可在玛丽娜丝渔村村口打到）\n\n2.建筑物：\n\n■玛丽娜丝村长老家：可以在此与家族服务员对话加入家族，还有家族留言版、家族银行、占卜师等服务。\n■聊天室：购买门票就可以进入聊天室内聊天，还有表演舞台！\n■长毛象快递：可接受委托送货任务赚钱的好地方。\n■竞技场：玩家可在此购买门票进入竞技场PK。竞技场内贩卖的物品请参阅竞技场商店街。\n■玛丽娜丝道场：在这里贩卖前往“猜谜三兄弟的家”的入场卷，但等级限制为70级以下，70级以上请往卡鲁它那村的道场。\n■宠物店：四大村的宠物店除了可以买卖宠物、让宠物学习技能外，也可以将宠物寄放在宠物店，可以寄放的只数跟您转生的次数有关，转的越多，放的越多，未转生可以寄放五只。\n\n可习得的技能\t功能\t价钱\n待机\t什么也不做\t500S\n攻击\t通常攻击\t1000S\n防御\t通常防御\t1000S\n破除防御\t对采取防敌人攻击可能\t1500S\n连续攻击\t两次连续攻击\t2000S\n被水之战其之2\t防御力变成-50%攻击力变成+50%\t2500S\n加工\t合成素材制作道具\t1500S\n料理\t使用素材制作料理\t1000S\n\n■道具店：可买卖人物装饰品，例如首饰、耳环等等。\n\n贩卖物\t功能\t价钱\n牙的手环(绿)\t攻+5 防+5 敏-5 魅+3\t30000S\n芙雷美雅LV4竖琴\t魅+4火炎的精灵LV4\t3000S\n芙雷美雅LV5金币\t魅+5火炎的精灵LV5\t5000S\n小石细工戒指\t魅+2会心一击率上升+3\t4500S\n漂亮的黑色首饰\t魅+2毒耐性+60\t11900S\n红色美丽首饰\t魅+2石化耐性+60\t10500S\n黄色美丽首饰\t魅+2睡眠耐性+60\t9100S\n绿色美丽首饰\t魅+2混乱耐性+60\t14000S\n青色美丽首饰\t魅+2酒醉耐性+60\t7000S\n青色小耳环\t魅+2回避率上升+3\t4500S\n\n■武器店：武器店里可买卖武器和防具。\n\n武器店\n贩卖物\t功能\t价钱\n普通普通的斧头\t攻+14 防-5 敏-5\t260S\n轻的斧头\t攻+19 防-7 敏-6\t1040S\n重的斧头\t攻+27 防-9 敏-10\t2990S\n硬的斧头\t攻+37 防-12 敏-12\t11050S\n小棍棒\t攻+4\t50S\n普通普通的棍棒\t攻+8\t200S\n轻的棍棒\t攻+11 敏+1\t800S\n大的棍棒\t攻+20\t5000S\n小的枪\t攻+5 敏-1 魅+1\t60S\n普通普通的枪\t攻+10 敏-2 魅+1\t240S\n重的枪\t攻+21 敏-5 魅+2\t2760S\n小的爪\t攻+3 (×2)\t55S\n普通普通的爪\t攻+6 (×2)\t220S\n轻的爪\t攻+8 敏+1 (×2)\t880S\n小的投掷斧头\t攻+4\t50S\n普通普通的投掷斧头\t攻+8\t200S\n防具店\n贩卖物\t功能\t价钱\n粗杂的兜\t防+3\t50S\n普通普通的兜\t防+4\t200S\n轻的兜\t防+5\t800S\n爱鲁菲LV1兜5\t防+8 敏-3 净化精灵(石化)LV1\t5625S\n破烂的帽子\t防+1\t40S\n渥鲁菲LV2帽子2\t防+1净化精灵(酒醉)LV2\t256S\n普通普通的帽子\t防+3\t640S\n粗杂的铠\t防+4 敏-1\t75S\n普通普通的铠\t防+8 敏-2\t300S\n芙雷雅LV1铠2\t防+5 敏-2滋润的精灵LV1\t550S\n轻的铠\t防+11 敏-2\t1200S\n破烂的服\t防+2\t60S\n普通的服\t防+5\t240S\n哈鲁LV1服2\t防+3治愈的精灵LV1\t340S\n\n■医院：这里不但可以买到补体力和气力的药，也可以花钱回复体力和气力，价钱因等级差异、受伤程度有别，宠物则可以免费医治。医院中还有一个美容师可以帮您提升魅力，当然，这也是要钱的，价钱会因魅力的多寡、等级的高低而有不同。玩家要注意的是，同样的药在不同的村庄价钱不一定相同！\n\n贩卖物\t功能\t价钱\n耐久力回复药\t耐久力100前后恢复\t25S\n耐久力回复药\t耐