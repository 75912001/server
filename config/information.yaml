      content: "◆6.0宠物LV1坐标Й(修正版)(ｙｕｈｕａｓｈｉ搜集整理加注解)\n\n血 攻 防 敏 成長率  部分参照石器宠物情报网和BBC 仅供参考\n如果你抓的宠超出参考的标准,那么恭喜你\n坐标只是参考，附近都能抓到LV1的\n==================================================================\n●石器尼斯大陆\n\n【格尔希洛－白猩猩】水8火2 54-64 10-15 8-13 6-8 5.2-5.5\nLV1出现坐标:吉鲁岛没落矿坑3楼（4，34）（9，42）\n坐标说明:有石头挡着,很讨厌,逼着我们用原地石.解决方法:走到坐标,开着\n穿墙功能,在用快速遇敌\n不过我用原地石50分5只,穿墙快速50分1只.用原地石抓了2个小时,最好的是\n61.13.11.6\n\n【戈登尔顿－金猩猩】火2风8 53-69 11-18 8-12 7-11 5.4-6.X\nLV1出现坐标:玄黄洞窟10楼（45，36）（42，28）自带T技:破除防御2\n快速遇敌,半个小时2-3只,普通4围64.15.10.8\n极品成长：6.1以上\n\n【布依布鲁－蓝猪】\nLV1出现坐标:北岛（581，362）\n\n【蓝龟】水10\nLV1出现坐标:水龙洞（33，39）\n半个小时快速遇敌2只，最好的是33.5.7.1\n\n【梅鲁莎－黄鲨鱼】火2风8 66-74 14-16 7-10 8-9 4.9-5.3\nLV1出现坐标:吉鲁的海底通路(往福村的关卡)（33，43）\n\n【克达达－褐兔子】地6风4 31-34 5 5-6 5\nLV1出现坐标:南岛（594，453）（661，514）\n\n【克洛恩－灰飞龙】地5水5 60-67 12-14 9-10 8-9\nLV1出现坐标:伊甸大陆东方萨洛伊山洞3楼（71，11）\n\n【迪布恩－蓝飞龙】地1水9 58-62 10-11 8-9 7-8\nLV1出现坐标:飞龙洞1楼（31，47）\n\n【布莱兹－蓝羊】地3水7 62-67 10-13 10-11 9-12\nLV1出现坐标:现代波拉岛（451，507）\n\n【伊夫霍恩－绿羊】地7风3\nLV1出现坐标:现代波拉岛（211，368）\n\n【辛普洛斯－黄猪鱼】地1水9 58-66 8-15 8-11 6-9\nLV1出现坐标:50年前英雄岛（205，308）\n坐标走法:黑乌力-传送点(199,320)-传送点(164,310)-(205,308)\n返回走法:传送点(212,306)-传送点(166,311)\n抓了半个小时,最好的是61.13.10.7\n极品成长：6.0以上\n\n【格里兰－绿鸡】地7风3  35 5 4 7\nLV1出现坐标:（140，226）\n成长：5.2－\n==================================================================\n●泪之海 海贼王遗迹类\n\n【卡柏】地6风4 51-58 9-11 10-11 5-7\nLV1出现坐标:泪之海（155，56）\n\n【康尔特】地1水9\nLV1出现坐标:泪之海（101，92）\n\n【夏普德】火6风4 38-47 7-10 5-7 6-7\nLV1出现坐标:泪之海（148，73）】（146，74）需穿海蓝装备\n\n【奥特普】地9水1 60-69 13-15 9-11 6-8\nLV1出现坐标：泪之海（233，115）\n极品成长：5.9以上\n\n【那尔斯】地9风1\nLV1出现坐标:泪之海（320，95）（317，96）\n\n【伊克多】地6水4 55-63 11-13 6-9 10-12\nLV1出现坐标:泪之海（314，136）\n极品成长：5.8以上\n\n【特利斯克】水8火2 攻击 防御 4个技能格\nLV1出现坐标:泪之海（380，209）\n\n【布斯迪】水5火5 42-? 5-? 7-? 2-?\nLV1出现坐标:泪之海（73，132）\n\n【特雷沙】地2水8 62-72 14-16 9-12 8-10\nLV1出现坐标:泪之海（60，161）\n\n【洛安奇】地9风1\nLV1出现坐标：泪之海史东尔洞窟地下3楼（12，44）\n\n【塔克】火9风1\nLV1出现坐标：泪之海沙己夫洞窟地下5楼（7，13）\n极品成长：6.0以上\n\n【沙瓦克】地2水8 56-61 12-14 7-10 7-8\nLV1出现坐标:泪之海（153，331）海贼王遗迹旁\n\n【奇格拉】火7风3 56-66 11-14 13-15 3-5\nLV1出现坐标:泪之海（210，388）（212，383）\n在(210.388)快速遇敌10分钟抓到一只62.12.14.4\n在(212,383)快速遇敌半个小时遇到一只61血的居然跑掉了\n极品成长：6.0以上\n==================================================================\n●石器活动奖品 AND 超级LJ卡奖品\n\n【贝沃特】地10\n买华义7月13日后出的《夏日清新包》抽奖会得到以下5种东西其中的1种.\n海蓝装备组（兜、铠、棒），水母贝沃特，3体鱼夏普德，金猩猩，白猩猩\n\n【蓝宝】水10\nLV1出现坐标:超级来吉卡任务卡\n\n【邦诺斯娜－粉红人龙】2种属性 5.0的是火8风2，6.0的是水5火5成长高\nLV1出现坐标:超级来吉卡任务卡\n\n【邦司凉朵-水蓝暴】 水10 活动时间：8月15日---10月15日\nT技能：撕裂伤口1（除机暴以外的所有暴龙可学习）\nLV1出现坐标：超级来吉卡奖品\n集齐指定任务卡参活动，参与卡：5张，英雄岛任务卡，动物园任务卡，天空\n之岛任务卡，转生任务卡，四圣室任务卡，活动方式赠送，活动时间：8月15\n日---10月15日，活动周期二个月，即开即中。\n虚拟宠物共计400只，奖品：邦司凉朵（水蓝暴龙）一只。\n虚拟装备共计100000套，奖品：海蓝装备加爱相随戒指。\n玩家不再需要去做超级来吉卡的任务，只要凭你手中的超级来吉卡到华义官\n方网站抽奖区注册该卡号，就可以直接在石器最后一组服务器领取所获得奖\n品！\n\n【伊古雷】水7火3\nLV1出现坐标：石器PK擂台赛  2003年8月4日开放报名\n首次成为擂主的玩家可获得8级奖品，守擂成功1次者每人可获得，守擂成功2\n次者可获得7级奖品,3次成功守擂者可获得6级奖品。4次成功守擂者可获得5\n级奖。依次类推。\n以下为奖品划分：\n一等奖：融合宠（1+1+1）带三项特殊技能（已开放可融合技能，由玩家自选）\n二等奖：融合宠（1+1）带两项特殊技能（已开放可融合技能，由玩家自选）\n三等奖：融合宠（1）带一项特殊技能（已开放可融合技能，由玩家自选）\n四等奖：白猩猩（融合用）白猩猩格尔希洛—成长不俗，融合极品\n五等奖：金猩猩（成长好）金猩猩戈登尔顿—战斗力惊人，身怀特技\n六等奖：伊古雷（6.0新宠）深海鱼伊古雷—神秘稀有的深海鱼类\n七等奖：夏普德（6.0新宠）3体鱼夏普德—海洋中的暴力一族\n八等奖：贝沃特（水母6.0新宠）水母贝沃特—令你爱不释手的可爱海洋宠物\n成为攻擂的玩家不论挑战上期擂主成功与否，都能得到8级奖品: 贝沃特一只\n上期擂主必须卫冕成功才可以获得守擂晋级奖品。\n=================================================================="
