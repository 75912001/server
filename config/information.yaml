      content: "作者：MX_重2-太阳П月亮\n暗灵巫师\n\n1.嗜血成性----在战斗时使用,对自己狂放就可以了.建议练到70,70以后的练其他技能升就可以了.\n2.移形换位----在战斗时使用,对自己狂放就可以了.设置外挂到50气自动使用嗜血成性,建议练到91以上.\n3.冰熟练度/火熟练度/雷熟练度----这个比较复杂,等我全说了再重点介绍.\n4.冰箭术----在战斗时使用.可以打敌人也可以打自己(打自己不加对应的熟练度),敌人中了会降敏25%,还可以冻住3回合.建议练到90以上,以后很有用.\n5.冰镜术----在战斗时使用.可以打敌人也可以打自己(打自己不加对应的熟练度),对方防越高伤害越大.建议练到90以上,以后很有用.\n6.冰附体----在战斗时使用.可以打敌人也可以打自己(打自己会加对应的熟练度),对方中了会降敏,具体多少还不清楚.建议练到90以上\n7.召雷术----在战斗时使用.可以打敌人也可以打自己(打自己不加对应的熟练度),每次大概打300-500不等.基本练到70以上就可以了.\n8.暴风雨----在战斗时使用.可以打敌人也可以打自己(打自己不加对应的熟练度)(此处出现BUG,当用此技能时加的熟练度是加冰熟练度的,请大家注意),攻击敌人全体,每次大概打200-350左右.基本练到70以上就可以了.\n9.雷附体----在战斗时使用.可以打敌人也可以打自己(打自己会加对应的熟练度),对方中了会麻痹,可以麻痹2回合,遭攻击后麻痹状态消失.基本练到70就可以了.\n10.火山泉----在战斗时使用.可以打敌人也可以打自己(打自己不加对应的熟练度),每次大概打200-400不等.基本练到70以上就可以了.\n11.火星球----在战斗时使用.可以打敌人也可以打自己(打自己不加对应的熟练度),攻击敌人一排,每次大概打350-500左右.基本练到70就可以了.\n12.火附体----在战斗时使用.可以打敌人也可以打自己(打自己不加对应的熟练度),对方中了会中毒,首回合扣100血,其他回合扣50,可以毒2回合.若血不够扣就直接死亡.基本练到70就可以了.\n13.嗜血蛊----在战斗时使用.可以打敌人也可以打自己.对方中了会先扣120血,之后每回合扣40血,可以扣5回合,若血不够扣就直接死亡.基本练到70就可以了.\n\nPS:至于上面说的冰熟练度/火熟练度/雷熟练度,学的条件就要把3属性的附体练到70后才能学,学了该技能后必须用其相对应的附体来提升熟练度,只要3属性的熟练度升到11%后,就可以用其他该属性的技能来提升该熟练度.\n至于3级的魔法和4级的世界末日,就不用再问了,还没开放\n敌人在中了昏睡的精灵后,用魔法攻击不会将其打醒\n至于练技能的顺序,大家自由发挥好了,不过建议先学嗜血和移形\n某些玩家要去练魔法还要练该熟练度的话,我建议大家去打素材,我把我的暴风雨练到90的时候,刚好出了一个铜兜3\n至于练技能的地方嘛,好多哦,那里都可以,我个人建议去门口打乌力来练~攻底,练起来容易啊,要练熟练度的就去挂铜咯,怎么设置??人物首次和一般设置用该魔法,设置比这个魔法高30气左右来用嗜血(不明白吧,就是假如你练的魔法废气50,就设置80气用嗜血成性咯)\n有条件的最好就是双开PK练啦,两个法师是最好的配合了,不过血一定要高哦,最好上1000咯,我觉得这样练是最快的了.\n根据魔法熟练度的不同,废气的程度也不一样\n对于法师点数的分配,建议做敏血和加一点点防,不用加攻\n\nPS:外\n对于7.0后期开放的3级4级的魔法,可能也要等到7.5才能开吧.现在把转自BOX的绝版羚羊Angel-Ray的资料给大家了解一下.同时也感谢MX论坛的haozi666会员把我的帖子给补充了.\n1.世界末日----学世界末日的人物必须先要学习火龙枪.冰爆术和电流术.\n其中:学会火山泉和火星球(火山泉>70%)才能学会火龙枪(火星球>60%)\n     学会冰箭术和冰镜术(冰箭术>70%)才能学会冰爆术(冰镜术>60%)\n     学会召雷术和暴风雨(召雷术>70%)才能学会电流术(暴风雨>60%)\n     嗜血成性----建议学习对学世界末日没影响.\n     必须学会雷附体,火附体,冰附体才能学会附身术(3附体+移形均>70%)\n以上刚好15个技能,加上世界末日,刚好16个.\n世界末日要用300气,破坏力超强(估计可打人600-1000不等)\n2.一针见血----学一针见血的人物必须先要学习嗜血成性和嗜血蛊.\n其中:学会嗜血成性(嗜血成性>70%)\n     学会嗜血蛊(嗜血蛊>70%)\n     其他技能自己就随便学可以了.\n\n\n\n白狼勇士\n\n1.盾击----战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.打中对方后有机会打晕对方,有效时间为2回合(前提必须装备盾).\n2.暴击----战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.这是战斗中加攻的技能.\n3.连环攻击----战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.顾名思义,就是有机会攻击敌人2次,我拿弓箭也走前去打两下,不知是否BUG.\n4.双重攻击----战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.这技能破镜子专用,打两下,第一下为虚招,可以破对方的镜/守护/光,类似于宠物的破除防御.\n5.濒死攻击----战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.用途是牺牲自己的血来提高自己的命中率,血过少不能用,不建议经常用,因为会扣好多血的.\n6.状态回复----当自己中精灵后能够自动回复体力,每次回复大概15%左右,这个有点难练了,必须要双开PK才能练,2个号一个对要练的人狂放精灵(建议是不废气的精灵,也就是9级的有精灵的武器),要练的人就必须装备所放精灵的B3/B4,超难练.建议练到90%,最好练满.越高加的血越多.\n7.二刀流----装备两把武器,要是两把都有精灵就忽略左边武器的精灵.这个技能不需要刻意地练,只要装备两个武器后去挂机就能提升的了,我挂了1天左右就80多了.\n8.斧熟练度/枪熟练度/棍熟练度----提高使用该种武器的攻击力,大概增加20%左右.练此技能也不需要刻意去练,只要装备相应的武器去挂机就可以提升的了.速度有点慢.\n9.舍己为友----非战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.用途是减低自己一点点防来保护自己队友的人或宠物.\n10.能量聚集----非战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.说明写的是减敏加防,但是我觉得是两样都加的.加大概是20%-30%左右.有效时间为4回合.\n11.激化攻击----非战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.这是一个减防加攻的技能,加减大概是20%-40%左右.\n12.专注战斗----非战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.这是增加会心一击的技能,有效时间为1回合.\n13.回避----加回避率的技能.还不错的,装备合成耳饰10等加回避的装备去北岛的小猪岛挂就可以了.建议练到90以上.\n至于3级和4级的技能,就不用再问了,还没开放\n当你的人拿着间接攻击武器的时候,使用技能攻击他的时候是冲上去打的,而他放了镜等精灵后就是远程打敌人的,这样大大减少了白狼高攻而撞镜子的危险.\n至于练技能的顺序,建议先练回避,其他的自由发挥就好了.\n当人带着双尖枪的时候用连环攻击并不会打四下的,请大家注意.\n白狼有N多技能需要在啊布7层练的,所以建议做白狼的人资金一定要够厚,不然很难成为出色的白狼的.\n对于白狼点数的分配,建议做全攻和加100左右的敏.不用加血\n\n\n\n\n追猎者\n\n1.追寻敌踪----非战斗技能.使用后配合外挂的快速遇敌可使遇敌速度更快.练的方法也很简单,对着技能狂点就可以了,建议在竞技场里练,把气用尽了可以免费补,现在已经有相应的脚本了.\n2.驯服宠物----非战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上,此技能可以提升宠物的捕获率.\n3.回避战斗----非战斗技能.使用后可以降低遇敌几率,做任务的时候推荐使用.练的方法也很简单,对着技能狂点就可以了,建议在竞技场里练,把气用尽了可以免费补,现在已经有相应的脚本了\n4.弓熟练度/精通回力镖/精通投掷石/精通投掷斧----提高使用该种武器的攻击力,大概增加20%左右而且还要爆出星星才能增加.建议去小猪岛挂这4个技能,最好装备加一击必杀的装备.速度有点慢.\n5.陷阱----战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了.钱多的最好练到90以上.使用后当有人攻击你的时候会反弹他400血.但是有效时间为2回合,2回合后没人攻击了,陷阱效果自动消失.\n6.挑拨----战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了,钱多的最好练到90以上.此技能减攻减防减敏,大概减20%左右,对敌人的宠物(注意,是宠物,人物无效)造成混乱效果.\n7.树根缠绕----战斗技能,去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了,钱多的最好练到90以上.功效大概和法师的冰附体差不多.可以使敌人减敏.\n8.冰抗性/雷抗性/火抗性----战斗技能.去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了,钱多的最好练到90以上.此技能需要使用后才能增加抗性.还有回合限制.\n9.弱点攻击----战斗技能.去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了,钱多的最好练到90以上.此技能加攻减敏,大概加减20%左右,对敌人的宠物(注意,是宠物,人物无效)造成更强的攻击.\n10.毒素武器----战斗技能.去北岛啊布洞找第7层的三兄弟练,没气就去买啊布水,请确定身上一定要足够的钱.基本练到70就可以了,钱多的最好练到90以上.此技能使用后可以使敌人中毒,有效时间为5回合.\n\n至于3级和4级的技能,就不用再问了,还没开放\n当你的人拿着投掷武器的时候使用毒素攻击是可以扔敌人全体.可以当弓箭用,不过经常卡机,使用时一定要小心.\n至于练技能的顺序,建议先练追寻敌踪,其他的自由发挥就好了.\n猎人有N多技能需要在啊布7层练的,所以建议做猎人的人资金一定要够厚,不然很难成为出色的猎人的.\n对于猎人点数的分配,建议做攻敏,和加一点点防,不用加血"
