      content: "条件:解过金飞任务.\n         有解过黑虎任务的ID一个\n         有爱相随戒指一个\n\n准备 1.解过黑虎任务的ID先去伊塔工作室等\n2.要准备解黑虎任务新ID把爱相随戒指要传送的好友设为解过黑虎任务的ID\n\n   ㈠： 由亚伊欧风城出发 ，由亚伊欧城区进(17.10)\n\n   （本人认为风城比火城近)\n走到（280，338）进入蒙达村。在蒙达村，走到（53，44）\n进入村长家，来到（16，13）和伯恩说话接任务。\n   离开蒙达村，进伊甸大陆东方到(82.364)进蒙达村地下通道.\n   蒙达村地下通道(7.30)-->>蒙达山海底通道(54.13)\n   蒙达山海底通道(1.4)-->>进蒙达山(87.19)\n   蒙达山(70.61)-->>进蒙达山山洞通道(76.75).\n   蒙达山山洞通道(4.5)-->>蒙达山山洞通道(5.24)\n\n   ㈡：白天进洞的：此处白天(石器时间)\n用外挂锁定是没有用的.\n并没有黑虎挡路.晚上才有.\n   进蒙达山洞窟内(15.16)找葳娜说话.她会请你晚上再来而给你葳娜的\n   缎带。\n   等到晚上(石器时间)\n用外挂锁定是没有用的.\n再进通道和查拉(黑虎)说话进入,来到（16，15）\n   和葳娜（变身为粉红人龙）说话，交出葳娜的缎带，然后出洞。去\n   (85.36)进伊塔工作室\n   ㈡：晚上进洞的：（晚上去的从洞直接进去 ，先不要和查拉(黑虎)说话）\n   进蒙达山洞窟内(15.16)找葳娜说话.她会请你晚上再来而给你葳娜的\n   缎带，然后出洞。\n   （不用等了，你去时就是晚上）和查拉(黑虎)说话进入,来到（16，15）\n   和葳娜（变身为粉红人龙）说话，交出葳娜的缎带，然后出洞。\n   ㈢：双击爱相随戒指会立即传送到伊塔工作室.和卡罗说完话后得到一级萨格鲁(黑虎)."
