      content: "Box_吉祥如意\n\n\n看到不少玩家写的宠物预测，感觉都太主观了一点，凡事都应该经过调查才能做出结论，哪怕是发发帖子骗骗分，也应该花点力气不是？不然觉得对不住自己。\n这是我搜集的一些2转宠的资料，全是BOX里的朋友前段时间参加测试时发上来的，我稍稍整理了一下~~~~再根据看过的其他一些7。5的消息，个人觉得7。5热门宠应该就是这些了：\n\n先说人狼：2转人狼成长一般的都在7。0-7。2左右，变身之后8。5左右，应该是成长最高的了，而且加的成长全在攻敏，攻550左右，敏到390（风狼应该还能高）在2转宠里面，敏捷能比它高的应该只有青龙和新开的黄金龙了（黄金龙无技能）。不管怎么说，先出手就是优势。但是7。5会开5级魔法戒指，狼的抗魔如果没练过肯定就是一下被炸熟了，练过也不会好到哪里去，不过至少应该不会被一个魔法给秒杀了。总之看PK的时候人物的发挥吧~~~感觉狼单P会是很有用的。另外补充一句，四色狼的话应该还是水狼最吃香，7。5的其他主战宠主要还是火属性，地风狼碰到机龙朱雀之类的话会比较吃亏~~~~~地狼拿来对付乌力王不错\n\n\n再说说比较热门的机龙：见过2转机龙成长最高的有8。6，和MM成长一样，攻击上500，敏到350。一般2转机龙攻击450+，加上变态的T技，我觉得这样的宠物根本不需要打成NONO了，NONO虽然可以秒杀一切但是生存能力太低了，在白狼越来越变态的技能和攻击力之下，多了不防守3和五段的配合机龙将更有作为，况且450+的攻击力配上B3或者一击改杀人应该是足够了。另外据说机龙命中比较低，这点还有待7。5考证。\n\n\n朱雀：2转朱雀一般8。0左右成长，见过的攻击最高550，防敏大概300左右，不过奇怪的是朱雀2转后多数成长由原来的攻敏变成攻防，防要高于敏，属性全火，克到机龙5点，B2攻击绝对能够秒杀机龙。新开技能火线猎杀——伤害力600左右魔法攻击一排，比火星球的威力还要高，可以作为法师暴风雨+召雷术的辅助攻击（导电之后被电击伤害1600+，人与骑宠分配比例差不多是人伤600，宠800左右。再加上朱雀技能的600点伤害，血少的应该就挂了）不过朱雀存在命中闪避率低的问题，魔法技能多少能弥补一下攻击命中。相信以后应该会有朱雀队伍的出现。另外现在朱雀的市价是200RMB左右，所以也不要说是什么特别贵族化的宠物了，以后应该会渐渐普及的，就像以前的白虎青龙一样。\n\n\n乌力王：2转的乌力王成长7。5左右，血厚防高攻击也不差，再加上水属性和极度变态的乌力化技能（沉默+落马+魔障），中了等于等死，是以后PK场上绝对的主力。期望华裔能够对乌力化做出些调整，不然又会破坏PK的平衡性了。\n\n\n火牛：只找到一张2转火牛的资料，不过见过的1转极品成长有7。2，相信2转能够上8。0，攻防型分配。不过个人觉得狂暴如果不NONO的话就失去了威力，而NONO的弱点就是生存力太差，相信在7。5新的职业技能面前将不会有太大作为，在机龙和乌力王的压力面前，个人不看好牛牛，7。5将贬值。\n\n\n\n无魔：2转无魔成长一般，没有什么特别突出的优点，但也没什么弱点。个人觉得无魔在单P中的使用见仁见智，属性掌握的好应该可以以一当十，一切要看人物的发挥。不过团P中因为要浪费关键性的第一回合，所以就和人狼是一样的命运了。\n\n\n金暴：2转金暴好的一般在8。0左右，成长不错，分配也好，命中高，有技能是它的优势，基本可以弥补其属性上的劣势。但是觉得PK中仍然不会成为独挡一面的主力，它在PK中的地位和现在相比应该不会有太大变化\n\n\n双狼，蝎子等所有高成长无技能的宠物：2转之后成长将达到一个新的极限，但是个人认为在PK中的作用将很小，特别是双狼和蝎子这两种华裔宠，除了成长高根本毫无其他优点，而能够抓来宠物中达到这个成长的也不少，如红绿大头，飞鱼等等，但不知为何那么多人喜欢这种东西。应该不会对新的PK格局造成什么影响\n\n\n青龙，白虎：2转青龙敏到400+，不过MP2技能实用性不强，再加上命中回避极差和属性上的劣势，只能做骚扰宠使用，不会有太大用处。白虎2转成长和其他主力宠比太低了一点，再加上新开的技能是鸡肋，应该地位也不会比现在提升多少，不过出色的命中和回避应该会对劣势有所弥补。\n\n融合宠：由于2转宠物成长普遍要比融合高，融合地位将下降不少，不过大家放心，3J融合是绝对不会淘汰di！！！毕竟多样的技能能带来多样的打法，3J融合是绝对的主力辅助+骚扰宠物。至于其他的融合技能宠很大部分可能将被2转宠所淘汰。\n\n以上预测为个人意见，这些天看了不少宠物预测，想想我这个应该算是最全面的了。7。5人物技能的调整比较大，移行，冰箭，双重攻击和猎人的毒素攻击都将失去原来的作用，取而代之的是法师的暴风雨+召雷，世界末日。白狼的混乱攻击，穿刺攻击和回旋攻击，追猎的天罗地网，结界术和召唤自然。宠物的作用较7。0相比会有所提升。另外5次光镜守护的出现将改变族战和团P的格局，不过由于5次光镜守护都属于消耗品，只能使用一次，且取得比较困难（做任务拿珍珠去换）在平时的PK中应该不会被普遍性的使用。\n希望我的文章对大家能有所帮助，有什么不对的地方希望高手予以指正。"
    - path: ["『BOX资料库－－搜集整理库』（V2.0）", "『石器7.5』【法师技能学习顺序及修炼方法】"]
      content: "BOX_ngbc\n\n（一）技能学习顺序\n嗜血成性→70% 即學↓\n\n火山泉→→70% 即學↓\n\n火附體→→70% 即學↓\n\n火熟練度→練火山泉/火附體升火熟練度→有學習技能點 即學↓\n\n火星球→→即挂材料----火系完畢→有學習技能點 即學↓\n\n冰箭術→→70% 即學↓\n\n冰附體→→70% 即學↓\n\n冰熟練度→練冰箭術/冰附體升冰熟練度→有學習技能點 即學↓\n\n冰鏡術→→可練可不練 但一定要學\n\n冰系完畢/應該有學習技能點 學↓\n\n召雷術→→70% 即學↓\n\n雷附體→→70% 即學↓\n\n雷熟練度→練召雷術/雷附體升雷熟練度→雷熟練度學了後應該可以即學暴風雨\n\n暴風雨→可練可不練隨便學\n\n練練你其他不足的技能 有了技能點就即學移型換位↓\n\n移型換位→其他可以隨便學隨便練了\n\n現在你的嗜血成性一般已經100%了\n\n\nPS:火系四技和冰系四技可以換轉來學\n\n推薦先學火系 因為可以方便打材料\n\n移型換位可以學在嗜血成性後面\n\n（二）練技最合適地點:\n\n都帶整套法師裝備「火星球 暴風雨除外」\n\n嗜血成性:帶杉之環去加加打樹木 用嗜血成性且不設加血\n當血小於2時 用嗜血成性就不會再扣血了『2-3小時70%沒問題』\n\n火冰雷附體 移型換位:帶杉之環去加加打樹木 用技能 設好補血\n『3小時70%沒問題』小於50氣用嗜血成性(可以自定)\n\n火山泉 冰箭術 召雷術:帶杉之環去加加打樹木 用技能 設好補血\n『4-5小時70%沒問題』小於25氣用嗜血成性(可以自定)\n\n冰鏡術:帶杉之環去加加打樹木練冰鏡術 設好補血\n『4-5小時70%沒問題』小於50氣用嗜血成性(可以自定)\n\n以下的帶什麼道具自定\n\n火星球:一學就即可挂材料/練級 建議都是挂銅 設好補血 多少小時70%不一定\n敵人越多血數量越多越快 小於50氣用嗜血成性(可以自定)\n\n暴風雨:一學就即可挂材料/練級 建議都是挂銅 設好補血 多少小時70%不一定\n敵人越多血數量越多越快 小於75氣用嗜血成性(可以自定)\n\nPS:怎練都好!道具都有破的一天!建議大家設「道具耐久度小于65%」原登\n\n電腦快加上網速快可能不用我以上說的時間就到70%了\n\n暴風雨99%+冰熟練度99%+雷熟練度99%=扣420-450血左右\n\n結後語:\n\n法師的技能都是有關係有先後次序的 如果亂學亂技的話 會浪費你許多許多的時間和精神\n許多新手都听大蝦們說:『火星球挺棒的 無論挂 挂材料都好』\n你們的新手就著急可以快學到火星球 就嗜血成性>火山泉>火星球 你們這樣學 一來會令火星球的威力小(因為沒學火熟練度)二來你會浪費許多許多時間!\n\n例如!\n\n先學嗜血成性>火山泉>火星球\n\n是!你是70%即學下一技 但是你學錯了 因為沒學火熟練度\n\n你應該是火山泉>火附體>火熟練度>火星球\n\n因為你要令你火星球的威力上升 所以要學火熟練度在先\n\n因為你先學火星球了 所以你就浪費了你練火星球的時間去升火熟練度\n\n之後才學火熟練度 你又要花時間再出火的技能練火熟練度了\n\n（三）说明：\n这是转贴，大家可以分享一下，我要补充的是。技能的修炼可以在阿布找三兄弟练。也完全可以就在 村口遇敌打小猪。因为，外挂使用魔法的时候。默认的是打自己，魔法打自己是不掉血的，但是有效。另外，学了火星球就可以去挂素材了，这样火系的魔法，在你不经意之间就修炼的差不多了。\n\n用火星球挂素材的时候，一定要记的把攻击对象改成敌人。偶就有好几次忘了改，结果。。。呵呵\n\n大家谁还有好的经验，跟帖讨论。看看谁的比较好！"
    - path: ["『BOX资料库－－搜集整理库』（V2.0）", "『石器7.5』7.5新资料"]
      content: "Box_ngbc\n\n（一）新增的东西：\n1.四大城的天才传送师新增了传送到伊甸的项目（4000S）。\n\n2.宠物店里新增宠物共通仓库，和物品一样，左右两个人宠物互通。\n\n3.7.5就职后可以在职业工会中退职的，但是职业技能需要重新修炼了，也是为了方便大家的。\n\n4.精灵的召唤　新装备：\n柳牙系列:\n柳牙之兜：防＋４２　敏－４　电抗性精灵１\n柳牙之服：防＋５１　体力＋３０　电抗性＋１０　治愈的精灵６\n柳牙之枪：攻＋８５　敏－１８　毒雾的精灵６\n柳牙弓箭：攻＋３８（６～８）　防－１０　毒雾的精灵６\n柳牙棍棒：攻＋７４？　毒雾的精灵６\n\n雪泪系列:\n雪泪之兜：防＋３７　敏－４　冰抗性精灵１\n雪泪之服：防＋４６　体力＋５０　冰抗性＋１０　恩惠的精灵６\n雪泪之枪：攻＋８５　敏－１６　石化的精灵６\n雪泪弓箭：攻＋３８（６～８）　防－２０　石化的精灵６\n雪泪棍棒：攻＋７１？　石化的精灵６\n\n阳炽系列:\n阳炽之兜：防＋３２　敏－４　火抗性精灵１\n阳炽之服：防＋４１　体力＋２５　火抗性＋１０　治愈的精灵６\n阳炽之枪：攻＋８８　敏－１８　混迷的精灵６\n阳炽弓箭：攻＋４３（６～８）　防－２５　混迷的精灵６\n阳炽棍棒：攻＋７７？　混迷的精灵６\n\n疾翎系列:\n疾翎之兜：防＋３７　敏－４　电抗性精灵１\n疾翎之服：防＋４６　体力＋３０　电抗性＋１０　滋润的精灵６\n疾翎之枪：攻＋８２　敏－８　昏睡的精灵６\n疾翎弓箭：攻＋３８（６～８）　防－１５　昏睡的精灵６\n疾翎棍棒：攻＋７２？　昏睡的精灵６\n\n（二）三大职业的三，四阶技能：\n说明：\n1.以下技能所耗费的MP分别是熟练度100所用的MP\n2.法师的冰暴术，猎人的掠夺尸体，白狼的破斧沉舟，档格还没开放\n3.猎人的驯服宠物依然不能捕抓特殊宠物\n4.三，四阶技能学习价格为200000，结界则为100000\n\n法师三，四阶技能学习地点：沙姆岛（97，49）法师工会外\n针针相对--将敌方之血量及法力转为己用（耗费MP：10）\n附身术--召唤顽皮精灵附于对方身上迷惑其心智（耗费MP：80）\n火龙枪--操控火龙成枪形射向对方（耗费MP：80）\n电流术--将落雷的力量分成数股电流射出（耗费MP：100）\n世界末日--禁忌的咒术，具有大自然所有力量结合而成的破坏力（耗费MP：150）\n\n猎人三，四阶技能学习地点：南岛（300，568）卡鲁它那村外\n遗忘--使宠物暂时忘却所学习的技能（耗费MP：21）\n天罗地网--限制敌人行动（耗费MP：11）\n激怒宠物--暂时提升宠物能力（耗费MP：13）\n自然威能--提升火冰雷抗性（耗费MP：20）\n号召自然--号召大自然的力量转成HP（耗费MP：50）\n地结界--地属性减伤（耗费MP：20）\n水结界--水属性减伤（耗费MP：20）\n火结界--火属性减伤（耗费MP：20）\n风结界--风属性减伤（耗费MP：20）\n破除结界--破除地水火风结界（耗费MP：20）\n\n白狼三，四阶技能学习地点：北岛（651，585）萨姆吉尔庄园外\n贯穿攻击--同时伤害后排之人和宠物（耗费MP：21）\n混乱攻击--以发狂的怒气攻击敌复体（耗费MP：28）\n坐骑攻击--将攻击大部分集中在骑乘宠物身上（耗费MP：11）\n回旋攻击--以回旋的力量攻击敌方一整排敌人（耗费MP：28）\n\n（三）开放四圣兽技能：\n凯恩（青龙）—名称：MP攻击2（这个不算是7.5开放的，因为在台湾7.0里已经有了）\n获取方法：风城附近的斯克洛洞窟（86，29）5楼（29，31）打1XX黑鸡。\n效果：攻击力下降50% 并损害对方75%的MP\n\n佩露夏（白虎）—名称：浴血狂袭\n获取方法：完成南岛迷失的红虎任务并成功拿到蓝色的葡萄（任务功略参考外挂资料）\n和阿布洞七层的门卫战斗并成功打出鲁德的兜，乌鲁夫的凯和吉尔的枪\n买一瓶阿布水（密语：给我力量吧神圣之水啊发出耀眼的光芒吧）\n之后和阿布洞七层的查罕族族长（好象是叫这个名字的）对话后交出以上五件物品[蓝色的葡萄，鲁德的兜，乌鲁夫的凯，吉尔的枪，阿布水]就能拿到技能水了。\n效果：HP50%以下時才可使用 攻敏上升20% 会心一击上升30% 吸收伤害30%转HP。\n\n\n菲奇亚（朱雀）—名称：火线猎杀\n获取方法：首先要先解完吉鲁岛的任务\n『黄金羚羊任务』\n『男人村女人村任务』\n『采矿权之争任务』\n『深红洞窟任务』（任务功略参考外挂资料）\n到达那村村长家最深处有个密道，准备好后跟密道看守者说话，进入密室，跟大蛇的守护对战之后，传送到另个空间，跟他对话可以取得三根蛇的牙齿，接着走出洞口，回到达那的村长家。（注意：大蛇有虚弱、十段攻击、MP攻击、还有毒攻击，被毒攻击打到一定要解，否则回合一到必死，大蛇的血约3600，攻击力不会强到很夸张，组队打要记住，当朋友已经拥有牙齿仍想帮你时，传送进去之后你是看不到他的，可以请他不必帮了，无法组队进入密道，但进去之后可以组队挑战。）再前往深红洞窟到地下9楼跟女神说话，如果解过深红任务，女神就会跟你说感受到蛇王的用心，并滴下眼泪。接下来前往加都洛山洞(385,435)到族长房间跟男人村长取得告知信，然后前往美鲁娜山洞(450,405)跟女人村长拿协议书，接着去阿斯玛鲁矿山(483,196)六楼跟帖尼姆团长取得第二张协议书，接着前往吉鲁采石场(239,98)进去之后到一楼的左上方(71,6)进入采石场事务所跟管理员说话，取得第三张协议书，最后回到达那村，再度进入密道跟大蛇说话便可取得技能石。\n效果：杀敌一排的火焰攻击。\n\n\n美拉（玄武）—名称：铁壁\n获取方法：首先要先解完吉鲁岛的任务\n『黄金羚羊任务』\n『男人村女人村任务』\n『采矿权之争任务』\n到达那村村长家最深处有个密道，准备好后跟密道看守者说话，进入密室，跟大蛇的守护对战之后，传送到另个空间，跟他对话可以取得三根蛇的牙齿，接着走出洞口，回到达那的村长家。（注意：大蛇有虚弱、十段攻击、MP攻击、还有毒攻击，被毒攻击打到一定要解，否则回合一到必死，大蛇的血约3600，攻击力不会强到很夸张，组队打要记住，当朋友已经拥有牙齿仍想帮你时，传送进去之后你是看不到他的，可以请他不必帮了，无法组队进入密道，但进去之后可以组队挑战。）接下来前往加都洛山洞(385,435)到族长房间跟男人村长取得告知信，然后前往美鲁娜山洞(450,405)跟女人村长拿协议书，接着去阿斯玛鲁矿山(483,196)六楼跟帖尼姆团长取得第二张协议书，接着前往吉鲁采石场(239,98)进去之后到一楼的左上方(71,6)进入采石场事务所跟管理员说话，取得第三张协议书，最后回到达那村，再度进入密道跟大蛇说话便可取得技能石。\n效果：提高己方全体防御力30％ 3回合\n玄武还有一个新技能：地灵威能\n获取方法：地精灵寻找战士团团长任务\n\n（四）7.5主要任务攻略：\n(1)地精灵寻找战士团团长任务\n任务条件：完成地城古瓜任务，地城盐矿任务，梦幻洞窟（必须拿到全套空想装备—空想的竖琴，空想的帽子，空想的衣服）（详细流程参考外挂资料）\n任务流程：一开始前往地城区东北方找沙尔特的助手（12，14）说话，他会要你抓82级以上的玛恩摩洛斯给他，抓给他，他会跟你说最近他们的团长消失了，之后他会收走大象（骑大象的玩家小心了，自己的爱象给回收了就不好了哦），再前往塔耳塔战士团找汉斯说话，他会要你寻找地精灵並给你启动石，再前往沙姆岛梦幻洞窟找梦见的仙人说话，他会要你去伊甸大陆南方的一处石头排列处寻找答案，然后再到塔耳塔城区库塔伊洞窟（135雷区）的洞口前，一定不可省略去找梦见仙人這個步骤，不然石像不会理你的），找神秘巨石神像说话就可进去地精灵洞窟（地精灵洞窟的机关是由下而上边分別点选1，2，4，8个石像），点选顺利后就能拿到黄色宝珠，拿着黃色宝珠跟左上方的機机关说话，就可前往地精灵之处。见到地精灵跟地精灵说话，他会要你寻找塔耳塔战士团的的团长跟威灵石，前往伊甸园的地下洞窟的贫民窟（就是打席思，席格的洞窟），跟席巴恩说话就可到英嘉的房间，跟英嘉说话他就说要你跟她一起去监狱拯救团长並会要你把一封信交给席格，到贫民窟旁边的洞窟跟守门员说话可以去找席格了，跟席格说话他会说他也要赶去並把信收走了。之后前往伊甸园区的无名洞窟（102，127），跟站在洞口的汉斯说话，就可以进去监狱了，跟里面的监狱卫士 开战， 打完之后， 跟站在牢房里面英嘉说话，他会跟你说战争已经结束了，团长已经先回去塔耳塔战士团休息了，并把威灵石交给你，带着威灵石再度前往地精灵洞窟（记得和汉斯拿启动石），把威灵石交給地精灵后，就会给你奖品。以后只要带着＂珍珠＂給地精灵，就可以跟他换硬壳之石。（来吉卡的奖品，单人守护精灵防守3次），任务完成。\nPS：此任务拿到的奖品有好多种，下面是其中一些。\n\n上面已经说了，做这个任务能拿到玄武的第二技能—地灵威能，只要把这个任务的威灵石给玄武吃了，就能学习此技能了。\n\n(2)宠物二转任务：\n条件：尼斯大陆四大洞窟任务（参考外挂资料）和自备一个新人交换名片后备用。\n任务流程：1.到没落矿坑（444 494）1楼找到老学者（41 5）。\n2.到飞龙洞（从大象区进入，既玛蕾菲雅65级時说话的地方）遇敌打雪蒟花（打绿色或菊色飞龙）\n3.再回到没落矿坑1楼找老学者，老学者会说明一切。\n4.到达那找胖矿工（买达那羽毛入口旁）接任务。\n5.之后去解逃走的呼拔拔任务,拿解除麻痹的药解救胖矿工（会取得地图卷轴），再跟达那长老说话，长老会提示找伊拉大人。\n6.前往深红9楼找伊拉大人（深红女神）说话，伊拉会要你拿巴拿姆之壶（就是深红的水壶任务，详细参考外挂资料）完成任务后跟女神再说一次话（取得火的守护並提示有另一火之守护者）\n7.回到深红8楼，再走回进9楼入口附近有像5星符的地方会看到一颗石头与它对话（道具栏只能留下地图与火的守护证据），进入火的裂缝通道。\n8.火的裂缝通道通过时间仅有1分钟，进入后往右上移动会遇到一颗石头挡路，与石头战斗（石头不会攻击）后进入水晶通道。\n9.进入水晶通道后，找缺口通过，一直走到有水晶通柱的地方与另一火之精灵守护者说话.她会要你前往琉璃拿绿珀石。\n10.拿完绿珀石后再进入水晶通道遇敌打四水晶原石（地，水，火，风），打到四水晶石后再前往与火之精灵说话，会交给你玛蕾菲雅。\n11.前往渔村与新藏的祖母对话，拿到项链。\n12.打灵石恶梦开始~_~\n\n须知:喂了二转玛蕾菲雅和一转玛蕾菲雅的样子是一模一样的，只是二转玛蕾菲雅的手上多了一把枪。还有二转玛蕾菲雅任务是可以无限解的，只需要从第三个步骤开始重新做就可以了。\n\n附送1-79级玛蕾菲雅看风景的新地点：\nLV10：南岛加加村\nLV15：南岛奇喀喀村\nLV20：北岛柯尔克村\nLV25：现代波拉岛金飞机场（要到金飞机场內）\nLV30：南岛卡鲁它那村\nLV35：南岛拉多拉回廊\nLV40：南岛乌鲁力村\nLV45：南岛碧青洞窟（进入后地下1楼即可）\nLV50：南岛森林洞窟顶楼\nLV55：沙姆岛奇努伊村\nLV60：吉鲁岛采石场\nLV65：吉鲁岛飞龙洞（由花花世界前往之无名洞窟地下1楼）\nLV70：吉鲁岛沒落的矿坑\nLV75：奇努伊海洞关卡（封印迷宫水池前）\n就是25级所去的地方有所修改，其他和一转玛蕾菲雅的看风景地点一样。\n\n注意：宠物转生后形状不会改变，2转宠物不能骑乘,也不能参与融合.\n\n(3)魔族任务—雷尔任务:\n任务条件：四大（深红，琉璃，玄黄，碧青）洞窟任务，转生宠任务，完整精灵王任务（打败柯黑穆德才算），金飞航空任务（PC团），伊甸动物园任务，神秘老人任务，火城中的火神祭任务，火灵勇士任务。水城中的卡罗的回忆（黑虎任务），水城公主任务。地城中的盐矿任务，古瓜任务，寻找战士团团长任务。风城的千里寻猪任务（蓝猪任务），风城王子任务，打林务局局长任务，尼斯大陆的英雄的祝福任务（红暴任务），泪之海的哭泣的石头少女任务，5.0和6.0的海贼王任务，沙姆岛的梦幻洞窟任务。\n任务流程：\n1.去伊甸园雷尔官邸找雷尔接任务.接完任务后就开始找4大精灵拿精灵的力量.\n水精灵的力量：去水城，水城城堡旁边水精灵的小屋里和水精灵对话\n风精灵的力量：去伊甸大陆南方的迷雾森林和风精灵对话\n火精灵的力量：去伊甸大陆北方的火山道场和1楼的人对话可以传送到火精灵面前和火精灵对话\n地精灵的力量：首先来地城东北区（12，14）接任务，之后来到塔尔塔的战士团（33，16）对话，如果你带着大象就可以拿到任务石了。之后再去解奇努伊的梦幻洞窟任务（参考外挂资料），和那个老头说话。他会叫你去伊甸大陆南方看石头暗号（也可以不看而直接去找地精灵），之后来到库塔伊洞窟（135雷区），按着1248的顺序点击雕像（说错了或者多说了就把宝珠扔了），拿到宝珠后，来到地精灵洞窟的（21，5）跟机关对话就能看到地精灵的了和地精灵对话\n\n2.再次去伊甸园雷尔官邸，和雷尔对话会被传送到地牢里\n\n3.进去之后和里面的NPC—亚巴对话，他会给你一个老鼠爱吃的大福。之后就努力的在地牢中等待老鼠的出现（要给耐心，可能拿到后立刻可以看到，也可能等好几天，在里面是不能出来的，除非拿到老鼠的钥匙）要是你有朋友的话就叫他从伊甸园外290.68附近进入地牢（前提不要接雷尔任务），进入后遇敌打吉比，打到老鼠爱吃的大福后再在地牢里找一个站着的吉比，找到后吉比会消失，他就会跑到你所在的地牢里去了，自己打完后去跟那个坐在那里的王子说话，拿到钥匙后再去那个栅栏那里点牢门，就能出来了。\n\n4.出来后去找四大精灵，他们都给雷尔控制住了，分别打败四大精灵（地精灵，水精灵，火精灵，风精灵，每次战斗都是10个140的魔界使者，会5段，沉默，虚弱）后可以拿到骨头。有了4个骨头后跟任意精灵说话会得到5级魔法戒指（简称原子弹）\n\n5.打败四大精灵后去伊甸园找雷尔。说话后立刻战斗。之后进入最后的战斗，打败后和雷尔说话就能拿1级的哈利恩斯（圣光龙）。\n\n雷尔打法：一定要5个人去打，法师可以单挑，不过难度比较大。最好先打旁边的小怪。雷尔会变三次身。第一次变身后要立刻杀后面的“魔界之门”，不然后果自负。三次变身后的雷尔高达300级，而且第三次变身后是不中精灵的，所以法师一个人也未必能打倒他。所以要打的还是努力修炼修炼吧。\n\n\nPS：这个任务可能是华义中最值得做的任务吧，在我们测试7.5的时候，不知道有多少人被困牢房，而总的来说一个老鼠就只能救一个人出牢房，我们在牢房里面要排队由外面“赶鼠义工”救出来而离开的，这才是能体验团体精神的一个任务。\n\n再PS：老鼠吉比的出现地点：\n一楼：11.8 (33,23)\n二楼：6.17 (09,06)\n三楼：12.15 (31,05)\n四楼：14.7 (15,05)\n五楼：22.25 (33,15)\n六楼：11.8 (25,06)\n七楼：14 .7 (34,30)\n八楼：31,14 最后1楼\n\n(4)人物六转任务：\n条件：1.解过寻找战士团长任务（详细功略查看上文）\n2.解过雷尔任务（详细功略查看上文）\n3.解过二转玛蕾菲亚（详细功略查看上文）\n4.带着二转的四大村出生宠（乌力乌力，威伯，凯比，克克尔随便一只）\n5.带着十五个魔门碎片（打赢雷尔后跟魔界之门对话可重复拿取）\n6.解过精灵的召唤（详细功略留意下文）\n任务流程：完成以上条件后，和精漆黑洞窟20层的精灵王对话，就可以进行转生了。\n\n6转完成，6转后人物的名字呈灰色，且有60点红利的分配。\n\n奖品：帖伊诺斯（机械人龙）属性：火5风5 能够学习机暴的T字技能\n\nPs：6转任务又多了个新条件，就是必须带上雷尔任务给的哈利恩斯（圣光龙），要是不带，就给你园地转生了，还不给你（帖伊诺斯）机械人龙，这点请大家注意！\n\n(5)新功能—精灵召唤\n条件：原理就是当你在升级或者分配点数的时候，有一定几率得到精灵的召唤，得到精灵召唤的时候会发现屏幕左上角的CALL（召唤）会闪烁，点击后会得到“使者信物”和“勇者信物”，这时你就需要双击勇者信物，就会传送到勇者身边，再给他“勇者信物”，让他来完成任务，当他完成任务后，你和他也能得到丰富的奖品，这个就是什么东西呢手带新手”的概念，以下是信物的用途：\n1.使者信物：勇者打倒指定魔王后可换奖品\n48小時不用自动消失，不可交易，装备時不遇敌\n2.勇者信物：使者点击時会传送到勇者身边\n勇者点击，系统会通知魔王的位置\n可交易可邮件但不可丢弃\n使者打倒指定魔王時可换奖品\n四大龙蜥洞窟坐标：地龙蜥洞窟：地城区（272，178）\n水龙蜥洞窟：水城区（213，26）\n火龙蜥洞窟：伊甸大陆北方：（308，281）\n风龙蜥洞窟：伊甸大陆南方：（238，96）\n\n四大龙蜥洞窟任务：\n条件：身上带着不可思议的贝壳和勇者信物。\n\n地龙蜥洞窟：先走去地城战士团找古瓜（别告诉我不知道是谁），和他对话，他会说最近的粮食都被一些生物吃掉了，后再走去战士团右边那个人，对话，他会告诉你生物所在的地方，再回去找古瓜，他会叫你料理五样料理：\n豪华游乐套餐（伊甸旅馆就有卖）\n大饭团（米2+盐2+水2+海藻2）\n草莓大福（米2+豆2+糖2+草莓1）\n特制莎拉（芦笋3+包心菜3+盐3+油3+胡椒3）\n镜年糕（米4+炭4+橘子4+海藻4）\n把这五个料理交到古瓜手上，再去和战士团右边那个人说话，就可以去地龙蜥洞窟了。洞就在地城区（272，178），进去地龙蜥洞窟后，遇敌打地龙蜥，打到5颗牙后，再和古斯特对话，就能进去打地龙蜥头目了，打败后能拿到头目的牙去找战士团右边的人，把牙交给他，他就會叫你去找流浪旅人（萨姆吉尔村73，72）拿奖品。\n\n水龙蜥洞窟：任务首先先去抓三个宠物（等级不限）：\n姆伊（打40级海主人处）\n克邦凯斯（福村海底洞窟进去打珍珠处）\n萨美洛斯（英雄岛120水雷海边）\n然后去水城找邬莉叶（接水怪任务的那个人，在水城皇宫门口），她说最近水怪又來捣乱了，叫勇者帮帮她，再和她前面的守门员说话，传送进去水怪洞，走到地下8层，遇到大水怪，和他对话后得知他们最近被一种可怕的魔物骚扰，他说他的儿子很饿，请勇者帮他找一些食物给他儿子。上面抓的三个宠就有用途了（好残忍啊），把三个宠给他后，他会给你3个氧气草（挂过海底的人都知道是什么了，海底中呼吸3小时），然后到水城区（213，26），进去水龙蜥洞窟后，遇敌打水龙蜥，打到5颗牙后，再和古斯特对话，就能进去打水龙蜥头目了，打败后能拿到头目的牙去找邬莉叶，把牙交给他，他就會叫你去找流浪旅人（萨姆吉尔村73，72）拿奖品。\n\n火龙蜥洞窟：先去火城找国王，之后去火山道场找拉法特（就是接火神祭的那个人），对话后拿到“火灵勇者的证明书”，就回去找国王，他會叫你打伊甸北方打败怪物，洞就在伊甸大陆北方：（308，281），进去火龙蜥洞窟后，遇敌打火龙蜥，打到5颗牙后，再和古斯特对话，就能进去打火龙蜥头目了，打败后能拿到头目的牙去找火城国王，把牙交给他，他就會叫你去找流浪旅人（萨姆吉尔村73，72）拿奖品。\n\n风龙蜥洞窟：先前往风城找风城王子，说话之后他叫你去伊甸找林务局长，跟局局长说话后拿到木头，回到风城，王子会叫你去风龙蜥洞窟，到风龙蜥洞窟的路上或附近会找到一个伐木工人，讲完话后，拿到火把（有效时间为1小时，熄灭了可以去拿过），在伊甸大陆南方（238，96），进去风龙蜥洞窟后，遇敌打风龙蜥，打到5颗牙后，再和古斯特对话，就能进去打风龙蜥头目了，打败后能拿到头目的牙去找风城王子，把牙交给他，他就會叫你去找流浪旅人（萨姆吉尔村73，72）拿奖品。\n\n奖品：“勇者”拿的是6级精灵装备，“使者”拿的是小道具。\n\n（五）九大庄园新增买卖各种素材\n1.所新增的庄园商店有四家：\n（1）：是卖记忆羽毛和四大洞窟的羽毛的，价格为20000不等，消耗2点声望，记忆羽毛则消耗5点声望。\n（2）：是卖通用物品，例如恶魔宝石3，月神首饰3，太阳3不等，价格幅度较大，所以这里不一一说明了，还是要消耗声望的。\n（3）：是卖10级和11级的素材的，10级素材价格为100000S，而11级素材就是为200000S，还要消耗一定声望。\n（4）：是卖一些庄园专有的特殊物品，例如珊瑚素材，各类矿石，当然也是要消耗声望的了。\n2.庄园10-11级素材和药材售卖点：\n萨姆吉尔：爪10-11\n玛利那斯：壳10-11\n卡鲁它那：叶10-11\n加加：花10-11\n伊甸：骨10-11，线10-11\n塔耳塔（地城）：黏土10-11，水晶10-11 5级防药材\n尼克斯（水城）：贝10-11、鳞10-11 5级血药材\n弗烈顿（火城）：牙10-11、石10-11 5级攻药材\n亚伊欧（风城）：木10-11、皮10-11 5级敏药材\n3.庄园专用商店售卖点：\n萨姆吉尔：红珊瑚\n玛利那斯：蓝珊瑚\n卡鲁它那：绿珊瑚\n加加：火山岩\n伊甸：钻石矿\n塔耳塔（地城）：黄宝石矿和绿宝石矿\n尼克斯（水城）：铁矿\n弗烈顿（火城）：红宝石矿和蓝宝石矿\n亚伊欧（风城）：铜矿\nPS：商店进入方法：\n（1）和（2）就在所在的庄园门口买通行证就能进入了，进入后通行证会消失，一个通行证1000S。\n（3）无须任何特别条件就能进入了。\n（4）则是需要持有该家族的邀请函才能进去的。\n\n（六）修改庄园约战原有规矩\n从2.0版的家族功能开放以来，庄园的约战成了石器中的家族大事。三年下来，以声望值为挑战权的规则，让九大庄园成了少数家族的家族事业。而庄园的所属村庄热门程度的不同，也让部份的庄园家族毫无收入，变得极为冷清。\n在7.5版的庄园约战部份，规划出了一套新的规则，目的有两个：一个是活络家族间互动功能，另个是扩增庄园财源，让庄园无论冷门或是热门，都能有一份代表庄园价值的收入......\n庄园战规则\n（1）气势计算：\n1.个人加入家族始得计算：\n◎增加声望同时增加与声望值相同的气势值。\n◎加入/退出家族个人气势归零。\n◎系统确定玩家家族为挑战方则该家族成员不得退出家族。（系统于挑战期当日19:00确定挑战家族之后。）\n◎个人未加入家族时，无气势累加，直到加入家族才开始执行气势计算。\n2.家族气势：\n◎（(家族人数平方／10+1)+ 成员完成各活动后增加的气势加总）。\n（2）持有庄园条件：\n1.击败守护家族。\n2.守护家族守护战获胜。\n（3）庄园战斗周期：\n准备期：休战期隔日0:00起算过二日。\n挑战期：准备期隔日0:00起算至当日19:00。\n休战期：挑战期当日21:00起算过一日止。\n实战期：挑战期当日20:00起算至当日21:00\n（4）约战时间与条件：\n时间：休战期过四天后，挑战期当天0:00开始一直到20:00决定参加挑战的流浪家族。\n新增：挑战期间前气势前十大家族看板以利玩家判断。\n条件：挑战期间，提出约战的流浪家族中为所有流浪家族中气势最高者获得挑战资格。\n（5）庄战后即得利益：\n1.取得庄园者：\n◎家族气势值X 10000－(家族成员个人气势 X 5000)=家族所获得石币，纳入家族银行（家族银行溢满系统回收），守庄成功的家族才会以家族气势折算石币，同时攻/守方气势归0\n◎个人气势 X 5000=个人所获得石币，纳入个人银行（个人银行与身上无法置放则回归家族银行）。个人奖金则是需要守庄成功时，人物登入在对战伺服器中才会计算，以个人气势折算石币，但不论人物在线与否个人气势一定会归0\n◎取得庄园内各商店经营权幷取得商店各税收。\n◎个人以及家族总气势归零。\n◎挑战期如无人宣战，视同守庄成功。挑战期过仍会以气势折算石币，同时气势归０\n2.本周参战战败者：\n◎个人以及家族总气势归零。"
