      content: "原创：BOX_搪瓷娃娃\n\n更新7.0以后，华义开放了包括宠技罐头在内的诸多新的宠物技能，娃娃最近无聊的时候去PK和做任务有了一些心得，发出来和大家共享一下。\n\n事先声明一下，以下列出的技能并不是按照实用程度先后的顺序，每个技能都有不同的用处，这里只着重说一下新技能的实用价值以及一些6.0PK常用特技在7.0的地位：\n\n1.净化：应该说华义开放的新宠技罐头中，这个技能是非常有实战价值的，其效果相当于高等净化LV2，可以解全部的异常状态，包括法师技能产生的冰冻，猎人的树根缠绕。\n\n2.铁壁：使用对象是全体，效果是被命中后抵消30％伤害。单P的作用并不是很明显，团P的时候作用就非常可观了！因为可以抵消30％的伤害，所以原先NONO机暴2000＋的伤害就可以被抵消成1400＋，因此有铁壁技能的保护可以在相当的程度上削弱NONO机暴的杀伤力。但是狂暴NONO对铁壁依然有效，狂暴的伤害通常是3000＋，被抵消一下仍然有2000＋的伤害，被NO到还是要飞的，因此狂暴NONO在7.0已经成为新的焦点了。\n\n3.剧毒：对象是敌单体，使用后对方如在6回合内没有净化，则阵亡，每回合损血10％。这个技能团P的实用价值并不高，单P中可以给对手造成较大心理压力，另外因为有类似猛毒的损血效果，所以在消耗战的时候是很有用的。打英雄战场的时候，剧毒也是很好的技能，尤其是对付会复活和HP回复的敌人，对BOSS也同样有效，但是对100F以上的BOSS效果不好。\n\n4.救援：给血牛宠物提供了发挥自己价值的空间，使一般的宠物也拥有了给主人补血的能力，但是因为是单体，而且使用的代价是扣掉50％的现有HP值，因此只能在应急的时候使用，平时的实用价值不高。\n\n5.沉默：单P和团P中依然是常用技能，族战必备，作用在于压制对方的医生和护士。但是因为破除沉默和净化罐头的介入，其压倒性的优势已经不存在了，在7.0，沉默在团P中的作用和普通精灵基本持平，但是因为其抗性无法通过道具来提升，所以还是有一定的优势的。\n\n6.闪避：个人觉得闪避一直是很BT的技能。如果有铁壁的保护，团P中大可不必使用闪避以节省回合数使用其他的技能。单P中还是相当好的技能，尤其是防过300的闪避技能CC，即使被合击到也不会有致命的伤害（白狼除外），因此还是会让对手很头疼。在英雄战场中，闪避的作用就非常明显了，使用以后，战场中诸BOSS和小兵100％无法命中，因此，有一只闪避技能C的话，打倒132F的可能性就会大大提高了。\n\n7.狂暴攻击：相当好的技能，无论在单P还是团P中都非常有效！使用狂暴C的关键是控制属性，属性控制的好，就会给对方造成致命的打击。狂暴NONO融宠的威力也非常可怕，其伤害远超过NONO机暴，即使没有NO出来，仍然有狂暴技能的效果（3-10段），而不会像NONO机暴那样浪费一回合，但是就其取得难度上讲，也比NONO机暴高很多。推荐给大家2个7.0NONO狂暴融合C的最佳配方：克雷多＋鲁比/火牛＝绿熊（水9），培罗多＋鲁比/火牛＝风熊（风9）。\n\n8.撕裂伤口2：PK中，其地位和6.0时候差不多，因为是强制性的按照百分比扣血的技能，因此撕裂2的实战价值依然很高。撕裂2的实际效果是攻-20％，防-20％，这点需要提醒大家注意。另外撕裂2技能在英雄战场中是非常实用的，这里就不多说了，大家在6.0就已经在用撕裂2欺负精灵王了。\n\n9.落马：因为法师闪避技能的出现，造成众多物理攻击类型的特技对法师的威胁降低，但是因为有石化，昏睡精灵的存在，另外还有猎人的树根缠绕技能（让对方无法做出回避），落马的实战作用依然是比较高的。\n\n10.怯战：不到万不得已，还是不要对怯战抱有太大期望的好...P.S.怯战对英雄战场诸BOSS有效。\n\n11.虚弱&嗜血：实战价值不高。嗜血技配合救援可以实现打素材不废气，但是打铜似乎依然比较吃力的说...等待虚弱3和嗜血3的来到......"
