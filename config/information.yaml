      content: "提醒：\n１.你的地水火风抗魔值必须到６５％以上（如果不够请到英雄战场内训练你的抵抗力，因为精灵王的魔法实在是强，最好练到９０％以上就不怕了）\n２.必须有顽强的毅力和精良的装备，下面有法师带的装备\n第一部分：大战黑暗精灵王\n\n◎最新提示：【真*灵力铠】可以交易，而以前的灵力铠不能交易\n\n一、进入封印迷宫准备工作：\n\n◎7.0法师最容易通过\n\n装备：珊瑚兜3　　推荐：苍绿之兜\n      法师装备系列 注：如果你有小号寄气的话建议装备苍绿之凯或恩6\n      昏睡的精灵武器    你可以带５级以上的全体精灵装备\n      毒雾的精灵武器    你可以带５级以上的全体精灵装备\n　　　备用武器：　　　　双头叉一把\n\n宠物：\n1.魔法防御高点的宠物\n2.金暴（撕裂2粉管用）\n3.带有猛毒攻击的宠物        （猛毒技能来自华义来吉卡）\n\n\n二、进入封印迷宫、接任务\n\n条件：已成人，已做宠物转生任务。\n\n来到奇努村，进入海底隧道，对着水池像说出：地为界水为凭火为引风为\n信，就来到封印迷宫。\n\n部分网上攻略所写的“与上一个进入者必须相隔三分钟以上才能在进入”\n是错误的，真实的是随时\n\n可进。\n按以下坐标前进，在前进时遇敌逃跑。\n\n1、07．23\n2、44．04\n3、16．25\n4、40．14\n5、26．29\n6、35．41\n7、43．20\n8、43．40\n9、07．23\n10、44．04\n11、16．25\n12、40．14\n13、26．29\n14、35．41\n15、43．20\n16、43．40\n\n到达第八层，向玛蕾菲雅说话，她会传你到精灵王里，向精灵王旁的玛丽\n娜斯接任务，玛丽娜斯要求你去打四原石制作【真*灵力铠】。\n注意：在封印迷宫原地注销会回水池前。\n\n\n\n和玛蕾菲雅说话会传到黑暗精灵王里  接任务\n\n\n三、打四原石\n\n接着回头下一楼打四原石，下楼坐标如下：\n\n1、07．42\n2、28．25\n3、34．08\n4、24．23\n5、07．13\n6、25．25\n7、08．04\n8、25．22\n9、07．42\n10、28．25\n11、34．08\n12、24．23\n13、07．13\n14、25．25\n15、08．04\n　沿路遇敌逃回一楼，开始打原石，记着一定要按照地．水．火．风顺序打\n原石，否则会很惨。\n\n　第一层是地精灵，第二层是水精灵，第三层是火精灵，第四层是风精灵。\n　打原石注意：\n\n　一、一定要从8楼按上面坐标回1楼打，原地注销重进1楼打不到。\n　二、一定要打75级的精灵，打70级的精灵是没原石的。\n　打精灵方法：法师移形后火星球，宠物不防守即可\n\n\n\n四、拿四色原石，打宝石\n　打完四原石，带回到第八层给玛丽娜斯，他会跟你说这不是可以做灵力铠\n的4颗石头，但是他会帮你合成四色原石以取得能制作灵力铠的四宝石，接\n着回头下一楼打四宝石，下楼坐标如下：\n\n1、07．42\n2、28．25\n3、34．08\n4、24．23\n5、07．13\n6、25．25\n7、08．04\n8、25．22\n9、07．42\n10、28．25\n11、34．08\n12、24．23\n13、07．13\n14、25．25\n15、08．04\n　沿路遇敌逃回一楼，开始打原石，记着一定要按照地．水．火．风顺序打\n原  石，否则会很惨。\n\n　第一层是地精灵，第二层是水精灵，第三层是火精灵，第四层是风精灵。\n　打宝石注意：\n\n　一、一定要从8楼按上面坐标回1楼打，原地注销重进1楼打不到。\n　二、一定要打85级的骑暴暴精灵，打70级的精灵是没宝石的。\n\n\n五、拿灵力铠\n\n打到四宝石之后，走回第八层，和玛丽娜斯说话，玛丽娜斯会帮你制作灵力\n铠（铠12恩惠5），这样你就可以挑战黑暗精灵王了，不过以你一人的能力\n是没法打赢黑暗精灵王的，找好5人一队才打黑暗精灵王。\n\n\n\n\n\n4．挑战黑暗精灵王\n\n最精彩和激动人心的时候开始了。\n\n挑战黑暗精灵王前，请各位队员检查一下自己的装备。\n\n个人建议：\n\n人血最好不能少于600血，否则很难打。\n\n宠物：每人四个NONO蓝雷龙，不怕自己爱宠掉忠的可以不用这幺多雷龙。\n\n装备：每人都装好灵力铠，装满阿布水（好处不用说），最少二人拿毒雾爪\n，二人拿全体睡爪，一个带复活光。\n打法：\n\n建议敏高的队员每回合恩惠、二人放睡或石、二人放全体毒。\n\n恩惠的队员最好是光明精灵族的一个阿布水可恩5次，如是黑暗精灵族只能\n恩3次，记着有一位队员在恩惠队员第5或第3次恩惠时向恩惠队员补个阿布\n水。战斗中，NONO水雷死了就立换另一只NONO水雷出来，如有队员晕倒，\n高敏的复活，低敏的恩惠。\n\n一般来说，20只NONO水雷够你们打赢黑暗精灵王了。\n\n大战黑暗精灵王精彩组图\n\n\n中岩石魔法  中水魔法 中火魔法\n\n中火魔法 - 中风魔法\n\n全体恩惠 最后一击\n打过黑暗精灵王后，直接传去天空之岛。\n\n其实我认为黑暗精灵王并不象部分网上攻略那样难打，只要分配好工作，有\n一个高敏的队员，都带上NONO水雷，这样就可轻易打过的。第二部分：进入\n天空之岛，挑战柯黑穆肯\n\n一、拿羽毛、加150声望\n\n打败暗黑精灵王，就被传送到天空之岛。\n\n\n\n到达天空之岛\n来到天空之岛后，一定要第一时间和上图的地精灵玛蕾菲雅说话两次，你会\n加150声望和拿到一条出生地的羽毛。\n注意：如不说话两次，是不能加150声望和之后不能拿魔法戒指，不过回头\n再说就可以了。\n\n二、挑战地守护雅尔丝\n\n一路遇敌逃跑到（47. 71）和大队集合，挑战地守护雅尔丝，\n\n 准备挑战地守护雅尔丝\n 与地守护雅尔丝战斗中\n\n地守护雅尔丝不难打，有人每回恩惠、有人睡、毒就行了，打完向地守护\n雅尔丝说话，可拿LV1的地魔法戒指。\n三、挑战水守护瓦琦儿\n\n一路遇敌逃跑到（58. 67）和大队集合（途中有LV1的银穿山甲捉），挑战\n水守护瓦琦儿，\n\n准备挑战水守护瓦琦儿\n 与水守护瓦琦儿战斗中\n\n水守护瓦琦儿不难打，有人每回恩惠、有人睡、毒就行了，打完向水守护瓦\n琦儿说话，可拿LV1 的水魔法戒指。\n四、挑战火守护费尔叶\n\n一路遇敌逃跑到（58. 36）和大队集合（途中有LV1的银蛙捉，建议血不高\n别抓，否则飞了麻烦，不如打完精灵柯黑穆肯回头抓），\n\n准备挑战火守护费尔叶\n 与火守护费尔叶战斗中\n\n火守护费尔叶难打一点，建议先让部分敌人睡了，有人每回恩惠、有人毒就\n行了，打完向火守护费尔叶说话，可拿LV1 的火魔法戒指，另外要注意的是\n拿完戒指出洞时不要走太快，这路段极易卡在石头里，如卡了在石头里，用\n删除地图方法移出来就行了。\n五、挑战风守护威恩德\n\n一路遇敌逃跑到（53. 37）和大队集合(注意要走过两次红色门），挑战风\n守护威恩德，\n\n准备挑战风守护威恩德\n 与风守护威恩德战斗中\n\n水守护瓦琦儿不难打，有人每回恩惠、有人睡、毒就行了，打完向水守护瓦\n琦儿说话，可拿LV1 的水魔法戒指。\n六、虚幻之界\n\n\n\n在虚幻之界行走中\n\n注意：\n\n1、虚幻之界里呆多长时间都没事。\n\n2、请不要在虚幻之界乱走，否则传回天空之岛入口就麻烦。\n\n进虚幻之界不是跟这豆丁妹妹说话（说话不会有事的），是向左走和男孩(12\n.31)说话进入的，因没抓图所以在这里说明一下。\n\n\n3、虚幻之界传送点坐标如下:\n\n入口(12.31)＝＝＞(19.31)＝＝＞(19.43)传送到第一位置\n\n在从第一位置＝＝＞(28.11)＝＝＞(29.11)＝＝＞(29.14)＝＝＞(34.14)＝\n＝＞(34.10)＝＝＞(33.10)传送到第二位置\n\n第二位置＝＝＞(35.26)＝＝＞(35.24)传送到第三位置\n\n从第三位置＝＝＞(23.51)＝＝＞(23.40)＝＝＞(27.40)＝＝＞(27.41)＝＝\n＞(29.41)＝＝＞(29.42)传送到第四位置\n\n第四位置==>(43.41)==>(44.41)==>(44.40)==>(47.40)==>(47.38)==>(48.\n38)==>(48.41)==>(49.41)==>(49.42)==>(50.40)传送到第六位置\n\n从第六位置＝＝＞(19.38)＝＝＞(19.44)＝＝＞(14.44)＝＝＞(14.40)＝＝\n＞(12.40)＝＝＞(12.46)传送到第七位置\n\n从第七位置＝＝＞(37.19)＝＝＞(38.19)＝＝＞(38.18)＝＝＞(40.18)＝＝\n＞(41.18)＝＝＞(41.15)＝＝＞(42.15)＝＝＞(42.13)＝＝＞(47.13)＝＝\n＞(47.17)＝＝＞(45.17)＝＝＞(45.18)＝＝＞(44.18)＝＝＞(44.19)传送到\n最后的小岛\n\n注意：虚幻之界是可以原地登出的！最后小岛也可以原地登出！\n\n\n 准备挑战黑暗精灵柯黑穆肯\n\n七、最后决战精灵柯黑穆肯:\n\n我个人认为精灵柯黑穆肯比黑暗精灵王难打，主要四大骑暴暴守护的攻非常\n高，虽然黑暗精灵柯黑穆肯会中精灵，我947血骑宠也给火精灵飞了下鱼村，\n让我受够苦头，总之我的总结是：四大难打，五人易打，打时先睡石大部分\n敌人，然后逐一毒死敌人。\n\n两次挑战黑暗精灵柯黑穆肯的精彩组图\n\n八、拿黑羊，声望加200点\n\n打完黑暗精灵柯黑穆肯直接进入最后位置，和精灵柯黑穆肯说话，拿到黑羊，\n声望再加200点。\n\n完成任务，拿黑羊，加200声望\n\n\n\n本人依依不舍向大家道别\n\n九、总结：\n\n天空之岛之旅可加700声望，其中个人加350声望，家族综合声望加350，是\n一个极好加声望的任务\n\n。尽管黑暗精灵王和黑暗精灵柯黑穆有点变态，不过只要大家团结一定可以\n完成的。再次建议组队上5人再打，4人打太难了，本来想在攻略里详细写完\n打法的，不过石器里高手如云，还是让玩家自由发挥，全程感受精灵王任务\n的刺激性好。\n十、最后补充：\n\n一、捉银蛙、银穿山甲\n\n拿了黑羊后从右下角的洞口回原来走回火地界捉银蛙，回水地界捉银穿山甲。\n\n不过一定不要在回路中和下图的豆丁妹妹说话，否则会传回水池旁。\n\n容易令人受骗的小黑精灵\n\n二、灵力铠不能掉，掉了暂时不能重拿，估计还没开放重拿任务（以后成人\n加在身上行了）。\n\n三、天空之岛记录点记录需要灵力铠。\n\n四、打完黑暗精灵王不能再打，打完黑暗精灵柯黑穆肯，以后还可以再打，\n不过不加声望 ，不能拿黑羊。\n\n五、魔法戒指可重拿，打过守护，再和他说话就行了。\n\n六、血低于600大于400的玩家，建议多练魔法的抗性，才加5人一队的去打，\n这样可加强回避黑暗精灵王的魔法，顺利通过。\n\n七、血低于400的玩家，建议多练魔法的抗性，叫朋友帮忙，在最后一击时H\nELP和一人退出，你加进去，你就能上天空之城了。\n\n八、传说中天空之岛有125左右的宠物练级是错误的，天空之岛只有恐怖的\n精灵打。"
