      content: "◎任务条件：带有不可思议的贝壳\n                  需要完成5.0和6.0的海贼王任务\n                  带上地成份7以上和水晶成份7（水晶7在卡坦村的道具店买.地成份7则在4大村的便利商店里面都有），以后任务需要\n                 带上一头1级昆伊或凯比特，学习一个合成技能（不要告诉我不知道那里学，汗……）\n◎任务奖品：精炼技能学习书和进入瑞尔亚斯之都的资格！\n◎任务流程：先从奇喀喀村(102.1022)前往泪之海，打过宫本蚊帐，再打败沉船门口的鲨鱼（沉船不知道在那里？就在6.0的海底版海贼王任务最终BOSS贝克那里哦。还不知道？那就告诉你，那里的坐标是泪之海(182.322)，记得哦），到了沉船与贝克对话，贝克希望你能帮他完成他的使命，他会给你7个炼金粉末，接着最难的部分来了——炼金粉末+地成份7+水晶7，之后合成 有机会变成欧拓首饰。而旋涡信道就在进入沙己夫换气道的洞口旁边，而每一件欧拓首饰，都是只可以过一个旋涡，我们要在这之前先合成一个欧拓首饰，顺利过了第一个旋涡（一共有5个旋涡要过，你现在才过了第一个而已，加油吧！PS提醒一下，不要想坏主意，提早合定5个过旋涡，这样的话，旋涡会一下把5个全吃的，心痛吧！也就是说，除了我们先合好的那一个，我们还需要用7个炼金粉末，合出最少4个的欧拓首饰才过得去，汗……）走过漩涡以后，先别急着进去洞窟，在接近洞口附近地上的虾的图案对话，可以拿到精炼的奥义。接下来进入洞口会到深海信道。\n走法如下：\n    深海(13.18)->(5.4)->(48.26)->(40.30)->(27.45)->(20.60)->(46.39)->(33.5)->到达浅海信道->浅海(25.4)->浅冰(30.45)->冰颤(25.5)->冰颤(24.14)->冰颤(16.21)-> 冰颤(17.22)-> 冰封(43.6)-> 到达瑞尔亚斯之都了，恭喜你，终于来到这个世外桃源了。想要记录的话，你可以回冰封信道进入无息之境，打取修尼修尼的肉，再回到冰城记录点，即可记录了。\n之后前往瑞尔亚斯的研究所，把奥义交给所长，研究书第2卷交给首长之后拿到惩戒令，在去沉船找贝克可以拿到精练宠物技能书，任务结束。\n至于瑞尔亚斯庄园在那里？答案是：无息之境的(89.58)\n一下子完成两个任务了，可是累死笔者我呀！精练宠物技能书有什么用？请继续留意下文，我们会有详细的解释的哦。\n◎瑞尔亚斯庄园所卖的东西目录：\n非封闭商店：营养的水母，营养的小虾，营养的鱼苗，营养的水母\n封闭商店：宝石夹，萨那之沙（地的成份12），萨那火炎粉（火1的成份2），萨那之泉（水1的成份2），萨那羽毛粉（风的成份12）\n◎瑞尔亚斯羽毛：无息之境(144,198)可打到\n\n附录：瑞尔亚斯之都全人物地点坐标（完全原创） ：\n\n—— 以下是引用 ——冰封通道入口:87.6\n瑞尔亚斯的道具店:82.17\n    瑞尔亚斯的道具店店员:18.16\n民房A:83.30\n瑞尔亚斯的便利商店:59.17\n    特产品贩卖员:14.14\n    素材屋(石,木):18.14\n    便利店店长:23.18\n    素材屋(牙,皮):24.25\n    素材屋(贝,鳞):25.30\n    素材屋(属性):25.35\n    物品寄放店:22.44\n瑞尔亚斯的肉店:65.32\n    瑞尔亚斯的肉店店员:14.16\n瑞尔亚斯的武器店:75.53\n    瑞尔亚斯的武器店店员:12.15\n    瑞尔亚斯的防具店店员:19.15\n瑞尔亚斯的医院:85.48\n    瑞尔亚斯的药剂师:17.16\n    瑞尔亚斯的护士:19.16\n    瑞尔亚斯的医生:19.19\n    瑞尔亚斯的美容师:25.13\n瑞尔亚斯的首长家:77.70\n    守护卫士A:门外77.68\n    守护卫士B:门外77.73\n    家族银行:19.17\n    家族管理员:19.19\n    首长瑞尔纳:17.21\n民房B:67.75\n    纱美加:17.18\n瑞尔亚斯的训练所:44.13\n    训练所宠物店:9.6\n    宠物训练师:15.6\n    训练所营养师:20.9\n    训练所所长:20.10\n    训练所助理:20.11\n    战斗练习生:10.17\n民房C:36.33\n瑞尔亚斯的研究院:32.45\n    研究者梅屋·塔夫:19.8\n    研究者  杉卓:24.9\n    研究室助理:23.18\n民房D:21.38\n    好心的大妈:17.16\n    医护人员:12.17\n瑞尔亚斯的学习厅:16.21\n    教师:18.8\n民房E:20.55\n    年迈的母亲:18.18\n    妮提希思:11.9\n民房F:13.55\n民房G:40.86\n    可娜丝:15.16\n瑞尔亚斯的议会厅:入口A:24.77\n                 入口B:17.70\n    议会警卫A:35.21\n    议会警卫B:35.30\n    守卫队队长  涅齐:39.28\n祭司爱津:47.49\n瑞尔亚斯的储存点:48.52"
