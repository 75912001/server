      content: "试验目的：骑宠的防是否影响人损血。\n试验坐骑：\n1.转金飞136/1619/攻335/防260/敏265\n2.转黄虎139/1586/攻328/防227/敏283\n3.转绿穿130/1488/攻263/防348/敏108\n\n也是就金飞防260黄虎防227绿穿防348。\n\n试验方法：同一个人骑不同宠，用140的机暴背3打，看损血量！\n试验结果：\n1.骑金飞打中8次（出星星的损血没用）平均值为249.8\n2.骑黄虎打中8次（出星星的损血没用）平均值为241.9\n3.骑绿穿打中8次（出星星的损血没用）平均值为244.1\n试验结论：骑宠防不影响人损血。\n\n不信的朋友可以自己去试，最好用敏低防高的人，那样命中高，很快就有结果！\n\n给喜欢团P人的建议：\n1，医生没有必要追求防高的宠，因为4。0后坐骑加血量有了明显增加，很少有被打下马的情况，如果你是高敏医生完全可以骑只平民转宠。无敏医生最好还是骑转雷和转穿，因为你有可能一次就被拉下马噢，呵……\n2，高敏人最好转只虎，因为虎的敏比金飞要高，而放精的敏与坐骑敏有直接关系。\n本人两只转黄虎两只转金飞，现在想来金飞真的转的多余了……"
