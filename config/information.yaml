      content: "条件：\n1、完成金飞航空任务\n2、完成黑虎任务\n\n任务进程：\n\n1、在尼克斯水城（100，23）进入尼克斯王宫，来到（44，18）和女皇娜\n丽丝说话接下任务。\n2、接完任务后，再找王宫（24，6）的多莉说话,拿到一级的公主。\n3、走出王宫，通过传送师传到风城。\n4、走入风城，从（17，10）进入伊甸大陆东方。\n5、在伊甸大陆东方，来到（83，365）进入蒙达村地下通道。\n6、在蒙达村地下通道来到（55,14)进入蒙达村海底通道。\n7、在蒙达村海底通道来到（88，18）进入蒙达山。\n8、在蒙达山，来到（85，37）进入伊塔工作室。\n9、在伊塔工作室来到（23，24）和吉德说话，吉德叫你把公主练到50级再\n来找他。\n10、把公主练到50级了，再来伊塔工作室（23，24）和吉德说话，吉德会收\n了公主。\n11、回水城（100，23）进入尼克斯王宫，来到（44，18）再和女皇娜丽丝\n说话，她叫你找水精灵。\n12、走出皇宫，来到水城（78，19），进入水精灵神殿，走到（15，13）\n进入水精灵洞窑。\n13、在水精灵洞窑，来到（13，12）和水精灵说话，拿了水魔法戒指LV3\n-1（单体），完成任务。\n\n◇特别感谢作者：微笑赢家◇\n\nPS：此任务需要玩家耐心，水城公主粉垃圾，粉难练。"
