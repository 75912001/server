      content: "【感谢会员“永恒の暴龙”提供错误】\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n<前往英雄岛>\n任务条件：LV80以上，需要做完成人礼\n1.到萨村村口找日美子(56.124).说话她会要你送花到鱼村给弥生----此处任务\n见本站任务介绍之北岛\n2.前往鱼村找弥生(55.93)把花拿给他，他会送你不可思议的贝.\n3.再到萨村，前往村内(70.40)找黑乌力说话，然后可以进入拨拉岛-英雄岛\nPS.若鱼村出生，则可以直接找弥生取贝壳\n若其它村出生就需要去萨村找日美子接任务了\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n<找寻孙女>\n1.进入波拉岛之后，由(306.351)过桥前往(355.341)找老爷爷(11.18)说话\n2.再回到黑猪那里，找英雄萨母吉而说话--灰色人物拿斧子，他会告诉你去水\n灞\n3.然后前进到(259.381)过桥，准备前往水灞洞窟(599.461)\n4.到此截止一段落，精采的才刚刚开始，接下一篇顺便抓只红暴宝宝回来吧！\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n<红暴之谜>\n1.进入后请遵照下列坐标前往龙洞\n\n2.注意一下:当你进入水灞洞窟后，在里面会再次遇上英雄萨母吉而的！\n\n他会跟你要东西的(加气60的气瓶.或是补血罐200)给他后，他会送你勾玉(回避率+5或运气+5)\n\n\n继续前进\n\n南方水灞洞窟出口(01.56) 下水坝1楼(55.5)\n南方水灞洞窟1楼(29.53) 下2楼入口(53.42)\n南方水灞洞窟2楼(15.84) 下水灞洞窟底层(26.15)\n水灞洞窟底层(13.191) 进北方水灞洞窟2楼(11.7)\n北方水灞洞窟2楼(44.90) 上1楼(15.19)\n北方水灞洞窟1楼(13.55) 上波拉山谷(6.5)\n波拉山谷(18.61) 进波拉山顶通路(17.10)\n波拉山顶通路(51.53) 上波拉山顶(54.5)\n波拉山顶(22.40)与黑乌力说话(36.35)进龙王洞\n龙王洞(16.49) 打龙王守护(红暴120级)(52.17)\n原来龙王是120级的红暴哦！建议组队打，不然很惨的。\n\n其它的雷龙，蝙蝠就没那幺可怕了\n打过之后，你会看见一大排宠物迎接你的到来.你可以风光的向龙王要儿\n子啦：）\n拿到LV1红暴之后先别退出！再去跟他说话吧！他会送你龙王玉(一次可\n拿两个)龙王玉走路时用，可暂时驱散敌人(不遇敌)但时间非常短:<\n再来回去找爷爷.把英雄萨母吉而的勾玉交给他吧。回萨村跟老爷爷说话\n\n他会说拿那个勾玉给他孙女看就知道还有别的用途，拿给他孙女\n会得到英雄的祝福(可使基本点数加1)\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n<不可思议的贝壳>\n\n若活动在英雄岛把不可思议的贝壳弄丢了，还有另外一方法在英雄岛再\n取得。英雄岛(172.359)找肚子饿的村民.\n他请你帮忙拿红暴(巴朵兰恩)绿暴(奥卡洛斯)的肉各一块给他\n他就会送你不可思议的贝壳\n注意:肉的补血功能----红暴加140血.绿暴加165血他才要"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×2.0&2.5任务×", "『2.0任务』英雄岛任务-后传(四圣石)"]
      content: "解四圣石任务之前必需先解英雄岛任务-前传哦！~\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n<狱之圣石>\n1.到海底洞窟(147．304)或(207．310)接四圣石任务。\n2.接完任务去黑乌力东南方沿海一直走到(437.408)泰坦的队员说话。\n3.然后去(155.373)或(305.317)或(228.294)或(219.297)或(183.394)找\n萨姆吉尔2次说话， 会拿到2份公文<==建议使用用原地注销，到每星系\n单一地点找。\n4.然后回(437.408)找泰坦队员说话他会给你通行证，在过桥到(449.39\n1)进入泰坦的洞窟， 找泰坦(30.14)问话，之后去泰坦旁边问小队长(2\n8.9)他会给你\"鲁乌\"(人形宠)\"\n5.叫你帮他练到三十级并且拿到超特级采矿证明书，完成条件后他会\n给你地的宝玉和米兰达的通行证还有爱丽儿的通行证。\n注：持有地之宝玉，英雄岛全岛(包括水霸)都会出现120的绿暴！\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n<水之圣石>\n黑乌力往东南到(410.621)可以找到米兰达的军队，进入屋子(41.26)后\n到米兰达(3.6)说话，然后出去到(25.29)的屋子，进入后找小队长(6.9)\n拿人宠(迪欧)她要我们 练到三十级并且拿到伐木证明书，完成后他会\n给水之宝玉。\n注：持有水之宝玉在英雄岛告示牌(212.347)附近的海滩会出现120的蓝雷。\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n<火之圣石>\n1.去水霸打龙王的侍卫拿龙王的守护(跟解红暴任务相同，只需一颗)。\n2.之后到泰坦洞(449.391)，进入后到(29.32)找泰坦队员问话，他会问\n你是不是要把龙王守护埋了(按确定)埋完会给你钥匙。3.然后到沙姆搭\n往米兰达岛的飞机或到渔村搭飞机到沙姆再搭到米兰达岛的飞机，到\n了之后往西北走到(000.000)泰坦的洞)，进入后到(000.000)找考古家\n问话，他会给你火的宝玉)(埋几颗龙王守护就拿几个火的宝玉，任务\n只需一个)\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n<风之宝玉>\n1.黑乌力西南到饥饿村民(172.358)过桥(198.392)往东南走，到(225.4\n29)会看到爱丽儿的军队，跟守门员问话进去后到(20.33)进去跟爱丽儿\n(4.8)说话。2.她会叫你帮她练加美到三十三级并且要拿仙人的钓竿，\n再到(38.40)找小队长拿加美，完成后她会给你风之圣石和一级绿雷(送\n你的^^)。\n注：持有风之宝玉后英雄岛全岛会出现120的加美！\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n<精彩悲惨结局>\n集合4宝玉后，回海底洞窟，去跟萨姆吉尔(28.9)换一只[金虎]故事就完\nㄌ^^..人宠(鲁乌)换地之宝玉~ 特级加美换风之宝玉~人宠(迪欧)换水之\n宝玉~打倒龙王取得火之宝玉。 却…换到一只过年就会送的《烂金虎》~\n注：随着4宝玉的消失120的高宠也会消失@@"
