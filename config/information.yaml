      content: "我想这是大家最期待的项目之一了吧，这里是传说中失落的世界，位于泪之海的海底深处，当然在石器8.0就被原始人们发现了，可是，进去可是不太容易哦，以前上伊甸都要做PC团任务，当然这个就不可能再做PC团了，取而代之的却是一个更艰难的任务……任务名字就叫："
