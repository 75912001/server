      content: "条件：\n1、解完金飞任务\n2、解完黑虎任务\n3、身上带上不可思议的贝\n4、解完小猪任务\n5、解完王子任务\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n任务进程：\n\n一、在风城来到（86，137）和守卫说话，进入亚欧伊王宫，来到（7，3）\n和福列克斯（王子）说话，了解任务前因。\n\n二、走出风城，来到亚欧伊城区，走到（12，12）进入伊甸大陆南方。\n\n三、在伊甸大陆南方，走到（146，146）进入迷雾森林，来到（62，28）\n和风精灵弗斯温蒂说话接任务。\n\n三、在伊甸大陆南方，走到（146，146）进入迷雾森林，来到（62，28）\n和风精灵弗斯温蒂说话接任务。\n\n四、走出迷雾森森林，回到伊甸大陆南方，走到（333，183）进入伐木工\n头的房间，来到（10，9）和工头布鲁斯壮说话开战，打赢布鲁斯壮拿到\n《伐木命令书》（布鲁斯壮会帮同伙加血的，建议先杀他）。五、走出伐\n木工头的房间，回到伊甸大陆南方，走到（221，5）进入沙漠洞窑，经过\n两层洞窑，走到伊甸园区，一直往上走，进入伊甸园。\n\n六、在伊甸园，来到（19，160）进入林务局，和林务局长柯比罗尔说话开\n战，打赢后拿到《林务局长的悔过书》。\n\n七、走出伊甸园，来到伊甸园区，走到（195，369），进入沙漠洞窑，经\n过两层洞窑，走到伊甸大陆南方，再走到（146，146）进入迷雾森林，来\n到（62，28）和风精灵弗斯温蒂说话，交出《林务局长的悔过书》，拿到\n风魔法戒指LV3（拥有风魔法LV3-1的戒指，可打一排的魔法戒指）。\n\n\n◇特别感谢作者：微笑赢家◇\n"
