      content: "使宠物技能变成无技能的方法（MX专用）\n==================================================================\n1.道具栏有宠物罐头，一个复活药300\n2.仍掉一个复活药300\n2.双击宠物罐头→选宠物\n3.此时，用MX外挂寄出宠物罐头，\n  用MX『快速拣身边的宠物或物品』捡起复活药300\n4.点击宠物想消失的技能\n\n复活药300：是技能消失\n复活药100：是泥醉攻击\n气20 40 60 80 100 （包括阿布水）：待机\n全部耐久力恢复药：是待机\n在医院卖的各种异常状态恢复草药：是待机\n智慧果 1（2）：是待机\n料理部分：全部是待机\n各大村的羽毛：是待机\n==================================================================\n···7.0服务器尚未验证是否封除！"
