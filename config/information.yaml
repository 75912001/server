      content: "『个人单挂金猪经验总结 』作者：BOX_ZOD\n==================================================================\n人物基本装备状态：\n1 不带钱\n2 有火属性，办不到就改全水，有地属性的能算就算了\n3 建议不放战C，放个火C一直防也可以，最好是不要，省去加血回合，提高效率\n4 骑转C，只是为了杀得快一点\n5 如果火10的话 200以上防600以上血基本不会飞了\n6 火人攻加骑C攻加起来有450左右保证2下一只\n7 敏280以上确保跑过金暴\n萨首建议放右边，因为每转都一个，从一级带到140差不多刚好不堪使用，换下一个\n\n装备道具：\n武器 首先考虑的是损坏问题，因为人加了攻之后武器坏的太快了\n     推荐：战士枪/火城枪/叉/珊瑚武器\n铠甲 坏的比武器慢得多\n     推荐：战士铠/珊瑚铠/灵铠/地城铠\n兜 基本不大会坏，一个珊瑚兜从刚做好一直戴到5转140基本也就坏个1，2次\n     推荐：珊瑚兜\n左饰 用来平时加血，人物点数少的时候也可以带环9/心力环\n     推荐：滋3戒/治3戒/环\n右饰 因为右边的好象确实比左边的坏的快很多，萨首每转都有一个，从一级带到140差不多刚好不堪使用，换下一个\n     推荐：萨首\n最好根据自己情况带2-3个必要的道具 比如心环、修复武器/铠的材料、任务石\n\n\n基本设置：\n锁  猪|GP （人物攻低的时候只锁猪也可以）\n指  GP\n加血  根据人防决定，首先要知道金暴对ID的最大伤害大概多少，根据人防：骑C防的比例，算算最多一口咬自己多少，根据这个比例设置加血百分比就好了。保险一点设55-60应该没太大问题了吧\n战斗  中不加气 不延时 不复活\n平时\n加血  滋3 75%\n肉    95% 吃掉或丢弃所有肉\n补气  按照不考虑光明精灵的费气设置\n6-15  扔豆\n\n最低要求：\n基本上为火5以上属性 防250 敏280 血500 飞的次数相对很少了\n如果是穿戴珊瑚兜铠的话加240的能力 也就是人物点数达到360点就可以去挂了，根据自己的珊瑚装备决定点数分配\n也就是未转11X级、一转100级左右也就能去挂了\n不过在合格状态上楼的话，因为攻不够\n10只猪的回合打上20多秒也绝对正常，GP通常连打都打不死，自然也没豆吃\n速度其实和吃果挂雷也差不了多少\n\n合格状态：\n所以最好是达到合格状态再上楼\n260防 280敏 人攻加骑攻400 500以上血\n这样的话基本不会飞 杀猪也杀的比较快，豆充足\n速度快过挂雷不少，但是和理想状态比还是差太多\n\n理想状态：\n600-800血 防280 敏300 人攻220，这时完全不用考虑飞不飞的问题，带上战士套，滋3戒，萨首，珊瑚兜，攻击加反击各一次杀一只猪，普通速度服务器一场战斗3秒左右\n设置好自动加点，XP快速，从100级上楼到140级完全不用看一眼，最多级别够了之后换高级骑C。开始的时候会慢一点，走上正轨后普通速度服务器一小时1800-2000比较普遍吧，100-140的40级大概也就需要2天半-3天。省心，够快。当然，没水魔的话记得开个号寄气。"
