      content: "0转1级：萨伊娜斯（100 415 533）\n0转140级：吉鲁岛（300 196 222）\n1转140级：漆黑20层（32021 19 4）\n2转140级：英雄战场（8210 21 147）\n3转140级：泪之海海底沉船内（8007 5 8）\n4转140级：天空岛柯黑穆肯旁（30670 18 5）\n5转140级：伊甸园（7000 71 69）；地城（7109 9 7）；水城（7200 42 72）；\n火城（7300 21 34）；风城（7400 118 70）随机出现\n6转140级：雷尔的房间[无雷尔的那间 80成人金飞后才可进入]（8521 33 27）\n6转140级 领取到“乌力手环”，然后去跟萨伊娜斯小猪岛（100 593 362）上的\n“老乌力神”对话，继续后面领取卷轴的任务了。\n1.先到『没落的洞窟5楼』找『NPC加洛』说话，接任务，得到『乌力手环』\n2.到『小猪岛：北岛萨伊那斯霍特尔村附近，过桥就是(583，363)』找\n『NPC老乌力神』(642，397)说话，拿到『老乌力神委讬书』(卷轴)\n\n3.第一阶段卷轴：共有4种，随机拿到1种；这第一阶段卷轴可扔掉，重复拿取\n卷轴1『1，8级乌力各一只』\n卷轴2『2，7级乌力斯坦各一只』\n卷轴3『3，6级乌力各一只』\n卷轴4『4，5级乌力斯坦各一只』\n依据所得的卷轴指示，抓相应乌力或乌力斯坦，交给老乌力神\n\n4.第二阶段卷轴：共有5种，随机拿到1种；也可能得到第一阶段或第二阶段卷\n轴；第二阶段卷轴不能扔掉，不可重复拿取，如扔掉，需从第一阶段卷轴开始做\n\n卷轴5『19，21，30级乌力斯坦各一只』\n卷轴6『18，22，29级乌力各一只』\n卷轴7『17，23，28级乌力斯坦各一只』\n卷轴8『16，24，27级乌力各一只』\n卷轴9『15，25，26等乌力斯坦各一只』\n依据所得的卷轴指示，抓相应乌力或乌力斯坦，交给老乌力神\n\n5.第三阶段卷轴：共有5种，随机拿到1种；也可能得到第一阶段或第二阶段卷\n轴；第三阶段卷轴不能扔掉，不可重复拿取，如扔掉，需从第一阶段卷轴开始做\n卷轴10『31，35，36，40级乌力各一只』\n卷轴11『31，35，36，40级乌力斯坦各一只』\n卷轴12『32，35，36，39级乌力斯坦各一只』\n卷轴13『33，35，36，38级乌力各一只』\n卷轴14『34，35，36，37级乌力斯坦各一只』\n依据所得的卷轴指示，抓相应乌力或乌力斯坦，交给老乌力神\n\n6.与『NPC老乌力神』(642，397)说话，得到『乌力王』(地1水9)\n附：已知，卷轴10『31，35，36，40级乌力各一只』，可以拿到『乌力王』\n1-3级乌力和乌力斯坦：渔村村外附近\n3-5级乌力和乌力斯坦：渔村外柯奥山的小洞窟附近(328，633）\n15-20级乌力和乌力斯坦：小猪岛\n\n\nPS：8.9日例行维护已修正新人拿信物后不能做成人BUG\n"
