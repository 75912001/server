      content: "回旋标1-2,5骨加皮　　精灵回旋标1-4，7-8石加皮\n\n回旋标3-4，7-8石加皮　　精灵回旋标5-6，9-10木加皮　　　　回旋标6\n，9--10木加皮\n\n回旋标11-12=骨+皮，（现在可在火城庄园直接购买或是用火城的兜加气\n烧出）加精用精草X4就可以给回旋标11-12上精。（修复的话用骨1或皮1）\n\n回旋标13-14=石+皮，现在回旋标可以用火庄的投石加气“变”出，或是\n合铠，合精石的时候出的副产品，一般变了空回旋标的话可以继续用精\n草合成法来加精，无论是空或是带精的成份都是石+皮。现在大都用于给\n爪类上精，亦可作为是合铠的原料之一。（修复的话用石1或皮1）\n\n回旋标15=骨+皮，回旋标15现在与它的成份相同的就只有高级兜，一般\n可以用火城的兜14烧出！但由于兜的成份是降一级处理，所以是会比较\n难出，烧出后加个兜14可能会变兜16，上精用精标12会比较困难，因为\n相差比较大。"
