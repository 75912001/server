      content: "PK时间挺久了。。\n指挥时间也挺久了，不过写这类文章还是第一次。\n写的不好的地方，欢迎大家指出。\n\n先说一下人员配备吧。。\n个人认为，白虎队的人最好都是全水人。\n地或火带个太多，说的具体点就是超过3个，就会给指挥带来很大的麻烦。理由很简单，白虎是水宠，天生克火人，地转一下也变成火。所以，白虎的人最好都是水人。\n医生：个人推荐无敏医生 带铜兜3 加2绿宝石1珍珠 铜凯3加3绿宝石  140体力 440耐力\n（人物点数都按580点算）\n关于医生的点数分配方法说法很多，但我个人看来，还是喜欢无敏或者说是负敏医生。\n属性手： 280 速度 带铜兜3 2个绿宝石1珍珠 带风和镜 镜放道具左侧  备高等净化精灵  200 耐力  100体力\n转手： 个人喜欢在白虎队里安排3个转\n第一转手  100 体力 50耐力 430速度 带魔法兜3 1黄宝石1珍珠  合成乐器5 以及 心环  复活可以用药，一般带3个足够\n备复活光首饰在道具里。\n第二及第三转手  110体力 100耐力 370敏 道具同上\n先说说白虎打白虎吧\n一般全三回合对一场PK来说是至关重要的。\n在现在的PK中，精灵的作用越来越突出。\n一般第一回合都是由队里最高的敏的人放精灵。\n以起到牵制对方行动的作用。这里也一样。由敏最高的人放精灵牵制。一个转自己另一个也放精灵。到底放不放风就取决于对对方队伍的了解了。一般第一回合我不放风。让放风的人恩惠。 首攻目标我一般选择对面医生的宠，能打飞最好，打死也不错，由于有一个敏过450的人放精灵牵制，对方在一般情况下总有一定数量的人或宠中精灵。第一回合若能杀掉对方一只虎而自己无宠或人死的话，那已经胜利一大半了。\n第二回合 对方势必有一个转手要复活宠 你可以选择高敏放精灵 另两个人双转对方杀一个人 如果第一回合对方没放风的话\n这回合属性手放风。如果对方在第一回合已经放了。那就由属性手继续恩。\n写到这里已经近4点了，后面的日后补上，写的不好请见谅。\n由于现在手头没有图片可以参考，等以后有了也会一起补上来的。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 经验文章资料】", "【白虎打法】", "白虎VS白虎"]
      content: "猜测1，转自己不放风（这个转手一定要带B2），等对面放，敏最高的人精灵对面，推荐放睡，其他人也放精灵，这样的打法时要么同时吃到，要么对面吃不到属性\n失败点：怕对面双转你，这时自己吃不到属性\n猜测2：转自己，其它2个转对面，属性手放精灵\n失败点：精灵牵制太少，但因为对面要么也转我方2次才能属性相同，所以不怕属性吃亏，就怕老虎中精\n共同点：先杀对面医生的虎，白虎队时除了杀人外，避免用B2之类的攻击，推荐一击比杀，对面医生的虎第1回合结束时虎如果飞了，那么第2回合精灵狂放，属性控制好杀对面属性手（他死了我方属性控制70%了），一般来说想杀医生比较难，白虎队的医生通常0敏，防很高，所以打医生时要用B2，一击无用。\n打法弱点：如果对面喜欢用水打的话，第2回合开始可能比较措手\n开场3回合是关键，看怎么指挥了，我这里随便说一下自己的意见，大家参考下，不要丢石头\n\n反对此种说法者原因:\n第一，队员属性就让人觉得很别扭。全水属性我个人认为很不好。比如说你的医生是全水属性，还是负敏的，天啊……你有医生ＩＤ吗？负敏人很容易被打出星星不说，全水属性一但被对手知道了，放个克你的属性，用背３，我想你医生能吃的消３只机暴就很不错了……\n\n第二，只按排一个属性手，只带风，还是２８０的速度，也就是２６０的敏……你不觉得属性手的敏过高了吗？机暴队的属性手正常敏２４０，你刚放风很容易就被地属性盖掉！还有，只带一个风属性也是很大的弊端！如果上回合行成了机暴与白虎队都被转过的情况，我会让我方机暴队双转你们白虎再放地！这样，你们风属性的白虎被转两次属性为水，我们放地，飞了你的不说，你想下回合改属性都不容易！加上你不会全是白虎吧，白虎被飞光了只好上机暴吧，到时候你的队属性不齐，我看了下，你的转手没人备单转，到了中局你打算怎么打呢？\n\n第三，你的三个转手都不带镜子吗？试问一下，遇到ＮＯＮＯ队你打算如何处理？你想，ＰＫ的时候只有你白虎吃到属性吗？如果你想用三段破杀几只ＮＯＮＯ能杀几只呢？\n\n后面只写了与白虎队相杀的战法，我不敢多议。但如果你遇到机暴队，你是如何打法我道是很愿意听听噢……\n说了这么多都是大实话，别生气，都是中国网通一的，有机会在ＰＫ场上见吧，呵"
