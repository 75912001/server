      content: "流星手套详细完整打法（法师篇)  作者：BOX_简单纯粹\n==================================================================\n外挂上的资料，经过N个人N次证实是错误的，为了避免误人子弟，下面本人介绍一种比较简单、实用的打法.\n1.准备篇：\n人物：法师，练满嗜血成性、移形换影、冰镜、冰箭、火星球。加上冰附体、冰熟练度和火附体以及火熟练度，九级法师就可以拿下英雄战场。人物最好有防，约加100点左右即可（减小被飞几率，买改点酒改一下也是很简单的）。血1000以上（基本上法师都有这血）。敏300即可。\n装备：海盗王、回避十首饰（很容易合，到萨村外抓个凯比即可）、萨首饰、满石仓绿兜三（其他也可以）、白石盾（用凯比去合，用恢复一百的复活药比较好合）、其他的都是法师职业套装。选择上面那些装备的理由是最高的回避值（根据资料，萨首饰有加五运气和加五回避的功效）以及最合理最大众化。\n气带个四五个就可以了。\n宠物：转C一只~敏防类就可以，用什么看自己爱好和实际喽。\n战C：闪避C一只（不需要沉默），撕裂C一只（不是很有必要）\n宠物只是起辅助作用，基本上用处不大的。\n战场篇：\n一楼到一百楼，小兵全部用快速过。设置百分之八十补血，用海盗王爪。设置人物一般和首回合都用火星球。不放C的理由是节省加血回合以及加快速度。人物本身的回避已经够了，不需要再用技能。\n需要注意：\n1.落马逃跑必须点上，否则坐飞机别怪我。\n2.85楼以上有些NPC会有补血和复活技能，碰到他们就逃跑，别浪费时间。\n族长以及100楼以上小兵篇：\n1.人首回合移形，并让人物一直处于移形状态。口诀是移打打打打打移，有五回合的时间让你发挥。\n宠首回合闪避，并让宠一直处于闪避状态。口诀是闪打打闪打打闪，与人的动作相吻合，容易记忆.\n宠死了不需要复活，宠只起辅助作用，以及充当第一回合分散目标的炮灰。\n2.先用火星球打死宠，对方会补血也别管它，一直打就可以，对方补血回合并不多，而且也不是每回合都补满。宠死以后，看对方血的情况使用冰镜和冰箭，血少时候用冰箭，血多用冰镜。冰住了就撕，人物用冰镜。\n效果：火星球从1楼到132楼基本都是450+到550+损血，很稳定，命中也比较好。\n冰箭基本都是300血，效果比较差.\n冰镜打小兵从400血到800血，比较稳定，但综合效果差，不适合打小兵。\n20楼约600血，40楼约800血，80楼约1000血，100楼约1300血，132楼约1600血.命中比冰箭要好.\n3.注意补气必须提前二回合，嗜血有可能连续三回合失败.\n这不是危言耸听，我在132王那里就碰到过，吓得汗了一地.\n4.战场补气药在战斗中有补血1500功效，无补气效果.补血药战斗中可以使用.强烈建议留二三个补血药，在132楼强力魔法攻击下，补血药几乎是必须的救命药.\n5.20楼最简单，怎么打都可以，基本十回合可以搞定.除非非常倒霉，否则飞不了.40楼证实会打坏装备的技能，且攻击力比较强，但如果人物符合上面的要求，飞还是比较困难的.\n装备坏了就逃跑，用手套修理，手套几乎是万能的维修原料.\n补充：\n七十楼以上有些NPC会强力魔法，应该是五级的，练魔法抗性非常快，从99到100也只需一次.没有魔法抗性的朋友可以挑几个去练.（我的抗性曾经四种都是一百，有图，可惜没办法发）\n132楼的王证实不会补血，基本都是用强力魔法攻击，N简单的说.\n80楼为攻人，且敏高，这里就看回避和运气了，首回合过去了就行了.\n基本上20楼是最简单的，80楼是最难的，其他的一般一般.\n镜子没有用，族长用的间接攻击武器，用镜子等与找飞.小兵和小兵的C很多都会十段攻击，因此也没什么用.\n\n就说这么多，权当抛砖引玉.\n朋友们有更好的经验就说出来，目的都是为了石器时代."
