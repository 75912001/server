      content: "必须条件：无限制\n1.百人有分南岛跟北岛，北岛在萨姆吉尔村内，南岛在加加村内\n2.到村庄中找到道场并进去打完100人即可进去\n3.北岛可学到三段攻击，南岛可学到双重攻击\n4.也有一些道具..如彩虹精、火炎精等等ㄉ\n5.萨村跟加加村，先顺移到第十人(400，17)\n  在顺移到第一百人坐标(4，17)[两村都可以喔]\n6.买卖ㄉ物品表\n\nＡ.萨村的道场\n道场的商人（主要是卖道具）\n四种属性的竖琴(风水地火)\n柯雅拉LV3护身符（复活精灵LV3）\n美丽尼亚护身符３（光之精灵）\n美丽尼亚护身符４（光之精灵）\n 道场技屋\n三段攻击（三回合连续攻击）\n\nＢ.加加的道场\n道场的商人（主要是卖防具）\n各种LV8的服、兜与铠\n道场技屋\n双重突击（两回合储存力量）"
