      content: "EOT E 路 线\n\n完成成人礼与金飞任务接此任务\n\n　   地点座标                详细座标                 注          答案\n起点 伊甸园                  园区内(113.76)           拿取证明石\n01   伊甸园                  园区内(124.162) 　                   朵拉比斯\n02   伊甸大陆西方(392.225)进 西方沙漠洞穴内通道(43.42)          　英嘉\n03   伊甸大陆西方            (244.23) 　                          上等白萝卜\n04   塔耳塔城区(142.180)进   塔耳塔地城东北区(22.11) 　           邬莉叶\n05   伊甸大陆北方            (224.248) 　                         火山拉斯基的肉\n06   弗烈顿火城              (48.111) 　                          扑满乌力\n07   火山道场                (78.65) 　                           2800\n08   伊甸大陆东方(281.338)进 蒙达村内(36.34) 　                   查拉\n09   伊甸大陆东方(82.365)进  蒙达村地下通路(51.35)  　            恩惠的精灵LV5\n10   亚伊欧风城内            (29.124) 　                          高梁酒\n11   伊甸大陆东方            (89.30) 　                           火8风2\n12   尼克斯城区              (189.42) 　                          智慧之果\n　   尼克斯水城              村内(61.96)               终点换奖处\n\n所得的宠物与道具.每次都不同\n\n编号 宠物名称  道具名称          道具精灵\n112  毛宝      雷尔服            增加魔法抗性的衣服 防+27\n141  迪加      迷人香菇          使用後你也会变的更迷人\n157  欧瑟菲    俄式宠物食物2     忠诚度前後加5 满是营养的宠物食物\n183  布兰恩    尼克斯戒指3 魅+9  会心一击率上升+6\n223  巴克亚司  泰尔克斯弓箭3     攻+22 防-21 (1-6) [地]\n　 　          阿葵丽雅兜2       防+22 敏-5 [水]\n　 　          弗烈顿的手环3     攻+12 防+12 敏-12 魅+6\n　 　          塔耳塔的铠3       塔耳塔特制的铠 防+44 敏-11\n　 　          塔耳塔的服4       防+30\n　 　          弗烈顿的兜4       防+24 敏-5\n\n\n\nEOT F 路 线\n\n解过火灵祭品换接F路线\n\n　   地点座标                  详细座标                注         答案\n起点 伊甸园                    园区内(113.76)          拿取证明石\n01   伊甸园区                  园区内(142.59) 　                  雷尔胖\n02   伊甸大陆东方(11.208)进    东方沙漠洞穴外通道(25.5) 　        肉食性饲料二号\n03   亚伊欧城区(308.274)进     亚伊欧庄园内(67.75) 　             800\n04   亚伊欧城区                (367.127) 　                       沙拉曼达\n05   蒙达山                    (17.24) 　                         红色\n06   伊甸大陆东方(175.279)进   弗烈顿庄园内(26.63) 　             拉奇鲁哥\n07   弗烈顿城区                (226.77) 　                        一个小时\n08   火山洞窟第二层            (25.41) 　                         塔斯夫\n09   塔耳塔城区(183.136)       塔耳塔庄园内(43.51) 　             莫拉司的肉\n10   伊甸地下通道第一层(6.3)进 贫民窟(20.28) 　                   凯菈村\n11   伊甸大陆西方              (306.214) 　                       瑞德宝\n12   尼克斯城区(129.53)进      尼克斯庄园内(31.13) 　             亚伊欧庄园\n　   尼克斯水城 (83.58)                                终点换奖处\n\n所得的宠物与道具.每次都不同\n\n编号  宠物名称  道具名称        道具精灵\n15    布依布依  俄式宠物食物2   忠诚度前後加5 满是营养的宠物食物\n85    克拉尔    尼克斯首饰      魅+7 毒.酒醉耐性+60\n133   麦丁布斯  迷人香菇        使用後你也会变的更迷人\n190   摩里      阿葵丽雅兜3     防+24 敏-5 [水]\n199   阿米朵    塔耳塔的棍棒3   攻+44\n　 　           尼克斯的爪3     攻+33 (X4) [水]\n　 　           弗斯温蒂服3     防+30 [风]\n　 　           沙拉曼达兜3     防+24 敏-5 [火]\n　 　           亚伊欧A4首饰2   魅+5  石化耐性+75\n　 　           雷尔铠1         增加魔法抗性的铠甲 防+44 敏-11"
