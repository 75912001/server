      content: "◎寻找安眠药任务◎\n\n任务条件：无\n\n任务限制：无限解\n\n任务流程：\n\n·在加加村的112.67有一个叫哈尔利的人，他希望你帮他找一下萨姆吉尔的医生\n\n·于是到萨姆吉尔村的医院里找萨姆吉尔的医生，他会给你一个药材，于是前往哈罗山(452.163)\n\n·到山顶，和哈罗山的医生讲话，会得到药\n\n·回加加村找哈尔利，得到安眠药(催眠10回合前后)，任务结束"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.5任务×", "[7.5任务]打不开的钱箱任务"]
      content: "◎打不开的钱箱◎\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n任务限制：人物等级100以上,身上有20W石币以上\n1.首先到【乌鲁力村】找一名叫【皮洛】的小朋友\n  他会说“我粗心大意将最珍贵的的钥匙断掉了，因为他的钥匙非常特别，一\n  般人都造，你能帮我打造一样的钥匙吗？”\n2.你便要寻找钥匙的原料了\n  找雷龙的尾巴,【英雄岛的Lv90啡雷可打掉】\n  魔族的骨头【去伊甸大陆的Lv130~140魔族区可打掉】\n  蝙蝠的翅膀【去打加美20~30才打掉】\n3.打完这三件原料便找【皮洛】\n  他会说：是这些材料了，但是我不懂弄，但我知道有一个山里有一个能帮\n“巴尔”弄一把新的斧头的高人，你可不可？请他帮我弄一支钥匙”\n  他会给你一封【皮洛的信】（请求弄钥匙的信）\n4.你便到【阿鲁姆山的洞窟】找【哈恩】，他会说：这.....把钥匙很难弄喔，如\n  有20W石头便可”\n  交出20W石币\n  (呯~~呯呯) 他说：弄好了！\n  拿到【奇怪的钥匙】（能打开特定宝箱的钥匙）\n5.你便去找【皮洛】他会说：谢谢你喔，我给你宝箱内的宝物吧.\n得到“回魂之玉”（从气绝回复成600的耐久力，使用1次后消失）\n\n『原7.0未开放完全』\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
