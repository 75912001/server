      content: "◎任务条件：完成思念故乡的贝克任务（当然完成此任务也要完成其他很多的任务了！）\n◎任务奖品：罗多克雷的骑宠证\n◎任务流程：\nstep1：瑞尔亚斯之都的（21，38）进入民房，跟好心的大妈接任务，得知某女孩已冻僵，需要“鸠桃花”。我们需要去到无息之境的西方，找艾弥婆婆（无息之境在冰封通道的(26.41)）\n\nstep2：走到（37.97），进入民房与艾弥婆婆对话，他误把我认成为强盗，放“黄金凯比特”来战斗，打败后说明是来找“鸠桃花”的，于是艾弥婆婆说出取得种子的方法：用得到的“冰晶”在冰封回廊口吸引恐龙。并且得到“洁素冰晶”。\n\nstep3：来到无息之境的（163.149）附近遇敌，可以遇到160级的蓝色小鸟德古德贝特（每次1-6只不等混杂其他普通鸟，它会“攻击”，“狂乱暴走”，“狂暴攻击”，“卸下装备”，“复活”，“调和”，所有物理攻击技能均有可能附带剧毒效果，HP6500左右，实在BT），直到打出“迷之谷物”后回到走到无息之境（37.97），进入民房，与艾弥婆婆对话，得知我们找到的“迷之谷物”就是“鸠桃花”的的种子，于是交出“洁素冰晶”和“迷之谷物”，拿到“培植花盆”。（绝对绝对不能登出，一旦登出了就要扔掉花盆，重新拿冰晶打鸟了）\n\nstep4：过了许久，屏幕会出现“培植花盆产生了变化”（【培育中】-【萌芽】－【长叶】－【孕蕾】－【开花】－【枯萎】大概这要2小时，一定要在【开花】阶段交任务，否则后果自负！）\n\nstep5：然后去瑞而亚斯之都的（21，38）进入民房，跟好心的大妈说话,交出培植花盆，出去再进来(地图已改变)，对话拿到拿到人宠塔蜜提雅与项链。\n\n◎喂养塔蜜提雅注意事项：每升到双数等级时就要与其对话，否则经验不会再长，若项链遗失，放她出来与其对话便能取得。\n附：塔蜜提雅升级完全攻略：\n升级到2级，问题：回答出她的名字。答案：塔蜜提雅\n升级到4级，问题：你是不是也一样喜欢答题呢？答案：喜欢\n升级到6级，问题：“一只大黑狗”，猜一个字。答案：默\n升级到10级，因为塔蜜提雅要向救她的人道谢，所以请回到接任务的屋子里与其对话\n升级到14级，问题：你是不是一个会抛弃宠物的人。答案：不是\n升级到18级，问题：阳光、水空气哪个重要？答案：都重要\n升级到20级，去聊天室的婚礼场地\n升级到24级，料理好下面的东西后，放她出来与其对话，她会收走5个料理\n             草莓酱汁牛排＝大的肉+炭3+草莓3\n             小面包＝橡树果2+炭2+蛋2\n             烤松露＝串3+香菇3+胡椒3+炭3\n             高级香草茶＝香草3+水3+炭3\n             健康温青菜＝水4+红萝卜4+香菇4+白菜4+茄子4（伊甸园旅馆可以买到）\n升级到28级，问题：人体中含量最多的成分是什么？答案：水\n升级到32级，问题：嘴巴里面还要一张嘴巴是什么字？答案：回\n升级到34级，问题：没爱心，猜一字。答案：受\n升级到36级，带她去泪之海\n升级到40级，问题：哪种神圣之水可以治愈疲倦的心灵？答案：阿布的水\n升级到42级，身上带有阿布的水，与其对话\n升级到48级，问题：我的左手有八个硬币，右手没有硬币，把左手八个硬币中的三个拿到右手，我还剩下几个硬币答案：八个\n升级到50级，问题：“波拉岛”的中间有什么？答案：拉\n升级到64级，问题：答应我，我们永远都不要分开好不好？答案：好\n升级到66级，带她到卡坦迷幻洞穴最底层\n升级到70级，带她到无息之境\n升级到74级，问题：勇者，“乾兑离震巽坎艮坤”的八象组合，分别又以“天泽火雷风水山地”八种自然界元素做为表征。其中乾为天，而我使用“地水火风”作为密语的封印，你能够导出正确的地水火风组合吗？答案：坤为地坎为水离为火巽为风\n升级到79级，带她到漆黑20层，精灵王面前\n◎注意事项：没有标出的双数等级分别可以再任意地方对话就可以继续练了，有标出的就必须带到指定地点对话才能继续完成任务，回答问题的时候可以拿到问题卷，必须注意身上有一个道具空位多出来，回答问题可以在任意地方回答。塔蜜提雅可以用来转一只没转宠到一转。\n\nstep6：来到流冰回廊（无息之境的(63.149)），之后说出密语：坤为地坎为水离为火巽（这个字读拼音读xun，此处笔者加的）便可进入。可在1层打普多那托，可以打出木板，过河时把木板丢到水面上就能踩着过去了，留意木版的边缘。大家可以用穿墙功能穿池边的那1格，这样就可以省一点木版了。（一般需要大量木板，没有足够把握不要扔木板到河里，万一不够，过一会就会被系统刷走的了，损失的还是自己哦,还有木板这个东西好象拼图一样的，扔之前记得留意木板的边缘哦！）\n◎最简便的过河方法：无息之境（163.149）→流冰回廊上层（29.23）→流冰回廊上层（39.15）→流冰回廊上层（39.30）→流冰回廊上层（33.6）\n\nstep7：下去流冰回廊底层，打冰龙艾斯卓恩（最后一战，努力吧，虽然冰龙有250级……），打败即可拿到罗多克雷的骑宠证。\n\nstep8：任务完成（辛苦死了~）"
