      content: "微笑\n==================================================================\n说来话长。\n\n可以说，台湾华义在7.0中每周都在改版，修BUG，修正游戏中的平衡（也就是白狼与法师之间的平衡）！\n------------------------------------------------------------------\n白狼前期后期分析：\n白狼以攻见长，因练两刀流手部可装备两件海底装备（如棍，斧），所以白狼的点数是三种职业中最高的（注意装了弓后手部只能多装一个盾）。所以攻上1000的白狼是正常的。。也是白狼一击必杀的原因。\n\n后期的白狼没任何改动。\n------------------------------------------------------------------\n法师前期后期分析：\n前期法师的技能可以说是无敌。\n1、冰箭可冰人三回合不动。\n2、雷附体放自已人，自已人放箭，对方几乎是全部中雷附体不能动。\n3、冰镜打BOSS级人，一下1300血是正常，BOSS防太高。\n4、嗜血，一下可加气300以上。\n5、一旦移形使用，除了合击，物理攻击几乎想摸也摸不到，除了法技或摩法可中。\n6、火星球5敏人一起放，几乎对方全部人物OVER。\n\n后期法师，华义一直改，直到上周也在改。所以不知大陆版石器是第几版SA.EXE\n\n后期法师特点：\n1、冰箭改为让对方降敏，不能冰着不动\n2、雷附体放自已人，自已人放箭，只能让一人中雷附体。\n3、冰镜打BOSS级人，一下1100血左右。\n4、嗜血，一下可加血300以上。\n5、移形使用，第一回合，物理攻击可打中。\n6、火星球威力下降30%左右。\n\n以上是前期后期法师的区别。。\n\n也就是每周修BUG的中修改的。\n------------------------------------------------------------------\n前期团P，法师喜欢用雷附体，让对方全体不能动，火星球，NONO清场。\n前期单P，冰师喜欢用冰箭，让对方不能动三回合，冰镜，NONO清场.\n\n后期团P，白狼异军突起。。接近平衡。。。\n\n一般队里，白狼法师一起粉多。。\n但全敏法帅喜欢用5沉宠全沉对方，然后火星球狂炸对方。\n后期单P，法师有点怕白狼，关键是白狼与低敏宠合击法师。\n说完，希望大家明白!\n------------------------------------------------------------------\n追猎真的粉少人练。。。没特点。。我也不知如何说好。\n追猎接近均人这类型。。\n------------------------------------------------------------------\n最后说明，法师因有吸血加气，练级，团P基本不用带气，至少我打过132层英雄都不用一个气，练技省钱。\n\n白狼，追猎练技一般在阿布，是超费钱的。。大家要有心里准备。。赚多点钱才练。。\n\n注，因在台湾没外挂，技能上91%的人真的粉难，按到手痛。。不过后来出了按键精灵帮练，但一台电脑只能练一个号，所以大家练起来粉难，但强弱对比就要看谁努力。。。\n\n但在大陆石器，因有练技外挂。。。\n\n所以这方面反减少一点兴趣，与努力。。\n\n目前为止华义只开放二阶技能。\n\n据我与台湾华义官方朋友了解，酷哥认为技能太强会影响宠物魅力。。\n\n石器下一个版本是加强宠物的能力，人物的技能增加还没计划。。\n\n所以三段技能还是未知数，至少7。0不会开。。8。0不知。。\n\n关于技能点数。\n\n技能是熟练度70%就加一点，可选择学下一技能。\n100+40两点 70+70 也是两点\n熟练低于70%不能学下一技能。\n\n法师一般先练嗜血，省气省钱。。\n------------------------------------------------------------------"
