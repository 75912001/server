      content: "鱼王任务\n\n任务条件：无\n建议等级：120级以上\n\n首先去到泪之海海底，有一条橙鱼在的地方，跟它说话，它告诉你有个漩涡让海底的许多鱼群都无法通过去觅食，请你帮忙救救这些鱼群，它会给你“鱼王的鳞片”。\n然后去与lv140宫本蚊帐和lv120佑佑木战斗，战斗后在中央细长的通道中行走会遇上Lv100的“漩涡”，打完漩涡之后去中央有座塔的地方，和塔说话会传送至“海中央的洞”，一直上到6F。\n那里会有一只塔克(lv130)，和它说话后便会进入战斗，战斗完后拿“塔克的爪”。在背后有一个洞，走进去会看到有一只水人鱼，和它说话后交出“塔克的爪”换到“海的守护”。\n再走回橙鱼那里交出“海的守护”，得到“碧绿的海藻”(使用后水中呼吸4小时)"
