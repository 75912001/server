      content: "法师（其他战斗中 使用）\n火焰熟练度：只要使用有关之魔法, 便能提升熟练度.\n冰气熟练度：只要使用有关之魔法, 便能提升熟练度.\n雷电熟练度：只要使用有关之魔法, 便能提升熟练度.\n\n追猎者（其他战斗中 使用）\n追寻敌踪  非战斗中 使用\n回避战斗  非战斗中 使用\n精通投斧：右手拿投斧类武器攻击敌人爆出星星就算有效]\n精通投石：右手拿投石类武器攻击敌人爆出星星就算有效]\n精通标类：[右手拿标类武器攻击敌人爆出星星就算有效]\n精通弓箭：[右手拿弓箭类武器攻击敌人爆出星星就算有效]\n\n白狼\n1.战斗中使用技能\n舍己为友\n专注战斗\n能量聚集\n激化攻击\n盾击：[有几率打晕对方,2回合昏迷状态]战斗中 使用\n连环攻击：[有几率攻击2次,拿双尖枪还是攻击1-2次]战斗中 使用\n暴击：[可以打使用地球一周技能的宠物]战斗中 使用\n双重攻击：[攻击力加50%攻击]战斗中 使用\n濒死攻击：[扣掉自己95%的血提高命中再去攻击敌人]战斗中 使用\n\n2.无需发动，战斗中使用技能，自然增加熟练度\n回避：[闪得过就算有效]不需要发动技能，战斗中自然增加熟练度\n二刀流：[拿2把武器打到敌人就算有效,不用爆星]双手都装备武器攻击敌人，自然增加熟练度\n状态回复：[中了昏睡和石化后能自动补血就算有效]战斗中 使用\n枪熟练度：[右手拿枪类武器攻击敌人爆出星星就算有效]\n棍熟练度：[右手拿棍棒类武器攻击敌人爆出星星就算有效]\n斧熟练度：[右手拿斧头类武器攻击敌人爆出星星就算有效]"
