      content: "作者：小捣蛋~ （HTTP://WWW.BOXBBS.COM/131/130095.SHTML）\n “双转秘密”完全公开---小捣蛋版\n以下实验为本人“小捣蛋”经SACHXP外挂配合取得，献给没有条件3开或4开，从而自己去发现的玩家。 再次倡导BOX乃至本区“交流”的主旨，而不是保守。 多的话就不说了，同时谢绝那些保守者的”马后炮“。\n\n大家看仔细了：\n\n\n同一个回合内：\n头上带反转标记时，下一次反转对属性无转变，只是取掉头上的标记；\n头上不带反转标记时，下一次反转一定对属性有改变，同时带上头上的标记。\n\n举例 说明 我方红人龙\n第一回合\n           反转标记      实际属性\n初始         无           火10\n1次反转      有           地10\n2次反转      无           地10\n3次反转      有           火10 （注意！头上有反转，却是火10了！）\n4次反转      无           火10  （还原了）\n以上属性特点，一直保持到本回合结束。第二回合开始时，头上有反转标记就是地10，无反转标记就是火10，正常了。\n再举例，大家就更清楚了，比如第二回合开始，我方红人龙，头上有反转标记，是地10，那么\n            反转标记       实际属性\n初始          有           地10\n1次反转       无           地10\n2次反转       有           火10 （注意!又是头带反转，却是火10）\n3次反转       无           火10\n4次反转       有           地10  （还原为第二回合初始）\n\n以上反转过程中，如果有对方宠物插进来攻击，则根据之前反转次数来判断属性。所以高敏反转容易控制属性优势。\n\n如此看来，红人龙对白虎，在敌方双转放风战术下，并非属性永远被控制为“地10”，而处于劣势！\n\n例如我方红人龙对敌方白虎，敌方高敏双转放风战术，我方只要转自己2次，那么我方就是火10对敌人风10！属性占优！再配合放属性加强，就可以取胜。这样一来，白虎队不能肆无忌惮的“双转放风”，白虎队必须就“转不转对面”而做出选择，转对面的话，红龙队可以自己转自己2次，不转的话，红龙队也可以不转自己，直接放火进攻。攻击很高的红龙即将再次流行！"
