      content: "※  融  合  宠  前  的  准  备  ※\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n准备参与融合的宠物\n注意：T一击必杀改、T背水之战之3、暗月变身、大地铠甲、水灵滋\n润、火焰威能、风之吹息不能遗传。\n【无魔的\"魔之诅咒\"是不可以遗传的.松鼠的\"栗子连激\"也不能遗传】\n\n\n不是所有的宠物都可以拿来进行融合，特别是任务中可以抓到或拥有\n的宠物，以下宠物不可以拿来融合：古瓜、雷尔胖、大地守护兽、水\n的守护兽、火的守护兽、风的守护兽、卡特利奴、动物园养的拉斯基\n、动物园养的波波顿、艾蜜、雷诛、讦谯龙、格林巴肯、雷恩巴肯、\n法亚巴肯、奇欧巴肯、莱比、鲁乌、迪欧、爱丽儿队的加美、玛蕾菲\n雅等\n【无魔不能融合】\n\n\n尽管融合规则无等级限制，但实践表明，等级越高的宠融合出来的宠\n能力越强，最强烈建议用80等级以上的宠物参与融合，最好当然是12\n0以上；\n准备好一些强宠，注意一些内定成长高的宠融合出来的效果特别好，\n如火牛，黑暴，白虎，机虎，年兽，蜥蜴，金暴都是内定成长高的宠\n，而黑人，蓝人，红暴等就略低一些，感觉内定成长象一个参数，而\n每一种宠的内定成长也有差别，如同样成长率的火牛和魔兽，融合出\n来的宠，用火牛的融合宠会强一点（如用不对请指正）；\n转生宠参与融合时融合出来的宠的能力相对比较强；\n融合后之成品宠强度决定因素之一为融合宠之能力(包含三围及成长率\n)。\n\n\n准备好喂蛋的营养剂\n营养剂主要是针对四种能力（体攻防敏），共有四个种类的药可以增加\n成长率，每一种营养剂又分为五级，等级越高的药，加的数值就越多。\n饲养营养剂的来源，主要是打怪身上取得材料，材料掉落地在下面的附\n表二；\n\n营养剂——药剂的制作\n材料需要两种才能交给npc制药，一个来自打怪物掉落，一个来自加加村\n任务所得到的龙骨粉末，龙骨粉末是每种营养剂所必备的，找药剂师结\n合二种药材成为药剂，请看附表一。\n加血药粉提炼师在玛丽娜斯渔村内(66.34)\n加防药丸提炼师在塔耳塔地城东南区(12.12)\n加攻药汤提炼师在伊甸园区内(98.103)\n加敏药丹提炼师在卡鲁它那村内(71.105)\n\n药剂就象催化剂一样所用等级越高，对融合宠的成长越好。\n建议均衡喂养蛋蛋，因每种药剂所加能力是有限的，均衡喂养能使四种能\n力都有长足的增加。"
