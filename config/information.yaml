      content: "蜜蜂一族属于团队协作共同生活的一个整体。近日来有不少异族掌握了它们的特殊技能\"群峰乱舞\"，造成了不少族蜂死在了自己的技能之下，为此它们在努力创造一种新的技能，在原有的技能之上进行加强，让异族们无法去偷学它们的技能，避免再有同族惨死在自己的技能手下。现在它们已经有所成就，但缺乏实战经验及技能的熟悉训练，你愿意但当它们的训练指导吗？\n\n准备就绪\n任务非常简单,虽然此任务要打NPC多次,但是不会为气瓶或者嗜血而愁了\n因为在打NPC(蜜蜂)的同时,会获得2-3瓶的阿布水,并且任务里还可以买气\n那么我们就开始正式解吧!\n\n\n第一步:接任务\n在加鲁卡(271，349)跟蜜蜂族长对话后,得知了蜜蜂一族的近况,于是你决定去帮助它们去进行技能的训练工作,蜂族族长将你带到了它们的秘密训练基地----\"蜂X\"\n\n第二步:挑战NPC获得普通蜂蜜\n在这里你跟\"引路蜂\"对话,得知需要先到中间道路尽头去领取\"蜂蜜”才能前进.这里的地形是一个三叉地带,你进来的时候是从左下角的位置过来的,到中间枢纽位置前必须打过一个战斗蜂,打败后得到\"普通蜂蜜\",有了\"普通蜂蜜\"才可以与中间通道的战斗蜂进行训练.\n\n第三步;挑战NPC获得特制蜂蜜\n 中间通道与上面通道的战斗蜂打过之后都是会进行随机传送的,你通过了中间通道的考验,来到了中间通道尽头,见到了\"蜂族技能训练师\",得知需要跟最上层的战斗蜂训练,必须带着它给你的\"特制蜂蜜\"才可以,拿到特制蜂蜜后会传你回中枢地带.\n\n第四步:挑战最终NPC完成任务\n与最上面的通道NPC挑战(最上层跟中间层的难度相同)有了上一层的经验,在上层通道的尽头终于遇到了\"新蜂族特级导师\",他为了感谢你帮助他们训练蜂族的战士,将一罐\"精致蜂蜜\"交给了你,并答应如果你有蜂族的朋友的话,会教会你的蜜蜂朋友它们新训练出来的技能.并将你传会蜂族族长身边.\n\n第五步:给蜜蜂学-群蜂乱舞改\n回到族长身边后,在它的旁边有一位\"蜂族技能训练师\",与他说话,此时你的身上必须带有\"精致蜂蜜\"才可以学技能,便可学得技能----群蜂乱舞改（可不要忘记带你的宝宝蜜蜂哦！）"
