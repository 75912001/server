      content: "[7.5任务]精灵的召唤任务\n4\n精灵召唤:\n使者与勇者一起解的任务 当玩家游戏时随机发生精灵召唤\n当call闪亮时按下精灵的召唤 拿到使者的信物和勇者的信物\n使者带上信物后不会遇敌 双击勇者信物传送至勇者身边\n把信物交给勇者 当解完时使者跟勇者都可以跟萨村宠店门口的npc拿礼物\nps一定要当过勇者才算解过精灵的召唤\n任务条件:不可思议的贝壳.勇者信物\n\n四大龙蜥洞窟任务：\n条件：身上带着不可思议的贝壳和勇者信物。\n\n地龙蜥洞窟：先走去地城战士团找古瓜（别告诉我不知道是谁），和他对话，他会说最近的粮食都被一些生物吃掉了，后再走去战士团右边那个人，对话，他会告诉你生物所在的地方，再回去找古瓜，他会叫你料理五样料理：\n豪华游乐套餐（伊甸旅馆就有卖）\n大饭团（米2+盐2+水2+海藻2）\n草莓大福（米2+豆2+糖2+草莓1）\n特制莎拉（芦笋3+包心菜3+盐3+油3+胡椒3）\n镜年糕（米4+炭4+橘子4+海藻4）\n把这五个料理交到古瓜手上，再去和战士团右边那个人说话，就可以去地龙蜥洞窟了。洞就在地城区（272，178），进去地龙蜥洞窟后，遇敌打地龙蜥，打到5颗牙后，再和古斯特对话，就能进去打地龙蜥头目了，打败后能拿到头目的牙去找战士团右边的人，把牙交给他，他就會叫你去找流浪旅人（萨姆吉尔村73，72）拿奖品。\n\n水龙蜥洞窟：任务首先先去抓三个宠物（等级不限）：\n姆伊（打40级海主人处）\n克邦凯斯（福村海底洞窟进去打珍珠处）\n萨美洛斯（英雄岛120水雷海边）\n然后去水城找邬莉叶（接水怪任务的那个人，在水城皇宫门口），她说最近水怪又來捣乱了，叫勇者帮帮她，再和她前面的守门员说话，传送进去水怪洞，走到地下8层，遇到大水怪，和他对话后得知他们最近被一种可怕的魔物骚扰，他说他的儿子很饿，请勇者帮他找一些食物给他儿子。上面抓的三个宠就有用途了（好残忍啊），把三个宠给他后，他会给你3个氧气草（挂过海底的人都知道是什么了，海底中呼吸3小时），然后到水城区（213，26），进去水龙蜥洞窟后，遇敌打水龙蜥，打到5颗牙后，再和古斯特对话，就能进去打水龙蜥头目了，打败后能拿到头目的牙去找邬莉叶，把牙交给他，他就會叫你去找流浪旅人（萨姆吉尔村73，72）拿奖品。\n\n火龙蜥洞窟：先去火城找国王，之后去火山道场找拉法特（就是接火神祭的那个人），对话后拿到“火灵勇者的证明书”，就回去找国王，他會叫你打伊甸北方打败怪物，洞就在伊甸大陆北方：（308，281），进去火龙蜥洞窟后，遇敌打火龙蜥，打到5颗牙后，再和古斯特对话，就能进去打火龙蜥头目了，打败后能拿到头目的牙去找火城国王，把牙交给他，他就會叫你去找流浪旅人（萨姆吉尔村73，72）拿奖品。\n\n风龙蜥洞窟：先前往风城找风城王子，说话之后他叫你去伊甸找林务局长，跟局局长说话后拿到木头，回到风城，王子会叫你去风龙蜥洞窟，到风龙蜥洞窟之前在洞口下方附近会找到一个伐木工人（202.140），讲完话后，拿到火把（有效时间为1小时，熄灭了可以去拿过），在伊甸大陆南方（238，96），进去风龙蜥洞窟后，遇敌打风龙蜥，打到5颗牙后，再和古斯特对话，就能进去打风龙蜥头目了，打败后能拿到头目的牙去找风城王子，把牙交给他，他就會叫你去找流浪旅人（萨姆吉尔村73，72）拿奖品。\n\n奖品：“勇者”拿的是6级精灵装备，“使者”拿的是兽环、月神 LV3 太阳 LV3 变身镜 LV3 手下留情罐头。\n都是随机得到一个！\n\n\n精灵的召唤　新装备\n柳牙系列:\n柳牙之兜：防＋４２　敏－４　电抗性精灵１\n柳牙之服：防＋５１　体力＋３０　电抗性＋１０　治愈的精灵６\n柳牙之枪：攻＋８５　敏－１８　毒雾的精灵６\n柳牙弓箭：攻＋３８（６～８）　防－１０　毒雾的精灵６\n柳牙棍棒：攻＋７４？　毒雾的精灵６\n\n雪泪系列:\n雪泪之兜：防＋３７　敏－４　冰抗性精灵１\n雪泪之服：防＋４６　体力＋５０　冰抗性＋１０　恩惠的精灵６\n雪泪之枪：攻＋８５　敏－１６　石化的精灵６\n雪泪弓箭：攻＋３８（６～８）　防－２０　石化的精灵６\n雪泪棍棒：攻＋７１？　石化的精灵６\n\n阳炽系列:\n阳炽之兜：防＋３２　敏－４　火抗性精灵１\n阳炽之服：防＋４１　体力＋２５　火抗性＋１０　治愈的精灵６\n阳炽之枪：攻＋８８　敏－１８　混迷的精灵６\n阳炽弓箭：攻＋４３（６～８）　防－２５　混迷的精灵６\n阳炽棍棒：攻＋７７？　混迷的精灵６\n\n疾翎系列:\n疾翎之兜：防＋３７　敏－４　电抗性精灵１\n疾翎之服：防＋４６　体力＋３０　电抗性＋１０　滋润的精灵６\n疾翎之枪：攻＋８２　敏－８　昏睡的精灵６\n疾翎弓箭：攻＋３８（６～８）　防－１５　昏睡的精灵６\n疾翎棍棒：攻＋７２？　昏睡的精灵６"
