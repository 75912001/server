      content: "－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n【建议】：建议使用飞天制作的智能脚本！\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n关于灵石的效果\n\n灵石等级可以分5种等级：\n\n根据众多玩家实践和一些玩家提供意见，本人重做了一下精灵少女任务，\n发现网上玩家提出的灵石效果具有一定可信性，以下数据供玩家参考，但\n本人不能保证是百分百正确：\n\n第一种：爷爷说“这是很好的宝石呢,能得到这幺好的宝石,你的运气真的\n很不错喔”--只增加1能力\n第二种：爷爷说“普普通通嘛,真让我失望阿！”--增0.57减0.63\n第三种：爷爷说“还好嘛,害我以为是很稀世的珍宝呢！”--增1.38减0.\n75\n第四种：爷爷说“质地有点差,差强人意啦！”--减能力\n第五种：爷爷说“虽不好明讲,但质地很差呢”--减能力\n\n第一种地灵石：增加1耐久力成长率\n第一种水灵石：增加1体力成长率\n第一种火灵石：增加1腕力成长率\n第一种风灵石：增加1速度成长率\n\n第二种地灵石：增加0.57耐久力，减少0.63腕力成长率\n第二种水灵石：增加0.57体力，减少速0.63度成长率\n第二种火灵石：增加0.57腕力，减少0.63耐久力成长率\n第二种风灵石：增加0.57速度，减少0.63体力成长率\n\n第三种地灵石：增加1.38耐久力，减少0.75腕力成长率\n第三种水灵石：增加1.38体力，减少0.75速度成长率\n第三种火灵石：增加1.38腕力，减少0.75耐久力成长率\n第三种风灵石：增加1.38速度，减少0.75体力成长率\n\n第四种地灵石：减少耐久力成长率\n第四种水灵石：减少体力成长率\n第四种火灵石：减少腕力成长率\n第四种风灵石：减少速度成长率\n\n第五种地灵石：减少耐久力成长率\n第五种水灵石：减少体力成长率\n第五种火灵石：减少腕力成长率\n第五种风灵石：减少速度成长率\n\n我们打灵石时以喂第一种和第三种灵石，喂第二种灵石的必要性，不太\n重要，不过如有种属性灵石的确难打就喂第二种。\n\n我重新打灵石的个人方法，仅供玩家参考：\n\n1、深红（只要第一、三种灵石做的项链给玛蕾菲雅戴，并让玛蕾菲雅的\n婉力成长率达到最高为止）\n3、琉璃（只要第一、三种灵石做的项链给玛蕾菲雅戴，并让玛蕾菲雅的\n耐久力成长率达到最高为止）\n3、补打深红（只要第一、三种灵石做的项链给玛蕾菲雅戴，并让玛蕾菲\n雅的婉力成长率达到最高为止）\n4、补打琉璃（只要第一种灵石做的项链给玛蕾菲雅戴，并让玛蕾菲雅的\n耐久力成长率达到最高为止）\n5、碧青（只要第一、三种灵石做的项链给玛蕾菲雅戴，并让玛蕾菲雅的\n体力成长率达到最高为止）\n6、玄黄（只要第一、三种灵石做的项链给玛蕾菲雅戴，并让玛蕾菲雅的\n速度成长率达到最高为止）\n7、补打碧青（只要第一、三种灵石做的项链给玛蕾菲雅戴，并让玛蕾菲\n雅的体力成长率达到最高为止）\n8、补打玄黄（只要第一种灵石做的项链给玛蕾菲雅戴，并让玛蕾菲雅的\n速度成长率达到最高为止）"
