      content: "任务流程分为三个部分，每个部分均为单独独立，完全开放式的。\n\n\n第一步:宠物饲养\n准备5只老虎,练到等级达到125级以上\n详细信息请看如下↓\n『绿虎---野生的级数较低,不建议抓野生』\n『黄虎---玄黄洞有的抓野生60级左右』\n『红虎---福尔德村外有抓,等级一般在41-44之间』\n『橙虎---玛斯贝卡,捕捉地址:凯菈村(20.118)进入村后直接抓野生的』\n『黑虎---来到蒙达山,直接抓野生,等级比较高,注:中间的不能抓』\n\n\n第二步:装备合成\n此部分需要的装备为:加鲁娜石的枪;加鲁娜石的兜;加鲁娜石的铠.\n加鲁娜矿石装备合成方法:\n枪:加鲁娜石的枪 → 卡鲁娜矿石+木8\n兜:加鲁娜石的兜 → 卡鲁娜矿石+皮8\n凯:加鲁娜石的铠 → 卡鲁娜矿石+皮8\n卡鲁娜矿石获取方法:做完新小猪爱情故事,可以获得卡鲁娜矿石,方可合成\n\n\n第三步;挑战白虎站队\n在水城(37,41)这里准备了一队5只佩露夏(白虎)\n非常简单,法师放四次火星球就死了,100级的,并不厉害,玩家们大可放心\n\n完成任务:\n当大家将上面三个部分的任务证明石集齐以后,便可以到吉鲁岛(149,325)去学习浴血狂袭技能了\n\n技能效果：Hp50%以下时才可使用 攻敏上升20% 会心一击上升30% 吸收伤害30%转Hp\n注:\n1.目前任务一旦接受拿取任务石将不能丢弃,如不想做任务请不要点确定接取任务\n2.五只老虎可以使用野生宠物,交宠物时请不要骑/带其他虎宠(NPC收走宠物将无法找回)\n3.加鲁娜矿石任务已经解过可以直接去找NPC买矿石\n4.任务每完成一次只能给一只白虎学技能\n5.任务结束后任务石将被NPC回收,可重新接任务\n6.此任务为长期任务目前没有结束时间"
