      content: "\n必须条件：未知\n1.先到(448，405)的美鲁娜矿坑内找他们的族长谈话\n2.再到(383，432)的加特洛矿坑内找他们的族长谈话\n3.然后到了(444，494)没落的矿坑内，4F打败红虎(LV56)\n4.到达五楼后，发现两族的守护神私奔了\n5.回到加特洛村告知族长详情，得到一封\"邦恩达鲁的信\"\n6.然后送到美鲁娜村族长手上,族长也很有诚意的写了封\"帕鲁的回信\"\n7.回到美鲁娜村，也可获得一颗美鲁娜矿石及购买权\n8.将信再送回加特洛村，得到一颗加特洛矿石及购买权\n9.带着两种矿石回到没落的矿坑找小猪，得到\"加路拿矿石\"\n\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n感谢会员『舞天晓爱』提供错误"
