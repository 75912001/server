      content: "PS前言：\n◎在这里感谢很多为台湾8.0测试而奋斗的玩家，特别是天波[ggy1234]和台湾的巴哈姆特和oursa~!的天之骄子， Ｆυηｇ和重灌郎以及万宇论坛斑竹kk87（若是我忘记了谁的，麻烦联系我加上名字，谢谢），的由于本人能力有限，很多很多的资料都是参照其他玩家的资料的，我只是把他们的综合起来而已，所以这个文章，是大家共同的成果！（再次kk87借了他的号给我测试，由于本人要上学，不能自己练一个自己喜爱的号，没办法，只能这样了，所以大家看下文的图大多都是我用他的号来抓图的。）\n◎自笔者上次写了台湾石器时代7.5的心得攻略后，等到大陆开了7.5的时候，发现原来和台湾版的出入太大了（第一章的四圣兽技能竟然全错了），所以深感抱歉！这次我发之前，先声明一下：此心得攻略一定会和大陆石器时代8.0有出入，请注意，此文章不代表大陆官方华义的立场！\n◎由于图片所在的服务器经常有问题，遇到有看不到（就是打着红叉叉的图），再刷新一次就能看了（右击红叉叉，选择显示图片，90%是可以了）若是还不可以，可能是那网站在维护了，呵呵。\n◎由于本人粗心大意，里面难免有错字，欢迎大家跟帖指出，谢谢！\n◎如需转载，本人十分欢迎，但请保留此行：版权归 朽木メ露琪亞 所有，谢谢合作！\n◎最后一句，咳咳，话不多说了，开始吧！"
