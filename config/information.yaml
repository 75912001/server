      content: "                                    【First  Message  说 明 】\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n程序：Stone-Walker                                 制作：『悟空』\n\n制作者：『韩天阳』\n\n说明：Stone－Walker－First－Message  又名《STW情报》，是由韩天阳新整理的最新石器时代情报，辅助工具STW共享\n\n中心地址：\n\n·http://bbs.tt2xz.com/\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』双尖枪.乱射弓任务"]
      content: "■双尖枪.乱射弓任务\n\n1.渔村NPC史比（66.92）说话，他会请你帮他打造近距离和远距离武器\n  近距离武器：合成枪8.斧8.棍8.爪8.愿藏的斧头\n  远距离武器：合成弓箭8.回旋标8.投掷斧8.石8(合成石).近藏的棍棒\n\n2.合成好枪8.斧8.棍8.爪8.弓箭8.回旋标8.投掷斧8.石8(合成石)以后，\n  (北岛)打愿葬随机掉愿藏的斧头(几率小)\n  (南岛)打近葬随机掉近藏的棍棒(几率小)\n\n3.带着10样东西去找史比，他会送你武器\n  可以看你想搜集哪一组给他都可以.不一定要一起给两组\n\n  拿近距离全套换到：\n  双尖枪 攻+ 53 敏-12 魅+6（混迷精灵LV4）(可连续攻击两次)\n\n  拿远距离全套换到：\n  乱射弓 攻+23 防-24 (10) （毒雾精灵LV4）(最多可以打到10人)\n==================================================================\n    在“玛丽娜斯渔村”（66，93）坐标，找到NPC“史比”，与他对话。他是一个喜欢收集各式各样武器的工匠，自己也曾经改造过武器，因为把所有的家产，都用在收集及武器的改造上了，所以才在这里当一个小小的工匠，现在正准备收集一套远距离武器，和一套近距离武器，如果你愿意办他收集的话，他会给你一定的报酬的。\n    近距离武器为：合成斧头8；合成枪8；合成棍棒8；合成爪8及一把愿藏的斧头。\n    远距离武器为：合成弓箭8；合成投掷斧头8；合成回旋标8；合成投掷石8及一把进藏的棍棒。\n    如果收集齐了，就可以找他换取奖品了\n    古代木+好石＝合成斧头8\n    古代木+龙之牙＝合成枪8\n    好石+线＝合成棍棒8\n    龙之牙+珍贵的壳＝合成爪8\n    然后去北岛的愿藏桥，去打愿藏，随机会得到“愿藏的斧头”\n拿着这些东西回玛丽娜斯渔村，找史比交差，他会送给你一把自己改造的双尖枪（攻+53 敏-12 魅+6 昏迷的精灵LV4）\n     古代木+线＝合成弓箭8\n     古代木+好石＝合成投掷斧头8\n     好石+皮＝合成回旋标8\n     好石+皮＝合成投掷石头8\n     然后去难道的近藏桥，去打进藏，随机会得到“进藏的棍棒”\n拿着这些东西回到玛丽娜斯渔村，找史比交差，他会送你一个自己改造的乱射弓（攻+23 防-24 毒雾的精灵LV4 10次攻击）"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』酿酒任务"]
      content: "■酿酒任务(2种解法)\n一种赚钱版解法（可重复解）\n\n1.先到萨村(116.101)找NPC阿喇吉接任务，跟他说话后会拿到酸坏的水果酒\n\n2.从加加村前门出来（没有长毛象公车的门口）.\n  往上走到香普尔山洞(568.245)，进去洞一直走到3楼(25.23)找哥达说话\n  打赢他之后会拿到新酿的水果酒.\n\n3.回萨村.交给阿喇吉.得到魅力橘子（魅+20？）\n------------------------------------------------------------------\n另一种素材版解法\n1.先到【萨村】(116.101)找NPC阿喇吉接任务\n\n2.去【塔姆塔姆村】找布鲁斯(在肉店附近)，他会给你[花卉用的小铲子]\n\n3.去【吉鲁岛大象区】(花花世界)，会遇到80级的【鲍】\n  打倒他会得到[香味扑鼻的花]\n\n4.回【塔姆塔姆村】找布鲁斯，会把水果酒,铲子和花换成高级烧酒\n\n5.回【萨村】找阿喇吉，拿到酪酊草(酒醉的成分9)\n==================================================================\n【石器时代】酿酒任务更新讯息 2003/12/2\n各位玩家您好\n因有玩家利用酿酒任务的进行，影响到石器时代经济体系，故在衡量后工程\n人员决定将此严重影响游戏公平性的任务修正。酿酒任务其一路线奖品原为\n石币1万5千元，现已更新为[加魅力的橘子]，其功能为食用后+20魅力。\n==================================================================\n    在“萨姆吉尔村”（116，101）坐标，找到NPC“阿喇吉”跟他对话，因为7天之后，萨姆吉尔村的村长请客，他本来要送给他的水果酒，因为时间过长，坏掉了，之前跟他吹嘘自己酿出来的水果酒多香多甜，村长可是非常期待这一瓶水果酒呢。希望你如果有空闲，请帮他去相普尔山顶，采摘一种专门酿造水果酒的水果，只要有这种水果，只要花上一天的时间，就可以再次酿出来香甜的水果酒了。\n    接下来任务之后，阿喇吉会给你“酸坏的水果酒”，然后从从加加村西口出去后往北走，在几棵树后有一个隐蔽的洞口（568，24）。在香普尔山洞遇到的敌人是80级左右的哥达喽啰（人形宠物），所以最好等80级以后再去挑战这个任务。山洞下到2层会见到一个警卫，和他对话后他会说：“你身上有好浓的酒味！我～～～醉了～～～～”，通过后到达第三层。第三层被花保卫的中央位置处（25，23）遇到 哥达，打倒他后就能得到【发酵完成的水果】。回去找 阿喇吉 把水果给他，会得到15000的报酬。\n    任务可反复解（身上不带任务奖励）"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』患难见真情"]
      content: "■患难见真情\n任务限制：道具栏无此任务奖品，就可重复解\n\n1.先到『卡坦村』和『NPC迪克』（94，74）对话，接任务，要你去打奇宝的肉和格尔顿的肉，同时得到『治愈之水』；\n2.到『霍特尔村』外，遇敌打奇宝，会得到『奇宝的肉 耐久力15前后回复』；\n3.到『福村』外，遇敌打格尔顿，会得到『格尔顿的肉 耐久力105前后回复』；\n4.到『奇努伊村』和『NPC尊尼』（61，53）对话，并且跟他战斗，胜利之后会收走『奇宝的肉和格尔顿的肉』，并给你『特效药』；\n5.回『卡坦村』和『NPC迪克』（94，74）对话，会得到『疯狂药草』（混乱10回合前后，只可用一次）\n==================================================================\n到卡坦村找到迪克的人，和他对话后得知他让你帮他去找尊尼，但是首先还要去打奇宝的肉和格尔顿的肉，同时得到治愈之水。来到福村外（170，350）附近，可以打到格尔顿的肉。来到霍特尔村门口可以打到奇宝的肉。来到奇努伊（62.53）找到尊尼。他非要尼打过他才可以帮你做药。胜利后得到特效药。回到卡坦村和迪克对话得到疯狂草药（混乱10回合前后）"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』超级补的肉任务"]
      content: "■超级补的肉任务\n任务限制：可重复解\n\n1.在萨村(77.119)NPC贝丝安娜接任务，说话后会拿到【合约书】\n\n2.贝丝安娜要5种肉：一口肉＋小的肉＋丸丸肉＋大块的肉＋满腹肉\n\n  肉类请至渔村24小时便利店肉店买(要用料理)\n  一口肉=干燥肉+干燥肉\n  小的肉=大的肉+大的肉\n  丸丸肉=大的肉+大的肉\n  大块的肉=高级肉+高级肉\n  腹满肉=大块肉+高级的肉(大块肉可以在英雄岛打9*等雷龙得到)\n\n3.料理完成所需要的肉品后，回萨村与贝丝安娜说话，\n  会得到 【超级补的肉】（我方全体补血100 持续四回合）\n==================================================================\n超级补肉的任务：\n    在“萨姆吉尔村”（77，119）坐标找到NPC\"贝丝安娜\"与她对话，因为一直吃肉的关系，导致现在身体肥胖，现在想去捕获宠物经常被它们轻易逃脱，希望你能帮他找到5种肉，这5种肉分别为“一口肉”；“小的肉”；“丸丸肉”；“大块的肉”；“满腹肉”同一帮她这个忙之后，她会给你一个“合约书”，拿着“合约书”\n    来到“玛丽娜丝渔村”的“24小时店”去料理出来这几种肉，材料可以在“24店”里的“肉店”购买到。其中两块“干燥的肉”可以料理出来“一口肉”；两块“大的肉”可以料理出来“小的肉”；三块“大的肉”可以料理出来“丸丸肉”；两块“高级肉”可以料理出来“大块的肉”；五个“高级肉”可以料理出来“满腹肉”。制造料理之前，记得在“玛丽娜丝渔村”门口抓只“乌力”然后去“宠物店”学习“料理”技能，才可以进行料理唷～～\n    带着刚刚料理出来的五种肉，还有刚刚“贝丝安娜”交给你的“合约书”回到“萨姆吉尔村”去找“贝丝安娜”交差，“贝丝安娜”因感激你帮助了她，特此将你给她的那些料理，用她多年的料理功夫，作出来了一个超级补肉！！这种肉可以使得我方全体每回合恢复体力100，并持续4个回合。\n    这个任务可以反复去解，只要身上不带着任务奖品，就可以继续解任务了。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』莉儿任务"]
      content: "■莉儿任务\n任务限制：只能解一次\n\n1.先去萨村（62.43）找NPC莉儿接任务（其实可以不接）\n 她要【贝鲁卡的毛皮】＋【贝鲁伊卡的毛皮】＋【格鲁西斯的毛皮】\n\n2.贝鲁卡的毛皮＝＝＞琉璃洞窟外可以打到\n  贝鲁伊卡的毛皮＝＞琉璃洞窟外可以打到\n  格鲁西斯的毛皮＝＞福德尔村外可以打到\n\n打完皮毛之后回萨村找莉儿，得到奖品【爱心糖果】（全体异常恢复）\n\n注:\n  1.打绿.黄虎的皮毛最好在琉璃洞窟前面，红虎的皮毛在褔村右面的出口打\n  2.皮毛丢在地上会消失的\n==================================================================\n莉儿的愿望任务：\n    在“萨姆吉尔村”（63，44）坐标，找到NPC“莉儿”，与她对话。因为近期学校要举办一次舞会，可是她没有舞衣穿，虽然她妈妈说，要帮她缝制一件漂亮的舞衣，但苦于材料匮乏，如果能打到“贝鲁卡的皮毛”；“贝鲁伊卡的皮毛”；“格鲁西斯的皮毛”就一定能为她缝制一件最漂亮的舞衣。为了满足她的愿望，尽快去搜集这三样东西吧。\n    “贝鲁卡”与“贝鲁伊卡”的出现地，在南岛，琉璃洞库门口附近。只要随机遇到，打死它们，就可以随机获得“贝鲁卡的皮毛”和“贝鲁伊卡的皮毛”。而“格鲁西斯的皮毛”就要在“吉鲁岛”的“福尔德”村门口，随机遇敌，打死“格鲁西斯”后，就可以随机得到“格鲁西斯的皮毛”。打出来这三样舞衣制作的材料之后，便可以回去找“莉儿”交差了，\n    回到“萨姆吉尔村”找“莉儿”对话，她高兴的接受了这三样材料，为了感激你的帮助，送给你一个“莉儿的爱心糖果”全体异常常态恢复"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』宠物危机"]
      content: "■宠物危机\n\n1.至北岛渔村(64.77)找NPC凯丽对话.她会请你帮她捉一只LV1的邦洛洛克斯\n2.至北岛森林中央通道(393.464)附近.捕捉一只LV1的邦洛洛克斯\n3.回到玛丽娜丝渔村找凯丽.她会感谢你而送你一颗铁壁之石\n(铁壁之石 耐久力回复500+复活守护精灵(只能在战斗中使用.用一次后消失)\n==================================================================\n到玛丽娜丝渔村（63.77）找到NPC凯丽对话，得知她在收集宠物，需要你交给她1级的邦洛洛克斯。\n出渔村后来到坐标（392，471）可以抓到邦洛洛克斯。\n回到渔村和凯丽对话后可以得到铁壁之石（复活守精灵 耐久力500回复）\n此任务可以重复解，身上必须无铁壁之石。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』事实的真相"]
      content: "■事实的真相\n这任务是和一个叫九兄弟之一的人有关\n\n解法：\n九兄弟之一出现点：\n1.萨村黑乌力上方\n2.渔村武器店附近\n3.渔村的肉店附近\n4.霍尔特村记录点上方*\n5.萨村水井旁\n6.霍尔特村54.79*\n*为母亲的日记掉落点\n\n遇九兄弟之一战斗打到母亲的日记去奇努伊村(63.38)找欧吉姆特欧姆尔特\n说他为什么要假扮九兄弟\n对话完可拿到 真诚的眼泪(复活光精灵+100血)（用完会不见）\n任务完结\n==================================================================\n在北岛的5个村子中，有9个模样相同的人， 分别找到这9个人对话，战斗后可以得到母亲的日记。9个兄弟出现地点分别为渔村（94，97），（97，79）萨村（81，93），（39，58）霍特尔村（39.26）（54.80）卡坦村（81.39）(85.69)。得到日记后来到奇努伊村（63.37）他会告诉你所有的一切。对话完毕后可以得到真诚的眼泪（复活光精灵 耐力恢复100）"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』梅尔吉料理任务"]
      content: "■梅尔吉料理任务\n\n1.到渔村(57.66)找NPC梅尔吉接任务；她会要你帮他料理5个料理，\n2.分别是：照烧煮鱼、美食汤、豪迈的炒青菜、豪华肉拼盘、清脆沙拉；\n3.合好后交给她，她会给你1W石币和【陈年葡萄酒（补气70耐500单人）】\n\n注：可重复解，只要葡萄酒不在身上。\n\n料理方法：\n 照烧煮鱼　　　：　鱼1+水1+盐2+油2\n 美食汤　　　　：　水4+螃蟹4+花只4+胡椒3(风城有卖)\n 豪迈的炒青菜　：　油4+碳3+包心菜4+青椒4+胡椒4\n 豪华肉拼盘　　：　肉4(高级肉)+豆4+樱桃4\n 清脆沙拉　　　：　包心菜2+蕃茄2+红萝卜2+小黄瓜2\n==================================================================\n梅尔吉料理任务\n    在“玛丽娜斯渔村”（57，66）坐标，找到NPC“梅尔吉”，与他对话。因为要在家里举办盛大的宴会，但是大厨师一早病倒了，想去请其他的大厨，可是他们都在别的地方开伙了，现在赶不过来了，他正在找人帮忙准备宴会用的主菜呢，问你是否有时间帮忙去准备一下，或是如果你认识别的大厨，方便的话，请他过来帮忙。乐于助人的你，肯定乐于接受了，拿到料理菜单，所需料理“清脆沙拉”；“豪迈的炒青菜”；“豪华肉拼盘”；“照烧煮鱼”；“美食汤”。\n    接到菜单后，开始准备料理材料吧～不过，还是不要忘记，渔村外面现抓只“料理强手－乌力”然后去宠物店，学习料理技能，然后才可以做料理哟～～。\n    来到“玛丽娜斯渔村”的“24小时店”在各个摊位购买到所需要的材料。\n    料理出来所有的食品后，拿回“梅吉尔”那里交任务，出于感激之情，“梅吉尔”送于你1万石币，还有一瓶“陈年葡萄酒”气力恢复70耐力恢复500（单体）。\n    此任务可以反复去做，只要身上没有任务奖品就可以。\n\n清脆沙拉=红萝卜2+蕃茄2+包心菜2+大的小黄瓜\n豪迈的炒青菜=塔姆塔姆产的油+炭3+包心菜4+青椒4+胡椒4\n豪华肉拼盘=高级的肉+樱桃4+豆4\n照烧煮鱼=鱼1+水1+醋盐+油2\n美食汤=水4+螃蟹4+大王花枝+胡椒4"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』海底寻宝任务"]
      content: "■海底寻宝任务\n任务限制：不带上任务奖品就可重复解\n\n在萨村（31.71）会看到NPC凯拉斯\n他说他要海底里的五样东西\n再来到海底打5个宝箱钥匙之后(打罗多克雷会打到宝箱钥匙)\n钥匙应该全区域都有,只要打60级以上的敌人,都会掉落钥匙\n\n从以下座标可看到宝箱\n然后宝箱会跟你交换\n\n黄金图印(147.26)(267.59)(369.113)(168.86)(355.102)可拿到\n古老的勾玉(147.35)(210.91)(253.42)(245.261)(299.79)可拿到\n传说的竖琴(152.45)(267.123)(353.160)(365.156)(354.64)\n透明的水晶(237.98)(136.81)(357.89)(359.216)\n金沙(242.73)(155.53)(315.54)(327.24)(318.92)可拿到\n\n再把这五样东西交回给凯拉斯就送你(随机)：\n\n静心手环(攻+10防+10敏+10)\n力击之戒 (魅力+10.会心一击率上升+9)\n和弦的首饰(魅+4 睡眠、石化耐性+85)\n\n注：白狼某些技能一定要出星才会升级.用暴击之戒装备后在来练工..\n    大约打3次就有一次出星的攻击..所以很好练.\n==================================================================\n在萨村坐标31.71就会看到凯拉斯，对话后他说你身上没有黄金图腾不会和你交换的。来到海底在坐标（257.64）附近打等级61－－69的那尔斯有机会得到宝箱钥匙。从以下坐标可看到宝箱，然后宝箱会跟你交换。宝葙打开后会消失，必须到另外一个地点寻找。\n  坐标353.101  可拿到黄金图腾印\n  坐标147.26    可拿到黄金图腾印\n  坐标168.85    可拿到黄金图腾印\n  坐标268.58    可拿到黄金图腾印\n  坐标370.113  可拿到黄金图腾印\n\n  坐标147.35    可拿到古老的勾玉\n  坐标210.91    可能到古老的勾玉\n  坐标253.42    可能到古老的勾玉\n  坐标299.78    可能到古老的勾玉\n  坐标245 262  可能到古老的勾玉\n  坐标152.45可拿到传说的竖琴\n\n  坐标267.122可拿到传说的竖琴\n  坐标354.64可拿到传说的竖琴\n  坐标364.147可拿到传说的竖琴\n\n  坐标237.98可拿到透明的水晶\n  坐标365.106可拿到透明的水晶\n  坐标357.89可拿到透明的水晶\n  坐标137.81可拿到透明的水晶\n\n  坐标242.73可拿到金沙\n  坐标155.53可拿到金沙\n  坐标318.93可拿到金沙\n  坐标314.53可拿到金沙\n收集齐五样东西交给凯拉斯就可以兑换奖品了。\n物品分别为：\n1.净心手环(攻＋10防＋10敏＋10)\n2.力击之戒 (魅力+10.会心一击率上升+9)\n3.和弦的首饰魅+4睡眠、石化耐性+85弦\n此任务可重复解，身上不能有任务奖品。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』光之圣石任务"]
      content: "■光之圣石任务\n任务限制：可重复解\n\n1.先到塔姆塔姆村（56 35）找NPC克雷说话，\n  他会请你帮他到森林洞窟的山顶，带回光之圣石的碎片\n2.森林洞窟（452.162）\n  去到森林洞窟的山顶（25.20），在哈罗山医生的右边有颗光之圣石，\n  和他对话就会进入战斗(血量很多.而且会放十分强力的火属性魔法)\n  打败后得到光之圣石的碎片(只要打一个就够，多的会一起收走)\n3.回到塔姆塔姆村找克雷对话，他会感谢你而送你一个光之石\n\n　光之石（单体气力回复　每回合回复50气力，持续3回合）\n\n  光之石就像气药一样，只能用一次\n\n注：只要把光之石放到寄放店，可重复解\n==================================================================\n    先到塔姆塔姆村５６．３５找克雷说话. 他会请你帮他到森林洞窟的山顶.带回光之圣石的碎片\n    直冲森林洞窟的山顶.在哈罗山医生的右边有颗光之圣石. 和他对话就会进入战斗.(血量很多.而且会放十分强力的火属性魔法) 打败后得到光之圣石的碎片(只要打一个就够了.多的等一下会一起收走)\n    回到塔姆塔姆村找克雷对话.他会感谢你而送你一个光之石.任务结束 （光之石　单体气力回复　每回合回复５０气力　持续３回合）"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』富商的货物"]
      content: "\n■富商的货物\n任务地点：奇努伊村内找盖落比（５４．７６）\n适合等级：70级以上\n限制条件：解过成人礼\n任务限制：可重复解\n\n到沙姆岛奇努伊村找盖落比（５４．７６），拿到富商的货物后，到吉鲁岛\n的小象区遇敌，遇到Lv60的巨大玛恩摩注意要把它抓起来，抓完以后富商的\n货物会消失，在回去拿给盖洛比。\n\n得到宠物忠诚肉片（宠物忠诚度＋１０）完成任务"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』熊熊危机"]
      content: "\n■熊熊危机\n任务限制：可重复解，带不可思议的贝壳\n熊得坐标.卡鲁他那村外(61,443)\n\n1.卡鲁他那村村口(95.62)接任务；拿到【赛尔的委托书】之后去找白熊.\n2.在卡鲁他那村外，转左一直走，在(40.444)拿到白熊的牙\n　（知道原来白熊的孩子还小，怕伐木的人伤害他们才攻击人类）\n3.回卡鲁他那村，交出白熊的牙给村口的人，就可换到 3个 60气 \"全体\"\n\n注：任务中须要先拿不可思议的贝壳，才能跟白熊说话！\n\n\n【注】：需要把气瓶寄放或者使用才可以无限拿"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』来自海底深处的歌声"]
      content: "\n■来自海底深处的歌声\n1.在加加村的（112.67）有一个叫哈尔利(好常出现= =)的人，他希望你帮他\n  找一下萨姆吉尔的医生\n2.于是到萨姆吉尔村的医院李找萨姆吉尔的医生，他会给你一个药材，于是\n  前往哈罗山(452.163)\n3.到山顶，和哈罗山的医生讲话，会得到药\n4.回加加村找哈尔利，得到安眠药(催眠10回合前后)\n任务结束"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』拯救同伴任务"]
      content: "\n■拯救同伴任务\n1.首先到奇喀喀村(63.43)找盖尔，他会说他的渔夫同伴被抓到史东尔洞窟里\n  ，请你帮他找回来.\n\n2.到泪之海内(386.199)进入史东尔洞窟.\n史东尔１楼→２楼（45.36）\n　　　２楼→３楼（18.26）\n　　　３楼→４楼（73.27）\n　　　４楼→５楼（64.48）\n　　　５楼→６楼（62.9）\n3.前往6楼，到6楼座标(22.17)会看到火人鱼-洛克侨.\n\n4.与他对话后，开始战斗(不会很强，别担心^^).\n  敌人分别为：\n  140等火人鱼~洛克侨\n  120等克雷特洛\n  120等克雷吉洛\n  120等史卡鲁\n  120等史卡特\n战斗胜利后，获得洛克侨的鳞片(道具栏要空一格).\n\n5.带着洛克侨的鳞片回奇喀喀村找盖尔，\n\n得到：\n珊瑚耳饰~魅+10 回避率上升9\n宠物 洛比特(我拿到54.10.9.5   无特技 属性地7水3)"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』福村恶霸任务『救援罐头』"]
      content: "『7.0任务』福村恶霸任务【新宠技罐头--救援】\n\n编辑：韩天阳\n\n1.接任务：福村NPC文森（49.40），他说在海底通道有一些专门打劫的恶霸\n  希望玩家可以去帮忙打倒他们\n\n2.接完任务会得到【包裹一袋】（丢出会消失请重新说话拿取）\n  可吸引恶霸出现\n\n3.福村－吉鲁的海底通道（22.16）可以遇到【恶霸老二和老三】两人一组，\n  打赢后拿到【恶霸的头饰】\n\n4.接着进入奇－北岛海底通路（11.23）可以遇到【恶霸老大】\n  打赢后拿到【恶霸逃走的足迹】\n\n5.回去跟文森对话，他会感谢你，然后可得到\n 【宠技罐头】==>救援的罐头\n\n可学习技能：【救援】\n\n技能效果：宠物牺牲50%的HP，加到他人身上。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』勇士火锅"]
      content: "\n■真实的荣耀 - 勇士火锅\n1.先在达拿村接任务(其实可以不用接)；\n2.往达拿村口打红人龙和蓝人龙会拿到手爪和脚爪；\n3.往福村村外421.319(一直向上走)打到黄人龙的牙；\n4.回去达拿村说话交东西就拿到 \"勇士火锅\"。\nPS:以上声望不太清楚.但解完4个.人物声望一共上升了\"1\"。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』柯西任务"]
      content: "『7.0任务』柯西任务\n\n编辑：韩天阳\n\n任务流程：\n找柯西4次即可\n第一次得到【贝壳碎片1】\n第二次得到【贝壳碎片2】，并收走【贝壳碎片1】\n第三次得到【贝壳碎片3】，并收走【贝壳碎片2】\n第四次得到【美丽的盐】，并收走【贝壳碎片3】\n\n战利品：『美丽的盐』(盐的成分3)\n\n\n出现地点：\n1.渔村内（62.33）\n2.渔村内（42.74）\n3.渔村内（101.85）\n4.渔村内（49.43）\n5.渔村内（104.70）"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』卡坦混草任务"]
      content: "\n■卡坦混草任务\n卡坦村接任务.在海洞外打奇宝肉,之后再去福村外打咖啡色的星星肉.打完\n回卡坦村说话.之后再去奇努伊61.53找 一个鲁乌的人打架..之后打完拿到\n突 效药 再回卡坦村换混乱草10前后(只可用一次)"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "『7.0任务』罗曼蒂克礼物"]
      content: "\n■罗曼蒂克礼物\n1.先合一个合成爪7(牙7+壳7)\n2.至霍特尔村(62.43)找契雷多说话\n　他会请你给他一个合成爪7去海底挖珊瑚.以便送给他的女朋友\n　给他之后他会帮你改造成\"挖珊瑚用的爪\"(无法装备)\n3.带着\"挖珊瑚用的爪\"到泪之海(151.76)附近遇敌\n　会遇到50级的\"珊瑚奇格拉\"和\"珊瑚多格斯\"\n　打败后能随机得到\"鲜艳的红珊瑚\"(我只打了一个)\n4.把\"鲜艳的红珊瑚\"带回去给契雷多\n　他会很感谢你.并送给你一个 \"家传的烤香菇\"\n　(家传的烤香菇 - 单体耐久力1000回复 用一次后消失)\n\n\n在萨村用合一个爪7(牙7+龟壳7),之后去霍村找一个人(医院后面),换了珊瑚\n爪.要你去挖珊瑚.他说在寄居蟹中.戴上爪到泪之海(160.80)附近有珊瑚XXX,\n全都是50lv的。打完会得到鲜艳的红珊瑚,之后回到霍村找那个人 ,他便会\n给你一个香菇,耐久力回复1000单体"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "【7.0石头就业所就职任务】"]
      content: "※  就  职  任  务  ※\n\n\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝\n\n     三大职业扩大招募种……\n     只要您是石器原始人\n     年龄不限、能力不拘！\n     还等什么？快来加入吧！\n\n＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 决斗详尽资料】", "PK兵法之〈心战篇〉"]
      content: "【作者：BOX_小小飞】\n－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－－\n\n上次发了篇用机暴对付现在几种常见宠的战术，今天手痒又想胡诌一番，这些东西比较BT，都是心理战，一般PK玩玩的没必要研究的，只是不吐不快，不喜欢看的就当没看见吧。\n\n兵法分为形与神：固定的战术和计策为形；而分析，猜测对方心理的方法则为神。形神具备才能真正将战术发挥的淋漓尽致。\n\n首先要将对手按照其才智分类，PK时及早分析出对方是属于哪种类型才能做到知己知彼，百战百胜是不敢谈，但是不至于被对方牵制倒还是可以做到的。\n————————————————————————————————\n木头型：\n这种人是初出茅庐，不知世间险诈，毫无防人之心。你给他下一个陷阱，他要掉进去N次才会学乖；等他学乖了你再下第2个陷阱给他，他还是照样掉进去N次才看出来这也是一个陷阱。\n\n对策：\n对付这种人不用谈什么对策，因为等他明白了你每一个行动都是陷阱时自己早死了七八百次了，这辈子是不用花心思在他身上了。\n——————————————————————————————\n孺子可教型：\n这种人比较聪颖，学习能力较强，只是经验稍微不足。第1个陷阱他掉进去5次左右就学会绕道走了；第2个陷阱他掉进去3次也学会了；等你下第3个陷阱给他时，他会有所预感，但是还不能确定，所以还是会照样掉下去；第4个陷阱他就已经知道步步为营了，小心绕开走,等他知道自己判断是正确的时候就会信心大增；等到你下第5个陷阱时。。。嘿嘿，这时候他就已经学会利用这个陷阱来害你了，小心作茧自缚啊。\n\n对策：\n对付这种人也不难，前3个陷阱多下些分量，要他不能翻身就可以了，这样就没有第4次和第5次了。但是如果他的才智在你意料之上，前3个陷阱没能要了他的命，那么这个时候就要把他扼死在萌芽状态，也就是说在他开始试图预测你下一个陷阱时就不要故计重施了，这样做有2个目的：\n一是可以打击他刚刚开始发芽的自信心，令他再次回到被你玩弄与掌间的状态\n二是可以为你下一个陷阱做更好的伪装\n如果这样都没能搞定他，说明他是一个小天才，这时就要收起轻敌之心了，因为这个时候的他已经跟你相差不远了。这时就要利用他经验不足的弱点，以自己长期积累的丰富经验来把他耍的晕头转向。\n总结一下就是：\n1。要速战速决，防止他适应你的战术\n2。打击他自信心，令他无法预测你的行动\n3。多下迷魂药来搞的他眼花缭乱\n——————————————————————————————\n老妖怪型：\n这种人已经在PK场上打滚多年，各种各样的战术都见过，你下的陷阱还没做成他就看出来了，没准你陷阱没做完就先掉他的陷阱里了，真是很棘手的对手。\n\n对策：\n这种人，他知道你的你都知道，你知道的他也差不多都知道，用对付前2种人的小花招就没用了，就要靠自己的实力来跟他打。虽然说是要硬拼，不过也不是卤莽的上去你一刀我一刀地对砍，而是应该避其锋芒而攻其不备。自己出手时要保证情况对己方有利，而当情况对对方有利时则应该保存实力，这样谁控制优势控制的好胜利就会偏向于谁。\n\nps：我所说的小花招指的是不花力气就想大占便宜的招数，例如自己该补血时不补血，反而用镜想来让对方吃一大亏，这种花招对付前2种人还可以，但是对付这种老妖怪就没什么用处了，他必然有所准备，还是老老实实地加血吧。等他看你几次都老老实实地加血，你再突然一个镜的话说不定还有点收获。这个就要根据对方的小心程度来决定什么时候加镜了。\n\n——————————————————————————————\nBT非人型：\n这种人不多见，是极度聪明狡诈的一类人,拥有魔鬼一般的智慧。他能够十分准确地猜测到你的心理活动，不但你的圈套害不到他，他设的圈套你却想也想不到，这种人最善于利用别人的计策来将计就计，而自己又极度小心，先立于不败之地再去对付别人。这样一来你不断被他牵制，很容易丧失自信心而被他玩弄于掌间，对他来说你就变成了第2种人。\n\n对策：\n对付这种人无论是战术还是头脑你都赢不了他，因为他经验远比你丰富，智商也远高于你，你的行动几乎都在他掌握之中。那么就应该化繁为简，不要跟他比智力也不要跟他比战术，而是跟他赌运气，只有运气是对人人平等的。你可不要不服气，因为你越是不服气，越是不信自己没他聪明，你就越容易被他掌握到你的心理，遇到这种BT级的人物就只有以最简单破解最繁复，令他对你的“傻”感到意外，这样你才有胜利的机会。\n——————————————————————————————\n\n以上说了这么多，大家一定会问到底怎么才能知道对方是属于哪种人啊。这个我也很难回答，一般我是靠感觉和一些平时的微小动作来判断对方是哪种人的，这个过程是逐渐的，战斗越久他属于哪种类型就越是明显。看你的观察力了，你发现的越早那么就越容易战胜他。"
    - path: ["『Stone-Walker—FM』【石器行者情报浏览】", "【Stone-Walker 任务资料大全】", "×7.0任务×", "【7.0石头就业所就职任务】", "闇灵法师-就职任务"]
      content: "『闇灵法师』-就职任务  作者：BOX_ｙｕｈｕａｓｈｉ\n==================================================================\n任务条件：需1转以后解完成人任务\n任务须知：就职任务完成后就不可以退职；如在做就职任务中，想退职，可去公会跟『NPC马尔』退职。\n\n1.来到『奇奴伊村』由（75，61）出村，来到沙姆岛\n\n2.走到（110，43）进入『暗灵法师公会』\n\n3.跟『NPC萨哈克』（17，22）对话接任务，传送进入『暗灵法师试炼洞窟』\n\n4.跟『NPC暗灵试炼者』（7，4）对话，按“确定”，传送进入『暗灵法师试炼洞窟』\n\n5.跟『NPC暗灵试炼者』（68，29）说暗语“塔希摩比奥”，得到『闇灵信物一』，传送进入『暗灵法师试炼洞窟』\n\n6.在『暗灵法师试炼洞窟』可以打出『药草1』『药草2』『药草3』『药草4』『药草5』，集齐这5种药草后，跟『NPC暗灵试炼者』（151，5）对话，得到『闇灵信物二』，传送进入『暗灵法师试炼洞窟』\n打药草所遇敌人为：LV80四属性端午兽\n\n7.跟『NPC暗灵试炼者』（119，85）对话，进入战斗，敌人为LV100水端午（会LV5火魔法及其他LV3魔法），战斗胜利后得到『闇灵信物三』，传送进入『暗灵法师就职所』\n\n8.跟『NPC萨哈克』（17，22）对话，交出3样信物，再跟左下方的『NPC希尔』对话，得到职业装备（5样道具），血剩20点，其他点数还原，职业等级＋1\n\n任务完成\n\n\n【暗灵法师】能力上限：\n体力    腕力    耐力    速度    气力\n无      200     200     无      150\n\n【蛇之套装】\n蟒蛇之冠   防+15 气力+40 毒耐性+60 净化精灵(混乱)LV2\n双头蛇之铠 防+40 回避率+6 气力+40 滋润的精灵 LV4\n灵蛇扣带   会心一击率上升+6 气力+40\n响尾蛇之靴 敏+20 气力+40\n青蛇之杖   气力+40 混迷的精灵 LV4"
