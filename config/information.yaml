      content: "加鲁卡岛（南岛）--卡鲁它那村（东303,南599）（东571,南378）\n\n【村庄简介】\n位于南岛下方的卡鲁它那村是由散落的一个一个小块陆地组成的组成的，村庄内搭起许多小桥连接一块块的陆地跟建筑物，这里的渔业虽然没有北岛的渔村那样发达，却也是个以海洋为生的村落，卡鲁它那村的钓竿专家制作的各种钓竿可以说是本村的名产之一。\n\n1.记录点的存点肉：克邦凯斯的肉（可在卡鲁它那海滩打到）\n\n2.建筑物：\n■卡鲁它那村的长老家：可在此请占卜师为您占卜。\n■卡鲁它那道场：在这里贩卖前往「猜谜三兄弟的家」的入场卷，但等级限制为70级以上，70级以下请往玛丽娜斯渔村的道场。\n■聊天室：玩者可以购买门票进入聊天室内聊天。\n■长毛象快递：在此可接受委托送货任务。\n■竞技场：玩者可在此购买门票进入竞技场PK。竞技场内贩卖的物品请参阅竞技场商店街。\n■宠物店：买、卖、寄放宠物，以及让宠物学习技能。\n\n可习得的技能\t功能\t价钱\n待机\t什么也不做\t500S\n攻击\t通常攻击\t1000S\n防御\t通常防御\t1000S\n破除防御\t对采取防敌人攻击可能\t1500S\n连续攻击\t两次连续攻击\t2000S\n被水之战其之1\t防御力变成-30%攻击力变成+30%\t2000S\n泥醉攻击\t攻击力-30%三回合前后让敌人酒醉\t2000S\n加工\t合成素材制作道具\t1500S\n料理\t使用素材制作料理\t1000S\n\n■道具店：可买卖人物装饰品，例如首饰、耳环等等。\n\n贩卖物\t功能\t价钱\n皮的手环(红)\t攻+2 防+2 敏-2 魅+1\t5000S\n温蒂妮LV1贝铃\t魅+1疾风的精灵LV1\t300S\n温蒂妮LV2木笛\t魅+2疾风的精灵LV2\t700S\n温蒂妮LV3鸣子\t魅+3疾风的精灵LV3\t1200S\n黄玉的戒指\t魅+3会心一击率上升+1\t500S\n黑色小首饰\t魅+1毒耐性+10\t3400S\n红色小首饰\t魅+1石化耐性+10\t3000S\n小骨小首饰\t魅+1睡眠耐性+10\t2600S\n绿色小首饰\t魅+1混乱耐性+10\t4000S\n青色小首饰\t魅+1酒醉耐性+10\t2000S\n小双重耳环\t魅+1回避率上升+2\t1600S\n\n■武器店：武器店里可以买卖武器和防具。\n\n武器店\n贩卖物\t功能\t价钱\n普通普通的斧头\t攻+14 防-5 敏-5\t260S\n轻的斧头\t攻+19 防-7 敏-6\t1040S\n重的斧头\t攻+27 防-9 敏-10\t2990S\n硬的斧头\t攻+37 防-12 敏-12\t11050S\n小棍棒\t攻+4\t50S\n普通普通的棍棒\t攻+8\t200S\n轻的棍棒\t攻+11 敏+1\t800S\n大的棍棒\t攻+20\t5000S\n小的枪\t攻+5 敏-1 魅+1\t60S\n普通普通的枪\t攻+10 敏-2 魅+1\t240S\n重的枪\t攻+21 敏-5 魅+2\t2760S\n硬的枪\t攻+30 敏-6 魅+3\t10200S\n小的爪\t攻+3 (×2)\t55S\n普通普通的爪\t攻+6 (×2)\t220S\n轻的爪\t攻+8 敏+1 (×2)\t880S\n小的投掷斧头\t攻+4\t50S\n普通普通的投掷斧头\t攻+8\t200S\n重的投掷斧头\t攻+17 敏-1\t2300S\n\n防具店\n贩卖物\t功能\t价钱\n粗杂的兜\t防+3\t50S\n普通普通的兜\t防+4\t200S\n重的兜\t防+9 敏-2\t2300S\n米鲁菲LV1兜5\t防+8 敏-3 净化精灵(昏睡)LV1\t5750S\n破烂的帽子\t防+1\t40S\n美鲁菲LV2帽子2\t防+1净化精灵(毒)LV2\t304S\n粗杂的铠\t防+4 敏-1\t75S\n哈鲁LV2铠2\t防+7 敏-2治愈的精灵LV2\t500S\n轻的铠\t防+11 敏-2\t1200S\n重的铠\t防+17 敏-5\t3450S\n破烂的服\t防+2\t60S\n芙雷雅LV1服2\t防+3滋润的精灵LV1\t484S\n薄的服\t防+9 敏+1\t2760S\n\n■医院：回复体力和气力的好去处，可买药，亦可美容。\n\n贩卖物\t功能\t价钱\n耐久力回复药\t耐久力100前后恢复\t25S\n耐久力回复药\t耐久力200前后恢复\t50S\n气力回复药\t气力20前后恢复\t80S\n气力回复药\t气力40前后恢复\t160S\n气力回复药\t气力60前后恢复\t240S\n复活药(100)\t气绝回复成耐力100\t100S\n复活药(300)\t气绝回复成耐力300