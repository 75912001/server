      content: "作者：微笑赢家 多多\n水城（力之手环）任务\n\n条件：\n1、已成人\n2、80级以上\n3、完成金飞航空任务\n\n一、准备工作：\n带上以下材料：\n1．圣兽之麟（麟11）——池封印迷宫2楼（水精灵）＆没落的矿坑4楼(4x奇拉顿)。\n2．柔软的黏土（黏土4）——萨村或卡鲁它那24店\n3．草的蔓（线2）——萨村或卡鲁它那24店\n4．千年花（花10）——吉鲁岛花花世界（8X级大象）＆５０年前英雄岛水坝南方洞穴（100~105级敌人）＆封印洞窟４楼(风精灵)\n\n二、前往水城\n进入水城方法：\n1、从伊甸园（10，120）出伊甸园；\n2、一直走到（34．214），进骨头拱门；\n3、进入一个西方沙漠洞穴内通道，再走到（0，38）会进入西方沙漠洞穴外通道；\n4、在西方沙漠洞穴外通道往前走，走到（0．7）就会出来伊甸大陆西方；\n5、在伊甸大陆西方，一直走到（389．389），进入尼克斯城区；\n6、在尼克斯城区，走到（390．14），会到伊甸大陆南方，\n7、在伊甸大陆南方，走到（9．48），进尼克斯城区；\n8、在尼克斯城区，走到（372．248）过桥，走到（341．74）再过桥，走到（264．115）又过桥，走到（219．136）再次过桥，走到（219．200）过桥就到达水城。                                  │\n\n三、解任务\n\n1、在水城、到（55．51）找喀尔斯说话，接任务。\n2、到水城（83．32）找莉娜，并且跟他说“喀尔斯”，她会给你一个花环。\n3、到水城（55．51）找喀尔斯，和喀尔斯说“莉娜”，他会收下花环，并且会告诉你，想请你去找卡蜜儿。\n4、到水城（83．32）找莉娜，先跟他说“麦特”，接著再说“卡蜜儿”，她会叫你说要去找哪个给卡蜜儿贝壳的人。\n5、、到水城（55．51）找喀尔斯，和喀尔斯说：“花贝项炼”，拿到了花贝项炼制作元件表：\n\n所需原料如下：\n1．圣兽之麟（麟11）\n2．柔软的黏土（黏土4）\n3．草的蔓（线2）\n4．千年花（花10）\n6、因我们在准备工作时，身上已带有上述原料，所以再和喀尔斯说话，他会把这些原料都做成一个花贝项炼\n7、到水城（60．85）麦特家，向麦特说：“卡蜜儿”，他请你向喀尔斯写信给卡蜜儿。\n8、到水城（55．51）找喀尔斯，和喀尔斯说话，拿到喀尔斯写的信。\n9、到水城（16．104）找卡蜜儿，把花贝项炼和喀尔斯写的信给卡蜜儿，会拿到卡蜜儿写的信。\n10、到水城（55．51）找喀尔斯，和喀尔斯说话，交出卡蜜儿写的信，会拿到心之贝壳和力之砂，\n11、到水城（55．51）找卡蜜儿，和卡蜜儿说话，交出力之砂和心之贝壳，拿到真心项炼！\n12、到水城（60．85）麦特家，和麦特说话，把真心项炼交给麦特。\n13、到水城（16．104）找卡蜜儿，和卡蜜儿说话，卡蜜儿送你力之手环（攻+37？ 防+37？ 敏-37？ 魅+8）\n14、附：心之手环和力之手环任务只能选其中一个任务解。"
