# 敌人组配置
# 任何修改此文件的行为都需要通知客户端和服务端开发人员

# 关于出现的位置
## 在回合制战斗中,位置规则当前固定:
### 发起方
###  1(560,420), 2(480,480), 3(640,360), 4(400,540), 5(720,300), 6(480,360), 7(400,420), 8(560,300), 9(320,480), 10(640,240)
###  1-5 是角色位, 6-10 是对应角色携带宠物位
### 接受方
###  1(240,180), 2(160,240), 3(320,120), 4(80,300), 5(400,60), 6(320,240), 7(240,300), 8(400,180), 9(160,360), 10(480,120)
###  如果 1-5 是角色位, 6-10 是对应角色携带宠物位; 如果接受方全是宠物, 则从 1,2,3... 顺延放置
### 先从必须出的怪物(weight=0)开始,按照配置顺序
### 然后从剩余位置中,按照权重随机选择

# isBoss: true/false 是否是Boss组[默认false]
## 如果是 boss 组, 那么按照固定顺序,将怪物放置到指定位置.
## 出现的怪物, 必须全部配置在enemies中, countRange 无效
## 每个敌人必须且只能配置 enemies[].level 或 enemies[].levelRange; 组级 levelRange/roleLevelOffset 无效
## captured 无效(不可捕获)
## babyRate 无效(不可出现宝宝)
## weight 无效

# countRange: [2, 5]              # 敌人数量范围, [1, 10] 之内
# levelRange: [最小等级, 最大等级] # 敌人等级范围, [1, 140] 之内
# roleLevelOffset: [最小偏移, 最大偏移] # 角色等级偏移
# levelRange 和 roleLevelOffset 必须且只能配置一个
# captured: true/false 是否允许捕获 [默认:true]
# babyRate: [0, 100000] 每只敌人成为宠物宝宝(1级)的概率(十万分率) [默认:0]
# enemies[].id: 引用 pet.yaml 中的宠物ID (作为敌人模板)
# enemies[].weight: 权重(加权池), 用于随机选择敌人 [默认:0]:0:必定出现
# enemies[].level: 指定敌人等级 [1, 140] 之内
# enemies[].levelRange: 本成员随机等级闭区间 [最小等级, 最大等级], 值在 [1, 140] 之内; 与 enemies[].level 互斥
# enemies[].battleAI: 必填, 引用ai.yaml; 敌人战斗技能、权重和目标策略全部由该AI提供.
      
