# 敌人战斗AI配置, 由enemy.group.yaml显式引用.
# 任何修改此文件的行为都需要通知客户端和服务端开发人员

# id: AI配置ID, 由enemy.group.yaml的enemies[].battleAI引用.
# skills[].id: 敌人持有的技能ID, 必须存在于skill.yaml且支持敌方执行.
# skills[].weight: 相对选择权重, 整数范围[1,2147483647]; 不使用的技能不配置.
# 同一AI的技能ID不得重复, 总权重必须处于[1,2147483647].
# 技能按列表顺序划分权重区间, 不使用固定七槽或出生技能下标.
# 敌人技能、权重及目标策略全部来自此文件; pet.yaml skill只负责新宠物出生技能.
# targetScope: allOpponents/playerCharacters/playerPets/partyLeader
# targetSelection: random/highestHp/lowestHp/highestAttack/highestAgility/lowestAgility/elementalSubdue
# targetRandomRollMax: 仅非random策略使用; RAND(0,value)为0时随机选择, 否则使用策略最优目标

