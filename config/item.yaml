# 道具-配置
# 任何修改此文件的行为都需要通知客户端和服务端开发人员
#
# 条目主键: 使用新版武器ID, 武器.爪范围为[3900000,3909999], 必填.
# name: 物品基础名称, 必填, 无默认值.
# secretname: 物品鉴定或实例显示名称, 可选, 默认"".
# effectstring: 原版客户端显示的属性和效果说明, 仅用于展示, 可选, 默认"".
# atlas: 相对客户端assets目录的无扩展名图集路径, 武器必填.
# sprite: 原版帧ID, 用于从atlas图集中取得图像, 武器必填且必须大于0.
# 普通道具也必须显式配置sprite; sprite为0表示没有图像, 此时不能配置atlas.
# use: 普通道具的主动使用效果, 可选, 默认不产生使用效果; 武器禁止配置use.
# use.target: 使用目标, 配置use时必填. character-角色, pet-宠物.
# use.exp: 增加目标经验值, 可选, 无默认效果; 配置时必须大于0.
# use.loyalty: 增加宠物忠诚度, 可选, 无默认效果; 配置时必须大于0且target必须为pet.
# use中exp和loyalty必须且只能配置一个.
# cost: 原版商店价格, 可选, 默认0.
# level: 装备所需等级, 可选, 默认0, 0表示无等级限制.
# neprof: 职业限制, 可选, 默认0. 0-无职业限制, 1-战士, 2-巫师, 3-猎人.
# otdmags: 原版额外伤害修正值, 可选, 默认0.
# nsuit: 原版套装编号, 可选, 默认0, 0表示不属于套装.
# attacknum_min/attacknum_max: 物品生成时攻击次数的最小值和最大值, 可选, 默认0.
# attack_min/attack_max: 物品生成时攻击力修正范围, 可选, 默认0.
# defence_min/defence_max: 物品生成时防御力修正范围, 可选, 默认0.
# quick_min/quick_max: 物品生成时敏捷修正范围, 可选, 默认0.
# hp_min/hp_max: 物品生成时生命值修正范围, 可选, 默认0.
# mp_min/mp_max: 物品生成时魔法值修正范围, 可选, 默认0.
# luck_min/luck_max: 物品生成时运气修正范围, 可选, 默认0.
# charm_min/charm_max: 物品生成时魅力修正范围, 可选, 默认0.
# avoid_min/avoid_max: 物品生成时闪避修正范围, 可选, 默认0.
# attrib: 元素类型, 可选, 默认0. 0-无, 1-地, 2-水, 3-火, 4-风.
# attribvalue: 元素修正值, 可选, 默认0, 新版范围[0,10]. 原版范围[0,100], 导入时除以10.
# magicid: 装备附带的原版魔法编号, 可选, 默认0. 当前服务端ItemEntry尚未读取.
# magicusemp: 使用附带魔法消耗的MP, 可选, 默认0. 当前服务端ItemEntry尚未读取.
# poison_min/poison_max: 毒状态抗性修正范围, 可选, 默认0.
# paralysis_min/paralysis_max: 麻痹状态抗性修正范围, 可选, 默认0.
# sleep_min/sleep_max: 睡眠状态抗性修正范围, 可选, 默认0.
# stone_min/stone_max: 石化状态抗性修正范围, 可选, 默认0.
# drunk_min/drunk_max: 酒醉状态抗性修正范围, 可选, 默认0.
# confusion_min/confusion_max: 混乱状态抗性修正范围, 可选, 默认0.
# 所有等于默认值的可选字段均不写入具体条目; YAML反序列化后自动取得对应默认值.
# 当前服务端仅加载并校验ItemEntry已定义字段, 尚未接入装备实例随机和现代战斗结算.

