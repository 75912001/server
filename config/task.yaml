          active: >-
            答应我了吗。

            那么，可以先帮我收集加格和邦恩吉吗？

            但是我的宠物栏只剩下2个空位而已，所以请你一次只带两只来给我。

            当然等级要是25的喔，那么就拜托啰。

            任何时候我都会在这个沙漠的附近旅行。
          ready: 我拜托你寻找的加格和邦恩吉你已经抓来了呀，那剩下的只剩克邦凯斯和加克拉，那就拜托你啰。
          completed: >-
            对了，收下这个吧。

            这是你抓到恐龙的证明喔。

            掉落不见的话就没有办法承认你帮过我喔。
        rewardId: 6101
      - id: 2
        name: 收集克邦凯斯和加克拉
        description: "领取火难的戒指后, 捕捉并交付1只25级克邦凯斯和1只25级加克拉, 同时交回戒指."
        navigation:
          mapId: 110203
          label: 进入任务地图
          x: 27
          y: 27
        startConditions:
          - kind: itemPossession
            itemId: 3630347
            quantity: 1
        completionConditions:
          - kind: petPossession
            petId: 4000309
            level: 25
            quantity: 1
          - kind: petPossession
            petId: 4000310
            level: 25
            quantity: 1
          - kind: itemPossession
            itemId: 3630347
            quantity: 1
        completionMode: submit
        consumeItems:
          - itemId: 3630347
            quantity: 1
        consumePets:
          - petId: 4000309
            level: 25
            quantity: 1
          - petId: 4000310
            level: 25
            quantity: 1
