          active: |-
            答应我了吗。
            那么，可以先帮我收集加格和邦恩吉吗？
            但是我的宠物栏只剩下2个空位而已，所以请你一次只带两只来给我。
            当然等级要是25的喔，那么就拜托啰。
            任何时候我都会在这个沙漠的附近旅行。
          ready: "我拜托你寻找的加格和邦恩吉你已经抓来了呀，那剩下的只剩克邦凯斯和加克拉，那就拜托你啰。"
