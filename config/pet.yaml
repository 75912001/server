# 资产ID-宠物 [4000101,4999999]
# 任何修改此文件的行为都需要通知客户端和服务端开发人员

############################################################
# pet 宠物
############################################################
# enemyId: 关联 pet_growth_8_0.csv 中的 enemyId todo menglc 从中获取的数据
# rarity 稀有度: 1-普通, 2-稀有, 3-史诗, 4-传说, 5-神话
# bestiary 图鉴
# elemental 元素属性: earth-土, water-水, fire-火, wind-风 [默认:0] (整数, 范围[0,10], 总和必须等于10) (要么是单元素, 要么是两个元素相邻, 可以首尾相邻)
# attribute 属性: 允许负数
  ## poisonResist - 毒抗性
  ## paralysisResist - 麻痹抗性
  ## sleepResist - 睡眠抗性
  ## stoneResist - 石化抗性
  ## drunkResist - 酒醉抗性
  ## confusionResist - 混乱抗性
  ## critical - 暴击字段
  ## counter - 反击字段
  ## rate - 稀有度字段 (原版本)
  ## get - 基础捕获值 (原版本)
# growth 原始成长配置: 用于生成和升级时的四维成长计算
#   initNum: [配置] 初始系数, 参与初始四维计算.
#   lvupPointSource: [配置] 原始升级成长点字段文本, 例如 4.50.
#   baseVital: [配置] 宠物模板固定基础体力值
#   baseStr: [配置] 宠物模板固定基础腕力/攻击值
#   baseTough: [配置] 宠物模板固定基础耐力/防御值
#   baseDex: [配置] 宠物模板固定基础速度/敏捷值
# panelReference 图鉴面板参考值: 只保存服务端预计算结果, 客户端不得包含或执行成长算法
#   10点平均分配使用四种均衡组合: (2,3,3,2)、(2,2,3,3)、(3,2,2,3)、(3,3,2,2).
#     每种组合分别按正式规则计算并向零截断Raw, 再对四组Raw逐项取算术平均并向零截断, 避免固定偏向某一项属性.
#   level1CommonAverage/level1MythicAverage: 初始Raw统一使用配置initNum和上述平均分配,
#     分别计算普通品阶偏移-2与神话品阶偏移+2的1级面板平均参考值.
#   level140CommonAverage/level140MythicAverage: Rank成长倍率使用对应闭区间的算术平均值,
#     在1级平均Raw基础上累计139次平均升级Raw, 分别计算普通品阶与神话品阶的140级面板平均参考值.
#   growthRateMin/growthRateMax: 分别使用普通品阶、神话品阶的1级与140级平均面板值,
#     按(攻击差+防御差+敏捷差)/139计算总成长上下限, 四舍五入保留3位小数; 总成长不计耐久成长.
#   不再保存独立属性极值或极限参考; 图鉴范围固定表示普通品阶平均值到神话品阶平均值.
#   最终按下方HP/attack/defense/agility公式换算面板整数. server启动时重新计算全部宠物并集中核验;
#     任一配置不一致都会输出宠物ID、名称、实际值和可直接复制的正确YAML, 然后阻止服务启动.
# battleAI 敌方基础动作AI: 仅控制普通攻击、防御和PVE逃跑, 不从skill槽随机选招
#   仅敌方怪物/NPC读取battleAI. 玩家战斗宠物的动作由客户端分别提交, 不读取这些权重
#   attackWeight: 普通攻击相对权重, 整数范围[0,2147483647]. 例如10/1/1表示10:1:1, 不是10%/1%/1%
#   defenseWeight: 防御相对权重, 整数范围[0,2147483647]. 防御是基础动作, 不要求skill中存在8000002
#   escapeWeight: PVE逃跑相对权重, 整数范围[0,2147483647]. 逃跑是基础动作, 不是宠物技能
#   三项权重总和范围[0,2147483647]. 总和为0时服务端直接选择防御
#   targetScope仅在本次权重选中普通攻击时生效, 可选值及精确范围:
#     allOpponents: 所有仍存活且未逃跑的敌对角色和宠物
#     playerCharacters: 所有仍存活且未逃跑的敌对玩家角色, 不包含玩家宠物
#     playerPets: 所有仍存活且未逃跑的敌对玩家宠物, 不包含角色
#     partyLeader: position最小的存活玩家角色视为当前队长并必定加入候选;
#       其他每个存活单位分别执行RAND(0,2), 结果0时也加入候选
#   playerCharacters/playerPets/partyLeader本轮没有候选时, 按8.5回退allOpponents重新收集
#   targetSelection在targetScope候选中选择最终目标, 可选值及规则:
#     random: 使用本场确定性随机流等概率选择
#     highestHp/lowestHp: 按当前战斗HP选择最高/最低者
#     highestAttack: 按原始四维腕力CHAR_STR选择最高者, 不读取技能修正后的战斗攻击
#     highestAgility/lowestAgility: 按原始四维速度CHAR_DEX选择最高/最低者, 不读取FIX敏捷
#     elementalSubdue: 按8.5 GetSubdueAttribute决策树取得克制目标元素, 再选择该元素值最高者
#   非random策略必须配置targetRandomRollMax, 精确对应8.5 rn:
#     先执行RAND(0,targetRandomRollMax), 结果0时再随机选择候选, 其余结果使用上述最优目标
#     1表示50%随机/50%最优; 0表示每次随机, 但仍先执行一次RAND(0,0)再执行候选随机
#   random策略直接随机一次, 不读取targetRandomRollMax, 因此禁止配置这个无效字段
#   非random方式出现并列时保留position最小的首个候选. allOpponents也没有目标时本回合退化为防御
#   权重使用8.0 enemy1.txt的at/gu/es数据, 按8.5 battle_ai.c语义映射; targetScope和targetSelection分别对应at的第2和第3个参数
# habitat: 栖息地
# level1Spawn: 1级出生地
# description: 描述

# 1 级宠物生成伪代码:
# 解析成长字段:
#   init_factor = float(initNum)
#   lvup_point = float(lvupPointSource)
#
# 宠物个体自己的成长基础四维:
#   输入 Common 到 Mythic 时, 四维使用同一个品阶偏移: Common=-2, Rare=-1, Epic=0, Legendary=1, Mythic=2
#   输入 Unknow 时, 四维分别独立等概率随机整数偏移[-2,2], 再按总偏移确定实际品阶并保存:
#     Common=-8~0(56.80%), Rare=1~2(23.68%), Epic=3~4(13.92%), Legendary=5~6(4.80%), Mythic=7~8(0.80%)
#   saved_base_vital = baseVital + vital_offset
#   saved_base_str = baseStr + str_offset
#   saved_base_tough = baseTough + tough_offset
#   saved_base_dex = baseDex + dex_offset

# 再随机分配 10 点到四维, 只影响初始 raw 属性:
#   final_base_vital = saved_base_vital
#   final_base_str = saved_base_str
#   final_base_tough = saved_base_tough
#   final_base_dex = saved_base_dex
#   repeat 10 times:
#       target = random(vital, str, tough, dex)
#       if target == vital: final_base_vital += 1
#       if target == str: final_base_str += 1
#       if target == tough: final_base_tough += 1
#       if target == dex: final_base_dex += 1
#
# 计算初始 raw 四维:
#   raw_vital = int(init_factor * final_base_vital)
#   raw_str = int(init_factor * final_base_str)
#   raw_tough = int(init_factor * final_base_tough)
#   raw_dex = int(init_factor * final_base_dex)
#
# 生成真实宠物实例时, 运行方必须保存实例字段:
#   asset_id: 宠物配置 ID, 用于后续重新取得 PetGrowthEntry 等模板配置
#   grade
#   saved_base_vital, saved_base_str, saved_base_tough, saved_base_dex
#   初始 raw 四维
#       raw_vital, raw_str, raw_tough, raw_dex

# 面板换算公式:
# [推导] HP = int((raw_vital * 4 + raw_str + raw_tough + raw_dex) * 0.01)
# [推导] attack = int(raw_str * 0.01 + raw_tough * 0.001 + raw_vital * 0.001 + raw_dex * 0.0005)
# [推导] defense = int(raw_tough * 0.01 + raw_str * 0.001 + raw_vital * 0.001 + raw_dex * 0.0005)
# [推导] agility = int(raw_dex * 0.01)
############################################################
# 宠物升级伪代码:
# Rank 是服务端加载 pet.yaml 时生成的配置派生数据, 不写入 PetRecord, 客户端也不参与计算:
#   base_sum = baseVital + baseStr + baseTough + baseDex
#   if base_sum >= 100: rank = 0
#   elif base_sum >= 95: rank = 1
#   elif base_sum >= 90: rank = 2
#   elif base_sum >= 85: rank = 3
#   elif base_sum >= 80: rank = 4
#   else: rank = 5
#   PetGrowthEntry.Rank = rank
# 后续升级通过 PetRecord.asset_id 取得宠物配置, 直接使用 PetGrowthEntry.Rank, 不重复推导.
#
# 生成本次升级随机点:
#   add_vital = 0
#   add_str = 0
#   add_tough = 0
#   add_dex = 0
#   repeat 10 times:
#       target = random(vital, str, tough, dex)
#       if target == vital: add_vital += 1
#       if target == str: add_str += 1
#       if target == tough: add_tough += 1
#       if target == dex: add_dex += 1
#
# 根据 rank 选择成长系数范围:
#   rank_ranges = {
#       0: [4.50, 5.00],
#       1: [4.70, 5.20],
#       2: [4.90, 5.40],
#       3: [5.10, 5.60],
#       4: [5.30, 5.80],
#       5: [5.50, 6.00],
#   }
#   rank_rand = random(rank_ranges[rank].min, rank_ranges[rank].max)
#
# 写回升级后的 raw 四维:
#   raw_vital += int((saved_base_vital + add_vital) * rank_rand)
#   raw_str += int((saved_base_str + add_str) * rank_rand)
#   raw_tough += int((saved_base_tough + add_tough) * rank_rand)
#   raw_dex += int((saved_base_dex + add_dex) * rank_rand)
#
# 最后重新执行面板换算公式, 得到新的 HP/攻击/防御/敏捷.
