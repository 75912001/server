# 资产ID-宠物 [4000101,4999999]
# 任何修改此文件的行为都需要通知客户端和服务端开发人员

############################################################
# pet 宠物
############################################################
# enemyId: 仅记录8.0 enemy1.txt来源ID, 当前运行时不读取; 宠物外观身份使用id.
# rarity 稀有度: 1-普通, 2-稀有, 3-史诗, 4-传说, 5-神话
# creationMode 创建模式: 省略表示普通宠物; fusionEgg 表示原版融合蛋, 禁止使用普通宠物创建入口
# testStatus 编辑器测试状态: 0=未测试(省略), 1=通过, 2=未通过; 客户端和服务端运行时均忽略
# bestiary 图鉴: 声明后进入宠物图鉴; 普通宠物无独立图鉴资源时使用默认帧300859, 战斗专用模板可省略
# growthAttributeId 默认成长属性: 必须引用growth.attribute.yaml中的已发布条目.
#   普通创建、奖励创建和图鉴使用该默认值; 已存在宠物始终使用PetRecord中冻结的growth_attribute_id.
#   元素、固有属性、成长参数和panelReference全部由成长属性表维护, 本表禁止内联这些字段.
# skill 出生技能: 新宠物按此固定7槽初始化, 0表示空槽; 敌人战斗技能由enemy.group.yaml引用的AI决定.

# 1 级宠物生成伪代码:
# 按PetRecord.growth_attribute_id从growth.attribute.yaml解析成长字段:
#   init_factor = float(initNum)
#   lvup_point = float(lvupPointSource)
#
# 宠物个体自己的成长基础四维:
#   输入 Common 到 Mythic 时, 四维使用同一个品阶偏移: Common=-2, Rare=-1, Epic=0, Legendary=1, Mythic=2
#   输入 Unknow 时, 四维分别独立等概率随机整数偏移[-2,2], 再按总偏移确定实际品阶并保存:
#     Common=-8~0(56.80%), Rare=1~2(23.68%), Epic=3~4(13.92%), Legendary=5~6(4.80%), Mythic=7~8(0.80%)
#   saved_base_vital = baseVital + vital_offset
#   saved_base_str = baseStr + str_offset
#   saved_base_tough = baseTough + tough_offset
#   saved_base_dex = baseDex + dex_offset

# 再随机分配 10 点到四维, 只影响初始 raw 属性:
#   final_base_vital = saved_base_vital
#   final_base_str = saved_base_str
#   final_base_tough = saved_base_tough
#   final_base_dex = saved_base_dex
#   repeat 10 times:
#       target = random(vital, str, tough, dex)
#       if target == vital: final_base_vital += 1
#       if target == str: final_base_str += 1
#       if target == tough: final_base_tough += 1
#       if target == dex: final_base_dex += 1
#
# 计算初始 raw 四维:
#   raw_vital = int(init_factor * final_base_vital)
#   raw_str = int(init_factor * final_base_str)
#   raw_tough = int(init_factor * final_base_tough)
#   raw_dex = int(init_factor * final_base_dex)
#
# 生成真实宠物实例时, 运行方必须保存实例字段:
#   asset_id: 宠物外观配置ID; growth_attribute_id: 冻结的成长属性ID, 用于后续取得PetGrowthEntry
#   grade
#   saved_base_vital, saved_base_str, saved_base_tough, saved_base_dex
#   初始 raw 四维
#       raw_vital, raw_str, raw_tough, raw_dex

# 面板换算公式:
# [推导] HP = int((raw_vital * 4 + raw_str + raw_tough + raw_dex) * 0.01)
# [推导] attack = int(raw_str * 0.01 + raw_tough * 0.001 + raw_vital * 0.001 + raw_dex * 0.0005)
# [推导] defense = int(raw_tough * 0.01 + raw_str * 0.001 + raw_vital * 0.001 + raw_dex * 0.0005)
# [推导] agility = int(raw_dex * 0.01)
############################################################
# 宠物升级伪代码:
# Rank 是服务端加载growth.attribute.yaml时生成的配置派生数据, 不写入PetRecord, 客户端也不参与计算:
#   base_sum = baseVital + baseStr + baseTough + baseDex
#   if base_sum >= 100: rank = 0
#   elif base_sum >= 95: rank = 1
#   elif base_sum >= 90: rank = 2
#   elif base_sum >= 85: rank = 3
#   elif base_sum >= 80: rank = 4
#   else: rank = 5
#   PetGrowthEntry.Rank = rank
# 后续升级通过PetRecord.growth_attribute_id取得成长属性, 直接使用PetGrowthEntry.Rank, 不回退到宠物默认引用.
#
# 生成本次升级随机点:
#   add_vital = 0
#   add_str = 0
#   add_tough = 0
#   add_dex = 0
#   repeat 10 times:
#       target = random(vital, str, tough, dex)
#       if target == vital: add_vital += 1
#       if target == str: add_str += 1
#       if target == tough: add_tough += 1
#       if target == dex: add_dex += 1
#
# 根据 rank 选择成长系数范围:
#   rank_ranges = {
#       0: [4.50, 5.00],
#       1: [4.70, 5.20],
#       2: [4.90, 5.40],
#       3: [5.10, 5.60],
#       4: [5.30, 5.80],
#       5: [5.50, 6.00],
#   }
#   rank_rand = random(rank_ranges[rank].min, rank_ranges[rank].max)
#
# 写回升级后的 raw 四维:
#   raw_vital += int((saved_base_vital + add_vital) * rank_rand)
#   raw_str += int((saved_base_str + add_str) * rank_rand)
#   raw_tough += int((saved_base_tough + add_tough) * rank_rand)
#   raw_dex += int((saved_base_dex + add_dex) * rank_rand)
#
# 最后重新执行面板换算公式, 得到新的 HP/攻击/防御/敏捷.
