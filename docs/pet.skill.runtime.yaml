  # 覆盖为FIXSTR约80%. 本条没有连续“防%”字段, 所以不得把防御覆盖成
  # FIXTOUGH的100%: 提交前已经存在的当前防御工作值必须原样保留.
  #
  # target=7只排除当前宠物所属角色组合, 其余存活单位都能作为本次物理攻击
  # 锚点. COM:攻击表示宠物轮到行动时继续执行该攻击; 守护关系不等待宠物
  # 出手, 即使其动作稍后被状态取消也已经登记. 受击时先对原目标完成Dodge,
  # 再动态检查守护宠物是否存活、是否仍有Guardian标记以及Sleep、混乱、
  # 麻痹、石化、Barrier、Dizzy、Dragnet等禁止守护状态.
  #
  # 当前服务器按8.5各调用路径的实际结果区分真正伤害转移和仅借守护者属性
  # 计算的旧历史行为. 客户端专用BCF_GUARDIAN动画暂不处理, 真正转移时用
  # 标准Damage表达; 不生成Wait. 投掷武器绕过、敌方特殊技能AI、
  # 骑乘拆分和全部PVP继续明确标记为待开发. pet.yaml由用户维护, 本批不改.
  - id: 9000242
    name: 忠犬
    description: 保护主人不受到敌人的直接攻击
    guardian:
      attackPercentModifier: -20
    cost: 2500

  # 8.5技能21“T忠犬”与20号共用同一个Guardian处理器. 原始option为
  # `攻%-10 防%+40 COM:攻击`; 唯一行为差异由服务器参数表达: 攻击工作值
  # 约为FIXSTR的90%, 防御工作值约为FIXTOUGH的140%. 提交、目标边界、
  # 守护判定、伤害去向及当前待开发范围均与9000242相同.
  - id: 9000243
    name: T忠犬
    description: 保护主人 攻击下降10%防御上升40%
    guardian:
      attackPercentModifier: -10
      defensePercentModifier: 40
    cost: 2500

  # 8.5技能22“T忠犬2”仍只提供另一组Guardian参数. 原始option为
  # `攻%+50 防%+100 COM:攻击`, 所以提交阶段分别得到约150%攻击和
  # 200%防御. 技能ID、名称、说明和倍率独立, 底层不复制一套结算逻辑.
  - id: 9000244
    name: T忠犬2
    description: 保护主人 攻击上升50%防御上升100%
    guardian:
      attackPercentModifier: 50
      defensePercentModifier: 100
    cost: 2500
