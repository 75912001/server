  #
  #   WORKATTACKPOWER = FIXSTR + int(float32(FIXSTR) * (float32(200)/float32(100)))
  #   WORKDEFENCEPOWER = FIXTOUGH + int(float32(FIXTOUGH) * (float32(-90)/float32(100)))
