  # 9000211必须继续复用同一个SetMagicPet处理器, 不允许在Go执行层增加
  # `skillID == 9000211`的专用分支. 配置节点由SetMagicPet自己的check()
  # 校验effect、remainingActions、power和targetScope; 客户端只提交己方
  # 锚点, 不能提交或覆盖60%、4次行动或整营范围.
  #
  # target=2由BATTLE_MultiList扩展为施术者阵营全部存活、未离场单位.
  # 现代livingCombatStatesInCamp按position升序生成等价目标顺序. 每个目标
  # 分别检查Duck、STR、TGH和DEX四个旧工作槽; 任一槽已有正数就只跳过该
  # 目标, 不覆盖、不叠加、不刷新, 同营其他空槽目标仍可获得4/60/DEX.
  # 死亡或离场单位不进入目标列表, 施放属性分支全程不消费随机数.
