  #
  # PETSKILL_Hector提交函数只搜索`攻%`和`敏%`, 没有解析开头的`罗`,
  # 也没有解析`turn 3`. 两项工作值都按C float计算:
  #
  #   WORKATTACKPOWER = FIXSTR + int(float32(FIXSTR) * float32(70/100))
  #   WORKQUICK = FIXDEX + int(float32(FIXDEX) * float32(35/100))
  #
  # 因此基础100得到170攻击和135敏捷; 基础16777219分别得到28521273
  # 和22649246, 防御保持不变. 敏捷修正立即参与本回合default行动值,
  # 整个技能只消费一次行动值随机, 下一回合重新从开战FIX值生成工作属性.
  #
  # 旧执行器没有按技能ID或保存的技能数组读取状态参数, 而是在
  # BATTLE_COM_S_HECTOR分支固定调用
