  # Other_DefcharWorkInt才读取该槽. 旧DEX分支错误地沿用FIXTOUGH作为增量
  # 基数, 必须复刻为C int表达式`FIXDEX + FIXTOUGH*60/100`. 例如敏捷101、
  # 防御99得到160; 若错误采用说明70会得到170. 乘法和除法都保持整数顺序
  # 及向零截断, 不能改成DEX自身百分比或浮点四舍五入.
  #
  # 槽位归零的那次行动仍使用本回合PreCommand已生成的FIXDEX; 到期只返回
