  # 8.5技能1093“撕裂伤口9”继续使用PETSKILL_BattleTearDamage. 原始技能表
  # 明确保存option `400`、field=1、target=1、use_type=2、学习价格10000,
  # 说明是“撕裂旧伤口 增加400%伤害”. 现代9000216只向现有TearDamage
  # 处理器提供缺失生命400%的参数, 不增加技能ID分支, 也不复制撕裂伤口1至8
  # 和撕夜已经共用的攻击、命中、旧伤追加及事件逻辑.
  #
  # missingHpPercent必须由TearDamage自己的check()在配置加载期校验: 字段必填,
  # 范围1至450. 450是8.5完整技能表中该处理器的最大有效option; 400只是本技能
  # 的服务器配置值. CombatSkillAction只携带一个敌方存活目标, 协议中没有旧伤
  # 比例字段, 解析层从已加载配置复制400到本回合动作快照.
  #
  # 技能提交后立刻以施术者FIXSTR和FIXTOUGH为基数, 分别按C double语义写入本
  # 回合90%攻击与80%防御工作值; 敏捷不变. 这两个覆盖在施术者行动前已经生效,
  # 因而同回合更快单位攻击施术者时也必须读取降低后的防御. 每回合结束恢复基础
  # 工作值, 不跨回合残留, 也不因1093的400参数改变行动值随机序列.
  #
  # 执行时仅对请求目标运行一次完整AttackSeq. 只有结果不是DODGE且没有进入旧服
  # 受击反应分支时才计算旧伤: 先求目标maxHP-currentHP, 将C int缺血量转换为
  # C float, 再乘`400/100`的C float并向零截断, 最后追加到基础伤害. 例如缺血
  # 16777219会先舍入为float32的16777220, 乘4后得到67108880, 加基础伤害7
  # 得到67108887; 使用整数百分比或float64会偏离8.5的大整数结果.
  #
  # 旧源码还有两个容易误改的结果: 目标满血时userhp为0, 会把整个AttackSeq
  # 伤害覆盖为0, 不是仅追加0; 基础AttackSeq为MISS0但目标已经受伤时仍会追加
  # 400%缺血伤害, 同时保留原命中结果标记. DODGE则完全跳过旧伤追加和扣血.
  # 旧伤计算本身不抽随机数, 不能改变AttackSeq既有命中、伤害和会心抽取顺序.
  #
  # TearDamage是独立宠物技能命令, 不提升为普通ATTACK, 不参加合击, 施术者与
  # 目标都不进入反击资格链. 正常结算只返回真实skill_id=9000216、1/1段号和
  # 标准Damage、Miss、Dodge、Critical; 没有执行的动作不生成Action
  # 或占位事件, 协议也没有Wait事件类型.
  #
  # 当前pet.yaml没有1093或9000216技能槽. 8.0导出中出现的1093位于“柏克尔”
  # 的enemyId列, 该行技能槽仍是基础技能1/2, 不能据此授予撕裂伤口9. 因而本轮
  # 不创建宠物、不猜测现代主体ID, 也不覆盖用户已经整理好的pet.yaml. 骑乘目标
  # 额外合并骑宠缺血、旧受击反应、专用客户端表现、敌方特殊技能AI和全部PVP
  # 继续标记为待开发.
  - id: 9000216
    name: 撕裂伤口9
    description: 撕裂旧伤口 增加400%伤害
    tearDamage:
      missingHpPercent: 400
    cost: 10000

