  # 8.5技能1073“撕裂伤口6”继续使用PETSKILL_BattleTearDamage. 原始
  # 数据为option `200`、target=1、use_type=2、cost=10000. 处理器没有
  # 技能ID或名称特判, 所以本技能只新增missingHpPercent 200参数实例,
  # 与撕裂伤口1至5和1056“撕夜”共用同一套提交及单段伤害代码.
  #
  # PETSKILL_BattleTearDamage在提交动作时固定把WORKATTACKPOWER覆盖为
  # FIXSTR*0.9, 把WORKDEFENCEPOWER覆盖为FIXTOUGH*0.8. 两个表达式使用
  # C double后写回int并向零截断; 基础16777219分别得到15099497和
  # 13421775. option只控制旧伤比例, 不能覆盖这两个固定倍率. 敏捷不变,
  # 本技能继续使用default行动值并恰好消费一次排序随机.
  #
  # 执行阶段先通过TargetAdjust取得一个有效敌方目标, 再调用一次完整
  # BATTLE_AttackSeq. 返回DODGE时直接跳过撕裂追加; 其他返回类型先计算
  # `targetMaxHP-targetCurrentHP`, 再以C float乘200%并向零截断, 最后
  # 加到AttackSeq基础伤害. 缺血16777219会先舍入为float32 16777220,
  # 乘2后追加33554440; 基础伤害7时最终得到33554447.
  #
  # 满血目标的缺血为0, 旧函数会把整次最终伤害强制改为0, 即使AttackSeq
  # 原本已经造成正伤害. 相反, AttackSeq返回MISS且基础伤害为0时, 只要
  # 目标已有旧伤, 仍会追加200%缺血伤害并保留原MISS表现. 追加计算本身
  # 不消费随机数, 也不再执行元素、暴击或Guard缩放.
  #
  # 防守方存在光镜守、吸收、反射、针刺等BATTLE_GetDamageReact结果时,
