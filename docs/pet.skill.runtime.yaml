  # 8.5技能1087“转转菊花爆-改2”继续使用PETSKILL_Hector. 原始记录为
  # option `晕 turn 2 攻%100 敏%100`、target=1、use_type=2、学习价格5000;
  # 说明写“攻击力提高100% 敏捷上升100% 有60%的机率使对手麻痹两回合”.
  # 现代9000210只新增独立ID、名称、说明和+100/+100参数, 与其他Hector
  # 技能共用同一个提交及战斗处理器, 不增加按技能ID判断的执行分支.
  #
  # PETSKILL_Hector只用strstr搜索连续文本`攻%`和`敏%`, 再分别从其后
  # sscanf一个C float. `晕`和`turn 2`没有任何读取代码, 不能成为现代状态
  # 类型或持续次数配置. 两个100分别按以下旧顺序写入本回合工作值:
  #
  #   WORKATTACKPOWER = FIXSTR + int(float32(FIXSTR) * float32(100/100))
  #   WORKQUICK       = FIXDEX + int(float32(FIXDEX) * float32(100/100))
  #
  # 因此基础100得到200攻击和200敏捷; 基础16777219先舍入为float32的
  # 16777220, 再与原int相加得到33554439. 防御不变. 攻击修正用于本技能
  # 物理伤害和后续反击, 敏捷修正立即进入本回合default行动值; 敌方AI的
  # highestAttack/highestAgility仍读取原始CHAR_STR/CHAR_DEX, 不读取这两项
  # 工作值. 整个技能仍只消费一次行动值随机, 下一回合从FIX基础值重新生成.
  #
  # BATTLE_COM_S_HECTOR完全不读取技能数组中的“晕”或turn. 它固定调用
  # `PROFESSION_BATTLE_StatusAttackCheck(attacker, target, 2, 60)`, 成功后
  # 固定把StatusTbl[2]写为1. 状态2是Paralysis“麻痹”; 判断严格使用
  # `RAND(1,100) < 60`, 所以只有1至59成功, 实际为59%, 不是说明表面上的
  # 60%. 成功也只取消目标下一次真实行动, 不是两回合或两次行动.
  #
  # 状态函数先消费RAND, 再检查目标死亡、ISDIE和全部普通状态互斥槽.
  # 因而仍在Entry中的死亡目标和已有状态目标都会占用一次状态随机, 但不写
  # 麻痹; 已离场导致Entry不存在时整次Hector直接停止且零抽数. 状态步骤后
  # case继续贯穿通用普通物理攻击: 死亡原目标可经TargetAdjust改选, 随后执行
  # 完整AttackSeq、伤害和目标反击入口. 技能不参加执行前合击, 但开始攻击后
  # 命令提升为ATTACK, 施术者可成为后续普通反击者.
  #
  # 当前返回真实skill_id=9000210的标准Status、Action、Damage,
  # 不生成Wait. Hector专用客户端动作、忠诚不服从、骑乘、忠犬/守护、
  # 光镜守、其他未接入受击反应、敌方特殊技能AI和PVP继续待开发.
  #
  # 8.0导出中只有enemyId 21216、templateId 21215、形象103121的“凤姬”
  # 明确在第二技能槽配置1087. “沙瓦克”行首的1087是templateId, 不是
  # 技能归属. 当前pet.yaml没有该凤姬主体、21216/21215、103121、1087或
  # 9000210, 因而本轮不创建宠物、不猜测现代资产ID, 也不覆盖用户已经
  # 整理好的技能槽.
  - id: 9000210
    name: 转转菊花爆-改2
    description: 攻击力提高100% 敏捷上升100% 有60%的机率使对手麻痹两回合
    hector:
      attackPercentModifier: 100
      agilityPercentModifier: 100
    cost: 5000

  # 8.5技能1088“风之吹熄-改”继续使用PETSKILL_SetMagicPet. 原始记录的
