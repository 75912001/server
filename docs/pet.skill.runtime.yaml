  # 状态2是Paralysis“麻痹”, 不是状态14 Dragnet“天罗地网”; 比较严格
  # 使用`RAND(1,100) < 60`, 只有1至59成功, 成功固定写计数1. 所以原
  # 说明“60%的机率网住三回合”和option `罗 turn 3`都不会改变服务器
  # 可执行结果, 不能据此把现代技能实现成Dragnet或持续3次行动.
  #
  # 状态判定发生在TargetAdjust和普通物理攻击之前. 原目标有效时即使已经
  # 死亡也消费该状态随机, 但状态检查拒绝死亡目标; 原Entry离场则静默停止.
  # 随后执行一次完整普通AttackSeq和目标反击入口. 技能不参加执行前合击,
  # 开始攻击后提升为ATTACK, 因而施术者之后也具有普通反击资格.
