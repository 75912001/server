  # 8.5技能824的“-攻%50”是把工作攻击直接覆盖成FIXSTR的50%, 不是
  # 普通的-50%增量修正. “+敏%100”把工作敏捷提高到FIXDEX的200%.
  # 正伤害后仍严格消费一次rand()%100; 当前PVE敌人不是对方玩家宠物,
  # 因而成功判定不会把怪物错误移出战场. PVP宠物回栏保持待开发.
  - id: 9000148
    name: 男人恐吓
    description: 野蛮男人使用时攻下降50% 敏上升100% 使敌方宠物受到恐吓回到宠物栏
    timid:
      attackPowerPercent: 50
      agilityPercentModifier: 100
      returnPetPercent: 100
    cost: 10000
  # 8.5技能825至828使用PETSKILL_Modifyattack, 与697至700的
  # PETSKILL_Mdfyattack不是同一处理器. 四个技能都先完成普通物理伤害,
  # 再按目标对应原始元素及basePercent放大; 不覆盖攻击者本身的元素.
  #
  # 旧option第二段都是9999, 结算时先除以100得到99.99倍追加比例.
  # 目标元素随机项还保留8.5的C整数除法异常, 由战斗处理器统一执行.
  - id: 9000149
    name: 地属性强化攻击
    description: 对地属性强化99999%攻击
    modifyAttack:
      element: earth
      basePercent: 9999
    cost: 2000
  - id: 9000150
    name: 水属性强化攻击
    description: 对水属性强化99999%攻击
    modifyAttack:
      element: water
      basePercent: 9999
    cost: 2000
  - id: 9000151
    name: 火属性强化攻击
    description: 对火属性强化99999%攻击
    modifyAttack:
      element: fire
      basePercent: 9999
    cost: 2000
  - id: 9000152
    name: 风属性强化攻击
