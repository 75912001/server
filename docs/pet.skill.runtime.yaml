      element: wind
      basePercent: 9999
    cost: 2000
  # 8.5技能1030、1031和1033继续调用既有PETSKILL_BattleModel. type的bit 0
  # 决定对象不足时是否继续覆盖余下目标, bit 2只决定忠犬和受击反应是否
  # 按物理路径处理; 两种类型都会对每个对象执行完整的普通伤害公式.
  #
  # 群龙暴乱的麻痹仍保留8.5特例: option中的30会被解析, 但实际阈值固定为
  # 20-抗麻. 玄武火炮的晕眩没有该特例, baseSuccess 35真实进入普通状态公式.
  # 旧客户端对象图片编号属于表现资源, 当前只下发标准Action、Damage和Status.
  - id: 9000153
    name: 群龙暴乱
