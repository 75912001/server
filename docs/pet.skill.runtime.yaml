  # 8.5技能1090“栗子连激-改”继续使用PETSKILL_AttackShoot. 原始记录为
  # option `10|10`、target=1、use_type=2、学习价格20000, 说明是“乱数
  # 连续投掷栗子10颗”. 现代9000213只新增固定10至10段的参数实例, 与
  # 614号栗子连激9000013的8至10段、647号栗子连激改9000046的6至8段
  # 共用同一个AttackShoot处理器; 不允许增加技能ID专用结算分支.
  #
  # 客户端只提交一个敌方存活锚点. minSegmentCount和maxSegmentCount由
  # AttackShoot自己的check()在加载期校验为1至60且max>=min, 客户端不能
  # 提交或覆盖段数. 虽然本技能上下界相同, 旧PETSKILL_AttackShoot仍先执行
  # 一次RAND(10,10)并得到10; 这次随机必须保留, 不能把固定10段优化成零抽数.
  #
  # 基础段数抽取后读取CHAR_WORKFIXAI. 忠诚低于100时直接保留10段, 不再
  # 消费忠诚随机. 忠诚达到100时先执行RAND(1,300)>299; 只有未命中且
  # 当前绝对HP<20时才继续执行RAND(1,50)>49. 任一判定命中都把段数覆盖
  # 为8. HP条件是绝对值而不是生命百分比, 两个条件抽取不能交换或合并.
  #
  # 实际动作开始时,BATTLE_TargetListSet在任何伤害前按最终计划段数预抽全部
  # 目标. 候选按敌方阵营position 0至8升序扫描, 历史`i < deftop`错误会排除
  # position 9; 每段执行RAND(0,candidateCount-1), 允许重复, 单候选也抽
  # RAND(0,0). aDefList[0]虽然完成抽取, 但通用攻击循环首段仍使用客户端原
  # 锚点, 所以第0次目标抽取只推进随机序列; 第2至10段才读取预抽项1至9.
  # 预抽目标在轮到该段前死亡时再走普通TargetAdjust, 该后备改选允许position 9.
  #
  # 每段独立执行完整AttackSeq的闪避、会心、Guard、伤害和受击链, 随后按
  # 计划总段数写入的gDamageDiv分摊正伤害. damage是C int、gDamageDiv是
  # C float, 因而必须按float32执行`damage/10`后向零截断; 分摊后的正数
  # 最低为1, 原伤害0保持MISS. 不能改成Go整数除法或float64.
  #
  # 每个分摊后的正伤害段先按普通受伤规则唤醒目标已有Sleep, 再执行
  # RAND(1,5)>4的20%判定. 命中直接写Sleep 3并把目标本回合命令清为NONE;
  # 后续栗子再次命中可以先唤醒再重新判定, 但被清除的原命令不会恢复.
  # ATTSHOOT不会提升成普通ATTACK, 技能使用者和目标都不得因本动作进入反击,
  # 整个技能也不参加普通合击. 每个真正执行的段返回真实skill_id=9000213、
  # 连续1/10至10/10段号和标准Damage/Miss/Dodge/Critical/Status;
  # 未执行动作不生成占位事件, 协议中也不存在Wait事件.
  #
  # 旧8.0导出中enemyId/templateId均为21049、形象131036的“VIP翡尔翠斯”
  # 第六技能槽明确包含1090. 当前pet.yaml没有该主体、21049、131036、1090
  # 或9000213, 因而本轮不创建宠物、不猜测现代资产ID, 也不覆盖用户已经
  # 整理好的技能槽. 旧栗子飞行动画、骑乘、忠犬/守护、光镜守、其他受击
  # 反应、敌方特殊技能AI和全部PVP继续待开发.
  - id: 9000213
    name: 栗子连激-改
    description: 乱数连续投掷栗子10颗
    attackShoot:
      minSegmentCount: 10
      maxSegmentCount: 10
    cost: 20000

