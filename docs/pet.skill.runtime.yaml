  # 已实现的针刺会把目标奇数伤害补成偶数并被消耗, 但BattleModel标记
  # 按8.5抑制对施术者的针刺反伤. 忠犬、光镜守和其他尚未接入的受击
  # 反应继续标记待开发, 不能为了绕过它们把physicalDamage改成false.
