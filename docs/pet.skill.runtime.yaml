  # 实际对象只返回真实技能ID及标准Action、Damage、Status.
  # 本技能使用default行动值, 不参加合击、不提升为ATTACK, 也不进入双方
  # 反击链. 骑乘、忠犬/守护、光镜守、其他受击反应、敌方特殊技能AI、
