  # target=2先由BATTLE_MultiList扩展为施术者阵营全部存活、未离场单位,
  # 当前处理器按战斗position升序获得同一目标顺序. 每个实际目标分别执行
  # 一次`RAND(1500*0.9, 1500*1.1)`, 即保留C double边界参与scaled映射后
  # 再赋给C int并向零截断. 固定种子93的首个PCG32值映射为上界1650.
  # 不能先抽一次再让整营共享, 也不能因为上下界是整数就改成其他随机接口.
  #
  # 满HP目标仍进入循环并消费一次回复随机, 随后权威HP保持最大值; 死亡或
  # 已离场单位不进入目标列表, 不消费回复随机. 非满血目标先获得完整随机
  # 威力, 再把权威HP钳制到最大值. 当前标准Heal效果只返回实际HP增量,
  # 客户端专用旧BD潜在回复数值表现不参与本轮服务器逻辑验收.
  #
  # 当前8.5 version.h启用_MAGIC_REHPAI. 无骑乘目标不再乘GetRecoveryRate;
  # 骑乘时旧服会把同一随机总回复按人物和骑宠缺失HP比例拆分, 当前PVE没有
  # 可达骑乘运行态, 该分支继续明确待开发, 不能用非骑乘结果假装完成.
  #
