  # 从第一个对象开始复用并按position确定性覆盖剩余目标, 该分支不抽目标
  # 选择随机. 敌方少于三个时, 前面的对象先按position各攻击一个目标,
  # 剩余对象各自在前一对象完成完整AttackSeq和状态判定后, 从动作开始时
  # 的存活目标快照执行`RAND(0,targetCount-1)`并允许重复. 抽中已死亡或
  # 离场的快照目标时, 当前对象静默跳过且不重新抽取.
  #
  # type 3没有开启bit 2, 所以`physicalDamage=false`只关闭忠犬、针刺和
  # 光镜守等普通物理受击反应入口, 不会关闭AttackSeq、物理伤害、Guard
  # 或状态判定. 当前服务器已实现的针刺在本技能命中时必须保持武装状态,
  # 不能补偶、不能被消耗, 也不能反伤施术者. 忠犬、光镜守和其他尚未接入
  # 的受击反应继续作为待开发边界, 不为它们复制新的技能处理器.
  #
  # 提交阶段按C float执行FIXSTR+int(float32(FIXSTR)*float32(-1/100)).
  # 基础攻击16777219固定得到16609447, 防御和敏捷不变. 每个对象只有在
  # 正伤害且目标存活时才先解除旧Sleep, 再检查普通状态互斥, 并以基础45
  # 进入等级差、幸运、眩晕抗性和体力占比公式. 同等级、目标原始四维各25、
  # 双方幸运和抗性为0时, 体力占比惩罚10使严格命中阈值为35.
  #
  # 首对象命中写Dizzy 1后, 后续对象因普通状态互斥不重复抽取或覆盖.
  # Dizzy命中瞬间保留目标当前命令及Guard/NoGuard, 到目标下一次真实行动
