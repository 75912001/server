  # 基础攻击100得到300; 16777219先舍入为float32的16777220, 两倍增量
  # 为33554440, 加回原始int基数后得到50331659. 不能改成整数公式50331657.
  #
  # `防+50%`在“防”和“%”之间插入“+”, 无法匹配连续`防%`, 因而
  # 8.5服务器不会增加施术者防御. option没有敏捷修正, 防御和敏捷都保持
  # 本回合原工作值; 技能继续使用default行动值并只消费一次排序随机.
  # `useBaseDefensePower=true`表示每个受击目标的公式防御最终使用目标
