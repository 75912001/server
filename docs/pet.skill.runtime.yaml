  # 8.5技能1033“雷斯特分身”的option是`5|5|障|3|25|攻%-1|110150`.
  # type=5同时开启全目标覆盖bit 0和物理受击bit 2, 五个分身对象仍各自
  # 执行完整AttackSeq. “障”对应BATTLE_ST_BARRIER=9, 基础成功值25进入
  # 等级、幸运、Barrier抗性和体力占比公式, 不是固定25%成功率.
  #
  # BattleModel直接把turn=3写入Barrier工作槽. 8.5状态循环每次先3->2,
  # 随后只要Barrier仍大于0就加回1, 因而实际保持3->2->3且不会自然到期,
  # 只能由净化或战斗结束清除. 图片110150属于冻结的客户端专用表现.
  - id: 9000156
    name: 雷斯特分身
    description: 雷斯特的分身术 使敌人魔障3回合
    battleModel:
      objectCount: 5
      coverAllTargets: true
      physicalDamage: true
      status:
        statusId: 9
        remainingActions: 3
        baseSuccess: 25
      attackPercentModifier: -1
    cost: 10000
  # 8.5技能1034“隐身术”调用PETSKILL_SetDuck, option为`6|90`.
  # 处理器只给施术者自己写入6次行动和闪避阈值90; 状态已存在时仍执行
  # 本次技能动作, 但不会覆盖、叠加或刷新原有数值.
  #
  # 闪避阶段使用原始`rand()%100 <= 90`, 包含等号意味着0至90均成功,
  # 实际是100个结果中的91个. 这里保存旧服阈值90, 不改写为人为校正值.
  # 专用星星表现暂不处理, 服务器先返回标准Action.
  - id: 9000157
    name: 隐身术
    description: 六回合内闪避率上升90　　有效时间六回合
    setDuck:
      remainingActions: 6
      dodgePower: 90
    cost: 1000
  # 8.5技能1035“凤舞九天”继续调用既有PETSKILL_Hector. 处理器只从
  # option读取`攻%70`和`敏%30`, 所以实际敏捷修正是+30%, 不是说明中的
  # +35%. `麻 turn 2`同样未被Hector执行分支解析.
  #
  # 执行阶段固定先以RAND(1,100)<60尝试写Paralysis=1, 随后贯穿普通
  # 单体物理和反击链. 因此说明中的60%实际是59个成功结果, 两回合也不会
  # 生效. 当前只返回标准Status、Action和飘字, 专用表现继续待开发.
  - id: 9000158
    name: 凤舞九天
    description: 攻击力提高70% 敏捷上升35% 有60%的机率使对手麻痹两回合
    hector:
      attackPercentModifier: 70
      agilityPercentModifier: 30
    cost: 5000
  # 8.5技能1036“冰凝杀”继续调用PETSKILL_BattleModel. 旧option为
  # `3|3|障|2|30|攻%-20|130029 128001`: type=3的bit 0要求三个
  # 对象不足以覆盖敌方存活单位时循环复用对象, bit 2没有开启, 所以不走
  # 忠犬和普通物理受击反应路径. 这不代表没有物理伤害; 每个对象仍完整
  # 执行AttackSeq和DamageSub, 只是针刺等受击反应不触发也不被消耗.
  #
  # 攻%-20在提交阶段把本回合工作攻击改为约80%, 防御和敏捷不变.
  # 正伤害且目标存活、没有其他普通状态时, 基础值30进入Barrier通用状态
  # 公式. 成功直接写Barrier=2并清目标命令及Guard/NoGuard. 旧状态循环
  # 每次形成2->1->2, 因而不会自然到期; 说明中的“1回合”不是实际计数.
  #
  # 130029和128001只控制旧客户端三个对象按前者、后者、前者循环显示,
  # 不参与服务器结算. 当前只下发标准Action、Damage、Status和飘字.
  - id: 9000159
    name: 冰凝杀
    description: 水虎王必杀 上升攻击力分身攻击 并附加魔障1回合效果
    battleModel:
      objectCount: 3
