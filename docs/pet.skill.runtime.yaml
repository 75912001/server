  # toxication标记, 不是战斗状态Poison或DeepPoison. 当前Go战斗模型没有这项
  # 连接级输入, 因而不能把普通战斗毒错误当成禁疗; 真正接入该外部状态前,
  # 连接级中毒禁疗保持待开发并显式暴露该边界.
