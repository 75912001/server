# 原版 ITEM_CheckSuitEquip 的实际行为. 证据位于 8.5 服务端源码
# gmsv/item/item_event.c, gmsv/item/item.c 和 gmsv/include/char_base.h.
originalRuntimeSemantics:
  - rule: "固定 3 件激活"
    behavior: "按已装备物品统计 ITEM_SUITCODE, 相同编号达到 3 件即达标; 套装总成员数不受限制."
  - rule: "同一 setId 即同一套装"
    behavior: "原版不读取装备名称来划分名称族, 名称不同仍按相同 ITEM_SUITCODE 混装计数."
  - rule: "只激活一个套装编号"
    behavior: "按装备槽顺序找到第一个达到 3 件的 setId 后停止选择, 其他同时达标的 setId 不激活."
  - rule: "效果跟随当前装备"
    behavior: "选中 setId 后重新扫描所有装备槽, 只解析当前实际穿戴且 setId 相同的装备 argument."
  - rule: "同目标后槽覆盖"
    behavior: "所有套装工作值先清零, 每个 argument 通过 CHAR_setWorkInt 直接赋值; 同一目标不是相加, 后扫描的装备槽覆盖前槽."
  - rule: "穿脱处理函数负责重算"
    behavior: "只有调用 ITEM_suitEquip 或 ITEM_ResuitEquip 的穿脱事件会执行 ITEM_CheckSuitEquip."

# setId=24 的两件铠甲都属于同一个套装, 两条效果都应配置. 它们同属身体槽, 不能同时穿戴;
# 玩家用其中任意一件再搭配另外 2 件 setId=24 装备时, 当前铠甲携带的效果生效.
set24Example:
  setId: 24
  canonicalName: "巨石套装"
  items:
    - originalId: 2326
      name: "巨石之铠"
      slot: "body"
      sourceArgument: "MTGH:10"
      configuredEffect: "defense flat +10"
    - originalId: 2350
      name: "尖牙之铠"
      slot: "body"
      sourceArgument: "MTGH:30"
      configuredEffect: "defense flat +30"
  result: "两项均配置, 由实际穿戴的身体装备决定当前值."

