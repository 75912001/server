pendingEffects:
  - setIds: [16, 17]
    itemIds: [2034, 2039]
    arguments: ["EA:40", "WA:40", "FI:40", "WI:40", "QU:40"]
    configuredAs: "地/水/火/风魔法抗性 +40, 魔法闪避 +40"
    originalIssue: "这些键由 ITEM_MagicEquitWear 解析, 记录却绑定 ITEM_suitEquip; ITEM_CheckSuitEquip 的键表没有它们."
  - setIds: [18]
