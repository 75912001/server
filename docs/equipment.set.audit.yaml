originalRuntimeBugs:
  - affectedSetIds: [33, 34, 35, 36]
    issue: "本组武器和头盔没有 ITEM_suitEquip/ITEM_ResuitEquip; 铠甲只调用 ITEM_MagicResist. 正常穿脱整套不会主动调用 ITEM_CheckSuitEquip, 只有其他套装物品触发重算时才可能被扫描到."
    configuredResult: "EARTH/WATER/FIRE/WIND 效果仍配置在对应头盔, 并标注 TODO."
  - affectedSetIds: [34, 35, 36]
    issue: "原版水/火/风属性未超过 100 的公式分支都错误读取 CHAR_WORK_EA, 只有超过上限时才使用各自工作值判断并截断为 100."
    configuredResult: "按 WATER/FIRE/WIND 的目标属性配置 +30, 不复刻错误字段."
  - affectedSetIds: [33, 34, 35, 36]
    issue: "ITEM_MagicReResist 对雷, 冰及其他分支都误清 CHAR_WORKEQUITFIRE, 不能正确撤销对应抗性."
    configuredResult: "直属装备效果保留正确 target, 后续运行时必须按目标字段撤销."

