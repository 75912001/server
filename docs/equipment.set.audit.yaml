configurationShape:
  root: "equipmentSets"
  setFields: ["setId", "name", "bonuses", "items"]
  itemFields: ["originalId", "id", "name", "category", "setEffects", "equipmentEffects"]
  setBonuses: "bonuses 保存 2件/3件/...套装公共加成; 当前原版采样没有公共条目, 因此均为空数组."
  itemSetEffects: "items[].setEffects 保存达到 pieces 后由当前装备携带的效果."
  itemEquipmentEffects: "items[].equipmentEffects 保存不经过套装门槛的直属装备效果."
  idMigration:
    originalId: "永久保存原版道具 ID, 用于审计和映射追溯."
    id: "只表示当前程序装备 ID; 映射完成前省略, 不临时复用 originalId."
  omittedField:
    frameId: "只用于源表和审计定位, 不进入新套装配置结构."

