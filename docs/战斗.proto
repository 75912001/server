  CombatIntentRewriteReason_PetLoyaltyRandomTarget = 3; // 忠诚不足导致随机改目标
  CombatIntentRewriteReason_PetLoyaltyRandomSkill = 4; // 忠诚不足导致随机技能
  CombatIntentRewriteReason_PetLoyaltyOwnerAttack = 5; // 极低忠诚导致攻击主人
  CombatIntentRewriteReason_PetLoyaltyEnemyAttack = 6; // 忠诚分支强制普通攻击随机敌人
  CombatIntentRewriteReason_PetLoyaltyEscape = 7; // 极低忠诚导致宠物逃跑
  CombatIntentRewriteReason_TransformRestriction = 8; // 狐狸或乌力变身禁止魔法/职业技能并改为等待或防御
  CombatIntentRewriteReason_WeaponActionConversion = 9; // 普通攻击按回力标、弓或投掷武器转换为专用动作
  CombatIntentRewriteReason_ComboCreated = 10; // 相邻同目标普通攻击被合并为合击
