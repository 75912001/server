  LegacyConfiguredButUnregisteredHandler_LostLost = 3; // PETSKILL_Lostlost: 8.0 配置存在, 8.5 注册表未发现
  LegacyConfiguredButUnregisteredHandler_EnemyHelpCaseMismatch = 4; // 配置写 ENEMYSKILL_EnemyHELP, 8.5 注册名为 ENEMYSKILL_EnemyHelp; strcmp 区分大小写
  LegacyConfiguredButUnregisteredHandler_MagicAttackSkill = 5; // MAGIC_AttSkill: 8.0 magic.txt 有 50 条配置, 但 8.5 MAGIC_functbl 中对应注册行被注释
}

// LegacyOperationalState 枚举不属于 BATTLE_ST_* 数组、但会改变战斗结算或客户端表现的运行期状态.
// 它与 LegacyBattleStatus、LegacyMagicStatus、LegacyDamageReaction 共同构成旧服战斗状态全集的协议表示.
enum LegacyOperationalState {
  LegacyOperationalState_None = 0; // 无特殊运行期状态
  LegacyOperationalState_Defending = 1; // 本回合选择防御, 物理伤害进入防御减伤或破防分支
  LegacyOperationalState_LoyalGuardian = 2; // 忠犬或舍己为友建立的代替承伤关系; 普通攻击可触发, 合击明确跳过
  LegacyOperationalState_AbsorbCharge = 3; // 光/吸收剩余次数, 每个有效攻击段或每个合击成员独立消耗一次
  LegacyOperationalState_ReflectCharge = 4; // 镜/反射剩余次数, 每个近战攻击段或合击成员独立消耗一次
  LegacyOperationalState_VanishCharge = 5; // 守/无效化剩余次数, 触发后目标不扣 HP 并消耗一次
  LegacyOperationalState_TrapArmed = 6; // 陷阱已布置, 保存一次性反伤值, 由首个有效近战攻击触发并清除
  LegacyOperationalState_AcupunctureArmed = 7; // 针刺外皮已生效, 首次有效近战攻击将原伤补偶; 无骑宠攻击者承受damage/2, 有骑宠时拆分补偶后各除2, 随后清除
  LegacyOperationalState_MagicDefense = 8; // 魔抗状态, 属于 MagicStatusTbl 而非普通异常数组
  LegacyOperationalState_SuperWall = 9; // 铁壁状态, 属于 MagicStatusTbl 并影响魔法/伤害结算
  LegacyOperationalState_Hidden = 10; // 地球一周等技能令单位暂时隐藏并避开普通目标选择
  LegacyOperationalState_EarthRoundReady = 11; // 地球一周第一阶段完成, 后续回合从背后发动强化攻击
  LegacyOperationalState_ChargeAttack = 12; // 宠物蓄力攻击等待状态, 到期恢复目标和技能动作
  LegacyOperationalState_DoomCharge = 13; // 世界末日蓄力状态, 可被天罗地网取消
  LegacyOperationalState_FireSpearCharge = 14; // 火龙枪蓄力状态, 可被天罗地网取消
  LegacyOperationalState_Mounted = 15; // 单位正在骑乘, 伤害可在人和骑宠之间分配, 落马技能会清除
  LegacyOperationalState_WolfTransform = 16; // PETSKILL_Vary 狼变身, 临时改变形象、攻击和敏捷
  LegacyOperationalState_FoxTransform = 17; // 媚惑术狐狸变身, 攻防敏降为 80%并强制落马
  LegacyOperationalState_PigTransform = 18; // 乌力化变身; 正常非空option因指针比较缺陷固定为100%成功、60秒、形象100250, 重复命中累加60秒并强制落马
  LegacyOperationalState_ProfessionAvoid = 19; // 职业回避/移形换位建立的持续闪避率修正
  LegacyOperationalState_ProfessionEnrage = 20; // 激化攻击持续修正
  LegacyOperationalState_EnergyCollect = 21; // 能量聚集状态, 供后续职业攻击消费或放大
  LegacyOperationalState_WeaponFocus = 22; // 武器专精被动及熟练度成长状态
  LegacyOperationalState_DualWeapon = 23; // 二刀流被动及熟练度成长状态
  LegacyOperationalState_Deflect = 24; // 格挡状态, 触发时产生旧服 Arrange/Block 表现
  LegacyOperationalState_ElementBoundaryEarth = 25; // 地属性结界
  LegacyOperationalState_ElementBoundaryWater = 26; // 水属性结界
  LegacyOperationalState_ElementBoundaryFire = 27; // 火属性结界
  LegacyOperationalState_ElementBoundaryWind = 28; // 风属性结界
  LegacyOperationalState_MagicPetQuota = 29; // 魔法宠次数计数; 处理器意图限制3次, 但当前8.5只读后原值写回且无递增点, 实际始终不能达到3
  LegacyOperationalState_Transform = 30; // 其他配置驱动的战斗变身状态
  LegacyOperationalState_Ultimate = 31; // CHAR_BATTLEFLG_ULTIMATE, 达到过量伤害阈值后的旧绝技/击飞标志
  LegacyOperationalState_AIBad = 32; // CHAR_BATTLEFLG_AIBAD, 低忠诚/异常AI行为标志, 会放宽同队误伤限制
  LegacyOperationalState_AttributeReverse = 33; // CHAR_BATTLEFLG_REVERSE, 每轮交换地<->火、水<->风当前属性
  LegacyOperationalState_NoReturn = 34; // CHAR_BATTLEFLG_NORETURN, 禁止通过BATTLE_PetIn收回当前宠物
  LegacyOperationalState_RecoveryFlag = 35; // CHAR_BATTLEFLG_RECOVERY, 旧服恢复相关战斗标志
  LegacyOperationalState_ABIO = 36; // CHAR_BATTLEFLG_ABIO, 特殊行动状态; 禁止闪避并禁止反击
  LegacyOperationalState_NoDuck = 37; // CHAR_BATTLEFLG_NODUCK, 明确禁止普通闪避判定
  LegacyOperationalState_Rescue = 38; // BATTLE_CHARMODE_RESCUE, 救援/待复活单位; 单独存在时不维持阵营有效存活
  LegacyOperationalState_Surprise = 39; // BSIDE_FLG_SURPRISE, 首回合先制阵营标志并跳过该侧宠物忠诚改写
}

// LegacyBattleRule 是从 8.5 战斗源码重新审计得到的规则目录.
// 枚举值不是旧服常量, 而是本协议的稳定规则编号. 客户端不得据此重算结果, 仅用于调试、测试和 AI 开发说明.
enum LegacyBattleRule {
  LegacyBattleRule_Unknown = 0; // 未指定规则
  LegacyBattleRule_ActionOrderRandomAgility = 1; // 每回合按当前敏捷+20后减去 0%-30% 随机值计算顺序, 不是直接按面板敏捷
  LegacyBattleRule_ActionOrderEquipmentSequence = 2; // _EQUIT_SEQUENCE 开启时装备顺序值与随机敏捷值相加后降序排列
  LegacyBattleRule_ActionOrderTieUnstable = 3; // qsort 比较值相同返回 0, 源码没有稳定的槽位或阵营次级排序保证
  LegacyBattleRule_ItemActionOrderBonus = 4; // 道具行动值=int(work-RAND(0,int(work*0.3))+work*0.15), 在普通随机敏捷表达式中追加15%work后整体截断
  LegacyBattleRule_SkillSpecificActionOrder = 5; // 攻击魔法和职业技能按不同 0%-60% 随机区间计算顺序, 必须记录最终 order_value
  LegacyBattleRule_StatusTickBeforeOwnAction = 6; // 普通状态在单位轮到出手时先结算, 不是所有单位统一在回合末结算
  LegacyBattleRule_StatusTickOrder = 7; // 单位出手前依次执行 BATTLE_StatusSeq、BATTLE_MagicStatusSeq、BATTLE_ProfessionStatusSeq
  LegacyBattleRule_StatusTickCanCancelAction = 8; // 持续伤害致死或不能行动状态会把本次动作改为 None
  LegacyBattleRule_ModifierDecayBetweenRounds = 9; // 下一轮命令阶段把攻击、防御、敏捷、魅力等临时 mod 乘以 0.8
  LegacyBattleRule_ElementReverseBetweenRounds = 10; // Reverse 标记每轮交换地<->火、水<->风的当前属性
  LegacyBattleRule_GuardianLinkResetEachRound = 11; // 每轮命令阶段先清空 entry.guardian 和 GUARDIAN 标记, 必须由本轮动作重新建立
  LegacyBattleRule_SurpriseFirstRoundOnly = 12; // 开战按玩家侧0号位队长的有效运气CHAR_WORKFIXLUCK判定先制阵营, 第一轮结束后清除BSIDE_FLG_SURPRISE
  LegacyBattleRule_CommandTimeoutForcedExit = 13; // _BATTLECOMMAND_TIME 下超时玩家被强制离队和离场, 不是补默认普通攻击
  LegacyBattleRule_TargetEligibility = 14; // 合法目标必须存在、在战斗、存活、可被攻击且不处于 RESCUE
  LegacyBattleRule_InvalidTargetRandomFallback = 15; // 原目标失效时从目标阵营全部合法单位中随机选一个, 没有目标才失败
  LegacyBattleRule_BowTargetExpansion = 16; // 弓按主目标所在列和随机方向生成前后排攻击顺序, 实际目标列表必须由服务端下发
  LegacyBattleRule_RandomMultiTargetPerSegment = 17; // 疯狂暴走/栗子等技能可为每段从存活敌人中重新随机目标
  LegacyBattleRule_PetLoyaltyActionRewrite = 18; // 宠物忠诚不足可改目标、随机技能、攻击主人、攻击敌人、等待或逃跑
  LegacyBattleRule_PetLoyaltyBypassOnSurprise = 19; // 所属阵营处于 Surprise 时该轮跳过 BATTLE_PetLoyalCheck
  LegacyBattleRule_TransformActionRestriction = 20; // 狐狸只允许攻击、防御、等待, 其他动作改为None; 乌力允许攻击、防御、None、道具、逃跑、捕获、等待和宠物进出, 其他动作改为Guard; 两者都强制徒手
  LegacyBattleRule_OrdinaryStatusGlobalExclusive = 21; // 通用BATTLE_StatusAttackCheck及普通职业状态扫描全部BATTLE_ST_*, 已有任意状态就拒绝新状态; 自然威能使用专用例外
  LegacyBattleRule_OrdinaryStatusReapplyKeepsCurrent = 22; // 石化 5 再施加石化 3 会失败并保留当前剩余值, 不累加、不覆盖、不取最大
  LegacyBattleRule_OrdinaryStatusAnimationBeforeConflict = 23; // BATTLE_MultiStatusChange 先发魔法效果再检查冲突, 所以可有动画但状态未新增
  LegacyBattleRule_MagicStatusExclusive = 24; // 魔抗、铁壁和元素魔抗扫描 MagicTbl, 仅在同组全部为空时才能施加
  LegacyBattleRule_DamageReactionIndependentSlots = 25; // 光、镜、守、陷阱、针刺分别存储, 可以同时存在并可与石化等普通异常共存
  LegacyBattleRule_DamageReactionReapplyReplacesCount = 26; // 同类光镜守再次施加直接覆盖剩余次数, 5 次再施加 3 次会变成 3
  LegacyBattleRule_DamageReactionPriority = 27; // 每次攻击固定选择 守(Vanish)>光(Absorb)>镜(Reflect)>陷阱>针刺
  LegacyBattleRule_DamageReactionConsumeSelectedOnly = 28; // 每次只消耗实际选中的最高优先级反应, 其他已存在反应不变
  LegacyBattleRule_DamageReactionDisablesDodge = 29; // 目标存在任意光镜守反应时 BATTLE_DuckCheck 直接不允许闪避
  LegacyBattleRule_DamageReactionCountNotRound = 30; // 光、镜、守的 turn 参数实际作为触发次数, 不随普通回合自然递减
  LegacyBattleRule_TrapRoundAndTriggerExpiry = 31; // 陷阱会在职业状态序列中按轮减少, 被有效近战触发时又会立即清零和值归零
  LegacyBattleRule_AcupunctureOneShot = 32; // 针刺不按轮递减, 首次有效近战把奇数原伤加1; 目标承受补偶后伤害, 攻击者无骑宠承受一半, 有骑宠按拆分补偶后各除2, 随后清零
  LegacyBattleRule_ThrowWeaponReactionRestriction = 33; // 投掷攻击不触发镜、陷阱、针刺; 镜被选中但不会消耗且不会继续降级选择陷阱
  LegacyBattleRule_SpecialAttackBypassReaction = 34; // 火线猎杀等专用伤害函数可强制 react=None, 明确绕过光镜守
  LegacyBattleRule_SleepWakeOnDamage = 35; // 有效伤害调用 BATTLE_DamageWakeUp 清除睡眠
  LegacyBattleRule_StoneDoublePhysicalDefense = 36; // 物理伤害计算中目标石化会把计算防御乘以 2
  LegacyBattleRule_ConfusionDisablesGuard = 37; // 目标混乱时即使动作是 Guard 也不应用防御减伤
  LegacyBattleRule_CannotMoveStatusSet = 38; // 麻痹、石化、睡眠、魔障、晕眩、天罗地网、雷附体和部分蓄力状态阻止行动
  LegacyBattleRule_GuardRandomReduction = 39; // 普通防御随机把伤害乘以 0%、10%、20%、30%、40%或50%, 不是固定 50%
  LegacyBattleRule_GuardDisablesDodge = 40; // Guard 目标不会再执行普通闪避判定
  LegacyBattleRule_BlockReducesToTenPercent = 41; // _EQUIT_ARRANGE 格挡成功把本次伤害乘以 10%, 并产生 Arrange/Block 表现
  LegacyBattleRule_MinimumDamageRandomZeroOrOne = 42; // 伤害小于 1 时旧服随机得到 0 或 1, 0 可进一步表现为 Miss/AllGuard
  LegacyBattleRule_BowCriticalUsesNormalDamage = 43; // 弓可以出现暴击标志, 但暴击分支仍调用普通 BATTLE_DamageCalc, 不追加近战暴击伤害
  LegacyBattleRule_FriendlyFireClamp = 44; // 同队误伤在非混乱/挑拨/附身/低忠诚等例外下被限制为 0 或 1, 防止击杀队友
  LegacyBattleRule_GuardianEligibility = 45; // 忠犬保护者必须存活且仍有 GUARDIAN 标记, 睡眠、混乱、麻痹、石化、魔障等会令保护失效
  LegacyBattleRule_GuardianNoThrowWeapon = 46; // 投掷武器不触发忠犬代替承伤
  LegacyBattleRule_GuardianNoCombo = 47; // 合击把 Guardian 初始化为 -2, 跳过忠犬检查
  LegacyBattleRule_ComboFormation = 48; // 排序后相邻单位必须同阵营、同目标、普通攻击、可行动且非投掷武器才能组成合击
  LegacyBattleRule_ComboNoDodge = 49; // BATTLE_COM_COMBO 明确跳过 Dodge, 但仍可暴击和应用目标防御
