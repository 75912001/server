  LegacyPetSkillHandler_DivideAttack = 64; // 分身地裂: 先令敌方玩家MP扣floor(MP/2); 再对敌方全体扣当前HP, 无活骑宠扣人物floor(HP/5), 有活骑宠则人物和骑宠各扣floor(HP/10), 商为0仍扣1且可致死/落马; 不走命中、暴击、反击和光镜守
  LegacyPetSkillHandler_BattleModel = 65; // 通用战斗模型: option依次为类型位图|攻击物件数|状态|回合|基础命中|攻防敏修正|1-4动作图; 物件数<=0随机1-10、>10截为10; 位0决定少物件时是否覆盖全体, 位2决定物理承伤/忠犬/光镜守; 每个物件独立攻击并可重复随机目标
}

// LegacyMagicHandler 枚举旧服 MAGIC_functbl 中全部已注册的魔法处理器.
// 真正 magic ID 和目标/强度/持续回合均来自 magic.txt, 不等于本枚举值.
enum LegacyMagicHandler {
  LegacyMagicHandler_Unknown = 0; // 未知处理器
