// CombatRoundPhase 标识旧服一个回合内的逻辑阶段.
enum CombatRoundPhase {
  CombatRoundPhase_Unknown = 0; // 未指定阶段
  CombatRoundPhase_CommandWait = 1; // 等待玩家、宠物和 AI 动作输入
  CombatRoundPhase_AIResolve = 2; // 敌人 AI 和托管动作生成
  CombatRoundPhase_OrderRoll = 3; // 为全部单位计算带随机浮动的行动顺序值
  CombatRoundPhase_ComboBuild = 4; // 按排序后相邻普通攻击构建合击组
