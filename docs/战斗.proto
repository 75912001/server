// LegacyMagicStatus 与旧服 BATTLE_MST_* 一致, 属于普通异常状态之外的魔法防护/抗性状态.
enum LegacyMagicStatus {
  LegacyMagicStatus_None = 0; // 无魔法状态
  LegacyMagicStatus_DefMagic = 1; // 魔抗; 由 MAGIC_MagicStatusChange 或 PETSKILL_MagicStatusChange 施加
  LegacyMagicStatus_SuperWall = 2; // 铁壁; 由对应魔法/宠物技能施加, 在魔法状态序列中单独维护
  LegacyMagicStatus_ResistFire = 3; // 火魔法抗性; _MAGICSTAUTS_RESIST 开启时可用
  LegacyMagicStatus_ResistThunder = 4; // 雷魔法抗性; _MAGICSTAUTS_RESIST 开启时可用
  LegacyMagicStatus_ResistIce = 5; // 冰魔法抗性; _MAGICSTAUTS_RESIST 开启时可用
}

// LegacyDamageReaction 数值与旧服BATTLE_MD_*一致, 但数值顺序不是触发优先级.
// BATTLE_GetDamageReact的实际判断顺序固定为Vanish(守)>Absorb(光)>Reflect(镜)>Trap>Acupuncture.
enum LegacyDamageReaction {
  LegacyDamageReaction_None = 0; // 普通承伤
  LegacyDamageReaction_Absorb = 1; // 光/吸收: 本次伤害转为给被攻击者及骑宠加 HP, 每触发一段消耗 1 次
  LegacyDamageReaction_Reflect = 2; // 镜/反射: 近战伤害改由攻击者及其骑宠承受, 每触发一段消耗 1 次; 投掷武器不反射
  LegacyDamageReaction_Vanish = 3; // 守/无效化: 被攻击者HP不变, 每触发一段消耗1次; 优先级实际最高
  LegacyDamageReaction_Trap = 4; // 陷阱: 近战攻击者承受预存的固定陷阱伤害, 触发后状态和值立即清零; 远程不触发
  LegacyDamageReaction_Acupuncture = 5; // 针刺外皮: 奇数原伤先加1; 被攻击者承受补偶后的伤害, 无骑宠攻击者承受damage/2, 有骑宠时先按防御比例拆分并分别补偶后各除2; 触发后清零
}

// LegacySkillCategory 标识旧服配置技能所属注册表.
