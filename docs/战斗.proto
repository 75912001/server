// CombatUnitKey 与当前server/proto/combat.proto保持一致, 是本场战斗内稳定单位引用.
message CombatUnitKey {
  uint64 aid = 1; // 账号ID; 玩家单位为AccountRecord.aid, 怪物/NPC/召唤物为0
  uint64 character_uuid = 2; // 玩家角色UUID; 玩家宠物填所属角色UUID, 非玩家单位为0
  uint64 pet_uuid = 3; // 玩家宠物UUID; 角色为0, 怪物/NPC/召唤物使用本场临时唯一ID
}

// CombatRuleValue 保存某条旧服规则本次实际使用的参数.
message CombatRuleValue {
  string key = 1; // 稳定参数名, 例如 current_duration、requested_duration、order_value
  oneof value {
    sint64 int_value = 2; // 整数、次数、回合、万分比或差量
    bool bool_value = 3; // 布尔参数
    string string_value = 4; // 枚举外的旧服文本或版本说明
    CombatUnitKey unit_value = 5; // 单位参数
  }
}

// CombatRuleDecision 保存一次已经由服务端执行的规则判断.
// 客户端只按 outcome 和后续差量表现, 不使用 parameter_list 重新判定.
message CombatRuleDecision {
  uint32 decision_id = 1; // 本回合内唯一规则判断 ID
  LegacyBattleRule rule = 2; // 命中的旧服规则
  bool applied = 3; // 该规则是否改变了动作、目标、状态或伤害
  CombatActionResult outcome = 4; // 规则处理后的动作级结果
  repeated CombatUnitKey source_unit_list = 5; // 规则来源单位
  repeated CombatUnitKey target_unit_list = 6; // 规则影响单位
  repeated CombatRuleValue parameter_list = 7; // 本次实际参数, 用于回放和审计
  string note = 8; // 无法结构化的条件编译或旧服兼容说明
}

// CombatActionOrderDetail 保存服务端已经计算完成的出手顺序值.
message CombatActionOrderDetail {
  CombatUnitKey unit = 1; // 行动单位
  uint64 intent_id = 2; // 对应 CombatActionIntent.intent_id
  sint64 base_agility = 3; // 计算前当前敏捷
  sint64 random_reduction = 4; // BATTLE_DexCalc 本次随机扣减值
  sint64 action_modifier = 5; // 道具或技能专用顺序增减
  sint64 equipment_sequence = 6; // _EQUIT_SEQUENCE 装备顺序修正
  sint64 final_order_value = 7; // qsort 实际采用的最终值
  uint32 execution_order = 8; // 排序后的最终序号, 从 1 开始
  repeated CombatRandomCheck check_list = 9; // 顺序随机值的审计数据
}

// CombatActionRewriteDetail 同时保存提交动作和服务端最终执行动作.
message CombatActionRewriteDetail {
  CombatUnitKey unit = 1; // 被改写动作的单位
  CombatActionType submitted_action_type = 2; // 玩家或宠物原始动作
  uint32 submitted_action_id = 3; // 原始技能/魔法/道具 ID
  CombatUnitKey submitted_target_unit = 4; // 原始目标
  CombatActionType executed_action_type = 5; // 服务端最终动作
  uint32 executed_action_id = 6; // 最终技能/魔法/道具 ID
  CombatUnitKey executed_target_unit = 7; // 最终主目标
  CombatIntentRewriteReason reason = 8; // 改写原因
  repeated CombatRandomCheck check_list = 9; // 忠诚、混乱等随机判定
}

// CombatTargetResolutionDetail 保存声明目标到实际目标列表的完整解析过程.
message CombatTargetResolutionDetail {
  CombatUnitKey source_unit = 1; // 出手单位
  CombatUnitKey declared_target_unit = 2; // 动作提交时的目标
  repeated CombatUnitKey resolved_target_unit_list = 3; // 服务端最终目标, 按结算顺序排列
  CombatTargetResolutionReason reason = 4; // 保持、改选、展开或忠犬改向原因
  repeated CombatRandomCheck check_list = 5; // 随机改选或范围展开使用的随机值
}

// CombatRuntimeAttributeValue 保存某个时间点的当前战斗属性及其临时修正.
message CombatRuntimeAttributeValue {
  CombatAttributeType attribute_type = 1; // 属性类型
  sint64 base_value = 2; // 本场基础或合规化后的值
  sint64 modifier_value = 3; // 技能、状态、装备产生的当前修正
  sint64 current_value = 4; // 服务端最终采用值
}

// CombatLuckSnapshot 保存一次战斗快照或随机判定所需的完整运气输入.
// 角色基础运气持久化在CharacterRecord; 装备合计和有效运气均由服务端即时派生, 不单独持久化.
message CombatLuckSnapshot {
  sint32 base_luck = 1; // CHAR_LUCK; 正常角色范围1-5
  sint32 equipment_modifier = 2; // 本次按当前全部已装备物品配置即时计算的ITEM_MODIFYLUCK之和, 可超出1-5
  sint32 effective_luck = 3; // CHAR_WORKFIXLUCK=clamp(base_luck+equipment_modifier,1,5)
}

// CombatRuntimeAttributeDelta 描述技能或轮末衰减造成的属性变化.
message CombatRuntimeAttributeDelta {
  CombatAttributeType attribute_type = 1; // 属性类型
  sint64 before = 2; // 变化前值
  sint64 delta = 3; // 本次变化量
  sint64 after = 4; // 变化后值
  uint32 source_skill_id = 5; // 造成变化的技能ID; 0表示回合衰减或系统规则
}

// CombatEquipmentRuntimeState 保存战斗期间装备槽和耐久的权威状态.
message CombatEquipmentRuntimeState {
  reserved 7;
  reserved "luck_modifier";

  uint32 equipment_id = 1; // 装备配置 ID
  uint32 inventory_slot = 2; // 背包或装备数组槽位
  uint32 equipment_slot = 3; // 武器、盾牌等装备槽
  sint64 durability = 4; // 当前耐久
  sint64 max_durability = 5; // 耐久上限
  bool broken = 6; // 是否已损坏
}

// CombatEquipmentDelta 描述一次战斗内装备变化.
message CombatEquipmentDelta {
  CombatEquipmentChangeType change_type = 1; // 变化类型
  CombatEquipmentRuntimeState before = 2; // 变化前状态
  CombatEquipmentRuntimeState after = 3; // 变化后状态; 移除或偷走时为空
  CombatUnitKey transferred_to_unit = 4; // 被偷窃或转移后的接收单位
}

// CombatInventoryDelta 描述战斗动作导致的背包数量变化.
// 捕获前置物品只在捕获成功时消耗; 投掷武器和普通道具按各自处理器决定消耗时点.
message CombatInventoryDelta {
  CombatUnitKey owner_unit = 1; // 背包所属角色; 怪物或系统物品可为空
  uint32 inventory_slot = 2; // 背包槽位
  uint32 item_id = 3; // 道具配置 ID
  uint32 before_count = 4; // 变化前数量
  sint32 delta = 5; // 数量变化; 消耗为负数
  uint32 after_count = 6; // 变化后数量
  CombatUnitKey transferred_to_unit = 7; // 偷窃或转移的接收单位; 普通消耗时为空
}

// CombatDamageAllocation 保存总伤害在人、骑宠、保护者和反伤接收者之间的实际分配.
message CombatDamageAllocation {
  CombatUnitKey recipient_unit = 1; // 最终 HP 发生变化的单位
  CombatDamageRecipientRole recipient_role = 2; // 该单位在本次伤害中的角色
  uint64 hp_before = 3; // 扣血前 HP
  uint64 damage = 4; // 分配到该单位的实际伤害
  uint64 hp_after = 5; // 扣血后 HP
  bool defeated = 6; // 本次分配后是否倒地或死亡
}

// CombatRoundPhaseDetail 标识回合阶段开始或结束.
message CombatRoundPhaseDetail {
  CombatRoundPhase phase = 1; // 当前阶段
  bool begin = 2; // true=阶段开始, false=阶段结束
  CombatUnitKey current_unit = 3; // BeforeUnitAction/UnitAction 对应单位
}

// CombatPosition 描述单位所在阵营、槽位和可选逻辑坐标.
message CombatPosition {
  CombatCamp camp = 1; // 所属阵营
  uint32 slot = 2; // 阵营内站位槽; 旧服通常为 0-9
  bool has_coordinate = 3; // x/y 是否包含服务端权威逻辑坐标
  sint32 x = 4; // 逻辑横坐标; 客户端像素位置仍由场景配置换算
  sint32 y = 5; // 逻辑纵坐标; 客户端像素位置仍由场景配置换算
}

// CombatElement 保存单位或场地的四元素数值.
message CombatElement {
  sint32 earth = 1; // 地属性
  sint32 water = 2; // 水属性
  sint32 fire = 3; // 火属性
  sint32 wind = 4; // 风属性
}

// CombatAssetValue 保存单位当前资源值和上限.
message CombatAssetValue {
  CombatAssetType asset_type = 1; // 资源类型
  uint64 value = 2; // 当前值
  uint64 max_value = 3; // 当前上限; 没有上限时为 0
}

// CombatTimedStatus 保存按单位行动前时序维护的普通异常或MagicTbl状态.
// 全部BATTLE_ST_*共用OrdinaryAbnormal互斥组; 全部BATTLE_MST_*共用MagicStatus互斥组.
// 已有任意同组状态时, 8.5在概率判定前直接拒绝新状态, 不累加、不覆盖、不刷新.
message CombatTimedStatus {
  uint32 status_id = 1; // 项目稳定状态ID; 旧状态下标另外保存在legacy字段
  CombatStatusKind status_kind = 2; // 客户端稳定语义
  CombatUnitKey source_unit = 3; // 施加者; 系统状态为空
  uint32 stack = 4; // 兼容扩展层数; 8.5普通异常和MagicTbl状态固定为1
  sint32 remaining_round = 5; // 剩余单位行动次数; -1表示处理器自管或无固定期限
  sint32 strength = 6; // 状态强度、抗性增量或处理器参数, 保留符号
  bool dispellable = 7; // 是否允许状态恢复技能移除
  LegacyBattleStatus legacy_battle_status = 8; // BATTLE_ST_*; 非普通/职业状态为None
  LegacyMagicStatus legacy_magic_status = 9; // BATTLE_MST_*; 非MagicTbl状态为None
  uint32 caused_by_skill_id = 10; // 来源技能ID; 道具、场地或系统效果为0
  CombatStatusExclusiveGroup exclusive_group = 11; // OrdinaryAbnormal或MagicStatus
  CombatStatusStackPolicy stack_policy = 12; // 8.5标准路径为RejectIfGroupOccupied
  uint32 source_event_id = 13; // 建立或最后更新本状态的事件ID
}

// CombatReactionStatus 保存受物理伤害时选择的光、镜、守、陷阱和针刺独立槽.
// 这些槽可互相并存, 也可与石化、睡眠等回合状态并存. 每段攻击只选择一个最高优先级槽:
// Vanish(守)>Absorb(光)>Reflect(镜)>Trap(陷阱)>Acupuncture(针刺).
message CombatReactionStatus {
  CombatStatusKind status_kind = 1; // 客户端稳定语义
  CombatUnitKey source_unit = 2; // 施加者
  LegacyDamageReaction legacy_damage_reaction = 3; // BATTLE_MD_*槽
  uint32 remaining_trigger_count = 4; // 光镜守触发次数; 同类重施直接覆盖本值
  sint64 stored_value = 5; // 陷阱预存伤害等专用值; 无专用值时为0
  uint32 caused_by_skill_id = 6; // 来源技能ID
  uint32 priority = 7; // 选择优先级, 1最高; 8.5固定为守1、光2、镜3、陷阱4、针刺5
  uint32 source_event_id = 8; // 建立或最后更新本槽的事件ID
  bool melee_only = 9; // 镜、陷阱、针刺为true; 投掷攻击不触发
}

// CombatModifierStatus 保存不属于两个状态数组的运行期标志和参数.
// 防御、忠犬、骑乘、蓄力、变身、元素结界、职业被动等使用各自处理器规则, 不参加普通异常互斥.
message CombatModifierStatus {
  uint32 status_id = 1; // 项目稳定状态ID
  CombatStatusKind status_kind = 2; // 客户端稳定语义
  CombatUnitKey source_unit = 3; // 来源单位; 系统状态为空
  LegacyOperationalState legacy_operational_state = 4; // 旧服运行期状态语义
  sint32 remaining_round = 5; // 使用回合计数的修正剩余值; -1表示处理器自管
  sint64 strength = 6; // 主修正值
  uint32 stack = 7; // 仅处理器明确支持时使用; 8.5不得擅自通用叠层
  CombatStatusStackPolicy stack_policy = 8; // 由具体技能处理器决定
  uint32 caused_by_skill_id = 9; // 来源技能ID
  uint32 source_event_id = 10; // 建立或最后更新本状态的事件ID
  repeated CombatRuleValue parameter_list = 11; // 目标、原属性、附加修正等处理器专用权威参数
}

// CombatStatusSnapshot 仅供状态差量统一携带前后值, 不把三类状态重新合并为一种规则.
message CombatStatusSnapshot {
  oneof status {
    CombatTimedStatus timed_status = 1; // 回合状态
    CombatReactionStatus reaction_status = 2; // 受击反应槽
    CombatModifierStatus modifier_status = 3; // 运行期修正
  }
}

// CombatUnitState 保存某个时间点单位的完整运行期状态.
message CombatUnitState {
  CombatUnitKey unit = 1; // 状态所属单位
  CombatPosition position = 2; // 当前权威站位
  repeated CombatAssetValue asset_list = 3; // HP、MP、怒气等当前值
  repeated CombatTimedStatus timed_status_list = 4; // 当前普通异常和MagicTbl状态
  CombatPose pose = 5; // 当前权威姿态
  bool alive = 6; // 是否存活
  bool visible = 7; // 是否应显示在战场
  bool controllable = 8; // 当前是否可提交动作
  CombatUnitKey mount_unit = 9; // 当前骑宠单位; 没有骑乘时为空
  uint32 current_appearance_id = 10; // 变身、落马或技能改变后的当前战斗形象
  repeated CombatRuntimeAttributeValue runtime_attribute_list = 11; // 当前攻防敏、抗性、命中等权威值
  repeated CombatEquipmentRuntimeState equipment_state_list = 12; // 当前装备槽、耐久和破损状态
  CombatUnitKey protector_unit = 13; // 当前替本单位承伤的忠犬/舍己保护者
  repeated CombatUnitKey protected_unit_list = 14; // 本单位当前负责保护的目标列表
  repeated CombatReactionStatus reaction_status_list = 15; // 当前光镜守、陷阱和针刺独立槽
  repeated CombatModifierStatus modifier_status_list = 16; // 当前防御、忠犬、骑乘、蓄力、变身等修正
}

// CombatUnitAttribute 保留现有协议1-6字段, 并补齐8.5公式所需的服务端权威初始属性.
message CombatUnitAttribute {
  uint64 exp = 1; // 当前经验值; 与现有协议一致
  uint32 hp = 2; // 开战当前HP; 与现有协议一致
  uint32 attack = 3; // 开战攻击力; 与现有协议一致
  uint32 defense = 4; // 开战防御力; 与现有协议一致
  uint32 agility = 5; // 开战敏捷; 与现有协议一致
  uint32 loyalty = 6; // 忠诚度; 非宠物单位为0
  uint32 level = 10; // 服务端实际等级; 捕获、暴击、逃跑等公式直接使用
  uint32 max_hp = 11; // 最大HP
  uint32 max_mp = 12; // 最大MP
  uint32 mp = 13; // 开战当前MP
  uint32 recovery = 14; // 回复或治疗相关属性
  CombatLuckSnapshot luck = 15; // 开战完整运气快照; 各公式必须再按CombatLuckUsage选择基础值或有效值
  CombatElement element = 20; // 地、水、火、风属性
}

// CombatEquipmentBind 扩展现有装备绑定, 但保留equipment_id字段号.
message CombatEquipmentBind {
  uint32 equipment_id = 1; // 装备资源 ID
  uint32 slot = 2; // 装备槽位
}

// CombatUnit 保留当前生产协议的公共字段号, 新字段使用空闲编号扩展.
message CombatUnit {
  CombatCamp camp = 1; // 初始阵营; 与现有协议一致
  uint32 position = 2; // 阵营内0-9站位; 与现有协议一致
  CombatUnitKey key = 3; // 单位身份; 与现有协议一致
  CombatUnitKind unit_kind = 4; // 角色、宠物、怪物、NPC、召唤物或骑宠
  CombatPosition initial_position = 5; // 含可选逻辑坐标的初始站位
  uint32 character_id = 10; // 角色资源ID; 与现有协议一致
  uint32 pet_id = 11; // 宠物或怪物资源ID; 与现有协议一致
  uint32 appearance_id = 12; // 客户端开战形象资源ID
  uint32 mount_pet_id = 13; // 骑宠资源ID; 与现有协议一致
  CombatUnitKey owner_unit_key = 14; // 宠物、骑宠或召唤物主人; 无主人为空
  CombatUnitAttribute attribute = 20; // 开战基础属性快照; 与现有协议字段号一致
  repeated CombatEquipmentBind equipment_list = 30; // 装备资源绑定; 与现有协议字段号一致
  string display_name = 31; // 服务端名称; 客户端可按本地化资源覆盖
}

// CombatFieldState 保存场地、天气或元素环境的权威状态.
message CombatFieldState {
  uint32 field_id = 1; // 场地状态 ID; 没有特殊场地时为 0
  CombatElement element = 2; // 当前场地元素修正
  sint32 remaining_round = 3; // 剩余回合; -1 表示无固定期限
  uint32 strength = 4; // 场地强度
}

// CombatRuleSnapshot 保存本场战斗影响客户端表现和校验的关键规则.
message CombatRuleSnapshot {
  uint32 max_round = 1; // 最大回合数; 0 表示不限制
  uint32 max_attack_segment_per_action = 2; // 单个主动动作允许的最大攻击段数
  uint32 max_counter_count_per_action = 3; // 单个主动动作整条触发链允许的反击总次数, 不是每段分别计算
  uint32 max_counter_depth = 4; // 反击链最大深度; 8.5没有独立深度上限, 应与最多5次反击相同
  uint32 player_combo_start_rate_basis_points = 5; // 8.5非CHAR_TYPEENEMY单位固定为5000, 即RAND(1,100)<=50
  uint32 enemy_combo_start_rate_basis_points = 6; // 8.5 CHAR_TYPEENEMY单位固定为2000, 即RAND(1,100)<=20
  bool combo_can_dodge = 7; // 旧服必须为 false: BATTLE_AttackSeq 在 BATTLE_COM_COMBO 下跳过 Dodge 判定
  bool combo_can_trigger_loyal_guard = 8; // 旧服必须为 false: 合击把 Guardian 初始化为 -2, 不触发忠犬代打
  bool combo_rechecks_damage_reaction_per_member = 9; // 旧服为 true: 每个合击成员分别检查并消耗光、镜、守、陷阱或针刺
  bool combo_applies_target_defense = 10; // 旧服为 true: 合击虽不可闪避, 目标防御仍参与每个成员的伤害计算
  bool combo_requires_normal_attack = 11; // 旧服为 true: 参与者必须连续选择 BATTLE_COM_ATTACK
  bool combo_requires_same_target = 12; // 旧服为 true: 参与者必须选择同一目标且属于同一阵营
  bool combo_allows_throw_weapon = 13; // 旧服为 false: 投掷武器不会进入合击组
  bool counter_limit_shared_by_all_segments = 14; // 旧服为 true: 3 段、10 段都共用整次动作最多 5 次反击, 不是每段各 5 次
  uint32 legacy_rule_revision = 15; // LegacyBattleRule规则集版本; 本规格固定填写1, 任何机制修正必须递增版本
  repeated string enabled_compile_flag_list = 16; // 例如 _BATTLE_NEWPOWER、_PROFESSION_SKILL、_EQUIT_SEQUENCE
  repeated LegacyBattleRule enabled_legacy_rule_list = 17; // 可选启用规则全集; 双方已约定 revision 时可省略
  repeated LegacyDamageReaction damage_reaction_priority_list = 18; // 8.5 应依次为 Vanish、Absorb、Reflect、Trap、Acupuncture
  bool status_tick_before_each_unit_action = 19; // 8.5 为 true, 防止客户端误认为全部状态在回合末统一跳数
  uint32 between_round_modifier_retention_basis_points = 20; // 8.5 临时 mod 每轮保留 8000, 即乘以 0.8
  bool invalid_target_random_fallback = 21; // 8.5 普通目标失效后从合法敌人中随机改选
  bool legacy_command_timeout_forced_exit = 22; // 8.5源码差异记录: _BATTLECOMMAND_TIME会强制离场; 现代主流程不得采用
  bool ordinary_status_global_exclusive = 23; // 8.5 为 true, 全部 BATTLE_ST_* 互斥
  bool magic_status_global_exclusive = 24; // 8.5 为 true, 全部 MagicTbl 状态互斥
  bool damage_reaction_reapply_replaces_count = 25; // 8.5 为 true, 同类光镜守直接覆盖次数
  CombatActionType timeout_character_action = 26; // 现代超时默认动作固定为Defense
  CombatActionType timeout_pet_action = 27; // 现代超时默认动作固定为Defense, action_id=9000003, 不读取宠物技能槽
  bool pet_active_wait_allowed = 28; // true表示玩家仍可主动提交Wait, action_id=9000001; 超时不会自动选择Wait
  bool victory_check_after_action_postprocess = 29; // 每个单位动作及必要后处理链完成后检查有效存活数
  bool player_pet_counts_as_effective_living = 30; // 必须为false: 玩家宠物不维持玩家阵营存活
  bool pve_enemy_counts_as_effective_living = 31; // 必须为true: PVE怪物和NPC维持敌方阵营存活
  bool simultaneous_zero_initiator_loses = 32; // 同一原子边界双方均为0时发起方先判负, 防守方胜利
}

// CombatBattleStart 是生产开战快照, 只发送客户端创建当前PVE战场需要的初始可见数据.
message CombatBattleStart {
  string battle_id = 1; // 战斗唯一UUID字符串; 与现有协议一致
  repeated CombatUnit unit_list = 10; // 全部初始可见和可引用单位; 与现有协议字段号一致
}

// CombatBattleStartNotify 沿用当前协议入口, 通知客户端创建战斗场景并进入首回合.
message CombatBattleStartNotify {
  CombatBattleStart battle_start = 1; // 开战快照; 与现有协议字段号一致
  uint32 round = 2; // 当前回合号, 首回合固定为1
}

// CombatActionIntent 仅用于说明服务端内部动作模型和测试数据, 不进入生产CombatRoundResultNotify.
message CombatActionIntent {
  CombatUnitKey unit_key = 1; // 出手单位; 与现有协议一致
  CombatActionType action_type = 2; // 动作类型; 与现有协议一致
  uint32 action_id = 3; // 技能动作即skill_id, 道具动作即item_id, 与现有协议一致
  CombatUnitKey target_key = 4; // 客户端或AI声明的主目标; 与现有协议一致
  reserved 5; // 现有协议已废弃的defaulted字段
  CombatIntentSource intent_source = 6; // 玩家、超时默认、敌方AI、状态强制或系统来源
  uint64 intent_id = 7; // 本回合内唯一意图ID, 由服务端分配
  uint32 declared_target_position = 8; // 没有稳定单位目标时使用的0-9站位
  uint32 item_slot = 9; // 道具动作使用的背包槽; 非道具动作为0
  uint64 submit_timestamp_ms = 10; // 玩家提交或服务端生成意图的时间
  bool normal_attack_combo_candidate = 11; // 是否进入连续同目标普通攻击合击候选
  CombatActionRewriteDetail rewrite = 12; // 提交动作和最终动作的差异
  CombatTargetResolutionDetail target_resolution = 13; // 声明目标到最终目标列表
  int32 legacy_command_code = 14; // 当前8.5启用宏配置下的BATTLE_COM_*原值, 仅用于源码映射
  string legacy_command_name = 15; // BATTLE_COM_*符号名, 仅用于源码映射
}

// CombatRoundActionReq 提交一个单位在指定回合中的动作选择.
message CombatRoundActionReq {
  string battle_id = 1; // 战斗唯一 ID
  uint32 round = 2; // 客户端认为的当前回合号
  CombatUnitKey unit_key = 3; // 出手单位; 必须属于当前连接可控角色或其出战宠物
  CombatActionType action_type = 4; // 客户端选择动作
  uint32 action_id = 5; // 角色攻击/防御使用CharacterAction, 角色逃跑为0; 宠物待机/攻击/防御依次为9000001/9000002/9000003
  CombatUnitKey target_key = 6; // 攻击必须指定敌方目标; 防御、等待和逃跑为空
}

// CombatRoundActionRes 确认服务端已经接受动作.
message CombatRoundActionRes {
  string battle_id = 1; // 战斗唯一 ID
  uint32 round = 2; // 已接受动作的回合号
  CombatUnitKey unit_key = 3; // 已接收动作的出手单位; 与现有协议一致
}

// CombatRandomCheck 是服务端内部固定向量测试和调试结构, 不进入普通客户端协议或持久化档案.
// 它保存一次已完成判定的精确输入和随机边界, 不包含随机种子.
// raw_min/raw_max遵守8.5 RAND(min,max)闭区间; compare_op保留源码严格<或<=差异.
message CombatRandomCheck {
  CombatCheckType check_type = 1; // 判定类型
  uint32 rate_basis_points = 2; // 成功率, 万分比 0-10000
  uint32 roll_basis_points = 3; // 本次随机值, 范围 0-9999
  bool success = 4; // 最终是否成功
  repeated CombatRuleValue parameter_list = 5; // 等级、忠诚、运气、次数等参与本判定的实际输入
  string failure_reason = 6; // 无法仅由 success 表达的失败原因, 例如 status_group_occupied
  sint64 raw_min = 7; // 传给RAND的闭区间最小值
  sint64 raw_max = 8; // 传给RAND的闭区间最大值
  sint64 raw_roll = 9; // 本次实际随机整数
  string compare_op = 10; // 源码比较符, 仅允许"<"、"<="、">"、">="或区间分段说明
  sint64 raw_threshold = 11; // 源码比较阈值; 分段判定可在parameter_list记录各阈值
  uint64 rng_draw_index = 12; // 本场内部确定性随机流的抽取序号; 不足以反推出种子
  CombatLuckUsage luck_usage = 13; // 本次判定实际读取的运气种类; 不读取运气时为None
  CombatLuckSnapshot luck_snapshot = 14; // 判定发生时的完整输入; luck_usage为None时为空
}

// CombatAssetDelta 描述资源变化前值、变化量和变化后值.
message CombatAssetDelta {
  CombatAssetType asset_type = 1; // 资源类型
  uint64 before = 2; // 变化前权威值
  sint64 delta = 3; // 变化量; 扣减为负数, 增加为正数
  uint64 after = 4; // 变化后权威值
  uint64 max_after = 5; // 变化后的上限; 没有变化或没有上限时为 0
}

// CombatStatusDelta 描述状态变化及其变化前后完整值.
message CombatStatusDelta {
  CombatStatusChangeType change_type = 1; // 状态变化类型
  CombatStatusSnapshot before = 2; // 变化前状态; 新增状态时为空
  CombatStatusSnapshot after = 3; // 变化后状态; 移除或到期时为空
}

// CombatPositionDelta 描述单位站位变化.
message CombatPositionDelta {
  CombatPosition before = 1; // 变化前站位
  CombatPosition after = 2; // 变化后站位
}

// CombatPoseDelta 描述单位姿态变化.
message CombatPoseDelta {
  CombatPose before = 1; // 变化前姿态
  CombatPose after = 2; // 变化后姿态
}

// CombatUnitStateDelta 汇总一个效果对单个单位造成的全部状态变化.
message CombatUnitStateDelta {
  CombatUnitKey unit = 1; // 状态发生变化的单位
  repeated CombatAssetDelta asset_delta_list = 2; // HP、MP、怒气等变化
  repeated CombatStatusDelta status_delta_list = 3; // 中毒、石化、守护等状态变化
  CombatPositionDelta position_delta = 4; // 站位变化; 没有变化时为空
  CombatPoseDelta pose_delta = 5; // 姿态变化; 没有变化时为空
  bool alive_changed = 6; // alive_before/alive_after 是否有效
  bool alive_before = 7; // 变化前存活状态
  bool alive_after = 8; // 变化后存活状态
  bool visible_changed = 9; // visible_before/visible_after 是否有效
  bool visible_before = 10; // 变化前是否可见
  bool visible_after = 11; // 变化后是否可见
  repeated CombatRuntimeAttributeDelta runtime_attribute_delta_list = 12; // 攻防敏、抗性、命中和顺序修正变化
  repeated CombatEquipmentDelta equipment_delta_list = 13; // 装备耐久、破损、移除、偷窃或修复
  bool appearance_changed = 14; // appearance_id_before/after 是否有效
  uint32 appearance_id_before = 15; // 变身或落马前形象
  uint32 appearance_id_after = 16; // 变身或落马后形象
  CombatUnitKey protector_before = 17; // 忠犬/舍己保护关系变化前的保护者
  CombatUnitKey protector_after = 18; // 忠犬/舍己保护关系变化后的保护者
}

// CombatDamageFormulaTrace 按8.5源码赋值点保存单个目标的伤害计算审计数据.
// 各after_*值已经包含该阶段发生的C语言整数截断. 客户端不得用本消息重新计算伤害.
message CombatDamageFormulaTrace {
  sint64 attack_value = 1; // 骑乘合成、技能临时修正后进入BATTLE_DamageCalc的攻击值
  sint64 defense_value = 2; // 0.70、防墙、敌方浮动、石化、悔恨、无视防御后的防御值
  uint32 skill_ratio_basis_points = 3; // 技能临时攻击倍率; 10000表示100%
  sint64 element_numerator = 4; // 元素矩阵和场地修正前后值可在operation_list逐项记录
  sint64 random_draw = 5; // 分段基础伤害使用的RAND结果或K0
  uint32 guard_ratio_basis_points = 6; // 防御随机档位0/1000/2000/3000/4000/5000
  uint32 critical_ratio_basis_points = 7; // 仅记录暴击标志所用倍率语义; 近战实际追加值见operation_list
  uint32 segment_damage_divisor = 8; // 连续攻击、狂暴、栗子等gDamageDiv; 疯狂暴走为1
  uint32 action_attack_count = 9; // 本主动动作计划物理段数
  string base_branch = 10; // defense_gt_attack、near_equal或attack_ge_defense_8_div_7
  sint64 base_damage = 11; // 分段基础公式刚完成后的int值
  sint64 after_element = 12; // BATTLE_AttrAdjust后的int值
  sint64 after_boundary = 13; // 地/水/火/风结界首个匹配分支后的int值
  sint64 extra_power_delta = 14; // RAND(apower*0.3,apower)-RAND(dpower*0.3,dpower)
  sint64 after_extra_power = 15; // 追加攻防值并下限0后的int值
  sint64 after_critical = 16; // 近战暴击追加目标防御*攻击等级/防守等级*0.5后的int值; 弓等于普通伤害
  sint64 after_guard = 17; // 防御档位或破防倍率后的int值
  sint64 after_arrange = 18; // 装备Arrange成功时乘0.1后的int值
  sint64 after_damage_divisor = 19; // gDamageDiv除法并至少为1后的int值
  sint64 final_damage = 20; // 反应、友伤限制和全局伤害倍率前本目标最终物理值
  repeated CombatRuleValue operation_list = 21; // 严格按源码顺序记录无法固定成字段的中间赋值
}

// CombatMagicDamageFormulaTrace 保存 _FIX_MAGICDAMAGE 分支的一次普通攻击魔法伤害计算.
// double字段保存源码float变量完成赋值后的值; int字段保存C语言向0截断后的值. 客户端只用于调试展示, 不得重算伤害.
message CombatMagicDamageFormulaTrace {
  uint32 spell_element = 1; // 0=地、1=水、2=火、3=风, 与CHAR_EARTH_EXP偏移和FieldAttr一致
  sint32 configured_power = 2; // magic option第二段Power
  sint32 configured_magic_level = 3; // magic option第三段MagicLv
  sint32 attacker_magic_level = 4; // 玩家/宠物取对应EXP, 敌人取int(level*0.9)
  sint32 defender_resist_base = 5; // 玩家/宠物取对应RESIST, 敌人取int(level*0.5)
  sint32 defender_equipment_resist = 6; // 玩家 CHAR_EQUITDEFMAGIC_E+element; 其他单位为0
  sint32 defender_resist_before_status = 7; // base+equipment
  sint32 defender_status_percent = 8; // DEFMAGICSTATUS生效时的CHAR_OTHERSTATUSNUMS, 否则0
  sint32 defender_resist_final = 9; // 正抗性按resist += resist*percent/100并截断后的值
  uint32 true_magic_draw = 10; // 整个施法动作只取一次rand()%100, 所有目标共用
  bool true_magic = 11; // true_magic_draw<=attacker_magic_level
  double k_magic = 12; // max(attacker_magic_level*1.4-defender_resist_final,0)完成float赋值后的值
  double m_magic = 13; // max(float(attacker_magic_level),1)
  double amplitude_before_random = 14; // k_magic^2/m_magic^2
  uint32 amplitude_random_draw = 15; // 当前目标独立rand()%20, 对应0.00到0.19
  double amplitude_after_random = 16; // amplitude_before_random+draw/100.0
  sint32 attack_power_before_element = 17; // int(Power*(1+MagicLv/10.0)*amplitude_after_random)
  repeated sint32 attacker_element_before_spell_list = 18; // 地、水、火、风、无五项, 骑乘时四属性取人物与骑宠平均
  repeated sint32 attacker_element_after_spell_list = 19; // 指定元素改为MagicLv*10+(MagicLv*10)*(原元素/50), 其余四属性按源码保留/清零
  repeated sint32 defender_element_list = 20; // 地、水、火、风、无五项
  double attacker_field_power = 21; // BATTLE_FieldAttAdjust攻击侧结果
  double defender_field_power = 22; // BATTLE_FieldAttAdjust防守侧结果
  sint32 after_element_matrix = 23; // BATTLE_AttrCalc后的int值
  sint32 after_field_power = 24; // int(after_element_matrix*attacker_field_power/defender_field_power)
  sint32 after_true_magic = 25; // TrueMagic失败时再做int(value*0.7), 成功时不变
  uint32 mount_character_ratio_tenths = 26; // 无骑宠为10; 无属性为5; 其他按元素效果计算并限制2到8
  sint32 planned_character_damage = 27; // int(after_true_magic*ratio/10), 即客户端展示的人物计划伤害
  sint32 planned_pet_damage = 28; // 进入扣血分支前的剩余伤害
  sint32 actual_character_hp_delta = 29; // 实际人物HP变化, 通常为负数
  sint32 actual_pet_hp_delta = 30; // 实际骑宠HP变化, 通常为负数; 保留人物HP不足时源码负剩余放大的怪癖
  repeated CombatRuleValue operation_list = 31; // 其余源码赋值点、场地矩阵项和骑乘溢出中间值
}

// CombatProfessionMagicFormulaTrace 保存职业魔法主流程的功率、闪避、抗性和最终伤害.
// 物理型回旋/贯穿在进入BATTLE_DamageCalc后仍使用formula_trace, 本消息记录其职业前置修正.
message CombatProfessionMagicFormulaTrace {
  uint32 raw_skill_level = 1; // CHAR_WORKBATTLECOM3高16位原始熟练度
  uint32 converted_skill_grade = 2; // PROFESSION_CHANGE_SKILL_LEVEL_M/A转换后的0到10级
  sint32 base_power = 3; // PROFESSION_MAGIC_GET_PRACTICE按技能分支得到的基础hp_power
  uint32 base_power_critical_draw = 4; // 火山泉等功率暴击使用的RAND(1,100), 不等于物理暴击
  sint32 suit_magic_power_percent = 5; // _SUIT_ADDENDUM的CHAR_WORKMPOWER
  bool suit_part4_triggered = 6; // rand()%100<30时为true
  sint32 suit_part4_magic_power_percent = 7; // _SUIT_ADDPART4的CHAR_WORKMPOWER2
  uint32 power_variance_draw = 8; // RAND(98,102)
  sint32 power_after_variance = 9; // float hp_power完成套装和98%-102%浮动后赋给int power的值
  uint32 magic_type = 10; // 0=无、1=火、2=雷、3=冰; Doom按火雷冰三次计算后取平均
  sint32 attacker_proficiency = 11; // 对应火/雷/冰熟练度
  sint32 defender_resist = 12; // 对应火/雷/冰抗性
  sint32 defender_suit_resist = 13; // 通用套装抗性加对应装备抗性
  sint32 defender_spirit_resist = 14; // 对应抗性精灵存在时的CHAR_OTHERSTATUSNUMS
  double damage_before_truncation = 15; // power*(1+熟练/100)*(1-抗性/100)*(1-套装/100)*(1-精灵/100)
  sint32 damage_after_truncation = 16; // 单元素int结果或Doom三元素int累加后再除3的结果, 最低0
  uint32 dodge_draw = 17; // PROFESSION_MAGIC_DODGE的RAND(1,100)
  sint32 dodge_threshold = 18; // int(幸运、抗性、抗魔装备、攻击熟练度修正后的fLuck)
  bool primary_dodge = 19; // dodge_draw<=dodge_threshold; 地球一周目标直接为true
  uint32 forced_hit_draw = 20; // Current/Storm、FireSpear/Doom、Sign在主判定命中后追加的RAND(1,100), 无则0
  bool final_hit = 21; // 包含主闪避和特殊技能二次命中门槛后的最终结果
  sint32 special_power_before_resist = 22; // 冰镜、回旋、贯穿、水附体三倍和抗法装备处理后的power
  sint32 final_damage = 23; // 本目标最终职业伤害
  repeated CombatRuleValue operation_list = 24; // Doom三元素分量、目标裁剪、状态追加和特殊技能中间值
}

// CombatRecoveryFormulaTrace 保存8.5恢复和复活的配置值、随机值及骑乘分配.
message CombatRecoveryFormulaTrace {
  sint32 configured_power = 1; // option/ITEM_ARGUMENT解析出的power
  bool percent_mark_present = 2; // 原参数是否含百分号
  bool percent_applied = 3; // 当前启用_MAGIC_REHPAI时普通HP恢复为false; 复活非0power也会被后续RAND覆盖
  bool zero_power_full_recovery = 4; // 复活power==0时直接恢复到最大HP
  sint32 random_min = 5; // int(power*0.9)
  sint32 random_max = 6; // int(power*1.1)
  sint32 random_draw = 7; // RAND(random_min,random_max)
  uint64 target_max_value = 8; // HP或MP上限
  uint64 character_missing_hp = 9; // 骑乘HP恢复时人物缺血
  uint64 pet_missing_hp = 10; // 骑乘HP恢复时骑宠缺血
  uint32 character_allocation_percent = 11; // _MAGIC_REHPAI: missing/(character_missing+pet_missing)*100的int值
  sint32 requested_character_amount = 12; // 上限截断前分给人物的值
  sint32 requested_pet_amount = 13; // 上限截断前分给骑宠的值
  sint32 effective_character_amount = 14; // 实际人物恢复值
  sint32 effective_pet_amount = 15; // 实际骑宠恢复值
  repeated CombatRuleValue operation_list = 16; // 其他配置解析、上限和兼容性赋值点
}

// CombatHitTargetResult 保存一次攻击对一个原始目标的完整命中结果.
message CombatHitTargetResult {
  CombatUnitKey original_target_unit = 1; // 技能原本选中的目标
  CombatUnitKey actual_target_unit = 2; // 最终承受效果的目标; 忠犬触发时与原目标不同
  CombatUnitKey protector_unit = 3; // 忠犬或守护单位; 没有代替承伤时为空
  repeated CombatHitResult hit_result_list = 4; // 可组合的普通、暴击、闪避、击飞、击倒等结果
  CombatDamageType damage_type = 5; // 伤害来源类型
  uint64 raw_damage = 6; // 暴击、守护、吸收等修正前的服务端计算伤害
  uint64 final_damage = 7; // 实际扣除的 HP
  uint64 absorbed_damage = 8; // 被守护精灵、护盾等吸收的伤害
  uint64 reflected_damage = 9; // 镜子精灵等反射给来源方的伤害
  uint64 hp_before = 10; // 实际承伤单位扣血前 HP
  uint64 hp_after = 11; // 实际承伤单位扣血后 HP
  bool alive_before = 12; // 实际承伤单位命中前是否存活
  bool alive_after = 13; // 实际承伤单位命中后是否存活
  bool stop_remaining_segment = 14; // 本次结果是否终止当前动作后续攻击段
  repeated CombatRandomCheck check_list = 15; // 命中、暴击、守护、反射等已完成判定
  CombatDamageFormulaTrace formula_trace = 16; // 可选伤害公式审计数据
  LegacyDamageReaction damage_reaction = 17; // 本段实际采用的光、镜、守、陷阱或针刺反应
  uint32 damage_reaction_charge_before = 18; // 本段触发前剩余次数; 一次性陷阱/针刺通常为 1
  uint32 damage_reaction_charge_after = 19; // 本段触发后剩余次数
  bool loyal_guard_check_bypassed = 20; // 合击成员为 true, 表示旧服规则明确跳过忠犬替身
  bool dodge_check_bypassed = 21; // 合击成员为 true, 表示没有执行闪避随机判定, 不是“判定后未闪避”
  CombatUnitKey reflected_to_unit = 22; // 镜或针刺最终反伤单位; 没有反伤时为空
  repeated CombatDamageAllocation damage_allocation_list = 23; // 人、骑宠、保护者和反伤接收者的实际扣血分配
  uint32 selected_damage_reaction_priority = 24; // 被选中反应在 rule.damage_reaction_priority_list 中的序号, 从 1 开始
  repeated uint32 rule_decision_id_list = 25; // 本目标命中的防御、保护、反应和伤害规则判断
  LegacyAttackReturn legacy_attack_return = 26; // 旧 BATTLE_RET_* 主判定
  int32 raw_legacy_attack_return = 27; // 条件编译版本的原始返回值, 用于回放审计
  uint32 legacy_bcf_flag = 28; // 旧 BCF_* 位图原值; repeated hit_result_list 是客户端应使用的结构化语义
  CombatMagicDamageFormulaTrace magic_formula_trace = 29; // 普通攻击魔法的可选数值审计数据
  CombatProfessionMagicFormulaTrace profession_magic_formula_trace = 30; // 职业魔法或职业物理前置计算审计数据
}

// CombatDamageDetail 保存一次伤害效果对一个或多个目标的完整结果.
message CombatDamageDetail {
  repeated CombatHitTargetResult target_result_list = 1; // 按服务端结算顺序排列的目标结果
}

// CombatHealDetail 保存一次治疗或资源恢复效果.
message CombatHealDetail {
  CombatAssetType asset_type = 1; // 被恢复的资源类型
  uint64 requested_amount = 2; // 上限截断前的恢复量
  uint64 effective_amount = 3; // 实际增加量
  bool critical = 4; // 是否为暴击治疗
  CombatRecoveryFormulaTrace formula_trace = 5; // 8.5恢复、骑乘分配或复活恢复量审计数据
}

// CombatMotionDetail 保存一次逻辑移动和站位变化.
message CombatMotionDetail {
  CombatMotionType motion_type = 1; // 移动原因
  CombatUnitKey moving_unit = 2; // 移动单位
  CombatUnitKey target_unit = 3; // 接近、击退等动作关联的目标
  CombatPosition from_position = 4; // 移动前位置
  CombatPosition to_position = 5; // 移动后位置
}

// CombatStatusDetail 保存一次状态效果的服务端判定结果.
message CombatStatusDetail {
  CombatUnitKey target_unit = 1; // 状态目标
  CombatStatusDelta status_delta = 2; // 状态变化
  repeated CombatRandomCheck check_list = 3; // 状态命中、抵抗或免疫判定
  uint32 source_skill_id = 4; // 产生、刷新或移除状态的技能ID; 系统效果为0
  CombatStatusApplyResult apply_result = 5; // 成功、覆盖、组冲突、概率失败、抵抗或免疫
  CombatStatusExclusiveGroup exclusive_group = 6; // 本次检查的互斥组
  CombatStatusStackPolicy stack_policy = 7; // 同状态或同组状态再次施加时采用的规则
  CombatStatusSnapshot existing_status = 8; // 拒绝或覆盖前已经存在的状态
  CombatStatusSnapshot requested_status = 9; // 本次技能试图施加的状态及持续值
  CombatStatusSnapshot resulting_status = 10; // 判定后实际保留的状态; 冲突失败时等于existing_status
  bool visual_effect_played_before_conflict_check = 11; // 旧 MultiStatusChange 可先播魔法效果再发现状态冲突
  repeated uint32 rule_decision_id_list = 12; // 状态互斥、概率、抗性和覆盖规则判断
}

// CombatEscapeDetail 保存逃跑计算和结果.
message CombatEscapeDetail {
  CombatUnitKey unit = 1; // 尝试逃跑的单位
  uint32 success_rate_basis_points = 2; // 服务端计算成功率
  uint32 random_roll_basis_points = 3; // 本次随机值
  bool success = 4; // 是否成功
  repeated CombatUnitKey leave_unit_list = 5; // 成功后随同离场的角色、宠物或队友
  uint32 attempt_count = 6; // 本场第几次逃跑尝试; 旧服会随尝试次数提高成功率
  bool pvp_forced_success = 7; // PVP 分支是否直接成功而未使用普通等级公式
  uint32 source_level = 8; // 参与公式的自身等级
  uint32 enemy_average_level = 9; // 参与公式的敌方平均等级
  sint32 source_effective_luck = 10; // 参与公式的CHAR_WORKFIXLUCK有效运气, 已含装备修正并限制在1-5
  CombatActionResult failure_reason = 11; // 失败或被禁止原因; 成功时为 Success/Escaped
  repeated CombatRuleValue formula_parameter_list = 12; // 旧服公式的其余实参和中间值
}

// CombatCaptureDetail 保存捕获计算和结果.
message CombatCaptureDetail {
  CombatUnitKey source_unit = 1; // 发起捕获的单位
  CombatUnitKey target_unit = 2; // 被捕获目标
  uint32 success_rate_basis_points = 3; // 服务端计算成功率
  uint32 random_roll_basis_points = 4; // 本次随机值
  bool success = 5; // 是否成功
  uint64 captured_pet_uuid = 6; // 成功后创建的宠物 UUID; 尚未持久化时为 0
  uint32 captured_pet_id = 7; // 捕获后的宠物资源 ID
  bool target_has_pet_flag = 8; // 目标是否允许成为宠物; false 时不进入概率公式
  bool level_requirement_met = 9; // 默认要求来源等级+5>=目标等级
  uint32 source_level = 10; // 捕获者等级
  uint32 target_level = 11; // 目标等级
  uint64 target_hp = 12; // 判定时目标 HP
  uint64 target_max_hp = 13; // 判定时目标最大 HP; 旧服公式使用 HP 比例平方
  sint32 source_effective_luck = 14; // 捕获者CHAR_WORKFIXLUCK有效运气, 已含装备修正并限制在1-5
  sint32 source_charm = 15; // 捕获者魅力
  repeated uint32 required_item_id_list = 16; // 特殊怪物要求持有的前置物品
  repeated CombatInventoryDelta inventory_delta_list = 17; // 捕获成功后实际消耗的前置物品
  CombatActionResult failure_reason = 18; // 非宠物、等级不足、物品不足、背包满、概率失败等结果
  repeated CombatRuleValue formula_parameter_list = 19; // 基础捕获率、倍率、上限和公式中间值
}

// CombatItemDetail 保存道具使用和库存变化.
message CombatItemDetail {
  uint32 item_id = 1; // 道具资源 ID
  uint32 inventory_slot = 2; // 使用时背包槽位
  uint32 used_count = 3; // 本次消耗数量
  uint32 remaining_count = 4; // 使用后剩余数量
  bool success = 5; // 道具是否成功生效
  repeated CombatInventoryDelta inventory_delta_list = 6; // 消耗、投掷、偷窃或转移产生的完整背包变化
  repeated CombatEquipmentDelta equipment_delta_list = 7; // 道具同时影响装备耐久或装备槽时填写
  CombatActionResult failure_reason = 8; // 道具被禁止、目标非法或未生效的结构化原因
  LegacyBattleItemHandler legacy_handler = 9; // 8.5 battle_item.c实际进入的处理器
  string raw_argument = 10; // 本次权威item实例的ITEM_ARGUMENT快照, 用于审计配置解析
  uint32 magic_id = 11; // 道具施法或新光镜守关联的magic ID, 无则0
  uint32 durability_before = 12; // ITEM_DAMAGEBREAK调用前值; 非耐久道具为0
  uint32 durability_after = 13; // 调用后值; 旧服大于0时减1, 否则删除道具
}

// CombatPetSwitchDetail 保存收回、派出或替换宠物的完整结果.
message CombatPetSwitchDetail {
  CombatPetSwitchOperation operation = 1; // 收回、派出或组合替换
  CombatUnitKey owner_unit = 2; // 操作宠物的玩家角色
  CombatUnitKey outgoing_pet_unit = 3; // 被收回的当前宠物; 仅派出时可为空
  CombatUnitKey incoming_pet_unit = 4; // 新派出的宠物; 仅收回时可为空
  uint32 selected_pet_slot = 5; // BATTLE_COM_PETOUT 提交的宠物栏编号
  bool selected_state_valid = 6; // 该栏是否处于 PET_STAT_SELECT
  bool outgoing_no_return = 7; // 当前宠物是否带 CHAR_BATTLEFLG_NORETURN
  bool transform_restored_on_recall = 8; // 收回流程是否恢复狼人、狐狸等基础形象和属性
  bool success = 9; // 切换是否实际完成
  CombatActionResult failure_reason = 10; // PetUnavailable、BlockedByStatus 等失败原因
}

// CombatFieldDetail 保存场地状态变化.
message CombatFieldDetail {
  CombatFieldChangeType change_type = 1; // 变化类型
  CombatFieldState before = 2; // 变化前场地状态
  CombatFieldState after = 3; // 变化后场地状态
}

// CombatUnitLifecycleDetail 保存单位进场、离场、死亡、复活或变身结果.
message CombatUnitLifecycleDetail {
  CombatUnitKey unit = 1; // 发生生命周期变化的单位
  CombatEffectKind lifecycle_effect = 2; // UnitEnter、UnitLeave、Death、Revive、Vanish 或 Transform
  uint32 appearance_id_after = 3; // 变化后形象资源 ID; 未变化时为 0
  uint64 hp_before = 4; // 死亡、复活或离场前HP
  uint64 hp_after = 5; // 死亡、复活或离场后HP
  CombatRecoveryFormulaTrace recovery_formula_trace = 6; // Revive时的恢复量和8.5百分号覆盖怪癖
}

// CombatTextDetail 保存服务端不可由结构化字段替代的文本提示.
message CombatTextDetail {
  string text_key = 1; // 客户端本地化 key
  repeated string argument_list = 2; // 本地化参数
  string fallback_text = 3; // 客户端没有对应 key 时使用的后备文本
}

// CombatKnockbackDetail 明确描述击飞/击退的逻辑位置和最终状态.
message CombatKnockbackDetail {
  CombatUnitKey source_unit = 1; // 造成击飞的单位
  CombatUnitKey target_unit = 2; // 被击飞单位
  CombatPosition from_position = 3; // 击飞前位置
  CombatPosition to_position = 4; // 服务端确认的落点或离场方向位置
  bool leaves_battle = 5; // 是否因击飞直接离场
  bool defeated_after_landing = 6; // 落地后是否处于击倒/死亡状态
}

// CombatKnockdownDetail 处理“攻击者走到目标面前后被反击击倒”的特殊表现.
// 当 return_home_before_fall=true 时, 客户端必须先播放 ReturnHome, 再在 home_position 播放 Knockdown.
message CombatKnockdownDetail {
  CombatUnitKey source_unit = 1; // 造成击倒的单位; 反击场景通常是原被攻击者
  CombatUnitKey target_unit = 2; // 被击倒单位; 反击场景通常是走到对方面前的原攻击者
  CombatPosition impact_position = 3; // 逻辑上受到击倒效果时所在位置
  CombatPosition home_position = 4; // 该动作开始前的原站位
  bool target_was_away_from_home = 5; // 命中时目标是否正在别人面前
  bool return_home_before_fall = 6; // 是否必须先回原位再倒地; 用户描述的反击击倒场景应为 true
  CombatPose final_pose = 7; // 回原位后的最终姿态, 通常为 Knockdown 或 Dead
}

// CombatAttackSequenceDetail 汇总多段技能的物理攻击模型.
// 三段/十段仍是多次物理攻击调用, 每段可有不同有效攻击力并独立判定命中、暴击和伤害反应.
// 但反击循环位于整个主动动作之后, 所有段共用 max_counter_count_per_action, 不是每段各自拥有上限.
message CombatAttackSequenceDetail {
  uint32 planned_segment_count = 1; // 计划段数, 例如三段为 3、十段为 10
  uint32 executed_segment_count = 2; // 因死亡、失去目标或中断后实际完成段数
  uint32 damage_divisor = 3; // 连续攻击/狂暴/栗子通常等于段数; 疯狂暴走等旧流程可能为 1
  bool independent_hit_check_per_segment = 4; // 每段是否独立命中/闪避判定
  bool independent_critical_check_per_segment = 5; // 每段是否独立暴击判定
  bool independent_damage_reaction_per_segment = 6; // 每段是否重新检查并消耗光、镜、守、陷阱或针刺
  bool counter_checked_after_whole_sequence = 7; // 旧服普通多段动作应为 true
  repeated uint32 segment_event_id_list = 8; // 按结算顺序引用每一段 AttackSegment 事件
}

// CombatCounterChainDetail 汇总主动攻击之后的完整反击链.
message CombatCounterChainDetail {
  uint32 configured_max_counter_count = 1; // 旧服物理攻击动作通常为 5
  uint32 actual_counter_count = 2; // 本动作实际发生的反击总次数
  uint32 deepest_counter_depth = 3; // 最大嵌套深度; 1=反击, 2=反击的反击
  repeated uint32 counter_event_id_list = 4; // 按实际顺序引用全部 Counter 事件
  bool stopped_by_limit = 5; // 是否因达到上限停止, 而非死亡、失去目标或未触发
  repeated uint32 rule_decision_id_list = 6; // 反击资格、概率、死亡中断和全动作共享上限判断
}

// CombatComboMemberResult 保存一个合击成员自己的攻击结果索引和关键判定.
// 完整伤害仍位于 attack_event_id 对应事件的 CombatDamageDetail, 避免重复两份权威数值.
message CombatComboMemberResult {
  uint32 member_order = 1; // 合击中的出手顺序, 从 1 开始; 旧服沿敏捷排序后的 EntryList 顺序
  CombatUnitKey member_unit = 2; // 当前合击成员
  uint32 attack_event_id = 3; // 该成员独立 BATTLE_AttackSeq 对应的事件
  CombatActionResult action_result = 4; // 当前成员攻击是否完成
  bool critical = 5; // 当前成员本次是否暴击; 每个成员独立计算
  LegacyDamageReaction damage_reaction = 6; // 当前成员触发的光、镜、守、陷阱或针刺
  bool stopped_combo_after_member = 7; // 当前成员结算后是否因目标或攻击者 HP<=0 终止剩余成员
}

// CombatComboDetail 描述由多个“普通攻击意图”合并出的合击.
message CombatComboDetail {
  CombatUnitKey target_unit = 1; // 所有参与者共同选择的目标
  repeated CombatComboMemberResult member_result_list = 2; // 严格按出手顺序排列
  bool all_members_selected_normal_attack = 3; // 旧服成立合击的必要条件
  bool dodge_check_skipped = 4; // 旧服必须为 true: 合击不会进入普通 Dodge 分支
  bool loyal_guard_check_skipped = 5; // 旧服必须为 true: 合击不触发忠犬替目标承伤
  bool target_defense_applied = 6; // 目标选择防御时仍参与每个成员的伤害计算
  bool damage_reaction_rechecked_per_member = 7; // 每人重新检查光、镜、守、陷阱、针刺; 一层效果通常只挡/反首人
  bool stopped_early = 8; // 是否在全部成员执行前停止
  string stop_reason = 9; // 例如 target_defeated、member_defeated 或 target_invalid
  repeated uint32 rule_decision_id_list = 10; // 合击组建、不可闪避、跳过忠犬和提前停止规则判断
}

// CombatEffect 是事件内部按 sequence 排列的最小逻辑结算单元.
message CombatEffect {
  uint32 effect_id = 1; // 所属事件内唯一 ID, 从 1 开始
  uint32 sequence = 2; // 所属事件内结算顺序, 从 1 开始
  CombatEffectKind effect_kind = 3; // 效果类型
  repeated CombatUnitKey source_unit_list = 4; // 效果来源单位
  repeated CombatUnitKey target_unit_list = 5; // 效果目标单位
  repeated CombatUnitStateDelta unit_state_delta_list = 6; // 该效果产生的全部权威状态差量

  oneof detail {
    CombatDamageDetail damage = 20; // 伤害详情
    CombatHealDetail heal = 21; // 治疗详情
    CombatMotionDetail motion = 22; // 移动详情
    CombatStatusDetail status = 23; // 状态详情
    CombatEscapeDetail escape = 24; // 逃跑详情
    CombatCaptureDetail capture = 25; // 捕获详情
    CombatItemDetail item = 26; // 道具详情
    CombatFieldDetail field = 27; // 场地详情
    CombatUnitLifecycleDetail lifecycle = 28; // 单位生命周期详情
    CombatTextDetail text = 29; // 文本详情
    CombatKnockbackDetail knockback = 30; // 击飞/击退详情
    CombatKnockdownDetail knockdown = 31; // 击倒及“回原位后倒地”详情
    CombatRuntimeAttributeDelta attribute = 32; // 单项运行期属性变化详情
    CombatEquipmentDelta equipment = 33; // 单项装备或耐久变化详情
    CombatInventoryDelta inventory = 34; // 单项背包数量或转移详情
    CombatActionRewriteDetail action_rewrite = 35; // 服务端动作改写详情
    CombatTargetResolutionDetail target_resolution = 36; // 声明目标到最终目标详情
    CombatRoundPhaseDetail round_phase = 37; // 回合阶段边界详情
    CombatRuleDecision rule_decision = 38; // 独立规则判断详情
    CombatPetSwitchDetail pet_switch = 39; // 宠物收回、派出或替换详情
  }
}

// CombatEvent 表示一次主动动作节点或由其触发的衍生事件.
message CombatEvent {
  uint32 event_id = 1; // 本回合内唯一事件 ID, 从 1 开始
  uint32 parent_event_id = 2; // 直接触发本事件的父事件; 顶层事件为 0
  uint32 root_event_id = 3; // 所属主动动作的根事件; 顶层事件等于自身 event_id
  uint32 sequence = 4; // 本回合全局逻辑结算顺序, 从 1 开始
  CombatEventKind event_kind = 5; // 事件业务类型
  uint64 action_instance_id = 6; // 同一个主动动作及其全部衍生事件共享的实例 ID
  CombatActionType action_type = 7; // 主动动作类型
  uint32 action_id = 8; // 动作、魔法、道具或技能 ID
  CombatActionResult action_result = 9; // 本事件最终执行结果
  repeated CombatUnitKey source_unit_list = 10; // 事件来源; 合击可包含多个单位
  repeated CombatUnitKey target_unit_list = 11; // 事件实际目标
  uint32 segment_index = 12; // 多段攻击当前段序号, 从 1 开始; 非多段为 0
  uint32 segment_count = 13; // 计划攻击总段数; 非多段为 0
  uint32 counter_depth = 14; // 反击深度; 主动攻击为 0, 反击为 1, 反击的反击为 2
  uint32 counter_index = 15; // 本主动动作整条触发链中的第几次反击, 从 1 开始
  bool stop_remaining_segment = 16; // 是否终止当前主动动作剩余攻击段
  repeated CombatRandomCheck check_list = 17; // 事件级反击、逃跑、捕获等判定
  repeated CombatEffect effect_list = 18; // 按 sequence 结算的逻辑效果
  uint32 skill_id = 19; // 本事件采用的技能ID; 反击继承根动作或为0表示普通反击
  CombatAttackSequenceDetail attack_sequence = 20; // 多段攻击根事件的段数、分摊和独立判定规则
  CombatComboDetail combo = 21; // 合击根事件的参与者顺序和逐人结果
  uint32 combo_member_order = 22; // 合击子攻击中的成员序号; 非合击为 0
  uint32 combo_root_event_id = 23; // 合击子攻击指向 Combo 根事件; 非合击为 0
  repeated CombatRuleDecision rule_decision_list = 24; // 本事件实际执行的规则判断, 按 decision_id 排列
  CombatRoundPhaseDetail round_phase = 25; // RoundPhase 事件对应的阶段边界
  CombatActionRewriteDetail action_rewrite = 26; // IntentRewrite 事件对应的前后动作
  CombatTargetResolutionDetail target_resolution = 27; // TargetResolve 事件对应的目标解析
  string legacy_command_fragment = 30; // 可选旧服 BB/BD/BE 等原始片段, 仅用于兼容和排查
  uint32 legacy_flag = 31; // 可选旧服 f 位图原值, 客户端逻辑不得依赖
  int32 legacy_command_code = 32; // 实际 BATTLE_COM_* 数值; 因条件编译改变序号, 仅用于对应旧源码
  string legacy_command_name = 33; // BATTLE_COM_* 符号名, 用于在源码中直接检索处理分支
}

// CombatActionSummary 汇总一个主动动作的计划段数、实际段数和反击总数.
message CombatActionSummary {
  uint64 action_instance_id = 1; // 主动动作实例 ID
  uint32 root_event_id = 2; // 对应根事件 ID
  CombatUnitKey source_unit = 3; // 主动出手单位
  CombatActionType action_type = 4; // 动作类型
  uint32 action_id = 5; // 动作或技能 ID
  uint32 planned_segment_count = 6; // 计划攻击段数
  uint32 executed_segment_count = 7; // 实际完成段数
  uint32 counter_count = 8; // 整个主动动作触发链实际反击总次数
  bool interrupted = 9; // 是否因死亡、击倒、无目标等提前中断
  CombatActionResult result = 10; // 主动动作最终结果
  CombatAttackSequenceDetail attack_sequence = 11; // 多段攻击汇总; 普通单击可填写段数 1
  CombatCounterChainDetail counter_chain = 12; // 整个动作共用的反击链; 3 段和 10 段都不会把上限乘以段数
  CombatComboDetail combo = 13; // 合击汇总; 非合击为空
  repeated CombatUnitKey combo_source_unit_list = 14; // 合击全部参与者; source_unit 可保留第一个成员
  CombatActionRewriteDetail action_rewrite = 15; // 本主动动作在执行前发生的服务端改写
  CombatTargetResolutionDetail target_resolution = 16; // 本主动动作声明目标到最终目标的解析
  repeated uint32 rule_decision_id_list = 17; // 影响本主动动作的全部规则判断
}

// CombatRewardAsset 保存战斗结束产生的一项数值奖励.
message CombatRewardAsset {
  CombatAssetType asset_type = 1; // 奖励资源类型
  uint64 amount = 2; // 奖励数量
}

// CombatRewardItem 保存战斗结束产生的一项道具奖励.
message CombatRewardItem {
  uint32 item_id = 1; // 道具资源 ID
  uint32 count = 2; // 获得数量
}

// CombatRewardPet 保存捕获或奖励获得的宠物.
message CombatRewardPet {
  uint64 pet_uuid = 1; // 持久化后的宠物 UUID
  uint32 pet_id = 2; // 宠物资源 ID
  uint32 level = 3; // 获得时等级
}

// CombatUnitReward 保存一个单位或角色获得的完整结算奖励.
message CombatUnitReward {
  CombatUnitKey unit = 1; // 奖励归属战斗单位
  repeated CombatRewardAsset asset_list = 2; // 经验、DP 等数值奖励
  repeated CombatRewardItem item_list = 3; // 道具奖励
  repeated CombatRewardPet pet_list = 4; // 捕获或奖励宠物
}

// CombatBattleSettlement 保存战斗最终胜负和奖励结果.
message CombatBattleSettlement {
  CombatBattleEndReason end_reason = 1; // 战斗结束原因
  CombatCamp winner_camp = 2; // 胜利阵营; 平局或中止时为 Unknown
  repeated CombatUnitKey winner_unit_list = 3; // 胜利单位
  repeated CombatUnitKey loser_unit_list = 4; // 失败单位
  repeated CombatUnitReward reward_list = 5; // 服务端最终确认的奖励
  uint64 settlement_timestamp_ms = 6; // 服务端结算时间
}

// CombatRoundResultNotify 是客户端表现并落地一个完整回合所需的唯一权威结果.
// event_list本身就是全局播放流; 每个事件内effect_list按sequence执行, 不再存在第二套表现步骤流.
message CombatRoundResultNotify {
  reserved 3;
  reserved "intent_list";

  string battle_id = 1; // 战斗唯一 ID
  uint32 round = 2; // 已结算回合号; 与现有协议一致
  bool battle_finished = 6; // 本回合是否在某个动作原子边界终止; 与现有协议字段号一致
  repeated CombatEvent event_list = 10; // 客户端按列表和事件内效果顺序播放并应用差量的唯一结果流
  CombatBattleSettlement settlement = 20; // battle_finished=true时携带; 与现有协议字段号一致
}

// CombatFlowCompleteReq 沿用现有协议: 仅在整场战斗动画播放完毕后提交, 不是逐回合确认.
message CombatFlowCompleteReq {
  uint64 character_uuid = 1; // 已完成客户端战斗流程的玩家角色UUID
}

// CombatFlowCompleteRes 确认服务端已接受客户端播放完成状态.
message CombatFlowCompleteRes {
  uint64 character_uuid = 1; // 服务端已确认流程完成的玩家角色UUID
}
