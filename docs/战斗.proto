  LegacyBattleStatus_Oblivion = 16; // 遗忘; 由同名职业技能产生, 按技能等级临时隐藏/禁用目标宠物技能
  LegacyBattleStatus_IceArrow = 17; // 冰箭; 由职业冰箭术产生, 命中后阻止目标行动
