syntax = "proto3";

package account;

option go_package = "server/proto/pb;pb";

// 本文件是8.5战斗系统的最终协议规格, 与 docs/战斗规则.md 共同构成实现权威.
// 机制、公式、判定顺序、整数截断、随机边界和兼容怪癖严格以8.5源码当前启用宏分支为准.
// Actor、Gateway、Online和客户端边界沿用当前项目; 不移植旧服进程模型和BB/BD/BE字符串协议.
// 本文件独立做protoc语法检查; 生产在线消息的字段必须与 server/proto/combat.proto 保持一致.
// 其余完整规则、状态、技能和判定结构用于服务端实现、测试及AI开发说明, 不会自动成为客户端字段.
// 正常网络协议只发送客户端动作ID、服务端有序事件/效果及必要差量, 不发送意图、随机种子、概率、公式输入或回放档案.
// 客户端只按 event_list 中的 CombatEffect 顺序播放并应用差量, 不重算命中、伤害、暴击、
// 反击、状态、目标、逃跑、捕获或胜负. 不发送回合末完整快照, 不存在独立表现步骤流.

// 旧服依据:
// - 8.5 gmsv/battle/battle.c: ComboCheck、BATTLE_Combo、BATTLE_AttackSeq、BATTLE_Attack 的动作顺序和反击链.
// - 8.5 gmsv/battle/battle_event.c: BATTLE_ST_*、BATTLE_MST_*、BATTLE_MD_* 状态表及光镜守反应优先级.
// - 8.5 gmsv/battle/pet_skill.c、profession_skill.c、magic/magic_base.c: 技能注册表和处理函数.
// - D:/csa_8.0/gmsv/setup.cf: petskillfile2=./data/petskill2.txt、magicfile=./data/magic.txt、profession=./data/profession.txt.
// - 8.0配置仅用于补全技能ID、名称和option目录; 与8.5行为冲突时一律以8.5源码为准.

// CombatCamp 标识战斗单位所属阵营.
enum CombatCamp {
  CombatCamp_Initiator = 0; // 发起战斗的一方; 与现有server/proto/combat.proto保持一致
  CombatCamp_Defender = 1; // 接受挑战或被遇到的一方; 与现有server/proto/combat.proto保持一致
  CombatCamp_Neutral = 2; // 中立单位或场地召唤物; 不能作为正常胜负阵营
}

// CombatBattleType 数值与8.5 include/battle.h的BATTLE_TYPE_*一致.
enum CombatBattleType {
  CombatBattleType_None = 0; // BATTLE_TYPE_NONE, 未创建战斗
  CombatBattleType_PlayerVsEnemy = 1; // BATTLE_TYPE_P_vs_E, 普通PVE或脚本PVE
  CombatBattleType_PlayerVsPlayer = 2; // BATTLE_TYPE_P_vs_P, 玩家对战
  CombatBattleType_EnemyVsEnemy = 3; // BATTLE_TYPE_E_vs_E, 敌方单位对战
  CombatBattleType_Watch = 4; // BATTLE_TYPE_WATCH, 观战镜像房间
  CombatBattleType_DuelPoint = 5; // BATTLE_TYPE_DP_BATTLE, DP战
  CombatBattleType_Boss = 6; // BATTLE_TYPE_BOSS_BATTLE, Boss战
}

// LegacyBattleMode 数值与8.5 BATTLE_MODE_*一致, 用于状态机迁移和源码对照.
enum LegacyBattleMode {
  LegacyBattleMode_None = 0; // 空闲战斗槽
  LegacyBattleMode_Init = 1; // BATTLE_Init初始化和先制判定
  LegacyBattleMode_Battle = 2; // 命令等待和回合执行
  LegacyBattleMode_Finish = 3; // 胜负、奖励、退出和删除
  LegacyBattleMode_Stop = 4; // 中止清理
  LegacyBattleMode_WatchBC = 5; // 观战初始化快照阶段
  LegacyBattleMode_WatchPre = 6; // 观战前置阶段
  LegacyBattleMode_WatchWait = 7; // 观战等待主战斗结果
  LegacyBattleMode_WatchMovie = 8; // 观战播放主战斗回合
  LegacyBattleMode_WatchAfter = 9; // 观战回合后处理
}

// LegacyBattleCharacterMode 数值与8.5 BATTLE_CHARMODE_*一致.
enum LegacyBattleCharacterMode {
  LegacyBattleCharacterMode_None = 0; // 不在战斗
  LegacyBattleCharacterMode_Init = 1; // 刚进入战斗
  LegacyBattleCharacterMode_CommandWait = 2; // 等待玩家命令
  LegacyBattleCharacterMode_CommandReady = 3; // 已提交或已生成命令
  LegacyBattleCharacterMode_Battle = 4; // 旧未使用中间态
  LegacyBattleCharacterMode_Rescue = 5; // 通过求援进入
  LegacyBattleCharacterMode_Final = 6; // 结束或退出中
  LegacyBattleCharacterMode_WatchInit = 7; // 观战初始化
  LegacyBattleCharacterMode_Command = 8; // 旧未使用命令态
}

// CombatUnitKind 标识战斗单位的业务类型.
enum CombatUnitKind {
  CombatUnitKind_Unknown = 0; // 未知单位
  CombatUnitKind_Character = 1; // 玩家角色
  CombatUnitKind_Pet = 2; // 玩家宠物
  CombatUnitKind_Monster = 3; // 普通怪物或 Boss
  CombatUnitKind_NPC = 4; // 可参与战斗的 NPC
  CombatUnitKind_Summon = 5; // 技能临时召唤物
  CombatUnitKind_Mount = 6; // 作为独立受击单位表现的骑宠
}

// CombatActionType 标识单位选择或执行的主动动作类型.
enum CombatActionType {
  CombatActionType_Unknown = 0; // 未指定或无法识别的动作
  CombatActionType_Attack = 1; // 普通物理攻击或武器攻击
  CombatActionType_Defense = 2; // 本回合防御
  CombatActionType_Skill = 3; // 使用角色技能、宠物技能或普通精灵魔法; skill_id由出手单位上下文解释
  CombatActionType_Wait = 4; // 主动等待、无可用动作或被状态阻止行动
  CombatActionType_Escape = 5; // 尝试逃离战斗
  CombatActionType_Capture = 6; // 尝试捕获目标
  CombatActionType_SwitchPet = 7; // 召回、换上或换下宠物
  CombatActionType_Item = 8; // 使用道具
  CombatActionType_EquipmentSkill = 9; // 使用装备提供的技能或魔法
  CombatActionType_ProfessionSkill = 10; // 使用职业技能
  CombatActionType_Combo = 11; // 服务端把连续同目标普通攻击合并形成的合击, 客户端不能直接提交
  CombatActionType_System = 12; // 场地、状态跳数或其他系统结算动作, 客户端不能直接提交
}

// CombatPetSwitchOperation 区分旧服名称容易误解的 PETIN/PETOUT.
// BATTLE_COM_PETIN 实际收回当前宠物, BATTLE_COM_PETOUT 实际派出所选宠物.
enum CombatPetSwitchOperation {
  CombatPetSwitchOperation_Unknown = 0; // 未指定宠物切换
  CombatPetSwitchOperation_RecallCurrent = 1; // 收回当前出战宠物, 对应 BATTLE_COM_PETIN
  CombatPetSwitchOperation_DeploySelected = 2; // 派出指定宠物, 对应 BATTLE_COM_PETOUT
  CombatPetSwitchOperation_Replace = 3; // 先收回当前宠物再派出指定宠物的组合表现
}

// CombatIntentSource 标识动作意图的来源.
enum CombatIntentSource {
  CombatIntentSource_Unknown = 0; // 未知来源
  CombatIntentSource_Player = 1; // 玩家主动提交
  CombatIntentSource_TimeoutDefault = 2; // 回合超时后由服务端补充
  CombatIntentSource_EnemyAI = 3; // 敌人、宠物托管或NPC AI生成; 与现有协议命名一致
  CombatIntentSource_StatusForced = 4; // 混乱、挑拨等状态强制改写
  CombatIntentSource_System = 5; // 场地或服务端规则生成
}

// CombatEventKind 标识一个有序结算事件的业务语义.
enum CombatEventKind {
  CombatEventKind_Unknown = 0; // 未指定事件
  CombatEventKind_ActionBegin = 1; // 一个主动动作开始
  CombatEventKind_AttackSegment = 2; // 普通攻击或多段技能中的一段攻击
  CombatEventKind_Defense = 3; // 防御动作生效
  CombatEventKind_Magic = 4; // 魔法结算
  CombatEventKind_Item = 5; // 道具使用结算
  CombatEventKind_Escape = 6; // 逃跑判定
  CombatEventKind_Capture = 7; // 捕获判定
  CombatEventKind_SwitchPet = 8; // 宠物进场、离场或替换
  CombatEventKind_Wait = 9; // 等待或不能行动
  CombatEventKind_Counter = 10; // 反击; counter_depth 可表达反击的反击
  CombatEventKind_Combo = 11; // 多单位合击
  CombatEventKind_LoyalGuard = 12; // 忠犬或忠诚宠物替原目标承受攻击
  CombatEventKind_GuardianSpirit = 13; // 守护精灵、守护壁等防护触发
  CombatEventKind_MirrorSpirit = 14; // 镜子精灵或镜类反射触发
  CombatEventKind_Passive = 15; // 其他被动技能触发
  CombatEventKind_StatusTick = 16; // 中毒、剧毒、恢复等持续状态跳数
  CombatEventKind_StatusChange = 17; // 状态新增、更新、移除、抵抗或免疫
  CombatEventKind_FieldChange = 18; // 场地、天气或元素环境变化
  CombatEventKind_UnitEnter = 19; // 单位进入战场
  CombatEventKind_UnitLeave = 20; // 单位离开战场
  CombatEventKind_Revive = 21; // 单位复活
  CombatEventKind_ActionEnd = 22; // 一个主动动作及其衍生链结束
  CombatEventKind_RoundEnd = 23; // 回合结束状态结算
  CombatEventKind_RoundPhase = 24; // 回合阶段边界, 用于精确表达状态在单位出手前结算
  CombatEventKind_IntentRewrite = 25; // 服务端因忠诚、变身、超时或状态改写动作
  CombatEventKind_TargetResolve = 26; // 声明目标失效后的重选、展开或忠犬改向
  CombatEventKind_EquipmentChange = 27; // 装备耐久、破损、移除、偷窃或修复
  CombatEventKind_AttributeChange = 28; // 攻防敏、抗性、命中等运行期属性变化
}

// CombatEffectKind 标识事件中的最小逻辑效果类型.
enum CombatEffectKind {
  CombatEffectKind_Unknown = 0; // 未指定效果
  CombatEffectKind_Damage = 1; // 造成伤害
  CombatEffectKind_Heal = 2; // 恢复 HP、MP 或其他资源
  CombatEffectKind_AssetChange = 3; // 非伤害/治疗导致的资源变化
  CombatEffectKind_Status = 4; // 状态新增、更新、移除、跳数、抵抗或免疫
  CombatEffectKind_Move = 5; // 单位移动或站位变化
  CombatEffectKind_Miss = 6; // 未命中或没有有效目标
  CombatEffectKind_Dodge = 7; // 目标闪避
  CombatEffectKind_Guard = 8; // 防御或格挡
  CombatEffectKind_GuardBreak = 9; // 破除防御或格挡
  CombatEffectKind_Protect = 10; // 忠犬、守护者或其他单位代替承伤
  CombatEffectKind_Reflect = 11; // 镜子精灵等反射伤害或魔法
  CombatEffectKind_Absorb = 12; // 守护精灵等吸收伤害或魔法
  CombatEffectKind_Knockback = 13; // 击飞或击退并产生位置变化
  CombatEffectKind_Knockdown = 14; // 击倒并改变姿态
  CombatEffectKind_FallMount = 15; // 落马或骑乘解除
  CombatEffectKind_Death = 16; // 死亡
  CombatEffectKind_Revive = 17; // 复活
  CombatEffectKind_Vanish = 18; // 消失、隐身或从表现层移除
  CombatEffectKind_UnitEnter = 19; // 单位进入战场
  CombatEffectKind_UnitLeave = 20; // 单位离开战场
  CombatEffectKind_Escape = 21; // 逃跑结果
  CombatEffectKind_Capture = 22; // 捕获结果
  CombatEffectKind_ItemConsume = 23; // 道具消耗
  CombatEffectKind_Field = 24; // 场地状态变化
  CombatEffectKind_Transform = 25; // 变身或形象变化
  CombatEffectKind_Text = 26; // 服务端文本提示; 客户端应优先按结构化数据本地化
  CombatEffectKind_AttributeChange = 27; // 攻防敏、抗性、元素或战斗修正变化
  CombatEffectKind_EquipmentChange = 28; // 装备耐久下降、破损、移除、偷窃或修复
  CombatEffectKind_InventoryChange = 29; // 捕获前置物品、投掷物或偷窃导致的背包变化
  CombatEffectKind_IntentRewrite = 30; // 服务端改写动作
  CombatEffectKind_TargetResolve = 31; // 目标重选、展开或承伤改向
  CombatEffectKind_RoundPhase = 32; // 回合阶段边界
}

// CombatActionResult 标识动作或事件的最终执行结果.
enum CombatActionResult {
  CombatActionResult_Unknown = 0; // 尚未结算或结果未知
  CombatActionResult_Success = 1; // 成功执行
  CombatActionResult_Failed = 2; // 判定失败
  CombatActionResult_NoTarget = 3; // 没有合法目标
  CombatActionResult_InvalidTarget = 4; // 目标非法
  CombatActionResult_SourceDefeated = 5; // 出手前已经被击倒或死亡
  CombatActionResult_Interrupted = 6; // 被反击、击倒、异常状态等中断
  CombatActionResult_BlockedByStatus = 7; // 石化、睡眠、麻痹等状态阻止行动
  CombatActionResult_Immune = 8; // 目标免疫
  CombatActionResult_Resisted = 9; // 目标抵抗
  CombatActionResult_Escaped = 10; // 成功逃跑
  CombatActionResult_Captured = 11; // 成功捕获
  CombatActionResult_Rewritten = 12; // 原动作被服务端改写后执行
  CombatActionResult_RejectedStatusConflict = 13; // 状态互斥导致效果未施加
  CombatActionResult_RequirementMissing = 14; // 缺少装备、物品、等级或其他前置条件
  CombatActionResult_ForcedExit = 15; // 命令超时或系统规则强制离场
  CombatActionResult_Forbidden = 16; // 当前战斗、状态或变身规则禁止该动作
  CombatActionResult_InvalidItem = 17; // 道具槽、类型或道具实例无效
  CombatActionResult_InventoryFull = 18; // 背包或宠物栏空间不足
  CombatActionResult_PetUnavailable = 19; // 宠物未选中、不可返回、已失效或无法进入战场
}

// CombatHitResult 是一次命中可同时具有的判定标志.
// 该枚举使用 repeated 传输, 因为暴击、击飞、死亡、反射等结果可以同时发生.
enum CombatHitResult {
  CombatHitResult_Unknown = 0; // 未指定判定
  CombatHitResult_Normal = 1; // 普通命中
  CombatHitResult_Critical = 2; // 暴击
  CombatHitResult_Miss = 3; // 未命中
  CombatHitResult_Dodge = 4; // 闪避
  CombatHitResult_Death = 5; // 本次命中导致死亡
  CombatHitResult_Guard = 6; // 防御减伤
  CombatHitResult_Block = 7; // 格挡
  CombatHitResult_GuardBreak = 8; // 破防
  CombatHitResult_Counter = 9; // 本次命中属于反击
  CombatHitResult_LoyalGuard = 10; // 忠犬替原目标承伤
  CombatHitResult_GuardianSpirit = 11; // 守护精灵生效
  CombatHitResult_MirrorSpirit = 12; // 镜子精灵生效
  CombatHitResult_Reflect = 13; // 伤害或魔法反射
  CombatHitResult_Absorb = 14; // 伤害或魔法吸收
  CombatHitResult_Vanish = 15; // 目标消失或效果落空
  CombatHitResult_Crush = 16; // 重击或压制
  CombatHitResult_Knockback = 17; // 击飞或击退
  CombatHitResult_Knockdown = 18; // 击倒
  CombatHitResult_FallMount = 19; // 落马
  CombatHitResult_Trap = 20; // 陷阱反制
  CombatHitResult_NoDamage = 21; // 命中但没有实际伤害
  CombatHitResult_UltimateFirst = 22; // 旧服绝技第一阶段表现
  CombatHitResult_UltimateSecond = 23; // 旧服绝技第二阶段表现
  CombatHitResult_SuperWall = 24; // 超级防护墙生效
  CombatHitResult_Acupuncture = 25; // 针刺外皮等反伤效果
  CombatHitResult_AntiInterference = 26; // 抗干扰或特殊免疫效果
}

// LegacyAttackReturn 对应 include/battle.h 的 BATTLE_RET_* 主判定.
// _EQUIT_ARRANGE 开启时 Arrange 的旧数值为 5; raw_legacy_attack_return 仍应保留实际编译版本数值.
enum LegacyAttackReturn {
  LegacyAttackReturn_Normal = 0; // BATTLE_RET_NORMAL, 普通命中
  LegacyAttackReturn_Critical = 1; // BATTLE_RET_CRITICAL, 暴击命中
  LegacyAttackReturn_Miss = 2; // BATTLE_RET_MISS, 未命中
  LegacyAttackReturn_Dodge = 3; // BATTLE_RET_DODGE, 闪避; 合击路径不会得到该结果
  LegacyAttackReturn_AllGuard = 4; // BATTLE_RET_ALLGUARD, 完全防护或伤害归零
  LegacyAttackReturn_Arrange = 5; // BATTLE_RET_ARRANGE, _EQUIT_ARRANGE 装备格挡
 }

// CombatDamageType 标识伤害来源, 便于客户端选择数字样式和受击表现.
enum CombatDamageType {
  CombatDamageType_Unknown = 0; // 未知伤害
  CombatDamageType_Physical = 1; // 普通物理伤害
  CombatDamageType_Magic = 2; // 魔法伤害
  CombatDamageType_Status = 3; // 中毒、灼烧等持续伤害
  CombatDamageType_Counter = 4; // 反击伤害
  CombatDamageType_Reflect = 5; // 镜子精灵等反射伤害
  CombatDamageType_True = 6; // 不受普通防御公式影响的真实伤害
  CombatDamageType_Self = 7; // 自损或技能代价
}

// CombatDamageRecipientRole 标识一次总伤害最终分配给谁.
enum CombatDamageRecipientRole {
  CombatDamageRecipientRole_Unknown = 0; // 未指定角色
  CombatDamageRecipientRole_OriginalTarget = 1; // 原始目标本人
  CombatDamageRecipientRole_LoyalGuardian = 2; // 忠犬/舍己保护者
  CombatDamageRecipientRole_TargetMount = 3; // 目标骑宠分摊
  CombatDamageRecipientRole_AttackerByReflect = 4; // 镜反射给攻击者
  CombatDamageRecipientRole_AttackerMountByReflect = 5; // 镜反射给攻击者骑宠
  CombatDamageRecipientRole_AttackerByTrap = 6; // 陷阱伤害
  CombatDamageRecipientRole_AttackerByAcupuncture = 7; // 针刺反伤
  CombatDamageRecipientRole_SelfCost = 8; // 技能自损
}

// CombatAssetType 标识战斗期间可变化的单位资源.
enum CombatAssetType {
  CombatAssetType_Unknown = 0; // 未指定资源
  CombatAssetType_HP = 1; // 生命值
  CombatAssetType_MP = 2; // 魔法值
  CombatAssetType_Rage = 3; // 怒气或气力
  CombatAssetType_Experience = 4; // 经验值
  CombatAssetType_DP = 5; // 旧服对战点数
  CombatAssetType_ItemCount = 6; // 道具数量
}

// CombatStatusKind 给常见状态提供稳定语义; status_id 仍保存配置中的具体状态 ID.
enum CombatStatusKind {
  CombatStatusKind_Unknown = 0; // 未知或项目自定义状态
  CombatStatusKind_Poison = 1; // 中毒
  CombatStatusKind_Paralysis = 2; // 麻痹
  CombatStatusKind_Sleep = 3; // 睡眠
  CombatStatusKind_Petrify = 4; // 石化
  CombatStatusKind_Drunk = 5; // 酒醉
  CombatStatusKind_Confusion = 6; // 混乱
  CombatStatusKind_Weaken = 7; // 虚弱
  CombatStatusKind_DeepPoison = 8; // 剧毒
  CombatStatusKind_MagicBarrier = 9; // 魔障或魔法屏障
  CombatStatusKind_Silence = 10; // 沉默或禁咒
  CombatStatusKind_PlaguePoison = 11; // 毒煞或瘟疫毒
  CombatStatusKind_Dizzy = 12; // 晕眩
  CombatStatusKind_Entwine = 13; // 树根缠绕
  CombatStatusKind_Dragnet = 14; // 天罗地网
  CombatStatusKind_IceCrack = 15; // 冰爆
  CombatStatusKind_Oblivion = 16; // 遗忘
  CombatStatusKind_IceArrow = 17; // 冰箭附加状态
  CombatStatusKind_BloodWorms = 18; // 嗜血蛊
  CombatStatusKind_Sign = 19; // 一针见血标记
  CombatStatusKind_Instigate = 20; // 挑拨
  CombatStatusKind_FireEnclose = 21; // 火附体
  CombatStatusKind_IceEnclose = 22; // 冰附体
  CombatStatusKind_ThunderEnclose = 23; // 雷附体
  CombatStatusKind_Focus = 24; // 专注或蓄力
  CombatStatusKind_FireResist = 25; // 火抗
  CombatStatusKind_IceResist = 26; // 冰抗
  CombatStatusKind_ThunderResist = 27; // 雷抗
  CombatStatusKind_AllElementResist = 28; // 多元素抗性
  CombatStatusKind_WaterEnclose = 29; // 水附体
  CombatStatusKind_Possession = 30; // 附身
  CombatStatusKind_Fear = 31; // 恐惧
  CombatStatusKind_Hide = 32; // 隐身
  CombatStatusKind_Reverse = 33; // 前后排或阵型反转
  CombatStatusKind_Defense = 34; // 防御姿态
  CombatStatusKind_LoyalGuard = 35; // 忠犬待触发状态
  CombatStatusKind_GuardianSpirit = 36; // 守护精灵
  CombatStatusKind_MirrorSpirit = 37; // 镜子精灵
  CombatStatusKind_Absorb = 38; // 吸收
  CombatStatusKind_Reflect = 39; // 反射
  CombatStatusKind_Trap = 40; // 陷阱
