  LegacyMagicHandler_OtherRecovery = 2; // 他人恢复: 与 Recovery 相同但使用允许他人目标的场外/战斗目标规则
  LegacyMagicHandler_FieldAttributeChange = 3; // 场地属性变化: 扣除 MP 并修改当前战场元素属性和持续回合
  LegacyMagicHandler_StatusChange = 4; // 通用异常魔法: 从配置选择毒、麻、眠、石、醉、乱等状态并判定持续回合
  LegacyMagicHandler_MagicDefense = 5; // 光镜守魔法: 建立吸收、反射或无效化次数, 对应 LegacyDamageReaction
  LegacyMagicHandler_StatusRecovery = 6; // 异常恢复: 每目标扫描并只取当前最高ID普通状态; 指定状态仅在完全相等时清除, option全/状态0只通配清除ID1-6, 不会清除虚弱、剧毒、魔障、沉默等ID7以上状态
  LegacyMagicHandler_Resurrect = 7; // 复活: 对死亡目标恢复存活状态和配置指定 HP
  LegacyMagicHandler_AttackReverse = 8; // 属性反转: 修改目标元素相克/反转状态, 由 MAGIC_AttReverse_Battle 结算
  LegacyMagicHandler_ResurrectAndDefense = 9; // 复活守护: 复活目标并追加防护效果, 属于复活守精功能
  LegacyMagicHandler_AttackMagic = 10; // 攻击魔法: 按 magic 配置、场地属性、目标范围、魔法闪避和抗性计算伤害
  LegacyMagicHandler_MagicStatusChange = 11; // 魔法状态: 施加魔抗、铁壁、火抗、雷抗或冰抗等 LegacyMagicStatus
  LegacyMagicHandler_Metamorphosis = 12; // 变身魔法: 修改目标战斗形象及对应变身状态
  LegacyMagicHandler_Weaken = 13; // 虚弱精灵: 施加 LegacyBattleStatus_Weaken
  LegacyMagicHandler_DeepPoison = 14; // 剧毒精灵: 通过 StatusChange2 施加 LegacyBattleStatus_DeepPoison
  LegacyMagicHandler_Barrier = 15; // 魔障精灵: 施加 LegacyBattleStatus_Barrier
  LegacyMagicHandler_NoCast = 16; // 沉默精灵: 施加 LegacyBattleStatus_NoCast 并阻止 MAGIC_DirectUse
  LegacyMagicHandler_CallDragon = 17; // 召龙: 不创建战场单位; 扣MP后按option=image|power创建临时等级100/幸运1/攻击power的计算角色, 每目标先魔法闪避再用普通DamageCalc直伤; FieldAttr固定-1, 骑乘固定人物/宠物各半且23/24、25/26同行代码各自实际展开同一整侧
}

// LegacyBattleItemHandler 枚举 battle_item.c 中所有战斗内道具处理入口.
// 道具配置仍由现有 item 数据提供; 本枚举只冻结8.5处理分支, 不能代替 item_id 或 ITEM_ARGUMENT.
enum LegacyBattleItemHandler {
  LegacyBattleItemHandler_Unknown = 0; // 未知或不属于战斗内处理器
  LegacyBattleItemHandler_Imprecate = 1; // 来吉卡/诅咒、恩惠、祝福: 从 ITEM_ARGUMENT 解析种类、数值和回合, 建立对应持续恢复或损耗, 成功后直接移除物品
  LegacyBattleItemHandler_MagicDefenseRecovery = 2; // 新光镜守道具: 由参数第二段取次数、由关联 magic option 取光/镜/守种类, 写入对应反应槽并消耗物品
  LegacyBattleItemHandler_UseMagic = 3; // 道具施法: ITEM_ARGUMENT 是 magic_id, 调用 MAGIC_DirectUse; ITEM_DAMAGEBREAK 大于0时减1, 否则删除物品
  LegacyBattleItemHandler_Recovery = 4; // HP/MP恢复、解乌力化或属性移动: 解析 ITEM_ARGUMENT 后复用 BATTLE_MultiRecovery; 当前 _MAGIC_REHPAI 骑乘恢复按双方缺血比例分配
  LegacyBattleItemHandler_StatusChange = 5; // 状态道具: 解析 BATTLE_ST、turn 和成功参数, 复用普通状态命中公式; 即使目标已有互斥状态, 也可能先播放效果
  LegacyBattleItemHandler_StatusRecovery = 6; // 状态恢复道具: 解析指定状态或0, 每目标只取最高ID非0状态; 指定状态须相等, 0只通配ID1-6, 每目标最多清除一个
  LegacyBattleItemHandler_MagicDefense = 7; // 光/镜/守道具: 解析 BATTLE_MD 和 turn, 直接覆盖该反应槽剩余次数
  LegacyBattleItemHandler_ParameterChange = 8; // 攻、防、敏、魅力或捕获修正: 百分号分支按固定属性乘 power 写入MOD值, 否则按点数写入
  LegacyBattleItemHandler_FieldChange = 9; // 场地属性道具: 复用 BATTLE_FieldAttChange, 写入单一场地属性、强度和持续回合
  LegacyBattleItemHandler_AttributeReverse = 10; // 属性反转道具: XOR切换 REVERSE 标志并立即交换地火、水风当前属性
  LegacyBattleItemHandler_Resurrect = 11; // 复活道具: 只作用于死亡单位; PVP玩家目标被跳过; 非0 power 最终按RAND(90%,110%)恢复且百分号结果会被覆盖
  LegacyBattleItemHandler_CaptureUp = 12; // 捕获率提升: 只作用于存活玩家, 把 RAND(power*0.9,power*1.1) 累加到 CHAR_WORKMODCAPTURE
  LegacyBattleItemHandler_Cracker = 13; // 拉炮: 播放地图/战斗效果并消耗物品, 不产生伤害
  LegacyBattleItemHandler_Refresh = 14; // 解异常专用道具: 先从背包摘除物品, 再复用指定普通状态恢复, 最后销毁物品实例
  LegacyBattleItemHandler_AddExperience = 15; // 智果: 设置经验倍率及秒数; _ITEM_ADDEXP2 按 power*time 累加并限制为72000点, 属于战斗内可提交但不改伤害
  LegacyBattleItemHandler_Firecracker = 16; // 鞭炮: 禁止对己方; 目标宠物ID存在于KPET列表时令其立即离场, 无论是否命中目标都消耗物品
  LegacyBattleItemHandler_ResurrectAndDefense = 17; // 复活守精道具: 先复活, 再解析光/镜/守及次数并写入反应槽, 全流程成功后消耗物品
}

// LegacyEnemySkillHandler 枚举通过宠物技能注册表暴露的敌人专用处理器.
enum LegacyEnemySkillHandler {
  LegacyEnemySkillHandler_Unknown = 0; // 未知敌人技能
  LegacyEnemySkillHandler_ReLife = 1; // 复活: 敌人从槽10-19的ISDIE目标随机一个, 宠物使用指定目标; 以power=floor(maxHP/2)调用MultiRessurect, 最终HP再取RAND(floor(power*0.9),floor(power*1.1))并清死亡
  LegacyEnemySkillHandler_ReHP = 2; // 回血: 敌人从槽10-19中存活且HP<floor(maxHP*2/3)者随机一个, 宠物使用指定目标; 先取power=RAND(100,maxHP), MultiRecovery内部再取该power的90%-110%并按上限截断
  LegacyEnemySkillHandler_EnemyHelp = 3; // 援军: 仅存活敌人且非PVP; 敌方槽10-19存在空位时按施术者PETID查ENEMY_TEMPNO, 以RAND(int(level*0.8),int(level*1.2))创建同模板敌人并加入同侧CommandReady
}

