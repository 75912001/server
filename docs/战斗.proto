// CombatStatusChangeType 标识状态变化方式或一次状态判定结果.
enum CombatStatusChangeType {
  CombatStatusChangeType_Unknown = 0; // 未知变化
  CombatStatusChangeType_Add = 1; // 新增状态
  CombatStatusChangeType_Update = 2; // 更新层数、强度或持续回合
  CombatStatusChangeType_Remove = 3; // 主动移除或驱散
  CombatStatusChangeType_Expire = 4; // 自然到期
  CombatStatusChangeType_Tick = 5; // 本回合触发一次持续效果
  CombatStatusChangeType_Resist = 6; // 抵抗状态
  CombatStatusChangeType_Immune = 7; // 免疫状态
}

// CombatStatusExclusiveGroup 标识旧服互斥状态组.
// 旧服不是根据每个状态单独决定冲突, 而是先扫描对应状态数组是否已有任意正值.
enum CombatStatusExclusiveGroup {
  CombatStatusExclusiveGroup_None = 0; // 不参加互斥检查, 可与其他状态同时存在
  CombatStatusExclusiveGroup_OrdinaryAbnormal = 1; // 通用BATTLE_StatusAttackCheck及普通职业状态扫描全部BATTLE_ST_*, 石化和睡眠等不能并存; 自然威能和当前无效的冰爆路径例外见LegacyBattleRule
  CombatStatusExclusiveGroup_MagicStatus = 2; // 魔抗、铁壁、火抗、雷抗、冰抗共用一个互斥组
  CombatStatusExclusiveGroup_DamageReaction = 3; // 光、镜、守、陷阱、针刺属于同一业务类别但独立存储, 不互斥
  CombatStatusExclusiveGroup_Transform = 4; // 仅用于归类狐狸、乌力、狼人等变身, 不是全局互斥组; 是否清理旧变身严格由各技能处理器决定
  CombatStatusExclusiveGroup_ElementBoundary = 5; // 地、水、火、风结界, 可由四属性结界技能按专用规则建立或清除
}

// CombatStatusStackPolicy 明确同状态或同组状态再次施加时的处理方式.
enum CombatStatusStackPolicy {
  CombatStatusStackPolicy_Unknown = 0; // 未知或由自定义技能决定
  CombatStatusStackPolicy_RejectIfGroupOccupied = 1; // 组内已有任意状态即拒绝; 普通异常和 MagicStatus 使用此规则
  CombatStatusStackPolicy_ReplaceDuration = 2; // 用新持续值直接覆盖旧值
  CombatStatusStackPolicy_KeepCurrentDuration = 3; // 保留当前剩余值, 新状态不刷新
  CombatStatusStackPolicy_KeepLongerDuration = 4; // 取当前和新持续值的较大者
  CombatStatusStackPolicy_AddDuration = 5; // 把新持续值累加到当前值; 8.5 普通异常不使用
  CombatStatusStackPolicy_ReplaceTriggerCount = 6; // 用新次数覆盖旧次数; 光、镜、守重复施加使用
  CombatStatusStackPolicy_AddTriggerCount = 7; // 增加可触发次数; 8.5 光、镜、守标准流程不使用
  CombatStatusStackPolicy_IndependentSlot = 8; // 与同类别其他状态使用独立槽位并存
  CombatStatusStackPolicy_OneShot = 9; // 触发一次后立即清零; 针刺和已触发陷阱使用
}

// CombatStatusApplyResult 区分概率失败、状态冲突和真正免疫.
// 客户端只有拿到本枚举, 才能正确表现“魔法动画播放了, 但因已有石化而没有获得睡眠”.
enum CombatStatusApplyResult {
  CombatStatusApplyResult_Unknown = 0; // 未知结果
  CombatStatusApplyResult_Applied = 1; // 新状态成功建立
  CombatStatusApplyResult_Replaced = 2; // 同状态数值被新值覆盖
  CombatStatusApplyResult_Refreshed = 3; // 状态被刷新但未叠加
  CombatStatusApplyResult_RejectedGroupOccupied = 4; // 互斥组已存在状态, 未执行概率判定或写入
  CombatStatusApplyResult_RejectedSameStatus = 5; // 同一状态已存在且规则不允许刷新
  CombatStatusApplyResult_ProbabilityFailed = 6; // 已执行命中概率判定但失败
  CombatStatusApplyResult_Resisted = 7; // 目标抗性导致失败
  CombatStatusApplyResult_Immune = 8; // 目标或规则明确免疫
  CombatStatusApplyResult_InvalidTarget = 9; // 目标死亡、离场或不允许承受该状态
  CombatStatusApplyResult_Removed = 10; // 状态被技能主动移除
  CombatStatusApplyResult_Expired = 11; // 状态自然到期
  CombatStatusApplyResult_Consumed = 12; // 光镜守、陷阱或针刺因触发而减少或清零
}

