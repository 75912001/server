# 装备套装配置样本.
# 数据源: item_reference_8_0.xlsx 的 "道具总表" 和 "武器.*" 工作表.
# 各工作表字段布局不同: "武器.爪" 的 nsuit 在 S 列, 其余目标表在 AE 列; 采样必须按表头名定位, 不能硬编码统一列.
# 本文件尚未接入服务端配置加载器, 仅用于确定数据结构和完整保存原版数据.
#
# equipmentSets 是唯一根节点. setId 标识套装, name 是显示名称, bonuses 保留给
# 2件/3件/...套装公共加成, items 保存属于该 setId 的全部装备.
# items[].originalId 永久保存原版道具 ID. items[].id 保留给当前程序装备 ID,
# 在完成映射前省略, 不让同一个 id 字段在迁移前后表达两种含义.
# frameId 仅用于源表审计, 不作为新套装配置字段.
#
# items[].setEffects 由当前实际穿戴的装备携带, 只有该套装达到 pieces 后才参与.
# items[].equipmentEffects 是不经过套装门槛的直属装备效果.
# 同一 setId 的所有装备均属于同一个套装, 名称不同, 成员超过 3 件都不是冲突.
# 原版同一效果目标不累加: 先清零, 再按装备槽顺序赋值, 靠后槽位覆盖靠前槽位.
# 原版同时只选择装备槽中最先找到的一个达标 setId; 兼容性细节见 equipment.set.audit.yaml.

