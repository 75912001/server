syntax = "proto3";

package account;
option go_package = "server/proto/pb;pb";

message KV {
  uint32 key = 1;
  uint32 value = 2;
}

message Rect {
  Point pos = 1;
  int32 width = 3;
  int32 height = 4;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

enum LevelRange {
  LevelRange_Unknow = 0;
  LevelRange_Min = 1;
  LevelRange_Max = 140;
}

// CharacterRebirthNameColor 表示角色昵称按转生次数使用的客户端显示色.
// 枚举值与转生次数一致; 业务有效值为 White 到 Purple, Max 仅作为枚举边界占位.
enum CharacterRebirthNameColor {
  CharacterRebirthNameColor_White = 0; // 0转昵称显示色: 白色 #FFFFFF
  CharacterRebirthNameColor_Yellow = 1; // 1转昵称显示色: 黄色 #FFD84A
  CharacterRebirthNameColor_Green = 2; // 2转昵称显示色: 绿色 #63B84A
  CharacterRebirthNameColor_Blue = 3; // 3转昵称显示色: 蓝色 #45A7FF
  CharacterRebirthNameColor_Red = 4; // 4转昵称显示色: 红色 #FF4A4A
  CharacterRebirthNameColor_Purple = 5; // 5转昵称显示色: 紫色 #AD6CFF
  CharacterRebirthNameColor_Max = 6; // 昵称颜色枚举边界, 用于范围判断或扩展占位; 不作为业务值存储或显示
}

enum Constants {
  Constants_Unknow = 0;
  Constants_Elemental_Max_Active_Type_Count = 2; // 最多允许同时分配的元素种类数量
  Constants_Elemental_Total_Point = 10; // 地水火风元素总点数
  Constants_Character_Name_Max_Length = 12; // 角色名称最大长度
  Constants_Mail_Title_Max_Length = 30; // 系统邮件主题最大 Unicode 字符数
  Constants_Mail_Expire_Days = 365; // 系统邮件固定有效天数
  Constants_Mail_Content_Max_Length = 500; // 系统邮件正文最大 Unicode 字符数
  Constants_Mail_System_Inbox_Max_Count = 1000; // 单角色系统邮箱最多保存的未过期邮件数
}
