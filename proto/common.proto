syntax = "proto3";

package user;
option go_package = "server/proto/pb;pb";

message KV {
  uint32 key = 1;
  uint32 value = 2;
}

message Rect {
  Point pos = 1;
  int32 width = 3;
  int32 height = 4;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

enum LevelRange {
  LevelRange_Unknow = 0;
  LevelRange_Min = 1;
  LevelRange_Max = 140;
}
