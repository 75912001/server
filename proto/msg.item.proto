syntax = "proto3";

package account;
option go_package = "server/proto/pb;pb";

import "equipment.proto";

// 消息范围 [0x003000, 0x003fff]

message ItemElement {
  uint32 asset_id = 1; // 道具资源 ID
  uint64 count = 2; // 道具数量
}

// ItemCostResult 表示交易中一种资源的实际消耗及扣除后的权威余额.
message ItemCostResult {
  uint32 item_id = 1; // 消耗资源 ID
  uint64 consumed_count = 2; // 本次实际消耗数量
  uint64 remaining_count = 3; // 扣除后的权威持有数量
}

// ItemContainerRecord 保存不关心位置的道具和装备集合.
message ItemContainerRecord {
  map<uint32, uint64> item_count_map = 1; // 可堆叠道具总数, key 为道具资源 ID, value 为持有数量
  map<uint64, EquipmentRecord> equipment_record_map = 2; // 装备实例, key 为账号级装备 UUID
}

// ItemStackTransfer 表示一次实际完成的可堆叠道具迁移.
message ItemStackTransfer {
  uint32 asset_id = 1; // 道具资源 ID
  uint64 count = 2; // 本次实际迁移数量
}

//0x003000#client->gateway#使用角色道具-请求
message ItemUseReq {
  uint64 character_uuid = 1; // 道具所属角色 UUID
  uint32 item_id = 2; // 使用的道具资源 ID
  uint64 target_pet_uuid = 3; // 宠物目标 UUID; 角色目标道具必须为0
}

//0x003001#gateway->client#使用角色道具-回复
message ItemUseRes {
  uint64 character_uuid = 1; // 道具所属角色 UUID
  uint32 item_id = 2; // 已使用的道具资源 ID
  uint64 target_pet_uuid = 3; // 实际作用的宠物 UUID; 角色目标为0
}

//0x003003#client->gateway#将角色背包物品存入账号仓库-请求
message ItemWarehouseDepositReq {
  uint64 character_uuid = 1; // 物品当前所属角色 UUID
  oneof item {
    ItemStackTransfer stack = 10; // 需要存入的道具 ID 和数量
    uint64 equipment_uuid = 11; // 需要存入的装备 UUID
  }
}

//0x003004#gateway->client#将角色背包物品存入账号仓库-回复
message ItemWarehouseDepositRes {
  uint64 character_uuid = 1; // 物品原所属角色 UUID
  oneof item {
    ItemStackTransfer stack = 10; // 实际存入的道具 ID 和数量
    uint64 equipment_uuid = 11; // 实际存入的装备 UUID
  }
}

//0x003005#client->gateway#将账号仓库物品取入角色背包-请求
message ItemWarehouseWithdrawReq {
  uint64 character_uuid = 1; // 接收物品的目标角色 UUID
  oneof item {
    ItemStackTransfer stack = 10; // 需要取出的道具 ID 和数量
    uint64 equipment_uuid = 11; // 需要取出的装备 UUID
  }
}

//0x003006#gateway->client#将账号仓库物品取入角色背包-回复
message ItemWarehouseWithdrawRes {
  uint64 character_uuid = 1; // 接收物品的目标角色 UUID
  oneof item {
    ItemStackTransfer stack = 10; // 实际取出的道具 ID 和数量
    uint64 equipment_uuid = 11; // 实际取出的装备 UUID
  }
}

//0x003007#client->gateway#购买商店商品-请求
message ShopPurchaseReq {
  uint64 character_uuid = 1; // 执行购买并接收商品的角色 UUID
  uint32 item_id = 2; // 商品道具 ID, 直接对应 商店.yaml 商品 id
  uint32 quantity = 3; // 购买份数, 范围为 1-30
}

//0x003008#gateway->client#购买商店商品-回复
message ShopPurchaseRes {
  uint64 character_uuid = 1; // 执行购买并接收商品的角色 UUID
  uint32 item_id = 2; // 实际购买的道具 ID
  uint32 item_count = 3; // 每份交付数量; 装备实例总数 = item_count × quantity
  uint32 quantity = 4; // 实际购买份数
  uint64 used_uuid = 5; // 购买后账号已分配 UUID 游标
  repeated ItemCostResult cost_result_list = 6; // 各资源的实际消耗和最终余额
  repeated EquipmentRecord equipment_record_list = 7; // 新增到角色背包的装备实例
  uint64 item_remaining_count = 8; // 可堆叠商品交付后的最终持有量; 装备商品固定为0
}

//0x003009#client->gateway#宠物使用加工技能-请求
message ItemSynthesisReq {
  uint64 character_uuid = 1; // 持有宠物和素材的在线角色UUID
  uint64 pet_uuid = 2; // 已学习加工技能的随身宠物UUID
  repeated ItemElement material_list = 3; // 1-8种不重复素材, 每种数量1-999
}

//0x00300A#gateway->client#宠物使用加工技能-回复
message ItemSynthesisRes {
  uint64 character_uuid = 1; // 执行加工的角色UUID
  uint64 pet_uuid = 2; // 实际执行加工的宠物UUID
  bool matched = 3; // true表示精确命中基础武器配方
  EquipmentRecord result_equipment = 4; // 命中配方时生成的完整装备实例
  ItemElement returned_material = 5; // 未命中时按投入数量权重返还的1个素材
  repeated ItemCostResult material_cost_result_list = 6; // 全部投入素材的消耗和最终余额
  uint64 used_uuid = 7; // 成功时的账号UUID游标; 未命中时为0
}

//0x00300B#client->gateway#宠物给背包装备附加技能-请求
message EquipmentSkillAttachReq {
  uint64 character_uuid = 1; // 持有宠物、装备和素材的在线角色UUID
  uint64 pet_uuid = 2; // 已学习加工技能的随身宠物UUID
  uint64 equipment_uuid = 3; // 角色背包中的目标装备UUID
  repeated ItemElement material_list = 4; // 1-8种不重复素材, 每种数量1-999
}

//0x00300C#gateway->client#宠物给背包装备附加技能-回复
message EquipmentSkillAttachRes {
  uint64 character_uuid = 1; // 执行附技能的角色UUID
  uint64 pet_uuid = 2; // 实际执行附技能的宠物UUID
  uint64 equipment_uuid = 3; // 目标装备UUID, 成功或配方未命中时均保持不变
  bool matched = 4; // true表示精确命中该装备的一个附技能配方
  EquipmentRecord result_equipment = 5; // 成功时为附技能后的装备, 未命中时为未改变的原装备
  repeated ItemCostResult material_cost_result_list = 6; // 全部投入素材的消耗和最终余额
}

//0x00300D#client->gateway#宠物给背包装备附加元素-请求
message EquipmentElementAttachReq {
  uint64 character_uuid = 1; // 持有宠物、装备和素材的在线角色UUID
  uint64 pet_uuid = 2; // 已学习加工技能的随身宠物UUID
  uint64 equipment_uuid = 3; // 角色背包中的目标装备UUID
  repeated ItemElement material_list = 4; // 1-8种不重复素材, 每种数量1-999
}

//0x00300E#gateway->client#宠物给背包装备附加元素-回复
message EquipmentElementAttachRes {
  uint64 character_uuid = 1; // 执行附元素的角色UUID
  uint64 pet_uuid = 2; // 实际执行附元素的宠物UUID
  uint64 equipment_uuid = 3; // 目标装备UUID, 成功或配方未命中时均保持不变
  bool matched = 4; // true表示精确命中该装备的一个附元素配方
  EquipmentRecord result_equipment = 5; // 成功时为附元素后的装备, 未命中时为未改变的原装备
  repeated ItemCostResult material_cost_result_list = 6; // 全部投入素材的消耗和最终余额
}

// 角色道具与货币数量增量: 普通道具落 item_bag, 货币落 asset_count_map, 0 表示耗尽.
message CharacterItemChanged {
  map<uint32, uint64> item_count_map = 1; // 变化项最终数量, 0 表示耗尽
}

// 角色背包容器全量变化: 装备实例增删或任务结算等结构性变化时整体替换.
message CharacterContainerChanged {
  ItemContainerRecord item_bag = 1; // 变化后的完整随身背包权威快照
  uint64 used_uuid = 2; // 本次容器变化涉及新增装备实例后的账号UUID游标; 0 表示本次无新实例
}
