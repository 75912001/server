syntax = "proto3";

package account;
option go_package = "server/proto/pb;pb";

import "record.proto";
import "asset.proto";

// EquipmentType 表示装备穿戴部位.
// Unspecified 仅作为 proto3 默认值和未初始化占位, Max 仅作为枚举边界.
enum EquipmentType {
  EquipmentType_Unspecified = 0; // 未知装备部位, proto3 默认值
  EquipmentType_Accessory1 = 1; // 首饰位1
  EquipmentType_Helmet = 2; // 头盔
  EquipmentType_Accessory2 = 3; // 首饰位2
  EquipmentType_Weapon = 4; // 武器
  EquipmentType_Chest = 5; // 胸甲
  EquipmentType_Shield = 6; // 盾牌
  EquipmentType_Gloves = 7; // 手套
  EquipmentType_Belt = 8; // 腰带
  EquipmentType_Boots = 9; // 靴子
  EquipmentType_Max = 10; // 装备部位枚举边界, 不作为业务值存储
}

// AccessoryType 表示首饰类别
// 六类首饰共用两个首饰位, 同时穿戴时类别必须不同; 0和Max不作为业务值.
enum AccessoryType {
  AccessoryType_Unspecified = 0; // 未初始化或尚未确认的首饰类型, 不能发布或穿戴
  AccessoryType_Bracelet = 8; // 手环
  AccessoryType_Musical = 9; // 乐器
  AccessoryType_Necklace = 10; // 项链
  AccessoryType_Ring = 11; // 戒指
  AccessoryType_Earring = 13; // 耳环
  AccessoryType_Amulet = 15; // 护身符
  AccessoryType_Max = 16; // 枚举边界, 编号空档也不属于合法首饰类型
}

// EquipmentRecord 保存单件装备的实例档案.
message EquipmentRecord {
  uint64 uuid = 1; // 装备 UUID, 在所属 AccountRecord.aid 作用域内唯一
  uint32 asset_id = 2; // 装备资产 ID, 对应装备配置 ID
  map<int32, int64> record_base_map = 10; // 装备基础属性表, key 使用 EquipmentRecordAttribute; 仅保存非0值, 缺失的已知key按0处理
  map<int32, int64> record_modifier_map = 11; // 装备附加属性修正表, key 使用 EquipmentRecordAttribute; 仅保存非0值, 缺失的已知key按0处理
  repeated uint32 additional_skill_id_list = 20; // 配置表之外后期添加的技能 ID, 不包含装备配置自带技能
  EquipmentElementAttribute element_attribute = 21; // 装备元素属性, 未设置表示没有元素属性
  map<int32, RecordPrimary> record_map = 1000; // 装备扩展记录表, key 使用 EquipmentRecordPrimary
}

// EquipmentElementAttribute 保存装备实例的一条元素属性.
message EquipmentElementAttribute {
  AssetElemental element = 1; // 元素类型, 仅允许地、水、火、风
  uint32 value = 2; // 元素百分比值, 原版范围1-100
}

// EquipmentRecordAttribute 定义装备实例的数值属性类型.
enum EquipmentRecordAttribute {
  EquipmentRecordAttribute_Unspecified = 0; // 未知属性类型, proto3 默认值
  EquipmentRecordAttribute_Attack = 1; // 攻击力属性
  EquipmentRecordAttribute_Defence = 2; // 防御力属性
  EquipmentRecordAttribute_Quick = 3; // 敏捷属性
  EquipmentRecordAttribute_MaxHP = 4; // 最大生命值属性
  EquipmentRecordAttribute_MaxMP = 5; // 最大魔法值属性
  EquipmentRecordAttribute_Luck = 6; // 运气属性
  EquipmentRecordAttribute_Charm = 7; // 魅力属性
  EquipmentRecordAttribute_Avoid = 8; // 闪避属性
  EquipmentRecordAttribute_Critical = 15; // 暴击属性
  EquipmentRecordAttribute_Counter = 16; // 反击属性
  EquipmentRecordAttribute_DamageBonusPercent = 17; // 伤害加成百分比属性
  EquipmentRecordAttribute_CritDamageBonusPercent = 18; // 暴击伤害加成百分比属性

  EquipmentRecordAttribute_PoisonResistance = 100; // 毒抗性属性
  EquipmentRecordAttribute_ParalysisResistance = 101; // 麻痹抗性属性
  EquipmentRecordAttribute_SleepResistance = 102; // 睡眠抗性属性
  EquipmentRecordAttribute_StoneResistance = 103; // 石化抗性属性
  EquipmentRecordAttribute_DrunkResistance = 104; // 酒醉抗性属性
  EquipmentRecordAttribute_ConfusionResistance = 105; // 混乱抗性属性
}

// EquipmentRecordPrimary 定义 record_map 的一级扩展记录类型.
enum EquipmentRecordPrimary {
  EquipmentRecordPrimary_Unspecified = 0; // 未知一级记录类型, proto3 默认值
  EquipmentRecordPrimary_Slot = 1; // 装备槽位记录
}

// EquipmentRecordSecondary 定义装备一级记录下的二级扩展记录类型.
enum EquipmentRecordSecondary {
  EquipmentRecordSecondary_Unspecified = 0; // 未知二级记录类型, proto3 默认值
  EquipmentRecordSecondary_Slot_Data = 1; // 装备槽位数据记录
}

// CharacterEquipmentRecord 保存角色当前穿戴的装备; 未穿戴部位保持未设置.
message CharacterEquipmentRecord {
  EquipmentRecord accessory1 = 1; // 首饰位1当前穿戴的装备
  EquipmentRecord helmet = 2; // 当前穿戴的头盔
  EquipmentRecord accessory2 = 3; // 首饰位2当前穿戴的装备, 类型不能与首饰位1相同
  EquipmentRecord weapon = 4; // 当前穿戴的武器
  EquipmentRecord chest = 5; // 当前穿戴的胸甲
  EquipmentRecord shield = 6; // 当前穿戴的盾牌
  EquipmentRecord gloves = 7; // 当前穿戴的手套
  EquipmentRecord belt = 8; // 当前穿戴的腰带
  EquipmentRecord boots = 9; // 当前穿戴的靴子
}
