syntax = "proto3";

package cache;
option go_package = "server/proto/pb;pb";
import "options.proto";
import "msg.account.proto";
import "msg.mail.proto";

service CacheService {
  option (proto.serviceOpt) = {
    timeout: "3s"
    loadBalancePolicy: LoadBalancePolicy_RingHash
  };

  // 写入账号档案。
  // 以 aid 做 RingHash 分片, 账号档案创建完成和账号档案更新都会走这个接口。
  rpc CacheSetAccountRecord(CacheSetAccountRecordReq) returns (CacheSetAccountRecordRes) {
    option (proto.methodOpt) = {
      timeout : "10s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 读取账号档案。
  // 以 aid 做 RingHash 分片，返回当前 aid 对应的 AccountRecord。
  rpc CacheGetAccountRecord(CacheGetAccountRecordReq) returns (CacheGetAccountRecordRes) {
    option (proto.methodOpt) = {
      timeout : "10s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 读取角色完整邮箱并清理已过期邮件。
  // 以 aid 做 RingHash 分片, character_uuid 必须属于该账号。
  rpc CacheGetCharacterMailbox(CacheGetCharacterMailboxReq) returns (CacheGetCharacterMailboxRes) {
    option (proto.methodOpt) = {
      timeout : "10s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 给角色增加一封系统邮件。
  // 以 aid 做 RingHash 分片, 邮件 UUID 和时间由 Cache 生成。
  rpc CacheAddSystemMail(CacheAddSystemMailReq) returns (CacheAddSystemMailRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 标记角色的一封邮件为已读。
  rpc CacheMarkCharacterMailRead(CacheMarkCharacterMailReadReq) returns (CacheMarkCharacterMailReadRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 删除角色的一封邮件。
  rpc CacheDeleteCharacterMail(CacheDeleteCharacterMailReq) returns (CacheDeleteCharacterMailRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 写入 accountVerifyToken。
  // 以 account 做 RingHash 分片，accountVerifyToken 使用一次性 SETNX 语义，未消费前不覆盖。
  rpc CacheSetAccountVerifyToken(CacheSetAccountVerifyTokenReq) returns (CacheSetAccountVerifyTokenRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_STRING
    };
  }

  // 验证并消费 accountVerifyToken。
  // 以 account 做 RingHash 分片，消费成功后确保账号存在并返回可信 aid。
  rpc CacheUseAccountVerifyToken(CacheUseAccountVerifyTokenReq) returns (CacheUseAccountVerifyTokenRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_STRING
    };
  }

  // 获取账号 cache accountSession。
  // 以 aid 做 RingHash 分片, 返回当前 cache accountSession 中的 gatewayKey/accountSession/loginTimestampMs/onlineKey。
  rpc CacheGetAccountSession(CacheGetAccountSessionReq) returns (CacheGetAccountSessionRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 按 expected_account_session 创建账号 cache accountSession。
  // 以 aid 做 RingHash 分片, expected_account_session 为空时要求当前 accountSession 不存在。
  rpc CacheBeginAccountSessionCAS(CacheBeginAccountSessionCASReq) returns (CacheBeginAccountSessionCASRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 按 expected_account_session 结束账号 cache accountSession。
  // 以 aid 做 RingHash 分片，仅在 expected_account_session 匹配时删除。
  rpc CacheEndAccountSessionCAS(CacheEndAccountSessionCASReq) returns (CacheEndAccountSessionCASRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }

  // 按 expected_account_session 刷新账号 cache accountSession TTL。
  // 以 aid 做 RingHash 分片，仅在 expected_account_session 匹配时刷新 TTL。
  rpc CacheRefreshAccountSessionCAS(CacheRefreshAccountSessionCASReq) returns (CacheRefreshAccountSessionCASRes) {
    option (proto.methodOpt) = {
      timeout : "3s"
      shardKeyFieldType: ShardKeyFieldType_UINT64
    };
  }
}

message CacheSetAccountRecordReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // aid, 账号唯一标识, 必须与 account_record.aid 一致
  account.AccountRecord account_record = 2; // 账号档案
}

message CacheSetAccountRecordRes {
}

message CacheGetAccountRecordReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // aid, 账号唯一标识
}

message CacheGetAccountRecordRes {
  account.AccountRecord account_record = 1; // 账号档案, 成功时有效, 表示 aid 对应的 AccountRecord。
}

message CacheGetCharacterMailboxReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // 邮箱所属账号 aid
  uint64 character_uuid = 2; // 必须属于 aid 的角色 UUID
}

message CacheGetCharacterMailboxRes {
  account.MailboxRecord mailbox_record = 1; // 清理过期邮件后的完整邮箱快照
}

message CacheAddSystemMailReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // 收件角色所属账号 aid
  uint64 character_uuid = 2; // 必须属于 aid 的角色 UUID
  string title = 3; // 系统邮件纯文本主题
  string content = 4; // 系统邮件纯文本正文
}

message CacheAddSystemMailRes {
  account.MailRecord mail_record = 1; // 已持久化的新系统邮件
}

message CacheMarkCharacterMailReadReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // 邮件所属账号 aid
  uint64 character_uuid = 2; // 必须属于 aid 的角色 UUID
  uint64 mail_uuid = 3; // 要标记为已读的邮件 UUID
}

message CacheMarkCharacterMailReadRes {
}

message CacheDeleteCharacterMailReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // 邮件所属账号 aid
  uint64 character_uuid = 2; // 必须属于 aid 的角色 UUID
  uint64 mail_uuid = 3; // 要删除的邮件 UUID
}

message CacheDeleteCharacterMailRes {
}

message CacheSetAccountVerifyTokenReq {
  string account = 1 [(proto.fieldOpt).shardKey = true]; // 账号
  string account_verify_token = 2; // 使用一次性 SETNX 语义, 未消费前不覆盖
  uint64 expire_second = 3; // 单位为秒
}

message CacheSetAccountVerifyTokenRes {
}

message CacheUseAccountVerifyTokenReq {
  string account = 1 [(proto.fieldOpt).shardKey = true]; // 账号
  string account_verify_token = 2; // accountVerifyToken, login 签发后由 cache 原子校验并消费
}

message CacheUseAccountVerifyTokenRes {
  uint64 aid = 1; // 表示 account 绑定或新创建的可信 aid
}

message CacheAccountSession {
  string gateway_key = 1; // gatewayKey, 用于定位当前 Gateway
  string account_session = 2; // accountSession, CAS 匹配的稳定身份字段
  int64 login_timestamp_ms = 3; // 登录时间戳, 单位毫秒
  string online_key = 4; // onlineKey, 用于定位当前 Online
}

message CacheGetAccountSessionReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // aid, 账号唯一标识
}

message CacheGetAccountSessionRes {
  CacheAccountSession session = 1; // 成功时有效, 包含 cache accountSession 全部字段
}

message CacheBeginAccountSessionCASReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // aid, 账号唯一标识
  /*
expected_account_session == ""
  -> 期望当前 Redis 里没有 account:{aid}:session 对应的 cache accountSession
  -> 如果 key 已存在, 返回 0, 不写入
  -> 如果 key 不存在, 写入新 accountSession, 设置 TTL, 返回 1

expected_account_session != ""
  -> 期望当前 Redis hash 里的 accountSession 字段等于 expectedAccountSession
  -> 如果不存在或不匹配, 返回 0, 不写入
  -> 如果匹配, 删除旧 hash, 写入新 records, 设置 TTL, 返回 1
*/
  string expected_account_session = 2; // 表示预期当前 account_session 必须匹配
  string gateway_key = 3; // gatewayKey, 用于定位当前 Gateway
  string account_session = 4; // accountSession, 新 cache accountSession 的稳定身份字段
  int64 login_timestamp_ms = 5; // 登录时间戳, 单位毫秒
  string online_key = 6; // onlineKey, 用于定位当前 Online
  uint64 expire_second = 7; // 单位为秒
}

message CacheBeginAccountSessionCASRes {
}

message CacheEndAccountSessionCASReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // aid, 账号唯一标识
  string expected_account_session = 2; // 用于 CAS 删除前匹配当前 accountSession
}

message CacheEndAccountSessionCASRes {
}

message CacheRefreshAccountSessionCASReq {
  uint64 aid = 1 [(proto.fieldOpt).shardKey = true]; // aid, 账号唯一标识
  string expected_account_session = 2; // 用于 CAS 续期前匹配当前 accountSession
  uint64 expire_second = 3; // 单位为秒
}

message CacheRefreshAccountSessionCASRes {
}
