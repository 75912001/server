syntax = "proto3";

package account;
option go_package = "server/proto/pb;pb";

import "asset.proto";
import "record.proto";
import "equipment.proto";
import "weapon.proto";
import "msg.item.proto";
import "msg.pet.proto";

// 消息范围 [0x001000, 0x001fff]

enum CharacterAction {
  CharacterAction_Unknow = 0;
  CharacterAction_Attack = 1;
  CharacterAction_Wave = 2;
  CharacterAction_Faint = 3;
  CharacterAction_Hurt = 4;
  CharacterAction_Defense = 5;
  CharacterAction_Sad = 6;
  CharacterAction_Angry = 7;
  CharacterAction_Sit = 8;
  CharacterAction_Stand = 9;
  CharacterAction_Throw = 10;
  CharacterAction_Nod = 11;
  CharacterAction_Walk = 12;
  CharacterAction_Happy = 13;
  CharacterAction_Max = 14;
}

message ElementalPoints // todo menglc 优化-移除, 扁平化
{
  uint32 earth = 1; // 地元素点数, 0-10
  uint32 water = 2; // 水元素点数, 0-10
  uint32 fire = 3; // 火元素点数, 0-10
  uint32 wind = 4; // 风元素点数, 0-10
}

// CharacterAttributePoints 保存角色四项基础属性点.
// 创建角色时四项总和必须为20; 重置时四项与剩余可加点按重置规则校验, 权威总点数不得超过1000.
message CharacterAttributePoints // todo menglc 优化-移除, 扁平化
{
  uint32 vitality = 1; // 体力点数
  uint32 strength = 2; // 腕力点数
  uint32 toughness = 3; // 耐力点数
  uint32 dexterity = 4; // 速度点数
}

// CharacterAttributeType 标识角色可消耗 available_point 提升的基础属性.
enum CharacterAttributeType {
  CharacterAttributeType_Unspecified = 0; // 未指定属性, proto3 enum 默认值
  CharacterAttributeType_Vitality = 1; // 体力
  CharacterAttributeType_Strength = 2; // 腕力
  CharacterAttributeType_Toughness = 3; // 耐力
  CharacterAttributeType_Dexterity = 4; // 速度
}

// CharacterProfession 定义角色职业, 数值与原版 PROFESSION_CLASS_TYPE 保持一致.
enum CharacterProfession {
  CharacterProfession_None = 0; // 无职业
  CharacterProfession_Fighter = 1; // 战士
  CharacterProfession_Wizard = 2; // 巫师
  CharacterProfession_Hunter = 3; // 猎人
}

enum CharacterLimit {
  CharacterLimit_Unspecified = 0; // 未指定角色限制, proto3 enum 默认值
  CharacterLimit_CreateAttributeTotalPoint = 20; // 创建角色时体力腕力耐力速度总点数
  CharacterLimit_MaxItemBagCount = 30; // 角色随身背包最多可容纳的道具种类和装备实例总数
  CharacterLimit_MagicPointMax = 100; // 角色每场战斗的初始魔法值和魔法值上限
  CharacterLimit_MaxDuelPoint = 100000000; // 角色决斗点(DP)持久化上限
}

// CharacterLuckState 保存角色持久化的基础运气及其最近一次LS日自动刷新时间.
// 装备修正和有效运气是运行期派生值, 不写入角色档案.
message CharacterLuckState {
  uint32 base_luck = 1; // 0仅表示首次登录尚未刷新; 正常持久化范围为1-5
  int64 last_refresh_timestamp_ms = 2; // 最近一次自动LS日刷新时间, 单位毫秒
}

// CharacterEffectiveAttribute 是角色基础属性叠加当前装备后的运行期派生快照, 不写入账号档案.
message CharacterEffectiveAttribute {
  uint64 character_uuid = 1; // 角色 UUID
  uint32 max_hp = 2; // 装备修正后的最大生命值
  uint32 attack = 3; // 装备修正后的攻击力
  int32 defense = 4; // 装备修正后的防御力, 原版最低为-100
  int32 agility = 5; // 装备修正后的敏捷, 原版最低为-100
  uint32 max_mp = 6; // 装备修正后的最大魔法值, 范围0-1000
  uint32 effective_luck = 10; // 装备修正后的有效运气, 范围1-5
  uint32 effective_charm = 11; // 装备修正后的有效魅力, 范围0-100
  int32 effective_avoid = 12; // 装备修正后的有效闪避
  int32 critical_modifier = 13; // 装备固化暴击修正合计, 保留原版配置值和量纲
  int32 poison_resistance_modifier = 20; // 毒抗性修正合计, 保留原版配置值和量纲
  int32 paralysis_resistance_modifier = 21; // 麻痹抗性修正合计, 保留原版配置值和量纲
  int32 sleep_resistance_modifier = 22; // 睡眠抗性修正合计, 保留原版配置值和量纲
  int32 stone_resistance_modifier = 23; // 石化抗性修正合计, 保留原版配置值和量纲
  int32 drunk_resistance_modifier = 24; // 酒醉抗性修正合计, 保留原版配置值和量纲
  int32 confusion_resistance_modifier = 25; // 混乱抗性修正合计, 保留原版配置值和量纲
  ElementalPoints elemental = 30; // 装备元素修正后的地水火风点数, 各项限制在0-10
  int32 other_damage_modifier = 31; // 原版额外伤害修正合计
  int32 other_defense_modifier = 32; // 原版额外防御修正合计
  CharacterWeaponType weapon_type = 40; // 当前实际武器类型, 未装备时为空手
}

// CharacterBaseRecord 表示不包含道具、扩展记录和宠物集合的角色基础权威快照.
message CharacterBaseRecord {
  uint64 uuid = 1; // 角色 UUID, 在所属 AccountRecord.aid 作用域内唯一
  string nick = 2; // 角色昵称
  uint64 asset_id = 3; // 角色资源 ID
  uint64 exp = 4; // 经验值
  uint32 earth = 5; // 角色地元素点数
  uint32 water = 6; // 角色水元素点数
  uint32 fire = 7; // 角色火元素点数
  uint32 wind = 8; // 角色风元素点数
  uint32 available_point = 9; // 角色可分配属性点
  uint32 vitality = 10; // 角色体力点数
  uint32 strength = 11; // 角色腕力点数
  uint32 toughness = 12; // 角色耐力点数
  uint32 dexterity = 13; // 角色速度点数
  int64 last_login_timestamp_ms = 14; // 角色最后登录时间戳, 单位毫秒
  int64 last_logout_timestamp_ms = 15; // 角色最后登出时间戳, 单位毫秒
  int64 create_timestamp_ms = 16; // 角色创建时间戳, 单位毫秒
  uint64 rebirth_count = 17; // 角色转生次数
  uint32 scene_id = 18; // 角色当前场景 ID
  CharacterLuckState luck_state = 19; // 角色基础运气和 LS 日自动刷新状态
  uint32 duel_point = 21; // 角色决斗点(DP)
  uint32 charm = 22; // 角色魅力
  uint32 scene_x = 23; // 角色在当前场景中的格坐标x
  uint32 scene_y = 24; // 角色在当前场景中的格坐标y
}

message CharacterRecord {
  CharacterBaseRecord base = 1; // 角色基础权威数据; 完整角色 key 为 AccountRecord.aid + base.uuid

  reserved 10, 11, 12;
  reserved "stone", "shell", "diamond";

  map<uint32, uint64> asset_count_map = 20; // 角色独立资产持有数量, key 仅允许 [3490000,3499999], value 为最终持有数量; 缺失等同于 0, 数量为 0 时不持久化
  ItemContainerRecord item_bag = 30; // 角色随身物品背包, 最多容纳 30 种道具或装备实例
  CharacterEquipmentRecord equipment = 40; // 角色当前穿戴装备; 新角色初始化为空消息, 未穿戴部位保持未设置
  //map<uint64, RecordPrimary> record_map = 1000; // 角色临时扩展记录表
  repeated PetRecord pet_record_list = 2000; // 角色当前随身携带宠物记录列表, 按携带顺序排列, 数量不超过 PetRecordLimit_MaxCarryCount
}

//0x001000#client->gateway#创建角色-请求
message CharacterCreateReq
{
  uint32 character_slot_index = 1; // 角色创建槽位索引, 从 0 开始; 该槽位已有有效角色时创建失败
  uint32 character_id = 2; // 角色资源 ID; 0 表示使用默认角色资源, 非 0 时必须是可创建玩家角色
  string character_nick = 3; // 角色昵称; 去除首尾空白后 1-12 个字符, 空字符串表示使用默认昵称
  ElementalPoints character_elemental = 4; // 角色地水火风元素点数; 必须提交且由 online 校验合法性
  CharacterAttributePoints character_attribute = 5; // 角色体力腕力耐力速度点数; 必须提交且由 online 校验合法性
}

//0x001001#gateway->client#创建角色-回复
message CharacterCreateRes
{
  CharacterRecord character_record = 1; // 新创建的完整角色档案
}

//0x004002#client->gateway#角色上线-请求
message CharacterOnlineReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号且尚未上线
}

//0x001003#gateway->client#角色上线-回复
message CharacterOnlineRes {
  uint64 character_uuid = 1; // 已上线的角色 UUID
  CharacterLuckState luck_state = 2; // 本次登录完成LS日刷新后的权威基础运气状态
  CharacterEffectiveAttribute effective_attribute = 3; // 角色上线后的完整有效属性快照
}

//0x001004#client->gateway#角色下线-请求
message CharacterOfflineReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号且当前已上线
}

//0x001005#gateway->client#角色下线-回复
message CharacterOfflineRes {
  uint64 character_uuid = 1; // 已下线的角色 UUID
}

//0x001006#client->gateway#进入场景-请求
message CharacterSceneEnterReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号且当前已上线
  uint32 scene_id = 2; // 目标场景 ID, 必须存在于 scene.yaml
  uint32 scene_x = 3; // 目标场景落点格坐标x
  uint32 scene_y = 4; // 目标场景落点格坐标y
}

//0x001007#gateway->client#进入场景-回复
message CharacterSceneEnterRes {
  uint64 character_uuid = 1; // 已进入场景的角色 UUID
  uint32 scene_id = 2; // 已进入的场景 ID
  int64 server_timestamp_ms = 3; // 服务端回复时间戳, 单位毫秒
  uint32 scene_x = 4; // 服务端接受的场景格坐标x
  uint32 scene_y = 5; // 服务端接受的场景格坐标y
}

//0x001008#gateway->client#角色基础数据变化-通知
message CharacterBaseChangedNotify {
  CharacterBaseRecord character_base_record = 1; // cache持久化成功后的角色基础权威快照
  CharacterEffectiveAttribute effective_attribute = 2; // 基础数据变化后的完整有效属性快照
}

//0x001009#client->gateway#修改角色设置-请求
message CharacterSettingSetReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号
  bool team_enabled = 2; // 是否允许组队
  bool duel_enabled = 3; // 是否允许决斗
}

//0x00100A#gateway->client#修改角色设置-回复
message CharacterSettingSetRes {
  uint64 character_uuid = 1; // 已修改设置的角色 UUID
  bool team_enabled = 2; // 当前登录会话中是否允许组队
  bool duel_enabled = 3; // 当前登录会话中是否允许决斗
}

//0x00100B#client->gateway#增加角色基础属性-请求
message CharacterAttributeAddReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号、已上线且不在战斗中
  CharacterAttributeType attribute_type = 2; // 每次只允许提升一个可分配基础属性
}

//0x00100C#gateway->client#增加角色基础属性-回复
message CharacterAttributeAddRes {
  uint64 character_uuid = 1; // 已增加基础属性的角色 UUID
  CharacterAttributeType attribute_type = 2; // 本次实际增加的基础属性
}

//0x00100D#client->gateway#重置角色基础属性-请求
message CharacterAttributeResetReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号、已上线且不在战斗中
  CharacterAttributePoints character_attribute = 2; // 客户端在重置弹窗中确认的四项最终属性
  uint32 available_point = 3; // 分配完成后的剩余可加点
}

//0x00100E#gateway->client#重置角色基础属性-回复
message CharacterAttributeResetRes {
  uint64 character_uuid = 1; // 已重置基础属性的角色 UUID
}

//0x00100F#client->gateway#替换角色装备-请求
message CharacterEquipmentReplaceReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号、已上线且不在战斗中
  EquipmentType equipment_type = 2; // 目标装备部位; 当前仅支持武器
  uint64 equipment_uuid = 3; // 背包装备 UUID; 0 表示卸下目标部位装备
}

//0x001010#gateway->client#替换角色装备-回复
message CharacterEquipmentReplaceRes {
  uint64 character_uuid = 1; // 已完成换装的角色 UUID
  EquipmentType equipment_type = 2; // 本次实际替换的装备部位
  ItemContainerRecord item_bag = 10; // 换装成功后的完整随身背包
  CharacterEquipmentRecord equipment = 11; // 换装成功后的完整穿戴装备
  CharacterEffectiveAttribute effective_attribute = 12; // 换装成功后的完整有效属性快照
}

// CharacterSceneCoordinate 是移动请求中的一个完整地图格坐标.
message CharacterSceneCoordinate {
  uint32 x = 1; // 地图格坐标x
  uint32 y = 2; // 地图格坐标y
}

// SceneCharacterInfo 是进入视野时下发的一名角色完整地图表现快照.
message SceneCharacterInfo {
  uint64 aid = 1; // 角色所属账号 ID
  uint64 character_uuid = 2; // 角色 UUID, 在所属账号内唯一
  uint64 asset_id = 3; // 角色视觉资源 ID
  string nick = 4; // 角色昵称
  CharacterWeaponType weapon_type = 5; // 当前武器类型
  uint32 scene_x = 6; // 当前权威地图格坐标x
  uint32 scene_y = 7; // 当前权威地图格坐标y
  AssetDirection direction = 8; // 当前8方向
  uint32 move_end_x = 9; // 当前移动序列的权威终点x, 静止时等于scene_x
  uint32 move_end_y = 10; // 当前移动序列的权威终点y, 静止时等于scene_y
}

//0x001011#client->gateway#提交角色场景移动序列-请求
message CharacterSceneMoveReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号且已上线
  uint32 start_x = 2; // 客户端计算路径时的完整格起点x
  uint32 start_y = 3; // 客户端计算路径时的完整格起点y
  repeated CharacterSceneCoordinate step_list = 4; // 从起点开始的相邻格序列, 最多32格; 空数组表示停止
}

//0x001012#gateway->client#角色场景移动-通知
message CharacterSceneMoveNotify {
  uint64 target_character_uuid = 1; // 本通知对应的接收角色 UUID
  uint64 aid = 2; // 移动角色所属账号 ID
  uint64 character_uuid = 3; // 移动角色 UUID
  uint32 current_x = 4; // 服务端当前权威格坐标x
  uint32 current_y = 5; // 服务端当前权威格坐标y
  uint32 move_end_x = 6; // 服务端校验和阻挡截断后的终点x
  uint32 move_end_y = 7; // 服务端校验和阻挡截断后的终点y
  AssetDirection direction = 8; // 当前移动方向或阻挡后保留的朝向
}

//0x001013#client->gateway#角色原地转向-请求
message CharacterSceneTurnReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号且已上线
  AssetDirection direction = 2; // 转向后的8方向
}

//0x001014#gateway->client#附近角色原地转向-通知
message CharacterSceneTurnNotify {
  uint64 target_character_uuid = 1; // 本通知对应的接收角色 UUID
  uint64 aid = 2; // 转向角色所属账号 ID
  uint64 character_uuid = 3; // 转向角色 UUID
  AssetDirection direction = 4; // 转向后的8方向
}

//0x001015#gateway->client#当前视野角色快照-通知
message CharacterSceneSnapshotNotify {
  uint64 target_character_uuid = 1; // 本通知对应的接收角色 UUID
  repeated SceneCharacterInfo character_list = 2; // 当前23x23视野内的其他角色
}

//0x001016#gateway->client#角色进入当前视野-通知
message CharacterSceneVisibleEnterNotify {
  uint64 target_character_uuid = 1; // 本通知对应的接收角色 UUID
  SceneCharacterInfo character = 2; // 新进入视野角色的完整地图表现快照
}

//0x001017#gateway->client#角色离开当前视野-通知
message CharacterSceneVisibleLeaveNotify {
  uint64 target_character_uuid = 1; // 本通知对应的接收角色 UUID
  uint64 aid = 2; // 离开视野角色所属账号 ID
  uint64 character_uuid = 3; // 离开视野角色 UUID
}
