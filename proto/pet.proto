syntax = "proto3";

package account;
option go_package = "server/proto/pb;pb";

import "record.proto";

enum PetAction {
  PetAction_Unknow = 0;
  PetAction_Attack = 1;
  PetAction_Faint = 2;
  PetAction_Hurt = 3;
  PetAction_Defense = 4;
  PetAction_Stand = 5;
  PetAction_Walk = 6;
  PetAction_AttackShort = 7;
  PetAction_Max = 8;
}

// PetRarity 表示宠物稀有度, 主要来自宠物资源配置 pet[].rarity.
// 业务有效值为 Common 到 Mythic; Unknow 仅作为 proto3 默认值和非法/未初始化占位, Max 仅作为枚举边界占位.
enum PetRarity {
  PetRarity_Unknow = 0; // 未知稀有度, proto3 默认值; 正常业务配置和已创建宠物不应使用; 客户端显示色: 灰色 #9AA0A6
  PetRarity_Common = 1; // 普通等级, 基础宠物资源分层; 客户端显示色: 白色 #F2F2F2
  PetRarity_Rare = 2; // 稀有等级, 高于普通的宠物资源分层; 客户端显示色: 蓝色 #45A7FF
  PetRarity_Epic = 3; // 史诗等级, 高于稀有的宠物资源分层; 客户端显示色: 紫色 #B56CFF
  PetRarity_Legendary = 4; // 传说等级, 高于史诗的宠物资源分层; 客户端显示色: 橙色 #FF9F43
  PetRarity_Mythic = 5; // 神话等级, 当前最高业务稀有度; 客户端显示色: 红色 #FF4A6E
  PetRarity_Max = 6; // 稀有度枚举边界, 用于范围判断或扩展占位; 不作为业务值存储或显示
}

// PetGrade 表示宠物品阶, 用于描述宠物养成或评级体系中的等级分层.
// 业务有效值为 Common 到 Mythic; Unknow 仅作为 proto3 默认值和非法/未初始化占位, Max 仅作为枚举边界占位.
enum PetGrade {
  PetGrade_Unknow = 0; // 未知品阶, proto3 默认值; 正常业务配置和已创建宠物不应使用; 客户端显示色: 灰色 #9AA0A6
  PetGrade_Common = 1; // 普通品阶, 基础宠物品阶分层; 客户端显示色: 白色 #F2F2F2
  PetGrade_Rare = 2; // 稀有品阶, 高于普通的宠物品阶分层; 客户端显示色: 蓝色 #45A7FF
  PetGrade_Epic = 3; // 史诗品阶, 高于稀有的宠物品阶分层; 客户端显示色: 紫色 #B56CFF
  PetGrade_Legendary = 4; // 传说品阶, 高于史诗的宠物品阶分层; 客户端显示色: 橙色 #FF9F43
  PetGrade_Mythic = 5; // 神话品阶, 当前最高业务品阶; 客户端显示色: 红色 #FF4A6E
  PetGrade_Max = 6; // 品阶枚举边界, 用于范围判断或扩展占位; 不作为业务值存储或显示
}

enum PetRecordLimit {
  PetRecordLimit_Unspecified = 0; // 未指定宠物档案限制, proto3 enum 默认值
  PetRecordLimit_MaxCarryCount = 5; // 单个角色最多可随身携带宠物数量
}

enum PetCarryStatus {
  PetCarryStatus_Unknow = 0; // 未指定携带状态, 旧档案或非法默认值
  PetCarryStatus_Rest = 1; // 休息, 不可参与战斗; 仓库内宠物固定为该状态; 客户端状态色: 白色 #FFFFFF
  PetCarryStatus_Battle = 2; // 战斗, 角色战斗首发宠物; 单个角色最多一只; 客户端状态色: 红色 #FF4A4A
  PetCarryStatus_Wait = 3; // 等待, 战斗中可以替换上场; 客户端状态色: 蓝色 #45A7FF
  PetCarryStatus_Mount = 4; // 骑乘, 角色当前骑乘宠物; 单个角色最多一只, 需要骑乘权限且忠诚度 100%; 客户端状态色: 黄色 #FFD84A
  PetCarryStatus_Max = 5;
}

message PetRecord {
  uint64 uuid = 1; // 宠物 UUID, 在所属 AccountRecord.aid 作用域内唯一
  string nick = 2; // 用户自定义宠物昵称; 空字符串表示未设置, 客户端显示宠物配置名称
  PetCarryStatus carry_status = 3; // 宠物携带状态; 只有角色随身携带时参与战斗/骑乘语义, 仓库内宠物固定为 Rest
  PetGrade grade = 4; // 宠物品阶, 决定创建时 SavedBase 成长偏移; 默认赠送宠物由 online 指定为 Mythic
  uint64 exp = 5; // 经验值, 用于升级或养成
  uint32 loyalty = 6; // 宠物忠诚度; 创建默认值当前为 100
  uint32 saved_base_vitality = 7; // 宠物实例基础体力成长值; 创建时由配置 growth.baseVital 叠加 PetGrade 品阶偏移生成, 后续升级固定使用
  uint32 saved_base_strength = 8; // 宠物实例基础腕力成长值; 创建时由配置 growth.baseStr 叠加 PetGrade 品阶偏移生成, 后续升级固定使用
  uint32 saved_base_toughness = 9; // 宠物实例基础耐力成长值; 创建时由配置 growth.baseTough 叠加 PetGrade 品阶偏移生成, 后续升级固定使用
  uint32 saved_base_dexterity = 10; // 宠物实例基础速度成长值; 创建时由配置 growth.baseDex 叠加 PetGrade 品阶偏移生成, 后续升级固定使用
  uint32 raw_vitality = 11; // 宠物当前原始体力值; 创建和升级时累加生成, 战斗运行期 HP 等派生属性由该值参与换算
  uint32 raw_strength = 12; // 宠物当前原始腕力值; 创建和升级时累加生成, 战斗运行期攻击等派生属性由该值参与换算
  uint32 raw_toughness = 13; // 宠物当前原始耐力值; 创建和升级时累加生成, 战斗运行期防御等派生属性由该值参与换算
  uint32 raw_dexterity = 14; // 宠物当前原始速度值; 创建和升级时累加生成, 战斗运行期敏捷等派生属性由该值参与换算
  int64 create_timestamp_ms = 15; // 宠物创建时间戳, 单位毫秒
  uint64 rebirth_count = 16; // 宠物转生次数
  uint64 asset_id = 17; // 宠物资产 ID, 对应宠物配置 ID
  map<uint32, uint64> asset_record_base_map = 20; // 宠物基础数值记录
  uint32 growth_baseline_hp = 21; // 成长率基准 HP 上限; 无 1 级记录时使用首次获得时的当前值
  uint32 growth_baseline_attack = 22; // 成长率基准攻击力; 无 1 级记录时使用首次获得时的当前值
  uint32 growth_baseline_defense = 23; // 成长率基准防御力; 无 1 级记录时使用首次获得时的当前值
  uint32 growth_baseline_agility = 24; // 成长率基准敏捷; 无 1 级记录时使用首次获得时的当前值
  uint32 growth_baseline_level = 25; // 成长率基准对应等级; 1 表示真实 1 级记录, 高等级首次获得时记录当前等级
  map<uint64, RecordPrimary> record_map = 1000; // 宠物扩展记录表
}
