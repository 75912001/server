syntax = "proto3";

package gateway;
option go_package = "server/proto/pb;pb";
import "options.proto";

service GatewayService {
  option (proto.serviceOpt) = {
    timeout: "3s"
    loadBalancePolicy: LoadBalancePolicy_Direct
  };

  // 踢旧账号会话。
  // 调用方：新 Gateway 顶号时直连旧 Gateway 发起。
  // 作用: 旧 Gateway 断开匹配连接, 通知旧 Online 下线, 并按 expected_account_session 删除 cache accountSession。
  rpc GatewayKickAccountSession(GatewayKickAccountSessionReq) returns (GatewayKickAccountSessionRes) {
    option (proto.methodOpt) = {
      timeout: "10s"
    };
  }

}

message GatewayKickAccountSessionReq {
  uint64 aid = 1;                                    // 已登录账号 aid; Gateway 先从 byAID 查找, 再校验 accountSession
  uint32 reason = 2;                                  // 离线原因码
  string msg = 3;                                     // 离线说明
  string account_session = 4;                         // accountSession, 一次登录生成的固定连接身份, 只断开匹配的连接
}

message GatewayKickAccountSessionRes {
}
