syntax = "proto3";

package account;
option go_package = "server/proto/pb;pb";

import "asset.proto";

// 消息范围 [0x001019, 0x00101B]

message CharacterTeamTarget {
  uint64 aid = 1; // 目标角色所属账号 ID
  uint64 character_uuid = 2; // 目标角色 UUID, 与 aid 共同构成唯一标识
}

message CharacterTeamMember {
  uint64 aid = 1; // 成员所属账号 ID
  uint64 character_uuid = 2; // 成员角色 UUID
  string nick = 3; // 成员当前昵称
  bool leader = 4; // 是否为队长; 权威列表同时保证队长位于第一项
}

message CharacterTeamSnapshot {
  repeated CharacterTeamMember member_list = 1; // 当前完整成员列表, 未组队时为空, 最多5人
}

message CharacterTeamJoinReq {
  CharacterTeamTarget target = 1; // 目标队长, 必须提供完整 aid + character_uuid
}

message CharacterTeamJoinRes {}

message CharacterTeamLeaveReq {}

message CharacterTeamLeaveRes {}

message CharacterTeamDisbandReq {}

message CharacterTeamDisbandRes {}

message CharacterTeamKickReq {
  CharacterTeamTarget target = 1; // 被踢成员, 必须提供完整 aid + character_uuid
}

message CharacterTeamKickRes {}

//0x001019#client->gateway#角色队伍操作-请求
message CharacterTeamOperationReq {
  uint64 character_uuid = 1; // 发起操作的当前账号角色 UUID

  oneof operation {
    CharacterTeamJoinReq join = 10;
    CharacterTeamLeaveReq leave = 11;
    CharacterTeamDisbandReq disband = 12;
    CharacterTeamKickReq kick = 13;
  }
}

//0x00101A#gateway->client#角色队伍操作-回复
message CharacterTeamOperationRes {
  uint64 character_uuid = 1; // 发起操作的角色 UUID

  oneof operation {
    CharacterTeamJoinRes join = 10;
    CharacterTeamLeaveRes leave = 11;
    CharacterTeamDisbandRes disband = 12;
    CharacterTeamKickRes kick = 13;
  }
}

//0x00101B#gateway->client#角色队伍变化-通知
message CharacterTeamChangedNotify {
  uint64 target_character_uuid = 1; // 本通知对应的本地角色 UUID
  CharacterTeamSnapshot snapshot = 2; // 变化后的完整权威快照; 空列表表示当前无队伍
  uint32 current_x = 3; // 本地角色应用本次队伍变化后的权威地图格坐标x
  uint32 current_y = 4; // 本地角色应用本次队伍变化后的权威地图格坐标y
  AssetDirection direction = 5; // 本地角色应用本次队伍变化后的权威方向
}
