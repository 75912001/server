syntax = "proto3";

package user;
option go_package = "server/proto/pb;pb";

message RecordPrimary {
  uint64 primary_id = 1;
  map<uint64, RecordSecondary> secondary_record_map = 2;
}

message RecordSecondary {
  uint64 secondary_id = 1;
  int64 timestamp_ms = 2;
  repeated uint64 data = 3;
  repeated string str_data = 4;
}
