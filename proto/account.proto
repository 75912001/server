syntax = "proto3";

package account;
option go_package = "server/proto/pb;pb";
import "account.record.proto";
import "character.proto";
import "pet.proto";

// ===================================================================
// 消息体定义 — 客户端 ↔ Gateway TCP 协议层
// ===================================================================

//0x000001#client->gateway#账号登录验证-请求
message AccountVerifyReq
{
  uint64 aid = 1; // aid, 账号唯一标识, 由 login 服务下发, 客户端登录 Gateway 时携带
  string connect_ticket = 2; // connectTicket, login 签发的短期连接票据, 客户端登录 Gateway 时携带
}

//0x000002#gateway->client#账号登录验证-回复
message AccountVerifyRes
{
  int64  server_timestamp_ms = 1;   // 服务器当前时间戳，单位毫秒（用于客户端对时）
  string heartbeat_session = 2; // heartbeatSession, 客户端后续心跳携带的心跳认证凭证
}

//0x000003#client->gateway#账号主动下线-请求
message AccountOfflineReq
{
  uint32 reason = 1;   // 1=账号主动离线
}

//0x000011#client->gateway#心跳-请求
message AccountHeartbeatReq {
  string last_heartbeat_session = 1;   // 上次 Gateway 下发的 heartbeatSession
}

//0x0000012#gateway->client#心跳-回复
message AccountHeartbeatRes {
  int64 server_timestamp_ms  = 1;   // 服务器时间毫秒
  string next_heartbeat_session = 2;   // 客户端下次心跳必须使用的 heartbeatSession
}

//0x000013#client->gateway#请求账号档案-请求
message AccountRecordReq {
}

//0x000014#gateway->client#请求账号档案-回复
message AccountRecordRes {
  AccountRecord account_record = 1; // 账号档案
}

//0x000015#client->gateway#创建角色-请求
message CharacterCreateReq
{
  uint32 character_slot_index = 1; // 角色创建槽位索引, 从 0 开始; 该槽位已有有效角色时创建失败
  uint32 character_id = 2; // 角色资源 ID; 0 表示使用默认角色资源, 非 0 时必须是可创建玩家角色
  string character_nick = 3; // 角色昵称; 去除首尾空白后 1-12 个字符, 空字符串表示使用默认昵称
  ElementalPoints character_elemental = 4; // 角色地水火风元素点数; 必须提交且由 online 校验合法性
  CharacterAttributePoints character_attribute = 5; // 角色体力腕力耐力速度点数; 必须提交且由 online 校验合法性
}

//0x000016#gateway->client#创建角色-回复
message CharacterCreateRes
{
  AccountRecord account_record = 1; // 创建角色后的账号档案
}

//0x000017#client->gateway#机器人压测-请求
message RobotPingReq
{
  uint64 seq = 1; // 客户端递增序号
  int64 client_timestamp_ms = 2; // 客户端发送时间戳，单位毫秒
  string payload = 3; // 压测透传数据
}

//0x000018#gateway->client#机器人压测-回复
message RobotPingRes
{
  uint64 seq = 1; // 对应请求中的客户端递增序号
  int64 client_timestamp_ms = 2; // 对应请求中的客户端发送时间戳，单位毫秒
  int64 server_timestamp_ms = 3; // 服务端回复时间戳，单位毫秒
  string payload = 4; // 对应请求中的压测透传数据
}

//0x000019#client->gateway#角色上线-请求
message CharacterOnlineReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号且尚未上线
}

//0x00001a#gateway->client#角色上线-回复
message CharacterOnlineRes {
  uint64 character_uuid = 1; // 已上线的角色 UUID
  CharacterLuckState luck_state = 2; // 本次登录完成LS日刷新后的权威基础运气状态
}

//0x000021#client->gateway#角色下线-请求
message CharacterOfflineReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号且当前已上线
}

//0x000022#gateway->client#角色下线-回复
message CharacterOfflineRes {
  uint64 character_uuid = 1; // 已下线的角色 UUID
}

//0x000023#client->gateway#进入场景-请求
message SceneEnterReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号且当前已上线
  uint32 scene_id = 2; // 目标场景 ID, 必须存在于 scene.yaml
}

//0x000024#gateway->client#进入场景-回复
message SceneEnterRes {
  uint64 character_uuid = 1; // 已进入场景的角色 UUID
  uint32 scene_id = 2; // 已进入的场景 ID
  int64 server_timestamp_ms = 3; // 服务端回复时间戳, 单位毫秒
}

// PetCarryStatusChange 表示服务端已持久化的一项宠物携带状态变更.
message PetCarryStatusChange {
  uint64 pet_uuid = 1; // 宠物 UUID, 必须属于响应 character_uuid 对应的随身宠物
  PetCarryStatus carry_status = 2; // 服务端最终确认的携带状态
}

//0x000025#client->gateway#修改随身宠物状态-请求
message PetCarryStatusSetReq {
  uint64 character_uuid = 1; // 角色 UUID, 必须属于当前账号
  PetCarryStatusChange change = 2; // 目标随身宠物状态变更
}

//0x000026#gateway->client#修改随身宠物状态-回复
message PetCarryStatusSetRes {
  uint64 character_uuid = 1; // 已修改随身宠物状态的角色 UUID
  repeated PetCarryStatusChange change_list = 2; // 本次原子操作实际修改的状态列表, 包含被替换的战斗或骑乘宠物
}

//0x000027#client->gateway#使用角色道具-请求
message ItemUseReq {
  uint64 character_uuid = 1; // 道具所属角色 UUID
  uint32 item_id = 2; // 使用的道具资源 ID
  uint64 target_pet_uuid = 3; // 宠物目标 UUID; 角色目标道具必须为0
}

//0x000028#gateway->client#使用角色道具-回复
message ItemUseRes {
  uint64 character_uuid = 1; // 道具所属角色 UUID
  uint32 item_id = 2; // 已使用的道具资源 ID
  uint64 target_pet_uuid = 3; // 实际作用的宠物 UUID; 角色目标为0
}

//0x00002c#gateway->client#角色基础数据变化-通知
message CharacterBaseChangedNotify {
  CharacterBaseRecord character_base_record = 1; // cache持久化成功后的角色基础权威快照
}

//0x00002e#gateway->client#角色随身宠物变化-通知
message CharacterPetChangedNotify {
  uint64 character_uuid = 1; // 宠物所属角色 UUID
  repeated PetRecord pet_record_list = 2; // 每项为变化后的完整随身宠物记录
}

//0x000030#gateway->client#角色道具变化-通知
message CharacterItemChangedNotify {
  uint64 character_uuid = 1; // 道具所属角色 UUID
  map<uint32, uint64> item_count_map = 2; // 变化道具的最终数量, 0 表示已耗尽
}

// GMItemAddCommand 表示给发起命令的角色自身增加道具.
message GMItemAddCommand {
  uint32 item_id = 1; // 道具资源 ID, 必须存在于 item.yaml
  uint64 count = 2; // 增加数量, 必须大于 0 且增加后不超过道具堆叠上限
}

// GMItemAddResult 表示服务端已持久化的道具增加结果.
message GMItemAddResult {
  uint32 item_id = 1; // 已增加的道具资源 ID
  uint64 added_count = 2; // 本次实际增加数量
  uint64 current_count = 3; // 增加后的角色持有数量
}

// GMPetAddCommand 表示给发起命令的角色自身增加一只 1 级随身宠物.
message GMPetAddCommand {
  uint32 pet_id = 1; // 宠物资源 ID, 必须存在于 pet.yaml
  PetGrade pet_grade = 2; // 宠物品阶, 只允许 Common 到 Mythic
}

// GMPetAddResult 表示服务端已持久化的随身宠物增加结果.
message GMPetAddResult {
  uint64 pet_uuid = 1; // 新宠物的账号级唯一 UUID
  uint32 pet_id = 2; // 已增加的宠物资源 ID
  PetGrade pet_grade = 3; // 已增加宠物的品阶
}

//0x000031#client->gateway#执行GM命令-请求
message GMCommandReq {
  uint64 character_uuid = 1; // 发起命令并接收结果的当前账号在线角色 UUID
  oneof command {
    GMItemAddCommand item_add = 10; // 对应客户端文本命令 gm item add <id> <cnt>
    GMPetAddCommand pet_add = 11; // 对应客户端文本命令 gm pet add <petid> <petGrade>
  }
}

//0x000032#gateway->client#执行GM命令-回复
message GMCommandRes {
  uint64 character_uuid = 1; // 已执行命令的角色 UUID
  oneof result {
    GMItemAddResult item_add = 10; // 已持久化的道具增加结果
    GMPetAddResult pet_add = 11; // 已持久化的随身宠物增加结果
  }
}

//0x000033#client->gateway#将随身宠物存入仓库-请求
message PetWarehouseDepositReq {
  uint64 character_uuid = 1; // 宠物当前所属角色 UUID
  uint64 pet_uuid = 2; // 需要从角色随身列表移入账号宠物仓库的宠物 UUID
}

//0x000034#gateway->client#将随身宠物存入仓库-回复
message PetWarehouseDepositRes {
  uint64 character_uuid = 1; // 宠物原所属角色 UUID
  PetRecord pet_record = 2; // 已持久化到账号宠物仓库且状态为 Rest 的完整宠物记录
}

//0x000035#client->gateway#将仓库宠物取出-请求
message PetWarehouseWithdrawReq {
  uint64 character_uuid = 1; // 接收宠物的目标角色 UUID
  uint64 pet_uuid = 2; // 需要从账号宠物仓库移入角色随身列表的宠物 UUID
}

//0x000036#gateway->client#将仓库宠物取出-回复
message PetWarehouseWithdrawRes {
  uint64 character_uuid = 1; // 接收宠物的目标角色 UUID
  PetRecord pet_record = 2; // 已持久化到角色随身列表且状态为 Wait 的完整宠物记录
}

//0x000037#client->gateway#修改随身宠物昵称-请求
message PetNickSetReq {
  uint64 character_uuid = 1; // 宠物所属角色 UUID
  uint64 pet_uuid = 2; // 需要修改昵称的随身宠物 UUID
  string nick = 3; // 去除首尾空白后的自定义昵称; 空字符串表示清除昵称并恢复显示配置名称
}

//0x000038#gateway->client#修改随身宠物昵称-回复
message PetNickSetRes {
  uint64 character_uuid = 1; // 宠物所属角色 UUID
  PetRecord pet_record = 2; // 已持久化昵称的完整随身宠物记录
}
