syntax = "proto3";

package user;
option go_package = "server/proto/pb;pb";
import "account.record.proto";

// ===================================================================
// 消息体定义 — 客户端 ↔ Gateway TCP 协议层
// ===================================================================

//0x000001#client->gateway#登录验证-请求
message UserVerifyReq
{
  uint64 uid = 1; // uid, 用户唯一标识, 由 login 服务下发, 客户端登录 Gateway 时携带
  string connect_ticket = 2; // connectTicket, login 签发的短期连接票据, 客户端登录 Gateway 时携带
}

//0x000002#gateway->client#登录验证-回复
message UserVerifyRes
{
  int64  server_timestamp_ms = 1;   // 服务器当前时间戳，单位毫秒（用于客户端对时）
  string heartbeat_session = 2; // heartbeatSession, 客户端后续心跳携带的心跳认证凭证
}

//0x000003#client->gateway#主动下线-请求
message UserOfflineReq
{
  uint32 reason = 1;   // 1=用户主动离线
}

//0x00000A#client->gateway#心跳-请求
message UserHeartbeatReq {
  string last_heartbeat_session = 1;   // 上次 Gateway 下发的 heartbeatSession
}

//0x00000B#gateway->client#心跳-回复
message UserHeartbeatRes {
  int64 server_timestamp_ms  = 1;   // 服务器时间毫秒
  string next_heartbeat_session = 2;   // 客户端下次心跳必须使用的 heartbeatSession
}

//0x00000C#client->gateway#请求账号档案-请求
message AccountRecordReq {
}

//0x00000D#gateway->client#请求账号档案-回复
message AccountRecordRes {
  AccountRecord account_record = 1; // 账号档案
}

//0x00000E#client->gateway#完成账号档案创建-请求
message AccountCreateReq
{
  uint32 character_slot_index = 1; // 角色创建槽位索引, 从 0 开始; 该槽位已有有效角色时创建失败
}

//0x00000F#gateway->client#完成账号档案创建-回复
message AccountCreateRes
{
  AccountRecord account_record = 1; // 完成账号档案创建后的账号档案
}

//0x000010#client->gateway#机器人压测-请求
message RobotPingReq
{
  uint64 seq = 1; // 客户端递增序号
  int64 client_timestamp_ms = 2; // 客户端发送时间戳，单位毫秒
  string payload = 3; // 压测透传数据
}

//0x000011#gateway->client#机器人压测-回复
message RobotPingRes
{
  uint64 seq = 1; // 对应请求中的客户端递增序号
  int64 client_timestamp_ms = 2; // 对应请求中的客户端发送时间戳，单位毫秒
  int64 server_timestamp_ms = 3; // 服务端回复时间戳，单位毫秒
  string payload = 4; // 对应请求中的压测透传数据
}
